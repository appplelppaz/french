<script>
/* assets/js/app.js */
/* app.js — シェルの制御（ルーティング、目次、章の読み込み、検索、テーマ）
 *
 * 章の原稿は content/chNN.js に置き、それぞれが FR.chapter({...}) で自己登録する。
 * fetch ではなく <script> タグで読むので、http:// でも file:// でも同じように動く。
 * （fetch だと file:// では CORS で失敗し、ローカルで開いた瞬間に壊れてしまう）
 */
(function (global) {
  'use strict';

  var FR = global.FR = global.FR || {};
  var doc = global.document;

  var chapters = Object.create(null);
  var pending = Object.create(null);
  var current = null;
  var observer = null;

  function el(tag, cls, text) {
    var n = doc.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function byId(id) { return doc.getElementById(id); }

  function tocEntry(id) {
    for (var i = 0; i < FR.toc.length; i++) if (FR.toc[i].id === id) return FR.toc[i];
    return null;
  }

  /* ==================== 章の登録と読み込み ==================== */

  /** content/chNN.js から呼ばれる */
  FR.chapter = function (ch) {
    chapters[ch.id] = ch;
    var p = pending[ch.id];
    if (p) { p.forEach(function (fn) { fn(ch); }); delete pending[ch.id]; }
  };

  /** 1ファイル版では全章が同梱済みなので、章を取りに行かない */
  var bundled = doc.body && doc.body.dataset && doc.body.dataset.bundled === '1';

  function loadChapter(id) {
    return new Promise(function (resolve, reject) {
      if (chapters[id]) return resolve(chapters[id]);

      if (bundled) {
        return reject(new Error('この章はこのファイルに含まれていません: ' + id));
      }

      if (pending[id]) { pending[id].push(resolve); return; }
      pending[id] = [resolve];

      var s = doc.createElement('script');
      s.src = 'content/' + id + '.js';
      s.async = false;
      s.onerror = function () {
        delete pending[id];
        reject(new Error('章を読み込めませんでした: ' + id));
      };
      s.onload = function () {
        // 読み込めたのに登録が無い＝原稿側の書き損じ
        if (!chapters[id] && pending[id]) {
          delete pending[id];
          reject(new Error('章の中身が登録されませんでした: ' + id));
        }
      };
      doc.head.appendChild(s);
    });
  }

  function loadAllChapters() {
    return Promise.all(FR.toc.map(function (t) {
      return loadChapter(t.id).catch(function () { return null; });
    }));
  }

  /* ==================== サイドバー目次 ==================== */

  function buildToc() {
    var list = byId('toc');
    list.textContent = '';

    var parts = {};
    (FR.tocParts || []).forEach(function (p) { parts[p.before] = p.label; });

    FR.toc.forEach(function (t) {
      if (parts[t.id]) {
        var head = el('li', 'toc-part', parts[t.id]);
        head.setAttribute('role', 'presentation');
        list.appendChild(head);
      }

      var li = el('li', t.branch ? 'sub' : '');
      var a = el('a');
      a.href = '#/' + t.id;
      a.dataset.chapter = t.id;

      a.appendChild(el('span', 'no', t.no));
      a.appendChild(el('span', 'ttl', t.title));
      var done = el('span', 'done', FR.store.progress.isDone(t.id) ? '✓' : '');
      done.dataset.done = t.id;
      a.appendChild(done);

      li.appendChild(a);
      list.appendChild(li);
    });

    updateProgressPill();
  }

  function updateProgressPill() {
    var done = FR.store.progress.count();
    byId('progress-pill').textContent = done + ' / ' + FR.toc.length;
  }

  function highlightToc(id) {
    doc.querySelectorAll('#toc a').forEach(function (a) {
      a.classList.toggle('active', a.dataset.chapter === id);
    });
  }

  function refreshDoneMarks() {
    doc.querySelectorAll('[data-done]').forEach(function (n) {
      n.textContent = FR.store.progress.isDone(n.dataset.done) ? '✓' : '';
    });
    updateProgressPill();
  }

  /* ==================== 章内目次 ==================== */

  function buildMiniToc(headings) {
    var host = byId('minitoc');
    host.textContent = '';
    if (observer) { observer.disconnect(); observer = null; }
    if (!headings || headings.length < 2) return;

    host.appendChild(el('div', 'minitoc-title', 'この章の内容'));
    headings.forEach(function (h) {
      if (h.level > 3) return;
      var a = el('a', h.level === 3 ? 'lv3' : '', h.text);
      a.href = '#' + h.id;
      a.dataset.target = h.id;
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var t = byId(h.id);
        if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' });
      });
      host.appendChild(a);
    });

    // 読んでいる位置に合わせて目次をハイライトする
    if (typeof IntersectionObserver !== 'function') return;
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        host.querySelectorAll('a').forEach(function (a) {
          a.classList.toggle('active', a.dataset.target === entry.target.id);
        });
      });
    }, { rootMargin: '-70px 0px -75% 0px', threshold: 0 });

    headings.forEach(function (h) {
      var n = byId(h.id);
      if (n) observer.observe(n);
    });
  }

  /* ==================== 章の描画 ==================== */

  function renderChapter(id) {
    var meta = tocEntry(id);
    var host = byId('chapter');
    var nav = byId('chapter-nav');

    host.textContent = '';
    nav.textContent = '';
    host.appendChild(el('p', 'empty', '読み込んでいます…'));

    loadChapter(id).then(function (ch) {
      host.textContent = '';

      var head = el('div', 'ch-head');
      head.appendChild(el('div', 'ch-no', '第 ' + (ch.no || meta.no) + ' 章'));
      head.appendChild(el('h1', 'ch-title', ch.title || meta.title));
      if (ch.sub || meta.sub) head.appendChild(el('p', 'ch-sub', ch.sub || meta.sub));
      host.appendChild(head);

      var body = el('div');
      var headings = FR.markup.renderInto(body, ch.body);
      host.appendChild(body);

      /* 読了ボタン */
      var mark = el('button', 'mark-done');
      mark.type = 'button';
      function syncMark() {
        var on = FR.store.progress.isDone(id);
        mark.classList.toggle('on', on);
        mark.textContent = on ? '✓ この章は読了しました' : 'この章を読了にする';
      }
      mark.addEventListener('click', function () {
        FR.store.progress.setDone(id, !FR.store.progress.isDone(id));
        syncMark();
        refreshDoneMarks();
      });
      syncMark();
      host.appendChild(mark);

      buildMiniToc(headings);
      buildChapterNav(id);

      // AI パネルに、今読んでいる章を文脈として渡す
      var idx = FR.toc.indexOf(meta);
      FR.aiPanel.setContext({
        id: id, no: ch.no || meta.no, title: ch.title || meta.title,
        body: ch.body, index: idx
      });

      global.scrollTo(0, 0);
    }).catch(function (err) {
      host.textContent = '';
      var box = el('div', 'callout warn');
      box.appendChild(el('div', 'callout-title', '表示できませんでした'));
      box.appendChild(el('p', null, err.message));
      box.appendChild(el('p', null, 'この章はまだ用意されていない可能性があります。'));
      host.appendChild(box);
      buildChapterNav(id);
    });
  }

  function buildChapterNav(id) {
    var nav = byId('chapter-nav');
    nav.textContent = '';
    var meta = tocEntry(id);
    var i = FR.toc.indexOf(meta);
    if (i < 0) return;

    function link(t, dir, cls) {
      var a = el('a', cls);
      a.href = '#/' + t.id;
      a.appendChild(el('div', 'dir', dir));
      a.appendChild(el('div', 't', '第' + t.no + '章 ' + t.title));
      return a;
    }
    if (i > 0) nav.appendChild(link(FR.toc[i - 1], '← 前の章', 'prev'));
    if (i < FR.toc.length - 1) nav.appendChild(link(FR.toc[i + 1], '次の章 →', 'next'));
  }

  /* ==================== ルーティング ==================== */

  function showPage(node) {
    var host = byId('chapter');
    host.textContent = '';
    byId('chapter-nav').textContent = '';
    byId('minitoc').textContent = '';
    if (observer) { observer.disconnect(); observer = null; }
    host.appendChild(node);
    FR.aiPanel.setContext(null);
    global.scrollTo(0, 0);
  }

  function route() {
    var hash = global.location.hash.replace(/^#\/?/, '');
    closeMenu();
    current = hash;

    if (!hash || hash === '/') { highlightToc(''); return showPage(FR.pages.home()); }
    if (hash === 'drill') { highlightToc(''); return showPage(FR.drill.page()); }
    if (hash === 'verbs') { highlightToc(''); return showPage(FR.pages.verbs()); }
    if (hash === 'myphrases') { highlightToc(''); return showPage(FR.pages.myPhrases()); }
    if (hash === 'settings') { highlightToc(''); return showPage(FR.pages.settings()); }

    if (tocEntry(hash)) {
      highlightToc(hash);
      return renderChapter(hash);
    }
    // 章内の見出しへのリンク（#見出しID）はブラウザ任せにする
    if (!/^ch/.test(hash)) return;

    highlightToc('');
    showPage(el('p', 'empty', 'ページが見つかりません。'));
  }

  /* ==================== テーマ ==================== */

  /* テーマは3択（auto / light / dark）で、既定は auto（端末に合わせる）。
     CSS 側は :root が紙（ライト）で、ダークは [data-theme=dark] と
     「auto かつ端末がダーク」のときに効く。 */
  function applyTheme() {
    var t = FR.store.settings.get('theme');
    if (t !== 'light' && t !== 'dark') t = 'auto';
    doc.documentElement.setAttribute('data-theme', t);
  }

  function cycleTheme() {
    var order = ['auto', 'light', 'dark'];
    var cur = FR.store.settings.get('theme');
    var i = order.indexOf(cur);
    var next = order[(i < 0 ? 0 : i + 1) % order.length];
    FR.store.settings.set('theme', next);
    applyTheme();
    var label = { auto: '端末に合わせる', light: 'ライト', dark: 'ダーク' }[next];
    byId('btn-theme').setAttribute('title', 'テーマ：' + label);
    byId('btn-theme').setAttribute('aria-label', 'テーマを切り替える（現在：' + label + '）');
  }

  /* 設定の「文字サイズ」。--font-scale を書き換え、読み物の列だけを拡縮する */
  var FONT_SCALES = { s: 0.92, m: 1, l: 1.12, xl: 1.28 };
  function applyFontScale() {
    var k = FR.store.settings.get('fontScale');
    doc.documentElement.style.setProperty('--font-scale', String(FONT_SCALES[k] || 1));
  }

  /* ==================== 検索 ==================== */

  var searchLoaded = false;

  function setupSearch() {
    var input = byId('search-input');
    var results = byId('search-results');
    var timer = null;

    function hide() { results.hidden = true; results.textContent = ''; }

    function run() {
      var q = input.value.trim();
      if (q.length < 2) return hide();

      results.hidden = false;
      results.textContent = '';

      if (!searchLoaded) {
        results.appendChild(el('div', 'sr-empty', '検索の準備をしています…'));
        loadAllChapters().then(function () {
          searchLoaded = true;
          run();
        });
        return;
      }

      var needle = q.toLowerCase();
      var hits = [];

      FR.toc.forEach(function (t) {
        var ch = chapters[t.id];
        var score = 0, snippet = '';

        if ((t.title + ' ' + (t.sub || '')).toLowerCase().indexOf(needle) !== -1) score += 10;

        if (ch && ch.body) {
          var body = ch.body;
          var at = body.toLowerCase().indexOf(needle);
          if (at !== -1) {
            score += 5;
            var from = Math.max(0, at - 40);
            snippet = (from > 0 ? '…' : '') + body.slice(from, at + needle.length + 60).replace(/\s+/g, ' ') + '…';
          }
        }
        if (score) hits.push({ t: t, score: score, snippet: snippet });
      });

      hits.sort(function (a, b) { return b.score - a.score; });

      if (!hits.length) {
        results.appendChild(el('div', 'sr-empty', '見つかりませんでした'));
        return;
      }

      hits.slice(0, 20).forEach(function (h) {
        var a = el('a');
        a.href = '#/' + h.t.id;
        a.appendChild(el('div', 'sr-title', '第' + h.t.no + '章 ' + h.t.title));
        if (h.snippet) {
          var s = el('div', 'sr-snip');
          // 一致部分を強調する（テキストノードで組み立てる）
          var lower = h.snippet.toLowerCase();
          var at = lower.indexOf(needle);
          if (at === -1) s.textContent = h.snippet;
          else {
            s.appendChild(doc.createTextNode(h.snippet.slice(0, at)));
            s.appendChild(el('mark', null, h.snippet.slice(at, at + needle.length)));
            s.appendChild(doc.createTextNode(h.snippet.slice(at + needle.length)));
          }
          a.appendChild(s);
        }
        a.addEventListener('click', function () { hide(); input.value = ''; });
        results.appendChild(a);
      });
    }

    input.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(run, 180);
    });
    input.addEventListener('focus', function () { if (input.value.trim().length >= 2) run(); });
    doc.addEventListener('click', function (e) {
      if (!e.target.closest('.search-wrap')) hide();
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { input.value = ''; hide(); input.blur(); }
    });
  }

  /* ==================== モバイルのメニュー ==================== */

  function openMenu() {
    byId('sidebar').classList.add('open');
    byId('scrim').hidden = false;
    byId('btn-menu').setAttribute('aria-expanded', 'true');
  }
  function closeMenu() {
    byId('sidebar').classList.remove('open');
    if (!FR.aiPanel.isOpen()) byId('scrim').hidden = true;
    byId('btn-menu').setAttribute('aria-expanded', 'false');
  }

  /* ==================== 音声のバナー ==================== */

  function checkVoices() {
    var banner = byId('voice-banner');
    if (!FR.speech.supported) {
      banner.hidden = false;
      banner.textContent = '';
      banner.appendChild(doc.createTextNode('このブラウザは読み上げに対応していません。Chrome・Safari・Edge をお使いください。教材の他の機能はすべて使えます。'));
      return;
    }
    FR.speech.whenReady().then(function () {
      if (FR.speech.isReady()) { banner.hidden = true; return; }
      banner.hidden = false;
      banner.textContent = '';
      if (FR.icon) banner.appendChild(FR.icon('sound', 13));
      banner.appendChild(doc.createTextNode('フランス語の読み上げ音声が見つかりません。'));

      var a = doc.createElement('a');
      a.href = '#/settings';
      a.textContent = '追加のしかたを見る';
      a.style.marginLeft = '6px';
      banner.appendChild(a);

      var close = doc.createElement('button');
      close.type = 'button';
      close.textContent = '閉じる';
      close.addEventListener('click', function () { banner.hidden = true; });
      banner.appendChild(close);
    });
  }

  /* ==================== 音声設定ダイアログ ==================== */

  function setupSpeechDialog() {
    var dlg = byId('speech-dialog');
    var sel = byId('voice-select');
    var range = byId('rate-range');
    var out = byId('rate-out');
    var hint = byId('speech-hint');

    function fill() {
      sel.textContent = '';
      var list = FR.speech.listVoices();
      if (!list.length) {
        var o = doc.createElement('option');
        o.textContent = '（フランス語の声がありません）';
        sel.appendChild(o);
        sel.disabled = true;
        hint.textContent = 'お使いの端末にフランス語の音声が入っていません。設定画面に追加の手順があります。';
        return;
      }
      sel.disabled = false;
      hint.textContent = '「ゆっくり」にすると、リエゾンや語尾が聞き取りやすくなります。';
      var cur = FR.speech.currentVoice();
      list.forEach(function (v) {
        var o = doc.createElement('option');
        o.value = v.voiceURI;
        o.textContent = v.name + '（' + v.lang + '）';
        if (cur && v.voiceURI === cur.voiceURI) o.selected = true;
        sel.appendChild(o);
      });
    }

    sel.addEventListener('change', function () { FR.speech.setVoice(sel.value); });
    range.addEventListener('input', function () {
      FR.speech.setRate(range.value);
      out.textContent = '× ' + range.value;
    });
    byId('speech-test').addEventListener('click', function () {
      FR.speech.speak("Bonjour ! Je m'appelle Marie et j'apprends le français.");
    });

    byId('btn-speech').addEventListener('click', function () {
      fill();
      range.value = String(FR.speech.getRate());
      out.textContent = '× ' + range.value;
      if (typeof dlg.showModal === 'function') dlg.showModal();
      else global.location.hash = '#/settings';
    });

    FR.speech.onVoicesChanged(function () {
      if (dlg.open) fill();
    });
  }

  /* ==================== 起動 ==================== */

  /** HTML に置いたボタン・リンクへアイコンを差し込む */
  function installIcons() {
    if (!FR.icon) return;
    [['btn-menu', 'menu'], ['btn-speech', 'sound'], ['btn-theme', 'theme'],
     ['btn-ai', 'spark'], ['btn-ai-close', 'close']].forEach(function (pair) {
      FR.setIcon(byId(pair[0]), pair[1]);
    });
    doc.querySelectorAll('[data-icon]').forEach(function (a) {
      a.insertBefore(FR.icon(a.dataset.icon, 16), a.firstChild);
    });
  }

  function init() {
    applyTheme();
    applyFontScale();
    installIcons();
    buildToc();
    setupSearch();
    setupSpeechDialog();
    checkVoices();

    byId('btn-theme').addEventListener('click', cycleTheme);
    byId('btn-menu').addEventListener('click', function () {
      if (byId('sidebar').classList.contains('open')) closeMenu();
      else openMenu();
    });
    byId('scrim').addEventListener('click', function () {
      closeMenu();
      FR.aiPanel.close();
    });
    byId('btn-ai').addEventListener('click', function () {
      if (FR.aiPanel.isOpen()) FR.aiPanel.close();
      else FR.aiPanel.open();
    });

    doc.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        FR.speech.stop();
        closeMenu();
      }
      // / で検索へ
      if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(doc.activeElement.tagName)) {
        e.preventDefault();
        byId('search-input').focus();
      }
    });

    global.addEventListener('hashchange', route);
    route();
  }

  FR.app = {
    applyTheme: applyTheme,
    applyFontScale: applyFontScale,
    route: route,
    loadChapter: loadChapter,
    chapters: chapters,
    refreshDoneMarks: refreshDoneMarks
  };

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', init);
  else init();

}(typeof window !== 'undefined' ? window : globalThis));

</script>

<script>
/* 全章を同梱（1ファイル版では遅延ロードしない） */
FR.chapter({
  id: 'ch00',
  no: '0',
  title: 'フラ語・発音のルール',
  sub: '文字と音の対応、リエゾン・エリジオン・アンシェヌマン',
  body: `
フランス語の綴りと発音の関係は、英語よりずっと規則的です。英語では ough が through / though / tough で全部違う音になりますが、フランス語では **綴りを見れば読み方がほぼ確実に決まります**。逆に、音から綴りを起こすことはできません（同じ音に何通りもの綴りがあるため）。

つまりフランス語の発音は「覚える」ものではなく「**規則を適用する**」ものです。この章でその規則をひととおり押さえます。ここを最初に固めておくと、以後どの章でも例文を自分で音読できるようになります。

:::note この章の読み方
規則の数は多いですが、暗記する必要はありません。本文中の赤いフランス語はクリックすると発音が鳴るので、**規則を読む → 実際の音を聞く** を往復してください。音と綴りの対応は、耳で確かめた回数だけ身につきます。
:::

## 1. アルファベ（l'alphabet）

文字は英語と同じ26字です。読み方だけが違います。

| 文字 | 読み | 文字 | 読み | 文字 | 読み |
|---|---|---|---|---|---|
| A a | [[a\|ア]] | J j | [[ji\|ジ]] | S s | [[esse\|エス]] |
| B b | [[bé\|ベ]] | K k | [[ka\|カ]] | T t | [[té\|テ]] |
| C c | [[cé\|セ]] | L l | [[elle\|エル]] | U u | [[u\|ユ]] |
| D d | [[dé\|デ]] | M m | [[emme\|エム]] | V v | [[vé\|ヴェ]] |
| E e | [[e\|ウ]] | N n | [[enne\|エヌ]] | W w | [[double vé\|ドゥブルヴェ]] |
| F f | [[effe\|エフ]] | O o | [[o\|オ]] | X x | [[iks\|イクス]] |
| G g | [[gé\|ジェ]] | P p | [[pé\|ペ]] | Y y | [[i grec\|イグレック]] |
| H h | [[ache\|アッシュ]] | Q q | [[ku\|キュ]] | Z z | [[zède\|ゼッド]] |
| I i | [[i\|イ]] | R r | [[erre\|エール]] | | |

**母音字**は a, e, i, o, u, y の6つ。これ以外はすべて子音字です。この区別は、以後の規則（エリジオン、リエゾン、c と g の読み分けなど）で何度も効いてくるので、いま覚えてください。

:::adv W と K は外来語専用
W と K はラテン語由来の語彙にはなく、フランス語の辞書でこの2文字から始まる語はすべて借用語です（[[wagon\|ヴァゴン\|車両]]、[[kilo\|キロ\|キロ]]）。だから W の名前も「二重の V」なのです。
:::

## 2. 綴り字記号（les signes orthographiques）

母音字の上下に付く記号です。**飾りではなく、音や意味を変える情報**なので、書くときも必ず付けます。

| 記号 | 名称 | 例 | はたらき |
|---|---|---|---|
| ´ | アクサン・テギュ（accent aigu） | [[été\|エテ\|夏]] | e の上のみ。閉じた [e] を表す |
| \` | アクサン・グラーヴ（accent grave） | [[mère\|メール\|母]]、[[où\|ウー\|どこ]] | e では開いた [ɛ]。a, u では同音語の区別だけ |
| ˆ | アクサン・シルコンフレクス（accent circonflexe） | [[fête\|フェット\|祭り]] | 多くは消えた s の跡（fête ← feste = feast） |
| ¨ | トレマ（tréma） | [[Noël\|ノエル\|クリスマス]] | 直前の母音字と分けて読ませる |
| ¸ | セディーユ（cédille） | [[français\|フランセ\|フランス語]] | c の下のみ。a, o, u の前で c を [s] にする |

:::deep アクサン・シルコンフレクスは語源の化石
この記号が付く語は、古フランス語では s があった語です。英語と見比べると対応がはっきりします。

| フランス語 | 元の形 | 英語 |
|---|---|---|
| [[forêt\|フォレ\|森]] | forest | forest |
| [[hôpital\|オピタル\|病院]] | hospital | hospital |
| [[île\|イル\|島]] | isle | isle |
| [[château\|シャトー\|城]] | chastel | castle |

未知の単語に ˆ を見つけたら、その位置に s を補って英語と照合すると意味が推測できることが多い、という実用的な使い方ができます。
:::

:::warn a, u に付くグラーヴは音を変えない
[[à\|ア\|〜へ]] と a（avoir の活用形）、[[où\|ウー\|どこ]] と [[ou\|ウー\|または]] は、**発音がまったく同じ**です。記号は同音異義語を書き分けるためだけに付いています。読むときには無視してかまいませんが、書くときに落とすと別の語になってしまいます。
:::

## 3. 母音字の読み方

### 単独の母音字

| 綴り | 音 | 例 |
|---|---|---|
| a, à, â | [a] ア | [[ma\|マ\|私の]]、[[là\|ラ\|そこ]] |
| i, î, y | [i] イ | [[ici\|イシ\|ここ]]、[[stylo\|スティロ\|ペン]] |
| o, ô | [o]/[ɔ] オ | [[photo\|フォト\|写真]] |
| u, û | [y] ユ | [[tu\|テュ\|君]]、[[sur\|スュール\|〜の上]] |
| é | [e] エ（狭い） | [[café\|カフェ\|コーヒー]] |
| è, ê | [ɛ] エ（広い） | [[père\|ペール\|父]]、[[être\|エートル\|〜である]] |

:::warn u の音は日本語にない
[[u\|ユ]] は「ウ」でも「ユ」でもありません。**唇を「ウ」の形にすぼめたまま、舌は「イ」の位置**にして出す音です。日本語の「ユ」で代用すると通じないことがあります（[[rue\|リュ\|通り]] と [[roue\|ルー\|車輪]] は別の語）。カナ表記では便宜上「ユ」と書きますが、実際の音は必ず聞いて確かめてください。
:::

### e の3つの顔

**e にアクセント記号が付かないとき**、その読み方は「後ろに何が続くか」で決まります。ここはフランス語の発音で最も重要な規則です。

| 条件 | 音 | 例 |
|---|---|---|
| 後ろに子音字が2つ、または語末の子音字が発音される | [ɛ] エ | [[elle\|エル\|彼女]]、[[cher\|シェール\|高い]] |
| 後ろに発音される子音が1つだけ、または開いた音節 | [ə] ウ（曖昧母音） | [[le\|ル\|その]]、[[petit\|プティ\|小さい]] |
| **語末**（1音節語を除く） | 無音 | [[table\|ターブル\|机]]、[[France\|フランス\|フランス]] |

:::deep 語末の e が無音であることの帰結
これは単なる発音の話にとどまりません。**語末の e が無音だから、その手前の子音が発音される**、という点が決定的です。

:::ex 語末の e があるかないかで、手前の子音の発音が変わる
petit | プティ | 小さい（男性形。t は読まない）
petite | プティット | 小さい（女性形。e があるので t を読む）
grand | グラン | 大きい（男性形。d は読まない）
grande | グランド | 大きい（女性形。d を読む）
:::

形容詞や過去分詞の女性形が「-e を付ける」だけで作られるのは、この規則があるからです。第6章（形容詞）と第20章（過去分詞の性数一致）で、この音の違いが文法そのものを支えていることが分かります。
:::

### 複母音字（母音字の組み合わせ）

母音字が2つ以上並ぶと、**1つの音**になります。これがフランス語の綴りで最も大きな山です。

| 綴り | 音 | 例 |
|---|---|---|
| ai, ei | [ɛ] エ | [[maison\|メゾン\|家]]、[[neige\|ネージュ\|雪]] |
| au, eau | [o] オ | [[chaud\|ショー\|暑い]]、[[bateau\|バトー\|船]] |
| ou, où, oû | [u] ウ | [[vous\|ヴー\|あなた]]、[[jour\|ジュール\|日]] |
| oi | [wa] ワ | [[moi\|モワ\|私]]、[[trois\|トロワ\|3]] |
| eu, œu | [ø]/[œ] ウ | [[bleu\|ブル\|青い]]、[[sœur\|スール\|姉妹]] |
| ui | [ɥi] ュイ | [[huit\|ユイット\|8]]、[[nuit\|ニュイ\|夜]] |

:::note oi = 「ワ」がフランス語らしさの正体
[[Bonsoir\|ボンソワール\|こんばんは]]、[[au revoir\|オ・ルヴォワール\|さようなら]]、[[trois\|トロワ\|3]] ——「フランス語らしい」と感じる響きの多くは、この oi です。綴りに oi を見たら反射的に「ワ」と読めるようにしてください。
:::

### 鼻母音（les voyelles nasales）

**母音字 + n または m** で、鼻に息を抜く母音になります。ただし条件があります。

:::warn 鼻母音になる条件
n / m の**後ろに母音字が来ない**、かつ **n / m が重なっていない** ときだけ鼻母音になります。

- [[bon\|ボン\|良い]] → 鼻母音（n の後ろに何もない）
- [[bonne\|ボンヌ\|良い（女性形）]] → **鼻母音ではない**（n が重なっている）
- [[une\|ユヌ\|1つの]] → **鼻母音ではない**（n の後ろに e がある）

この条件は形容詞の女性形（bon → bonne）で必ず効いてくるので、いま押さえてください。
:::

| 綴り | 音 | 例 |
|---|---|---|
| an, am, en, em | [ɑ̃] アン | [[grand\|グラン\|大きい]]、[[temps\|タン\|時間]]、[[enfant\|アンファン\|子ども]] |
| in, im, ain, ein, yn, ym | [ɛ̃] アン（口を横に） | [[vin\|ヴァン\|ワイン]]、[[pain\|パン\|パン]]、[[important\|アンポルタン\|重要な]] |
| on, om | [ɔ̃] オン | [[bon\|ボン\|良い]]、[[nom\|ノン\|名前]] |
| un, um | [œ̃] アン（唇を丸めて） | [[un\|アン\|1つの]]、[[parfum\|パルファン\|香水]] |

:::adv 4つの鼻母音は3つに減りつつある
伝統的な発音では [ɛ̃]（in）と [œ̃]（un）は別の音ですが、現代のパリの若い世代ではこの区別が失われ、どちらも [ɛ̃] で発音されることが一般的です。したがって [[brin\|ブラン\|一本]] と [[brun\|ブラン\|茶色の]] が同音になります。学習上は区別しなくても通じますが、辞書や教科書では区別して記述されます。
:::

## 4. 子音字の読み方

### 基本

英語とほぼ同じですが、次の点が違います。

| 綴り | 音 | 例 |
|---|---|---|
| ch | [ʃ] シュ（× チ） | [[chat\|シャ\|猫]]、[[chocolat\|ショコラ\|チョコレート]] |
| gn | [ɲ] ニュ | [[montagne\|モンターニュ\|山]]、[[Espagne\|エスパーニュ\|スペイン]] |
| qu | [k] ク（u は読まない） | [[qui\|キ\|誰]]、[[quatre\|カトル\|4]] |
| ph | [f] フ | [[photo\|フォト\|写真]] |
| th | [t] ト（英語の th ではない） | [[thé\|テ\|お茶]] |
| ill | [ij] イユ | [[famille\|ファミーユ\|家族]]、[[fille\|フィーユ\|娘]] |
| r | [ʁ] のどびこの震え | [[Paris\|パリ\|パリ]]、[[rouge\|ルージュ\|赤い]] |

:::note r はうがいの音
フランス語の r は、舌先を巻く英語の r とはまったく別の音です。**のどの奥（口蓋垂）を震わせる**、うがいに近い音になります。最初は「ハ」行に近い摩擦音で代用しても通じます。無理に英語の r で発音すると、かえって通じにくくなります。
:::

### c と g — 後ろの母音字で読み方が変わる

これはフランス語の綴りで最も体系的な規則で、動詞の活用にも直結します。

| | a, o, u の前 | e, i, y の前 |
|---|---|---|
| **c** | [k] ク：[[café\|カフェ\|コーヒー]] | [s] ス：[[ceci\|ススィ\|これ]] |
| **g** | [g] グ：[[gare\|ガール\|駅]] | [ʒ] ジュ：[[girafe\|ジラフ\|キリン]] |

:::deep この規則が動詞の綴りを変える
c と g の音は「後ろの母音字」で決まる。だから**音を保つために綴りのほうを変える**必要が生じます。

- [[commencer\|コマンセ\|始める]] は [s] の音。nous の語尾 -ons が付くと c の後ろが o になり、[k] になってしまう。そこで c を ç に変えて **nous commençons** とする。
- [[manger\|マンジェ\|食べる]] は [ʒ] の音。-ons が付くと g の後ろが o になり [g] になってしまう。そこで e を挟んで **nous mangeons** とする。

第8章で学ぶ「綴りが変わる -er 動詞」は、例外でも不規則でもなく、**この発音規則を守るための必然的な調整**です。ここを理解しておくと、丸暗記する項目が1つ減ります。
:::

### h は常に無音、ただし2種類ある

フランス語の h は**どんな位置でも音になりません**。しかし文法上は2種類に分かれます。

| 種類 | ふるまい | 例 |
|---|---|---|
| **無音の h**（h muet） | 母音と同じ扱い。エリジオン・リエゾンが起きる | [[l'hôtel\|ロテル\|ホテル]]、[[les hôtels\|レゾテル\|ホテル（複数）]] |
| **有音の h**（h aspiré） | 子音と同じ扱い。エリジオン・リエゾンが起きない | [[le héros\|ル・エロ\|英雄]]、[[les héros\|レ・エロ\|英雄たち]] |

:::warn 見分ける方法はない
綴りを見ても、有音か無音かは分かりません。**辞書で覚えるしかない**項目です。辞書では有音の h に † や * などの印が付いています。有音の h の語はゲルマン語由来のものが多く（[[haut\|オー\|高い]]、[[honte\|オント\|恥]]、[[huit\|ユイット\|8]]）、数はそれほど多くありません。
:::

### 語末の子音字は、原則として読まない

これがフランス語らしい響きを作っている最大の規則です。

:::ex 語末の子音は読まない
Paris | パリ | パリ（s を読まない）
petit | プティ | 小さい（t を読まない）
grand | グラン | 大きい（d を読まない）
vous | ヴー | あなた（s を読まない）
et | エ | そして（t を読まない）
:::

:::note 例外は c, r, f, l — 「CaReFuL」で覚える
語末でも読まれることが多い子音は c, r, f, l の4つです。英語の **careful** の子音と一致するので、この語で覚えるのが定番です。

[[avec\|アヴェック\|〜と一緒に]]、[[bonjour\|ボンジュール\|こんにちは]]、[[neuf\|ヌフ\|9]]、[[mal\|マル\|悪く]]

ただしこれも絶対ではありません（[[monsieur\|ムシュー\|〜さん]] の r は読まない）。
:::

## 5. 語と語のつながり — リエゾン・アンシェヌマン・エリジオン

フランス語は**単語ごとに区切って発音しません**。文全体をひとつながりで読みます。聞き取りが難しく感じるのは、主にこの3つの現象のためです。

### エリジオン（l'élision）— 母音字が消える

**母音字で終わる一部の語**が、母音字または無音の h で始まる語の前に来ると、母音字が落ちて **アポストロフで結ばれます**。書くときにも反映されます。

対象になる語は決まっています： **je, me, te, se, le, la, de, ne, que, ce, si（il の前のみ）**

:::ex エリジオン
Je aime → J'aime | ジェーム | 私は好きだ
Le hôtel → L'hôtel | ロテル | そのホテル
Ce est → C'est | セ | これは〜だ
Si il → S'il | スィル | もし彼が
:::

:::warn エリジオンは義務
「してもよい」ではなく「**しなければならない**」規則です。Je aime と書くことはできません。ただし si は il / ils の前でのみエリジオンし、elle の前ではしません（si elle のまま）。
:::

### アンシェヌマン（l'enchaînement）— 発音される子音が次の母音とつながる

**もともと発音されている**語末の子音が、次の語の母音とつながって1つの音節を作ります。

:::ex アンシェヌマン
il est | イ・レ | 彼は〜である（l が est とつながる）
avec elle | アヴェ・ケル | 彼女と一緒に（c が elle とつながる）
une amie | ユ・ナミ | 女友だち（n が amie とつながる）
:::

### リエゾン（la liaison）— 読まないはずの子音が復活する

**単独では発音されない**語末の子音字が、次の語が母音・無音の h で始まるときに**発音されるようになります**。

:::ex リエゾン
vous avez | ヴー・ザヴェ | あなたは持っている（s が [z] になる）
les enfants | レ・ザンファン | 子どもたち（s が [z] になる）
un homme | アン・ノム | 一人の男（n が復活する）
petit ami | プティ・タミ | ボーイフレンド（t が復活する）
:::

:::note リエゾンで音が変わる子音
リエゾンするとき、子音の音が変化するものがあります。

| 綴り | リエゾン時の音 | 例 |
|---|---|---|
| s, x, z | [z] ズ | [[les amis\|レザミ\|友人たち]]、[[deux ans\|ドゥザン\|2年]] |
| d | [t] ト | [[un grand homme\|アン・グラントム\|偉大な人物]] |
| f | [v] ヴ | [[neuf ans\|ヌヴァン\|9歳]] |
| n, t, p, r | そのまま | [[on a\|オナ\|人は持っている]] |
:::

:::deep リエゾンには義務・禁止・任意の3種類がある
すべての場合にリエゾンするわけではありません。大学の文法ではここまで区別します。

**義務のリエゾン**（必ずする）——語のまとまりが強い組み合わせ

- 限定詞 + 名詞：[[les enfants\|レザンファン\|子どもたち]]、[[mon ami\|モンナミ\|私の友人]]
- 形容詞 + 名詞：[[petits enfants\|プティザンファン\|小さな子どもたち]]
- 主語代名詞 + 動詞：[[nous avons\|ヌザヴォン\|私たちは持っている]]、[[ils ont\|イルゾン\|彼らは持っている]]
- 動詞 + 倒置の主語代名詞：[[Parlez-vous …\|パルレヴー\|あなたは話しますか]]
- 単音節の前置詞・副詞 + 語：[[en avant\|アンナヴァン\|前へ]]、[[très intéressant\|トレザンテレサン\|とても興味深い]]

**禁止のリエゾン**（してはいけない）——意味の切れ目をまたぐ場合

- 主語の名詞 + 動詞：Les enfants ‖ ont …（× レザンファンゾン）
- et の後ろ：[[et un\|エ・アン\|そして1つ]]（絶対にリエゾンしない）
- 有音の h の前：[[les héros\|レ・エロ\|英雄たち]]
- 単数名詞 + 形容詞：un enfant ‖ intelligent

**任意のリエゾン**（してもしなくてもよい）——改まった場面ほどする

- 助動詞 + 過去分詞：[[nous avons été\|ヌザヴォン(ゼ)テ\|私たちは〜だった]]
- 複数名詞 + 形容詞：des enfants ‖ intelligents

会話ではリエゾンを減らし、朗読・演説・ニュースでは増やす傾向があります。**リエゾンの量は語調の改まり度を表す**、と考えてください。
:::

:::warn ils ont と ils sont の聞き分け
リエゾンが生む有名な難所です。

- [[ils ont\|イルゾン\|彼らは持っている]] … リエゾンで [z] が入る
- [[ils sont\|イルソン\|彼らは〜である]] … s は語頭の [s]

**濁るか濁らないか**だけの差で、avoir と être という最重要動詞が入れ替わります。両方をクリックして、音の違いを確かめてください。
:::

## 6. アクセント（強勢）はどこに置くか

英語と決定的に違う点です。フランス語の強勢は**語ではなく、意味のまとまり（リズムグループ）の最後の音節**に置かれます。

:::ex 強勢は最後に置く
Bonjour. | ボンジュー**ル** | こんにちは。
Je m'appelle Marie. | ジュ・マペル・マ**リ** | 私はマリといいます。
Je vais à la gare. | ジュ・ヴェ・ア・ラ・ガー**ル** | 私は駅へ行きます。
:::

つまり**単語ごとに強弱を付けない**、というのがフランス語らしく話すコツです。英語のように単語単位で強勢を置くと、それだけで強い外国語なまりになります。平坦に読んで、最後だけ少し伸ばす——これで十分にフランス語らしくなります。

## 7. 数字（les nombres）

発音の練習に最適なので、ここで 0〜20 を導入します。リエゾンと語末子音の規則がまとめて確認できます。

:::ex 0 から 10
zéro | ゼロ | 0
un | アン | 1
deux | ドゥ | 2
trois | トロワ | 3
quatre | カトル | 4
cinq | サンク | 5
six | スィス | 6
sept | セット | 7
huit | ユイット | 8
neuf | ヌフ | 9
dix | ディス | 10
:::

:::ex 11 から 20
onze | オンズ | 11
douze | ドゥーズ | 12
treize | トレーズ | 13
quatorze | カトルズ | 14
quinze | カンズ | 15
seize | セーズ | 16
dix-sept | ディセット | 17
dix-huit | ディズユイット | 18
dix-neuf | ディズヌフ | 19
vingt | ヴァン | 20
:::

:::adv 数詞の語末子音は、後ろに何が来るかで消える
six, huit, dix の語末子音は、単独では発音されますが、**子音で始まる名詞の前では消えます**。

| | 単独 | 母音の前（リエゾン） | 子音の前（無音） |
|---|---|---|---|
| six | [[six\|スィス\|6]] | [[six ans\|スィザン\|6歳]] | [[six livres\|スィ・リーヴル\|6冊の本]] |
| dix | [[dix\|ディス\|10]] | [[dix ans\|ディザン\|10歳]] | [[dix livres\|ディ・リーヴル\|10冊の本]] |
| huit | [[huit\|ユイット\|8]] | [[huit ans\|ユイタン\|8歳]] | [[huit livres\|ユイ・リーヴル\|8冊の本]] |

また neuf は ans と heures の前でだけ [v] になります（[[neuf ans\|ヌヴァン\|9歳]]）。それ以外の母音の前では [f] のままです。
:::

## 8. 読めない語に出会ったら — 実践の手順

:::tip 未知の語を読む4ステップ
1. **語末の子音は原則読まない**（ただし c, r, f, l は読むことが多い——CaReFuL の子音）
2. **母音の組み合わせを1音に直す**：ou→ウ、au / eau→オ、ai / ei→エ、oi→ワ、eu→ウ（曖昧）
3. **鼻母音を確認**：an / en→アン、on→オン、in / ain / ein→アン（口を横に）、un→アン
4. **h は常に無音**、ch→シュ、gn→ニュ、ill→イユ（ville などの例外あり）

この4ステップで、フランス語の単語の**9割以上は初見で読めます**。英語と違い、フランス語の綴りと音の対応は例外が少なく、規則を覚える価値が高い言語です。

**CaReFuL** は「語末でも読む子音」の覚え方です：ave**c**、bonjou**r**、neu**f**、hôte**l**。ただし r は -er 動詞の語尾では読みません（parler「パルレ」）。
:::

## 9. まずはこれだけ言えれば

発音規則を確かめながら、最初の表現を音読してみてください。

:::ex 挨拶と自己紹介

Salut ! | サリュ | やあ！（親しい相手に）

Je m'appelle Marie. | ジュ・マペル・マリ | 私はマリといいます。
Enchanté. | アンシャンテ | はじめまして。
:::

  body: `
日本語の名詞は、そのまま置けば使えます。フランス語の名詞はそうはいきません。**すべての名詞が男性か女性のどちらかに属し**、しかも**単独では文に置けず、必ず冠詞などの限定詞を伴います**。

この2つは、名詞そのものより、まわりの語（冠詞・形容詞・過去分詞・代名詞）の形を決めるために効いてきます。つまり名詞の性と数は、**文全体を通じて一致（accord）を引き起こす起点**です。ここを曖昧にしたまま進むと、後の章がすべて崩れます。

## 1. 名詞には性がある

フランス語の名詞は **男性名詞（nom masculin）** と **女性名詞（nom féminin）** に分かれます。辞書ではそれぞれ **n.m.** / **n.f.** と表示されます。

:::ex 性は意味と無関係に決まっている
le livre | ル・リーヴル | 本（男性）
la table | ラ・ターブル | 机（女性）
le soleil | ル・ソレイユ | 太陽（男性）
la lune | ラ・リュヌ | 月（女性）
le vin | ル・ヴァン | ワイン（男性）
la bière | ラ・ビエール | ビール（女性）
:::

:::warn 性に理屈を求めない
なぜ机が女性で本が男性なのか——**理由はありません**。ラテン語からの歴史的な引き継ぎであって、意味や形状とは無関係です。ドイツ語やスペイン語と一致しないことも普通にあります（太陽はフランス語では男性、ドイツ語では女性）。

したがって **名詞は必ず冠詞ごと覚えてください**。「table」ではなく「**une** table」と覚える。これが唯一かつ最短の対策です。
:::

### 人を表す名詞は、性と実際の性別が一致する

人や一部の動物を指す名詞では、性が実際の性別に対応します。多くは**女性形に -e を足して**作ります。

| 男性 | 女性 | 意味 |
|---|---|---|
| [[un ami\|アン・ナミ]] | [[une amie\|ユ・ナミ]] | 友人 |
| [[un étudiant\|アン・エテュディアン]] | [[une étudiante\|ユ・エテュディアント]] | 学生 |
| [[un Français\|アン・フランセ]] | [[une Française\|ユヌ・フランセーズ]] | フランス人 |

:::note ここでも「語末の e」が効く
第0章の規則を思い出してください。**語末の e は無音だが、その手前の子音を発音させる**。

- étudiant … 語末の t は読まない → 「エテュディアン」
- étudiante … e があるので t を読む → 「エテュディアント」

つまり**耳で男女を聞き分けられる**のはこの規則のおかげです。ami / amie のように手前が母音字の場合は、音が変わらないので聞き分けられません（冠詞 un / une で判断します）。
:::

:::deep 女性形の作り方には型がある
-e を足すだけでない、規則的な変化のパターンがあります。

| 男性の語尾 | 女性の語尾 | 例 |
|---|---|---|
| -er | -ère | [[un boulanger\|アン・ブランジェ]] → [[une boulangère\|ユヌ・ブランジェール]]（パン屋） |
| -eur | -euse | [[un chanteur\|アン・シャントゥール]] → [[une chanteuse\|ユヌ・シャントゥーズ]]（歌手） |
| -teur | -trice | [[un acteur\|アン・ナクトゥール]] → [[une actrice\|ユ・ナクトリス]]（俳優） |
| -ien | -ienne | [[un musicien\|アン・ミュズィスィアン]] → [[une musicienne\|ユヌ・ミュズィスィエンヌ]]（音楽家） |
| -f | -ve | [[un veuf\|アン・ヴフ]] → [[une veuve\|ユヌ・ヴヴ]]（やもめ） |
| -x | -se | [[un époux\|アン・ネプー]] → [[une épouse\|ユ・ネプーズ]]（配偶者） |

**-ien → -ienne** に注目してください。n が重なることで**鼻母音でなくなります**（第0章の条件を思い出してください）。musicien は「ミュズィスィ**アン**」（鼻母音）、musicienne は「ミュズィスィ**エンヌ**」（鼻母音ではない）。この対立は形容詞（bon / bonne）でも同じように現れます。

また、まったく別の語になるものもあります：[[un homme\|アン・ノム\|男]] / [[une femme\|ユヌ・ファム\|女]]、[[un père\|アン・ペール\|父]] / [[une mère\|ユヌ・メール\|母]]、[[un roi\|アン・ロワ\|王]] / [[une reine\|ユヌ・レーヌ\|女王]]。
:::

:::adv 職業名詞の女性形は今も動いている
伝統的に男性形しかなかった職業名詞（médecin, professeur, auteur, ministre）は、20世紀後半から女性形が作られるようになりました。現在の状況は地域で分かれます。

- **ケベック・ベルギー・スイス**：早くから女性形を採用（une professeure, une auteure, une écrivaine）
- **フランス**：アカデミー・フランセーズが長く抵抗しましたが、2019年に容認へ転じました

現在は [[une professeure\|ユヌ・プロフェスール]]、[[une autrice\|ユ・ノトリス]]、[[une écrivaine\|ユ・ネクリヴェーヌ]] などが広く使われます。古い教材では「男性形のまま une femme professeur と言う」と説明されていることがありますが、現在の実際の用法とはずれています。
:::

## 2. 語尾から性を推測する

意味からは分かりませんが、**語尾からはかなりの確度で推測できます**。丸暗記の前に、この規則を知っておくと負担が大きく減ります。

### 男性名詞になりやすい語尾

| 語尾 | 例 |
|---|---|
| -age | [[le fromage\|ル・フロマージュ\|チーズ]]、[[le voyage\|ル・ヴォワヤージュ\|旅行]] |
| -ment | [[le moment\|ル・モマン\|瞬間]]、[[le gouvernement\|ル・グヴェルヌマン\|政府]] |
| -eau | [[le bateau\|ル・バトー\|船]]、[[le château\|ル・シャトー\|城]] |
| -isme | [[le tourisme\|ル・トゥリスム\|観光]]、[[le réalisme\|ル・レアリスム\|写実主義]] |
| -oir | [[le miroir\|ル・ミロワール\|鏡]]、[[le devoir\|ル・ドゥヴォワール\|義務]] |
| 子音で終わる語 | [[le train\|ル・トラン\|列車]]、[[le pont\|ル・ポン\|橋]] |

### 女性名詞になりやすい語尾

| 語尾 | 例 |
|---|---|
| -tion, -sion | [[la nation\|ラ・ナスィオン\|国民]]、[[la décision\|ラ・デスィズィオン\|決定]] |
| -té, -tié | [[la liberté\|ラ・リベルテ\|自由]]、[[l'amitié\|ラミティエ\|友情]] |
| -ure | [[la voiture\|ラ・ヴォワテュール\|車]]、[[la culture\|ラ・キュルテュール\|文化]] |
| -ance, -ence | [[la connaissance\|ラ・コネサンス\|知識]]、[[la science\|ラ・スィアンス\|科学]] |
| -ette | [[la baguette\|ラ・バゲット\|バゲット]]、[[la cigarette\|ラ・スィガレット\|たばこ]] |
| -eur（抽象名詞） | [[la couleur\|ラ・クルール\|色]]、[[la douleur\|ラ・ドゥルール\|痛み]] |
| -e で終わる語 | [[la rue\|ラ・リュ\|通り]]、[[la porte\|ラ・ポルト\|扉]] |

:::warn -age と -eur には落とし穴がある
**-age は原則男性**ですが、次の4語は女性です。頻出なので個別に覚えます。
[[la page\|ラ・パージュ\|ページ]]、[[la plage\|ラ・プラージュ\|浜辺]]、[[l'image\|リマージュ\|画像]]、[[la cage\|ラ・カージュ\|檻]]

**-eur は意味で分かれます**。
- 抽象名詞（性質・感覚）→ **女性**：la couleur, la chaleur（暑さ）, la peur（恐れ）
- 「〜する人・もの」→ **男性**：le chanteur（歌手）, l'ordinateur（コンピュータ）
:::

:::deep 例外として名高い名詞
語尾の規則に反する、頻出かつ試験に出やすい名詞です。

| 名詞 | 性 | なぜ紛らわしいか |
|---|---|---|
| [[le musée\|ル・ミュゼ\|美術館]] | 男性 | -ée は普通は女性（la journée, l'idée） |
| [[le lycée\|ル・リセ\|高校]] | 男性 | 同上 |
| [[la peau\|ラ・ポー\|皮膚]] | 女性 | -eau は普通は男性 |
| [[l'eau\|ロー\|水]] | 女性 | 同上。冠詞が l' になるので性が見えない |
| [[le silence\|ル・スィランス\|沈黙]] | 男性 | -ence は普通は女性 |
| [[la main\|ラ・マン\|手]] | 女性 | 子音終わりは普通は男性 |
| [[la fin\|ラ・ファン\|終わり]] | 女性 | 同上 |
| [[le problème\|ル・プロブレーム\|問題]] | 男性 | -e 終わりは普通は女性 |
| [[le système\|ル・スィステーム\|体系]] | 男性 | 同上 |
:::

:::adv 性が変わると意味が変わる名詞
同じ綴りで、性によって別の語になるものがあります。書き分け・聞き分けの両方で問われます。

| 男性 | 意味 | 女性 | 意味 |
|---|---|---|---|
| [[le livre\|ル・リーヴル]] | 本 | [[la livre\|ラ・リーヴル]] | ポンド（重さ・通貨） |
| [[le tour\|ル・トゥール]] | 一周、順番 | [[la tour\|ラ・トゥール]] | 塔（la Tour Eiffel） |
| [[le poste\|ル・ポスト]] | 職、ポスト | [[la poste\|ラ・ポスト]] | 郵便局 |
| [[le mode\|ル・モード]] | 方法、（文法の）法 | [[la mode\|ラ・モード]] | 流行 |
| [[le manche\|ル・マンシュ]] | 柄 | [[la manche\|ラ・マンシュ]] | 袖（la Manche で英仏海峡） |
| [[le critique\|ル・クリティック]] | 批評家 | [[la critique\|ラ・クリティック]] | 批評 |

第29½章で学ぶ「法（le mode）」が男性名詞なのは、流行（la mode）と区別するためです。
:::

## 3. 名詞の複数形

原則は単純です。**単数形に -s を足す**。

:::ex 規則的な複数形
un livre → des livres | アン・リーヴル → デ・リーヴル | 本
une table → des tables | ユヌ・ターブル → デ・ターブル | 机
un ami → des amis | アン・ナミ → デ・ザミ | 友人
:::

:::warn 複数の -s は発音されない
ここが日本語話者にとって最大の落とし穴です。語末の子音は読まないので、**livre と livres は音がまったく同じ**です。

では話し言葉でどう区別するのか——**冠詞で区別します**。

- [[le livre\|ル・リーヴル\|その本]] / [[les livres\|レ・リーヴル\|それらの本]]
- [[un livre\|アン・リーヴル\|一冊の本]] / [[des livres\|デ・リーヴル\|何冊かの本]]

つまり**フランス語の複数は、名詞ではなく冠詞が担っている**のです。だから第2章の冠詞が決定的に重要になります。

例外的に、次の語では母音が変わるので耳で分かります：[[un œil\|アン・ヌイユ\|片目]] → [[des yeux\|デ・ズィユ\|両目]]、[[un cheval\|アン・シュヴァル\|馬]] → [[des chevaux\|デ・シュヴォー\|馬たち]]。
:::

### 複数形の例外

:::deep 語尾ごとの複数形の作り方（完全版）

**（1）-s, -x, -z で終わる語 → 変化しない**

すでに s 系の音を持っているため、そのままです。
[[le fils\|ル・フィス\|息子]] → les fils、[[le prix\|ル・プリ\|値段]] → les prix、[[le nez\|ル・ネ\|鼻]] → les nez

**（2）-eau, -au, -eu → -x を足す**

[[le bateau\|ル・バトー\|船]] → les bateaux、[[le jeu\|ル・ジュ\|ゲーム]] → les jeux、[[le cheveu\|ル・シュヴー\|髪の毛]] → les cheveux

例外（-s を足す）：[[le pneu\|ル・プヌ\|タイヤ]] → les pneus、[[le bleu\|ル・ブル\|あざ]] → les bleus

**（3）-al → -aux**

[[le journal\|ル・ジュルナル\|新聞]] → les journaux、[[le cheval\|ル・シュヴァル\|馬]] → les chevaux、[[l'animal\|ラニマル\|動物]] → les animaux

例外（-s を足す）：**bal, carnaval, festival, récital, final** の5語。祭りや催しの語が並ぶので、まとめて覚えられます。
[[le festival\|ル・フェスティヴァル\|フェスティバル]] → les festivals

**（4）-ail → 原則 -s、ただし7語だけ -aux**

原則：[[le détail\|ル・デタイユ\|細部]] → les détails

-aux になる7語：**travail, vitrail, corail, émail, bail, soupirail, vantail**
[[le travail\|ル・トラヴァイユ\|仕事]] → [[les travaux\|レ・トラヴォー\|工事]]

工事現場の標識に書いてある travaux は、この複数形です。

**（5）-ou → 原則 -s、ただし7語だけ -x**

原則：[[le trou\|ル・トゥルー\|穴]] → les trous

-x になる7語：**bijou, caillou, chou, genou, hibou, joujou, pou**
（宝石・小石・キャベツ・膝・フクロウ・おもちゃ・シラミ）
フランスの学校では、この7語を語呂で暗記させるのが伝統です。

**（6）まったく不規則なもの**

| 単数 | 複数 | 意味 |
|---|---|---|
| [[un œil\|アン・ヌイユ]] | [[des yeux\|デ・ズィユ]] | 目 |
| [[le ciel\|ル・スィエル]] | [[les cieux\|レ・スィユ]] | 空（詩的・宗教的用法） |
| [[monsieur\|ムシュー]] | [[messieurs\|メスュー]] | 〜氏 |
| [[madame\|マダム]] | [[mesdames\|メダム]] | 〜夫人 |
| [[mademoiselle\|マドモワゼル]] | [[mesdemoiselles\|メドモワゼル]] | 〜嬢 |

monsieur の複数形が messieurs なのは、元が **mon sieur**（私の主）という2語であり、所有形容詞の部分も複数になるからです。
:::

:::adv 複合名詞の複数形
ハイフンでつながれた名詞は、**構成要素の品詞によって**複数にする部分が変わります。

| 型 | 規則 | 例 |
|---|---|---|
| 名詞 + 名詞 | 両方を複数に | un chou-fleur → des choux-fleurs（カリフラワー） |
| 名詞 + 形容詞 | 両方を複数に | un coffre-fort → des coffres-forts（金庫） |
| 動詞 + 名詞 | 動詞は不変 | un ouvre-boîte → des ouvre-boîtes（缶切り） |
| 前置詞 + 名詞 | 名詞のみ | un après-midi → des après-midi（午後、不変も可） |

原則は「**変化しうる品詞（名詞・形容詞）だけが複数になる**」。動詞・前置詞・副詞は変化しません。
:::

## 4. 人を表す名詞の男女 — 現代の動き

:::deep 職業名詞の女性形
人を表す名詞は、性が実際の性別に対応します。女性形の作り方は形容詞（第6章）とほぼ同じです。

| 型 | 男性 | 女性 |
|---|---|---|
| + e | un étudiant | une étudiant**e** |
| -er → -ère | un boulanger | une boulang**ère** |
| -eur → -euse | un vendeur | une vend**euse** |
| -teur → -trice | un acteur | une ac**trice** |
| -ien → -ienne | un musicien | une music**ienne** |
| 同形（冠詞で区別） | un / une artiste, un / une élève, un / une collègue | |

長く「男性形しかない」とされてきた職業名も、現在は女性形が一般化しています：**une professeure**（教員）、**une écrivaine**（作家）、**une auteure / autrice**（著者）、**une ministre**（大臣）。アカデミー・フランセーズも2019年に職業名の女性化を正式に容認しました。**現代のフランス語では女性形を使うのが標準**です。

一方、**性が固定の名詞**もあります：une personne（人）は男性を指しても常に女性名詞、un bébé（赤ちゃん）は女児でも男性名詞。**文法の性は最終的には語に付いた属性**であって、指す相手の性別と常に一致するわけではない——この距離感も含めて掴んでください。

- [[C'est une personne très gentille.|セ・チュヌ・ペルソンヌ・トレ・ジャンティーユ|（男女問わず）とても親切な人です。]]
:::

## 5. 名詞は単独では文に置けない

英語では I like books. と冠詞なしで言えますが、フランス語ではこれができません。**名詞には必ず限定詞（déterminant）が必要**です。

:::ex 名詞は限定詞とセットで使う
J'aime les livres. | ジェーム・レ・リーヴル | 私は本が好きだ。（× J'aime livres.）
Je cherche une maison. | ジュ・シェルシュ・ユヌ・メゾン | 私は家を探している。
:::

限定詞には、冠詞（第2章）、指示形容詞・所有形容詞（第10章）、数詞などが含まれます。**どれか1つは必ず要る**、と覚えてください。

:::deep 限定詞が省略される場合
例外的に限定詞が付かない場合があり、大学の文法では明示的に扱われます。

- **職業・国籍・身分を表す属詞**：[[Je suis étudiant.\|ジュ・スュイ・ゼテュディアン\|私は学生です。]]（冠詞なし。ただし形容詞が付くと必要：Je suis un bon étudiant.）
- **呼びかけ**：[[Bonjour, monsieur.\|ボンジュール・ムシュー\|こんにちは。]]
- **列挙・掲示・標題**：Entrée, plat, dessert.（前菜、主菜、デザート）
- **前置詞 en の後**：[[en France\|アン・フランス\|フランスで]]、[[en voiture\|アン・ヴォワテュール\|車で]]
- **成句**：[[avoir faim\|アヴォワール・ファン\|空腹である]]、[[avoir raison\|アヴォワール・レゾン\|正しい]]
- **de の後の一部**：[[un verre de vin\|アン・ヴェール・ドゥ・ヴァン\|グラス一杯のワイン]]

これらはいずれも「その名詞を個別のモノとして数えていない」場合です。分類・性質・材質を述べているとき、限定詞は落ちます。
:::


:::ai-gen 名詞の性と数、複数形の作り方

## 6. 複数形の例外を音で整理する

複数形は「原則 -s、音は変わらない」でしたが、**音が変わる例外**があります。まとめて確認します。

| 型 | 単数 → 複数 | 音の変化 |
|---|---|---|
| **-al → -aux** | un journal → des journ**aux** | 「ジュルナル」→「ジュルノ」**変わる** |
| **-ail → -aux**（一部） | un travail → des trav**aux** | 「トラヴァイユ」→「トラヴォ」**変わる** |
| **-eau / -eu → -x** | un bateau → des bateau**x** | 変わらない |
| **-s / -x / -z** | un fils → des fils | 変わらない |
| 通常の -s | un livre → des livres | 変わらない |

**音が変わるのは -al と -ail の2型だけ**です。これらは複数形を別語のように覚える必要があります。

:::ex 音が変わる複数形
un journal → des journaux | アン・ジュルナル・デ・ジュルノ | 新聞
un animal → des animaux | アン・ナニマル・デ・ザニモ | 動物
un cheval → des chevaux | アン・シュヴァル・デ・シュヴォ | 馬
le travail → les travaux | ル・トラヴァイユ・レ・トラヴォ | 工事（複数で「工事」の意味） |
un œil → des yeux | アン・ヌイユ・デ・ズィユ | 目（完全に不規則）
:::

**œil → yeux** は最も不規則な複数形です。単数と複数で語形がまったく違い、英語の person → people に近い関係です。

:::warn -al の例外：festival, bal, carnaval
-al で終わっても **-als** になる語があります：des **festivals**、des **bals**（舞踏会）、des **carnavals**、des **récitals**。比較的新しい借用語や固有の語に多く、伝統的な -aux 型に入らなかったものです。

また **travaux** は「工事」、**vacances** は「休暇」のように、**複数形で意味が特化する**名詞もあります。単数の travail は「仕事」、vacance は「空席」——複数形を別の語として辞書に引く価値があります。
:::

第1章で見たとおり、フランス語の名詞は単独では文に置けず、複数の -s は発音されません。つまり**名詞まわりの情報は、ほぼすべて冠詞が担っています**。冠詞は「a / the」に相当する小さな語ではなく、**性・数・特定性・数量を一手に引き受ける中心的な要素**です。

フランス語の冠詞は3系列あります。英語には対応物のない**部分冠詞**を含むため、ここは日本語話者・英語学習者ともにつまずきやすい箇所です。

## 1. 冠詞の全体像

| | 男性単数 | 女性単数 | 複数（男女共通） |
|---|---|---|---|
| **定冠詞**（既知・特定） | le | la | les |
| **不定冠詞**（不特定・数えられる） | un | une | des |
| **部分冠詞**（数えない量） | du | de la | — |

母音・無音の h の前では、**le / la はエリジオンして l'** になり、**du / de la は de l'** になります。

:::ex 冠詞の3系列
le livre | ル・リーヴル | その本（定）
un livre | アン・リーヴル | 一冊の本（不定）
les livres | レ・リーヴル | それらの本（定・複数）
des livres | デ・リーヴル | 何冊かの本（不定・複数）
du vin | デュ・ヴァン | ワイン（ある量の）
de la bière | ドゥ・ラ・ビエール | ビール（ある量の）
l'eau | ロー | その水（エリジオン）
de l'eau | ドゥ・ロー | 水（ある量の）
:::

## 2. 不定冠詞（l'article indéfini）— un, une, des

**聞き手がまだ知らないもの**、**数えられるものの不特定な個体**に付きます。英語の a / an に相当しますが、**複数形 des がある**点が英語と違います。

:::ex 不定冠詞
J'ai un frère. | ジェ・アン・フレール | 私には兄弟が一人いる。
Elle a une voiture. | エラ・ユヌ・ヴォワテュール | 彼女は車を持っている。
Il y a des étudiants. | イリヤ・デ・ゼテュディアン | 学生が何人かいる。
:::

:::note un / une は数詞の「1」でもある
[[un livre\|アン・リーヴル]] は「一冊の本」とも「（ある）本」とも訳せます。フランス語では冠詞と数詞1が同じ語なので、区別は文脈によります。強調したいときは [[un seul livre\|アン・スル・リーヴル\|たった一冊の本]] のように seul を添えます。
:::

## 3. 定冠詞（l'article défini）— le, la, les

定冠詞には**3つの異なる用法**があります。ここを分けずに「the と同じ」と覚えると、必ず行き詰まります。

### （1）特定・既知のものを指す

文脈や状況から、どれを指しているか聞き手に分かる場合です。

:::ex 特定のものを指す
Ferme la porte. | フェルム・ラ・ポルト | ドアを閉めて。（この場のドア）
Le livre que j'ai acheté. | ル・リーヴル・ク・ジェ・アシュテ | 私が買ったその本。（関係節で限定）
:::

### （2）総称 — その種類ぜんぶを指す

**これが英語と最も違う用法です。** 英語では I like books.（無冠詞複数）ですが、フランス語では**定冠詞を使います**。

:::ex 総称用法
J'aime le café. | ジェーム・ル・カフェ | 私はコーヒーが好きだ。（コーヒーというもの一般）
Les Français aiment le vin. | レ・フランセ・エム・ル・ヴァン | フランス人はワインが好きだ。
Le chien est fidèle. | ル・シアン・エ・フィデル | 犬は忠実だ。（犬という動物一般）
:::

:::warn 「好き」の後ろは必ず定冠詞
[[aimer\|エメ\|好む]]、[[adorer\|アドレ\|大好きである]]、[[détester\|デテステ\|嫌う]]、[[préférer\|プレフェレ\|より好む]] の目的語は、**ほぼ常に定冠詞**になります。好き嫌いは「そのもの一般」に対する感情だからです。

- ○ J'aime **le** vin.（ワインが好きだ）
- × J'aime **du** vin.

一方、[[boire\|ボワール\|飲む]] や [[manger\|マンジェ\|食べる]] は実際にある量を摂取するので、部分冠詞になります。
- Je bois **du** vin.（ワインを飲む）

**「好き」は定冠詞、「食べる・飲む」は部分冠詞** —— この対立を第4節で詳しく見ます。
:::

### （3）唯一のもの・固有名詞的なもの

:::ex 唯一のものに付く
le soleil | ル・ソレイユ | 太陽
la France | ラ・フランス | フランス（国名には定冠詞が付く）
le français | ル・フランセ | フランス語（言語名）
le lundi | ル・ランディ | 月曜日はいつも（習慣を表す）
:::

:::deep 定冠詞のその他の用法
大学レベルではここまで扱います。

**（a）身体部位** — 所有形容詞ではなく定冠詞を使う
[[Il a mal à la tête.\|イラ・マル・ア・ラ・テット\|彼は頭が痛い。]]（× à sa tête）
[[Elle ouvre les yeux.\|エルーヴル・レ・ズィユ\|彼女は目を開ける。]]
所有者が主語から明らかなとき、フランス語は所有形容詞を使いません。第18章の間接目的語と組み合わせて [[Je me lave les mains.\|ジュ・ム・ラーヴ・レ・マン\|私は手を洗う。]] のようにも言います。

**（b）単位あたりの値段・頻度**
[[Ça coûte trois euros le kilo.\|サ・クート・トロワ・ズロ・ル・キロ\|1キロ3ユーロだ。]]
[[deux fois la semaine\|ドゥ・フォワ・ラ・スメーヌ\|週に2回]]

**（c）曜日 — 付けるかどうかで意味が変わる**
- [[lundi\|ランディ\|（今度の）月曜に]] … 冠詞なし＝特定の1日
- [[le lundi\|ル・ランディ\|毎週月曜に]] … 定冠詞＝習慣

**（d）最上級**（第14章）
[[la plus belle ville\|ラ・プリュ・ベル・ヴィル\|最も美しい町]] — 最上級には必ず定冠詞が付きます。

**（e）国名・地名**
[[la France\|ラ・フランス]]、[[le Japon\|ル・ジャポン]]、[[les États-Unis\|レ・ゼタジュニ]]。ただし都市名には原則付きません（Paris, Tokyo）。例外的に付く都市もあります（Le Havre, La Rochelle）。
:::

## 4. 部分冠詞（l'article partitif）— du, de la

**英語にない冠詞です。** 数えられないもの、あるいは「全体のうちの一部・ある量」を表します。

| | 形 |
|---|---|
| 男性名詞の前 | **du**（de + le の縮約） |
| 女性名詞の前 | **de la** |
| 母音・無音の h の前 | **de l'** |

:::ex 部分冠詞
Je bois du café. | ジュ・ボワ・デュ・カフェ | 私はコーヒーを飲む。
Elle mange de la viande. | エル・マンジュ・ドゥ・ラ・ヴィアンド | 彼女は肉を食べる。
Il boit de l'eau. | イル・ボワ・ドゥ・ロー | 彼は水を飲む。
Tu as de la chance ! | テュ・ア・ドゥ・ラ・シャンス | 君は運がいいね！
:::

:::note 「切り分けられるかどうか」で考える
部分冠詞のイメージは「**塊から切り取ってきた一部**」です。

- [[du pain\|デュ・パン\|パン]] … パンという塊から切り取った、ある量
- [[un pain\|アン・パン\|パン1個]] … 1個の完結したパン
- [[le pain\|ル・パン\|パン（一般）]] … パンというもの全体

同じ名詞でも、冠詞が変われば見え方が変わります。これがフランス語の冠詞体系の核心です。
:::

:::deep 抽象名詞にも部分冠詞が付く
部分冠詞は食べ物だけのものではありません。**量として捉えられる抽象名詞**にも付きます。

:::ex 抽象名詞の部分冠詞
Il a du courage. | イラ・デュ・クラージュ | 彼には勇気がある。
Elle fait de la musique. | エル・フェ・ドゥ・ラ・ミュズィック | 彼女は音楽をやっている。
Vous avez de la patience. | ヴザヴェ・ドゥ・ラ・パスィアンス | あなたには忍耐力がある。
Il y a du vent. | イリヤ・デュ・ヴァン | 風がある（風が吹いている）。
:::

とくに **faire + 部分冠詞** はスポーツ・芸術・学問の活動を表す定型です。
[[faire du sport\|フェール・デュ・スポール\|スポーツをする]]、[[faire de la danse\|フェール・ドゥ・ラ・ダンス\|ダンスをする]]、[[faire du piano\|フェール・デュ・ピアノ\|ピアノを習う]]

天候表現（第15章）でも [[il fait du soleil\|イル・フェ・デュ・ソレイユ\|晴れている]] のように使われます。
:::

:::warn 3つの冠詞を並べて比べる
同じ名詞 café で、冠詞だけを入れ替えてみます。

| 文 | 意味 |
|---|---|
| [[J'aime le café.\|ジェーム・ル・カフェ]] | コーヒーが好きだ（総称・定冠詞） |
| [[Je bois du café.\|ジュ・ボワ・デュ・カフェ]] | コーヒーを飲む（ある量・部分冠詞） |
| [[Je prends un café.\|ジュ・プラン・アン・カフェ]] | コーヒーを1杯飲む（1個体・不定冠詞） |

**動詞が冠詞を決めている**のが分かります。冠詞は名詞だけを見て選ぶものではありません。
:::

## 5. de による冠詞の変形

ここからが、大学の文法で必ず問われる領域です。**冠詞は de と出会うと形を変えます。**

### （1）否定の de — 否定文では un / une / des / du / de la が de になる

:::ex 否定の de
J'ai un frère. → Je n'ai pas de frère. | ジュ・ネ・パ・ドゥ・フレール | 私に兄弟はいない。
Je bois du café. → Je ne bois pas de café. | ジュ・ヌ・ボワ・パ・ドゥ・カフェ | 私はコーヒーを飲まない。
Il y a des chaises. → Il n'y a pas de chaises. | イル・ニヤ・パ・ドゥ・シェーズ | 椅子はない。
:::

**理屈**：不定冠詞と部分冠詞は「ある量・ある個数」を表します。否定するとその量がゼロになり、量を示す機能が消えるため、中身のない de だけが残るのです。

:::warn 否定の de には2つの重要な例外がある

**（a）定冠詞は変わらない**
定冠詞は量ではなく特定性を表すので、否定しても形が変わりません。
[[Je n'aime pas le café.\|ジュ・ネーム・パ・ル・カフェ\|私はコーヒーが好きではない。]]（× pas de café）

**（b）être の後ろでは変わらない**
être は「量」ではなく「同一性」を述べる動詞なので、否定しても冠詞はそのままです。
[[Ce n'est pas un problème.\|ス・ネ・パ・ザン・プロブレーム\|それは問題ではない。]]（× pas de problème）

この2つの例外は、いずれも「**否定される冠詞が量を表していない**」という同じ理由から出ています。
:::

### （2）des → de：形容詞が名詞の前に来るとき

複数の不定冠詞 des は、**形容詞が名詞の前に置かれると de に変わります**。

:::ex des → de
des amis → de bons amis | ドゥ・ボン・ザミ | 良い友人たち
des fleurs → de belles fleurs | ドゥ・ベル・フルール | 美しい花々
des enfants → de petits enfants | ドゥ・プティ・ザンファン | 小さな子どもたち
:::

:::adv この規則は書き言葉のもの
規範文法では義務とされますが、**現代の話し言葉では des のまま言うのが普通**です（des bons amis）。書き言葉・改まった文体では de を使う、と理解してください。試験では de が求められます。

なお、形容詞と名詞が固く結びついて1語のようになっている場合は des のままです：[[des jeunes filles\|デ・ジュヌ・フィーユ\|少女たち]]、[[des petits pois\|デ・プティ・ポワ\|グリーンピース]]。
:::

### （3）数量表現の後ろ — 冠詞が消えて de だけになる

**量を表す語の後ろでは、冠詞が完全に消えます。**

:::ex 数量表現 + de + 無冠詞名詞
beaucoup de livres | ボクー・ドゥ・リーヴル | たくさんの本
un peu de sucre | アン・プ・ドゥ・スュクル | 少しの砂糖
trop de travail | トロ・ドゥ・トラヴァイユ | 仕事が多すぎる
assez d'argent | アセ・ダルジャン | 十分なお金
une tasse de café | ユヌ・タス・ドゥ・カフェ | コーヒー1杯
un kilo de pommes | アン・キロ・ドゥ・ポム | りんご1キロ
:::

**理屈**：量を表す語（beaucoup, peu, une tasse…）がすでに数量の情報を持っているので、冠詞が重ねて量を示す必要がなくなります。

:::warn la plupart de と bien de は例外
数量表現でも、次の2つは**定冠詞を保ちます**。
- [[la plupart des étudiants\|ラ・プリュパール・デ・ゼテュディアン\|大部分の学生]]
- [[bien des gens\|ビアン・デ・ジャン\|多くの人々]]

la plupart は「（あるまとまりの）大部分」なので、そのまとまりを定冠詞で特定する必要があるためです。
:::

:::deep de の3つの用法を見分ける
ここまでで de が3通り出てきました。混同しやすいので整理します。

| 用法 | 形 | 例 |
|---|---|---|
| 否定の de | 冠詞が de に**置き換わる** | pas **de** café |
| des → de | des だけが de に**なる** | **de** bons amis |
| 数量の de | 数量語 + de + **無冠詞** | beaucoup **de** livres |
| 部分冠詞 du / de la | de + 定冠詞の**縮約**（第7章） | **du** café |
| 前置詞 de + 定冠詞 | 所有・起点（第7章） | le livre **du** professeur |

最後の2つは形が同じ du ですが、機能が違います。[[Je bois du café.\|ジュ・ボワ・デュ・カフェ\|コーヒーを飲む]]（部分冠詞）と [[Je viens du Japon.\|ジュ・ヴィアン・デュ・ジャポン\|日本から来た]]（前置詞 de + le）は、同じ du でも別物です。第7章でこの縮約を扱います。
:::

## 6. 冠詞の選択を場面で固定する — 食べ物の文法

:::deep 「コーヒー」が3通りに言える理由
同じ名詞でも、**どう関わるかで冠詞が変わります**。café で3つの冠詞を使い分けてみます。

| 文 | 冠詞 | 何を言っているか |
|---|---|---|
| J'aime **le** café. | 定冠詞（総称） | コーヒーというものが好き |
| Je bois **du** café. | 部分冠詞 | コーヒーをいくらか飲む |
| Je voudrais **un** café. | 不定冠詞 | コーヒーを1杯ください |

**好み（総称）は le、量を扱うなら du、数えるなら un**。カフェで注文するときは un café（1杯）で、部分冠詞は使いません。「1杯」と数えているからです。

食事の場面はこの3点セットの練習場です。

:::ex 食卓の冠詞
Tu aimes le fromage ? | チュ・エム・ル・フロマージュ | チーズは好き？（総称）
Il y a du fromage dans le frigo. | イ・リ・ヤ・デュ・フロマージュ・ダン・ル・フリゴ | 冷蔵庫にチーズがあるよ。（量）
J'ai acheté un fromage de chèvre. | ジェ・アシュテ・アン・フロマージュ・ドゥ・シェーヴル | ヤギのチーズを1つ買った。（個体）
Je ne mange pas de fromage. | ジュ・ヌ・マンジュ・パ・ドゥ・フロマージュ | チーズは食べません。（否定の de）
:::

**否定の de** も合わせると4役です。1つの名詞にこの4つの文が言えるようになれば、冠詞の章は卒業です。
:::

## 7. 冠詞が付かない場合

第1章でも触れましたが、冠詞体系の一部として整理しておきます。

| 条件 | 例 |
|---|---|
| 職業・国籍・宗教（être の属詞） | [[Je suis étudiant.\|ジュ・スュイ・ゼテュディアン\|私は学生だ。]] |
| 呼びかけ | [[Bonjour, madame.\|ボンジュール・マダム]] |
| 前置詞 en の後 | [[en France\|アン・フランス]]、[[en été\|アン・ネテ\|夏に]] |
| 数量表現の de の後 | beaucoup de livres |
| 成句 | [[avoir faim\|アヴォワール・ファン\|空腹だ]]、[[avoir soif\|アヴォワール・ソワフ\|喉が渇いた]] |
| 列挙・掲示・見出し | Entrée, plat, dessert. |

:::note 職業に形容詞が付くと冠詞が復活する
- [[Je suis professeur.\|ジュ・スュイ・プロフェスール\|私は教師だ。]]（無冠詞＝分類を述べている）
- [[Je suis un bon professeur.\|ジュ・スュイ・ザン・ボン・プロフェスール\|私は良い教師だ。]]（形容詞が付くと個別化されるので冠詞が要る）

無冠詞は「その名詞をモノとして数えていない」しるしだ、という原則がここでも効いています。
:::


:::ai-gen 定冠詞・不定冠詞・部分冠詞の使い分け、否定の de

## 8. 無冠詞になる場所 — 冠詞の「消えるポイント」

冠詞は原則必須ですが、**決まった構文の中では消えます**。消える場所を列挙しておくと、読解で戸惑いません。

| 場所 | 例 |
|---|---|
| **職業・身分の属詞** | Il est **médecin**.（彼は医者だ） |
| **avoir の熟語** | avoir **faim** / **soif** / **peur** / **raison** / **besoin de** |
| **前置詞 en の後** | en **France**、en **voiture**、en **été** |
| **手段・様態の par / sans / avec** | par **avion**、sans **sucre**、avec **plaisir** |
| **同格** | Paris, **capitale** de la France |
| **列挙** | Hommes, femmes, enfants : tout le monde courait. |
| **看板・見出し** | Maison à vendre.（売家） |

:::ex 無冠詞の実例
Elle est professeure. | エ・レ・プロフェスール | 彼女は教員です。
J'ai sommeil. | ジェ・ソメイユ | 眠い。
Il voyage en train, sans bagages. | イル・ヴォワヤージュ・アン・トラン・サン・バガージュ | 彼は列車で、荷物なしで旅する。
Avec plaisir ! | アヴェック・プレズィール | 喜んで！
:::

とくに **avoir + 無冠詞名詞**（faim / soif / peur / sommeil / raison / tort / envie / besoin）は熟語のかたまりで、「空腹・渇き・恐れ」などの**状態が形容詞のように**働いています。だから très が付けられるのでした（J'ai très faim. 第6.5章）。

逆に、**Il est médecin.** と **C'est un médecin.** の対（属詞は無冠詞、c'est の後は冠詞つき）は第4章で見たとおりです。無冠詞は「名詞が個体でなく資格・状態を表すとき」に起きる——と一般化して覚えてください。

## 9. 冠詞の選択がつまずく5つの場面

冠詞の規則はここまでで揃いました。実際に迷いやすい場面を、判断つきで並べておきます。

**（1）好み・総称 → 定冠詞**

J'aime **le** vin.（ワインが好き）／ **Les** chats sont indépendants.（猫は独立している）
好みの動詞（aimer / adorer / détester / préférer）と一般論は**必ず定冠詞**です。

**（2）食べる・飲む・買う → 部分冠詞か不定冠詞**

Je bois **du** vin.（ワインを飲む）／ J'achète **une** bouteille.（1本買う）
量なら du、個数なら un。

**（3）否定文 → de**（ただし定冠詞は残る）

Je ne bois pas **de** vin.（不定・部分冠詞 → de）
Je n'aime pas **le** vin.（定冠詞はそのまま——総称は否定しても総称）

**（4）être の属詞（職業・国籍）→ 無冠詞**

Il est **professeur**.（× un professeur）
ただし **C'est un professeur.** は冠詞つき（第4章）。

**（5）数量表現の後 → de のみ**

beaucoup **de** livres、un peu **d'**eau、un kilo **de** pommes
× beaucoup des livres（des livres が「その本」を指す特定の場合のみ可）

:::warn beaucoup de と beaucoup des
- **beaucoup de livres**（たくさんの本——不特定）
- **beaucoup des livres que j'ai lus**（私が読んだ本のうちの多く——特定の集合から）

des が現れるのは、**de + 定冠詞 les**（その本のうちの）という縮約のときだけです。ふつうの「たくさんの〜」は必ず **de + 無冠詞**。日本語話者が最も落としやすい点の1つです。
:::

**判断の順序**をまとめると：①総称・特定か → 定冠詞、②数えるか量るか → un / du、③否定か → de、④属詞か → 無冠詞、⑤数量表現の後か → de。この5問を順に当てれば、ほとんどの場面で冠詞は決まります。

  sub: 'わたしは、君は、彼は',
  body: `
フランス語の動詞は主語に応じて形を変えます。しかもその変化は**主語の人称が分からないと決まりません**。したがって動詞に入る前に、主語人称代名詞を固めておく必要があります。

日本語の「私は」「君は」と単純に対応するわけではなく、**tu と vous の使い分け**、**on の多義性**という2つの厄介な問題があります。どちらもフランス語圏の社会習慣と結びついているので、文法規則としてだけでなく用法として理解してください。

## 1. 主語人称代名詞の全体像

| | 単数 | 複数 |
|---|---|---|
| **1人称** | je（私は） | nous（私たちは） |
| **2人称** | tu（君は） | vous（あなたは／あなたたちは） |
| **3人称・男性** | il（彼は／それは） | ils（彼らは／それらは） |
| **3人称・女性** | elle（彼女は／それは） | elles（彼女らは／それらは） |
| **不定** | on（人は／私たちは） | — |

:::ex 主語人称代名詞
je | ジュ | 私は
tu | テュ | 君は
il | イル | 彼は、それは
elle | エル | 彼女は、それは
on | オン | 人は、私たちは
nous | ヌー | 私たちは
vous | ヴー | あなたは、あなたたちは
ils | イル | 彼らは、それらは
elles | エル | 彼女らは、それらは
:::

:::warn 音では区別できない対がある
- **il と ils** は完全に同音です（どちらも「イル」）。
- **elle と elles** も完全に同音です（どちらも「エル」）。

書けば区別できますが、聞くだけでは単複が分かりません。では何で分かるのか——**動詞の形と、リエゾン**です。

- [[il est\|イ・レ\|彼は〜である]] / [[ils sont\|イル・ソン\|彼らは〜である]] … 動詞が違う
- [[il aime\|イ・レーム\|彼は好きだ]] / [[ils aiment\|イル・ゼーム\|彼らは好きだ]] … リエゾンの [z] があるかどうか

母音で始まる動詞では、**リエゾンだけが単複を区別している**ことになります。第0章で ils ont / ils sont を練習したのはこのためです。
:::

:::note je は必ずエリジオンする
je は母音・無音の h で始まる動詞の前で **j'** になります。これは義務です。

[[j'aime\|ジェーム\|私は好きだ]]、[[j'habite\|ジャビット\|私は住んでいる]]、[[j'ai\|ジェ\|私は持っている]]

なお、フランス語の je は文中では**小文字**のままです（英語の I とは違います）。
:::

## 2. tu と vous — 距離を選ぶということ

フランス語には「あなた」が2つあります。**どちらを使うかは文法ではなく人間関係の選択**であり、間違えると失礼になったり、逆に他人行儀になったりします。

| | 使う相手 |
|---|---|
| **tu**（tutoyer） | 家族、友人、恋人、子ども、同年代の学生同士、動物、神 |
| **vous** | 初対面の人、目上の人、店員と客、公的な場面、**複数の相手**（親しくても） |

:::warn vous には2つの意味がある
vous は「**あなた（1人・丁寧）**」と「**あなたたち（複数）**」の両方を表します。したがって動詞が vous に対応していても、相手が1人か複数かは文脈で判断します。

この違いは**形容詞や過去分詞の一致**に現れます。
- [[Vous êtes gentil.\|ヴー・ゼット・ジャンティ\|あなたは親切ですね。]] … 男性1人（gentil は単数形）
- [[Vous êtes gentils.\|ヴー・ゼット・ジャンティ\|あなたたちは親切ですね。]] … 複数（gentils）

音は同じですが、書き分けが必要です。
:::

:::deep tutoyer と vouvoyer は動詞になっている
フランス語には、この使い分けを表す動詞そのものがあります。

- [[tutoyer\|テュトワイエ\|tu で話しかける]]
- [[vouvoyer\|ヴヴワイエ\|vous で話しかける]]

関係が近づいたときには、こう切り出します。
[[On peut se tutoyer ?\|オン・プ・ス・テュトワイエ\|tu で話しませんか？]]

**原則として、tu への移行は目上の側・年長の側から提案します。** 学生が教授に、客が店員に、いきなり tu を使うのは失礼にあたります。

近年は職場でも tu が広がっていますが（とくにスタートアップや若い業界）、公的機関・接客・年配の相手では vous が依然として標準です。**迷ったら vous** が安全な判断です。
:::

## 3. on — 最も使われ、最も説明が難しい代名詞

on は文法上は**3人称単数**として扱われ、動詞は il / elle と同じ形になります。しかし意味は3通りに分かれます。

### （1）nous の代用 — 話し言葉ではこれが圧倒的

:::ex on = nous（私たち）
On y va ! | オ・ニ・ヴァ | 行こう！
On mange à midi. | オン・マンジュ・ア・ミディ | 私たちは正午に食べる。
Qu'est-ce qu'on fait ? | ケス・コン・フェ | 私たち、何をする？
:::

**現代の話し言葉では、nous はほとんど使われず on に置き換わっています。** 「私たちは食べる」は書き言葉で nous mangeons、話し言葉で on mange です。動詞が短くなるぶん言いやすいのが理由です。

:::warn on = nous のとき、形容詞は複数形になる
動詞は3人称単数（on est）ですが、**意味は複数**なので、形容詞や過去分詞は複数で一致します。

[[On est contents.\|オ・ネ・コンタン\|私たちは満足している。]]（× content）
[[On est allés au cinéma.\|オ・ネ・タレ・オ・スィネマ\|私たちは映画に行った。]]（× allé）

「動詞は単数、一致は複数」という、文法上のねじれが起きます。ここは試験で頻出です。
:::

### （2）不特定の人 — 英語の one / they / people

:::ex on = 一般の人々
En France, on dîne tard. | アン・フランス・オン・ディーヌ・タール | フランスでは夕食が遅い。
On ne sait jamais. | オン・ヌ・セ・ジャメ | 分からないものだ。
Ici, on parle français. | イスィ・オン・パルル・フランセ | ここではフランス語が話されています。
:::

### （3）受動の代用

行為者を言いたくない・言う必要がないとき、フランス語は受動態（第28章）よりも on を好みます。

:::ex on で受動を表す
On m'a volé mon sac. | オン・マ・ヴォレ・モン・サック | 鞄を盗まれた。
On a construit ce pont en 1900. | オ・ナ・コンストリュイ・ス・ポン | この橋は1900年に建てられた。
:::

:::deep on の語源が用法を説明する
on は、ラテン語の **homo（人）** に由来する古フランス語の名詞 **hom / on**（＝人）がそのまま代名詞になったものです。英語の man が「人」と「男」の両方を意味していたのと同じ構図です。

「人」という名詞だったからこそ：
- **3人称単数**の動詞を取る（名詞だったので）
- 意味は「（不特定の）人」（本来の意味）
- 定冠詞の名残として、改まった文体では **l'on** という形が使われる

[[si l'on veut\|スィ・ロン・ヴ\|もし望むなら]]、[[où l'on va\|ウー・ロン・ヴァ\|人が行くところ]]

l'on は、si / où / et / ou / que の直後で、音の衝突（qu'on が「コン」と聞こえるのを避けるなど）を防ぐために使われます。意味は on と変わりません。
:::

## 4. il / elle の2つの顔

il と elle は「彼／彼女」だけでなく、**モノを指す「それ」**でもあります。第1章で見たとおり、すべての名詞に性があるからです。

:::ex il / elle はモノも指す
Le livre ? Il est sur la table. | ル・リーヴル・イ・レ・スュル・ラ・ターブル | その本？ 机の上にあります。
La voiture ? Elle est rouge. | ラ・ヴォワテュール・エ・レ・ルージュ | その車？ 赤いです。
:::

英語なら it を使うところで、フランス語は名詞の性に従って il か elle を選びます。**「モノだから il」ではありません。**

### 混合グループは ils になる

:::warn 男女が混ざると男性形
男性が1人でも含まれていれば、全体を指す代名詞は **ils** になります。

- 女性99人 + 男性1人 → **ils**
- 女性だけ → elles

同じ規則が形容詞の一致にも適用されます（第6章）。この規則は現在も規範文法として維持されていますが、社会的な議論の対象にもなっており、包摂的表記（écriture inclusive）を用いる書き手は iels のような新しい形を使うこともあります。試験では従来の規則で答えてください。
:::

### 非人称の il — 誰も指さない il

天候や時刻を表す文では、il は**何も指しません**。文法上、主語の位置を埋めるためだけに置かれます。

:::ex 非人称の il
Il pleut. | イル・プル | 雨が降っている。
Il fait beau. | イル・フェ・ボー | 天気がいい。
Il est trois heures. | イ・レ・トロ・ザール | 3時です。
Il faut partir. | イル・フォ・パルティール | 出発しなければならない。
:::

英語の It is raining. の it と同じ役割です。第15章でまとめて扱います。

## 5. 主語代名詞は省略できない

日本語では「行く」だけで文になりますが、フランス語では**主語代名詞を落とせません**。

:::ex 主語は必須
× Suis étudiant. → ○ Je suis étudiant. | ジュ・スュイ・ゼテュディアン | 私は学生です。
:::

例外は**命令法だけ**です（第16章）。[[Viens !\|ヴィアン\|来い！]] のように主語を置きません。

:::adv イタリア語・スペイン語との違い
イタリア語やスペイン語は主語代名詞を省略できます（sono studente / soy estudiante）。省略できるのは、動詞の語尾が人称ごとにはっきり違うため、語尾だけで主語が分かるからです。

フランス語は第0章で見たとおり**語末の子音が発音されない**ので、je parle / tu parles / il parle / ils parlent が**すべて同じ音**になってしまいました。語尾が人称を区別できなくなった結果、**主語代名詞が人称を担うようになった**のです。

つまり「主語を省略できない」ことと「活用の語尾が同音になる」ことは、同じ歴史的変化の表と裏です。第8章で -er 動詞の活用表を見るとき、この点を思い出してください。
:::

## 6. tu と vous の実務 — 切り替えの作法

:::deep tutoyer / vouvoyer — 「タメ口にしようか」の言い方
tu で話すことを **tutoyer**、vous で話すことを **vouvoyer** と言います。動詞が1語ずつあること自体が、この区別の重さを物語っています。

**vous から tu への切り替えは、申し出てから行うのが作法**です。

- [[On peut se tutoyer ?|オン・プ・ス・テュトワイエ|タメ口で話さない？]]
- [[Tu peux me tutoyer.|チュ・プ・ム・テュトワイエ|tu でいいですよ。]]

目安になる実態をいくつか：

- **職場**：フランスの多くの職場では同僚同士は tu が普通（業界差あり。伝統的な企業・官庁は vous が残る）
- **店・窓口**：知らない大人同士は常に vous。店員に tu を使うのは失礼
- **ネット・SNS**：tu が既定
- **家族・友人・子ども・ペット**：常に tu。子どもには初対面でも tu
- **神への祈り**：伝統的に tu（親密さの tu）

**迷ったら vous から始めて、相手が tu にしたら合わせる**——これが安全な運用です。年上・目上から切り替えを申し出るのが原則で、学習者が自分から On se tutoie ? と言うのは、同年代のくだけた場なら自然です。

なお、tu と vous を1つの会話の中で混ぜるのは強い違和感を生みます。所有形容詞（ton / votre）や命令形も**必ず同じ側で揃えます**（第10章）。
:::

## 7. 耳で人称を聞き分ける — リエゾンが決め手

:::deep il a と ils ont — 単複は s ではなく音で分かる
主語代名詞の単数と複数は、**綴りの s では聞き分けられません**（s は読まないから）。決め手は**リエゾンの子音**です。

| 単数 | 複数 | 聞き分け |
|---|---|---|
| il a「イ・ラ」 | ils **ont**「イル・**ゾ**ン」 | **[z]** が出たら複数 |
| il est「イ・レ」 | ils **sont**「イル・ソン」 | 動詞自体が違う |
| il aime「イ・レーム」 | ils **aiment**「イル・**ゼ**ーム」 | **[z]** が出たら複数 |
| elle arrive | elles **arrivent**「エル・**ザ**リーヴ」 | **[z]** が出たら複数 |

母音で始まる動詞では、**複数の s がリエゾンして [z] の音になる**——これが唯一の手がかりです。il aime / ils aiment は [z] の有無だけで区別されます。

逆に、子音で始まる動詞（il parle / ils parlent）は**単複がまったく同じ音**です。文脈か、周囲の語（tous, deux …）で判断するしかありません。フランス語の聞き取りでは「分からないものは分からない」と割り切る場面があることも、知識として大切です。

なお **on** は常に単数扱いなので、リエゾンは on a「オ・ナ」、on est「オ・ネ」となります。会話で nous の代わりに on が好まれる理由の1つは、**この単純さ（活用が il と同じ）**にあります。
:::

## 8. 話し言葉の主語 — 名詞 + 代名詞の二重化

:::deep Mon père, il travaille à Lyon. — 口語の標準形
書き言葉では Mon père travaille à Lyon. ですが、**話し言葉では名詞主語を代名詞で受け直す**形が極めて普通です。

:::ex 主語の二重化
Mon père, il travaille à Lyon. | モン・ペール・イル・トラヴァイユ | 父はリヨンで働いてるんだ。
Marie, elle vient ce soir ? | マリ・エル・ヴィヤン・ス・ソワール | マリって今夜来るの？
Les Français, ils mangent tard. | レ・フランセ・イル・マンジュ・タール | フランス人って夕食が遅いんだよ。
Moi, mon frère, il est médecin. | モワ・モン・フレール・イ・レ・メドサン | うちの兄なんか医者でさ。
:::

これは第22章で扱う**遊離構文**の主語版で、「〜はね」と主題を立てる話し方です。**くだけた会話ではこちらが多数派**になるほど浸透しています。書き言葉では使わないこと、聞き取りでは「名詞 + 代名詞」を二重に数えないことが実務です。

**vous（敬称単数）の一致**も確認しておきます。動詞は常に2人称複数形ですが、**属詞の形容詞・過去分詞は実際の人数と性**に合わせます。

- Vous êtes **gentil**.（男性1人に）／ Vous êtes **gentille**.（女性1人に）
- Vous êtes **gentils**.（複数に）

動詞の形（êtes）は変わらないのに一致だけ動く——vous の二役（敬称・複数）が形容詞に現れる箇所です。
:::

## 9. être の活用

主語が揃ったので、最重要動詞 être（〜である）を活用させてみましょう。**すべての複合時制の助動詞にもなる**ため、最優先で覚える動詞です。

:::conj être présent

:::note 表の見方
- どの行もクリックすると発音が鳴ります
- 「同じ音」を押すと、**tu es** と **il est** に印が付きます。この2つは綴りが違うのに、どちらも「エ」と発音され、区別できません
- 「語幹と語尾」を押しても色分けされないのは、être が語幹と語尾に分解できない完全な不規則動詞だからです
:::

:::ex être を使ってみる
Je suis japonais. | ジュ・スュイ・ジャポネ | 私は日本人です。
Tu es étudiant ? | テュ・エ・ゼテュディアン | 君は学生？
Elle est française. | エ・レ・フランセーズ | 彼女はフランス人です。
Nous sommes à Paris. | ヌー・ソム・ザ・パリ | 私たちはパリにいます。
Vous êtes gentil. | ヴー・ゼット・ジャンティ | あなたは親切ですね。
Ils sont contents. | イル・ソン・コンタン | 彼らは満足しています。
:::

:::warn 国籍・職業には冠詞を付けない
[[Je suis étudiant.\|ジュ・スュイ・ゼテュディアン\|私は学生です。]]（× un étudiant）

第2章で見たとおり、être の後ろで身分・職業・国籍を述べるときは無冠詞です。ただし形容詞が付くと冠詞が復活します：Je suis **un bon** étudiant.

なお国籍を表す語は、**形容詞なら小文字、名詞なら大文字**で書き分けます。
- [[Je suis français.\|ジュ・スュイ・フランセ\|私はフランス人です。]]（形容詞・小文字）
- [[un Français\|アン・フランセ\|一人のフランス人]]（名詞・大文字）
:::


:::ai-gen 主語人称代名詞、on の用法、être の活用

## 9. くだけた話し言葉の主語 — t'as, y'a

聞き取りのために、**話し言葉で主語代名詞がどう縮むか**も知っておきましょう（自分で書く必要はありません）。

| 書き言葉 | くだけた発音 | 例 |
|---|---|---|
| tu as / tu es | **t'as / t'es** | T'as vu ?（見た？）／ T'es où ?（どこ？） |
| il y a | **y'a**「ヤ」 | Y'a quelqu'un ?（誰かいる？） |
| il ne faut pas | **faut pas**「フォパ」 | Faut pas exagérer.（大げさだよ） |
| je suis | **chuis**「シュイ」 | Chuis fatigué.（疲れた） |
| je ne sais pas | **j'sais pas**「シェパ」 | 知らない |

規範文法では tu はエリジオンしません（je → j' はするのに tu → t' はしない）が、**話し言葉では t'as / t'es が完全に定着**しています。映画・ドラマ・SNS ではこちらが多数派です。

- 書く：Tu as raison. ／ 聞こえる：T'as raison.「タ・レゾン」
- 書く：Il y a un problème. ／ 聞こえる：Y'a un problème.「ヤ・アン・プロブレム」

**「教科書の形」と「耳に入る形」の対応表**を持っておくことが、リスニングの最初の壁を越える鍵です。

## 10. 主語代名詞の全体表 — 3系列の対応

この章の主語代名詞は、第17〜19章で学ぶ他の系列と**同じ人称の別の顔**です。全体を1枚にしておきます。

| 人称 | 主語 | 直接目的語 | 間接目的語 | 強勢形 | 再帰 |
|---|---|---|---|---|---|
| 1単 | **je** | me | me | **moi** | me |
| 2単 | **tu** | te | te | **toi** | te |
| 3単男 | **il** | le | lui | **lui** | se |
| 3単女 | **elle** | la | lui | **elle** | se |
| 不定 | **on** | — | — | **soi** | se |
| 1複 | **nous** | nous | nous | **nous** | nous |
| 2複 | **vous** | vous | vous | **vous** | vous |
| 3複男 | **ils** | les | leur | **eux** | se |
| 3複女 | **elles** | les | leur | **elles** | se |

観察できることが3つあります。

- **nous / vous は5系列すべて同形**——覚える負担がない
- **形が分かれるのは3人称**（le / la / les と lui / leur、lui / elle と eux / elles）。だから代名詞の学習は3人称が山場になる
- **je / tu には強勢形が別にある**（moi / toi）が、3人称の男性は lui が間接目的語と強勢形を兼ねる——文脈と位置で判別する

**lui の二役**は混乱の元なので確認しておきます。

- Je **lui** parle.（彼**に**話す）——動詞の前＝間接目的語
- Je parle avec **lui**.（彼**と**話す）——前置詞の後＝強勢形

**位置が役割を決める**——フランス語の代名詞体系を貫く原則です。この表は第26.5章（代名詞の併用）まで参照し続けることになります。

  body: `
「これは〜です」「〜があります」——モノを指し示したり、存在を述べたりする表現です。文法的には難しくありませんが、**c'est と il est の使い分け**という、フランス語で最も間違えられる問題がここに含まれます。大学レベルではこの区別を体系的に理解しておく必要があります。

## 1. voici / voilà — 指し示す

英語の here is / there is にあたりますが、実際には**話し手が相手の注意を向けさせる**表現です。

| 表現 | 距離 | 意味 |
|---|---|---|
| **voici** | 近い | ここに〜がある、こちらが〜です |
| **voilà** | 遠い | そこに〜がある、それが〜です |

:::ex voici / voilà
Voici mon frère. | ヴォワスィ・モン・フレール | こちらが私の兄です。
Voilà la gare. | ヴォワラ・ラ・ガール | あそこが駅です。
Voici votre café. | ヴォワスィ・ヴォートル・カフェ | コーヒーをどうぞ。
:::

:::deep voici / voilà の正体は命令形
この2語は、動詞 **voir**（見る）の古い命令形 **vois**（見よ）に、副詞 **ci**（ここ）／**là**（そこ）が付いたものです。

- vois + ci → **voici**（ここを見よ）
- vois + là → **voilà**（そこを見よ）

だから**主語も動詞も要りません**。それ自体が動詞的な力を持つ「提示詞（présentatif）」という特殊な語です。

このことは代名詞の位置にも現れます。目的語代名詞は voici / voilà の**前**に置かれます（第17章の規則どおり、動詞の前）。
[[Me voici !\|ム・ヴォワスィ\|ここにいるよ！]]、[[Le voilà.\|ル・ヴォワラ\|ほら、あれだ。]]
:::

:::note 実際の会話では voilà が万能
現代の話し言葉では、距離に関係なく **voilà** がほぼすべてを引き受けます。voici は書き言葉や改まった場面に残っている程度です。

さらに voilà は「はい、どうぞ」「そういうこと」「以上です」といった間投詞としても多用されます。フランス人の会話を聞いていると最も耳にする語の1つです。
[[Voilà !\|ヴォワラ\|はい、どうぞ／そのとおり／以上です]]
:::

## 2. il y a — 存在を述べる

英語の there is / there are にあたります。**単数・複数を問わず、形は常に il y a** です。

:::ex il y a
Il y a un chat dans le jardin. | イリヤ・アン・シャ・ダン・ル・ジャルダン | 庭に猫が一匹いる。
Il y a des étudiants ici. | イリヤ・デ・ゼテュディアン・ジ・スィ | ここに学生が何人かいる。
Il y a beaucoup de monde. | イリヤ・ボクー・ドゥ・モンド | 人がたくさんいる。
:::

:::warn il y a は複数でも変わらない
英語は there is / there **are** と使い分けますが、フランス語は**常に il y a** です。× ils y ont のような形はありません。

これは il が非人称（誰も指さない形式主語）だからです。第3章の Il pleut. と同じ構造で、主語が何かを指していない以上、後ろの名詞に合わせて変化する理由がありません。
:::

### 否定と疑問

:::ex il y a の否定と疑問
Il n'y a pas de chat. | イル・ニヤ・パ・ドゥ・シャ | 猫はいない。
Il n'y a personne. | イル・ニヤ・ペルソンヌ | 誰もいない。
Y a-t-il un problème ? | ヤ・ティル・アン・プロブレーム | 問題がありますか？
Est-ce qu'il y a un métro ? | エス・キリヤ・アン・メトロ | 地下鉄はありますか？
:::

:::warn 否定では不定冠詞が de になる
第2章の「否定の de」がここで効きます。

- Il y a **un** chat. → Il n'y a pas **de** chat.
- Il y a **des** étudiants. → Il n'y a pas **d'**étudiants.

ただし定冠詞は変わりません：Il n'y a pas **le** temps. のような形は、特定のものを否定する場合に使われます。
:::

:::deep il y a の3つの隠れた用法

**（1）時間の経過を表す「〜前に」**
[[Il y a trois ans\|イリヤ・トロワ・ザン\|3年前に]]、[[il y a longtemps\|イリヤ・ロンタン\|ずっと前に]]

過去の出来事と一緒に使い、現在から遡った時点を示します。
[[Je suis arrivé il y a deux jours.\|ジュ・スュイ・ザリヴェ・イリヤ・ドゥ・ジュール\|私は2日前に着きました。]]

**（2）il y a … que で継続期間**
[[Il y a deux ans que j'habite ici.\|イリヤ・ドゥ・ザン・ク・ジャビット・イスィ\|ここに住んで2年になります。]]
同じ意味を depuis でも表せます：J'habite ici **depuis** deux ans.

**（3）時制を変えられる**
il y a の a は avoir の現在形なので、時制を変えられます。
- [[il y avait\|イリヤヴェ\|〜があった]]（半過去）
- [[il y aura\|イリヨラ\|〜があるだろう]]（単純未来）
- [[il y a eu\|イリヤ・ウ\|〜があった]]（複合過去）
- [[il y aurait\|イリヨレ\|〜があるだろうに]]（条件法）
:::

## 3. c'est / ce sont — 同定する

**ce**（これ・それ）を主語にして être を続ける形です。「これは〜です」と、**モノや人が何であるかを述べます**。

| | 形 |
|---|---|
| 単数 | **c'est** |
| 複数 | **ce sont**（書き言葉）／ **c'est**（話し言葉） |

:::ex c'est / ce sont
C'est un livre. | セ・タン・リーヴル | これは本です。
C'est ma sœur. | セ・マ・スール | 私の姉です。
Ce sont mes amis. | ス・ソン・メ・ザミ | 私の友人たちです。
C'est vrai ? | セ・ヴレ | 本当ですか？
Ce n'est pas grave. | ス・ネ・パ・グラーヴ | 大したことじゃないよ。
:::

:::adv 話し言葉では ce sont が消えつつある
規範文法では複数に ce sont を使いますが、**現代の話し言葉では c'est が複数にも使われます**（C'est mes amis.）。試験では ce sont を書いてください。書き言葉では依然として区別されます。
:::

## 4. c'est と il est の使い分け

**ここがこの章の核心です。** 日本語ではどちらも「〜です」になるので、区別の意識そのものが持ちにくい箇所です。

原則は単純です。

| | 後ろに来るもの |
|---|---|
| **c'est** | **限定詞つきの名詞**（un / le / mon …）、固有名詞、代名詞、副詞 |
| **il est** | **形容詞**、**無冠詞の名詞**（職業・国籍・身分） |

:::ex c'est と il est を並べて比べる
C'est un professeur. | セ・タン・プロフェスール | 彼は（ある）教師です。（冠詞つき名詞 → c'est）
Il est professeur. | イ・レ・プロフェスール | 彼は教師です。（無冠詞 → il est）
C'est une Française. | セ・チュヌ・フランセーズ | 彼女はフランス人です。（冠詞つき名詞）
Elle est française. | エ・レ・フランセーズ | 彼女はフランス人です。（形容詞）
C'est mon frère. | セ・モン・フレール | 私の兄です。（所有形容詞つき）
Il est grand. | イ・レ・グラン | 彼は背が高い。（形容詞）
:::

:::note 見分け方は「後ろに限定詞があるか」の一点
複雑に見えますが、判断はこれだけです。

**名詞の前に un / une / des / le / la / les / mon / ce などが付いていたら c'est。付いていなければ il est。**

- un professeur → 限定詞あり → **C'est** un professeur.
- professeur → 限定詞なし → **Il est** professeur.

形容詞には限定詞が付きようがないので、自動的に il est になります。
:::

:::deep なぜこの区別があるのか
c'est と il est では、**述べていることの種類が違います**。

- **il est + 形容詞／無冠詞名詞** … その人の**属性・分類**を述べる。「彼は教師という職種に属する」
- **c'est + 限定詞つき名詞** … その人・モノが**誰・何であるかを同定する**。「その人物は（ある）教師だ」

だから il est professeur は職業を述べているだけですが、C'est un professeur. は「（今話題の人物は）教師という人だ」と、個体として指し示しています。

この違いは、**形容詞が付いたときに現れます**。
- [[Il est professeur.\|イ・レ・プロフェスール\|彼は教師だ。]]
- [[C'est un bon professeur.\|セ・タン・ボン・プロフェスール\|彼はいい教師だ。]]（× Il est bon professeur.）

形容詞が付くと、その人を「良い教師というタイプの個体」として個別化することになるので、冠詞が必要になり、したがって c'est になるのです。第2章で「職業に形容詞が付くと冠詞が復活する」と述べたのは、この現象です。
:::

:::warn 形容詞でも c'est を使う場合がある
形容詞が**特定の人やモノではなく、状況全体**を指すときは c'est を使います。

- [[Il est difficile.\|イ・レ・ディフィスィル\|彼は気難しい。]]（il ＝特定の人）
- [[C'est difficile.\|セ・ディフィスィル\|それは難しい。]]（ce ＝今話している事柄全体）

同じように、非人称構文でも両方が現れます。
- [[Il est difficile de comprendre.\|イ・レ・ディフィスィル・ドゥ・コンプランドル\|理解するのは難しい。]]（後ろに不定詞が続く、書き言葉）
- [[C'est difficile à comprendre.\|セ・ディフィスィル・ア・コンプランドル\|それは理解しにくい。]]（すでに話題になっている事柄を受ける）

前者は **il est + 形容詞 + de + 不定詞**、後者は **c'est + 形容詞 + à + 不定詞**。前置詞まで変わるので、セットで覚えてください。
:::

## 5. ça — 話し言葉の主役

**ça** は cela（それ）の縮約形で、話し言葉では極めて頻繁に使われます。

:::ex ça
Ça va ? | サ・ヴァ | 元気？／うまくいってる？
Ça va bien, merci. | サ・ヴァ・ビアン・メルスィ | 元気です、ありがとう。
Ça coûte combien ? | サ・クート・コンビアン | いくらですか？
Ça m'intéresse. | サ・マンテレス | それは私の興味を引く。
C'est ça ! | セ・サ | そのとおり！
:::

:::note ça と ce の関係
- **ce** は être の主語としてだけ使われます（c'est, ce sont）
- **ça** はそれ以外のあらゆる動詞の主語・目的語になります（Ça va, Ça coûte, Je vois ça）

つまり「être のときは ce、それ以外は ça」と覚えれば足ります。
:::

## 6. c'est の会話定型 — 評価・感想の言い方

:::deep C'est bon. と C'est bien. — 感想の既定形
c'est + 形容詞は、**感想を述べる最小の文型**です。会話の相づちの大半はこれで作れます。

| 表現 | 意味 | 使いどころ |
|---|---|---|
| [[C'est bon.|セ・ボン]] | おいしい／OK だ | 味・許可・完了 |
| [[C'est bien.|セ・ビヤン]] | いいね、感心だ | 行い・作品への評価 |
| [[C'est pas mal.|セ・パ・マル]] | 悪くないね | 控えめな好評価 |
| [[C'est génial !|セ・ジェニアル]] | 最高！ | 強い好評価（口語） |
| [[C'est dommage.|セ・ドマージュ]] | 残念だ | 同情・残念 |
| [[C'est n'importe quoi.|セ・ナンポルト・コワ]] | めちゃくちゃだ | 呆れ（口語） |
| [[Ce n'est pas grave.|ス・ネ・パ・グラーヴ]] | 大丈夫、大したことない | 謝罪への返し |

**C'est bon.**（味・状態が良い）と **C'est bien.**（行いが良い）は使い分けます。料理には C'est bon !、相手の報告には C'est bien ! が自然です（bon / bien の対立は第6.5章）。

**Ça y est.**（できた・終わった）、**Ça marche.**（了解・それでいい）、**Ça dépend.**（場合による）——ça を主語にした3表現も、返事の既定セットとして覚えてください。

また、**c'est + 形容詞 + de + 不定詞**で「〜するのは…だ」という評価文が作れます。

- [[C'est difficile de choisir.|セ・ディフィスィル・ドゥ・ショワズィール|選ぶのは難しい。]]
- [[C'est important de dormir.|セ・タンポルタン・ドゥ・ドルミール|眠ることは大切だ。]]

規範文法では il est … de … ですが（第15章）、**話し言葉では c'est … de … が圧倒的**です。
:::

## 7. 人を紹介する — この章の総合演習

提示の表現の出番が最も多いのは、**人と物の紹介**です。ひと続きの場面で使ってみます。

:::ex 友人を紹介する
Voici mon ami Paul. | ヴォワスィ・モ・ナミ・ポール | こちらは友人のポールです。
C'est un collègue de bureau. | セ・タン・コレーグ・ドゥ・ビュロ | 職場の同僚です。
Il est ingénieur. | イ・レ・タンジェニュール | エンジニアをしています。
Il y a cinq ans qu'on se connaît. | イ・リ・ヤ・サン・カン・コン・ス・コネ | 知り合って5年になります。
Et voilà sa femme, Marie. | エ・ヴォワラ・サ・ファム・マリ | そしてこちらが奥さんのマリです。
:::

**型**：Voici …（指し示す）→ C'est + 冠詞つき名詞（何者か）→ Il est + 無冠詞の職業（属性）→ Il y a + 期間（時間）。この章の3表現と第4節の使い分けが、この5文に全部入っています。

**Il y a … que + 現在**（〜して…になる）は depuis の言い換えです：Il y a cinq ans qu'on se connaît. = On se connaît depuis cinq ans.（第7.5章）。

## 8. 3つの表現を比べる

同じ場面を3通りに言い分けてみます。

:::ex 同じ場面を3通りで
Voilà un livre. | ヴォワラ・アン・リーヴル | ほら、本があるよ。（指し示す）
Il y a un livre sur la table. | イリヤ・アン・リーヴル・スュル・ラ・ターブル | 机の上に本がある。（存在を述べる）
C'est un livre. | セ・タン・リーヴル | これは本です。（何であるかを述べる）
:::

| 表現 | 役割 |
|---|---|
| voici / voilà | 相手の注意を向けて**指し示す** |
| il y a | ある場所に**存在する**ことを述べる |
| c'est / ce sont | それが**何であるか**を同定する |


:::ai-gen c'est と il est の使い分け、il y a、voici / voilà

## 9. voilà の会話機能 — 「はい、どうぞ」から「そういうこと」まで

voilà は指し示すだけの語ではありません。**会話の句読点**として、1語でさまざまな働きをします。

| 場面 | Voilà. の意味 |
|---|---|
| 物を手渡す | はい、どうぞ |
| 説明を締める | ——という次第です |
| 相手が正解を言った | そう、それ！ |
| 作業が終わった | はい、これで完了 |
| あきらめ混じりの結論 | まあ、そういうこと |

:::ex voilà の一語文
Voilà votre monnaie. | ヴォワラ・ヴォートル・モネ | はい、お釣りです。
Et voilà ! | エ・ヴォワラ | はい、できあがり！
C'est ça, voilà. | セ・サ・ヴォワラ | そうそう、それ。
Voilà, c'est tout. | ヴォワラ・セ・トゥ | ということです、以上。
Voilà pourquoi je suis parti. | ヴォワラ・プルコワ・ジュ・スュイ・パルティ | そういうわけで私は去ったんです。
:::

**Voilà pourquoi / Voilà comment + 文**（そういうわけで／こうやって〜）は説明の締めの定型です。またレストランで料理が来るときの Et voilà !、会計の Voilà votre monnaie. など、**サービスの場面は voilà で回っています**。聞こえたら「何かが差し出された・完了した」の合図です。

**il y a … qui の提示構文**も、ここでまとめておきます。

- [[Il y a quelqu'un qui t'attend.|イ・リ・ヤ・ケルカン・キ・タタン|誰かが君を待ってるよ。]]
- [[Il y a le téléphone qui sonne !|イ・リ・ヤ・ル・テレフォン・キ・ソンヌ|電話が鳴ってるよ！]]

新しい出来事を会話に導入するとき、フランス語は主語をいきなり文頭に置かず、**il y a … qui で「存在させてから」語る**傾向があります。話し言葉の頻出構文です。

## 10. ce と ça の使い分け — 中性の指示

**ce / ceci / cela / ça** は名詞ではなく**事柄**を指す中性の指示代名詞です。使い分けを確定させます。

| 語 | 使う場所 | 例 |
|---|---|---|
| **ce** | **être の主語**としてのみ | C'est vrai. / Ce sont mes amis. |
| **cela** | 主語・目的語（書き言葉） | Cela m'intéresse. |
| **ça** | 主語・目的語（話し言葉） | Ça m'intéresse. / J'aime ça. |
| **ceci** | これから述べること | Retenez ceci : … |

**ce は être 専用**です。他の動詞の主語には ça / cela を使います。

- ○ **C'**est difficile.（être）
- ○ **Ça** marche.（marcher）／ **Ça** me plaît.（plaire）
- × Ce marche.

:::ex ce と ça
C'est intéressant. | セ・タンテレサン | それは面白い。（être → ce）
Ça m'intéresse beaucoup. | サ・マンテレス・ボクー | それにとても興味がある。（intéresser → ça）
Ça ne fait rien. | サ・ヌ・フェ・リヤン | 気にしないで。
Ça sent bon ! | サ・サン・ボン | いい匂い！
Cela dit, je ne suis pas d'accord. | スラ・ディ | とはいえ、私は賛成しない。
:::

**ça は話し言葉の万能主語**で、天候・状態・感想のすべてを引き受けます（Ça va / Ça marche / Ça sent bon / Ça y est）。書き言葉では cela に置き換えるのが標準ですが、**Cela dit**（とはいえ）のような接続表現は書き言葉でも cela のまま定型化しています。

**ceci … cela** で「これ…あれ」の対比も作れます：Ceci est à moi, cela est à toi.（これは私の、それは君の）。ただし現代語ではあまり使われず、対比には celui-ci / celui-là（第10章）を使うほうが普通です。
