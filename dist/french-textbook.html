<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>フランス語文法テキスト</title>
<meta name="description" content="日本語話者のための、大学レベルのフランス語文法テキスト。全文クリックで発音、動詞活用ドリル、AI文法質問つき。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23a4243b'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Georgia,serif' font-style='italic' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<style>
/* assets/css/style.css */
/* ==========================================================================
   フランス語文法テキスト — スタイル
   ライト／ダーク両対応。色はすべて :root のトークンで定義する。
   ========================================================================== */

:root {
  --bg:        #fbf9f6;
  --bg-soft:   #f3efe9;
  --surface:   #ffffff;
  --surface-2: #f7f4ef;
  --border:    #e2dbd0;
  --border-strong: #cdc3b4;
  --text:      #241f1a;
  --text-soft: #6a6157;
  --text-dim:  #938a7e;

  --accent:      #a4243b;   /* 表紙の赤 */
  --accent-soft: #f6e7e9;
  --accent-text: #8a1e32;

  --blue:      #2a5d8f;
  --blue-soft: #e6eef6;
  --green:     #2f7d54;
  --green-soft:#e3f2e9;
  --amber:     #9a6b16;
  --amber-soft:#fbf0d9;
  --violet:    #6b4a9c;
  --violet-soft:#efe9f8;

  --stem: #2a5d8f;          /* 活用表：語幹 */
  --ending: #a4243b;        /* 活用表：語尾 */

  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(36,31,26,.06), 0 4px 16px rgba(36,31,26,.06);
  --shadow-lg: 0 8px 40px rgba(36,31,26,.18);

  --sidebar-w: 280px;
  --minitoc-w: 210px;
  --topbar-h: 52px;

  --font-ja: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --font-fr: "Palatino", "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #17161a;
    --bg-soft:   #1e1d22;
    --surface:   #201f24;
    --surface-2: #26252b;
    --border:    #35333c;
    --border-strong: #4a4753;
    --text:      #ece8e3;
    --text-soft: #b3aca4;
    --text-dim:  #857e77;

    --accent:      #e8697f;
    --accent-soft: #3a2027;
    --accent-text: #f0899b;

    --blue:      #7fb3e0;
    --blue-soft: #1d2a38;
    --green:     #78c79a;
    --green-soft:#1a2b22;
    --amber:     #e0b563;
    --amber-soft:#302719;
    --violet:    #b195e0;
    --violet-soft:#272033;

    --stem: #7fb3e0;
    --ending: #e8697f;

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    --shadow-lg: 0 8px 40px rgba(0,0,0,.55);
  }
}

:root[data-theme="dark"] {
  --bg:        #17161a;
  --bg-soft:   #1e1d22;
  --surface:   #201f24;
  --surface-2: #26252b;
  --border:    #35333c;
  --border-strong: #4a4753;
  --text:      #ece8e3;
  --text-soft: #b3aca4;
  --text-dim:  #857e77;

  --accent:      #e8697f;
  --accent-soft: #3a2027;
  --accent-text: #f0899b;

  --blue:      #7fb3e0;
  --blue-soft: #1d2a38;
  --green:     #78c79a;
  --green-soft:#1a2b22;
  --amber:     #e0b563;
  --amber-soft:#302719;
  --violet:    #b195e0;
  --violet-soft:#272033;

  --stem: #7fb3e0;
  --ending: #e8697f;

  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --shadow-lg: 0 8px 40px rgba(0,0,0,.55);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; scroll-padding-top: calc(var(--topbar-h) + 12px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ja);
  font-size: 16px;
  line-height: 1.85;
  -webkit-text-size-adjust: 100%;
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 200;
  background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 0 0 var(--radius) 0;
}
.skip-link:focus { left: 0; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* ---------- トップバー ---------- */

.topbar {
  position: sticky; top: 0; z-index: 60;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(150%) blur(12px);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: baseline; gap: 9px; text-decoration: none; color: inherit; min-width: 0; }
.brand-fr { font-family: var(--font-fr); font-size: 19px; font-style: italic; color: var(--accent); letter-spacing: .01em; }
.brand-ja { font-size: 12.5px; color: var(--text-soft); white-space: nowrap; }
.topbar-spacer { flex: 1; }

.iconbtn {
  flex: none;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm);
  color: var(--text-soft); font-size: 16px; cursor: pointer;
  transition: background .12s, color .12s;
}
.iconbtn:hover { background: var(--surface-2); color: var(--text); }
.iconbtn-ai { color: var(--accent); }
#btn-menu { display: none; }

.search-wrap { position: relative; }
#search-input {
  width: 150px; height: 32px;
  padding: 0 10px;
  background: var(--bg-soft); color: var(--text);
  border: 1px solid var(--border); border-radius: 999px;
  font: inherit; font-size: 13px;
  transition: width .18s ease;
}
#search-input:focus { width: 230px; }
.search-results {
  position: absolute; top: 38px; right: 0; z-index: 70;
  width: min(420px, 90vw); max-height: 65vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 6px;
}
.search-results a {
  display: block; padding: 8px 10px; border-radius: var(--radius-sm);
  text-decoration: none; color: inherit;
}
.search-results a:hover { background: var(--surface-2); }
.search-results .sr-title { font-size: 13px; font-weight: 600; }
.search-results .sr-snip { font-size: 12px; color: var(--text-soft); line-height: 1.6; }
.search-results mark { background: var(--accent-soft); color: var(--accent-text); border-radius: 2px; }
.search-results .sr-empty { padding: 14px; text-align: center; color: var(--text-dim); font-size: 13px; }

/* ---------- バナー ---------- */

.banner {
  padding: 9px 16px;
  background: var(--amber-soft); color: var(--amber);
  border-bottom: 1px solid var(--border);
  font-size: 13px; line-height: 1.7;
}
.banner button {
  margin-left: 8px; background: none; border: 1px solid currentColor;
  color: inherit; border-radius: 999px; padding: 1px 9px; font-size: 12px; cursor: pointer;
}
.banner details { display: inline; }
.banner summary { display: inline; cursor: pointer; text-decoration: underline; }
.banner details > div { margin-top: 6px; }

/* ---------- レイアウト ---------- */

.layout {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--minitoc-w);
  align-items: start;
  max-width: 1500px; margin: 0 auto;
}

.sidebar {
  position: sticky; top: var(--topbar-h);
  height: calc(100vh - var(--topbar-h));
  overflow-y: auto; overscroll-behavior: contain;
  padding: 14px 8px 24px 14px;
  border-right: 1px solid var(--border);
}

.sidebar-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 8px 8px;
  font-size: 11px; font-weight: 700; letter-spacing: .12em;
  color: var(--text-dim); text-transform: uppercase;
}
.progress-pill {
  font-size: 10.5px; letter-spacing: 0; text-transform: none;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 999px; padding: 1px 8px; color: var(--text-soft);
}

.toc { list-style: none; margin: 0; padding: 0; }
.toc a {
  display: flex; gap: 8px; align-items: baseline;
  padding: 5px 8px; border-radius: var(--radius-sm);
  color: var(--text-soft); text-decoration: none;
  font-size: 13.5px; line-height: 1.5;
}
.toc a:hover { background: var(--surface-2); color: var(--text); }
.toc a.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.toc .no {
  flex: none; min-width: 2.1em; text-align: right;
  font-family: var(--font-fr); font-size: 13px; color: var(--text-dim);
}
.toc a.active .no { color: var(--accent-text); }
.toc .ttl { flex: 1; min-width: 0; }
.toc .done { flex: none; color: var(--green); font-size: 11px; }
.toc li.sub a { padding-left: 20px; font-size: 12.5px; }
.toc li.sub .no { font-size: 11.5px; }
.toc-part {
  margin: 14px 0 4px; padding: 0 8px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
  color: var(--text-dim); text-transform: uppercase;
}

.sidebar-foot { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border); }
.sidebar-link {
  display: block; padding: 6px 8px; border-radius: var(--radius-sm);
  color: var(--text-soft); text-decoration: none; font-size: 13.5px;
}
.sidebar-link:hover { background: var(--surface-2); color: var(--text); }

.main { min-width: 0; padding: 26px 40px 100px; }

.minitoc {
  position: sticky; top: var(--topbar-h);
  max-height: calc(100vh - var(--topbar-h));
  overflow-y: auto;
  padding: 30px 16px 40px 4px;
  font-size: 12.5px;
}
.minitoc-title {
  font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
  color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px;
}
.minitoc a {
  display: block; padding: 3px 8px;
  border-left: 2px solid var(--border);
  color: var(--text-soft); text-decoration: none; line-height: 1.5;
}
.minitoc a:hover { color: var(--text); border-left-color: var(--border-strong); }
.minitoc a.active { color: var(--accent-text); border-left-color: var(--accent); font-weight: 600; }
.minitoc a.lv3 { padding-left: 18px; font-size: 12px; }

.scrim {
  position: fixed; inset: 0; z-index: 55;
  background: rgba(0,0,0,.45);
}

/* ---------- 章 ---------- */

.chapter { max-width: 780px; }

.ch-head { margin-bottom: 26px; padding-bottom: 18px; border-bottom: 2px solid var(--accent); }
.ch-no {
  font-family: var(--font-fr); font-size: 13px; letter-spacing: .18em;
  color: var(--accent); text-transform: uppercase;
}
.ch-title { font-size: 27px; line-height: 1.35; margin: 6px 0 0; font-weight: 700; letter-spacing: .01em; }
.ch-sub { margin: 7px 0 0; color: var(--text-soft); font-size: 14.5px; }

.chapter h2 {
  margin: 42px 0 14px; padding-top: 4px;
  font-size: 20.5px; line-height: 1.45; font-weight: 700;
  border-top: 1px solid var(--border); padding-top: 22px;
}
.chapter h2:first-of-type { border-top: none; padding-top: 0; }
.chapter h3 { margin: 28px 0 10px; font-size: 16.5px; font-weight: 700; color: var(--accent-text); }
.chapter h4 { margin: 20px 0 8px; font-size: 15px; font-weight: 700; color: var(--text-soft); }

.chapter p { margin: 0 0 15px; }
.chapter ul, .chapter ol { margin: 0 0 15px; padding-left: 1.5em; }
.chapter li { margin-bottom: 5px; }
.chapter li > ul, .chapter li > ol { margin-top: 5px; margin-bottom: 6px; }
.chapter hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
.chapter strong { font-weight: 700; }
.chapter a { color: var(--blue); }

.chapter code {
  font-family: var(--font-mono); font-size: .88em;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 4px; padding: .1em .35em;
}

.lead { font-size: 16.5px; color: var(--text-soft); }

/* 表 */
.table-wrap { overflow-x: auto; margin: 0 0 18px; -webkit-overflow-scrolling: touch; }
.chapter table {
  border-collapse: collapse; width: 100%;
  font-size: 14.5px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden;
}
.chapter th, .chapter td {
  border-bottom: 1px solid var(--border);
  padding: 8px 12px; text-align: left; vertical-align: top;
}
.chapter th { background: var(--surface-2); font-weight: 700; font-size: 13px; white-space: nowrap; }
.chapter tr:last-child td { border-bottom: none; }
.chapter td .fr { font-size: 1em; }

/* ---------- フランス語チップ（クリックで発音） ---------- */

.fr {
  display: inline;
  font-family: var(--font-fr);
  color: var(--accent-text);
  cursor: pointer;
  border-bottom: 1px dotted color-mix(in srgb, var(--accent) 55%, transparent);
  border-radius: 2px;
  padding: 0 1px;
  transition: background .1s;
}
.fr:hover { background: var(--accent-soft); }
.fr.speaking { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
.fr[data-nospeak="1"] { cursor: default; border-bottom: none; }
.fr .kana { font-family: var(--font-ja); font-size: .78em; color: var(--text-dim); margin-left: .35em; }
.fr .gloss { font-family: var(--font-ja); font-size: .82em; color: var(--text-soft); margin-left: .35em; }
.fr .gloss::before { content: "＝"; color: var(--text-dim); }

/* ---------- 例文ブロック ---------- */

.exblock {
  margin: 0 0 20px;
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  overflow: hidden;
}
.exblock-head {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px 6px 14px;
  background: var(--surface-2); border-bottom: 1px solid var(--border);
  font-size: 11.5px; color: var(--text-soft);
}
.exblock-head .ttl { flex: 1; font-weight: 700; }
.exlist { list-style: none; margin: 0; padding: 4px 0; }
.exlist li {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 7px 14px; margin: 0;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
}
.exlist li:last-child { border-bottom: none; }
.exlist li.speaking { background: var(--accent-soft); }
.ex-text { flex: 1; min-width: 0; }
.ex-fr { font-family: var(--font-fr); font-size: 16.5px; color: var(--text); line-height: 1.5; }
.ex-kana { font-size: 12.5px; color: var(--text-dim); margin-top: 1px; }
.ex-ja { font-size: 13.5px; color: var(--text-soft); margin-top: 2px; }

.playbtn {
  flex: none; width: 27px; height: 27px; margin-top: 2px;
  display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 50%; cursor: pointer; font-size: 11px; color: var(--accent);
  transition: background .12s, transform .08s;
}
.playbtn:hover { background: var(--accent-soft); }
.playbtn:active { transform: scale(.92); }

.btn-mini {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 2px 10px;
  font: inherit; font-size: 11.5px; color: var(--text-soft); cursor: pointer;
}
.btn-mini:hover { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent); }

/* ---------- 注記ボックス ---------- */

.callout {
  margin: 0 0 20px; padding: 13px 16px;
  border-radius: var(--radius); border: 1px solid var(--border);
  border-left-width: 3px;
  font-size: 14.5px; line-height: 1.8;
}
.callout > *:last-child { margin-bottom: 0; }
.callout-title { font-weight: 700; font-size: 13px; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }

.callout.note  { background: var(--blue-soft);   border-left-color: var(--blue); }
.callout.note  .callout-title { color: var(--blue); }
.callout.warn  { background: var(--amber-soft);  border-left-color: var(--amber); }
.callout.warn  .callout-title { color: var(--amber); }
.callout.adv   { background: var(--violet-soft); border-left-color: var(--violet); }
.callout.adv   .callout-title { color: var(--violet); }
.callout.deep  { background: var(--surface-2);   border-left-color: var(--border-strong); }
.callout.deep  .callout-title { color: var(--text-soft); }
.callout.tip   { background: var(--green-soft);  border-left-color: var(--green); }
.callout.tip   .callout-title { color: var(--green); }

/* ---------- 練習問題 ---------- */

.quiz {
  margin: 0 0 18px; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius);
}
.quiz-q { font-weight: 600; margin-bottom: 8px; }
.quiz-a { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.quiz-a[hidden] { display: none; }
.quiz-reveal {
  background: var(--surface-2); border: 1px solid var(--border-strong);
  border-radius: 999px; padding: 3px 14px;
  font: inherit; font-size: 12.5px; color: var(--text-soft); cursor: pointer;
}
.quiz-reveal:hover { background: var(--accent-soft); color: var(--accent-text); }

/* ---------- 活用表 ---------- */

.conj {
  margin: 0 0 22px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.conj-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--border);
}
.conj-verb { font-family: var(--font-fr); font-size: 16px; font-weight: 700; color: var(--accent-text); }
.conj-meta { font-size: 12px; color: var(--text-soft); }
.conj-tools { margin-left: auto; display: flex; gap: 6px; }

.conj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.conj-tense { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.conj-tense:last-child { border-right: none; }
.conj-tense-name {
  padding: 6px 12px; font-size: 11.5px; font-weight: 700;
  color: var(--text-soft); background: color-mix(in srgb, var(--surface-2) 60%, transparent);
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; gap: 8px;
}
.conj-tense-name .fr-name { font-family: var(--font-fr); font-weight: 400; font-style: italic; color: var(--text-dim); }

.conj-rows { list-style: none; margin: 0; padding: 4px 0; }
.conj-rows li {
  display: grid; grid-template-columns: 3.6em 1fr auto;
  gap: 8px; align-items: baseline;
  padding: 3px 12px; margin: 0;
  cursor: pointer; border-radius: 4px;
}
.conj-rows li:hover { background: var(--surface-2); }
.conj-rows li.speaking { background: var(--accent-soft); }
.conj-pron { color: var(--text-dim); font-size: 13px; font-family: var(--font-fr); }
.conj-form { font-family: var(--font-fr); font-size: 16px; }
.conj-kana { font-size: 11px; color: var(--text-dim); }

.conj.show-parts .conj-form .st { color: var(--stem); font-weight: 600; }
.conj.show-parts .conj-form .en { color: var(--ending); font-weight: 700; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
.conj.show-homo .conj-rows li.homo { background: color-mix(in srgb, var(--amber-soft) 70%, transparent); }
.conj.show-homo .conj-rows li.homo .conj-form::after {
  content: "♪"; font-size: 10px; color: var(--amber); margin-left: 4px; vertical-align: super;
}
.conj-foot { padding: 7px 12px; font-size: 12px; color: var(--text-soft); background: var(--surface-2); border-top: 1px solid var(--border); }

/* ---------- ドリル ---------- */

.drill {
  margin: 0 0 22px; padding: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden;
}
.drill-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 9px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border);
  font-size: 12.5px;
}
.drill-head .ttl { font-weight: 700; }
.drill-stats { margin-left: auto; display: flex; gap: 12px; color: var(--text-soft); font-size: 12px; }
.drill-stats b { color: var(--text); font-variant-numeric: tabular-nums; }

.drill-body { padding: 20px 16px; text-align: center; }
.drill-prompt { font-size: 14px; color: var(--text-soft); margin-bottom: 4px; }
.drill-verb { font-family: var(--font-fr); font-size: 25px; font-weight: 700; color: var(--accent-text); }
.drill-tense { font-size: 13px; color: var(--text-soft); margin-top: 2px; }
.drill-subject { font-family: var(--font-fr); font-size: 19px; margin: 14px 0 10px; }

.drill-inputrow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.drill-input {
  width: min(280px, 70vw); padding: 9px 12px;
  font-family: var(--font-fr); font-size: 18px; text-align: center;
  background: var(--bg-soft); color: var(--text);
  border: 2px solid var(--border-strong); border-radius: var(--radius-sm);
}
.drill-input:focus { border-color: var(--accent); outline: none; }
.drill-accents { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin: 10px 0 0; }
.drill-accents button {
  width: 30px; height: 30px; font-family: var(--font-fr); font-size: 15px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); cursor: pointer;
}
.drill-accents button:hover { background: var(--accent-soft); }

.drill-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 6px; }
.drill-choice {
  padding: 11px 8px; font-family: var(--font-fr); font-size: 17px;
  background: var(--surface-2); border: 2px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); cursor: pointer;
}
.drill-choice:hover { border-color: var(--accent); background: var(--accent-soft); }
.drill-choice.right { border-color: var(--green); background: var(--green-soft); }
.drill-choice.wrong { border-color: var(--accent); background: var(--accent-soft); opacity: .75; }

.drill-feedback { margin-top: 14px; font-size: 14px; }
.drill-feedback.ok { color: var(--green); }
.drill-feedback.ng { color: var(--accent-text); }
.drill-feedback .answer { font-family: var(--font-fr); font-size: 20px; font-weight: 700; }
.drill-why { margin-top: 8px; font-size: 13px; color: var(--text-soft); line-height: 1.75; }
.drill-foot { padding: 9px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.drill-setup { padding: 14px 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; border-bottom: 1px solid var(--border); }
.drill-setup .field { margin: 0; }

/* ---------- 活用の全体図 ---------- */

.vmap { margin: 0 0 24px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.vmap-row { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; margin-bottom: 12px; }
.vmap-node {
  flex: 1 1 180px; padding: 10px 12px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); text-align: left;
  font: inherit; color: var(--text);
}
.vmap-node:hover { border-color: var(--accent); background: var(--accent-soft); }
.vmap-node .k { font-size: 11px; color: var(--text-dim); display: block; }
.vmap-node .n { font-weight: 700; font-size: 14px; display: block; margin-top: 1px; }
.vmap-node .f {
  display: block; margin-top: 3px;
  font-family: var(--font-fr); font-size: 12.5px; color: var(--text-soft); font-style: italic;
  line-height: 1.5; word-break: break-word;
}
.vmap-node.src { border-color: var(--blue); background: var(--blue-soft); }
.vmap-arrow { display: grid; place-items: center; color: var(--text-dim); font-size: 18px; flex: none; }

/* ---------- 語彙リスト ---------- */

.vocab { margin: 0 0 22px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.vocab-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 12.5px; font-weight: 700; }
.vocab-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.vocab-list li { display: flex; gap: 8px; align-items: baseline; padding: 6px 12px; border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent); margin: 0; }
.vocab-fr { font-family: var(--font-fr); font-size: 15px; cursor: pointer; color: var(--accent-text); }
.vocab-ja { font-size: 13px; color: var(--text-soft); }
.vocab-pos { font-size: 10.5px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }

/* ---------- 章ナビ ---------- */

.chapter-nav { display: flex; gap: 12px; max-width: 780px; margin: 46px 0 0; }
.chapter-nav a {
  flex: 1; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  text-decoration: none; color: inherit; box-shadow: var(--shadow);
}
.chapter-nav a:hover { border-color: var(--accent); }
.chapter-nav .dir { font-size: 11px; color: var(--text-dim); }
.chapter-nav .t { font-size: 14px; font-weight: 600; }
.chapter-nav .next { text-align: right; }

.mark-done {
  display: inline-flex; align-items: center; gap: 7px;
  margin: 34px 0 0; padding: 9px 18px;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px;
  font: inherit; font-size: 13.5px; color: var(--text-soft); cursor: pointer;
}
.mark-done:hover { border-color: var(--green); color: var(--green); }
.mark-done.on { background: var(--green-soft); border-color: var(--green); color: var(--green); }

/* ---------- AI ---------- */

.aipanel {
  position: fixed; top: 0; right: 0; z-index: 80;
  width: min(430px, 100vw); height: 100dvh;
  display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
}
.aipanel[hidden] { display: none; }
.aipanel-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.aipanel-ctx { flex: 1; font-size: 11.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aipanel-body { flex: 1; overflow-y: auto; padding: 14px; font-size: 14px; line-height: 1.8; }
.aipanel-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); align-items: flex-end; }
#ai-input {
  flex: 1; resize: none; padding: 8px 10px; font: inherit; font-size: 14px;
  background: var(--bg-soft); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  max-height: 140px;
}
.aipanel-note { margin: 0; padding: 0 12px 10px; font-size: 11px; color: var(--text-dim); }

.msg { margin-bottom: 14px; }
.msg-role { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 3px; }
.msg.user .msg-body { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 11px; }
.msg.ai .msg-body > *:last-child { margin-bottom: 0; }
.msg.ai .msg-body p { margin: 0 0 10px; }
.msg.ai .msg-body ul, .msg.ai .msg-body ol { margin: 0 0 10px; padding-left: 1.3em; }
.msg.err .msg-body { background: var(--accent-soft); color: var(--accent-text); border-radius: var(--radius); padding: 9px 12px; font-size: 13px; }
.msg .table-wrap { margin-bottom: 10px; }
.msg table { font-size: 13px; }

.ai-empty { color: var(--text-dim); font-size: 13.5px; text-align: center; padding: 30px 10px; line-height: 1.9; }
.ai-suggest { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
.ai-suggest button {
  padding: 8px 12px; text-align: left; font: inherit; font-size: 13px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text-soft); cursor: pointer;
}
.ai-suggest button:hover { border-color: var(--accent); color: var(--accent-text); }

.typing::after {
  content: "▍"; color: var(--accent);
  animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.aitools { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 20px; }
.aitool {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; font: inherit; font-size: 13px;
  background: var(--surface); color: var(--accent-text);
  border: 1px solid var(--accent); border-radius: 999px; cursor: pointer;
}
.aitool:hover { background: var(--accent-soft); }
.aitool[disabled] { opacity: .5; cursor: not-allowed; border-color: var(--border); color: var(--text-dim); }

.ai-out { margin: 0 0 20px; }
.ai-out:empty { display: none; }

/* ---------- フォーム部品 ---------- */

.btn {
  padding: 7px 16px; font: inherit; font-size: 13.5px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  cursor: pointer;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; font-size: 13px; }
.field > span { color: var(--text-soft); font-weight: 600; font-size: 12.5px; }
.field select, .field input[type="text"], .field input[type="password"], .field input[type="number"] {
  padding: 7px 10px; font: inherit; font-size: 14px;
  background: var(--bg-soft); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.field input[type="range"] { accent-color: var(--accent); }
.hint { font-size: 12.5px; color: var(--text-soft); line-height: 1.75; }

.dialog {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text);
  padding: 20px 22px; max-width: 440px; width: calc(100vw - 32px);
  box-shadow: var(--shadow-lg);
}
.dialog::backdrop { background: rgba(0,0,0,.45); }
.dialog h2 { margin: 0 0 16px; font-size: 17px; }
.dialog menu { display: flex; gap: 8px; justify-content: flex-end; margin: 18px 0 0; padding: 0; }

/* ---------- 汎用ページ ---------- */

.page { max-width: 780px; }
.page h1 { font-size: 25px; margin: 0 0 8px; }
.page > p { color: var(--text-soft); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
.card h2 { margin: 0 0 10px; font-size: 16px; }
.empty { color: var(--text-dim); text-align: center; padding: 40px 10px; }

.home-hero { padding: 8px 0 26px; }
.home-hero h1 { font-size: 30px; line-height: 1.3; margin: 0 0 10px; }
.home-hero .fr-title { font-family: var(--font-fr); font-style: italic; color: var(--accent); }
.home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 26px; }
.home-card {
  display: block; padding: 16px; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.home-card:hover { border-color: var(--accent); }
.home-card .ic { font-size: 22px; }
.home-card .t { font-weight: 700; margin: 6px 0 3px; }
.home-card .d { font-size: 13px; color: var(--text-soft); line-height: 1.7; }

/* ---------- レスポンシブ ---------- */

@media (max-width: 1180px) {
  .layout { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .minitoc { display: none; }
  .main { padding: 26px 30px 100px; }
}

@media (max-width: 860px) {
  :root { --topbar-h: 50px; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  #btn-menu { display: grid; }
  .brand-ja { display: none; }

  .sidebar {
    position: fixed; top: var(--topbar-h); left: 0; z-index: 58;
    width: 290px; height: calc(100dvh - var(--topbar-h));
    background: var(--surface);
    transform: translateX(-100%); transition: transform .2s ease;
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }

  .main { padding: 20px 16px 90px; }
  .chapter h2 { font-size: 19px; margin-top: 34px; }
  .ch-title { font-size: 23px; }
  #search-input { width: 34px; padding: 0; text-align: center; }
  #search-input:focus { width: 170px; padding: 0 10px; text-align: left; }
  /* 列の多い表は潰さず横スクロールさせる。各セルに幅の下限を与えると、
     2列の表はそのまま収まり、6列の表だけがはみ出してスクロールになる。 */
  .chapter th, .chapter td { min-width: 4.6em; }
  .table-wrap { border: 1px solid var(--border); border-radius: var(--radius); }
  .table-wrap table { border: none; border-radius: 0; }

  .conj-grid { grid-template-columns: 1fr; }
  .conj-tense { border-right: none; }
  .chapter-nav { flex-direction: column; }
  .vocab-list { grid-template-columns: 1fr; }
}

@media (max-width: 420px) {
  body { font-size: 15.5px; }
  .exlist li { padding: 7px 10px; }
  .ex-fr { font-size: 15.5px; }
}

@media print {
  .topbar, .sidebar, .minitoc, .aipanel, .chapter-nav, .playbtn, .aitools, .banner { display: none !important; }
  .layout { grid-template-columns: 1fr; }
  .main { padding: 0; }
  .chapter { max-width: none; }
  .quiz-a[hidden] { display: block !important; }
}

<body data-bundled="1">

<a class="skip-link" href="#main">本文へスキップ</a>

<header class="topbar">
  <button class="iconbtn" id="btn-menu" aria-label="目次を開く" aria-expanded="false">☰</button>

  <a class="brand" href="#/">
    <span class="brand-fr">Grammaire</span>
    <span class="brand-ja">フランス語文法テキスト</span>
  </a>

  <div class="topbar-spacer"></div>

  <div class="search-wrap">
    <input type="search" id="search-input" placeholder="検索…" aria-label="全文検索" autocomplete="off">
    <div class="search-results" id="search-results" hidden></div>
  </div>

  <button class="iconbtn" id="btn-speech" aria-label="音声設定" title="音声設定">🔊</button>
  <button class="iconbtn" id="btn-theme" aria-label="テーマ切替" title="テーマ切替">◐</button>
  <button class="iconbtn iconbtn-ai" id="btn-ai" aria-label="AIパネルを開く" title="AIに質問">✨</button>
</header>

<div id="voice-banner" class="banner" hidden></div>

<div class="layout">

  <nav class="sidebar" id="sidebar" aria-label="目次">
    <div class="sidebar-head">
      <span>目次</span>
      <span class="progress-pill" id="progress-pill"></span>
    </div>
    <ol class="toc" id="toc"></ol>
    <div class="sidebar-foot">
      <a href="#/drill" class="sidebar-link">🎯 活用ドリル</a>
      <a href="#/verbs" class="sidebar-link">📖 動詞活用表</a>
      <a href="#/myphrases" class="sidebar-link">⭐ マイ例文</a>
      <a href="#/settings" class="sidebar-link">⚙️ 設定</a>
    </div>
  </nav>

  <main id="main" class="main" tabindex="-1">
    <article id="chapter" class="chapter"></article>
    <nav class="chapter-nav" id="chapter-nav" aria-label="前後の章"></nav>
  </main>

  <aside class="minitoc" id="minitoc" aria-label="この章の目次"></aside>

</div>

<div class="scrim" id="scrim" hidden></div>

<!-- AI パネル -->
<aside class="aipanel" id="aipanel" aria-label="AIアシスタント" hidden>

    <strong>AI に質問</strong>
    <span class="aipanel-ctx" id="aipanel-ctx"></span>

  </div>
  <div class="aipanel-body" id="aipanel-body"></div>
  <form class="aipanel-form" id="aipanel-form">
    <textarea id="ai-input" rows="2" placeholder="この章について質問する…（例：なぜここは de になるの？）"></textarea>

<!-- 音声設定ダイアログ -->
<dialog id="speech-dialog" class="dialog">
  <form method="dialog">
    <h2>音声設定</h2>
    <label class="field">
      <span>読み上げの声</span>
      <select id="voice-select"></select>
    </label>
    <label class="field">
      <span>速さ <output id="rate-out"></output></span>
      <input type="range" id="rate-range" min="0.5" max="1.2" step="0.05">
    </label>
    <p class="hint" id="speech-hint"></p>
    <menu>
      <button class="btn" id="speech-test" type="button">試聴</button>
      <button class="btn btn-primary" value="close">閉じる</button>
    </menu>
  </form>
</dialog>

<script>
/* assets/js/store.js */
/* store.js — localStorage の薄いラッパ。
   プライベートブラウズ等で localStorage が使えない場合はメモリに退避して動き続ける。 */
(function (global) {
  'use strict';

  var FR = global.FR = global.FR || {};

  var PREFIX = 'fr.';
  var memory = Object.create(null);
  var usable = (function () {
    try {
      var k = PREFIX + '__t';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }());

  function read(key) {
    if (!usable) return memory[key];
    try { return localStorage.getItem(PREFIX + key); } catch (e) { return memory[key]; }
  }

  function write(key, raw) {
    memory[key] = raw;
    if (!usable) return;
    try { localStorage.setItem(PREFIX + key, raw); } catch (e) { /* 容量超過などは黙って諦める */ }
  }

  var store = {
    /** 保存された JSON を返す。無ければ fallback。 */
    get: function (key, fallback) {
      var raw = read(key);
      if (raw === null || raw === undefined) return fallback;
      try { return JSON.parse(raw); } catch (e) { return fallback; }
    },

    set: function (key, value) {
      write(key, JSON.stringify(value));
      return value;
    },

    remove: function (key) {
      delete memory[key];
      if (!usable) return;
      try { localStorage.removeItem(PREFIX + key); } catch (e) {}
    },

    /** 配列に push（上限つき・重複除去つき） */
    push: function (key, value, limit) {
      var list = store.get(key, []);
      if (!Array.isArray(list)) list = [];
      list.push(value);
      if (limit && list.length > limit) list = list.slice(list.length - limit);
      return store.set(key, list);
    },

    isPersistent: function () { return usable; }
  };

  /* ---- 学習の進捗 ---- */

  store.progress = {
    all: function () { return store.get('progress', {}); },
    isDone: function (id) { return !!store.progress.all()[id]; },
    setDone: function (id, done) {
      var p = store.progress.all();
      if (done) p[id] = Date.now(); else delete p[id];
      return store.set('progress', p);
    },
    count: function () { return Object.keys(store.progress.all()).length; }
  };

  /* ---- 活用ドリルの成績・弱点 ---- */

  store.drill = {
    /** key = "verb|tense|person" → {wrong, right, last} */
    stats: function () { return store.get('drillStats', {}); },

    record: function (key, correct) {
      var s = store.drill.stats();
      var e = s[key] || { right: 0, wrong: 0, last: 0 };
      if (correct) e.right++; else e.wrong++;
      e.last = Date.now();
      s[key] = e;
      return store.set('drillStats', s);
    },

    /** 誤答が正答を上回っている項目を、間違いの多い順に返す */
    weakest: function (limit) {
      var s = store.drill.stats();
      var out = Object.keys(s)
        .map(function (k) { return { key: k, e: s[k] }; })
        .filter(function (x) { return x.e.wrong > 0; })
        .sort(function (a, b) {
          var da = a.e.wrong - a.e.right, db = b.e.wrong - b.e.right;
          if (db !== da) return db - da;
          return b.e.wrong - a.e.wrong;
        });
      return limit ? out.slice(0, limit) : out;
    },

    session: function () {
      return store.get('drillSession', { asked: 0, right: 0, streak: 0, bestStreak: 0 });
    },
    saveSession: function (s) { return store.set('drillSession', s); },
    reset: function () { store.remove('drillStats'); store.remove('drillSession'); }
  };

  /* ---- マイ例文 ---- */

  store.phrases = {
    all: function () { return store.get('myPhrases', []); },
    add: function (p) {
      var list = store.phrases.all();
      if (list.some(function (x) { return x.fr === p.fr; })) return list;
      list.unshift(Object.assign({ at: Date.now() }, p));
      return store.set('myPhrases', list.slice(0, 500));
    },
    remove: function (fr) {
      return store.set('myPhrases', store.phrases.all().filter(function (x) { return x.fr !== fr; }));
    }
  };

  /* ---- 設定 ---- */

  var DEFAULT_SETTINGS = {
    theme: 'auto',            // auto | light | dark
    voiceURI: '',
    rate: 0.9,
    model: 'gemini-3.6-flash',
    showParts: true,          // 活用表：語幹と語尾を色分け
    showHomophones: true      // 活用表：同じ音のセルに印
  };

  store.settings = {
    all: function () {
      return Object.assign({}, DEFAULT_SETTINGS, store.get('settings', {}));
    },
    get: function (k) { return store.settings.all()[k]; },
    set: function (k, v) {
      var s = store.settings.all();
      s[k] = v;
      return store.set('settings', s);
    },
    defaults: DEFAULT_SETTINGS
  };

  FR.store = store;

}(typeof window !== 'undefined' ? window : globalThis));

</script>

/* speech.js — Web Speech API のラッパ。
 *

 *   - ボイス一覧が非同期でしか揃わない（voiceschanged を待つ）
 *   - フランス語ボイスが入っていない環境がある（バナーで案内し、無音で動き続ける）
 *   - iOS Safari は最初のユーザー操作より前に発話できない（無音発話で解錠する）
 *   - Chrome は長い発話を 15 秒ほどで打ち切る（文に分割し、resume を打ち続ける）

  'use strict';

  var FR = global.FR = global.FR || {};
  var synth = global.speechSynthesis;
  var supported = !!(synth && global.SpeechSynthesisUtterance);

  var voices = [];
  var frVoices = [];
  var chosen = null;
  var rate = 0.9;
  var unlocked = false;
  var readyResolvers = [];
  var voicesReady = false;

  var currentToken = 0;     // 世代番号。stop() で無効化するために使う
  var keepAliveTimer = null;
  var listeners = [];

  /* ---------- ボイスの取得 ---------- */

  function refreshVoices() {
    if (!supported) return;
    var list;
    try { list = synth.getVoices() || []; } catch (e) { list = []; }
    if (!list.length) return;

    voices = list;
    frVoices = list.filter(function (v) {
      return (v.lang || '').toLowerCase().indexOf('fr') === 0;
    });

    // 保存された選択があればそれを、無ければ fr-FR を優先して自動選択
    var saved = FR.store ? FR.store.settings.get('voiceURI') : '';
    chosen = null;
    if (saved) {
      chosen = frVoices.filter(function (v) { return v.voiceURI === saved; })[0] || null;
    }
    if (!chosen) chosen = pickBest(frVoices);

    if (!voicesReady) {
      voicesReady = true;
      readyResolvers.forEach(function (fn) { fn(); });
      readyResolvers = [];

    listeners.forEach(function (fn) { try { fn(); } catch (e) {} });

    if (!list.length) return null;
    // fr-FR を fr-CA などより優先し、その中でローカル（オフライン）音声を優先する

  /** Chrome の 15 秒打ち切り対策：発話中に resume を打ち続ける */

  function stopKeepAlive() {

      else { buf += p; }

    if (buf.trim()) out.push(buf.trim());

    return new Promise(function (resolve) {
      if (token !== currentToken) return resolve();
      var u = new global.SpeechSynthesisUtterance(text);

      var origResolve = finish;
      u.onend = function () { clearTimeout(guard); origResolve(); };
      u.onerror = function () { clearTimeout(guard); origResolve(); };

      try {
        synth.speak(u);
        startKeepAlive();
      } catch (e) { finish(); }

  var speech = {
    supported: supported,

    /** フランス語のボイスが使えるか */
    isReady: function () { return supported && frVoices.length > 0; },

    /** ボイスは無いが Web Speech API 自体はある（別言語の声で読まれてしまう状態） */
    hasAnyVoice: function () { return supported && voices.length > 0; },

    whenReady: whenReady,

    listVoices: function () { return frVoices.slice(); },
    currentVoice: function () { return chosen; },

    setVoice: function (uri) {
      var v = frVoices.filter(function (x) { return x.voiceURI === uri; })[0];
      if (v) {
        chosen = v;
        if (FR.store) FR.store.settings.set('voiceURI', uri);
      }
      return chosen;
    },

    getRate: function () { return rate; },
    setRate: function (r) {
      rate = Math.max(0.4, Math.min(1.5, Number(r) || 0.9));
      if (FR.store) FR.store.settings.set('rate', rate);
      return rate;
    },

    onVoicesChanged: function (fn) { listeners.push(fn); },

    stop: function () {
      currentToken++;
      stopKeepAlive();
      if (supported) { try { synth.cancel(); } catch (e) {} }
    },

    /**
     * フランス語を読み上げる。
     * @param {string} text
     * @param {{rate?:number, pitch?:number, onstart?:Function, onend?:Function}} [opts]
     * @returns {Promise<void>}
     */
    speak: function (text, opts) {
      opts = opts || {};
      if (!supported || !text) { if (opts.onend) opts.onend(); return Promise.resolve(); }

      unlock();
      speech.stop();
      var token = ++currentToken;

      var pieces = chunk(text);
      if (opts.onstart) opts.onstart();

      // cancel() 直後の speak() を Chrome が取りこぼすので一拍置く
      return new Promise(function (resolve) { setTimeout(resolve, 30); })
        .then(function () {
          return pieces.reduce(function (chain, piece) {
            return chain.then(function () {
              if (token !== currentToken) return;
              return speakOne(piece, token, opts);
            });
          }, Promise.resolve());
        })
        .then(function () {
          stopKeepAlive();
          if (token === currentToken && opts.onend) opts.onend();
        });
    },

    /**
     * 複数の文を順に読み上げる。
     * @param {Array<string|{text:string}>} items
     * @param {{gap?:number, onItem?:(index:number)=>void, onend?:Function}} [opts]
     */
    speakSequence: function (items, opts) {
      opts = opts || {};
      if (!supported || !items || !items.length) { if (opts.onend) opts.onend(); return Promise.resolve(); }

      unlock();
      speech.stop();
      var token = ++currentToken;
      var gap = opts.gap != null ? opts.gap : 320;

      return items.reduce(function (chain, item, i) {
        return chain.then(function () {
          if (token !== currentToken) return;
          if (opts.onItem) opts.onItem(i);
          var text = typeof item === 'string' ? item : item.text;
          return speakOne(text, token, opts).then(function () {
            return new Promise(function (r) { setTimeout(r, gap); });
          });
        });
      }, Promise.resolve()).then(function () {
        stopKeepAlive();
        if (token === currentToken) {
          if (opts.onItem) opts.onItem(-1);
          if (opts.onend) opts.onend();
        }
      });
    }
  };

  // 保存済みの速度を復元
  if (FR.store) {
    var r = FR.store.settings.get('rate');
    if (r) rate = Number(r);
  }

  FR.speech = speech;

<script>
/* assets/js/markup.js */
/* markup.js — 章の原稿（Markdown サブセット＋独自記法）を DOM に変換する。
 *
 * 出力はすべて DOM API で組み立てる。innerHTML に文字列を流し込む箇所は無い。
 * AI の生成テキストも同じ経路を通すので、これが安全性の担保になっている。
 *
 * 独自記法
 *   [[Je t'aime.|ジュ・テーム|愛してる。]]   フランス語チップ（クリックで発音）
 *   [[bonjour]]  [[merci||ありがとう]]        カナ・訳は省略可
 *
 *   :::ex 見出し            例文ブロック（1行 = 仏文 | カナ | 和訳）
 *   :::note / :::warn / :::adv / :::tip 見出し   注記ボックス
 *   :::quiz                 練習問題（Q. / A. の行を並べる）
 *   :::vocab 見出し         語彙リスト（1行 = 語 | 品詞 | 意味）
 *   ↑ここまではいずれも ::: の行で閉じる
 *
 *   :::conj chanter présent,futur      活用表（1行完結）
 *   :::drill chanter,parler présent    活用ドリル（1行完結）
 *   :::vmap                            活用の全体図（1行完結）
 *   :::ai-gen 複合過去                 AI 例文生成ボタン（1行完結）
 *   :::ai-ask 質問の例                 AI 質問ボタン（1行完結）
 */
(function (global) {
  'use strict';

  var FR = global.FR = global.FR || {};
  var doc = global.document;

  var BLOCK_DIRECTIVES = { ex: 1, note: 1, warn: 1, adv: 1, tip: 1, deep: 1, quiz: 1, vocab: 1 };
  var SOLO_DIRECTIVES = { conj: 1, drill: 1, vmap: 1, 'ai-gen': 1, 'ai-ask': 1 };

  var CALLOUT_LABEL = {
    note: { icon: '📌', fallback: 'ポイント' },
    warn: { icon: '⚠️', fallback: '要注意' },
    adv:  { icon: '🎓', fallback: '発展' },
    deep: { icon: '🔬', fallback: '詳しく' },
    tip:  { icon: '💡', fallback: 'コツ' }
  };

  function el(tag, cls, text) {
    var n = doc.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ==================== インライン ==================== */

  // 太字やリンクの中身をもう一度 inline() に渡すため、この関数は再帰する。
  // g フラグ付きの正規表現を使い回すと lastIndex が再帰先で巻き戻され、
  // 外側の走査が同じ位置を延々と読み直して止まらなくなる。呼び出しごとに作り直す。
  var INLINE_SRC = '\\[\\[([^\\]]*?)\\]\\]|\\*\\*([\\s\\S]+?)\\*\\*|`([^`]+?)`|\\[([^\\]]+?)\\]\\(([^)\\s]+?)\\)|\\*([^*\\n]+?)\\*';

  /**
   * フランス語チップを作る。
   * @param {string} fr 読み上げる仏語
   * @param {string} [kana] カナ読み
   * @param {string} [gloss] 和訳
   */
  function frChip(fr, kana, gloss) {
    var span = el('span', 'fr');
    span.dataset.fr = fr;
    span.setAttribute('role', 'button');
    span.setAttribute('tabindex', '0');
    span.setAttribute('aria-label', fr + ' を発音');
    span.appendChild(doc.createTextNode(fr));
    if (kana) span.appendChild(el('span', 'kana', kana));
    if (gloss) span.appendChild(el('span', 'gloss', gloss));
    return span;
  }

  /** インライン記法を解釈して frag に流し込む */
  function inline(text, frag) {
    frag = frag || doc.createDocumentFragment();
    var re = new RegExp(INLINE_SRC, 'g');
    var last = 0, m;

    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(doc.createTextNode(text.slice(last, m.index)));
      last = m.index + m[0].length;

      if (m[1] !== undefined) {              // [[fr|kana|gloss]]
        var parts = m[1].split('|');
        frag.appendChild(frChip(parts[0].trim(), (parts[1] || '').trim(), (parts[2] || '').trim()));
      } else if (m[2] !== undefined) {       // **bold**
        var b = el('strong');
        inline(m[2], b);
        frag.appendChild(b);
      } else if (m[3] !== undefined) {       // `code`
        frag.appendChild(el('code', null, m[3]));
      } else if (m[4] !== undefined) {       // [text](url)
        var a = el('a');
        var href = m[5];
        // javascript: 等のスキームは弾く
        a.href = /^(https?:|mailto:|#)/i.test(href) ? href : '#';
        if (/^https?:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
        inline(m[4], a);
        frag.appendChild(a);
      } else if (m[6] !== undefined) {       // *italic*
        var i = el('em');
        inline(m[6], i);
        frag.appendChild(i);
      }
    }
    if (last < text.length) frag.appendChild(doc.createTextNode(text.slice(last)));
    return frag;
  }

  /* ==================== ブロック ==================== */

  function slugify(text, used) {
    var base = String(text).trim().toLowerCase()
      .replace(/[\s　]+/g, '-')
      .replace(/[^\wぁ-んァ-ヶ一-龠ー々a-z0-9-]/g, '')
      .replace(/-+/g, '-').replace(/^-|-$/g, '') || 'sec';
    var s = base, i = 2;
    while (used[s]) { s = base + '-' + i++; }
    used[s] = true;
    return s;
  }

  /**
   * パイプ区切りを分割する。ただし [[ … ]] の内側のパイプは区切りとみなさない。
   * これがないと、表のセルに [[仏文|カナ|訳]] を書いた瞬間に列がずれる。
   */
  function splitPipes(text) {
    var out = [], buf = '', depth = 0;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (c === '[' && text[i + 1] === '[') { depth++; buf += '[['; i++; continue; }
      if (c === ']' && text[i + 1] === ']' && depth > 0) { depth--; buf += ']]'; i++; continue; }
      if (c === '|' && depth === 0) { out.push(buf); buf = ''; continue; }
      buf += c;
    }
    out.push(buf);
    return out;
  }

  function parseTableRow(line) {
    var t = line.trim().replace(/^\|/, '').replace(/\|$/, '');
    return splitPipes(t).map(function (c) { return c.trim(); });
  }
  function isTableDivider(line) {
    return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line);
  }

  /* ---- 各ディレクティブの描画 ---- */

  function renderEx(title, lines) {
    var box = el('div', 'exblock');
    var items = lines.filter(function (l) { return l.trim(); }).map(function (l) {
      var p = splitPipes(l);
      return { fr: (p[0] || '').trim(), kana: (p[1] || '').trim(), ja: (p[2] || '').trim() };
    });

    var head = el('div', 'exblock-head');
    head.appendChild(el('span', 'ttl', title || '例文'));
    var all = el('button', 'btn-mini', '▶ 通して聞く');
    all.type = 'button';
    all.dataset.playAll = '1';
    head.appendChild(all);
    box.appendChild(head);

    var ul = el('ul', 'exlist');
    items.forEach(function (it) {
      var li = el('li');
      li.dataset.fr = it.fr;

      var btn = el('button', 'playbtn', '▶');
      btn.type = 'button';
      btn.setAttribute('aria-label', it.fr + ' を発音');
      li.appendChild(btn);

      var body = el('div', 'ex-text');
      var frLine = el('div', 'ex-fr');
      inline(it.fr, frLine);
      body.appendChild(frLine);
      if (it.kana) body.appendChild(el('div', 'ex-kana', it.kana));
      if (it.ja) body.appendChild(el('div', 'ex-ja', it.ja));
      li.appendChild(body);
      ul.appendChild(li);
    });
    box.appendChild(ul);
    return box;
  }

  function renderCallout(kind, title, lines) {
    var box = el('div', 'callout ' + kind);
    var meta = CALLOUT_LABEL[kind] || { icon: '', fallback: '' };
    var head = el('div', 'callout-title');
    if (meta.icon) head.appendChild(doc.createTextNode(meta.icon));
    head.appendChild(doc.createTextNode(' ' + (title || meta.fallback)));
    box.appendChild(head);
    blocks(lines, box, { used: {}, headings: [] });
    return box;
  }

  function renderQuiz(title, lines) {
    var wrap = doc.createDocumentFragment();
    var cur = null;

    function flush() { if (cur) { wrap.appendChild(cur.box); cur = null; } }

    lines.forEach(function (line) {
      var q = line.match(/^\s*Q[.．:：]\s*(.*)$/);
      var a = line.match(/^\s*A[.．:：]\s*(.*)$/);
      if (q) {
        flush();
        var box = el('div', 'quiz');
        var qp = el('div', 'quiz-q');
        inline(q[1], qp);
        box.appendChild(qp);

        var btn = el('button', 'quiz-reveal', '答えを見る');
        btn.type = 'button';
        box.appendChild(btn);

        var ans = el('div', 'quiz-a');
        ans.hidden = true;
        box.appendChild(ans);

        btn.addEventListener('click', function () {
          ans.hidden = !ans.hidden;
          btn.textContent = ans.hidden ? '答えを見る' : '答えを隠す';
        });
        cur = { box: box, ans: ans };
      } else if (a && cur) {
        var p = el('p');
        inline(a[1], p);
        cur.ans.appendChild(p);
      } else if (line.trim() && cur) {
        var p2 = el('p');
        inline(line, p2);
        cur.ans.appendChild(p2);
      }
    });
    flush();

    if (title) {
      var head = el('h3', null, title);
      var frag = doc.createDocumentFragment();
      frag.appendChild(head);
      frag.appendChild(wrap);
      return frag;
    }
    return wrap;
  }

  function renderVocab(title, lines) {
    var box = el('div', 'vocab');
    var head = el('div', 'vocab-head');
    head.appendChild(el('span', null, '📖 ' + (title || 'この章の語彙')));
    var all = el('button', 'btn-mini', '▶ 通して聞く');
    all.type = 'button';
    all.dataset.playAll = '1';
    head.appendChild(all);
    box.appendChild(head);

    var ul = el('ul', 'vocab-list');
    lines.filter(function (l) { return l.trim(); }).forEach(function (l) {
      var p = splitPipes(l);
      var word = (p[0] || '').trim();
      var pos = (p[1] || '').trim();
      var mean = (p[2] || '').trim();

      var li = el('li');
      li.dataset.fr = word;
      var w = el('span', 'vocab-fr', word);
      w.dataset.fr = word;
      w.setAttribute('role', 'button');
      w.setAttribute('tabindex', '0');
      li.appendChild(w);
      if (pos) li.appendChild(el('span', 'vocab-pos', pos));
      if (mean) li.appendChild(el('span', 'vocab-ja', mean));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    return box;
  }

  function renderSolo(name, args) {
    // 依存モジュールは読み込み順の都合で、描画時点で解決する
    try {
      if (name === 'conj' && FR.conjTable) {
        var a = FR.conj.parseDirective(args);
        return FR.conjTable.render(a.verbs[0], a.tenses);
      }
      if (name === 'drill' && FR.drill) {
        var b = FR.conj.parseDirective(args);
        return FR.drill.embed({ verbs: b.verbs, tenses: b.tenses });
      }
      if (name === 'vmap' && FR.conjTable && FR.conjTable.renderMap) {
        return FR.conjTable.renderMap(args.trim());
      }
      if ((name === 'ai-gen' || name === 'ai-ask') && FR.aiPanel) {
        return FR.aiPanel.embedButton(name, args.trim());
      }
    } catch (e) {
      var err = el('div', 'callout warn');
      err.appendChild(el('div', 'callout-title', '表示できませんでした'));
      err.appendChild(el('p', null, name + ': ' + (e && e.message ? e.message : String(e))));
      return err;
    }
    return null;
  }

  /* ---- 本体 ---- */

  function blocks(lines, parent, ctx) {
    var i = 0;

    function flushList(type, items) {
      var list = el(type);
      items.forEach(function (item) {
        var li = el('li');
        inline(item.text, li);
        if (item.children.length) {
          // 入れ子は素朴に、同じ関数へ委譲する
          blocks(item.children, li, ctx);
        }
        list.appendChild(li);
      });
      parent.appendChild(list);
    }

    while (i < lines.length) {
      var line = lines[i];
      var trimmed = line.trim();

      // 空行
      if (!trimmed) { i++; continue; }

      // ディレクティブ
      var dir = trimmed.match(/^:::([a-z-]+)\s*(.*)$/);
      if (dir) {
        var name = dir[1], args = dir[2];

        if (SOLO_DIRECTIVES[name]) {
          var solo = renderSolo(name, args);
          if (solo) parent.appendChild(solo);
          i++;

        }

        if (BLOCK_DIRECTIVES[name]) {

          // 深さを数えないと内側の ::: で外側まで閉じてしまう。
          var body = [];
          var depth = 1;
          i++;
          while (i < lines.length) {
            var cur = lines[i].trim();
            if (cur === ':::') {
              depth--;
              if (depth === 0) break;
            } else {
              var inner = cur.match(/^:::([a-z-]+)/);
              if (inner && BLOCK_DIRECTIVES[inner[1]]) depth++;
            }
            body.push(lines[i]);
            i++;
          }
          i++; // 閉じの ::: を読み飛ばす

          if (name === 'ex') parent.appendChild(renderEx(args, body));
          else if (name === 'quiz') parent.appendChild(renderQuiz(args, body));
          else if (name === 'vocab') parent.appendChild(renderVocab(args, body));
          else parent.appendChild(renderCallout(name, args, body));
          continue;
        }
      }

      // ::: で始まるのにここまで来た行（未知のディレクティブ、対応の取れていない閉じ ::: など）は
      // 読み飛ばす。ここで i を進めないと、下の段落処理が即 break して無限ループになる。
      if (trimmed.indexOf(':::') === 0) { i++; continue; }

      // 見出し
      var h = trimmed.match(/^(#{2,4})\s+(.*)$/);
      if (h) {
        var level = h[1].length;
        var node = el('h' + level);
        inline(h[2], node);
        var id = slugify(node.textContent, ctx.used);
        node.id = id;
        ctx.headings.push({ id: id, level: level, text: node.textContent });
        parent.appendChild(node);
        i++;
        continue;
      }

      // 水平線
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
        parent.appendChild(el('hr'));
        i++;
        continue;
      }

      // 表
      if (trimmed.indexOf('|') !== -1 && i + 1 < lines.length && isTableDivider(lines[i + 1])) {
        var headCells = parseTableRow(line);
        i += 2;
        var rows = [];
        while (i < lines.length && lines[i].trim().indexOf('|') !== -1 && lines[i].trim()) {
          rows.push(parseTableRow(lines[i]));
          i++;
        }
        var wrap = el('div', 'table-wrap');
        var table = el('table');
        var thead = el('thead');
        var htr = el('tr');
        headCells.forEach(function (c) {
          var th = el('th');
          inline(c, th);
          htr.appendChild(th);
        });
        thead.appendChild(htr);
        table.appendChild(thead);

        var tbody = el('tbody');
        rows.forEach(function (r) {
          var tr = el('tr');
          r.forEach(function (c) {
            var td = el('td');
            inline(c, td);
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        wrap.appendChild(table);
        parent.appendChild(wrap);
        continue;
      }

      // 箇条書き（ネスト1段まで）
      var bullet = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
      if (bullet) {
        var ordered = /\d/.test(bullet[2]);
        var items = [];
        var baseIndent = bullet[1].length;
        while (i < lines.length) {
          var bm = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
          if (!bm) {
            // 継続行（インデントされた本文）は直前の項目にぶら下げる
            if (lines[i].trim() && /^\s{2,}/.test(lines[i]) && items.length) {
              items[items.length - 1].children.push(lines[i].replace(/^\s{2,}/, ''));
              i++;
              continue;
            }
            break;
          }
          if (bm[1].length > baseIndent && items.length) {
            items[items.length - 1].children.push(lines[i].slice(baseIndent + 2));
            i++;
            continue;
          }
          if (bm[1].length < baseIndent) break;
          items.push({ text: bm[3], children: [] });
          i++;

      }

      if (/^>\s?/.test(trimmed)) {
        var quote = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          quote.push(lines[i].replace(/^\s*>\s?/, ''));

        blocks(quote, bq, ctx);
        parent.appendChild(bq);
        continue;
      }

      // 段落（次の空行 or ブロック開始まで）
      var para = [];
      while (i < lines.length) {
        var l = lines[i];
        if (!l.trim()) break;
        if (/^:::/.test(l.trim())) break;
        if (/^#{2,4}\s/.test(l.trim())) break;
        if (/^(\s*)([-*+]|\d+[.)])\s+/.test(l)) break;
        if (/^>\s?/.test(l.trim())) break;
        para.push(l.trim());
        i++;

        var p = el('p');
        if (para[0].indexOf('{lead}') === 0) {
          p.className = 'lead';
          para[0] = para[0].slice(6).trim();
        }
        inline(para.join(' '), p);
        parent.appendChild(p);
      }
    }
  }

     * 原稿を DOM に変換する。
     * @param {string} src
     * @returns {{fragment: DocumentFragment, headings: Array<{id:string,level:number,text:string}>}}
     */
    parse: function (src) {

      var frag = doc.createDocumentFragment();
      var lines = String(src == null ? '' : src).replace(/\r\n?/g, '\n').split('\n');
      blocks(lines, frag, ctx);
      return { fragment: frag, headings: ctx.headings };
    },

    /** 原稿を要素に描画して、見出し一覧を返す */
    renderInto: function (target, src) {
      var out = markup.parse(src);
      target.textContent = '';
      target.appendChild(out.fragment);
      return out.headings;
    },

    inline: inline,
    frChip: frChip,
    el: el
  };

  /* ---- 発音のイベント委譲（全体で1つだけ張る） ---- */

  function speakFrom(node) {
    var host = node.closest('[data-fr]');
    if (!host || !FR.speech) return;
    var text = host.dataset.fr;
    if (!text) return;

    doc.querySelectorAll('.speaking').forEach(function (n) { n.classList.remove('speaking'); });
    host.classList.add('speaking');
    FR.speech.speak(text, {
      onend: function () { host.classList.remove('speaking'); }
    });
  }

  function playAllIn(container) {
    if (!FR.speech) return;
    var items = Array.prototype.slice.call(container.querySelectorAll('[data-fr]'))
      .filter(function (n) { return n.dataset.fr; });
    // 入れ子（li と その中の span）で二重にならないよう、最も外側だけ拾う
    items = items.filter(function (n) {
      return !items.some(function (o) { return o !== n && o.contains(n); });
    });
    var texts = items.map(function (n) { return n.dataset.fr; });

    FR.speech.speakSequence(texts, {
      onItem: function (idx) {
        items.forEach(function (n) { n.classList.remove('speaking'); });
        if (idx >= 0 && items[idx]) items[idx].classList.add('speaking');
      }
    });
  }

  if (doc) {
    doc.addEventListener('click', function (e) {
      var all = e.target.closest('[data-play-all]');
      if (all) {
        e.preventDefault();
        var host = all.closest('.exblock, .vocab, .conj');
        if (host) playAllIn(host);
        return;
      }
      var play = e.target.closest('.playbtn');
      if (play) { e.preventDefault(); speakFrom(play); return; }
      var chip = e.target.closest('.fr[data-fr], .vocab-fr[data-fr]');
      if (chip) { speakFrom(chip); }
    });

    doc.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var chip = e.target.closest && e.target.closest('.fr[data-fr], .vocab-fr[data-fr]');
      if (chip) { e.preventDefault(); speakFrom(chip); }
    });
  }

  markup.playAllIn = playAllIn;
  markup.speakFrom = speakFrom;

  FR.markup = markup;

    var tu = pres[1];

  /**
   * 過去分詞の性数一致を反映した形を返す。

  function compoundForms(entry, auxTenseKey, opts) {

    var out;
    if (t.compound) {
      out = compoundForms(entry, t.compound, opts);
    } else {
      switch (tenseKey) {
        case 'present':      out = presentForms(entry); break;
        case 'imparfait':    out = imparfaitForms(entry); break;
        case 'futur':        out = futurForms(entry); break;
        case 'conditionnel': out = conditionnelForms(entry); break;
        case 'subjonctif':   out = subjonctifForms(entry); break;
        case 'imperatif':    out = imperatifForms(entry); break;

    info: function (inf) {

        base: e.inf,
        pronominal: !!e.pronominal,

        aux: auxOf(e),

     * 活用形を取得する。
     * @param {string} inf 不定詞
     * @param {string} tense 時制（別名可）

        tense: TENSE_BY_KEY[key],
