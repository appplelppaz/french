Je lui téléphone. | ジュ・リュイ・テレフォヌ | 私は彼（女）に電話する。
Tu leur parles ? | テュ・ルール・パルル | 君は彼らに話すの？
Elle me donne un livre. | エル・ム・ドンヌ・アン・リーヴル | 彼女は私に本をくれる。
Je vous écris. | ジュ・ヴー・ゼクリ | 私はあなたに手紙を書く。
Il nous répond. | イル・ヌー・レポン | 彼は私たちに答える。
:::

:::warn leur は所有形容詞の leur と同じ綴り
第10章で「彼らの」を表す所有形容詞 **leur** を学びました。間接目的語代名詞も **leur** です。綴りが同じなので、位置で区別します。

| | 例 | 見分け方 |
|---|---|---|
| 所有形容詞 | [[leur voiture\|ルール・ヴォワテュール\|彼らの車]] | **名詞の前** |
| 間接目的語代名詞 | [[Je leur parle.\|ジュ・ルール・パルル\|彼らに話す]] | **動詞の前** |

さらに決定的な違いがあります。**代名詞の leur は絶対に s が付きません。**

- 所有形容詞：leur voiture / **leurs** voitures（名詞に合わせて複数形になる）
- 代名詞：Je **leur** parle.（常に leur。× leurs）

書き取りで頻出の誤りです。
:::

## 2. どの動詞が à を取るか

**形より難しいのはこちらです。** 日本語の「〜に」と一致しないことが多いため、動詞ごとに覚える必要があります。

:::deep à を取る主な動詞（＝ lui / leur を使う）
**伝達・授受の動詞**が中心です。「誰かに向けて何かを渡す・伝える」という意味を持つ動詞は à を取ります。

| 動詞 | 意味 |
|---|---|
| [[parler à\|パルレ・ア]] | 〜に話す |
| [[dire à\|ディール・ア]] | 〜に言う |
| [[demander à\|ドゥマンデ・ア]] | 〜に尋ねる |
| [[répondre à\|レポンドル・ア]] | 〜に答える |
| [[téléphoner à\|テレフォネ・ア]] | 〜に電話する |
| [[écrire à\|エクリール・ア]] | 〜に手紙を書く |
| [[donner à\|ドネ・ア]] | 〜に与える |
| [[offrir à\|オフリール・ア]] | 〜に贈る |
| [[montrer à\|モントレ・ア]] | 〜に見せる |
| [[envoyer à\|アンヴォワイエ・ア]] | 〜に送る |
| [[prêter à\|プレテ・ア]] | 〜に貸す |
| [[rendre à\|ランドル・ア]] | 〜に返す |
| [[expliquer à\|エクスプリケ・ア]] | 〜に説明する |
| [[obéir à\|オベイール・ア]] | 〜に従う |
| [[ressembler à\|ルサンブレ・ア]] | 〜に似ている |
| [[plaire à\|プレール・ア]] | 〜の気に入る |
| [[sourire à\|スリール・ア]] | 〜に微笑む |

**多くは「直接目的語（モノ）＋ 間接目的語（人）」の2つを取ります。**
[[Je donne un livre à Marie.\|ジュ・ドンヌ・アン・リーヴル・ア・マリ\|私はマリに本をあげる。]]
→ モノ（un livre）＝直接目的語、人（à Marie）＝間接目的語
:::

:::warn 英語・日本語とずれる動詞
ここが実務的な落とし穴です。

| フランス語 | 目的語 | 英語 | 日本語 |
|---|---|---|---|
| **téléphoner à** | 間接 | call（直接） | 〜に電話する |
| **répondre à** | 間接 | answer（直接） | 〜に答える |
| **obéir à** | 間接 | obey（直接） | 〜に従う |
| **ressembler à** | 間接 | resemble（直接） | 〜に似ている |
| **plaire à** | 間接 | please（直接） | 〜の気に入る |
| **attendre** | 直接 | wait **for** | 〜を待つ |
| **chercher** | 直接 | look **for** | 〜を探す |
| **écouter** | 直接 | listen **to** | 〜を聞く |
| **regarder** | 直接 | look **at** | 〜を見る |
| **payer** | 直接 | pay **for** | 〜を払う |
| **demander** | 直接（モノ）+ 間接（人） | ask | 〜に〜を尋ねる |

**フランス語と英語で前置詞の有無が逆転している**ものが多くあります。英語からの類推は危険です。
:::

:::note plaire を使った「好き」の言い方
[[plaire à\|プレール・ア\|〜の気に入る]] は、主語と目的語が日本語と逆転する動詞です。

- [[Ce livre me plaît.\|ス・リーヴル・ム・プレ\|この本は私の気に入っている（＝私はこの本が好きだ）。]]
- 直訳：「この本が、私に、気に入っている」

つまり**好きな対象が主語**になります。スペイン語の gustar、イタリア語の piacere と同じ構造です。

挨拶の [[S'il vous plaît.\|スィル・ヴ・プレ\|お願いします]] も、直訳すると「もしそれがあなたの気に入るなら」です。この plaît が plaire の活用形だと分かると、成句の意味が見えてきます。
:::

## 3. 位置 — 直接目的語と同じ

規則は第17章とまったく同じです。**動詞の前**に置きます。

:::ex 位置の規則
Je lui parle. | ジュ・リュイ・パルル | 私は彼に話す。
Je ne lui parle pas. | ジュ・ヌ・リュイ・パルル・パ | 私は彼に話さない。
Je veux lui parler. | ジュ・ヴ・リュイ・パルレ | 私は彼に話したい。
Je vais lui téléphoner. | ジュ・ヴェ・リュイ・テレフォネ | 私は彼に電話するつもりだ。
Parle-lui ! | パルル・リュイ | 彼に話しかけて！
Ne lui parle pas ! | ヌ・リュイ・パルル・パ | 彼に話しかけるな！
:::

肯定命令のときだけ後ろに来る点も同じです。ただし**lui / leur は形が変わりません**（me → moi のような変化がない）。

## 4. 直接目的語との使い分けを試す

:::ex 同じ動詞で直接と間接を比べる
Je le vois. | ジュ・ル・ヴォワ | 私は彼を見る。（voir は直接）
Je lui parle. | ジュ・リュイ・パルル | 私は彼に話す。（parler à は間接）
Je l'attends. | ジュ・ラタン | 私は彼を待つ。（attendre は直接）
Je lui réponds. | ジュ・リュイ・レポン | 私は彼に答える。（répondre à は間接）
Je l'écoute. | ジュ・レクット | 私は彼の話を聞く。（écouter は直接）
Je lui téléphone. | ジュ・リュイ・テレフォヌ | 私は彼に電話する。（téléphoner à は間接）
:::

:::note 判定の手順
迷ったら、**代名詞にする前の文を作ってみる**のが確実です。

1. 名詞で言ってみる：Je parle **à Marie**.
2. à があるか確認する：**ある** → 間接目的語
3. だから代名詞は **lui**：Je **lui** parle.

一方：
1. Je vois **Marie**.（前置詞なし）
2. à が **ない** → 直接目的語
3. だから代名詞は **la**：Je **la** vois.

**代名詞を選ぶ前に、名詞のままの文を思い浮かべる** ——これが最も確実な手順です。
:::

## 5. モノを受ける à — lui ではなく y

:::warn lui / leur は「人」にしか使えない
これは重要な制限です。

- à + **人** → **lui / leur**
- à + **モノ・場所** → **y**（第26章）

:::ex 人とモノで代名詞が変わる
Je pense à Marie. → Je pense à elle. | ジュ・パンス・ア・エル | 私は彼女のことを考える。
Je pense à mon travail. → J'y pense. | ジ・パンス | 私はそれについて考える。
Je réponds à Marie. → Je lui réponds. | ジュ・リュイ・レポン | 私は彼女に答える。
Je réponds à la question. → J'y réponds. | ジ・レポン | 私はそれに答える。
:::

1行目に注意してください。**penser à + 人** では、lui ではなく**強勢形（第19章）の à elle** を使います。penser, songer, tenir, s'intéresser など一部の動詞は、人でも à + 強勢形を取るという例外があります。第19章でまとめます。
:::

## 6. 直接目的語と間接目的語を両方使う

**「誰かに何かを」**という文では、代名詞が2つ並びます。語順は第26.5章で完全に扱いますが、原則だけ示します。

:::ex 代名詞が2つ並ぶとき
Il me donne le livre. → Il me le donne. | イル・ム・ル・ドンヌ | 彼はそれを私にくれる。
Je te montre la photo. → Je te la montre. | ジュ・ト・ラ・モントル | 私はそれを君に見せる。
Je donne le livre à Marie. → Je le lui donne. | ジュ・ル・リュイ・ドンヌ | 私はそれを彼女にあげる。
:::

:::note 語順は「人称の低い順」ではない
規則はこうです。

| 1 | 2 | 3 |
|---|---|---|
| me, te, nous, vous | le, la, les | lui, leur |

つまり **1・2人称は直接／間接を問わず先頭**、そのあと**直接の le/la/les**、最後に**間接の lui/leur** という順です。

- Il **me le** donne.（me が先）
- Je **le lui** donne.（le が先、lui が後）

**me と lui が同時に現れることはありません**（× me lui）。その場合は間接目的語を à + 強勢形にして後ろに回します：[[Il me présente à lui.\|イル・ム・プレザン・タ・リュイ\|彼は私を彼に紹介する。]]

第26.5章で y, en も含めた完全な語順表を扱います。
:::

## 7. 「彼女に伝えたい」を言ってみる

章のタイトルどおり、間接目的語を使った表現を並べます。

:::ex 気持ちを伝える
Je veux lui dire la vérité. | ジュ・ヴ・リュイ・ディール・ラ・ヴェリテ | 彼女に本当のことを伝えたい。
Je lui écris une lettre. | ジュ・リュイ・エクリ・ユヌ・レットル | 彼女に手紙を書く。
Je vais lui offrir des fleurs. | ジュ・ヴェ・リュイ・オフリール・デ・フルール | 彼女に花を贈るつもりだ。
Dis-lui que je l'aime. | ディ・リュイ・ク・ジュ・レーム | 私が愛していると彼女に伝えて。
Elle ne me répond jamais. | エル・ヌ・ム・レポン・ジャメ | 彼女は決して私に返事をくれない。
:::

最後から2番目の文には、**間接目的語 lui と直接目的語 l' の両方**が入っています。Dis-**lui**（彼女に言え）＋ je **l'**aime（私は彼女を愛している）。同じ人物が、動詞によって間接になったり直接になったりする——ここまで来れば、その理由が説明できるはずです。

## 練習問題

:::quiz
Q. 直接目的語代名詞と間接目的語代名詞で、形が違うのはどの人称ですか。
A. 3人称だけ。直接は le / la / les、間接は lui / leur。1・2人称（me, te, nous, vous）は同じ形。したがって新しく覚えるのは lui と leur の2語だけ。

Q. Je lui parle. の lui は男性ですか、女性ですか。
A. どちらとも決まらない。間接目的語代名詞 lui / leur には性の区別がない。直接目的語の le / la が性を区別するのとは対照的。

Q. Je leurs parle. はなぜ誤りですか。
A. 代名詞の leur は常に leur であり、s が付かない。s が付くのは所有形容詞のほう（leurs voitures）。位置でも区別でき、名詞の前なら所有形容詞、動詞の前なら代名詞。

Q. 「彼に電話する」と「彼を待つ」で、使う代名詞が違うのはなぜですか。
A. téléphoner は à を取る間接他動詞（téléphoner à）なので **Je lui téléphone.**、attendre は前置詞なしの直接他動詞なので **Je l'attends.** 英語では call が直接、wait for が間接と逆転しているので、英語からの類推は危険。

Q. Ce livre me plaît. を日本語に訳し、主語が何かを説明してください。
A. 「この本は私の気に入っている（＝私はこの本が好きだ）」。主語は **ce livre**（好きな対象のほう）で、me は間接目的語。日本語や英語と主語・目的語が逆転する動詞で、スペイン語の gustar と同じ構造。挨拶の s'il vous plaît もこの動詞。

Q. Je réponds à Marie. と Je réponds à la question. を、それぞれ代名詞にしてください。
A. **Je lui réponds.**（à + 人 → lui）と **J'y réponds.**（à + モノ → y、第26章）。lui / leur は人にしか使えず、モノ・場所を受けるときは y を使う。
:::

[[avec toi\|アヴェック・トワ\|君と一緒に]] ——この **toi** が強勢形（le pronom tonique / la forme accentuée）です。

第17章・第18章で扱った目的語代名詞は、いずれも**動詞にくっついて働く弱い形**でした。単独では立てず、強調もできず、前置詞の後ろにも置けません。強勢形は**その足りない部分をすべて引き受ける形**です。

「弱形と強形が対になっている」という構造は、第12章の que / quoi でも見ました。フランス語の代名詞体系を貫く原理です。

## 1. 強勢形の一覧

| 主語 | 強勢形 |
|---|---|
| je | **moi** |
| tu | **toi** |
| il | **lui** |
| elle | **elle** |
| nous | **nous** |
| vous | **vous** |
| ils | **eux** |
| elles | **elles** |

:::ex 強勢形
moi | モワ | 私
toi | トワ | 君
lui | リュイ | 彼
elle | エル | 彼女
nous | ヌー | 私たち
vous | ヴー | あなた（たち）
eux | ウー | 彼ら
elles | エル | 彼女ら
:::

:::warn 新しく覚えるのは4語だけ
nous, vous, elle, elles は主語形と同じです。実際に覚えるのは **moi, toi, lui, eux** の4語。

ただし **lui** には注意が必要です。第18章の間接目的語代名詞 lui と綴りが同じですが、**別のもの**です。

| | 例 | 位置 |
|---|---|---|
| 間接目的語の lui（男女共通） | [[Je lui parle.\|ジュ・リュイ・パルル\|彼／彼女に話す]] | 動詞の前 |
| 強勢形の lui（男性のみ） | [[avec lui\|アヴェック・リュイ\|彼と一緒に]] | 前置詞の後など |

**強勢形の lui は男性専用**で、女性は elle です。間接目的語の lui が男女共通だったのとは逆なので、混同しやすい箇所です。

そして **eux**（彼ら）は強勢形にしかない形です。
:::

## 2. 強勢形を使う7つの場面

**「動詞にくっついていないとき」**が共通条件です。

### （1）前置詞の後

最も多い用法です。

:::ex 前置詞の後
avec moi | アヴェック・モワ | 私と一緒に
pour toi | プール・トワ | 君のために
chez lui | シェ・リュイ | 彼の家で
sans elle | サン・ゼル | 彼女なしで
entre nous | アントル・ヌー | 私たちの間で
devant eux | ドゥヴァン・トゥー | 彼らの前で
:::

:::warn 前置詞の後に主語形や目的語形は置けない
- × avec je → ○ avec **moi**
- × pour te → ○ pour **toi**

第12章の「前置詞の後ろは que ではなく quoi」とまったく同じ原理です。**前置詞の後は強い位置なので、強い形が要る。**
:::

### （2）強調

主語や目的語を強調するとき、強勢形を文頭・文末に置きます。

:::ex 強調
Moi, je suis japonais. | モワ・ジュ・スュイ・ジャポネ | 私はね、日本人なんだ。
Lui, il ne comprend rien. | リュイ・イル・ヌ・コンプラン・リアン | あいつは何も分かってない。
Je le connais, moi. | ジュ・ル・コネ・モワ | 私は彼を知っているよ。
:::

:::note 主語代名詞は残す
Moi, je suis … のように、**強勢形を置いても主語代名詞 je は省略しません**。強勢形は主語の代わりではなく、**主語に添える強調**だからです。

× Moi suis japonais.
○ Moi, **je** suis japonais.

例外は「主語が強勢形だけで成立する場合」——次の（3）（4）です。
:::

### （3）単独で使うとき

動詞がない返答では、弱形は使えません。

:::ex 単独で
Qui est là ? — Moi. | キ・エ・ラ・モワ | 誰？ — 私。
Qui veut du café ? — Moi ! | キ・ヴ・デュ・カフェ・モワ | コーヒー欲しい人？ — はい！
Elle est plus grande que toi. | エ・レ・プリュ・グランド・ク・トワ | 彼女は君より背が高い。
:::

### （4）比較の que の後（第14章）

:::ex 比較の後
Il est plus grand que moi. | イ・レ・プリュ・グラン・ク・モワ | 彼は私より背が高い。
Elle travaille autant que lui. | エル・トラヴァイユ・オタン・ク・リュイ | 彼女は彼と同じくらい働く。
:::

### （5）et / ou でつなぐとき

:::ex 並列
Toi et moi | トワ・エ・モワ | 君と私
Lui ou elle ? | リュイ・ウー・エル | 彼それとも彼女？
Marie et moi, nous sommes amis. | マリ・エ・モワ・ヌー・ソム・ザミ | マリと私は友人です。
:::

:::note 並列すると主語代名詞でまとめ直す
Marie et moi の後ろに **nous** が来ている点に注目してください。並列された主語は、**それをまとめる主語代名詞**で受け直すのが標準的です。

- Marie et moi → **nous**（1人称が含まれるので nous）
- Marie et toi → **vous**（2人称が含まれるので vous）
- Marie et lui → **ils**

[[Toi et moi, nous partons demain.\|トワ・エ・モワ・ヌー・パルトン・ドゥマン\|君と私は明日出発する。]]

話し言葉では受け直しを省くこともありますが、書き言葉では入れます。
:::

### （6）c'est の後

:::ex c'est + 強勢形
C'est moi. | セ・モワ | 私です。
C'est toi qui as raison. | セ・トワ・キ・ア・レゾン | 正しいのは君だ。
Ce sont eux. | ス・ソン・トゥー | 彼らです。
:::

:::warn 3人称複数だけ ce sont
C'est moi / toi / lui / elle / nous / vous …と続きますが、**eux / elles だけは ce sont** を使います（書き言葉）。

- C'est **moi**.
- **Ce sont** eux.

これは第4章で見た「複数には ce sont」の規則がそのまま効いているためです。話し言葉では C'est eux. も使われます。
:::

### （7）même を付けて「自分自身」

:::ex 〜自身
moi-même | モワ・メーム | 私自身
toi-même | トワ・メーム | 君自身
lui-même | リュイ・メーム | 彼自身
elle-même | エル・メーム | 彼女自身
nous-mêmes | ヌー・メーム | 私たち自身
vous-même(s) | ヴー・メーム | あなた（たち）自身
eux-mêmes | ウー・メーム | 彼ら自身
:::

**ハイフンでつなぎ、複数では même に s が付きます**（nous-mêmes, eux-mêmes）。vous-même は相手が1人なら s なし、複数なら s ありです。

[[Je l'ai fait moi-même.\|ジュ・レ・フェ・モワ・メーム\|私はそれを自分でやった。]]

## 3. penser à + 強勢形 — lui を使わない動詞

:::deep à を取るのに間接目的語代名詞が使えない動詞
第18章で予告した例外です。**一部の動詞は、à + 人 であっても lui / leur を使えず、à + 強勢形にします。**

| 動詞 | 意味 |
|---|---|
| [[penser à\|パンセ・ア]] | 〜のことを考える |
| [[songer à\|ソンジェ・ア]] | 〜に思いをはせる |
| [[tenir à\|トゥニール・ア]] | 〜を大切に思う |
| [[s'intéresser à\|サンテレセ・ア]] | 〜に興味を持つ |
| [[faire attention à\|フェール・アタンスィオン・ア]] | 〜に注意する |
| [[s'habituer à\|サビテュエ・ア]] | 〜に慣れる |
| [[s'adresser à\|サドレセ・ア]] | 〜に話しかける |
| [[renoncer à\|ルノンセ・ア]] | 〜を諦める |

:::ex 例外の動詞
Je pense à Marie. → Je pense à elle. | ジュ・パンス・ア・エル | 私は彼女のことを考える。
Je tiens à toi. | ジュ・ティアン・ザ・トワ | 私は君を大切に思っている。
Elle s'intéresse à lui. | エル・サンテレス・ア・リュイ | 彼女は彼に興味がある。
:::

× Je lui pense. とは言えません。

**なぜこの例外があるのか。** これらの動詞の à は、**「相手に向けて何かを渡す」タイプの à ではない**からです。第18章で見た donner à / parler à は「相手に届ける」動詞ですが、penser à / tenir à は「〜に向かう心の動き」であって、相手は受け手ではありません。この意味の違いが、代名詞の形の違いとして表れています。

**代名動詞（se + 動詞、第23章）はすべてこの型**になる、と覚えておくと整理しやすくなります（s'intéresser, s'habituer, s'adresser…）。
:::

## 4. 強勢形と目的語代名詞の対応表

:::note 3系列を並べて確認する
| | 主語 | 直接目的語 | 間接目的語 | 強勢形 |
|---|---|---|---|---|
| 1単 | je | me | me | **moi** |
| 2単 | tu | te | te | **toi** |
| 3単男 | il | le | lui | **lui** |
| 3単女 | elle | la | lui | **elle** |
| 1複 | nous | nous | nous | nous |
| 2複 | vous | vous | vous | vous |
| 3複男 | ils | les | leur | **eux** |
| 3複女 | elles | les | leur | **elles** |

**縦に読むと、3人称だけが4つとも違う形**になっているのが分かります。フランス語の代名詞で難しいのは、結局この3人称の区別に集約されます。

- il / le / lui / lui
- elle / la / lui / elle
- ils / les / leur / eux
- elles / les / leur / elles

**lui が2箇所に現れる**（3単男の間接、3単男の強勢）ことと、**女性の間接目的語も lui である**ことが、混乱の主な原因です。
:::

## 5. 肯定命令での me → moi（復習）

第16章で扱った現象を、いまなら説明できます。

:::ex 肯定命令の moi
Regarde-moi ! | ルガルド・モワ | 私を見て！
Ne me regarde pas ! | ヌ・ム・ルガルド・パ | 私を見ないで！
Donne-moi ça. | ドンヌ・モワ・サ | それをちょうだい。
:::

**肯定命令では代名詞が動詞の後ろに来る＝強い位置になる**ので、弱形 me が強形 moi に変わります。否定命令では動詞の前（弱い位置）なので me のままです。

これは強勢形の原理そのものです。**位置が形を決めている。**

## 6. 「あなたと一緒に」を言ってみる

:::ex 強勢形を使った表現
Je veux rester avec toi. | ジュ・ヴ・レステ・アヴェック・トワ | 君と一緒にいたい。
C'est pour toi. | セ・プール・トワ | これは君のためだ。
Je pense souvent à toi. | ジュ・パンス・スヴァン・タ・トワ | 君のことをよく考える。
Viens chez moi. | ヴィアン・シェ・モワ | 私の家においで。
Toi et moi, pour toujours. | トワ・エ・モワ・プール・トゥジュール | 君と私、永遠に。
Il n'y a que toi. | イル・ニヤ・ク・トワ | 君しかいない。
:::

最後の文は第5章の **ne … que**（〜しかない）です。否定ではなく制限なので、「君だけがいる」という意味になります。

## 練習問題

:::quiz
Q. avec je はなぜ誤りですか。
A. 前置詞の後ろは強い位置なので、強勢形を使う必要がある。正しくは avec **moi**。第12章の「前置詞の後は que ではなく quoi」とまったく同じ原理。

Q. 強勢形で新しく覚えるべき語は何語ですか。
A. 4語（moi, toi, lui, eux）。nous, vous, elle, elles は主語形と同じ。ただし eux は強勢形にしかない形で、lui は間接目的語代名詞と綴りが同じなので注意。

Q. 間接目的語の lui と強勢形の lui は、どう違いますか。
A. 間接目的語の lui は**男女共通**（Je lui parle. は彼にも彼女にも使える）。強勢形の lui は**男性専用**で、女性は elle（avec lui / avec elle）。性の扱いが逆になっている。

Q. Moi suis japonais. はなぜ誤りですか。
A. 強勢形は主語の代わりではなく、主語に添える強調だから、主語代名詞を省略できない。正しくは Moi, **je** suis japonais.

Q. Je pense à Marie. を代名詞にすると、なぜ Je lui pense. にならないのですか。
A. penser à の à は「相手に何かを届ける」タイプではなく「〜に向かう心の動き」を表すため、間接目的語代名詞ではなく à + 強勢形を使う。正しくは **Je pense à elle.** 同型の動詞に tenir à, s'intéresser à, faire attention à などがあり、代名動詞はすべてこの型になる。

Q. 肯定命令で me が moi に変わるのはなぜですか。
A. 肯定命令では代名詞が動詞の後ろ＝強い位置に来るため、弱形 me が強形 moi に変わる。否定命令では動詞の前（弱い位置）なので me のまま。位置が形を決めるという、強勢形の原理そのもの。
:::

{lead}複合過去（le passé composé）は、フランス語で**最も使われる過去形**です。話し言葉では過去のほぼすべてがこれで表されます。

作り方は単純です。**助動詞（avoir または être）の現在形 ＋ 過去分詞**。第13章の全体図でいえば「③過去分詞」の枝の1本目にあたります。

難しいのは作り方ではなく、次の2点です。

1. **助動詞が avoir か être か**
2. **過去分詞が性数一致するかどうか**

とくに2番目は、フランス語文法で最も規則が入り組んだ箇所です。この章ではその全規則を扱います。

## 1. 作り方

:::conj chanter passeCompose

**助動詞 avoir の現在形 ＋ 過去分詞 chanté**。これだけです。

:::ex 複合過去
J'ai chanté. | ジェ・シャンテ | 私は歌った。
Tu as mangé. | テュ・ア・マンジェ | 君は食べた。
Il a fini. | イラ・フィニ | 彼は終えた。
Nous avons pris le train. | ヌー・ザヴォン・プリ・ル・トラン | 私たちは電車に乗った。
Vous avez compris ? | ヴー・ザヴェ・コンプリ | 分かりましたか？
Ils ont travaillé. | イル・ゾン・トラヴァイエ | 彼らは働いた。
:::

## 2. 過去分詞の作り方

| 群 | 作り方 | 例 |
|---|---|---|
| 第1群 -er | -er → **-é** | chanter → chant**é** |
| 第2群 -ir | -ir → **-i** | finir → fin**i** |
| 第3群 -re | -re → **-u** | attendre → attend**u** |

**第1群と第2群は完全に規則的**です。問題は第3群で、ここは個別に覚える必要があります。

:::deep 主な不規則の過去分詞
語尾ごとに整理すると覚えやすくなります。

**-u で終わるもの**（最も多い）

| 不定詞 | 過去分詞 | | 不定詞 | 過去分詞 |
|---|---|---|---|---|
| avoir | **eu**（ユ） | | pouvoir | **pu** |
| boire | **bu** | | vouloir | **voulu** |
| croire | **cru** | | devoir | **dû** |
| connaître | **connu** | | savoir | **su** |
| lire | **lu** | | voir | **vu** |
| recevoir | **reçu** | | vivre | **vécu** |
| courir | **couru** | | venir | **venu** |

**-i / -is / -it で終わるもの**

| 不定詞 | 過去分詞 | | 不定詞 | 過去分詞 |
|---|---|---|---|---|
| prendre | **pris** | | dire | **dit** |
| mettre | **mis** | | écrire | **écrit** |
| suivre | **suivi** | | faire | **fait** |
| partir | **parti** | | | |

**-ert で終わるもの**

ouvrir → **ouvert**、offrir → **offert**、souffrir → **souffert**、couvrir → **couvert**

**特殊**

être → **été**、naître → **né**、mourir → **mort**

:::warn 発音に注意する過去分詞
- **eu**（avoir）は「ウ」ではなく **[y]（ユ）** と読みます。綴りと音が一致しない代表例。
- **dû**（devoir）のアクサン・シルコンフレクスは**男性単数のみ**。女性形は **due**、複数は **dus**（第6章の du との区別のために付いている記号なので、形が変われば不要になる）。

## 3. 助動詞は avoir か être か

**大多数の動詞は avoir を取ります。** être を取るのは限られた動詞だけです。

:::warn être を助動詞に取る動詞
2つのグループがあります。

**（1）移動・状態の変化を表す自動詞（14語）**

| 動詞 | 意味 | 対の動詞 | 意味 |
|---|---|---|---|
| aller | 行く | venir | 来る |
| arriver | 着く | partir | 出発する |
| entrer | 入る | sortir | 出る |
| monter | 上がる | descendre | 降りる |
| naître | 生まれる | mourir | 死ぬ |
| rester | とどまる | tomber | 落ちる |
| retourner | 戻る | passer | 通る |

**多くが対になっている**のが特徴です。フランスの学校では、これらの動詞で作った家の絵（la maison d'être）を使って覚えさせる伝統があります。

これらに接頭辞が付いた派生語も être を取ります：revenir, devenir, rentrer, repartir, remonter…

**（2）代名動詞（第23章）**

se + 動詞の形はすべて être を取ります。[[Je me suis levé.\|ジュ・ム・スュイ・ルヴェ\|私は起きた。]]
:::

:::conj aller passeCompose

:::warn être を取ると過去分詞が主語に一致する
これが être 動詞の決定的な特徴です。

| 主語 | 形 |
|---|---|
| Il est | all**é** |
| Elle est | all**ée** |
| Ils sont | all**és** |
| Elles sont | all**ées** |

:::ex 主語との性数一致
Il est allé au cinéma. | イ・レ・タレ・オ・スィネマ | 彼は映画館に行った。
Elle est allée au cinéma. | エ・レ・タレ・オ・スィネマ | 彼女は映画館に行った。
Ils sont partis. | イル・ソン・パルティ | 彼らは出発した。
Elles sont parties. | エル・ソン・パルティ | 彼女らは出発した。
:::

**allé と allée は発音が同じ**です。音では区別できず、**書くときだけ問題になる**規則です。

ただし mort（mourir）のように子音で終わる過去分詞では、女性形で音が変わります：[[Elle est morte.\|エ・レ・モルト\|彼女は死んだ。]]（t を発音する）。
:::

:::adv 6つの動詞は両方の助動詞を取る
**monter, descendre, sortir, entrer, rentrer, passer, retourner** は、**目的語を取るかどうか**で助動詞が変わります。

| | 助動詞 | 意味 |
|---|---|---|
| 自動詞（目的語なし） | **être** | [[Je suis sorti.\|ジュ・スュイ・ソルティ\|私は外出した。]] |
| 他動詞（目的語あり） | **avoir** | [[J'ai sorti la voiture.\|ジェ・ソルティ・ラ・ヴォワテュール\|私は車を出した。]] |

- [[Elle est montée.\|エ・レ・モンテ\|彼女は上がった。]]（自動詞 → être、一致する）
- [[Elle a monté les valises.\|エラ・モンテ・レ・ヴァリーズ\|彼女はスーツケースを上げた。]]（他動詞 → avoir、一致しない）

**目的語があるかどうかを見る** ——これが判定基準です。
:::

## 4. 過去分詞の性数一致 — 全規則

:::deep フランス語文法で最も入り組んだ規則
過去分詞が一致するかどうかは、**助動詞が何か**と**直接目的語がどこにあるか**で決まります。3つの場合に分かれます。

### 規則①：être + 過去分詞 → 主語に一致する

[[Elle est allée.\|エ・レ・タレ\|彼女は行った。]]、[[Ils sont venus.\|イル・ソン・ヴニュ\|彼らは来た。]]

これは前節で見たとおりです。

### 規則②：avoir + 過去分詞 → 原則として一致しない

[[Elle a chanté.\|エラ・シャンテ\|彼女は歌った。]]（× chantée）
[[Ils ont mangé.\|イル・ゾン・マンジェ\|彼らは食べた。]]（× mangés）

**主語が女性でも複数でも、過去分詞は変わりません。**

### 規則③：avoir + 直接目的語が動詞より前 → その直接目的語に一致する

**ここが最大の難所です。**

avoir を助動詞に取る場合でも、**直接目的語が過去分詞より前に置かれているとき**は、その直接目的語に一致します。

:::ex 直接目的語が前に出ると一致する
J'ai vu Marie. | ジェ・ヴュ・マリ | 私はマリを見た。（目的語が後ろ → 一致しない）
Je l'ai vue. | ジュ・レ・ヴュ | 私は彼女を見た。（l' が前 → vue と一致）
Les livres que j'ai achetés. | レ・リーヴル・ク・ジェ・アシュテ | 私が買った本。（que が前 → achetés）
Quelle robe as-tu choisie ? | ケル・ローブ・ア・テュ・ショワズィ | どのドレスを選んだの？（quelle robe が前 → choisie）
:::

**直接目的語が前に出るのは、次の3つの場合だけです。**

| 場合 | 例 |
|---|---|
| **① 目的語代名詞**（第17章） | Je **l'**ai vu**e**. |
| **② 関係代名詞 que**（第21章） | les livres **que** j'ai achet**és** |
| **③ 疑問形容詞 quel + 名詞**（第10章） | **Quelle robe** as-tu chois**ie** ? |

**この3つ以外では一致しません。**

### 一致しない場合を確認する

**間接目的語が前にあっても一致しません。**

- [[Je lui ai parlé.\|ジュ・リュイ・エ・パルレ\|私は彼女に話した。]]（× parlée）
- lui は**間接**目的語なので、前にあっても一致の対象にならない

**だから第17章・第18章の直接／間接の区別が、ここで効いてきます。** 「téléphoner à は間接だから一致しない」「attendre は直接だから一致する」——代名詞の形を選ぶためだけでなく、過去分詞の形を決めるためにも必要な区別なのです。

:::ex 直接と間接で一致が変わる
Je l'ai attendue. | ジュ・レ・アタンデュ | 私は彼女を待った。（直接 → 一致する）
Je lui ai téléphoné. | ジュ・リュイ・エ・テレフォネ | 私は彼女に電話した。（間接 → 一致しない）
:::

### なぜこんな規則があるのか

歴史的な理由があります。もともと **J'ai vu Marie.** は「私はマリを見られた状態で持っている」という構造でした（avoir は「持つ」）。この段階では、過去分詞は目的語 Marie を修飾する**形容詞**だったので、当然一致していました。

やがて avoir + 過去分詞が「完了」を表す1つのかたまりになると、一致の意識が薄れます。しかし**目的語が前に出ている場合だけ**、古い一致が化石として残った——これが規則③の正体です。

**話し言葉ではほとんど聞こえません**（vu と vue は同音）。実質的に**書くときだけの規則**です。ただしフランス語圏では書き取り（la dictée）で必ず問われる、教養の指標とされる規則でもあります。
:::

:::note 一致するかどうかの判定手順
1. 助動詞は **être** か？ → **主語に一致**して終わり
2. 助動詞は **avoir** → 直接目的語が過去分詞より**前**にあるか？
   - ある → その直接目的語に**一致**
   - ない → **一致しない**
3. 前にあるのが**間接**目的語なら → **一致しない**

この3段階で必ず判定できます。
:::

## 5. 否定・疑問・代名詞との組み合わせ

### 否定 — 助動詞を挟む

第5章の原則どおり、**ne … pas が挟むのは活用した動詞**です。複合過去で活用しているのは助動詞なので、助動詞を挟みます。

:::ex 否定の複合過去
Je n'ai pas chanté. | ジュ・ネ・パ・シャンテ | 私は歌わなかった。
Il n'est pas venu. | イル・ネ・パ・ヴニュ | 彼は来なかった。
Nous n'avons rien vu. | ヌー・ナヴォン・リアン・ヴュ | 私たちは何も見なかった。
Je n'ai jamais compris. | ジュ・ネ・ジャメ・コンプリ | 私は決して理解しなかった。
:::

:::warn personne だけは後ろに来る
否定語の多くは助動詞と過去分詞の間に入りますが、**personne は過去分詞の後ろ**に置かれます。

- [[Je n'ai rien vu.\|ジュ・ネ・リアン・ヴュ\|何も見なかった。]]（rien は間）
- [[Je n'ai vu personne.\|ジュ・ネ・ヴュ・ペルソンヌ\|誰も見なかった。]]（personne は後ろ）

personne はもともと名詞（人）なので、目的語の位置に留まる——第5章で見た語源が、ここでも効いています。
:::

### 疑問 — 助動詞を倒置する

:::ex 疑問の複合過去
As-tu chanté ? | ア・テュ・シャンテ | 君は歌った？
Est-elle venue ? | エ・テル・ヴニュ | 彼女は来た？
Avez-vous compris ? | ザヴェ・ヴー・コンプリ | 分かりましたか？
Qu'est-ce que tu as fait ? | ケ・ス・ク・テュ・ア・フェ | 何をしたの？
:::

倒置するのは**助動詞と主語**です。過去分詞は動きません。

### 代名詞 — 助動詞の前

:::ex 代名詞つきの複合過去
Je l'ai vu. | ジュ・レ・ヴュ | 私はそれを見た。
Je lui ai parlé. | ジュ・リュイ・エ・パルレ | 私は彼に話した。
Je ne l'ai pas vu. | ジュ・ヌ・レ・パ・ヴュ | 私はそれを見なかった。
Il me l'a donné. | イル・ム・ラ・ドネ | 彼はそれを私にくれた。
:::

**代名詞 → 助動詞 → 過去分詞**の順です。× J'ai le vu. とはなりません。

## 6. 複合過去の3つの意味

:::deep 複合過去は「過去」だけを表すのではない
名前のとおり、この時制は本来**完了（le parfait）**を表します。3つの用法があります。

**（1）完了した出来事**（最も多い）
[[J'ai mangé.\|ジェ・マンジェ\|私は食べた。]]

**（2）現在との関わりを持つ完了**（英語の現在完了に近い）
[[J'ai fini !\|ジェ・フィニ\|終わった！（だから今は自由だ）]]
[[Il est parti.\|イ・レ・パルティ\|彼は行ってしまった。（だから今ここにいない）]]

**（3）近い未来の完了**（口語）
[[J'ai fini dans cinq minutes.\|ジェ・フィニ・ダン・サン・ミニュット\|5分で終わります。]]

英語では past simple（I ate）と present perfect（I have eaten）が区別されますが、**フランス語の複合過去はその両方をカバーします**。だから英語話者は「なぜ yesterday と一緒に have eaten の形が使えるのか」と戸惑いますが、フランス語ではこれが標準です。

[[J'ai mangé hier.\|ジェ・マンジェ・イエール\|私は昨日食べた。]]（英語なら × I have eaten yesterday.）
:::

:::adv 複合過去は書き言葉では単純過去に置き換わる
文学作品や歴史記述では、完了した出来事を**単純過去**（第20.5章）で表します。

- 話し言葉・手紙・新聞：[[Il est arrivé.\|イ・レ・タリヴェ\|彼は到着した。]]（複合過去）
- 小説・歴史書：[[Il arriva.\|イ・ラリヴァ\|彼は到着した。]]（単純過去）

つまりフランス語の過去には、**話し言葉の体系と書き言葉の体系が並存している**ことになります。次章でその書き言葉のほうを扱います。
:::

## 練習問題

:::quiz
Q. Je l'ai vue. の vue に e が付いているのはなぜですか。
A. 助動詞 avoir でも、直接目的語が過去分詞より前にあるときはその目的語に一致するため。l' が女性（elle）を受けているので vue になる。目的語が後ろなら一致しない（J'ai vu Marie.）。

Q. Je lui ai parlé. で、なぜ parlée にならないのですか。
A. lui は**間接**目的語だから。一致するのは**直接**目的語が前に出た場合だけで、間接目的語は前にあっても対象外。第17章・第18章の直接／間接の区別が、ここで過去分詞の形を決めている。

Q. être を助動詞に取る動詞には、どんな共通点がありますか。
A. 移動や状態の変化を表す自動詞（aller/venir, arriver/partir, entrer/sortir, monter/descendre, naître/mourir, rester/tomber など、多くが対になっている）と、代名動詞（se + 動詞）。それ以外は原則 avoir。

Q. Elle est montée. と Elle a monté les valises. で、なぜ助動詞が違うのですか。
A. monter, descendre, sortir, entrer, rentrer, passer, retourner の7語は、**目的語を取るかどうか**で助動詞が変わる。自動詞なら être（一致する）、他動詞なら avoir（一致しない）。判定基準は直接目的語の有無。

Q. Je n'ai rien vu. と Je n'ai vu personne. で、否定語の位置が違うのはなぜですか。
A. rien は助動詞と過去分詞の間に入るが、personne は過去分詞の後ろに置かれる。personne がもともと名詞（人）であり、目的語の位置に留まるため。第5章で見た否定語の語源が効いている。

Q. J'ai mangé hier. は、英語では I have eaten yesterday. とは言えません。なぜフランス語では言えるのですか。
A. フランス語の複合過去は、英語の past simple と present perfect の**両方**をカバーするため。完了した出来事も、現在との関わりを持つ完了も、同じ形で表す。英語のような使い分けはない。
:::

{lead}前章の最後で触れたとおり、フランス語の過去には**話し言葉の体系と書き言葉の体系が並存**しています。複合過去が前者、**単純過去（le passé simple）**が後者です。

この時制は、**会話では一度も使いません**。しかし小説・歴史書・新聞の記事・童話・伝記——つまり書かれたフランス語の物語には必ず出てきます。したがって**書けるようになる必要はないが、読めなければならない**時制です。

## 1. 何のためにあるのか

複合過去との違いは、**時間の位置ではなく、語り手の立ち位置**です。

| | 複合過去 | 単純過去 |
|---|---|---|
| 使う場面 | 会話・手紙・メール・新聞の論説 | 小説・歴史・伝記・童話・報道記事 |
| 語り手 | 現在にいて、そこから過去を振り返る | 物語の中にいて、出来事を順に語る |
| 現在との関わり | ある（「〜してしまった、だから今…」） | ない（完全に閉じた過去） |

:::ex 同じ内容を2つの時制で
Il est arrivé à Paris. | イ・レ・タリヴェ・ア・パリ | 彼はパリに着いた。（複合過去・会話）
Il arriva à Paris. | イ・ラリヴァ・ア・パリ | 彼はパリに着いた。（単純過去・物語）
:::

日本語ではどちらも「着いた」ですが、フランス語では**文体そのものが違います**。単純過去を会話で使うと、芝居がかった、あるいは古風な印象になります。

:::note 童話の書き出し
[[Il était une fois une petite fille qui s'appelait …\|イ・レ・チュヌ・フォワ\|むかしむかし、〜という名の少女がいました…]]

:::

## 2. 語尾は3つの型しかない

単純過去の語尾は、**-a 型 / -i 型 / -u 型**の3つだけです。

| | -a 型 | -i 型 | -u 型 |
|---|---|---|---|
| je | -ai | -is | -us |
| tu | -as | -is | -us |
| il | -a | -it | -ut |
| nous | -âmes | -îmes | -ûmes |
| vous | -âtes | -îtes | -ûtes |
| ils | -èrent | -irent | -urent |

:::note 見分け方の目安
- **-a 型** … 第1群（-er 動詞）**すべて**
- **-i 型** … 第2群（-ir）と、多くの第3群
- **-u 型** … 一部の第3群（過去分詞が -u になる動詞と重なることが多い）

**過去分詞と単純過去の型には相関があります。**

| 動詞 | 過去分詞 | 単純過去 |
|---|---|---|
| boire | b**u** | je b**us**（-u 型） |
| lire | l**u** | je l**us**（-u 型） |
| prendre | pr**is** | je pr**is**（-i 型） |
| mettre | m**is** | je m**is**（-i 型） |
| écrire | écr**it** | j'écriv**is**（-i 型） |

完全に一致するわけではありませんが、**過去分詞を知っていれば型を推測できる**ことが多くあります。
:::

### 第1群（-a 型）

| il | finit | **finit** |
| nous | finissons | **finîmes** |

## 5. 読むときの実務

:::note 3人称だけ読めれば足りる
物語は**3人称で語られる**のが普通です。したがって実務的には、**il / ils の形**だけ認識できれば読み進められます。

| 型 | il | ils |
|---|---|---|
| -a 型 | chant**a** | chant**èrent** |
| -i 型 | fin**it** | fin**irent** |
| -u 型 | b**ut** | b**urent** |
| -in 型 | v**int** | v**inrent** |

**-a / -it / -ut / -int で終わる短い形**が来たら単純過去、と反応できれば十分です。
:::

:::adv 半過去との併用が物語の骨格
物語文では、単純過去と半過去（第27章）が役割分担します。

- **半過去** … 背景・状況・continuing な状態を描く
- **単純過去** … 出来事を1つずつ進める

:::ex 物語の典型的な構造
Il faisait nuit. La pluie tombait. | イル・フゼ・ニュイ・ラ・プリュイ・トンベ | 夜だった。雨が降っていた。（半過去＝背景）
Soudain, la porte s'ouvrit. | スダン・ラ・ポルト・スーヴリ | 突然、扉が開いた。（単純過去＝出来事）
Un homme entra et regarda autour de lui. | アン・ノム・アントラ・エ・ルガルダ・オトゥール・ドゥ・リュイ | 男が入ってきて、あたりを見回した。（単純過去＝出来事の連続）
Il portait un manteau noir. | イル・ポルテ・アン・マント・ノワール | 彼は黒いコートを着ていた。（半過去＝描写）
:::

**半過去は絵の背景、単純過去は前景で動く人物** ——この対比が掴めれば、フランス語の物語文の読解は大きく楽になります。第27章でこの対立を正面から扱います。
:::

## 6. 現代における位置づけ

:::adv 単純過去は消えつつあるのか
20世紀以降、単純過去の使用範囲は狭まり続けています。

- **話し言葉** … 完全に消滅（19世紀にはすでに）
- **新聞** … 論説・インタビューは複合過去、事件の記事では単純過去が残る
- **小説** … 依然として標準。ただし現代文学では複合過去で書く作家も増えている
- **学術・歴史記述** … 標準的に使われる

有名な例として、カミュの『異邦人』（*L'Étranger*, 1942）が**全編を複合過去で書いた**ことが挙げられます。これは文体上の実験であり、当時としては衝撃的でした。冒頭の [[Aujourd'hui, maman est morte.\|オジュルデュイ・ママン・エ・モルト\|今日、ママンが死んだ。]] が単純過去（mourut）でないことが、あの小説の平坦で距離のある語り口を作っています。

**単純過去を使うかどうかが文体の選択そのものになる** ——これが現代における単純過去の位置です。

なお、**接続法半過去**（第31章で触れます）は単純過去の語幹から作られるため、単純過去が衰退すると接続法半過去も一緒に使われなくなりました。2つの時制は運命を共にしています。
:::

## 練習問題

:::quiz
Q. 単純過去は、どういう場面で使われますか。
A. 小説・歴史書・伝記・童話・事件報道など、**書き言葉の物語**でのみ使う。会話では一切使わない。話し言葉では複合過去が同じ役割を果たす。したがって書けるようになる必要はないが、読めなければ原書が読めない。

Q. 単純過去の語尾は何種類ありますか。
A. 3種類（-a 型 / -i 型 / -u 型）。-a 型は第1群すべて、-i 型は第2群と多くの第3群、-u 型は一部の第3群。過去分詞が -u になる動詞は -u 型になることが多く、過去分詞から型を推測できる場合がある。

Q. finir の単純過去 je finis は、現在形と区別できますか。
A. 単数（je finis / tu finis / il finit）は現在形と綴りが同じで区別できず、文脈で判断するしかない。複数（finîmes / finîtes / finirent）を見れば単純過去だと確定できる。アクサン・シルコンフレクスは単純過去の目印。

Q. 物語文で、半過去と単純過去はどう役割分担しますか。
A. 半過去が背景・状況・描写を担い、単純過去が出来事を1つずつ進める。半過去は絵の背景、単純過去は前景で動く人物にあたる。この対比が読解の鍵になる。

Q. 読解の実務として、最低限どの形が分かればよいですか。
A. 物語は3人称で語られるので、**il / ils の形**だけ認識できればよい。-a / -it / -ut / -int で終わる短い形が来たら単純過去、と反応できれば読み進められる。

Q. カミュの『異邦人』が単純過去を使わなかったことには、どんな意味がありますか。
A. 単純過去は「閉じた過去を距離を置いて語る」文体を作るため、それを避けて複合過去で書くことで、平坦で現在に貼り付いたような語り口が生まれる。単純過去を使うかどうかが文体の選択そのものになる、という現代的な事例。
:::

  body: `
関係代名詞は、**2つの文を1つにまとめる道具**です。英語の who / which / that / where / when にあたりますが、フランス語の選び方の基準は英語と根本的に違います。

英語は「先行詞が人か物か」で who / which を選びます。**フランス語はそれを一切問いません。** 見るのは「**関係節の中でその語がどんな働きをするか**」だけです。

この違いを最初に押さえてしまえば、あとは4つの語（qui, que, où, dont）を役割で振り分けるだけになります。

## 1. 選び方の基準 — 関係節の中での役割

| 関係代名詞 | 関係節の中での役割 | 英語で言えば |
|---|---|---|
| **qui** | **主語** | who, which, that |
| **que** | **直接目的語** | whom, which, that |
| **où** | **場所・時**の状況補語 | where, when |
| **dont** | **de + 名詞**を受ける | whose, of which |

:::warn 「人か物か」は関係ない
これがフランス語の関係代名詞で最も重要な点です。

- [[l'homme qui parle\|ロム・キ・パルル\|話している男性]] … 人
- [[le livre qui est sur la table\|ル・リーヴル・キ・エ・スュル・ラ・ターブル\|机の上にある本]] … 物

**どちらも qui** です。qui が「主語」の役割を担っているからで、先行詞が人か物かは関係ありません。

英語で who / which を使い分ける習慣があると、ここで必ず間違えます。**役割だけを見る** ——これを徹底してください。
:::

## 2. qui — 主語を受ける

**関係節の中で主語になる**とき、qui を使います。

:::ex qui
Je connais un homme. Il parle japonais. | | 私はある男性を知っている。彼は日本語を話す。
→ Je connais un homme qui parle japonais. | ジュ・コネ・アン・ノム・キ・パルル・ジャポネ | 私は日本語を話す男性を知っている。
C'est le train qui va à Lyon. | セ・ル・トラン・キ・ヴァ・ア・リヨン | それはリヨンへ行く列車です。
Les étudiants qui travaillent réussissent. | レ・ゼテュディアン・キ・トラヴァイユ・レユスィス | 勉強する学生は成功する。
:::

:::warn qui はエリジオンしない
母音で始まる語の前でも **qui のまま**です。× qu'il ではなく **qui il**… ではなく、そもそも qui は縮まりません。

- ○ [[l'homme qui arrive\|ロム・キ・アリーヴ\|到着する男性]]
- × l'homme qu'arrive

一方 **que はエリジオンします**（qu'il, qu'elle）。**この一点で qui と que を見分けられる**場合があります。文中に qu' があれば、それは que です。
:::

:::note qui の後の動詞は先行詞に一致する
qui が主語なので、動詞は**先行詞の人称・数**に合わせて活用します。

- [[C'est moi qui ai raison.\|セ・モワ・キ・エ・レゾン\|正しいのは私だ。]]（先行詞が moi なので ai）
- [[C'est toi qui as raison.\|セ・トワ・キ・ア・レゾン\|正しいのは君だ。]]（先行詞が toi なので as）
- [[Les livres qui sont là\|レ・リーヴル・キ・ソン・ラ\|そこにある本]]（先行詞が複数なので sont）

× C'est moi qui a raison. は誤りです。第22章の強調構文でこの点が重要になります。
:::

## 3. que — 直接目的語を受ける

**関係節の中で直接目的語になる**とき、que を使います。

:::ex que
J'ai acheté un livre. Je le lis maintenant. | | 私は本を買った。それを今読んでいる。
→ Le livre que je lis est intéressant. | ル・リーヴル・ク・ジュ・リ・エ・タンテレサン | 私が読んでいる本は面白い。
La femme que tu as vue est ma sœur. | ラ・ファム・ク・テュ・ア・ヴュ・エ・マ・スール | 君が見た女性は私の姉だ。
C'est le film qu'elle préfère. | セ・ル・フィルム・ケル・プレフェール | それは彼女が一番好きな映画だ。
:::

:::warn que の後には必ず主語が来る
qui と que の見分けは、**後ろに主語があるかどうか**で判断できます。

| | 後ろに来るもの |
|---|---|
| **qui** | いきなり**動詞**（qui 自体が主語だから） |
| **que** | **主語 + 動詞**（別の主語があるから） |

- le livre **qui est** sur la table（qui + 動詞）
- le livre **que je lis**（que + 主語 + 動詞）

**これが最も実務的な判定法です。**
:::

:::warn que の後では過去分詞が一致する
第20章の規則③がここで効きます。**関係代名詞 que は直接目的語であり、しかも動詞より前にある**ので、過去分詞が先行詞に一致します。

- [[La femme que j'ai vue.\|ラ・ファム・ク・ジェ・ヴュ\|私が見た女性。]]（vue と一致）
- [[Les livres que j'ai achetés.\|レ・リーヴル・ク・ジェ・アシュテ\|私が買った本。]]（achetés と一致）

一方 **qui は主語なので一致は起きません**（そもそも avoir の複合時制で主語に一致することはない）。

**que を見たら過去分詞の一致を疑う** ——書き取りの鉄則です。
:::

## 4. où — 場所と時を受ける

:::ex où
la ville où j'habite | ラ・ヴィル・ウー・ジャビット | 私が住んでいる町
le pays où je suis né | ル・ペイ・ウー・ジュ・スュイ・ネ | 私が生まれた国
le jour où je t'ai rencontré | ル・ジュール・ウー・ジュ・テ・ランコントレ | 私が君に出会った日
l'année où il est parti | ラネ・ウー・イ・レ・パルティ | 彼が去った年
:::

:::note 英語の when にあたるのも où
**時を表す先行詞にも où を使います**。英語では where と when を使い分けますが、フランス語は où ひとつです。

- ○ le jour **où** je t'ai vu（私が君を見た日）
- × le jour **quand** je t'ai vu

quand は関係代名詞ではなく疑問副詞・接続詞なので、この位置には使えません。**「時」も一種の場所として捉える**のがフランス語の発想です。
:::

:::adv d'où と par où
où に前置詞を付けることもできます。

- [[le pays d'où je viens\|ル・ペイ・ドゥー・ジュ・ヴィアン\|私が来た国]]（起点）
- [[la porte par où il est entré\|ラ・ポルト・パー・ルー・イ・レ・タントレ\|彼が入ってきたドア]]（経路）
:::

## 5. dont — de を受ける

**dont は de + 名詞を丸ごと受けます。** 英語の whose / of which にあたりますが、用途はもっと広く、**de を取る動詞・形容詞・名詞のすべて**に対応します。

:::deep dont の3つの用法

**（1）所有（英語の whose）**

[[C'est l'homme dont je connais le fils.\|セ・ロム・ドン・ジュ・コネ・ル・フィス\|それは、私がその息子を知っている男性だ。]]
（← Je connais le fils **de cet homme**.）

:::warn 語順が英語と違う
英語 the man **whose son** I know では whose + 名詞が続きますが、フランス語は **dont + 主語 + 動詞 + 定冠詞 + 名詞**の順です。

- ○ l'homme **dont je connais le fils**
- × l'homme dont le fils je connais

そして**所有形容詞は使いません**。son fils ではなく **le fils** です（第2章・第10章で見た「所有者が明らかなら定冠詞」の規則）。
:::

**（2）de を取る動詞の補語**

parler **de**（〜について話す）、avoir besoin **de**（〜が必要）、se souvenir **de**（〜を覚えている）、rêver **de**（〜を夢見る）など。

[[le livre dont je parle\|ル・リーヴル・ドン・ジュ・パルル\|私が話している本]]（← Je parle **du livre**.）
[[la chose dont j'ai besoin\|ラ・ショーズ・ドン・ジェ・ブゾワン\|私が必要としているもの]]
[[le voyage dont je rêve\|ル・ヴォワヤージュ・ドン・ジュ・レーヴ\|私が夢見ている旅行]]

**（3）de を取る形容詞の補語**

content **de**（〜に満足している）、fier **de**（〜を誇りに思う）、sûr **de**（〜を確信している）など。

[[le résultat dont je suis content\|ル・レジュルタ・ドン・ジュ・スュイ・コンタン\|私が満足している結果]]

**（4）数量の de**

[[J'ai dix livres, dont trois en français.\|ジェ・ディ・リーヴル・ドン・トロワ・ザン・フランセ\|私は本を10冊持っていて、そのうち3冊はフランス語だ。]]

この用法では「そのうち」と訳します。統計や列挙で頻繁に使われます。
:::

:::note dont を使うかどうかの判定
元の文を作ってみて、**de が現れるかどうか**を確認します。

1. Je parle **du** livre.（de + le = du）
2. de がある → **dont**
3. le livre **dont** je parle

第18章で間接目的語を判定したときと同じ手順です。**代名詞・関係詞を選ぶ前に、名詞のままの文を復元する。**
:::

## 6. ce qui / ce que / ce dont — 先行詞がないとき

:::deep 「〜すること」をまとめて受ける
先行詞が具体的な名詞ではなく、**文の内容そのもの**であるとき、**ce** を先行詞として立てます。

| 形 | 役割 | 英語で言えば |
|---|---|---|
| **ce qui** | 主語 | what（主語） |
| **ce que** | 直接目的語 | what（目的語） |
| **ce dont** | de を受ける | what … of |

:::ex ce qui / ce que / ce dont
Je ne sais pas ce qui se passe. | ジュ・ヌ・セ・パ・ス・キ・ス・パス | 何が起きているのか分からない。
Je ne comprends pas ce que tu dis. | ジュ・ヌ・コンプラン・パ・ス・ク・テュ・ディ | 君の言うことが分からない。
C'est ce dont j'ai besoin. | セ・ス・ドン・ジェ・ブゾワン | それが私に必要なものだ。
Dis-moi ce que tu veux. | ディ・モワ・ス・ク・テュ・ヴ | 何が欲しいか言って。
:::

**選び方の基準は qui / que / dont と同じ**です。ce が付くだけで、判定は変わりません。

**文全体を受けることもできます。**
[[Il est arrivé en retard, ce qui m'a énervé.\|イ・レ・タリヴェ・アン・ルタール・ス・キ・マ・エネルヴェ\|彼は遅れて来た、そのことが私を苛立たせた。]]

この ce qui は「彼が遅れて来たこと」全体を受けています。英語の which（非制限用法）と同じ働きです。

**第12章の疑問代名詞との関係**：qu'est-ce qui / qu'est-ce que と ce qui / ce que は形が似ていますが、前者は疑問文（直接疑問）、後者は関係節や間接疑問で使います。
- 直接疑問：[[Qu'est-ce que tu veux ?\|ケ・ス・ク・テュ・ヴ\|何が欲しい？]]
- 間接疑問：[[Dis-moi ce que tu veux.\|ディ・モワ・ス・ク・テュ・ヴ\|何が欲しいか言って。]]
:::

## 7. lequel — 前置詞の後

:::adv 前置詞 + 関係代名詞
de 以外の前置詞（avec, pour, sur, dans, sans…）の後ろでは、**lequel** を使います。**性数に一致して変化する**のが特徴です。

| | 単数 | 複数 |
|---|---|---|
| 男性 | lequel | lesquels |
| 女性 | laquelle | lesquelles |

**à と de とは縮約します**（第7章の規則）。

| | 男性単数 | 女性単数 | 男性複数 | 女性複数 |
|---|---|---|---|---|
| à + | **auquel** | à laquelle | **auxquels** | **auxquelles** |
| de + | **duquel** | de laquelle | **desquels** | **desquelles** |

:::ex lequel
la table sur laquelle j'ai posé le livre | ラ・ターブル・スュル・ラケル | 私が本を置いたテーブル
le stylo avec lequel j'écris | ル・スティロ・アヴェック・ルケル | 私が書いているペン
le problème auquel je pense | ル・プロブレーム・オケル・ジュ・パンス | 私が考えている問題
:::

:::note 先行詞が人なら qui も使える
**人が先行詞の場合、前置詞の後ろに qui を使えます**（lequel より一般的）。

- [[la personne avec qui je travaille\|ラ・ペルソンヌ・アヴェック・キ\|私が一緒に働いている人]]
- [[l'ami à qui j'ai écrit\|ラミ・ア・キ・ジェ・エクリ\|私が手紙を書いた友人]]

つまり **qui は主語のとき（先行詞不問）と、前置詞の後で人を受けるとき**の2つの用法を持ちます。物が先行詞なら lequel を使わなければなりません。
:::
:::

## 8. まとめ — 判定のフローチャート

:::note 関係代名詞の選び方
関係節の中で、その語がどう働くかを見ます。

1. **主語** → **qui**
2. **直接目的語** → **que**（過去分詞の一致に注意）
3. **場所・時** → **où**
4. **de + 名詞** → **dont**
5. **その他の前置詞 + 物** → **前置詞 + lequel**
6. **その他の前置詞 + 人** → **前置詞 + qui**
7. 先行詞が文の内容 → **ce** を足して ce qui / ce que / ce dont

**実務的な近道**：qui の後は動詞がいきなり来る、que の後は主語が来る。これで大半が判定できます。
:::

## 9. 練習してみる

:::ex 2文を1文にまとめる
Voici le livre. Je l'ai acheté hier. → Voici le livre que j'ai acheté hier. | ヴォワスィ・ル・リーヴル・ク・ジェ・アシュテ・イエール | これが昨日買った本です。
C'est un ami. Il habite à Paris. → C'est un ami qui habite à Paris. | セ・タン・ナミ・キ・アビット・ア・パリ | パリに住んでいる友人です。
Voilà la maison. J'y suis né. → Voilà la maison où je suis né. | ヴォワラ・ラ・メゾン・ウー・ジュ・スュイ・ネ | あれが私の生まれた家です。
C'est le film. Je t'en ai parlé. → C'est le film dont je t'ai parlé. | セ・ル・フィルム・ドン・ジュ・テ・パルレ | それが君に話した映画です。
:::

## 練習問題

:::quiz
Q. フランス語の関係代名詞は、何を基準に選びますか。英語との違いは何ですか。
A. **関係節の中での役割**（主語か、直接目的語か、場所・時か、de を受けるか）だけで選ぶ。英語のように先行詞が人か物かは一切問わない。l'homme qui parle も le livre qui est là も、どちらも qui。

Q. qui と que を素早く見分ける方法は何ですか。
A. **後ろに主語があるかどうか**。qui は自分が主語なので後ろにいきなり動詞が来る（le livre qui est là）。que は別の主語が続く（le livre que je lis）。またエリジオンするのは que だけなので、qu' があればそれは que。

Q. La femme que j'ai vue. で、なぜ vue に e が付くのですか。
A. que は直接目的語であり、しかも動詞より前にあるため、第20章の規則③により過去分詞が先行詞（la femme、女性単数）に一致する。qui の場合は主語なので一致は起きない。

Q. 「私が君に出会った日」を le jour quand je t'ai rencontré と言えますか。
A. 言えない。時を表す先行詞にも **où** を使う（le jour **où** je t'ai rencontré）。quand は疑問副詞・接続詞であって関係代名詞ではない。フランス語は「時」も一種の場所として où で受ける。

Q. dont はどんなときに使いますか。判定方法は何ですか。
A. **de + 名詞**を受けるとき。所有（whose）、de を取る動詞（parler de, avoir besoin de）、de を取る形容詞（content de）、数量の「そのうち」がすべて含まれる。判定は元の文を復元して de が現れるかを見る。

Q. l'homme dont le fils je connais はなぜ誤りですか。
A. 語順が違う。フランス語では **dont + 主語 + 動詞 + 定冠詞 + 名詞** の順になるため、正しくは l'homme **dont je connais le fils**。また所有形容詞（son fils）は使わず定冠詞（le fils）を使う。
:::

:::ai-gen 関係代名詞 qui, que, où, dont、ce qui / ce que

  sub: 'ぼくが好きなのは、マリ',
  body: `
日本語では「**ぼくが**好きなのはマリだ」「ぼくが好きなのは**マリ**だ」のように、声の調子や「〜のは〜だ」の形で強調する部分を変えられます。

フランス語は**強勢の位置を自由に動かせません**（第0章で見たとおり、強勢はリズムグループの最後に固定されています）。そこで、強調したい要素を**構文によって取り出す**必要が生じます。それが **c'est … qui / que** の強調構文（la mise en relief）です。

この構文は第4章（c'est）と第21章（関係代名詞）の組み合わせでできています。両方を理解していれば、新しく覚えることはほとんどありません。

## 1. 基本の形

**c'est + 強調したい要素 + qui / que + 残りの文**

qui と que の選び方は、**第21章とまったく同じ**です。

| | 強調する要素 |
|---|---|
| **c'est … qui** | **主語** |
| **c'est … que** | **主語以外**（直接目的語・状況補語など） |

:::ex 同じ文で強調位置を変える
Marie aime Paul. | マリ・エム・ポール | マリはポールを愛している。（普通の文）
C'est Marie qui aime Paul. | セ・マリ・キ・エム・ポール | ポールを愛しているのはマリだ。（主語を強調）
C'est Paul que Marie aime. | セ・ポール・ク・マリ・エム | マリが愛しているのはポールだ。（目的語を強調）
:::

:::note 判定は第21章と同じ
**取り出した要素が、元の文で主語だったか**を見ます。

- 主語だった → **qui**
- 目的語・補語だった → **que**

第21章の「後ろに主語が来るかどうか」も同じように使えます。
- C'est Marie **qui aime** …（qui + 動詞）
- C'est Paul **que Marie aime**（que + 主語 + 動詞）
:::

## 2. さまざまな要素を強調する

**主語・目的語だけでなく、時・場所・手段なども取り出せます。**

:::ex いろいろな要素を強調する
C'est demain que je pars. | セ・ドゥマン・ク・ジュ・パール | 私が出発するのは明日だ。（時）
C'est à Paris que je l'ai rencontrée. | セ・タ・パリ・ク・ジュ・レ・ランコントレ | 私が彼女に出会ったのはパリだ。（場所）
C'est avec toi que je veux partir. | セ・タヴェック・トワ・ク・ジュ・ヴ・パルティール | 私が一緒に出発したいのは君だ。（相手）
C'est pour toi que j'ai fait ça. | セ・プール・トワ・ク・ジェ・フェ・サ | 私がこれをしたのは君のためだ。（目的）
C'est en travaillant qu'on réussit. | セ・タン・トラヴァイヤン・コン・レユスィ | 成功するのは働くことによってだ。（手段）
:::

**前置詞つきの要素を取り出すときは、前置詞ごと動かします**（à Paris, avec toi, pour toi）。そして関係詞は常に **que** です（主語ではないので）。

## 3. 代名詞を強調する — 強勢形を使う

:::warn c'est の後ろは強勢形
第19章で見たとおり、c'est の後ろは強い位置なので、**主語形ではなく強勢形**を使います。

- × C'est je qui …
- ○ **C'est moi qui** …

:::ex 代名詞の強調
C'est moi qui ai raison. | セ・モワ・キ・エ・レゾン | 正しいのは私だ。
C'est toi que j'aime. | セ・トワ・ク・ジェーム | 私が愛しているのは君だ。
C'est lui qui a commencé. | セ・リュイ・キ・ア・コマンセ | 始めたのは彼だ。
Ce sont eux qui ont gagné. | ス・ソン・トゥー・キ・オン・ガニェ | 勝ったのは彼らだ。
:::

**3人称複数だけ ce sont** になる点も第19章のとおりです。
:::

:::warn qui の後の動詞は、先行詞の人称に一致する
**ここが最も間違えられる箇所です。**

C'est **moi** qui **ai** raison. — 動詞は **ai**（avoir の1人称単数）であって、a ではありません。

qui が受けているのは moi（＝1人称）なので、動詞も1人称で活用します。第21章で扱った「qui の後の動詞は先行詞に一致する」という規則が、ここで効いています。

| 強調する語 | 動詞の形 |
|---|---|
| C'est **moi** qui | **ai** / **suis** / **vais**… |
| C'est **toi** qui | **as** / **es** / **vas**… |
| C'est **lui** qui | **a** / **est** / **va**… |
| C'est **nous** qui | **avons** / **sommes**… |
| Ce sont **eux** qui | **ont** / **sont**… |

× C'est moi qui **a** raison. は誤りです。日本語話者・英語話者ともによく落とす点なので、意識して練習してください。
:::

## 4. 否定・疑問との組み合わせ

:::ex 否定と疑問
Ce n'est pas moi qui ai fait ça. | ス・ネ・パ・モワ・キ・エ・フェ・サ | それをやったのは私じゃない。
Est-ce toi qui as téléphoné ? | エ・ス・トワ・キ・ア・テレフォネ | 電話したのは君？
Ce n'est pas demain que je pars. | ス・ネ・パ・ドゥマン・ク・ジュ・パール | 私が出発するのは明日じゃない。
:::

否定するのは **c'est の部分**です。「〜なのは違う」という形で、取り出した要素だけを否定できます。これが強調構文の実用的な価値の1つです。

## 5. c'est que — 理由を述べる

:::adv 「なぜなら」の c'est que
強調構文とは別に、**c'est que** には「（というのは）〜だからだ」という用法があります。

[[Il ne vient pas. C'est qu'il est malade.\|イル・ヌ・ヴィアン・パ・セ・キ・レ・マラード\|彼は来ない。病気だからだ。]]
[[Si je pars, c'est que je n'ai pas le choix.\|スィ・ジュ・パール・セ・ク・ジュ・ネ・パ・ル・ショワ\|私が去るのは、選択肢がないからだ。]]

**c'est parce que** と言い換えられます。形は強調構文と似ていますが、後ろに続くのが「取り出した要素」ではなく「完結した文」である点で区別できます。
:::

## 6. 他の強調方法

:::deep 強調構文以外にも手段がある
c'est … qui / que は最も明快な方法ですが、実際の会話では他の手段もよく使われます。

**（1）遊離構文（la dislocation）— 要素を文頭・文末に出す**

要素を文の外に出し、代名詞で受け直します。**話し言葉で圧倒的に多い**形です。

:::ex 遊離構文
Moi, j'aime Paris. | モワ・ジェーム・パリ | 私はね、パリが好きだ。
Paris, j'aime beaucoup. | パリ・ジェーム・ボクー | パリはね、すごく好きだ。
Ce livre, je l'ai déjà lu. | ス・リーヴル・ジュ・レ・デジャ・リュ | この本はね、もう読んだよ。
Il est gentil, ton frère. | イ・レ・ジャンティ・トン・フレール | 優しいね、君のお兄さん。
:::

**代名詞で受け直す**のが特徴です（Ce livre, je **l'**ai lu）。第19章で見た Moi, je suis japonais. もこの形です。

**（2）副詞による強調**

[[C'est vraiment beau.\|セ・ヴレマン・ボー\|本当に美しい。]]、[[Il est très gentil.\|イ・レ・トレ・ジャンティ\|とても優しい。]]

**（3）語順の倒置（文語）**

[[Grande fut ma surprise.\|グランド・フュ・マ・スュルプリーズ\|私の驚きは大きかった。]]（属詞を文頭に）

これは文学的な表現で、日常では使いません。fut は単純過去（第20.5章）です。

**どれを使うか**：改まった書き言葉なら c'est … qui / que、日常会話なら遊離構文、と使い分けるのが自然です。
:::

## 7. 疑問詞との組み合わせ

:::note qu'est-ce que も強調構文だった
第12章で扱った疑問代名詞の長形を、いま構造的に説明できます。

**qu'est-ce que** = que（何） + est-ce que（強調構文の疑問形）

つまり「何であるか、それは〜なのは」という強調構文が化石化したものです。だから前半が「人か物か」、後半が「主語か目的語か」という2部品構成になっていたのです。

- **qui est-ce qui**（人・主語）… 主語を強調 → qui
- **qu'est-ce que**（物・目的語）… 目的語を強調 → que

第9章で「est-ce que は c'est que の倒置が化石化したもの」と述べましたが、この章の強調構文がその正体です。**第9章・第12章・第22章は同じ構造の3つの側面**を見ていたことになります。
:::

## 8. 「ぼくが好きなのは、マリ」

章のタイトルを、いくつかの形で言い分けてみます。

:::ex 強調の位置を変える
C'est Marie que j'aime. | セ・マリ・ク・ジェーム | ぼくが好きなのは、マリだ。
C'est moi qui aime Marie. | セ・モワ・キ・エム・マリ | マリを好きなのは、ぼくだ。
Marie, je l'aime. | マリ・ジュ・レーム | マリはね、好きなんだ。
Moi, j'aime Marie. | モワ・ジェーム・マリ | ぼくはね、マリが好きなんだ。
Ce n'est pas Marie que j'aime. | ス・ネ・パ・マリ・ク・ジェーム | ぼくが好きなのは、マリじゃない。
:::

同じ内容が、**何を焦点に置くかで5通りに書き分けられる** ——これが強調構文の効用です。

## 練習問題

:::quiz
Q. C'est Marie qui aime Paul. と C'est Paul que Marie aime. は、それぞれ何を強調していますか。
A. 前者は**主語**（ポールを愛しているのは他でもないマリだ）、後者は**目的語**（マリが愛しているのは他でもないポールだ）。取り出した要素が元の文で主語だったなら qui、それ以外なら que。判定は第21章の関係代名詞とまったく同じ。

Q. C'est moi qui a raison. はなぜ誤りですか。
A. qui が受けている先行詞は moi（1人称）なので、動詞も1人称で活用しなければならない。正しくは C'est moi qui **ai** raison. 第21章の「qui の後の動詞は先行詞に一致する」という規則が効いている。

Q. C'est je qui … と言えないのはなぜですか。
A. c'est の後ろは強い位置なので、主語形ではなく**強勢形**を使う必要があるため。正しくは C'est **moi** qui …（第19章）。

Q. 「私が出発するのは明日だ」を強調構文で言ってください。
A. **C'est demain que je pars.** 時を表す要素を取り出しているので、主語ではない。したがって関係詞は que。

Q. 話し言葉で最もよく使われる強調の方法は何ですか。
A. **遊離構文**（要素を文頭・文末に出し、代名詞で受け直す）。Moi, j'aime Paris. / Ce livre, je l'ai déjà lu. / Il est gentil, ton frère. など。c'est … qui / que は改まった場面や書き言葉に寄る。

Q. qu'est-ce que という疑問形は、構造的には何ですか。
A. que（何）+ est-ce que（強調構文の疑問形）。強調構文が化石化して疑問の目印になったもの。だから「前半＝人か物か、後半＝主語か目的語か」という2部品構成になっている（第12章）。
:::

  body: `
[[se coucher\|ス・クシェ\|寝る]] を直訳すると「自分を寝かせる」です。**目的語代名詞が主語と同じものを指す**——これが代名動詞（le verbe pronominal）の出発点です。

日本語や英語には対応する仕組みがないため、最初は不自然に見えます。しかしフランス語では極めて多くの日常動詞がこの形を取り、しかも**同じ形が4つの異なる意味**を担います。

さらに、代名動詞は**すべて助動詞に être を取り**、**過去分詞の一致に独自の条件がある**——第20章の続きとして、ここで一致規則が完成します。

## 1. 形 — 再帰代名詞を付ける

**主語に応じて変化する代名詞（se, me, te, nous, vous）**を動詞の前に置きます。

| 主語 | 再帰代名詞 | 例（se coucher） |
|---|---|---|
| je | **me**（m'） | je me couche |
| tu | **te**（t'） | tu te couches |
| il / elle / on | **se**（s'） | il se couche |
| nous | **nous** | nous nous couchons |
| vous | **vous** | vous vous couchez |
| ils / elles | **se**（s'） | ils se couchent |

:::conj se coucher présent

:::note nous nous / vous vous は誤植ではない
**nous nous couchons** は、1つ目が主語、2つ目が再帰代名詞です。同じ語が2つ並びますが正しい形です。vous vous も同様。

不定詞として辞書に載るときは **se coucher** の形です。この se が、主語に応じて me / te / nous / vous に変わります。
:::

:::ex 日常でよく使う代名動詞
Je me lève à sept heures. | ジュ・ム・レーヴ・ア・セ・タール | 私は7時に起きる。
Tu te laves les mains ? | テュ・ト・ラーヴ・レ・マン | 手を洗った？
Il s'appelle Pierre. | イル・サペル・ピエール | 彼はピエールといいます。
Nous nous promenons. | ヌー・ヌー・プロムノン | 私たちは散歩する。
Vous vous souvenez de moi ? | ヴー・ヴー・スヴネ・ドゥ・モワ | 私を覚えていますか？
Ils se dépêchent. | イル・ス・デペシュ | 彼らは急ぐ。
:::

:::note 自己紹介の s'appeler も代名動詞
[[Je m'appelle Marie.\|ジュ・マペル・マリ\|私はマリといいます。]] を直訳すると「私は自分をマリと呼ぶ」です。第0章で最初に習った表現が、実は代名動詞だったことになります。

なお appeler は綴りが変わる -er 動詞（第8章）なので、je m'appe**ll**e と l が重なります。
:::

## 2. 4つの意味

**同じ形が、文脈によって4通りの意味を持ちます。**

:::deep 代名動詞の4分類

### （1）再帰的用法 — 「自分を／自分に」

主語が自分自身に働きかけます。**最も基本的な用法**です。

:::ex 再帰的用法
Je me lave. | ジュ・ム・ラーヴ | 私は自分を洗う（体を洗う）。
Elle se regarde dans le miroir. | エル・ス・ルガルド・ダン・ル・ミロワール | 彼女は鏡で自分を見る。
Il se coupe. | イル・ス・クップ | 彼は自分を切る（けがをする）。
:::

同じ動詞を、代名動詞にするかどうかで意味が変わります。
- [[Je lave la voiture.\|ジュ・ラーヴ・ラ・ヴォワテュール\|私は車を洗う。]]（他動詞）
- [[Je me lave.\|ジュ・ム・ラーヴ\|私は体を洗う。]]（代名動詞）

### （2）相互的用法 — 「お互いに」

**主語が複数のとき**に限られます。

:::ex 相互的用法
Ils se regardent. | イル・ス・ルガルド | 彼らは互いに見つめ合う。
Nous nous téléphonons souvent. | ヌー・ヌー・テレフォノン・スヴァン | 私たちはよく電話し合う。
Elles s'aiment. | エル・セーム | 彼女らは愛し合っている。
Ils se sont mariés. | イル・ス・ソン・マリエ | 彼らは結婚した。
:::

**（1）との区別は文脈で判断します。** Ils se regardent. は「彼らは自分自身を見る」とも「互いに見つめ合う」とも読めますが、通常は後者です。明示したいときは副詞を添えます。
- 再帰：[[Ils se regardent eux-mêmes.\|イル・ス・ルガルド・トゥー・メーム\|彼らは自分自身を見る。]]
- 相互：[[Ils se regardent l'un l'autre.\|イル・ス・ルガルド・ラン・ロートル\|彼らは互いに見つめ合う。]]

### （3）受動的用法 — 「〜される」

**主語がモノ**のとき、受動の意味になります。

:::ex 受動的用法
Ce livre se vend bien. | ス・リーヴル・ス・ヴァン・ビアン | この本はよく売れる。
Le français se parle au Canada. | ル・フランセ・ス・パルル・オ・カナダ | フランス語はカナダで話されている。
Ça ne se fait pas. | サ・ヌ・ス・フェ・パ | そういうことはしないものだ。
Comment ça s'écrit ? | コマン・サ・セクリ | それはどう綴るのですか？
:::

第28章で扱う受動態（être + 過去分詞）よりも、**この形のほうが日常的によく使われます**。行為者を言う必要がないときの標準的な言い方です。

### （4）本質的用法 — 代名動詞としてしか存在しない

**代名動詞の形でしか使えない**動詞群です。se を取り除くと意味をなしません。

| 動詞 | 意味 |
|---|---|
| [[se souvenir de\|ス・スヴニール\|覚えている]] | ※ souvenir 単独では名詞（思い出） |
| [[s'en aller\|サン・ナレ\|立ち去る]] | |
| [[se moquer de\|ス・モケ\|からかう]] | |
| [[s'évanouir\|セヴァヌイール\|気を失う]] | |
| [[se méfier de\|ス・メフィエ\|警戒する]] | |
| [[s'enfuir\|サンフュイール\|逃げる]] | |
| [[se taire\|ス・テール\|黙る]] | |
| [[s'écrier\|セクリエ\|叫ぶ]] | |

これらは「自分を〜する」と分解できません。**まとめて1語として覚えます。**
:::

:::warn 代名動詞にすると意味が変わる動詞
同じ動詞でも、代名動詞にすると別の意味になるものがあります。

| 通常 | 意味 | 代名動詞 | 意味 |
|---|---|---|---|
| [[passer\|パセ]] | 通る | [[se passer\|ス・パセ]] | 起こる |
| [[rendre\|ランドル]] | 返す | [[se rendre\|ス・ランドル]] | 赴く、降伏する |
| [[douter\|ドゥテ]] | 疑う | [[se douter de\|ス・ドゥテ]] | 察する |
| [[attendre\|アタンドル]] | 待つ | [[s'attendre à\|サタンドル]] | 予期する |
| [[servir\|セルヴィール]] | 仕える | [[se servir de\|ス・セルヴィール]] | 利用する |
| [[mettre\|メットル]] | 置く | [[se mettre à\|ス・メットル]] | 〜し始める |
| [[trouver\|トルヴェ]] | 見つける | [[se trouver\|ス・トルヴェ]] | ある、位置する |

[[Qu'est-ce qui se passe ?\|ケ・ス・キ・ス・パス\|何が起きているの？]] は第12章で出てきましたが、この se passer です。
:::

## 3. 否定・疑問・命令形

:::ex 否定形 — 再帰代名詞ごと挟む
Je ne me lève pas. | ジュ・ヌ・ム・レーヴ・パ | 私は起きない。
Il ne se souvient pas. | イル・ヌ・ス・スヴィアン・パ | 彼は覚えていない。
:::

**ne は再帰代名詞の前**に来ます。ne … pas が挟むのは「再帰代名詞 + 動詞」のかたまりです。

:::ex 疑問形
Te souviens-tu de moi ? | ト・スヴィアン・テュ・ドゥ・モワ | 私を覚えている？
Comment vous appelez-vous ? | コマン・ヴー・ザプレ・ヴー | お名前は何ですか？
:::

倒置しても**再帰代名詞は動詞の前に残ります**。動くのは主語だけです。

:::warn 命令形では位置と形が変わる
第16章の規則がここでも効きます。

| | 形 |
|---|---|
| 肯定命令 | 動詞の**後ろ**、te は **toi** に |
| 否定命令 | 動詞の**前**、te のまま |

:::ex 代名動詞の命令形
Lève-toi ! | レーヴ・トワ | 起きろ！
Ne te lève pas ! | ヌ・ト・レーヴ・パ | 起きるな！
Dépêchez-vous ! | デペシェ・ヴー | 急いでください！
Asseyez-vous. | アセイエ・ヴー | お座りください。
Tais-toi ! | テ・トワ | 黙れ！
Va-t'en ! | ヴァ・タン | 出て行け！
:::

最後の Va-t'en ! は s'en aller の命令形です。va + te + en で、te が t' にエリジオンしています。
:::

## 4. 複合過去 — 必ず être、そして一致に条件がある

:::conj se coucher passeCompose

:::warn 代名動詞の助動詞は例外なく être
第20章で「être を取るのは移動・状態変化の自動詞と代名動詞」と述べました。その2つ目がこれです。

**avoir を取る代名動詞は1つもありません。**

- [[Je me suis levé.\|ジュ・ム・スュイ・ルヴェ\|私は起きた。]]（× Je m'ai levé）
- [[Elle s'est couchée.\|エル・セ・クシェ\|彼女は寝た。]]
:::

:::deep 過去分詞の一致 — ここで規則が完成する
代名動詞の過去分詞は、être を取るのに**主語に一致するとは限りません**。条件があります。

**規則：再帰代名詞が「直接目的語」のときだけ一致する。**

第20章の規則③（直接目的語が前にあれば一致）が、そのまま適用されているだけです。再帰代名詞は必ず動詞の前にあるので、あとは**それが直接目的語かどうか**だけが問題になります。

**（a）再帰代名詞が直接目的語 → 一致する**

[[Elle s'est levée.\|エル・セ・ルヴェ\|彼女は起きた。]]
（se lever ＝「自分を起こす」。se は直接目的語 → levée と一致）

[[Ils se sont regardés.\|イル・ス・ソン・ルガルデ\|彼らは見つめ合った。]]
（se は regarder の直接目的語 → regardés）

**（b）再帰代名詞が間接目的語 → 一致しない**

[[Elle s'est lavé les mains.\|エル・セ・ラヴェ・レ・マン\|彼女は手を洗った。]]
（直接目的語は **les mains**。se は「自分に」＝間接目的語 → lavé のまま、× lavée）

[[Ils se sont téléphoné.\|イル・ス・ソン・テレフォネ\|彼らは電話し合った。]]
（téléphoner **à** なので se は間接目的語 → téléphoné のまま）

[[Elles se sont parlé.\|エル・ス・ソン・パルレ\|彼女らは話し合った。]]
（parler **à** → 間接 → 一致しない）

**（c）本質的用法 → 主語に一致する**

se souvenir, s'en aller のように分解できない動詞は、**主語に一致**させます。
[[Elle s'est souvenue de moi.\|エル・セ・スヴニュ・ドゥ・モワ\|彼女は私を覚えていた。]]

**（d）受動的用法 → 主語に一致する**

[[Ces livres se sont bien vendus.\|セ・リーヴル・ス・ソン・ビアン・ヴァンデュ\|これらの本はよく売れた。]]

### 判定の手順

1. その動詞は **本質的用法**か（se souvenir 型）→ **主語に一致**
2. **受動的用法**か → **主語に一致**
3. それ以外 → 再帰代名詞は**直接目的語か間接目的語か**
   - 直接（動詞が前置詞を取らない）→ **一致**
   - 間接（動詞が à を取る／別に直接目的語がある）→ **一致しない**

**Elle s'est lavée.**（一致する）と **Elle s'est lavé les mains.**（一致しない）の対比が、この規則の核心です。後者では les mains という直接目的語が別にあるので、se は「自分に」＝間接目的語に格下げされています。

**第17章・第18章の直接／間接の区別が、ここでも決め手になっています。**
:::

## 5. 身体部位と代名動詞

:::note 「手を洗う」に所有形容詞を使わない理由
第10章で「身体部位には定冠詞を使う」と述べました。その所有者を示すのが、代名動詞の再帰代名詞です。

- ○ [[Je me lave les mains.\|ジュ・ム・ラーヴ・レ・マン\|私は手を洗う。]]
- × Je lave mes mains.

**me が「自分の」を担っている**ので、所有形容詞は要りません。定冠詞 les で足ります。

同じ構造の表現：
[[Je me brosse les dents.\|ジュ・ム・ブロス・レ・ダン\|歯を磨く。]]
[[Il se casse la jambe.\|イル・ス・カス・ラ・ジャンブ\|彼は足を骨折する。]]
[[Elle se coupe les cheveux.\|エル・ス・クップ・レ・シュヴー\|彼女は髪を切る。]]

これらはすべて**過去分詞が一致しません**（直接目的語が別にあるため）。
:::

## 6. 一日の行動を言ってみる

代名動詞は日常の行動を表すものが多いので、まとめて練習できます。

:::ex 一日の流れ
Je me réveille à six heures. | ジュ・ム・レヴェイユ・ア・スィ・ザール | 6時に目が覚める。
Je me lève tout de suite. | ジュ・ム・レーヴ・トゥ・ドゥ・スュイット | すぐに起きる。
Je me lave et je m'habille. | ジュ・ム・ラーヴ・エ・ジュ・マビーユ | 体を洗って服を着る。

## 練習問題

:::quiz
Q. 代名動詞の4つの用法を挙げてください。
A. ①再帰的（自分を／自分に：Je me lave.）②相互的（お互いに：Ils se regardent.）③受動的（〜される：Ce livre se vend bien.）④本質的（代名動詞としてしか存在しない：se souvenir, s'en aller）。

Q. Elle s'est lavée. と Elle s'est lavé les mains. で、なぜ一致が違うのですか。
A. 前者では se が直接目的語（自分を洗う）なので一致する。後者では直接目的語が les mains であり、se は「自分に」＝間接目的語に格下げされるので一致しない。第20章の「直接目的語が前にあれば一致」という規則がそのまま適用されている。

Q. Ils se sont téléphoné. で、なぜ téléphonés にならないのですか。
A. téléphoner は **à** を取る動詞なので、se は間接目的語。間接目的語は前にあっても一致の対象にならない。同じ理由で Elles se sont parlé.（parler à）も一致しない。

Q. 代名動詞の助動詞は何ですか。例外はありますか。
A. **すべて être**。avoir を取る代名動詞は1つもない。第20章の「être を取るのは移動・状態変化の自動詞と代名動詞」の2つ目にあたる。

Q. Je lave mes mains. はなぜ不自然ですか。
A. 身体部位には所有形容詞ではなく定冠詞を使い、所有者は再帰代名詞で示すため。正しくは **Je me lave les mains.** me が「自分の」を担うので、mes は不要。

Q. Ce livre se vend bien. は受動の意味ですが、第28章の受動態（être + 過去分詞）とどちらがよく使われますか。
A. 代名動詞の受動的用法のほうが日常的によく使われる。行為者を言う必要がないとき、フランス語は受動態より se + 動詞、あるいは on を使う構文を好む。

## 3. 単純未来の用法

:::deep 4つの用法

**（1）未来の出来事**

[[Je partirai demain.\|ジュ・パルティレ・ドゥマン\|私は明日出発する。]]

**（2）予測**

[[Il fera beau demain.\|イル・フラ・ボー・ドゥマン\|明日は晴れるだろう。]]
[[Tu comprendras un jour.\|テュ・コンプランドラ・アン・ジュール\|いつか分かるよ。]]

**（3）命令の代わり（丁寧・穏やかな指示）**

[[Tu me téléphoneras.\|テュ・ム・テレフォヌラ\|電話してね。]]
[[Vous fermerez la porte.\|ヴー・フェルムレ・ラ・ポルト\|ドアを閉めておいてください。]]

命令形より**やわらかく、押しつけがましくない**指示になります。章のタイトル「でんわしてね」がこれです。命令形の [[Téléphone-moi !\|テレフォヌ・モワ\|電話して！]] より、[[Tu me téléphoneras ?\|テュ・ム・テレフォヌラ\|電話してくれる？]] のほうが穏やかに響きます。

**（4）婉曲・推量（現在の事柄について）**

[[Ce sera lui, sans doute.\|ス・スラ・リュイ・サン・ドゥット\|きっと彼だろう。]]（今のことを推測している）

これは現在の推量であって、未来の話ではありません。
:::

:::warn 近接未来と単純未来の使い分け（第11章の復習）
| | 近接未来 je vais partir | 単純未来 je partirai |
|---|---|---|
| 現在とのつながり | **強い**（もう決まっている） | 弱い（現在から切り離されている） |
| 文体 | 話し言葉で圧倒的 | 書き言葉・改まった場面 |
| 用法 | 予定・確定した近い未来 | 予測・約束・宣言 |

**日常会話では近接未来が未来表現の大半を占めます。** 単純未来は、天気予報、契約、宣言、文学作品などで多く使われます。

## 4. si（もし）の後では未来を使わない

:::warn 条件の si の後は現在形
これは英語と同じ規則ですが、忘れられやすい点です。

- ○ [[Si tu viens, je serai content.\|スィ・テュ・ヴィアン・ジュ・スレ・コンタン\|君が来れば、私は嬉しい。]]
- × Si tu viendras, …

**si 節の中は現在形、主節が未来形**です。英語の If you come, I will be happy. と完全に対応します。

ただし**間接疑問の si（〜かどうか）は別**で、未来形が使えます。
[[Je ne sais pas s'il viendra.\|ジュ・ヌ・セ・パ・スィル・ヴィアンドラ\|彼が来るかどうか分からない。]]

同じ si でも、**条件を表すのか、「〜かどうか」を表すのか**で扱いが変わります。第30章で si 構文の全体像を扱います。
:::

:::note quand の後では未来を使う
si とは逆に、**quand（〜するとき）の後では未来形を使います**。ここは英語と違うので注意が必要です。

- ○ [[Quand tu viendras, je serai là.\|カン・テュ・ヴィアンドラ・ジュ・スレ・ラ\|君が来るとき、私はそこにいる。]]
- 英語：When you **come**（現在形）, I will be there.

**英語は when 節で現在形を使いますが、フランス語は未来形**です。同じ扱いをするのは quand, lorsque, dès que（〜するとすぐ）, aussitôt que, tant que（〜する限り）など。

これは頻出の誤りなので、**「si は現在、quand は未来」**とセットで覚えてください。
:::

## 5. 前未来 — 未来のある時点で完了している

**前未来（le futur antérieur）**は、**avoir / être の単純未来 ＋ 過去分詞**で作ります。第13章の「③過去分詞」から出る枝の1本です。

:::conj chanter futur,futurAnterieur

**意味は「未来のある時点から見て、すでに完了している」**です。英語の will have done にあたります。

:::ex 前未来
J'aurai fini avant midi. | ジョレ・フィニ・アヴァン・ミディ | 正午前には終わっているだろう。
Quand tu arriveras, je serai déjà parti. | カン・テュ・アリヴラ・ジュ・スレ・デジャ・パルティ | 君が着くころには、私はもう出発しているだろう。
Dès que j'aurai terminé, je t'appellerai. | デ・ク・ジョレ・テルミネ・ジュ・タペルレ | 終わり次第、君に電話する。
:::

:::deep 前未来の2つの用法

**（1）未来における完了**（上の例文）

**（2）過去の推量**

[[Il aura oublié.\|イ・ロラ・ウブリエ\|彼は忘れたのだろう。]]
[[Elle se sera trompée.\|エル・ス・スラ・トロンペ\|彼女は間違えたのだろう。]]

形は未来ですが、**過去の出来事についての推量**を表します。単純未来の（4）婉曲・推量が現在について働くのに対し、前未来は過去について働きます。

| 形 | 推量の対象 |
|---|---|
| 単純未来 | **現在**（Ce sera lui.＝きっと彼だろう） |
| 前未来 | **過去**（Il aura oublié.＝忘れたのだろう） |

**助動詞と一致の規則は複合過去とまったく同じ**です（第20章）。être を取る動詞は主語に一致し、avoir でも直接目的語が前に出れば一致します。
:::

:::note dès que + 前未来 は決まった組み合わせ
「〜し終えたらすぐに」を表すとき、**dès que / aussitôt que + 前未来**が定型です。

[[Dès que tu auras fini, préviens-moi.\|デ・ク・テュ・オラ・フィニ・プレヴィアン・モワ\|終わったらすぐ知らせて。]]

英語では As soon as you **have finished**（現在完了）と言うところですが、フランス語は**前未来**を使います。前節の「quand の後は未来形」の規則が、複合時制でも同じように働いているだけです。
:::

## 6. 条件法現在への橋渡し

:::warn ここまで来れば条件法現在は完成している
第13章で述べたとおり、**条件法現在＝未来語幹 ＋ 半過去の語尾**です。

:::conj chanter futur,conditionnel

- 単純未来：chanter + **ai, as, a, ons, ez, ont**
- 条件法現在：chanter + **ais, ais, ait, ions, iez, aient**

**語幹はまったく同じ**で、語尾を半過去のものに差し替えるだけ。不規則動詞の未来語幹（ser-, aur-, ir-, fer-, verr-…）も、そのまま条件法に使えます。

つまり**この章で覚えた17個の未来語幹が、第30章でそのまま使い回せます**。第30章で新しく学ぶのは用法（仮定・語調緩和）だけです。
:::

:::warn je serai と je serais の聞き分け
書けば1文字違いですが、発音も微妙にしか違いません。

- [[je serai\|ジュ・スレ\|私は〜だろう]]（単純未来、語尾は [e] に近い）
- [[je serais\|ジュ・スレ\|私は〜だろうに]]（条件法、語尾は [ɛ] に近い）

伝統的には [e] と [ɛ] で区別されますが、**現代の話し言葉ではほぼ区別されません**。文脈（si 節があるか、丁寧表現か）で判断することになります。

これはフランス語の書き取りで最も難しい対立の1つです。
:::

## 練習問題

:::quiz
Q. 単純未来の語尾に例外はありますか。
A. 一つもない。すべての動詞で -ai, -as, -a, -ons, -ez, -ont。しかもこれは avoir の現在形と一致する（俗ラテン語の「不定詞 + habere」に由来）。不規則があるのは語幹のほうだけ。

Q. attendre の未来形が attendreai ではなく attendrai なのはなぜですか。
A. -re 動詞は未来語幹を作るときに語末の e を落とすため。落とさないと -rai の r の前で e が重なって発音しにくくなる。

Q. Si tu viendras, je serai content. はなぜ誤りですか。
A. 条件を表す si 節の中では未来形を使わず、現在形にする。正しくは Si tu **viens**, je serai content. 英語の If you come, I will be happy. と同じ規則。ただし「〜かどうか」の si（間接疑問）では未来形が使える。

Q. 「君が来るとき、私はそこにいる」を、quand を使って言ってください。英語との違いは何ですか。
A. **Quand tu viendras, je serai là.** 英語は when 節で現在形（When you come）を使うが、**フランス語は未来形**を使う。lorsque, dès que, aussitôt que, tant que も同じ。「si は現在、quand は未来」とセットで覚える。

Q. Il aura oublié. はどういう意味ですか。
A. 「彼は忘れたのだろう」。形は前未来だが、**過去の出来事についての推量**を表す。単純未来が現在の推量に使われる（Ce sera lui.）のと対になる用法。

Q. 単純未来を学び終えると、条件法現在について何が分かったことになりますか。
A. ほぼすべて。条件法現在は「**未来語幹 ＋ 半過去の語尾**」でできているので、この章で覚えた未来語幹（ser-, aur-, ir-, fer-, verr- …）がそのまま使える。第30章で新しく学ぶのは用法だけになる。
:::

**en** はたった2文字の語ですが、フランス語で最も使用頻度が高く、しかも日本語話者が最後まで使いこなせない代名詞です。

理由は単純で、**日本語に対応する語がない**からです。日本語では言わずに済ませてしまう部分を、フランス語では en で明示しなければなりません。

しかし規則そのものは明快です。**en は「de + 何か」を受ける** ——これだけです。第21章の関係代名詞 dont が「de + 名詞」を受けたのと、まったく同じ構造です。

## 1. en が受けるもの

| 受けるもの | 例 |
|---|---|
| **de + 名詞**（場所・事柄） | Je viens **de Paris**. → J'**en** viens. |
| **不定冠詞・部分冠詞 + 名詞** | Je bois **du café**. → J'**en** bois. |
| **数量表現 + 名詞** | J'ai **trois livres**. → J'**en** ai trois. |
| **de + 不定詞** | J'ai besoin **de partir**. → J'**en** ai besoin. |

:::note 判定の手順は dont と同じ
第18章・第21章と同じ手順です。

1. 名詞のままの文を作る：Je bois **du** café.
2. **de** が含まれるか確認する（du = de + le）→ **含まれる**
3. だから **en**：J'**en** bois.

**「de があれば en」** ——これが唯一の判定基準です。
:::

## 2. 用法（1）de + 場所・事柄を受ける

:::ex de + 名詞を受ける
Je viens de Paris. → J'en viens. | ジャン・ヴィアン | 私はそこから来た。
Il parle de son travail. → Il en parle. | イ・ラン・パルル | 彼はそれについて話す。
J'ai besoin de ce livre. → J'en ai besoin. | ジャ・ネ・ブゾワン | 私はそれが必要だ。
Elle est contente de son travail. → Elle en est contente. | エ・ラン・ネ・コンタント | 彼女はそれに満足している。
:::

**de を取る動詞・形容詞**（第7章・第21章で見たもの）がそのまま対象になります：parler de, avoir besoin de, se souvenir de, avoir peur de, être content de, être fier de …

## 3. 用法（2）不定冠詞・部分冠詞つきの名詞を受ける

**ここが日本語話者にとって最も難しい用法です。**

:::ex 部分冠詞・不定冠詞を受ける
Tu bois du café ? — Oui, j'en bois. | ウィ・ジャン・ボワ | コーヒー飲む？ — うん、飲むよ。
Tu as des amis ici ? — Oui, j'en ai. | ウィ・ジャ・ネ | ここに友達いる？ — うん、いるよ。
Vous voulez du pain ? — Non, merci, je n'en veux pas. | ジュ・ナン・ヴ・パ | パンはいかがですか？ — いえ、結構です。
:::

:::warn 日本語では言わない部分を、フランス語は必ず言う
「コーヒー飲む？」「うん、飲むよ」——日本語では「飲むよ」だけで通じます。

しかしフランス語で **Oui, je bois.** と言うと、「私は（酒を）飲む人間だ」という別の意味になってしまいます。**何を飲むのかを en で受けないと文が成立しない**のです。

同じく：
- × Oui, j'ai.（意味をなさない）
- ○ **Oui, j'en ai.**（うん、持ってるよ）

**目的語を省略できない** ——これがフランス語の基本的な性質で、en はそのための道具です。第17章で「代名詞は動詞の前」と学んだのと同じ理由です。
:::

## 4. 用法（3）数量表現とともに使う

**数や量を表す語が残る**のが特徴です。

:::ex 数量が残る
Combien de livres as-tu ? — J'en ai trois. | ジャ・ネ・トロワ | 本は何冊持ってる？ — 3冊持ってる。
Tu as des frères ? — Oui, j'en ai deux. | ウィ・ジャ・ネ・ドゥ | 兄弟いる？ — うん、2人いる。
Il y a beaucoup de monde ? — Il y en a beaucoup. | イ・リヤ・ナ・ボクー | 人は多い？ — 多いよ。
J'en veux un peu. | ジャン・ヴ・アン・プ | 少し欲しい。
:::

:::warn 数量表現は en と併用する（省略しない）
- × J'ai trois.
- ○ J'**en** ai trois.

数詞や beaucoup / un peu / assez などが文中にあっても、**en は必要**です。en が「何の3つか」を示し、数詞が「いくつか」を示す——役割が違うので両方要ります。

英語では I have three. で足りますが、フランス語では en が省けません。
:::

:::note un / une は数詞として残る
不定冠詞 un / une つきの名詞を受けるときは、**un / une を数詞として残します**。

- [[Tu as une voiture ? — Oui, j'en ai une.\|ウィ・ジャ・ネ・ユヌ\|車持ってる？ — うん、1台持ってる。]]
- 否定なら残しません：[[Non, je n'en ai pas.\|ノン・ジュ・ナ・ネ・パ\|いや、持ってない。]]（第2章の否定の de により un が消えるため）
:::

## 5. 位置と語順

**他の目的語代名詞と同じく動詞の前**です。ただし**en は代名詞の中で最後**に置かれます。

:::ex en の位置
J'en veux. | ジャン・ヴ | 私はそれが欲しい。
Je n'en veux pas. | ジュ・ナン・ヴ・パ | 私はそれが要らない。
Je vais en acheter. | ジュ・ヴェ・ザン・アシュテ | 私はそれを買うつもりだ。
J'en ai acheté. | ジャ・ネ・アシュテ | 私はそれを買った。
Donne-m'en ! | ドンヌ・マン | それをちょうだい！
Il m'en a parlé. | イル・マン・ナ・パルレ | 彼はそれについて私に話した。
:::

:::warn 肯定命令では m'en / t'en になる
第16章・第19章で見たとおり、肯定命令では代名詞が動詞の後ろに来て me が moi に変わります。しかし **en が続く場合は m'en** と弱形に戻ります。

- [[Donne-moi ça.\|ドンヌ・モワ・サ\|それをちょうだい。]]（en なし → moi）
- [[Donne-m'en.\|ドンヌ・マン\|それをちょうだい。]]（en あり → m'en）
- [[Va-t'en !\|ヴァ・タン\|出て行け！]]（te + en → t'en）

また第16章で見たとおり、**第1群の tu の命令形では -s が復活します**：[[Parles-en !\|パルル・ザン\|それについて話して！]]、[[Manges-en !\|マンジュ・ザン\|それを食べて！]]
:::

:::deep 過去分詞は en に一致しない
第20章の規則③では「直接目的語が前に出れば過去分詞が一致する」と述べました。**しかし en は例外で、一致させません。**

- [[Des pommes ? J'en ai acheté.\|デ・ポム・ジャ・ネ・アシュテ\|りんご？ 買ったよ。]]（× achetées）

en は「不特定の量」を表すため、性数が確定しない——というのが説明です。**en は一致の対象外**、と規則として覚えてください。
:::

## 6. en を使った慣用表現

:::adv 成句の en
en が何を指すのか説明できない、化石化した表現があります。まとめて覚えます。

| 表現 | 意味 |
|---|---|
| [[Je m'en vais.\|ジュ・マン・ヴェ]] | 私は行く（s'en aller） |
| [[Je n'en peux plus.\|ジュ・ナン・プ・プリュ]] | もう限界だ |
| [[Ne t'en fais pas.\|ヌ・タン・フェ・パ]] | 心配しないで |
| [[Je m'en fiche.\|ジュ・マン・フィッシュ]] | どうでもいい（くだけた） |
| [[Il s'en est sorti.\|イル・サン・ネ・ソルティ]] | 彼は切り抜けた |
| [[J'en ai marre.\|ジャ・ネ・マール]] | うんざりだ（くだけた） |
| [[Où en êtes-vous ?\|ウー・アン・ネット・ヴー]] | どこまで進みましたか |
| [[Il n'en reste plus.\|イル・ナン・レスト・プリュ]] | もう残っていない |

**J'en ai marre.** と **Je n'en peux plus.** は日常会話で非常によく使われます。
:::

## 7. 前置詞 en と混同しない

:::warn 3つの en がある
綴りが同じで、まったく別のものが3つあります。

| | 例 | 見分け方 |
|---|---|---|
| **代名詞の en** | [[J'en veux.\|ジャン・ヴ\|それが欲しい]] | **動詞の前** |
| **前置詞の en** | [[en France\|アン・フランス\|フランスで]]、[[en voiture\|アン・ヴォワテュール\|車で]] | **名詞の前**（無冠詞） |
| **ジェロンディフの en** | [[en chantant\|アン・シャンタン\|歌いながら]] | **現在分詞の前**（第29章） |

**位置で区別できます。** 動詞の直前にあれば代名詞、名詞の前なら前置詞、-ant で終わる語の前ならジェロンディフです。
:::

## 8. y との違い（次章への橋渡し）

第26章で扱う **y** と対になっているので、ここで対比しておきます。

| | 受けるもの |
|---|---|
| **en** | **de** + 名詞 |
| **y** | **à** + 名詞、場所を表す前置詞 + 名詞 |

:::ex en と y の対比
Je viens de Paris. → J'en viens. | ジャン・ヴィアン | そこから来る。
Je vais à Paris. → J'y vais. | ジ・ヴェ | そこへ行く。
Je parle de ce livre. → J'en parle. | ジャン・パルル | それについて話す。
Je pense à ce livre. → J'y pense. | ジ・パンス | それについて考える。
:::

**de なら en、à なら y** ——この対応さえ掴めば、2つの章は同じ構造として理解できます。

## 練習問題

:::quiz
Q. en が受けるものを一言で言うと何ですか。
A. **de + 何か**。de + 名詞（場所・事柄）、不定冠詞・部分冠詞つきの名詞（du café → 冠詞に de が含まれる）、数量表現つきの名詞、de + 不定詞のすべてが対象。判定は「名詞のままの文に de が現れるか」を見る。

Q. 「コーヒー飲む？」に「うん、飲むよ」と答えるとき、Oui, je bois. ではなぜ不十分ですか。
A. フランス語は目的語を省略できないため。Oui, je bois. だと「私は（酒を）飲む人間だ」という別の意味になる。正しくは **Oui, j'en bois.** 日本語では言わずに済ませる部分を、フランス語は en で明示する必要がある。

Q. 「本を3冊持っている」を、J'ai trois. と言えないのはなぜですか。
A. 数詞があっても en は省略できないため。正しくは **J'en ai trois.** en が「何の3つか」を、trois が「いくつか」を示しており、役割が違うので両方必要。英語の I have three. とは異なる。

Q. Des pommes ? J'en ai acheté. で、なぜ achetées にならないのですか。
A. en は過去分詞の一致の対象外だから。第20章の「直接目的語が前に出れば一致」という規則の例外で、en が不特定の量を表し性数が確定しないためと説明される。

Q. Donne-moi ça. と Donne-m'en. で、なぜ moi と m'en が違うのですか。
A. 肯定命令では代名詞が動詞の後ろに来るため通常は強形 moi になるが、**en が続く場合は m'en** と弱形に戻る。Va-t'en !（te + en）も同じ。

Q. en と y は、それぞれ何を受けますか。
A. en は **de** + 名詞、y は **à** + 名詞や場所を表す前置詞 + 名詞。Je viens de Paris → J'en viens / Je vais à Paris → J'y vais のように対になっている。
:::

:::ai-gen 代名詞 en、de を受ける代名詞、数量表現との併用

前章の en が **de** を受けたのに対し、この章の **y** は **à** と場所を受けます。2つで対になっており、規則も対称的です。

あわせて、第17章で少し触れた**中性代名詞 le** をここで正面から扱います。これは名詞ではなく**形容詞や文全体**を受ける代名詞で、日本語話者が落としやすい要素です。

## 1. y が受けるもの

| 受けるもの | 例 |
|---|---|
| **場所を表す前置詞 + 名詞** | Je vais **à Paris**. → J'**y** vais. |
| **à + 事柄**（モノ・抽象） | Je pense **à mon travail**. → J'**y** pense. |
| **à + 不定詞** | Je réussis **à comprendre**. → J'**y** réussis. |

:::ex y の基本用法
Je vais à Paris. → J'y vais. | ジ・ヴェ | 私はそこへ行く。
Tu habites à Tokyo ? — Oui, j'y habite. | ウィ・ジ・アビット | 東京に住んでるの？ — うん、住んでる。
Il pense à son avenir. → Il y pense. | イ・リ・パンス | 彼はそれについて考える。
Je réponds à la question. → J'y réponds. | ジ・レポン | 私はそれに答える。
Le livre est sur la table ? — Oui, il y est. | ウィ・イ・リ・エ | 本は机の上？ — うん、あるよ。
:::

:::note y は「そこ」と「それに」の両方
- **場所** … à, dans, sur, sous, chez, en など、**場所を表す前置詞すべて**を受けます。「そこへ」「そこで」。
- **事柄** … **à + モノ・抽象**を受けます。「それに」「それについて」。

de を受ける前置詞は en 一択だったのに対し、y は場所であれば前置詞を問いません。
:::

:::warn y は「人」には使えない
これが最重要の制限です。第18章で見たとおり、**à + 人**は間接目的語代名詞（lui / leur）または強勢形で受けます。

| 受けるもの | 使う代名詞 |
|---|---|
| à + **人**（普通の動詞） | **lui / leur**（第18章） |
| à + **人**（penser à 型） | **à + 強勢形**（第19章） |
| à + **モノ・事柄** | **y** |

:::ex 人とモノで代名詞が変わる
Je réponds à Marie. → Je lui réponds. | ジュ・リュイ・レポン | 私は彼女に答える。
Je réponds à la question. → J'y réponds. | ジ・レポン | 私はそれに答える。
Je pense à Marie. → Je pense à elle. | ジュ・パンス・ア・エル | 私は彼女のことを考える。
Je pense à mon travail. → J'y pense. | ジ・パンス | 私はそれについて考える。
:::

**同じ動詞でも、相手が人かモノかで代名詞が変わる** ——ここがフランス語の代名詞体系で最も細かい部分です。
:::

## 2. y の位置

**動詞の前**です。en と同じく、代名詞の中では後ろのほうに置かれます。

:::ex y の位置
J'y vais. | ジ・ヴェ | 私はそこへ行く。
Je n'y vais pas. | ジュ・ニ・ヴェ・パ | 私はそこへ行かない。
Je veux y aller. | ジュ・ヴ・イ・アレ | 私はそこへ行きたい。
J'y suis allé. | ジ・スュイ・ザレ | 私はそこへ行った。
Allons-y ! | アロン・ズィ | さあ行こう！
Vas-y ! | ヴァ・ズィ | 行け！／頑張れ！
:::

:::note Vas-y ! と Allons-y ! は日常で頻出
第16章で見たとおり、第1群の tu の命令形は -s が落ちますが、**y が続くとリエゾンのために復活します**（va → **vas**-y）。

- [[Vas-y !\|ヴァ・ズィ\|行け！／さあ！／頑張れ！]] — 応援・催促に広く使う
- [[Allons-y !\|アロン・ズィ\|行こう！]] — 出発を促す
- [[On y va ?\|オ・ニ・ヴァ\|行く？]] — 最もくだけた言い方
:::

## 3. il y a の y

:::deep 第4章の il y a を分解する
[[il y a\|イリヤ\|〜がある]] の y は、この章の y です。

- il … 非人称の主語（第15章）
- y … 「そこに」
- a … avoir の3人称単数

直訳すると「**それはそこに持っている**」。「ある場所に何かが存在する」という意味が、この3語から出ています。

だから否定は **il n'y a pas**（ne が y の前に来る）、疑問の倒置は **y a-t-il ?**（y は動詞の前に残り、主語 il だけが後ろへ回る）となります。第9章・第15章で形として覚えた表現が、いま構造として説明できます。
:::

## 4. 中性代名詞 le

**le には、第17章で扱った直接目的語の le とは別の用法があります。** 名詞ではなく、**形容詞・文・不定詞**を受ける用法です。

:::warn 中性の le は性数一致しない
これが「中性」と呼ばれる理由です。

- [[Elle est fatiguée ? — Oui, elle l'est.\|ウィ・エル・レ\|彼女は疲れてる？ — うん、疲れてる。]]

女性が主語でも **le のまま**（l' はエリジオン）。× la est とはなりません。
:::

:::deep 中性の le が受ける3つのもの

**（1）形容詞・属詞**

:::ex 形容詞を受ける
Tu es fatigué ? — Oui, je le suis. | ウィ・ジュ・ル・スュイ | 疲れてる？ — うん、疲れてる。
Elle est médecin ? — Oui, elle l'est. | ウィ・エル・レ | 彼女は医者？ — うん、そうだよ。
Ils sont contents ? — Ils le sont. | イル・ル・ソン | 彼らは満足してる？ — 満足してるよ。
:::

英語では Yes, I am. と省略しますが、**フランス語は le が必要**です。× Oui, je suis. では文が完結しません。

**（2）文全体・すでに述べられた内容**

:::ex 文を受ける
Il viendra, je le sais. | イル・ヴィアンドラ・ジュ・ル・セ | 彼は来る、私はそれを知っている。
Elle est partie, je ne le savais pas. | ジュ・ヌ・ル・サヴェ・パ | 彼女は行った、私はそれを知らなかった。
Tu as raison, je le reconnais. | ジュ・ル・ルコネ | 君は正しい、それは認める。
:::

**（3）不定詞**

[[Je voulais partir, mais je ne l'ai pas pu.\|ジュ・ヌ・レ・パ・ピュ\|出発したかったが、できなかった。]]

**savoir, croire, penser, dire, pouvoir, vouloir, espérer** のような動詞は、この le をよく取ります。
:::

:::warn 直接目的語の le と中性の le を見分ける
| | 受けるもの | 一致 |
|---|---|---|
| 直接目的語の le（第17章） | **名詞**（男性単数） | la / les と使い分ける |
| 中性の le | **形容詞・文・不定詞** | 常に le |

- [[Je le vois.\|ジュ・ル・ヴォワ\|私は彼／それを見る。]]（名詞を受ける → 女性なら la）
- [[Je le sais.\|ジュ・ル・セ\|私はそれを知っている。]]（文を受ける → 常に le）

**受けているものが名詞かどうか**で判定します。
:::

## 5. 3つの特殊代名詞をまとめる

:::note en / y / le の対応
| 代名詞 | 受けるもの | 例 |
|---|---|---|
| **en** | de + 名詞、不定冠詞・部分冠詞つき名詞、数量 | J'**en** bois. |
| **y** | 場所、à + モノ・事柄 | J'**y** vais. |
| **le**（中性） | 形容詞、文、不定詞 | Je **le** sais. |

**判定の順序**
1. de がある → **en**
2. à + モノ、または場所 → **y**
3. à + 人 → **lui / leur** または **à + 強勢形**
4. 名詞でなく形容詞・文を受ける → **中性の le**
5. 前置詞なしの名詞 → **le / la / les**（第17章）
:::

## 6. 練習してみる

:::ex 代名詞を使い分ける
Tu vas au cinéma ? — Oui, j'y vais. | ウィ・ジ・ヴェ | 映画館行く？ — うん、行く。
Tu veux du café ? — Oui, j'en veux. | ウィ・ジャン・ヴ | コーヒーいる？ — うん、欲しい。
Tu penses à Marie ? — Oui, je pense à elle. | ウィ・ジュ・パンス・ア・エル | マリのこと考えてる？ — うん。
Tu penses à ton travail ? — Oui, j'y pense. | ウィ・ジ・パンス | 仕事のこと考えてる？ — うん。
Tu es prêt ? — Oui, je le suis. | ウィ・ジュ・ル・スュイ | 準備できた？ — うん、できてる。
Tu connais ce film ? — Oui, je le connais. | ウィ・ジュ・ル・コネ | この映画知ってる？ — うん、知ってる。
:::

最後の2つを比べてください。どちらも le ですが、**上は形容詞（prêt）を受ける中性の le、下は名詞（ce film）を受ける直接目的語の le** です。

## 練習問題

:::quiz
Q. y が受けるものを挙げてください。
A. ①場所を表す前置詞（à, dans, sur, sous, chez, en …）+ 名詞、②à + モノ・事柄、③à + 不定詞。**人には使えない**のが最重要の制限で、à + 人は lui / leur または à + 強勢形で受ける。

Q. Je réponds à Marie. と Je réponds à la question. を、それぞれ代名詞にしてください。
A. **Je lui réponds.**（à + 人 → 間接目的語代名詞）と **J'y réponds.**（à + モノ → y）。同じ動詞でも、相手が人かモノかで代名詞が変わる。

Q. il y a の y は何ですか。
A. この章の y（「そこに」）。il（非人称の主語）+ y（そこに）+ a（avoir）で、直訳すれば「それはそこに持っている」。だから否定は il n'y a pas、倒置疑問は y a-t-il ? となる。

Q. Elle est fatiguée ? に「うん、疲れてる」と答えるとき、Oui, elle l'est. の l' はなぜ la にならないのですか。
A. 形容詞を受ける**中性の le** だから。性数一致しないので、主語が女性でも複数でも le のまま（母音の前では l'）。名詞を受ける直接目的語の le とは別物。

Q. Oui, je suis. と答えられないのはなぜですか。
A. フランス語では属詞を省略できないため。英語の Yes, I am. にあたる部分に中性の le が必要で、正しくは **Oui, je le suis.**

Q. Vas-y ! で、なぜ va に s が付いているのですか。
A. y が母音で始まるため、リエゾンする子音がないと発音しにくいから。第1群の tu の命令形は通常 -s が落ちるが、y や en が続くと復活する（第16章）。Parles-en ! も同じ。
:::

:::ai-gen 代名詞 y、中性代名詞 le、en との使い分け

  sub: '2つ以上並べるときの全パターン',
  body: `
{lead}第17章から第26章まで、5種類の代名詞を個別に見てきました。**直接目的語・間接目的語・強勢形・en・y** です。

実際の文では、これらが**2つ同時に現れる**ことがあります。[[Il me le donne.\|イル・ム・ル・ドンヌ\|彼はそれを私にくれる。]] のように。このとき語順は自由ではなく、**厳密に決まっています**。

しかも**肯定命令のときだけ順序が入れ替わる**という厄介な例外があります。この節で全パターンを一度に整理します。

## 1. 基本の語順表

**肯定命令以外**では、常にこの順序です。

| 1 | 2 | 3 | 4 | 5 |
|---|---|---|---|---|
| **me**<br>**te**<br>**se**<br>**nous**<br>**vous** | **le**<br>**la**<br>**les** | **lui**<br>**leur** | **y** | **en** |

**動詞の前に、この順で並べます。**

:::ex 基本の語順
Il me le donne. | イル・ム・ル・ドンヌ | 彼はそれを私にくれる。（1 → 2）
Je le lui donne. | ジュ・ル・リュイ・ドンヌ | 私はそれを彼にあげる。（2 → 3）
Il m'en parle. | イル・マン・パルル | 彼はそれについて私に話す。（1 → 5）
Il y en a. | イ・リ・ヤン・ナ | そこにそれがある。（4 → 5）
Je l'y ai vu. | ジュ・リ・エ・ヴュ | 私はそこで彼を見た。（2 → 4）
Je lui en ai parlé. | ジュ・リュイ・アン・ネ・パルレ | 私は彼にそれについて話した。（3 → 5）
:::

:::note 覚え方
「**me te se nous vous** → **le la les** → **lui leur** → **y** → **en**」

フランスの学校では、この順序を歌のように暗唱させます。順番を思い出せれば、あとは当てはめるだけです。

**構造的な理解**もできます。
- **1列目**は1・2人称（および再帰代名詞）
- **2列目**は3人称の**直接**目的語
- **3列目**は3人称の**間接**目的語
- **y と en は常に最後**（この2つが並ぶときは必ず y → en）
:::

## 2. 1列目と3列目は共存できない

:::warn me lui / te leur という並びは存在しない
表の1列目（me, te, se, nous, vous）と3列目（lui, leur）は、**同時に使えません**。

- × Il me lui présente.
- ○ [[Il me présente à lui.\|イル・ム・プレザン・タ・リュイ\|彼は私を彼に紹介する。]]

**間接目的語のほうを à + 強勢形にして、動詞の後ろに回します**（第19章）。

理由：1列目の me / te は直接目的語にも間接目的語にもなるため、lui と並ぶと**どちらが直接でどちらが間接か分からなくなる**からです。曖昧さを避けるための制約です。

同じ理由で、次も言えません。
- × Tu me leur présentes. → ○ [[Tu me présentes à eux.\|テュ・ム・プレザン・タ・ウー\|君は私を彼らに紹介する。]]
:::

## 3. 肯定命令のときだけ順序が変わる

:::warn 肯定命令では 直接目的語 → 間接目的語
第16章で見たとおり、肯定命令では代名詞が**動詞の後ろ**に来ます。そしてこのとき、**語順も入れ替わります**。

| | 語順 |
|---|---|
| **通常** | 間接（me, te…）→ 直接（le, la, les） |
| **肯定命令** | **直接**（le, la, les）→ **間接**（moi, toi, lui…） |

:::ex 語順の反転
Il me le donne. | イル・ム・ル・ドンヌ | 彼はそれを私にくれる。（通常：me → le）
Donne-le-moi ! | ドンヌ・ル・モワ | それを私にくれ！（肯定命令：le → moi）
Ne me le donne pas ! | ヌ・ム・ル・ドンヌ・パ | それを私にくれるな！（否定命令：通常の順に戻る）
:::

**否定命令では通常の語順に戻る**点に注意してください。位置（動詞の前）が通常と同じなので、順序も通常どおりになります。
:::

:::deep 肯定命令の完全な語順

| 1 | 2 | 3 |
|---|---|---|
| **le**<br>**la**<br>**les** | **moi**（m'）<br>**toi**（t'）<br>**lui**<br>**nous**<br>**vous**<br>**leur** | **y**<br>**en** |

すべてハイフンでつなぎます。

:::ex 肯定命令の例
Donne-le-moi. | ドンヌ・ル・モワ | それを私にちょうだい。
Montre-la-lui. | モントル・ラ・リュイ | それを彼に見せて。
Rends-les-leur. | ラン・レ・ルール | それらを彼らに返して。
Donne-m'en. | ドンヌ・マン | それをちょうだい。
Allez-vous-en ! | アレ・ヴー・ザン | 立ち去れ！
Va-t'en ! | ヴァ・タン | 出て行け！
:::

**en / y が続くと、moi / toi は m' / t' に戻ります**（第25章）。強い位置にあっても、母音の前ではエリジオンが優先されるためです。
:::

## 4. 複合時制での位置

**代名詞は助動詞の前**にまとめて置きます（第20章）。

:::ex 複合時制
Il me l'a donné. | イル・ム・ラ・ドネ | 彼はそれを私にくれた。
Je le lui ai donné. | ジュ・ル・リュイ・エ・ドネ | 私はそれを彼にあげた。
Je ne le lui ai pas donné. | ジュ・ヌ・ル・リュイ・エ・パ・ドネ | 私はそれを彼にあげなかった。
Il m'en a parlé. | イル・マン・ナ・パルレ | 彼はそれについて私に話した。
:::

**ne … pas は「代名詞 + 助動詞」のかたまりを挟みます。**

:::warn 過去分詞の一致もここで効く
第20章の規則③により、**直接目的語が前にあれば過去分詞が一致**します。

- [[Je la lui ai donnée.\|ジュ・ラ・リュイ・エ・ドネ\|私はそれを彼にあげた。]]（la が女性 → donnée）
- [[Je lui en ai parlé.\|ジュ・リュイ・アン・ネ・パルレ\|私は彼にそれについて話した。]]（en は一致の対象外、lui は間接 → parlé のまま）

**一致するのは2列目（le, la, les）が前にあるときだけ**、と整理できます。1列目の me/te/nous/vous も直接目的語なら一致します（[[Elle nous a vus.\|エル・ヌー・ザ・ヴュ\|彼女は私たちを見た。]]）。
:::

## 5. 不定詞を伴う構文

**代名詞は、自分が目的語になっている動詞の前**に置きます（第17章）。

:::ex 不定詞の前
Je vais le lui donner. | ジュ・ヴェ・ル・リュイ・ドネ | 私はそれを彼にあげるつもりだ。
Je veux t'en parler. | ジュ・ヴ・タン・パルレ | 私はそれについて君に話したい。
Il ne peut pas nous y conduire. | イル・ヌ・プ・パ・ヌー・ズィ・コンデュイール | 彼は私たちをそこへ連れて行けない。
:::

× Je le lui vais donner. とはなりません。donner の目的語なので、donner の直前に置きます。

:::note 使役・知覚動詞は例外（第17章）
faire + 不定詞、voir / entendre + 不定詞では、**代名詞が主動詞の前**に来ます。

[[Je le lui fais lire.\|ジュ・ル・リュイ・フェ・リール\|私は彼にそれを読ませる。]]（× Je fais le lui lire）

faire + 不定詞が1つの動詞のかたまりとして扱われるためです。
:::

## 6. 全パターン早見表

:::note まとめ
**通常（肯定命令以外）— 動詞の前**

me / te / se / nous / vous → le / la / les → lui / leur → y → en

**肯定命令 — 動詞の後ろ、ハイフンでつなぐ**

le / la / les → moi / toi / lui / nous / vous / leur → y / en

**制約**
- 1列目と lui / leur は共存できない → 間接目的語を à + 強勢形にする
- y と en が並ぶときは必ず **y → en**（il y en a）
- en / y の前では moi / toi が m' / t' に戻る
- 複合時制では代名詞は助動詞の前
- 不定詞構文では、目的語になっている動詞の直前
:::

## 7. 練習してみる

:::ex 名詞を代名詞に置き換える
Il donne le livre à Marie. → Il le lui donne. | イル・ル・リュイ・ドンヌ | 彼はそれを彼女にあげる。
Je te montre les photos. → Je te les montre. | ジュ・ト・レ・モントル | 私はそれらを君に見せる。
Tu me parles de ton voyage. → Tu m'en parles. | テュ・マン・パルル | 君はそれについて私に話す。
Elle nous attend à la gare. → Elle nous y attend. | エル・ヌー・ズィ・アタン | 彼女は私たちをそこで待つ。
Donne le livre à Marie ! → Donne-le-lui ! | ドンヌ・ル・リュイ | それを彼女にあげて！
Ne donne pas le livre à Marie ! → Ne le lui donne pas ! | ヌ・ル・リュイ・ドンヌ・パ | それを彼女にあげないで！
:::

最後の2つで、**肯定命令と否定命令で語順が変わっていない**点に注目してください。どちらも le → lui です。**入れ替わるのは「1列目と2列目」の関係だけ**で、le と lui の順序はもともと le が先だからです。

反転が実際に起きるのは、次のような場合です。
- 通常：Il **me le** donne.（me → le）
- 肯定命令：Donne-**le-moi** !（le → moi）

## 練習問題

:::quiz
Q. 代名詞を2つ並べるときの基本の語順を言ってください。
A. me / te / se / nous / vous → le / la / les → lui / leur → y → en。動詞の前にこの順で置く。1列目は1・2人称と再帰代名詞、2列目は3人称の直接目的語、3列目は3人称の間接目的語、y と en は常に最後。

Q. Il me lui présente. はなぜ誤りですか。どう言い換えますか。
A. 1列目（me, te, se, nous, vous）と3列目（lui, leur）は共存できないため。me が直接目的語か間接目的語か判別できなくなるのを避ける制約。正しくは **Il me présente à lui.** と、間接目的語を à + 強勢形にして後ろに回す。

Q. Il me le donne. を肯定命令にすると、語順はどうなりますか。
A. **Donne-le-moi !** 肯定命令では代名詞が動詞の後ろに来て、語順が「直接目的語 → 間接目的語」に入れ替わる。また強い位置になるため me が moi に変わる。否定命令では通常の語順に戻る（Ne me le donne pas !）。

Q. Donne-moi ça. と Donne-m'en. で、なぜ形が違うのですか。
A. en が続くと、強形 moi が m' に戻るため。母音の前ではエリジオンが優先される。Va-t'en !（te + en）も同じ。

Q. Je la lui ai donnée. で、なぜ donnée に e が付くのですか。
A. 直接目的語 la（女性）が過去分詞より前にあるため、第20章の規則③で一致する。間接目的語の lui は一致の対象にならない。en も一致しない（第25章）。

Q. Je le lui vais donner. はなぜ誤りですか。
A. 代名詞は「自分が目的語になっている動詞」の直前に置くため。le も lui も donner の目的語なので、donner の前に置く。正しくは **Je vais le lui donner.**
:::

  body: `
半過去（l'imparfait）は、**作り方が最も簡単で、使い方が最も難しい**時制です。

作り方には**フランス語全体で例外が1つしかありません**（être のみ）。第13章の全体図でいえば「①直説法現在」から出る枝の1本目で、nous の現在形さえ言えれば作れます。

難しいのは用法です。**複合過去との使い分け**——どちらも日本語では「〜した」になるため、日本語話者には区別の手がかりがありません。この章の大半をその対立に充てます。

## 1. 作り方 — nous の現在形から

**手順は2つだけです。**

1. **nous の現在形**を出す
2. **-ons を取って**、半過去の語尾を付ける

| 人称 | 語尾 |
|---|---|
| je | **-ais** |
| tu | **-ais** |
| il | **-ait** |
| nous | **-ions** |
| vous | **-iez** |
| ils | **-aient** |

:::conj chanter imparfait

| 動詞 | nous の現在形 | 語幹 | je の半過去 |
|---|---|---|---|
| chanter | nous chant**ons** | chant- | je chantais |
| finir | nous finiss**ons** | finiss- | je finissais |
| prendre | nous pren**ons** | pren- | je prenais |
| boire | nous buv**ons** | buv- | je buvais |
| faire | nous fais**ons** | fais- | je faisais |
| aller | nous all**ons** | all- | j'allais |
| voir | nous voy**ons** | voy- | je voyais |
| devoir | nous dev**ons** | dev- | je devais |

:::warn 例外は être ただ1つ
nous **sommes** からは -ons が取れません。être だけ、特別に **ét-** を語幹とします。

:::conj être imparfait

**フランス語の全動詞で、半過去の例外はこれだけ**です。不規則動詞であっても、現在形さえ言えれば半過去は必ず作れます。
:::

:::warn nous / vous で綴りが変わる動詞
第8章の綴りの変化が、ここでも効きます。

| 動詞 | je | nous |
|---|---|---|
| manger | je mange**ais** | nous mang**ions**（e が消える） |
| commencer | je commenç**ais** | nous commenc**ions**（ç が c に戻る） |

理由は同じです。**e を挟むのも ç にするのも、a や o の前で音を保つため**でした。nous / vous の語尾 -ions / -iez は i で始まるので、調整が不要になります。

:::conj manger imparfait

:::conj commencer imparfait
:::

:::adv 語幹が i や y で終わる動詞は i が重なる
étudier（nous étudions）や voir（nous voyons）のような動詞では、nous / vous で **ii** や **yi** が並びます。

- nous étud**ii**ons、vous étud**ii**ez
- nous vo**yi**ons、vous vo**yi**ez
- nous r**ii**ons（rire）、nous trava**illi**ons（travailler）

書き落としやすい箇所です。**現在形の語幹に、そのまま -ions / -iez を足す**と考えれば間違えません。
:::

## 2. 半過去の3つの用法

:::deep 半過去が表すもの

### （1）継続していた状態・進行中だった動作

過去のある時点で「〜していた」「〜だった」。**始まりと終わりを問題にしません。**

:::ex 継続・進行
Il pleuvait. | イル・プルヴェ | 雨が降っていた。
J'étais fatigué. | ジェテ・ファティゲ | 私は疲れていた。
Elle lisait quand je suis entré. | エル・リゼ・カン・ジュ・スュイ・ザントレ | 私が入ったとき、彼女は本を読んでいた。
:::

### （2）習慣・反復

「よく〜したものだ」「いつも〜していた」。

:::ex 習慣・反復
Quand j'étais petit, j'allais souvent à la mer. | カン・ジェテ・プティ・ジャレ・スヴァン・ア・ラ・メール | 子どものころ、よく海に行った。
Il fumait beaucoup. | イル・フュメ・ボクー | 彼はたくさんタバコを吸っていた。
Tous les jours, elle prenait le train de sept heures. | トゥ・レ・ジュール・エル・プルネ・ル・トラン | 毎日、彼女は7時の電車に乗っていた。
:::

### （3）背景・描写

物語で、出来事の**舞台を設定する**役割。第20.5章で見た構造です。

:::ex 背景描写
Il faisait nuit. La rue était déserte. | イル・フゼ・ニュイ・ラ・リュ・エテ・デゼルト | 夜だった。通りは人けがなかった。
Elle portait une robe rouge. | エル・ポルテ・チュヌ・ローブ・ルージュ | 彼女は赤いドレスを着ていた。
:::
:::

## 3. 複合過去との使い分け — この章の核心

:::warn 日本語では区別されない
- [[Hier, j'ai lu ce livre.\|イエール・ジェ・リュ・ス・リーヴル\|昨日、この本を読んだ。]]（複合過去）
- [[Hier, je lisais ce livre.\|イエール・ジュ・リゼ・ス・リーヴル\|昨日、この本を読んでいた。]]（半過去）

日本語ではどちらも「読んだ／読んでいた」で、しかも入れ替えても不自然ではありません。**しかしフランス語では意味が明確に違います。**
:::

:::deep 対立の本質 — 出来事か、状況か

| | 複合過去 | 半過去 |
|---|---|---|
| 何を表すか | **出来事**。起きて、終わった | **状況**。続いていた |
| 時間の捉え方 | **点**（区切りがある） | **線**（区切りがない） |
| 物語での役割 | 前景（話を進める） | 背景（舞台を作る） |
| 問い | 「何が起きたか」 | 「どんな様子だったか」 |

**同じ出来事でも、どう捉えるかで時制が変わります。**

:::ex 同じ内容を2つの時制で
J'ai habité à Paris pendant trois ans. | ジェ・アビテ・ア・パリ・パンダン・トロワ・ザン | 私は3年間パリに住んだ。（期間が区切られた出来事）
J'habitais à Paris à cette époque. | ジャビテ・ア・パリ・ア・セット・エポック | 当時、私はパリに住んでいた。（背景としての状態）
:::

1つ目は「3年間」という区切りがあるので出来事として捉えられ、複合過去になります。2つ目は区切りを問題にしていないので半過去です。

**「何年住んだか」を言えば複合過去、「そのころどうだったか」を言えば半過去** ——同じ事実でも、話し手の捉え方で時制が決まります。
:::

:::ex 1文の中で両方が使われる典型
Je dormais quand le téléphone a sonné. | ジュ・ドルメ・カン・ル・テレフォン・ア・ソネ | 電話が鳴ったとき、私は眠っていた。
Il pleuvait, alors nous sommes restés à la maison. | イル・プルヴェ・アロール・ヌー・ソム・レステ・ア・ラ・メゾン | 雨が降っていたので、私たちは家にいた。
Elle lisait tranquillement quand soudain, quelqu'un a frappé à la porte. | エル・リゼ・トランキルマン・カン・スダン・ケルカン・ア・フラペ・ア・ラ・ポルト | 彼女が静かに本を読んでいると、突然誰かがドアをノックした。
:::

**進行中の状況（半過去）を、出来事（複合過去）が中断する** ——これが最も典型的な組み合わせです。

:::note 判定の手がかりになる副詞
文中の副詞が、どちらの時制を要求するかの目安になります。

**複合過去を呼びやすい語**（区切りを示す）
soudain（突然）、tout à coup（急に）、un jour（ある日）、hier（昨日）、pendant 〜（〜の間）、trois fois（3回）、d'abord / ensuite / enfin（まず／次に／最後に）

**半過去を呼びやすい語**（繰り返し・継続を示す）
souvent（しばしば）、toujours（いつも）、tous les jours（毎日）、d'habitude（普段は）、autrefois（昔は）、pendant que 〜（〜している間）、à cette époque（当時）

ただし**絶対ではありません**。最終的には「出来事か、状況か」の判断です。
:::

:::warn 状態動詞でも複合過去は使える
être, avoir, savoir, pouvoir, vouloir, connaître のような状態を表す動詞は半過去になりやすいのですが、**複合過去にすると意味が変わります**。

| 動詞 | 半過去 | 複合過去 |
|---|---|---|
| savoir | [[je savais\|ジュ・サヴェ]] 知っていた | [[j'ai su\|ジェ・スュ]] 知った（知るに至った） |
| pouvoir | [[je pouvais\|ジュ・プヴェ]] できる状態だった | [[j'ai pu\|ジェ・ピュ]] できた（実際にやった） |
| vouloir | [[je voulais\|ジュ・ヴレ]] 〜したかった | [[j'ai voulu\|ジェ・ヴリュ]] 〜しようとした |
| connaître | [[je connaissais\|ジュ・コネセ]] 知っていた | [[j'ai connu\|ジェ・コニュ]] 知り合った |
| avoir | [[j'avais peur\|ジャヴェ・プール]] 怖かった | [[j'ai eu peur\|ジェ・ウ・プール]] 怖くなった |

**複合過去にすると「その状態に入った瞬間」を指す**ようになります。状態が始まった一点を出来事として捉えるからです。

この対立は入門書がほとんど触れませんが、実際の読解では頻繁に問題になります。
:::

## 4. その他の半過去の用法

:::adv 過去以外を表す半過去

**（1）si + 半過去 — 仮定・提案**

[[Si on allait au cinéma ?\|スィ・オ・ナレ・オ・スィネマ\|映画に行かない？]]

「〜したらどう？」という提案です。過去の意味はありません。第30章の条件法と組み合わさると仮定文になります。
[[Si j'avais de l'argent, je voyagerais.\|スィ・ジャヴェ・ドゥ・ラルジャン・ジュ・ヴォワヤジュレ\|お金があれば旅行するのに。]]

**（2）語調緩和**

[[Je voulais vous demander quelque chose.\|ジュ・ヴレ・ヴー・ドゥマンデ・ケルク・ショーズ\|ちょっとお伺いしたいことがあるのですが。]]

現在の願望を半過去で言うと、**遠慮がちで丁寧**になります。条件法（第30章）と同じ働きです。時間的な距離が、心理的な距離＝丁寧さに転用されています。

**（3）間接話法の中の現在**（第27.6章）

[[Il a dit qu'il était malade.\|イラ・ディ・キ・レテ・マラード\|彼は病気だと言った。]]

「彼が言った時点では現在」だったことを、半過去で表します。時制の一致（第27.6章）の規則です。

**（4）近接過去・近接未来の過去版**（第11章）

[[Il venait de partir.\|イル・ヴネ・ドゥ・パルティール\|彼は出発したばかりだった。]]
[[Il allait partir.\|イ・ラレ・パルティール\|彼は出発しようとしていた。]]
:::

## 5. 全時制の中での位置

:::conj chanter present,imparfait,passeCompose

**現在 → 半過去 → 複合過去**を並べると、半過去が「現在形の語幹をそのまま使っている」ことが見えます。第13章で述べた「①直説法現在から3つ」の枝の1本です。

## 6. 活用ドリル

:::drill chanter,finir,prendre,être,avoir,aller,faire,venir,voir,boire,manger,commencer imparfait

:::note 語幹の作り方を意識する
出題された動詞について、まず **nous の現在形**を思い浮かべてください。そこから -ons を取れば語幹です。語尾は全動詞共通なので、語幹さえ出れば必ず正解できます。

être だけは例外（ét-）です。
:::

## 練習問題

:::quiz
Q. 半過去の語幹はどう作りますか。例外はいくつありますか。
A. **nous の現在形から -ons を取る**。例外はフランス語全体で **être ただ1つ**（nous sommes からは作れないので ét- を使う）。不規則動詞であっても現在形さえ言えれば半過去は必ず作れる。

Q. 複合過去と半過去の対立は、本質的に何の違いですか。
A. **出来事か、状況か**。複合過去は起きて終わった出来事を点として捉え、半過去は続いていた状況を線として捉える。物語では複合過去が話を進め、半過去が背景を作る。同じ事実でも、話し手の捉え方で時制が決まる。

Q. J'ai habité à Paris pendant trois ans. と J'habitais à Paris à cette époque. の違いは何ですか。
A. 前者は「3年間」という区切りがあるので出来事として複合過去。後者は区切りを問題にせず当時の状況を述べているので半過去。住んでいたという事実は同じでも、捉え方が違う。

Q. je savais と j'ai su は、どう意味が違いますか。
A. je savais は「知っていた（状態）」、j'ai su は「知った・知るに至った（その状態に入った瞬間）」。状態動詞を複合過去にすると、状態の始まりを出来事として指すようになる。pouvoir, vouloir, connaître, avoir peur も同じ対立を持つ。

Q. nous mangions で、なぜ e が消えるのですか。
A. e を挟むのは g を [ʒ] に保つため（a や o の前で [g] になるのを防ぐ）だった。半過去の nous / vous の語尾は -ions / -iez と i で始まるので、調整が不要になる。commencer が nous commencions と ç に戻るのも同じ理由。

Q. Si on allait au cinéma ? は過去の話ですか。
A. 違う。si + 半過去で「〜しない？」という**提案**を表す用法。半過去には他にも、語調を和らげる用法（Je voulais vous demander…）や、間接話法で「その時点の現在」を表す用法があり、必ずしも過去を表すとは限らない。
:::

## 3. 大過去と複合過去・半過去の関係

:::note 3つの過去時制の役割分担
物語の中で、3つの時制はこう働きます。

| 時制 | 役割 | 例 |
|---|---|---|
| **半過去** | 背景・状況 | Il faisait nuit.（夜だった） |
| **複合過去** | 出来事 | Il est entré.（彼が入ってきた） |
| **大過去** | それより前に完了していたこと | Il avait oublié ses clés.（鍵を忘れていた） |

:::ex 3つを並べる

Elle avait oublié ses clés. | エ・ラヴェ・トゥブリエ・セ・クレ | 彼女は鍵を忘れていた。（大過去＝それ以前の完了）
Alors elle a sonné. | アロー・レラ・ソネ | それでベルを鳴らした。（複合過去＝出来事の続き）
:::

**大過去が入ることで、時間の奥行きが生まれます。**
:::

:::adv 前過去（le passé antérieur）— 書き言葉のもう一つの形
大過去と似た意味を持つ時制がもう1つあります。**前過去**は「助動詞の**単純過去** + 過去分詞」で作ります。

**読解で出会ったら「大過去と同じ意味」と理解すれば足ります。** 自分で書く必要はありません。
:::

:::conj chanter passeCompose,plusQueParfait,futurAnterieur,conditionnelPasse,subjonctifPasse

**過去分詞 chanté は5つすべてで同じ**です。変わるのは助動詞の時制だけ。

| 複合時制 | 助動詞の時制 | 意味 |
|---|---|---|
| 複合過去 | 現在 | 現在から見て完了 |
| **大過去** | **半過去** | **過去から見て完了** |
| 前未来 | 単純未来 | 未来から見て完了 |
| 条件法過去 | 条件法現在 | 仮定の帰結として完了 |
| 接続法過去 | 接続法現在 | 接続法の文脈で完了 |

## 練習問題

:::quiz
Q. 大過去はどう作りますか。
A. **助動詞（avoir / être）の半過去 ＋ 過去分詞**。複合過去の助動詞を半過去に差し替えるだけで、過去分詞は同じ。助動詞の選択も一致の規則も複合過去とまったく同じ。

Q. Quand je suis arrivé, il était déjà parti. で、2つの動詞の時制が違うのはなぜですか。
A. 「私が着いた」は基準となる過去の出来事（複合過去）、「彼が出発していた」はそれより前にすでに完了していたこと（大過去）。時間の層が2つあることを、時制で示している。

Q. 物語の中で、半過去・複合過去・大過去はどう役割分担しますか。
A. 半過去が背景・状況、複合過去が出来事、大過去がそれより前に完了していたこと。大過去が入ることで時間の奥行きが生まれる。

Q. Si j'avais su, je ne serais pas venu. はどういう意味ですか。
A. 「知っていたら、来なかったのに」。si + 大過去で**過去の反実仮想**（実際には起こらなかったこと）を表し、主節には条件法過去が来る（第30章）。Si j'avais su… は後悔の決まり文句として単独でも使われる。

Q. 前過去（le passé antérieur）とは何ですか。
A. 「助動詞の**単純過去** + 過去分詞」で作る、書き言葉専用の時制。単純過去とセットで、quand や dès que の後に限って使われる。単純過去の衰退に伴いほぼ使われなくなったので、読解で出会ったら大過去と同じ意味と理解すれば足りる。

Q. 複合時制は5つありますが、それぞれで変わるものと変わらないものは何ですか。
A. 変わるのは**助動詞の時制**だけ。過去分詞は5つすべてで同じ。助動詞の選択（avoir か être か）と過去分詞の一致の規則も共通。

## 1. 直接話法と間接話法

| | 例 |
|---|---|
| **直接話法**（le discours direct） | Il dit : « **Je suis** fatigué. » |
| **間接話法**（le discours indirect） | Il dit **qu'il est** fatigué. |

:::

:::note フランス語の引用符は « »
