意味は「**過去のある時点から見て、すでに完了していた**」。英語の had done にあたります。新しく覚える活用はほとんどありません——過去分詞は複合過去と同じ、助動詞の選び方も一致の規則もそのままで、**変わるのは助動詞の時制だけ**です。

しかし「作り方が簡単＝使い方も簡単」ではありません。大過去には、

- 時間の前後を示す本来の用法のほかに、**後悔・非難・丁寧**を表す独特の使い方がある
- 英語の past perfect と違い、**義務ではなく話し手の選択**である

という2つの難しさがあります。この章では作り方を確認したあと、その2点に時間をかけます。

## 1. 作り方

:::conj chanter passeCompose,plusQueParfait

複合過去の助動詞を**半過去に差し替える**だけです。

| 時制 | 助動詞 | 例 |
|---|---|---|
| 複合過去 | avoir / être の**現在** | j'**ai** chanté |
| 大過去 | avoir / être の**半過去** | j'**avais** chanté |

:::ex 大過去
J'avais fini quand il est arrivé. | ジャヴェ・フィニ・カン・キ・レ・タリヴェ | 彼が着いたとき、私はもう終えていた。
Elle était déjà partie. | エ・レテ・デジャ・パルティ | 彼女はもう出発していた。
Nous avions mangé avant de sortir. | ヌー・ザヴィオン・マンジェ・アヴァン・ドゥ・ソルティール | 出かける前に食べておいた。
Il m'a dit qu'il avait perdu ses clés. | イル・マ・ディ・キ・ラヴェ・ペルデュ・セ・クレ | 彼は鍵をなくしたと言った。
:::

### 助動詞の選択 — 復習と完全なリスト

大過去でも、**avoir を取るか être を取るかは動詞そのもので決まります**。時制が変わっても選択は変わりません。

**être を取るのは次の2グループだけ**です。

| グループ | 動詞 |
|---|---|
| **移動・状態変化の自動詞** | aller / venir / arriver / partir / entrer / sortir / monter / descendre / naître / mourir / rester / tomber / passer / retourner / devenir / revenir / rentrer |
| **すべての代名動詞** | se lever / se coucher / se souvenir / s'en aller … |

:::deep être を取る自動詞の覚え方と、その理屈
16語ほどを丸暗記させる教材が多いのですが、**共通するのは「場所または状態の移動」**です。

- **場所の移動** — aller（行く）、venir（来る）、arriver（着く）、partir（発つ）、entrer（入る）、sortir（出る）、monter（上がる）、descendre（下りる）、tomber（落ちる）、passer（通る）、retourner（戻る）
- **状態の移動** — naître（生まれる＝無から有へ）、mourir（死ぬ＝有から無へ）、devenir（〜になる）
- **移動しないことの明示** — rester（とどまる）

rester だけが例外に見えますが、「移動しうる状況で移動しなかった」という点で同じ枠に属します。

なぜ être なのか。**これらの動詞では、主語は動作の担い手というより「状態の変化を被る者」**だからです。Il est parti は「彼は出発した」であると同時に「彼は今ここにいない状態にある」という**結果状態**を表します。être（〜である）は状態を表す動詞なので、結果状態を示すのに適していました。

だから**過去分詞が主語に一致する**（Elle est parti**e**）のも自然です。一致とは、過去分詞が形容詞のように主語を形容しているということだからです。
:::

### 他動詞にもなる自動詞 — 助動詞が変わる

**monter, descendre, sortir, entrer, passer, retourner** は、目的語を取ると**他動詞になり、助動詞が avoir に変わります**。意味も変わります。

| 自動詞（être） | 他動詞（avoir） |
|---|---|
| Elle **est** montée.（彼女は上がった） | Elle **a** monté la valise.（彼女はスーツケースを上げた） |
| Il **est** sorti.（彼は出かけた） | Il **a** sorti son portefeuille.（彼は財布を出した） |
| Nous **sommes** passés.（私たちは通った） | Nous **avons** passé un examen.（私たちは試験を受けた） |
| Ils **sont** rentrés.（彼らは帰った） | Ils **ont** rentré la voiture.（彼らは車を車庫に入れた） |

:::ex 大過去で助動詞が分かれる
Elle était montée au premier étage. | エ・レテ・モンテ・オ・プルミエ・レタージュ | 彼女は2階に上がっていた。（自動詞）
Elle avait monté les valises. | エ・ラヴェ・モンテ・レ・ヴァリーズ | 彼女はスーツケースを上げていた。（他動詞）
Il était sorti avant midi. | イ・レテ・ソルティ・アヴァン・ミディ | 彼は正午前に出かけていた。（自動詞）
Il avait sorti les poubelles. | イ・ラヴェ・ソルティ・レ・プベル | 彼はゴミを出していた。（他動詞）
:::

**目的語があるかどうか**で機械的に判定できます。目的語があれば avoir、なければ être です。

### 過去分詞の一致 — 3つの規則

複合時制の過去分詞は、次の3つの規則に従います。**大過去でもまったく同じ**です。

| 助動詞 | 一致する相手 | 例 |
|---|---|---|
| **être**（自動詞） | **主語** | Elle était parti**e**. |
| **avoir** | **前に出た直接目的語**のみ | Les lettres qu'il avait écrit**es**. |
| **être**（代名動詞） | 再帰代名詞が**直接目的語**なら主語に一致 | Elle s'était lavé**e**. |

:::conj aller plusQueParfait

:::conj se coucher plusQueParfait

:::warn avoir のときは「前に出た直接目的語」だけ
avoir を助動詞に取る場合、**原則として一致しません**。一致するのは、直接目的語が過去分詞より**前**に置かれたときだけです。前に出る場合は3つあります。

| 前に出る形 | 例 |
|---|---|
| **直接目的語代名詞** | Ces lettres, je **les** avais écrit**es**. |
| **関係代名詞 que** | Les lettres **que** j'avais écrit**es**. |
| **疑問の quelle** | **Quelles** lettres avais-tu écrit**es** ? |

後ろにあるときは一致しません：J'avais écrit **ces lettres**.（一致なし）

なぜ「前」だけなのか。**過去分詞を書く時点で、目的語の性数がすでに分かっているから**です。話し言葉で文を作りながら進むとき、目的語がまだ出ていなければ一致のしようがありません。この規則は、**話しながら文を組み立てる順序**を反映しています。
:::

:::deep 代名動詞の一致 — 再帰代名詞が直接目的語かどうか
代名動詞は必ず être を取りますが、**一致するとは限りません**。判定は「再帰代名詞が直接目的語か間接目的語か」です。

| 例 | se の役割 | 一致 |
|---|---|---|
| Elle s'était lavé**e**. | 直接目的語（自分を洗う） | **する** |
| Elle s'était lavé les mains. | 間接目的語（自分**に**手を洗う） | **しない** |
| Elles s'étaient parlé. | 間接目的語（parler **à** qn） | **しない** |
| Elles s'étaient vu**es**. | 直接目的語（voir qn） | **する** |

判定法は簡単です。**その動詞が前置詞なしで目的語を取るか（voir qn, laver qch）、à を取るか（parler à qn, téléphoner à qn）**を見ます。前置詞を取る動詞なら se は間接目的語なので、一致しません。

ここでも**動詞がどの前置詞を取るか**（第7.5章）の知識が効いてきます。se téléphoner、se parler、se demander、se plaire、se ressembler、se succéder はすべて一致しません。
:::

## 2. 用法

:::deep 大過去が使われる4つの場面

### （1）過去の出来事より前に完了していたこと

**時間の前後関係を明示する**のが本来の役割です。

:::ex 過去の前の過去
Quand je suis arrivé, il était déjà parti. | カン・ジュ・スュイ・ザリヴェ・イ・レテ・デジャ・パルティ | 私が着いたとき、彼はもう出発していた。
Elle a mangé le gâteau que j'avais fait. | エラ・マンジェ・ル・ガト・ク・ジャヴェ・フェ | 彼女は私が作ったケーキを食べた。
Je ne savais pas qu'il avait déménagé. | ジュ・ヌ・サヴェ・パ・キ・ラヴェ・デメナジェ | 彼が引っ越したことを私は知らなかった。
Il était fatigué parce qu'il avait mal dormi. | イ・レテ・ファティゲ・パルス・キ・ラヴェ・マル・ドルミ | 彼はよく眠れなかったので疲れていた。
:::

**時間の層が2つある**のがポイントです。
- 基準となる過去（複合過去 or 半過去）
- それより前に完了していたこと（大過去）

### （2）間接話法の中の複合過去（第27.6章）

主節が過去のとき、従属節の複合過去は大過去になります。

- 直接話法：[[Il a dit : « J'ai fini. »|イラ・ディ・ジェ・フィニ|彼は「終わった」と言った。]]
- 間接話法：[[Il a dit qu'il avait fini.|イラ・ディ・キ・ラヴェ・フィニ|彼は終わったと言った。]]

時制の一致の規則です。第27.6章で扱います。

### （3）si + 大過去 — 過去の反実仮想（第30章）

[[Si j'avais su, je ne serais pas venu.|スィ・ジャヴェ・スュ・ジュ・ヌ・スレ・パ・ヴニュ|知っていたら、来なかったのに。]]

「あのとき〜だったら、〜だったのに」という、**実際には起こらなかったこと**を表します。主節には条件法過去が来ます。第30章で si 構文の全体像を扱います。

### （4）習慣の反復に対する完了（半過去と組む）

半過去が表す習慣の中で、**そのつど先に完了していたこと**を大過去で示します。

[[Chaque soir, il relisait ce qu'il avait écrit.|シャク・ソワール・イル・ルリゼ・ス・キ・ラヴェ・エクリ|毎晩、彼は自分が書いたものを読み返していた。]]

この場合の大過去は「1回の完了」ではなく、**反復されるたびに完了していた**ことを表します。日本語の「〜しておいた」に近い感覚です。
:::

## 3. 大過去の特殊用法 — 時間の前後を表さない使い方

大過去には、**時間関係とは無関係の**用法が3つあります。どれも日常でよく使われるので、独立して覚える価値があります。

### （1）Si + 大過去だけの文 — 後悔・非難・願望

主節を省き、**si 節だけで文を終える**と、強い感情を表します。

:::ex si + 大過去の独立用法
Si j'avais su ! | スィ・ジャヴェ・スュ | 知っていたら（よかったのに）！
Si tu m'avais écouté ! | スィ・チュ・マヴェ・ゼクテ | 私の言うことを聞いていればよかったのに！
Ah, si j'étais parti plus tôt ! | ア・スィ・ジェテ・パルティ・プリュ・ト | ああ、もっと早く出ていれば！
:::

主節がないのは、**言わなくても分かるから**です。「知っていたら（こんなことにならなかったのに）」——括弧の中身は聞き手が補います。日本語の「〜していれば……」と同じ省略です。

- **1人称なら後悔**：Si j'avais su !（知っていれば）
- **2人称なら非難**：Si tu m'avais écouté !（聞いていればよかったのに）

**Si j'avais su** は決まり文句として単独でも使われます。

### （2）丁寧・控えめの大過去

依頼や申し出を**大過去にすると、押しつけがましさが減ります**。

:::ex 丁寧の大過去
J'étais venu vous demander un service. | ジェテ・ヴニュ・ヴ・ドゥマンデ・アン・セルヴィス | お願いがあって参ったのですが。
J'avais pensé que vous pourriez m'aider. | ジャヴェ・パンセ・ク・ヴ・プリエ・メデ | 助けていただけるかと思ったのですが。
Je vous avais dit de venir à trois heures. | ジュ・ヴ・ザヴェ・ディ・ドゥ・ヴニール・ア・トロワ・ズール | 3時に来てくださいと申し上げたはずですが。
:::

いま現在の要求を、**過去のこととして距離を置いて述べる**——これが丁寧さの正体です。「参りました」ではなく「参ったのですが」と言うことで、相手に断る余地を残します。

条件法（Je voudrais …）が丁寧になるのと同じ原理で、**時間的な距離が心理的な距離になる**という、多くの言語に共通する仕組みです。

### （3）非難・当てこすりの大過去

上の3例目 **Je vous avais dit de venir à trois heures.** は、丁寧というより**当てこすり**です。「言ったはずですが（なぜ守らないのですか）」という含みがあります。

**Je te l'avais bien dit !**（だから言ったのに！）は、この用法の定型表現です。

## 4. 大過去と複合過去・半過去の関係

:::note 3つの過去時制の役割分担
物語の中で、3つの時制はこう働きます。

| 時制 | 役割 | 例 |
|---|---|---|
| **半過去** | 背景・状況 | Il faisait nuit.（夜だった） |
| **複合過去** | 出来事 | Il est entré.（彼が入ってきた） |
| **大過去** | それより前に完了していたこと | Il avait oublié ses clés.（鍵を忘れていた） |

:::ex 3つを並べる
Il faisait nuit et la maison était silencieuse. | イル・フゼ・ニュイ | 夜で、家は静かだった。（半過去＝背景）
Marie est rentrée vers minuit. | マリ・エ・ラントレ・ヴェール・ミニュイ | マリは真夜中ごろ帰ってきた。（複合過去＝出来事）
Elle avait oublié ses clés. | エ・ラヴェ・トゥブリエ・セ・クレ | 彼女は鍵を忘れていた。（大過去＝それ以前の完了）
Alors elle a sonné. | アロー・レラ・ソネ | それでベルを鳴らした。（複合過去＝出来事の続き）
:::

**大過去が入ることで、時間の奥行きが生まれます。**
:::

:::deep 大過去は義務ではない — 英語との最大の違い
英語では、過去の出来事より前のことを述べるとき **past perfect がほぼ義務**です。

- 英 When I arrived, he **had** already **left**.（had left でないと不自然）

フランス語でも大過去を使うのが標準ですが、**話し言葉では複合過去で済ませることがよくあります**。

- Quand je suis arrivé, il **était** déjà **parti**.（標準）
- Quand je suis arrivé, il **est** déjà **parti**.（話し言葉。やや崩れた言い方）

さらに、**時間関係が接続詞や副詞で明らかなときは、大過去を使わなくても誤解が生じません**。

- Il est parti **avant** que j'arrive.（avant que があるので前後は明らか）

つまりフランス語の大過去は、**時間関係を示す道具の1つ**であって、唯一の手段ではありません。英語話者は「必ず had + 過去分詞」と考えがちですが、フランス語ではもう少し緩やかです。

とはいえ、**書くときは大過去を正しく使うことが期待されます**。学習の段階では「使えるようになる」ことを優先してください。
:::

### 半過去と大過去の対立 — 状態か完了か

同じ場面でも、半過去にするか大過去にするかで意味が変わります。

| 半過去 | 大過去 |
|---|---|
| Il **était** malade.（病気だった＝状態） | Il **avait été** malade.（病気だったことがあった＝完了） |
| Elle **avait** faim.（空腹だった） | Elle **avait eu** faim.（空腹になったことがあった） |
| Je **savais** la vérité.（真実を知っていた） | J'**avais su** la vérité.（真実を知るに至っていた） |

**半過去は「その時点でそういう状態だった」、大過去は「その時点より前に完了していた」**——時間の位置が1つずれます。

## 5. 大過去と時の副詞

大過去は**完了を表す副詞**とよく組みます。位置は複合時制の規則どおり、**助動詞と過去分詞の間**です（第6.5章§6）。

| 副詞 | 例 |
|---|---|
| **déjà**（すでに） | Il était **déjà** parti. |
| **encore / toujours pas**（まだ〜ない） | Il n'était **pas encore** arrivé. |
| **jamais**（一度も〜ない） | Je n'avais **jamais** vu ça. |
| **enfin**（ついに） | Il avait **enfin** compris. |
| **bien**（しっかり） | Je te l'avais **bien** dit. |
| **à peine … que**（〜するや否や） | À peine était-il sorti qu'il pleuvait. |

:::ex 大過去と副詞
Je n'avais jamais vu un tel spectacle. | ジュ・ナヴェ・ジャメ・ヴュ・アン・テル・スペクタクル | そんな光景は見たことがなかった。
Il n'était pas encore rentré à minuit. | イル・ネテ・パ・ザンコール・ラントレ・ア・ミニュイ | 真夜中になっても彼はまだ帰っていなかった。
Elle avait enfin trouvé la solution. | エ・ラヴェ・アンファン・トルヴェ・ラ・ソリュスィヨン | 彼女はついに解決策を見つけていた。
:::

## 6. 前過去（le passé antérieur）

:::adv 前過去 — 書き言葉のもう一つの形
大過去と似た意味を持つ時制がもう1つあります。**前過去**は「助動詞の**単純過去** + 過去分詞」で作ります。

| 人称 | avoir + fini | être + parti |
|---|---|---|
| j' | **eus** fini | — |
| tu | **eus** fini | **fus** parti |
| il | **eut** fini | **fut** parti |
| nous | **eûmes** fini | **fûmes** partis |
| vous | **eûtes** fini | **fûtes** partis |
| ils | **eurent** fini | **furent** partis |

[[Quand il **eut fini**, il sortit.|カン・ティ・ル・フィニ|終えると、彼は出て行った。]]

使われるのは**単純過去とセットで、書き言葉のみ**。しかも **quand, lorsque, dès que, aussitôt que, après que, à peine … que** といった**時の接続詞の後に限られます**。

**大過去との違いは、時間の隔たりです。**

| 時制 | 感覚 |
|---|---|
| **大過去** | 前に完了していた（隔たりがあってもよい） |
| **前過去** | **完了した直後に**次の出来事が起きた |

Quand il **eut fini**, il sortit.（終えるとすぐ出て行った）は、終わることと出て行くことが**連続している**ことを表します。大過去の Quand il **avait fini**, il sortait だと「終えたときはいつも出て行った」という習慣になってしまい、意味が違います。

単純過去（第20.5章）が衰退したのに伴い、この時制もほぼ使われなくなりました。**読解で出会ったら「大過去と同じ意味」と理解すれば足ります。** 自分で書く必要はありません。

なお、話し言葉には **surcomposé（複複合過去）** という代替形があります：Quand il **a eu fini**, il est sorti.（助動詞を複合過去にする）。地域差が大きく、標準的とは言えませんが、南仏やスイスでよく聞かれます。
:::

## 7. 大過去の受動態と代名動詞

### 受動態の大過去

受動態は **être + 過去分詞** なので、大過去にすると **être の大過去 + 過去分詞** となり、**être が2つ重なります**。

[[La lettre avait été écrite par Marie.|ラ・レトル・アヴェ・エテ・エクリット・パール・マリ|手紙はマリによって書かれていた。]]

分解すると **avait（avoir の半過去）+ été（être の過去分詞）+ écrite（écrire の過去分詞）**。過去分詞が2つ並びますが、**主語に一致するのは最後の1つ**だけです（écrite が la lettre に一致）。

:::ex 受動態の大過去
Le pont avait été construit en 1900. | ル・ポン・アヴェ・エテ・コンストリュイ・アン・ミル・ヌフ・サン | その橋は1900年に建設されていた。
Les fenêtres avaient été fermées. | レ・フネートル・アヴェ・エテ・フェルメ | 窓は閉められていた。
:::

### 代名動詞の大過去

:::ex 代名動詞の大過去
Elle s'était levée tôt. | エル・セテ・ルヴェ・ト | 彼女は早く起きていた。
Ils s'étaient déjà couchés. | イル・セテ・デジャ・クシェ | 彼らはもう寝てしまっていた。
Nous nous étions trompés de route. | ヌー・ヌー・ゼティオン・トロンペ・ドゥ・ルート | 私たちは道を間違えていた。
Elle s'était lavé les mains. | エル・セテ・ラヴェ・レ・マン | 彼女は手を洗っていた。（一致なし）
:::

最後の例だけ一致していないことを確認してください。les mains という直接目的語が別にあるので、se は間接目的語（自分**に**）です。§1の deep で見た規則がそのまま適用されます。

## 8. 複合時制の全体を確認する

:::conj chanter passeCompose,plusQueParfait,futurAnterieur,conditionnelPasse,subjonctifPasse

**過去分詞 chanté は5つすべてで同じ**です。変わるのは助動詞の時制だけ。

| 複合時制 | 助動詞の時制 | 意味 |
|---|---|---|
| 複合過去 | 現在 | 現在から見て完了 |
| **大過去** | **半過去** | **過去から見て完了** |
| 前未来 | 単純未来 | 未来から見て完了 |
| 条件法過去 | 条件法現在 | 仮定の帰結として完了 |
| 接続法過去 | 接続法現在 | 接続法の文脈で完了 |

第13章で示した図式が、これで4つまで埋まりました。残るは接続法過去（第31章）だけです。

:::tip 複合時制を1つ覚えれば5つ作れる
複合過去が作れる人は、**助動詞の時制を差し替えるだけで残り4つが作れます**。avoir と être の全時制さえ言えれば、どの動詞のどの複合時制も導けます。

だからこそ、第13章で「être と avoir を最優先で覚える」と述べました。この2語は**助動詞として全動詞の複合時制に現れる**ので、投資対効果が圧倒的に高いのです。
:::

## 9. よくある誤り

:::warn 日本語話者がやりがちな誤り
| × | ○ | 理由 |
|---|---|---|
| Il **avait** parti. | Il **était** parti. | partir は être を取る（§1） |
| Elle **était** monté la valise. | Elle **avait** monté la valise. | 目的語があるので他動詞＝avoir（§1） |
| J'avais écrit**es** ces lettres. | J'avais écrit ces lettres. | 目的語が後ろなら一致しない（§1） |
| Elle s'était lavé**e** les mains. | Elle s'était lavé les mains. | se が間接目的語なので一致なし（§1） |
| Si j'**aurais** su … | Si j'**avais** su … | si の後に条件法は置けない（§2-3） |
| Quand il **avait** fini, il **sortit**. | Quand il **eut** fini, il sortit. | 単純過去には前過去が対応（§6） |
| La lettre avait été **écrit**. | La lettre avait été **écrite**. | 最後の過去分詞は主語に一致（§7） |
:::

## 1. 直接話法と間接話法

| | 例 |
|---|---|
| **直接話法**（le discours direct） | Il dit : « **Je suis** fatigué. » |
| **間接話法**（le discours indirect） | Il dit **qu'il est** fatigué. |

:::ex 直接話法と間接話法
Il dit : « Je suis fatigué. » | イル・ディ・ジュ・スュイ・ファティゲ | 彼は「私は疲れた」と言う。
Il dit qu'il est fatigué. | イル・ディ・キ・レ・ファティゲ | 彼は疲れたと言う。
:::

:::note フランス語の引用符は « »
フランス語では **« »**（les guillemets）を使い、**内側に空白を入れます**（« Je suis fatigué. »）。英語の " " は使いません。

会話文では、行頭のダッシュ **—** で話者の交代を示す形式も一般的です。
:::

## 2. 変化するもの（1）人称

**話し手が変わるので、人称代名詞・所有形容詞が変わります。**

:::ex 人称の変化
Il dit : « J'ai perdu mes clés. » | | 彼は「私は鍵をなくした」と言う。
→ Il dit qu'il a perdu ses clés. | イル・ディ・キ・ラ・ペルデュ・セ・クレ | 彼は鍵をなくしたと言う。
Elle m'a dit : « Je t'aime. » | | 彼女は私に「あなたを愛している」と言った。
→ Elle m'a dit qu'elle m'aimait. | エル・マ・ディ・ケ・ル・メメ | 彼女は私を愛していると言った。
:::

**je → il、mes → ses、tu/te → me** のように、語り手の視点に合わせて置き換えます。日本語でも同じ調整をするので、ここは直感的です。

## 3. 変化するもの（2）時制 — 時制の一致

:::warn 主節が過去のときだけ、時制が変わる
これが最重要の条件です。

- **主節が現在・未来** → 従属節の時制は**変わらない**
- **主節が過去**（複合過去・半過去・単純過去）→ 従属節の時制が**ずれる**

:::ex 主節の時制で変わる
Il dit qu'il est fatigué. | イル・ディ・キ・レ・ファティゲ | 彼は疲れたと言う。（主節が現在 → そのまま）
Il a dit qu'il était fatigué. | イラ・ディ・キ・レテ・ファティゲ | 彼は疲れたと言った。（主節が過去 → 半過去へ）
:::
:::

:::deep 時制の一致・完全表

主節が**過去**のとき、従属節は次のようにずれます。

| 直接話法（元の時制） | 間接話法（ずれた後） |
|---|---|
| 直説法現在 | **半過去** |
| 複合過去 | **大過去** |
| 単純未来 | **条件法現在** |
| 前未来 | **条件法過去** |
| 半過去 | **半過去**（変わらない） |
| 大過去 | **大過去**（変わらない） |
| 条件法 | **条件法**（変わらない） |
| 命令法 | **de + 不定詞** |

:::ex 時制がずれる例
Il a dit : « Je suis malade. » → Il a dit qu'il était malade. | イラ・ディ・キ・レテ・マラード | 彼は病気だと言った。（現在 → 半過去）
Il a dit : « J'ai fini. » → Il a dit qu'il avait fini. | イラ・ディ・キ・ラヴェ・フィニ | 彼は終わったと言った。（複合過去 → 大過去）
Il a dit : « Je viendrai. » → Il a dit qu'il viendrait. | イラ・ディ・キル・ヴィアンドレ | 彼は来ると言った。（単純未来 → 条件法現在）
Il a dit : « Pars ! » → Il m'a dit de partir. | イル・マ・ディ・ドゥ・パルティール | 彼は私に出発するように言った。（命令法 → de + 不定詞）
:::

**規則の背後にある論理**

すでに完了した3つの時制（半過去・大過去・条件法）は、**それ以上ずらしようがない**ので変わりません。ずれるのは現在・複合過去・未来の3つだけです。

- 現在 → 過去から見た「その時の現在」＝**半過去**
- 複合過去 → 過去から見た「その時の過去」＝**大過去**
- 単純未来 → 過去から見た「その時の未来」＝**条件法現在**

**条件法現在が「過去における未来」を表す**——これが条件法のもう一つの顔です。第30章で「仮定」として学ぶ形が、ここでは時制として働いています。
:::

:::warn 「過去における未来」は条件法
これは日本語話者がとくに戸惑う点です。

[[Il a dit qu'il viendrait.\|イラ・ディ・キル・ヴィアンドレ\|彼は来ると言った。]]

viendrait は条件法現在の形ですが、ここに**仮定の意味はありません**。「彼が言った時点から見て、これから来る」という**未来**を表しているだけです。

英語でも同じ構造があります：He said he **would** come.（would は本来 will の過去形）。フランス語の条件法も、もともと「未来語幹＋半過去の語尾」＝**過去から見た未来**という成り立ちなので（第13章）、この用法のほうが語源に忠実です。
:::

## 4. 変化するもの（3）時と場所を表す語

**「今日」「ここ」は、語る時点が変わればずれます。**

| 直接話法 | 間接話法（主節が過去） |
|---|---|
| aujourd'hui（今日） | **ce jour-là**（その日） |
| hier（昨日） | **la veille**（前日） |
| demain（明日） | **le lendemain**（翌日） |
| maintenant（今） | **alors** / **à ce moment-là**（その時） |
| ici（ここ） | **là** / **à cet endroit**（そこ） |
| ce matin（今朝） | **ce matin-là**（その朝） |
| la semaine prochaine（来週） | **la semaine suivante**（その翌週） |
| la semaine dernière（先週） | **la semaine précédente**（その前週） |

:::ex 時の表現がずれる
Il a dit : « Je pars demain. » | | 彼は「明日出発する」と言った。
→ Il a dit qu'il partait le lendemain. | イラ・ディ・キル・パルテ・ル・ランドゥマン | 彼は翌日出発すると言った。
Elle a dit : « Je suis arrivée hier. » | | 彼女は「昨日着いた」と言った。
→ Elle a dit qu'elle était arrivée la veille. | エラ・ディ・ケ・レテ・タリヴェ・ラ・ヴェイユ | 彼女は前日に着いたと言った。
:::

## 5. 疑問文の間接話法

**疑問文を間接話法にすると、語順が平叙文になります。**

:::deep 疑問の種類ごとの変換

| 直接疑問 | 間接疑問の接続詞 |
|---|---|
| はい／いいえの疑問 | **si**（〜かどうか） |
| 疑問副詞（où, quand, comment, pourquoi） | **そのまま** |
| **qu'est-ce que**（何を） | **ce que** |
| **qu'est-ce qui**（何が） | **ce qui** |
| **qui**（誰） | **qui**（そのまま） |

:::ex 間接疑問
Il demande : « Tu viens ? » → Il demande si je viens. | イル・ドゥマンド・スィ・ジュ・ヴィアン | 彼は私が来るかどうか尋ねる。
Il demande : « Où vas-tu ? » → Il demande où je vais. | イル・ドゥマンド・ウー・ジュ・ヴェ | 彼は私がどこへ行くのか尋ねる。
Il demande : « Qu'est-ce que tu fais ? » → Il demande ce que je fais. | イル・ドゥマンド・ス・ク・ジュ・フェ | 彼は私が何をしているのか尋ねる。
Il demande : « Qui est là ? » → Il demande qui est là. | イル・ドゥマンド・キ・エ・ラ | 彼は誰がいるのか尋ねる。
:::

**倒置は解除されます**（Où vas-tu ? → où je vais）。間接疑問はもはや疑問文ではなく、従属節だからです。

第21章で見た **ce qui / ce que** が、ここで疑問の受け皿として働いています。第12章の qu'est-ce qui / qu'est-ce que と対応関係にあることを確認してください。

| 直接疑問 | 間接疑問 | 関係節 |
|---|---|---|
| qu'est-ce qui | ce qui | ce qui |
| qu'est-ce que | ce que | ce que |

**3つの章が同じ形を別の役割で使っている**ことになります。
:::

:::warn 間接疑問の si と条件の si
形は同じですが別物です（第24章で触れました）。

| | 時制の扱い |
|---|---|
| **条件の si**（もし〜なら） | 未来形・条件法を使えない |
| **間接疑問の si**（〜かどうか） | 使える |

- 条件：× Si tu viendras … → ○ Si tu **viens**, je serai content.
- 間接疑問：○ Je ne sais pas si tu **viendras**.（君が来るかどうか分からない）

**後ろに未来形が来ていたら、それは間接疑問の si** です。
:::

## 6. 伝達動詞を選ぶ

:::adv dire 以外の伝達動詞
間接話法では、伝える内容に応じて動詞を選び分けます。表現の幅が大きく変わる部分です。

| 動詞 | 意味 | 構文 |
|---|---|---|
| [[dire que\|ディール・ク]] | 〜と言う | que + 直説法 |
| [[répondre que\|レポンドル・ク]] | 〜と答える | que + 直説法 |
| [[expliquer que\|エクスプリケ・ク]] | 〜と説明する | que + 直説法 |
| [[ajouter que\|アジュテ・ク]] | 〜と付け加える | que + 直説法 |
| [[affirmer que\|アフィルメ・ク]] | 〜と断言する | que + 直説法 |
| [[demander si\|ドゥマンデ・スィ]] | 〜かどうか尋ねる | si + 直説法 |
| [[demander de\|ドゥマンデ・ドゥ]] | 〜するよう頼む | de + 不定詞 |
| [[dire de\|ディール・ドゥ]] | 〜するよう言う | de + 不定詞 |
| [[conseiller de\|コンセイエ・ドゥ]] | 〜するよう勧める | de + 不定詞 |
| [[proposer de\|プロポゼ・ドゥ]] | 〜しようと提案する | de + 不定詞 |

**命令・依頼は必ず de + 不定詞**になります（que 節にはなりません）。

[[Il m'a dit de venir.\|イル・マ・ディ・ドゥ・ヴニール\|彼は私に来るように言った。]]
[[Elle m'a demandé de l'aider.\|エル・マ・ドゥマンデ・ドゥ・レデ\|彼女は手伝ってほしいと私に頼んだ。]]

**dire que と dire de の違い**が重要です。
- [[Il dit qu'il vient.\|イル・ディ・キル・ヴィアン\|彼は来ると言っている。]]（情報の伝達）
- [[Il dit de venir.\|イル・ディ・ドゥ・ヴニール\|彼は来るように言っている。]]（命令の伝達）
:::

## 7. 命令の間接話法と、自由間接話法

:::deep 命令文を伝える — de + 不定詞
命令文を間接話法にするときは、que 節ではなく **de + 不定詞**を使います。

:::ex 命令の間接話法
« Viens ! » → Il m'a dit de venir. | イル・マ・ディ・ドゥ・ヴニール | 彼は私に来るように言った。
« Ne partez pas ! » → Elle nous a demandé de ne pas partir. | エル・ヌー・ザ・ドゥマンデ・ドゥ・ヌ・パ・パルティール | 彼女は私たちに出発しないよう頼んだ。
« Attendez-moi. » → Il leur a dit de l'attendre. | イル・ルール・ア・ディ・ドゥ・ラタンドル | 彼は彼らに自分を待つよう言った。
:::

**dire à qn de faire / demander à qn de faire / conseiller à qn de faire**——第7.5章で見た「人には à、行為には de」の型がそのまま使われます。否定は **de ne pas + 不定詞**（ne pas がまとまって前）です。
:::

:::adv 自由間接話法 — 小説の第3の話法
文学作品には、直接話法とも間接話法とも違う**第3の話法**があります。

- 直接話法：Il pensa : « C'est trop tard. Je ne la reverrai jamais. »
- 間接話法：Il pensa que c'était trop tard et qu'il ne la reverrait jamais.
- **自由間接話法**：Il s'arrêta. **C'était trop tard. Il ne la reverrait jamais.**（彼は立ち止まった。もう遅すぎる。二度と彼女に会えないのだ。）

伝達動詞（il pensa que）を消し、**時制と人称だけ間接話法のまま**、地の文に登場人物の思考を流し込む——これが自由間接話法（le discours indirect libre）です。フロベール以降のフランス小説で多用され、**条件法や半過去が地の文に突然現れたら、登場人物の内心**と読むのが読解の鍵になります。

書けるようになる必要はありませんが、小説を原文で読むなら必ず出会う形です。
:::

## 8. 伝言を伝える — 話法の実地

話法の変換が最も必要になるのは、**伝言**です。電話・メッセージの内容を第三者に伝える場面で練習します。

:::ex 伝言の変換
« Je serai en retard. » → Paul a dit qu'il serait en retard. | ポール・ア・ディ・キル・スレ・タン・ルタール | ポールは遅れると言ってた。
« J'ai raté le train. » → Il a expliqué qu'il avait raté le train. | イ・ラ・エクスプリケ・キ・ラヴェ・ラテ | 電車に乗り遅れたんだって。
« Commencez sans moi. » → Il a dit de commencer sans lui. | イ・ラ・ディ・ドゥ・コマンセ・サン・リュイ | 先に始めててと言ってた。
« Tu peux me rappeler ? » → Elle demande si tu peux la rappeler. | エル・ドゥマンド・スィ・チュ・プ・ラ・ラプレ | かけ直してもらえるかって。
« Où êtes-vous ? » → Il veut savoir où on est. | イル・ヴ・サヴォワール・ウ・オ・ネ | どこにいるのか知りたがってる。
:::

観察ポイント：

- **serai → serait**（単純未来 → 条件法）、**ai raté → avait raté**（複合過去 → 大過去）——時制の一致
- **Commencez → de commencer**——命令は de + 不定詞
- **sans moi → sans lui**、**me → la**——人称の付け替え
- 主節が**現在**（Elle demande …）なら**時制はずれない**——伝言をその場で伝えるときは一致が起きない

最後の点は実務上重要です。**電話を切ってすぐ伝えるなら Elle demande si …（現在）**で足り、時制の一致は不要。**あとから報告するときだけ**（Elle a demandé si …）一致が発動します。

## 9. 総合練習

:::ex 直接話法から間接話法へ
Il a dit : « Je suis fatigué. » → Il a dit qu'il était fatigué. | イラ・ディ・キ・レテ・ファティゲ | 彼は疲れたと言った。
Elle a dit : « J'ai vu ce film hier. » → Elle a dit qu'elle avait vu ce film la veille. | エラ・ディ・ケ・レヴェ・ヴュ・ス・フィルム・ラ・ヴェイユ | 彼女は前日その映画を見たと言った。
Il a demandé : « Tu viendras demain ? » → Il a demandé si je viendrais le lendemain. | イラ・ドゥマンデ・スィ・ジュ・ヴィアンドレ・ル・ランドゥマン | 彼は私が翌日来るかどうか尋ねた。
Elle a dit : « Ferme la porte ! » → Elle m'a dit de fermer la porte. | エル・マ・ディ・ドゥ・フェルメ・ラ・ポルト | 彼女は私にドアを閉めるように言った。
:::

:::note 変換の手順
1. **伝達動詞**を決める（dire que / demander si / dire de …）
2. **人称**を語り手の視点に合わせる
3. 主節が過去なら**時制をずらす**（現在→半過去、複合過去→大過去、未来→条件法）
4. **時と場所の語**をずらす（demain → le lendemain …）
5. 疑問なら**倒置を解除**する

この5段階を順に適用すれば、機械的に変換できます。
:::

## 9. 時制の一致が起きない場合

主節が過去でも、**従属節が現在形のままでよい**場合があります。機械的に全部ずらすわけではありません。

| 場合 | 例 |
|---|---|
| **普遍の真理・恒常的事実** | Le professeur a dit que la Terre **tourne** autour du Soleil.（地球が太陽の周りを回ると先生は言った） |
| **今も有効な事実** | Elle m'a dit qu'elle **habite** à Lyon.（彼女はリヨンに住んでいると言った——今も住んでいる含み） |
| **主節が現在・未来** | Il dit qu'il **viendra**.（来ると言っている） |

2つ目が実用上のポイントです。**habitait（半過去）にすると「当時住んでいた（今は不明）」**、habite（現在）のままなら「今も住んでいる」と、**話し手の判断が時制に出ます**。一致は義務の規則であると同時に、**現在形を残すことで「まだ真」と示せる**表現の道具でもあるのです。

- Il m'a dit qu'il **était** malade.（そのとき病気だった——今は不明）
- Il m'a dit qu'il **est** malade.（病気だと言っていた——今も病気）

会話ではこの「現在形残し」が非常によく使われます。規則の目的は**時点の混乱を防ぐこと**なので、混乱が起きないなら現在形が残れる、と理解してください。

## 10. 引用の技術 — 部分引用と要約

実際の文章では、直接話法と間接話法をきれいに二分するより、**必要な部分だけ引用する**ことのほうが多くあります。

| 技法 | 例 |
|---|---|
| **語句だけを « » で引く** | Il a parlé d'un « malentendu regrettable ». |
| **selon / d'après で出典を示す** | **Selon lui**, le projet est mort. |
| **伝聞の条件法**（第30章） | Le projet **serait** abandonné. |
| **要約して伝える** | Il a exprimé son désaccord.（反対の意を示した） |

:::ex 引用の技法
Selon le journal, la décision est déjà prise. | スロン・ル・ジュルナル | 新聞によれば、決定はすでに下されている。
D'après elle, il n'y a aucun problème. | ダプレ・エル | 彼女によれば、何の問題もないそうだ。
Il a évoqué « des difficultés techniques ». | イ・ラ・エヴォケ | 彼は「技術的な困難」に言及した。
Le ministre aurait démissionné. | ル・ミニストル・オレ・デミスィヨネ | 大臣は辞任した模様だ。
:::

**selon / d'après + 人**（〜によれば）は、時制の一致を発動させずに出典を示せる便利な形です。**Selon lui, le projet est mort.** は、間接話法にすれば Il a dit que le projet était mort. となりますが、selon を使えば現在形のまま引用できます。

**伝聞の条件法**（第30章）は、**動詞1つで「未確認情報」を示す**フランス語独自の手段です。日本語の「〜という」「〜もよう」にあたり、報道文では selon とセットで使われます：**Selon des sources proches, il aurait démissionné.**（関係筋によれば辞任した模様だ）。

話法の学習は、最終的に「**誰の言葉として、どこまで責任を持って述べるか**」を選ぶ技術です。時制の一致という規則の背後にあるのは、この責任の所在の問題だと理解しておいてください。

  sub: '「愛される」という甘美な地獄',
  body: `
受動態（la voix passive）は **être + 過去分詞**で作ります。作り方は英語とほぼ同じで、難しいところはありません。

しかし実際のフランス語では、**受動態はあまり使われません**。日本語や英語なら受動で言うところを、フランス語は **on** や**代名動詞**で表すことを好みます。この章では受動態そのものより、**なぜ避けられるのか、代わりに何を使うのか**に重点を置きます。

## 1. 作り方 — être + 過去分詞

:::warn 過去分詞は必ず主語に性数一致する
être を使うので、第20章の規則①がそのまま適用されます。

:::ex 受動態の基本
Le livre est écrit par Marie. | ル・リーヴル・エ・テクリ・パール・マリ | その本はマリによって書かれた。
La lettre est écrite par Paul. | ラ・レットル・エ・テクリット・パール・ポール | その手紙はポールによって書かれた。
Les livres sont écrits par Marie. | レ・リーヴル・ソン・テクリ | それらの本はマリによって書かれた。
Les lettres sont écrites par Paul. | レ・レットル・ソン・テクリット | それらの手紙はポールによって書かれた。
:::

écrit / écrite / écrits / écrites と、主語に合わせて4通りに変化します。
:::

### 能動態から受動態へ

**能動文の直接目的語が、受動文の主語になります。**

:::ex 能動 → 受動
Marie écrit le livre. → Le livre est écrit par Marie. | ル・リーヴル・エ・テクリ・パール・マリ | 本はマリによって書かれる。
Le chat mange la souris. → La souris est mangée par le chat. | ラ・スリ・エ・マンジェ・パール・ル・シャ | ねずみは猫に食べられる。
:::

:::warn 直接目的語を持つ動詞しか受動態にできない
これが最も重要な制約です。**間接目的語しか取らない動詞は、受動態にできません。**

- [[Je téléphone à Marie.\|ジュ・テレフォヌ・ア・マリ\|私はマリに電話する。]] → 受動態にできない
- 英語なら Marie was telephoned. と言えますが、**フランス語では不可能**です

第17章・第18章で扱った直接／間接の区別が、ここでも効いています。同じ理由で、obéir à、répondre à、parler à なども受動態にできません。

**例外**：obéir, désobéir, pardonner は古い用法の名残で受動態が可能です（Il est obéi de tous.）が、非常に文語的です。
:::

## 2. 時制の変化 — être を活用させる

**受動態の時制は、être の時制で決まります。** 過去分詞は変わりません。

| 時制 | 形 |
|---|---|
| 現在 | Le livre **est** écrit. |
| 複合過去 | Le livre **a été** écrit. |
| 半過去 | Le livre **était** écrit. |
| 単純未来 | Le livre **sera** écrit. |
| 大過去 | Le livre **avait été** écrit. |
| 条件法現在 | Le livre **serait** écrit. |

:::conj être présent,passeCompose,imparfait,futur

:::ex 時制を変える
La maison est construite. | ラ・メゾ・ネ・コンストリュイット | 家が建てられる。
La maison a été construite en 1900. | ラ・メゾ・ナ・エテ・コンストリュイット | 家は1900年に建てられた。
La maison sera construite l'année prochaine. | ラ・メゾン・スラ・コンストリュイット | 家は来年建てられるだろう。
:::

:::warn 複合過去の受動態は過去分詞が2つ並ぶ
**a été construite** — avoir の現在 + été（être の過去分詞）+ construite（本動詞の過去分詞）。

3語になるので長く感じますが、構造は単純です。**「être を複合過去にした」だけ**です。

一致するのは**最後の過去分詞だけ**で、été は変化しません（× a étée）。
:::

## 3. 行為者を示す par と de

**行為者は par または de で導きます。** 使い分けがあります。

| 前置詞 | 使う場面 |
|---|---|
| **par** | **具体的な行為**。実際に何かをした |
| **de** | **状態・感情**。継続的な関係 |

:::ex par と de
Le livre est écrit par Marie. | ル・リーヴル・エ・テクリ・パール・マリ | 本はマリによって書かれた。（行為）
Il est aimé de tous. | イ・レ・テメ・ドゥ・トゥス | 彼はみんなに愛されている。（感情・状態）
Elle est respectée de ses élèves. | エ・レ・レスペクテ・ドゥ・セ・ゼレーヴ | 彼女は生徒たちに尊敬されている。（状態）
La ville est entourée de montagnes. | ラ・ヴィ・レ・タントゥレ・ドゥ・モンターニュ | その町は山に囲まれている。（状態）
:::

**de を取る主な動詞**：aimer, respecter, connaître, suivre, précéder, accompagner, entourer, couvrir, remplir, orner —— **感情や、静的な位置関係**を表す動詞です。

章のタイトル「愛される」は **être aimé de** ——感情なので de を使います。

:::note 行為者は省略されることが多い
実際には、**par 以下を言わない受動文が大半**です。

[[La porte a été fermée.\|ラ・ポル・タ・エテ・フェルメ\|ドアが閉められた。]]（誰が閉めたかは言わない）

そもそも受動態を使う理由が「行為者を言いたくない・言う必要がない」ことなので、これは自然な帰結です。
:::

## 4. なぜフランス語は受動態を避けるのか

:::deep 受動態の代わりに使われる2つの構文

フランス語では、行為者を示さない場合、**受動態より次の2つが好まれます**。

### （1）on を主語にする（第3章）

**最も一般的な方法です。**

:::ex on による受動の代用
On a construit ce pont en 1900. | オ・ナ・コンストリュイ・ス・ポン | この橋は1900年に建てられた。
On parle français au Canada. | オン・パルル・フランセ・オ・カナダ | カナダではフランス語が話されている。
On m'a volé mon sac. | オン・マ・ヴォレ・モン・サック | 鞄を盗まれた。
On vous demande au téléphone. | オン・ヴー・ドゥマン・ドー・テレフォン | お電話です（あなたが呼ばれています）。
:::

**日本語では受動で訳すのが自然**ですが、フランス語では能動文です。on が「誰か（特定しない人）」を担っています。

### （2）代名動詞の受動的用法（第23章）

**主語がモノのとき**に使えます。

:::ex 代名動詞による受動
Ce livre se vend bien. | ス・リーヴル・ス・ヴァン・ビアン | この本はよく売れる。
Le français se parle au Canada. | ル・フランセ・ス・パルル・オ・カナダ | フランス語はカナダで話されている。
Ça ne se fait pas. | サ・ヌ・ス・フェ・パ | そういうことはしないものだ。
Comment ça s'écrit ? | コマン・サ・セクリ | それはどう綴るのですか？
Ce plat se mange froid. | ス・プラ・ス・マンジュ・フロワ | この料理は冷たくして食べます。
:::

### 3つを並べて比べる

同じ内容を3通りで言えます。

:::ex 同じ内容を3通りで
Cette maison a été construite en 1900. | セット・メゾ・ナ・エテ・コンストリュイット | この家は1900年に建てられた。（受動態）
On a construit cette maison en 1900. | オ・ナ・コンストリュイ・セット・メゾン | この家を1900年に建てた。（on）
Cette maison s'est construite en 1900. | セット・メゾン・セ・コンストリュイット | この家は1900年に建てられた。（代名動詞）
:::

**使い分けの目安**
- **受動態** … 書き言葉、報道、学術。行為者を par で明示したいとき
- **on** … 話し言葉で最も一般的。行為者が人であることが前提
- **代名動詞** … 一般的な性質を述べるとき（「よく売れる」「こう書く」）

**日常会話では on が圧倒的**です。受動態は改まった文体の印である、と理解してください。
:::

## 5. 受動態にできない場合

:::warn 3つの制約

**（1）直接目的語がない動詞**（前節で述べたとおり）

**（2）avoir, pouvoir, vouloir などの一部の動詞**

[[J'ai une voiture.\|ジェ・ユヌ・ヴォワテュール\|私は車を持っている。]] → 受動態にできない（× Une voiture est eue par moi.）

**（3）代名動詞**

代名動詞はすでに se を目的語として使っているため、受動態にできません。

これらの場合、**on を使うか、能動文のままにします**。
:::

## 6. 状態か動作か — être + 過去分詞の曖昧さ

:::adv 「閉められた」のか「閉まっている」のか
**La porte est fermée.** には2つの解釈があります。

1. **動作の受動**：ドアが（今）閉められる
2. **状態**：ドアが閉まっている

フランス語ではこの2つを形で区別できません。文脈で判断します。

**明示したいとき**の手段：
- 動作を強調 → **par + 行為者**を加える：[[La porte est fermée par le concierge.\|ラ・ポル・テ・フェルメ・パール・ル・コンスィエルジュ\|ドアは管理人によって閉められる。]]
- 状態を強調 → 副詞や文脈で示す、あるいは形容詞的に捉える

ドイツ語は werden（動作）と sein（状態）で区別し、スペイン語も ser と estar で区別しますが、**フランス語は être 一つで両方を担っています**。

なお、複合過去にすると動作の解釈が強まります。
- [[La porte est fermée.\|ラ・ポル・テ・フェルメ\|ドアは閉まっている。]]（状態と読みやすい）
- [[La porte a été fermée.\|ラ・ポル・タ・エテ・フェルメ\|ドアが閉められた。]]（動作と読みやすい）
:::

## 7. se faire + 不定詞 — もう1つの受け身

:::deep se faire / se laisser + 不定詞
「〜される」を表すもう1つの重要な手段が **se faire + 不定詞**です。話し言葉では受動態よりよく使われる場面があります。

:::ex se faire + 不定詞
Il s'est fait voler son vélo. | イル・セ・フェ・ヴォレ・ソン・ヴェロ | 彼は自転車を盗まれた。
Elle s'est fait couper les cheveux. | エル・セ・フェ・クペ・レ・シュヴー | 彼女は髪を切ってもらった。
Je me suis fait avoir. | ジュ・ム・スュイ・フェ・アヴォワール | やられた（だまされた）。
Il s'est fait gronder par sa mère. | イル・セ・フェ・グロンデ・パール・サ・メール | 彼は母親に叱られた。
:::

ニュアンスは2つあります。

- **被害**：Il s'est fait voler …（盗まれた——迷惑・被害の含み）
- **依頼**：Elle s'est fait couper les cheveux.（切って**もらった**——自分で手配した）

日本語の「〜される（迷惑）」と「〜してもらう」の両方をこの形がカバーします。**間接目的語の残る受け身**（自転車**を**盗まれた、髪**を**切ってもらった）は普通の受動態では書けないので、se faire が唯一の言い方になります。

- × Son vélo lui a été volé.（文法的には可能だが硬い）
- ○ Il **s'est fait voler** son vélo.（自然）

なお、この構文の fait は**不変化**です（Elle s'est **fait** couper …。× faite）。faire + 不定詞の使役では過去分詞を一致させないという規則（第23章）がここにも及んでいます。

**se laisser + 不定詞**（〜されるがままになる）も同じ型です：Il s'est laissé convaincre.（彼は説得されてしまった）。
:::

## 8. よくある誤り

:::warn 日本語話者がやりがちな誤り
| × | ○ | 理由 |
|---|---|---|
| La porte a ouvert**e** par Marie. | La porte a été ouvert**e** par Marie. | été を落とさない（être + 過去分詞） |
| Il a été volé son vélo. | Il **s'est fait voler** son vélo. | 所有物が残る受け身は se faire（§7） |
| Cette maison est construite en 1900. | Cette maison **a été** construite en 1900. | 出来事の過去は複合過去の受動態（§6） |
| Je suis téléphoné par lui. | Il **m'a** téléphoné. | 間接目的語は受動態の主語になれない（§5） |
| Ce livre est vendu bien. | Ce livre **se vend** bien. | 性質の受け身は代名動詞（§4） |
:::

## 9. ニュースの受動態 — 報道文の読み方

:::note 受動態が主役になる場所
「フランス語は受動態を避ける」と述べましたが、**報道・公文書では受動態が標準**です。動作主より出来事を前に出す文体だからです。

:::ex ニュースの受動態
Le suspect a été arrêté hier soir. | ル・スュスペ・ア・エテ・アレテ | 容疑者は昨夜逮捕された。
Trois personnes ont été blessées dans l'accident. | トロワ・ペルソンヌ・オン・テテ・ブレセ | 事故で3人が負傷した。
Le musée sera fermé pour travaux. | ル・ミュゼ・スラ・フェルメ・プール・トラヴォ | 美術館は工事のため閉館されます。
La décision a été prise à l'unanimité. | ラ・デスィズィヨン・ア・エテ・プリーズ | 決定は全会一致でなされた。
:::

**a été + 過去分詞**（〜された）は報道の最頻出パターンです。目にする受動態の大半はこの形なので、「a été が来たら受動の複合過去」と反射的に読めるようにしてください。見出しではさらに縮んで、être が落ちた**過去分詞だけ**になります：Trois blessés dans un accident.（事故で3人負傷）。

**会話は on、報道は受動態**——同じ内容の使い分けを並べると：

- 会話：On a arrêté le suspect.（容疑者が捕まったって）
- 報道：Le suspect a été arrêté.（容疑者は逮捕された）
:::

## 10. 受動態と再帰・使役の見分けチャート

「être + 過去分詞」「se + 動詞」「faire + 不定詞」——**受け身に見える形**が3系統あります。読解時の判定を1枚にまとめます。

| 形 | 例 | 意味の系統 |
|---|---|---|
| être + 過去分詞（+ par） | La porte **a été ouverte** (par Marie). | 受動態：〜される |
| être + 過去分詞（par なし・状態） | La porte **est ouverte**. | 状態：〜されている・〜している |
| se + 動詞（3人称・モノ主語） | Ce vin **se boit** frais. | 受動的用法：〜されるものだ |
| se faire + 不定詞 | Il **s'est fait voler**. | 被害・依頼：〜される・〜してもらう |
| faire + 不定詞 | Je **fais réparer** ma voiture. | 使役：〜させる・〜してもらう |

**faire réparer**（修理してもらう）は使役構文ですが、日本語では「〜してもらう」なので受け身に感じられます。

:::ex 「してもらう」の3段活用
Je répare ma voiture. | ジュ・レパール・マ・ヴォワチュール | 自分で車を修理する。
Je fais réparer ma voiture. | ジュ・フェ・レパレ・マ・ヴォワチュール | 車を修理してもらう（出す）。
Je me suis fait réparer ma voiture. | ジュ・ム・スュイ・フェ・レパレ | （話し言葉で）車を直してもらった。
:::

**faire + 不定詞（〜してもらう・させる）は生活の基本構文**です：faire couper les cheveux（髪を切ってもらう）、faire livrer（配達してもらう）、faire suivre（転送してもらう）。「業者・他人にやってもらう」ことはすべて faire で言う、と覚えてください。

## 11. 練習してみる

:::ex 能動・受動・on・代名動詞
Le professeur corrige les copies. | ル・プロフェスール・コリージュ・レ・コピ | 先生が答案を採点する。（能動）
Les copies sont corrigées par le professeur. | レ・コピ・ソン・コリジェ | 答案は先生によって採点される。（受動）
On corrige les copies. | オン・コリージュ・レ・コピ | 答案を採点する。（on）
Les copies se corrigent facilement. | レ・コピ・ス・コリージュ・ファスィルマン | 答案は簡単に採点できる。（代名動詞）
:::


:::ai-gen 受動態、par と de、on と代名動詞による代用

## 11. 受動態を作れる動詞・作れない動詞

受動態にできるかどうかは、**動詞が直接目的語を取るか**で決まります。境界例を整理しておきます。

| 型 | 受動態 | 例 |
|---|---|---|
| 他動詞（直接目的語あり） | **できる** | On construit un pont. → Un pont **est construit**. |
| 自動詞 | できない | Il dort.（× Il est dormi） |
| 間接他動詞（à / de を取る） | **できない** | téléphoner à qn、obéir à qn |
| 代名動詞 | できない | se lever（すでに se が目的語） |
| avoir | できない | J'ai un livre.（× Un livre est eu） |

:::warn obéir だけは例外的に受動態を作れる
規則では「間接他動詞は受動態にできない」のですが、**obéir / désobéir / pardonner** は歴史的な事情から受動態が認められています。

[[Il veut être obéi.|イル・ヴ・エートル・ゾベイ|彼は従われたがっている。]]
[[Vous êtes tout pardonné.|ヴ・ゼット・トゥ・パルドネ|すっかり許されていますよ。]]

古フランス語では obéir が直接目的語を取っていた名残です。**この3語だけの例外**なので、他の à を取る動詞に広げないでください。
:::

:::note 受動態にしても情報が増えないなら使わない
フランス語が受動態を避ける理由をもう一段掘り下げると、**動作主を par で明示しないなら受動態にする意味が薄い**からです。

- On a volé ma voiture.（車を盗まれた）——誰がやったか不明。**on が自然**
- Ma voiture a été volée **par des inconnus**.（見知らぬ者たちに盗まれた）——動作主に焦点。受動態が生きる

つまり受動態は「**動作主を par で述べたい**」か「**主題を目的語側に移したい**」ときの構文です。それ以外は on か代名動詞で足ります。この判断基準を持っておくと、フランス語らしい文が書けるようになります。
:::

## 1. 作り方 — nous の現在形から

**半過去と同じ語幹**です（第13章「①直説法現在」の枝）。

1. **nous の現在形**を出す
2. **-ons を取って**、**-ant** を付ける

| 動詞 | nous の現在形 | 現在分詞 |
|---|---|---|
| chanter | nous chant**ons** | chant**ant** |
| finir | nous finiss**ons** | finiss**ant** |
| prendre | nous pren**ons** | pren**ant** |
| boire | nous buv**ons** | buv**ant** |
| faire | nous fais**ons** | fais**ant** |
| voir | nous voy**ons** | voy**ant** |

:::warn 例外は3つだけ
半過去の例外は être だけでしたが、現在分詞は3つあります。

| 動詞 | 現在分詞 |
|---|---|
| **être** | **étant** |
| **avoir** | **ayant** |
| **savoir** | **sachant** |

avoir と savoir は、半過去なら規則どおり（avais, savais）なのに、現在分詞だけ不規則です。**この3つだけ**なので個別に覚えます。
:::

## 2. 現在分詞 — 名詞を修飾する

**関係節（qui + 動詞）の代わり**として、名詞を修飾します。書き言葉でよく使われる、簡潔な表現です。

:::ex 現在分詞
une chanteuse chantant en français | ユヌ・シャントゥーズ・シャンタン・タン・フランセ | フランス語で歌っている女性歌手
= une chanteuse qui chante en français | | （関係節で書き換えたもの）
Les étudiants voulant participer doivent s'inscrire. | レ・ゼテュディアン・ヴラン・パルティスィペ | 参加を希望する学生は登録しなければならない。
J'ai vu un homme portant un chapeau noir. | ジェ・ヴュ・アン・ノム・ポルタン・タン・シャポー・ノワール | 黒い帽子をかぶった男を見た。
:::

:::warn 現在分詞は性数一致しない
**動詞としての性質を保っているので、変化しません。**

- ○ une chanteuse chant**ant**（× chantante）
- ○ des étudiants voul**ant**（× voulants）

これが次節の形容詞的分詞との決定的な違いです。
:::

:::deep 現在分詞の3つの用法

**（1）名詞の修飾（上の例）**

**（2）理由・原因を表す**

[[Étant malade, il est resté chez lui.\|エタン・マラード・イ・レ・レステ・シェ・リュイ\|病気だったので、彼は家にいた。]]
[[N'ayant pas de voiture, je prends le train.\|ネイヤン・パ・ドゥ・ヴォワテュール\|車がないので、電車に乗る。]]

**（3）同時に起きていること**

[[Il est entré, portant un gros sac.\|イ・レ・タントレ・ポルタン・タン・グロ・サック\|彼は大きな鞄を持って入ってきた。]]

**否定は ne + 現在分詞 + pas** で作ります（n'ayant pas）。第5章の原則どおりです。

なお、**複合形の現在分詞**もあります（ayant + 過去分詞）。「〜し終えて」という完了を表します。
[[Ayant fini son travail, il est parti.\|エイヤン・フィニ・ソン・トラヴァイユ・イ・レ・パルティ\|仕事を終えて、彼は出発した。]]
:::

## 3. 形容詞的分詞 — 一致する -ant

:::warn 同じ -ant でも、形容詞なら一致する
性質を表す形容詞として定着した -ant の語があります。**こちらは性数一致します。**

| 形容詞 | 意味 |
|---|---|
| [[intéressant\|アンテレサン]] | 面白い |
| [[amusant\|アミュザン]] | 愉快な |
| [[fatigant\|ファティガン]] | 疲れさせる |
| [[charmant\|シャルマン]] | 魅力的な |
| [[suivant\|スュイヴァン]] | 次の |
| [[souriant\|スリヤン]] | 微笑んでいる |

:::ex 一致する／しない
une histoire intéressante | ユ・ニストワール・アンテレサント | 面白い話（形容詞 → 一致する）
une femme chantant une chanson | ユヌ・ファム・シャンタン・チュヌ・シャンソン | 歌を歌っている女性（現在分詞 → 一致しない）
:::

**見分け方**

| | 現在分詞 | 形容詞的分詞 |
|---|---|---|
| 一致 | しない | **する** |
| 目的語・補語 | **取れる**（chantant **une chanson**） | 取れない |
| 副詞での修飾 | ne … pas で否定できる | très などで修飾できる |
| 意味 | **動作**（〜している） | **性質**（〜な） |

**目的語を取っていれば現在分詞、取っていなければ形容詞**——これが実務的な判定法です。

:::adv 綴りが変わる場合がある
一部の語は、現在分詞と形容詞で綴りが違います。

| 動詞 | 現在分詞 | 形容詞 |
|---|---|---|
| fatiguer | fatigu**ant** | fatig**ant**（u が落ちる） |
| provoquer | provoqu**ant** | provo**cant**（qu → c） |
| différer | différ**ant** | différ**ent**（-ant → -ent） |
| précéder | précéd**ant** | précéd**ent** |
| négliger | néglige**ant** | néglig**ent** |
| convaincre | convainqu**ant** | convain**cant** |

書き取りで問われる細かい点です。
:::
:::

## 4. ジェロンディフ — en + 現在分詞

**en を付けると、機能がまったく変わります。**

| | 修飾するもの |
|---|---|
| **現在分詞** | **名詞**（形容詞のように働く） |
| **ジェロンディフ** | **動詞**（副詞のように働く） |

:::ex 現在分詞とジェロンディフ
J'ai vu une femme chantant. | ジェ・ヴュ・ユヌ・ファム・シャンタン | 歌っている女性を見た。（女性が歌っている）
J'ai vu une femme en chantant. | ジェ・ヴュ・ユヌ・ファム・アン・シャンタン | 歌いながら女性を見た。（私が歌っている）
:::

**この2文は意味がまったく違います。** en があるかないかで、**誰が歌っているのかが変わります**。

:::warn ジェロンディフの主語は必ず主節の主語
これが決定的な規則です。

- **現在分詞** … 直前の名詞を修飾する（主語は文脈による）
- **ジェロンディフ** … **必ず主節の主語と同じ**

章のタイトルを見てみましょう。

[[Je regarde une chanteuse en pleurant.\|ジュ・ルガルド・ユヌ・シャントゥーズ・アン・プルラン\|私は泣きながら女性歌手を見つめる。]]

**泣いているのは「私」**です。歌手ではありません。歌手が泣いているなら、現在分詞を使います。

[[Je regarde une chanteuse pleurant.\|ジュ・ルガルド・ユヌ・シャントゥーズ・プルラン\|私は泣いている女性歌手を見つめる。]]

**en があるかないかで、泣いている人が入れ替わる** ——これがこの章の核心です。
:::

:::deep ジェロンディフの4つの用法

**（1）同時性 — 〜しながら**

[[Il mange en regardant la télé.\|イル・マンジュ・アン・ルガルダン・ラ・テレ\|彼はテレビを見ながら食べる。]]
[[Elle chante en travaillant.\|エル・シャン・タン・トラヴァイヤン\|彼女は働きながら歌う。]]

**（2）手段 — 〜することによって**

[[C'est en forgeant qu'on devient forgeron.\|セ・タン・フォルジャン・コン・ドゥヴィアン・フォルジュロン\|鍛冶をすることで鍛冶屋になる。]]（諺：習うより慣れよ）
[[On apprend en pratiquant.\|オ・ナプラン・タン・プラティカン\|実践することで学ぶ。]]

**（3）条件 — 〜すれば**

[[En travaillant, tu réussiras.\|アン・トラヴァイヤン・テュ・レユスィラ\|働けば成功するだろう。]]

**（4）対立 — 〜にもかかわらず**（tout を添える）

[[Tout en sachant la vérité, il n'a rien dit.\|トゥ・タン・サシャン・ラ・ヴェリテ\|真実を知っていながら、彼は何も言わなかった。]]

**tout en + 現在分詞**で、譲歩の意味がはっきりします。
:::

:::note 諺 C'est en forgeant qu'on devient forgeron
第22章の強調構文（c'est … que）と、この章のジェロンディフを組み合わせた形です。「鍛冶をすることによってこそ、人は鍛冶屋になる」——日本語の「習うより慣れよ」にあたる有名な諺で、**手段のジェロンディフ**の典型例としてよく引かれます。
:::

## 5. 3つを並べて確認する

:::note -ant の3つの顔
| | 形 | 修飾するもの | 一致 |
|---|---|---|---|
| **形容詞的分詞** | chantant | 名詞（性質） | **する** |
| **現在分詞** | chantant | 名詞（動作） | しない |
| **ジェロンディフ** | **en** chantant | 動詞（主語と同一） | しない |

:::ex 3つを並べる
une chanson amusante | ユヌ・シャンソン・アミュザント | 愉快な歌（形容詞 → 一致）
une femme chantant une chanson | ユヌ・ファム・シャンタン・チュヌ・シャンソン | 歌を歌っている女性（現在分詞 → 一致しない）
Elle marche en chantant. | エル・マルシュ・アン・シャンタン | 彼女は歌いながら歩く。（ジェロンディフ → 主語＝彼女）
:::

**判定の手順**
1. **en が付いている** → ジェロンディフ（主語は主節と同じ）
2. en なし、**目的語を取っている** → 現在分詞
3. en なし、目的語なし、**性数一致している** → 形容詞
:::

## 6. en の3つの用法（第25章の復習）

:::warn ジェロンディフの en は代名詞ではない
第25章で3つの en を区別しました。ここで確認します。

| | 例 | 位置 |
|---|---|---|
| **代名詞の en** | [[J'en veux.\|ジャン・ヴ\|それが欲しい]] | 動詞の前 |
| **前置詞の en** | [[en France\|アン・フランス\|フランスで]] | 名詞の前 |
| **ジェロンディフの en** | [[en chantant\|アン・シャンタン\|歌いながら]] | **-ant の前** |

**-ant で終わる語の前にあれば、ジェロンディフの en** です。
:::

## 7. 分詞構文と英語の比較

:::adv 英語の -ing との違い
英語の -ing 形は、現在分詞・動名詞・進行形の3つを兼ねています。フランス語では役割が分かれます。

| 英語 | フランス語 |
|---|---|
| I am **singing**.（進行形） | Je chante.（**単純な現在形**、第8章） |
| a woman **singing**（現在分詞） | une femme **chantant** |
| **while singing**（〜しながら） | **en chantant**（ジェロンディフ） |
| **Singing** is fun.（動名詞） | **Chanter** est amusant.（**不定詞**） |

**とくに注意すべき2点**
1. **進行形はない** … 英語の be + -ing にあたる活用はなく、単純な現在形で表す（強調したいときだけ être en train de）
2. **動名詞は不定詞** … 「歌うこと」は chantant ではなく **chanter**（不定詞）

× Chantant est amusant. は誤りです。○ **Chanter est amusant.**

英語話者が最も間違えるのがこの2点です。
:::

## 8. tout en + ジェロンディフ、否定、そして使えない場面

:::deep ジェロンディフの細部
**（1）tout en + ジェロンディフ — 対立・逆説の同時**

[[Il travaille tout en écoutant de la musique.|イル・トラヴァイユ・トゥ・タン・ネクタン・ドゥ・ラ・ミュズィック|彼は音楽を聞きながら働く。]]
[[Tout en souriant, elle était furieuse.|トゥ・タン・スリヤン・エ・レテ・フュリユーズ|微笑みながらも、彼女は激怒していた。]]

tout を付けると同時性が強調され、しばしば「〜しながら**も**」という**逆説**の含みが出ます。

**（2）ジェロンディフの否定はまれ — sans + 不定詞を使う**

「〜せずに」は、ジェロンディフの否定（en ne faisant pas）ではなく **sans + 不定詞**で言うのが自然です。

- ○ Il est parti **sans dire** au revoir.（さよならも言わずに出て行った）
- △ Il est parti en ne disant pas au revoir.（不自然）

**（3）主語の一致 — ぶら下がり分詞は誤り**

ジェロンディフの意味上の主語は**主節の主語**です。一致しないと誤文になります。

- × **En sortant** du métro, la pluie s'est mise à tomber.（地下鉄を出たのは雨ではない）
- ○ **En sortant** du métro, **j'ai** reçu la pluie. → 自然には：Quand je suis sorti du métro, il s'est mis à pleuvoir.

英語の懸垂分詞（dangling participle）と同じ誤りで、フランス語でも規範違反です。

**（4）「〜すれば」の条件用法**

[[En prenant le train de 8 heures, tu arriveras à temps.|アン・プルナン・ル・トラン・ドゥ・ユイ・トゥール|8時の電車に乗れば間に合うよ。]]

si 節の代わりになる圧縮した条件です（第30章）。**C'est en forgeant qu'on devient forgeron.**（鍛冶をすることで鍛冶屋になる＝習うより慣れろ）という諺は、この用法の強調構文（第22章）です。
:::

## 9. -ant の語彙の広がり

現在分詞は、形容詞・名詞として辞書に定着した語を大量に生んでいます。**見出し語として覚える価値のあるもの**を整理します。

**形容詞化した -ant**（性数一致する）

| 語 | 意味 | 元の動詞 |
|---|---|---|
| intéressant(e) | 面白い | intéresser |
| amusant(e) | 愉快な | amuser |
| étonnant(e) | 驚くべき | étonner |
| charmant(e) | 魅力的な | charmer |
| vivant(e) | 生きている・活気ある | vivre |
| suivant(e) | 次の | suivre |
| courant(e) | 日常の・流通している | courir |
| brillant(e) | 輝かしい | briller |

**名詞化した -ant**

| 語 | 意味 |
|---|---|
| un étudiant / une étudiante | 学生（étudier する人） |
| un débutant / une débutante | 初心者 |
| un habitant / une habitante | 住民 |
| un passant / une passante | 通行人 |
| un gagnant / une gagnante | 勝者 |

:::ex -ant の語彙
C'est un film très étonnant. | セ・タン・フィルム・トレ・ゼトナン | とても驚くべき映画だ。
La semaine suivante, il est revenu. | ラ・スメーヌ・スュイヴァント・イ・レ・ルヴニュ | その翌週、彼は戻ってきた。
C'est de l'eau courante. | セ・ドゥ・ロ・クラント | 水道水です。
Les habitants du quartier se connaissent. | レ・ザビタン・デュ・カルティエ | この界隈の住民は顔見知りだ。
:::

**suivant**（次の）と **courant**（日常の）は前置詞・熟語にも進出しています：la page suivante（次のページ）、le mois courant（今月）、C'est courant.（よくあることだ）。動詞1つを覚えると -ant 語彙が芋づるで手に入る——第1群動詞の多さ（第8章）が、ここでも効いています。

## 11. 過去分詞の分詞構文 — 書き言葉のもう一つの圧縮

現在分詞（-ant）が能動の圧縮なら、**過去分詞を単独で使う分詞構文**は受動・完了の圧縮です。書き言葉で頻出します。

:::ex 過去分詞の分詞構文
Fatiguée, elle s'est couchée tôt. | ファティゲ・エ・ル・セ・クシェ・ト | 疲れていたので、彼女は早く寝た。
Écrite en 1850, cette lettre est précieuse. | エクリット・アン・ミル・ユイ・サン・サンカント | 1850年に書かれたこの手紙は貴重だ。
Une fois arrivés, nous avons déjeuné. | ユヌ・フォワ・ザリヴェ・ヌー・ザヴォン・デジュネ | 着いてすぐ、私たちは昼食をとった。
Assis au premier rang, il voyait tout. | アスィ・オ・プルミエ・ラン | 最前列に座っていたので、彼にはすべて見えた。
:::

**主語に性数一致します**（Fatigué**e**、arrivé**s**）。意味上の主語は主節の主語と一致しなければならず、この点は現在分詞と同じです（§8の「ぶら下がり分詞」）。

**複合形の分詞構文**もあります。

- **Ayant fini** son travail, il est sorti.（仕事を終えて、彼は出かけた）
- **Étant arrivé** en retard, il n'a pas pu entrer.（遅れて着いたので、入れなかった）

ayant / étant + 過去分詞で「〜し終えて／〜してしまったので」を表します。**étant はしばしば省略**され、Arrivé en retard, il n'a pas pu entrer. となります——上の Une fois arrivés と同じ形です。

:::note 分詞構文の3段階
| 形 | 意味 | 文体 |
|---|---|---|
| **en + 現在分詞**（ジェロンディフ） | 同時・手段・条件 | 話し言葉でも可 |
| **現在分詞のみ** | 理由・付帯状況 | 書き言葉 |
| **過去分詞のみ** | 完了・受動の理由 | 書き言葉 |

**ジェロンディフだけが会話で使われ、残る2つは書き言葉専用**——これが実用上の切り分けです。読解では3つとも頻出するので、-ant が単独で出たら「理由か付帯状況」、過去分詞が単独で出たら「完了か受動の理由」と反応してください。
:::

  body: `
{lead}残る2章（条件法・接続法）に入る前に、**「法」（le mode）とは何か**を整理しておきます。

ここまで学んできた時制は、すべて**直説法**（l'indicatif）に属していました。現在・複合過去・半過去・単純未来・大過去・前未来・単純過去——本書で扱う12時制のうち7つです。

残るのが**条件法**（le conditionnel）と**接続法**（le subjonctif）、そして第16章で扱った**命令法**（l'impératif）です。

**時制が「いつ」を表すのに対し、法は「話し手がその内容をどう扱っているか」を表します。** この違いを掴んでおくと、第30章・第31章がずっと理解しやすくなります。

この章では、法の定義から始めて、フランス語の動詞体系を**法 × 時制 × 相（アスペクト）**という3つの軸で捉え直します。個々の時制を暗記してきた知識が、ここで1枚の地図になります。

## 1. 法とは何か

:::note 時制と法の違い
| | 表すもの | 例 |
|---|---|---|
| **時制**（le temps） | **いつ**の話か | 現在・過去・未来 |
| **法**（le mode） | 話し手がその内容を**どう扱っているか** | 事実／仮定／願望 |

同じ「彼が来る」という内容でも、話し手の扱い方で法が変わります。

:::ex 同じ内容を3つの法で
Il vient. | イル・ヴィアン | 彼は来る。（直説法＝事実として述べる）
Il viendrait. | イル・ヴィアンドレ | 彼は来るだろうに。（条件法＝仮定の話として述べる）
Je veux qu'il vienne. | ジュ・ヴ・キル・ヴィエンヌ | 彼に来てほしい。（接続法＝願望の対象として述べる）
Viens ! | ヴィヤン | 来い！（命令法＝相手に働きかける）
:::

**内容は同じで、話し手の態度だけが違います。** これが法です。
:::

:::deep 「法」という用語の由来
フランス語 **mode** はラテン語 **modus**（やり方、様式）から来ています。英語の *mood*（法）は、同じラテン語由来でありながら *mood*（気分）と混ざって定着した語で、実は語源が違います（気分の mood はゲルマン語系）。偶然の同音衝突です。

「話し手がその内容をどういうやり方で提示するか」——modus の原義がそのまま文法用語になっています。日本語の「法」は明治期の翻訳語で、「言い方のきまり」という含意を持たせたものです。

言語学では **modalité（モダリティ、叙法性）** という広い概念があり、法（mode）はそれを**動詞の形で表す手段**にあたります。フランス語には他にも叙法性の表し方があります。

| 手段 | 例 |
|---|---|
| **法**（動詞の形） | Il viendrait.（来るだろうに） |
| **半助動詞** | Il **doit** venir.（来るはずだ）／ Il **peut** venir.（来るかもしれない） |
| **副詞** | Il vient **peut-être**.（たぶん来る） |
| **非人称構文** | **Il est possible qu'**il vienne. |

つまり**法は叙法性の一部**であって全部ではありません。devoir と pouvoir が「義務」だけでなく「推量」も表すのは（第30章）、この2語が半助動詞として法の役割を肩代わりしているからです。
:::

## 2. いくつの法があるのか

実は、**フランス語に法がいくつあるかは、文法書によって違います**。

| 立場 | 法の数 | 内訳 |
|---|---|---|
| **伝統文法**（学校文法） | **6つ** | 直説法・条件法・接続法・命令法 ＋ **不定法・分詞法** |
| **現代の主流** | **4つ** | 直説法・条件法・接続法・命令法 |
| **一部の言語学** | **3つ** | 直説法・接続法・命令法（条件法は直説法の一時制） |

:::deep なぜ数が揺れるのか
**（1）不定法・分詞法を法に数えるか**

伝統文法は、**不定詞**（parler）と**分詞**（parlant / parlé）も法に数え、**modes impersonnels（非人称の法）** と呼びます。人称変化しないという点で、他の4つ（modes personnels）と区別されます。

数える理由は、これらも「動詞の形の体系」の一部だからです。数えない理由は、**話し手の態度を表していない**——法の定義に合わないからです。現代の文法書は後者を取ることが多くなっています。

本書も**4つの法**という立場を取りますが、不定詞（第11章・第29章）と分詞（第29章）が動詞体系の一部であることは変わりません。

**（2）条件法は法か、時制か**

より本質的な論争がこちらです。条件法は、

- **形の上では** 未来語幹 + 半過去の語尾 ＝ 直説法の部品でできている
- **働きの上では** 「過去における未来」（Il a dit qu'il **viendrait**.）という**純粋に時制的な用法**を持つ

このため、20世紀後半以降の言語学では **条件法を直説法の一時制（futur du passé、過去未来）とみなす**立場が有力になりました。フランスの学校文法も1970年代以降、条件法を直説法の中に置く教科書が増えています。

一方で、**Si j'étais riche, je voyagerais.** のように時間とまったく関係のない仮定を表す用法があるので、法として扱う立場も根強く残っています。

**本書は伝統に従って条件法を独立の法として扱います**が、「過去における未来」の用法（第27.6章）を見たとき、その形が直説法の延長であることを思い出してください。**形と機能がずれているのが条件法の本質**です。
:::

## 3. 4つの法

| 法 | 表すもの | 時制の数 | 主節に立てるか |
|---|---|---|---|
| **直説法** l'indicatif | **事実**として述べる | 8（うち本書で7） | 立てる |
| **条件法** le conditionnel | **仮定・推測・語調緩和** | 2（現在・過去） | 立てる |
| **接続法** le subjonctif | **主観・不確実・願望** | 4（うち現代語で2） | ほぼ**立てない** |
| **命令法** l'impératif | **命令・依頼** | 2（現在・過去） | 立てる（主語なし） |

:::deep 各法の位置づけ

### 直説法（l'indicatif）— 事実の法

**「そうである／そうだった／そうなるだろう」と、事実として提示する法**です。ここまでの章で扱ってきた時制のほとんどがこれに属します。

- 直説法現在（第8章）
- 複合過去（第20章）／ 大過去（第27.5章）
- 半過去（第27章）
- 単純未来（第24章）／ 前未来（第24章）
- 単純過去（第20.5章）／ 前過去（第27.5章）

**フランス語の文の大半は直説法**です。他の3つの法は、特定の条件下でだけ現れます。

「事実」といっても、**話し手が事実として提示している**という意味であって、客観的に真であることではありません。嘘をつくときも直説法を使います。**法は真偽ではなく、提示のしかたを表します。**

### 条件法（le conditionnel）— 仮定と距離の法

**「もし〜なら、こうなるだろうに」と、現実から距離を置いて述べる法**です。

第13章で見たとおり、**未来語幹 ＋ 半過去の語尾**でできています。この成り立ちが機能を説明します。

- **未来**の要素 … これから起きること
- **過去**の要素 … 現在から切り離されていること

合わせて「**現在から切り離された未来**」＝仮定になります。第27.6章で見た「過去における未来」も同じ構造です。

条件法の3つの用法（第30章で扱います）
1. **仮定の帰結**：Si j'avais de l'argent, je voyagerais.
2. **語調緩和**：Je voudrais un café.（コーヒーをいただきたいのですが）
3. **伝聞・推測**：Il serait malade.（彼は病気らしい）

### 接続法（le subjonctif）— 主観の法

**事実として述べるのではなく、「話し手の頭の中にある事柄」として述べる法**です。

決定的な特徴：**接続法はほぼ従属節（que 節）の中でしか使われません**。

[[Je veux qu'il **vienne**.|ジュ・ヴ・キル・ヴィエンヌ|彼に来てほしい。]]

「彼が来る」ことは事実ではなく、**私の願望の対象**にすぎません。だから直説法（vient）ではなく接続法（vienne）になります。

接続法を要求するもの（第31章・第31.5章で扱います）
- 願望・意志（vouloir que, désirer que）
- 感情（être content que, avoir peur que）
- 疑い・否定（douter que, ne pas croire que）
- 必要（il faut que）
- 特定の接続詞（bien que, pour que, avant que, à moins que）

### 命令法（l'impératif）— 働きかけの法

**相手に行為を促す法**です。第16章で扱いました。**主語を置かない唯一の法**で、tu / nous / vous の3形しかありません。

なぜ3形しかないのか。命令とは**目の前の相手への働きかけ**なので、je（自分）や il（その場にいない第三者）に命令することはできないからです。nous があるのは「一緒に〜しよう」という勧誘に使うためです。

3人称に命令したいときは、**接続法を使います**。

[[Qu'il **vienne** !|キル・ヴィエンヌ|彼を来させろ！]]

命令法がカバーできない人称を接続法が引き受ける——法どうしが補い合っている珍しい例です。
:::

## 4. 直説法と接続法の対立を見る

:::warn 同じ動詞でも、主節しだいで法が変わる
これが接続法を理解する鍵です。

:::ex 主節が法を決める
Je pense qu'il vient. | ジュ・パンス・キル・ヴィアン | 彼は来ると思う。（直説法）
Je ne pense pas qu'il vienne. | ジュ・ヌ・パンス・パ・キル・ヴィエンヌ | 彼が来るとは思わない。（接続法）
Je sais qu'il est malade. | ジュ・セ・キ・レ・マラード | 彼が病気だと知っている。（直説法）
Je doute qu'il soit malade. | ジュ・ドゥット・キル・ソワ・マラード | 彼が病気だとは思えない。（接続法）
:::

**penser（思う）は肯定なら直説法、否定なら接続法**を取ります。肯定では話し手が事実として扱っているのに対し、否定では事実性が揺らぐからです。

**savoir（知っている）は常に直説法**（知っていることは事実）、**douter（疑う）は常に接続法**（疑いは事実ではない）。

つまり**主節の動詞が「その内容を事実として扱っているか」で従属節の法が決まります**。
:::

### 法の選択が意味を変える例

主節が法を決めるのではなく、**法の選択そのものが意味を作る**場合もあります。

| 直説法 | 接続法 |
|---|---|
| Je cherche un homme **qui sait** le chinois.（中国語ができる人を探している＝その人は実在する） | Je cherche un homme **qui sache** le chinois.（中国語ができる人がいれば探したい＝実在するか分からない） |
| Il a parlé fort **de sorte que** tout le monde **a entendu**.（大声で話した結果みんなに聞こえた） | Il a parlé fort **de sorte que** tout le monde **entende**.（みんなに聞こえるように話した） |

前者は**関係節の法**による対立です。先行詞が実在すると話し手が考えていれば直説法、まだ存在しないか未確定なら接続法。**話し手の頭の中だけにある存在**を接続法が示しています。

後者は第31.5章で扱う **de sorte que** の二重性です。**接続法なら目的、直説法なら結果**——法が意味を決めています。

## 5. 相（アスペクト）— 3つ目の軸

法と時制のほかに、フランス語の動詞にはもう1つの軸があります。**相（l'aspect）**です。

> **時制が「いつ」、法が「どう扱うか」、相が「その出来事をどの角度から見るか」を表します。**

:::deep 半過去と複合過去の対立は、時制ではなく相の対立
第27章で「半過去は継続・習慣、複合過去は出来事」と学びました。しかし**どちらも過去の出来事を指します**。時間の位置は同じです。違うのは**見方**です。

| 相 | 見方 | 時制 |
|---|---|---|
| **未完了相**（imperfectif） | 出来事の**内側から**見る。始まりと終わりを問題にしない | **半過去** |
| **完了相**（perfectif） | 出来事を**外側から**ひとかたまりとして見る | **複合過去・単純過去** |

Il **pleuvait** quand je suis sorti.（出かけたとき雨が降っていた）——雨の始まりも終わりも視野に入っていません。出来事の**途中**にいます。

Il **a plu** hier.（昨日雨が降った）——降り始めから降り終わりまでを1つの塊として外から眺めています。

**同じ出来事を、どちらの相でも語れます。**

- Hier, il **a plu** toute la journée.（昨日は一日じゅう雨が降った＝1つの出来事として）
- Hier, il **pleuvait** quand je suis parti.（出かけたとき雨が降っていた＝背景として）

日本語には相を表す文法形式（〜ている、〜てしまう）がありますが、時制と独立していません。英語も進行形（was raining）と単純形（rained）で似た対立を持ちます。**フランス語の半過去／複合過去は、英語の過去進行形／単純過去に近い**——この対応を意識すると、使い分けの感覚がつかみやすくなります。

さらに複合時制は**完了相**を担います。

| 単純時制（未完了） | 複合時制（完了） |
|---|---|
| 現在 je chante | 複合過去 j'ai chanté |
| 半過去 je chantais | 大過去 j'avais chanté |
| 単純未来 je chanterai | 前未来 j'aurai chanté |
| 条件法現在 je chanterais | 条件法過去 j'aurais chanté |
| 接続法現在 que je chante | 接続法過去 que j'aie chanté |

**左右の対は、時制ではなく相の対立です。** 前未来は「未来の過去」ではなく「未来の時点から見て完了している」——だから futur **antérieur**（先行未来）と呼ばれます。

第13章で「複合時制は助動詞の時制を差し替えるだけ」と述べたのは、**助動詞が時制と法を担い、過去分詞が完了相を担う**という分業があるからです。この見方を得ると、5つの複合時制が1つの原理から出ていることが完全に理解できます。
:::

## 7. 絶対時制と相対時制

もう1つ、時制を分ける軸があります。**何を基準にして「いつ」を測るか**です。

| 種類 | 基準 | 時制 |
|---|---|---|
| **絶対時制** | **発話の時点**（いま） | 現在・複合過去・単純未来 |
| **相対時制** | **文中の別の時点** | 大過去・前未来・条件法（過去未来） |

:::ex 絶対時制と相対時制
Il est parti hier. | イ・レ・パルティ・イエール | 彼は昨日出発した。（いまを基準）
Quand je suis arrivé, il était déjà parti. | カン・ジュ・スュイ・ザリヴェ・イ・レテ・デジャ・パルティ | 私が着いたとき、彼はもう出発していた。（「着いた時点」を基準）
Il a dit qu'il viendrait. | イ・ラ・ディ・キル・ヴィヤンドレ | 彼は来ると言った。（「言った時点」を基準とする未来）
:::

**大過去・前未来・条件法（過去未来）は、必ず文中の別の時点を必要とします**。単独では使えず、基準となる時点が明示されるか文脈から補われます。

これが第27.6章の「時制の一致」の正体です。主節の時点が動くと、従属節の時制はそれに合わせて動く——相対時制だからです。

## 8. 同じ動詞を全法で見る

:::conj être présent,imparfait,futur,conditionnel,subjonctif,imperatif

:::conj avoir présent,conditionnel,subjonctif

être と avoir は、すべての複合時制の助動詞になります。**この2語の全法・全時制を押さえておけば、他のどの動詞の複合時制も作れます。**

:::conj faire présent,conditionnel,subjonctif

:::conj aller présent,conditionnel,subjonctif

faire, aller, pouvoir, vouloir, devoir, savoir は、**条件法と接続法で不規則が集中する動詞**です。この6語を押さえると、残る2章がぐっと楽になります。

## 9. 学習上の優先順位

:::adv どこまで必要か
実用面での優先順位を示しておきます。

**必須（会話・読解の両方で頻出）**
- 直説法：現在・複合過去・半過去・単純未来
- 条件法現在（**Je voudrais** は日常の必須表現）
- 接続法現在（**il faut que** の後で必ず使う）
- 命令法

**次に必要（読解で頻出）**
- 大過去・前未来・条件法過去・接続法過去

**読めれば足りる（書き言葉専用）**
- 単純過去・前過去（第20.5章・第27.5章）
- 接続法半過去・大過去（第31章）

**条件法現在と接続法現在は、会話でも避けて通れません。** [[Je voudrais un café.|ジュ・ヴドレ・アン・カフェ|コーヒーをお願いします。]] を条件法なしに丁寧に言うことはできず、[[Il faut que je parte.|イル・フォ・ク・ジュ・パルト|私は出発しなければならない。]] を接続法なしに言うこともできません。

残る2章は、この2つを扱います。
:::

## 10. 同じ内容を法で言い分ける

法の違いは、実際の文でどう働くのか。**同じ「彼が来る」という内容を、法を変えながら並べてみます。**

:::ex 法を変えると何が変わるか
Il vient demain. | イル・ヴィヤン・ドゥマン | 彼は明日来る。（直説法現在＝確定した予定）
Il viendra demain. | イル・ヴィヤンドラ・ドゥマン | 彼は明日来るだろう。（直説法未来＝予測）
Il viendrait demain. | イル・ヴィヤンドレ・ドゥマン | 彼は明日来るらしい。（条件法＝伝聞・推測）
Il viendrait si tu l'invitais. | イル・ヴィヤンドレ・スィ・チュ・ランヴィテ | 君が誘えば彼は来るだろうに。（条件法＝仮定の帰結）
Je veux qu'il vienne demain. | ジュ・ヴ・キル・ヴィエンヌ・ドゥマン | 明日彼に来てほしい。（接続法＝願望の対象）
Il faut qu'il vienne demain. | イル・フォ・キル・ヴィエンヌ・ドゥマン | 明日彼が来なければならない。（接続法＝必要）
Qu'il vienne demain ! | キル・ヴィエンヌ・ドゥマン | 明日来させろ！（接続法＝3人称への命令）
:::

**同じ動詞 venir が7通りの形をとり、そのたびに話し手の立場が変わっています。** 語彙は同じで、変わっているのは法と時制だけです。

:::tip 法を選ぶときの自問
書くときに迷ったら、次の順で自問してください。

1. **これを事実として述べるのか** → はい：**直説法**
2. **仮定・推測・遠慮の話か** → はい：**条件法**
3. **主節の動詞や接続詞が que 節を要求しているか** → はい：その主節が接続法を取るかを確認（第31.5章の表）
4. **目の前の相手に行為を促すのか** → はい：**命令法**

大半の文は1で終わります。**迷ったときは直説法が既定値**——これは事実として、フランス語の文の圧倒的多数が直説法だからです。

逆に言えば、接続法を使うべき場面は**主節や接続詞が決めてくれます**。自分で「これは主観だから接続法かな」と考える必要はほとんどありません。**vouloir que と書いた瞬間に接続法が確定する**——そういう仕組みになっています。第31.5章の表は、そのための早見表です。
:::

## 1. 条件法現在の作り方

**未来語幹に、半過去の語尾を付けます。**

| 人称 | 語尾（＝半過去と同じ） |
|---|---|
| je | **-ais** |

:::warn je chanterai と je chanterais の1文字差
第24章で触れた問題です。

- [[je chanterai\|ジュ・シャントレ\|私は歌うだろう]]（単純未来）
- [[je chanterais\|ジュ・シャントレ\|私は歌うだろうに]]（条件法現在）

**書けば s 1文字の差**、発音も伝統的には [e] と [ɛ] で区別されますが、**現代の話し言葉ではほぼ同音**です。

判断の手がかり：
- **si 節がある**、または**丁寧な依頼**の文脈 → 条件法
- 単なる予定・予測 → 単純未来

書き取りで最も間違えやすい対立です。
:::

## 2. 条件法過去

**助動詞の条件法現在 ＋ 過去分詞**。第13章の複合時制の5本目です。

:::conj chanter conditionnel,conditionnelPasse

意味は「**〜だっただろうに**」——実際には起こらなかったことを表します。

:::ex 条件法過去
J'aurais aimé venir. | ジョレ・ゼメ・ヴニール | 来たかったのですが（実際には来られなかった）。
Tu aurais dû me le dire. | テュ・オレ・デュ・ム・ル・ディール | 私に言うべきだったのに。
Elle serait partie plus tôt. | エル・スレ・パルティ・プリュ・ト | 彼女はもっと早く出発しただろうに。
:::

**助動詞の選択と一致の規則は複合過去と同じ**です（第20章）。

## 3. si 構文 — 3つのパターン

**条件法の中心的な用法です。** si 節の時制と主節の時制が、決まった組み合わせになります。

:::deep si 構文の完全表

| パターン | si 節 | 主節 | 意味 |
|---|---|---|---|
| **① 実現可能** | **直説法現在** | **単純未来** | もし〜なら、〜だろう |
| **② 現在の反実** | **半過去** | **条件法現在** | もし〜なら、〜なのに |
| **③ 過去の反実** | **大過去** | **条件法過去** | もし〜だったら、〜だったのに |

:::ex 3つのパターン
Si j'ai le temps, je viendrai. | スィ・ジェ・ル・タン・ジュ・ヴィアンドレ | 時間があれば、行きます。（①実現しうる）
Si j'avais le temps, je viendrais. | スィ・ジャヴェ・ル・タン・ジュ・ヴィアンドレ | 時間があれば、行くのに。（②今は時間がない）
Si j'avais eu le temps, je serais venu. | スィ・ジャヴェ・ウ・ル・タン・ジュ・スレ・ヴニュ | 時間があったら、行ったのに。（③あのとき時間がなかった）
:::

**①は実現の可能性がある**、**②は現在の事実に反する**、**③は過去の事実に反する** ——この3段階です。

### si 節には条件法を置かない

:::warn si の後に条件法・未来形は来ない
**最も多い誤りです。**

- × Si j'aurais le temps …
- ○ Si j'**avais** le temps, je **viendrais**.

**条件法・未来形が現れるのは主節のほう**で、si 節には直説法（現在・半過去・大過去）しか置きません。

英語も同じです：If I **had** time, I **would** come.（× If I would have time）

フランスの子どもも間違えるため、[[Les « si » n'aiment pas les « rais ».\|レ・スィ・ネーム・パ・レ・レ\|si は rais を好まない]] という語呂で教えられます。**si の後ろに -rais は来ない**、という意味です。

なお、**間接疑問の si（〜かどうか）は別**です（第24章・第27.6章）。
[[Je ne sais pas s'il viendrait.\|ジュ・ヌ・セ・パ・スィル・ヴィアンドレ\|彼が来るかどうか分からなかった。]]
:::

:::adv 混合型もある
③と②を組み合わせて、「あのとき〜だったら、今〜なのに」を表せます。

[[Si j'avais étudié, je parlerais français maintenant.\|スィ・ジャヴェ・ゼテュディエ・ジュ・パルルレ・フランセ・マントゥナン\|勉強していたら、今フランス語を話せるのに。]]

si 節は大過去（過去の反実）、主節は条件法現在（現在の帰結）です。
:::

### ①のバリエーション — 主節は未来形とは限らない

パターン①（si + 現在）の主節には、未来形のほかに**現在形・命令形**も置けます。

:::ex si + 現在の主節いろいろ
Si tu veux, on part maintenant. | スィ・チュ・ヴ・オン・パール・マントゥナン | よければ、今出発しよう。（主節＝現在）
Si tu as faim, mange quelque chose. | スィ・チュ・ア・ファン・マンジュ・ケルク・ショーズ | お腹が空いてるなら、何か食べなさい。（主節＝命令）
S'il pleut, on reste à la maison. | スィル・プルー・オン・レスト・ア・ラ・メゾン | 雨なら家にいるよ。（主節＝現在）
:::

**Si tu veux**（よければ）と **si possible**（可能なら）は、そのまま会話の潤滑油として使える定型です。

### si を使わない条件の言い方

ネイティブは si 節ばかり使うわけではありません。**句や副詞で条件を圧縮する**言い方が同じくらい使われます。

| 手段 | 例 | 意味 |
|---|---|---|
| **sinon** | Dépêche-toi, **sinon** tu vas rater le train. | さもないと |
| **avec + 名詞** | **Avec** un peu de chance, ça marchera. | 〜があれば |
| **sans + 名詞** | **Sans** toi, je n'y serais pas arrivé. | 〜がなければ |
| **ジェロンディフ** | **En travaillant** plus, tu réussirais. | 〜すれば（第29章） |
| **au cas où + 条件法** | Prends un parapluie, **au cas où** il pleuvrait. | 〜の場合に備えて |
| **à ta place** | **À ta place**, je refuserais. | 君の立場なら |

:::warn au cas où は条件法を取る
si は直説法しか取りませんが、**au cas où（〜の場合に備えて）の後ろは条件法**です。

[[Prends tes clés, au cas où je ne serais pas là.|プラン・テ・クレ・オ・カ・ウ・ジュ・ヌ・スレ・パ・ラ|私がいない場合に備えて、鍵を持って行きなさい。]]

会話では **au cas où** だけで文を終える言い方も頻繁に聞かれます：Prends un parapluie, au cas où.（念のため傘持って行きなよ）。「念のため」という日本語にちょうど対応します。
:::
:::

## 4. 条件法の3つの用法

:::deep si 構文以外の条件法

### （1）語調緩和 — 最も使用頻度が高い

**直説法をそのまま使うと直接的すぎるので、条件法にして和らげます。**

:::ex 語調緩和
Je voudrais un café, s'il vous plaît. | ジュ・ヴドレ・アン・カフェ | コーヒーをお願いします。
Pourriez-vous m'aider ? | プリエ・ヴー・メデ | 手伝っていただけますか？
J'aimerais vous poser une question. | ジェムレ・ヴー・ポゼ・ユヌ・ケスティオン | ひとつ質問したいのですが。
Vous devriez vous reposer. | ヴー・ドゥヴリエ・ヴー・ルポゼ | 休まれたほうがいいですよ。
Tu ne devrais pas fumer. | テュ・ヌ・ドゥヴレ・パ・フュメ | タバコは吸わないほうがいい。
:::

**直説法との対比**

| 直説法 | 条件法 |
|---|---|
| [[Je veux un café.\|ジュ・ヴ・アン・カフェ]] コーヒーが欲しい（ぶっきらぼう） | [[Je voudrais un café.\|ジュ・ヴドレ・アン・カフェ]] コーヒーをお願いします（丁寧） |
| [[Pouvez-vous …\|プヴェ・ヴー]] できますか | [[Pourriez-vous …\|プリエ・ヴー]] していただけますか（丁寧） |
| [[Vous devez …\|ヴー・ドゥヴェ]] 〜すべきだ（義務） | [[Vous devriez …\|ヴー・ドゥヴリエ]] 〜されたほうがいい（助言） |

**Je voudrais は、カフェ・店・窓口で必ず使う表現**です。Je veux では子どもっぽく、場合によっては失礼に響きます。

なぜ条件法が丁寧になるのか——**「もし可能でしたら」という仮定が隠れている**と考えると分かりやすくなります。断定を避けることで、相手に断る余地を残しているのです。第27章で半過去にも同じ用法があったのと同じ原理です。

### （2）伝聞・未確認情報

**報道で多用されます。** 「〜らしい」「〜とみられる」。

:::ex 伝聞の条件法
Il y aurait dix blessés. | イ・リ・オレ・ディ・ブレセ | 負傷者は10人とみられる。
Le président serait malade. | ル・プレズィダン・スレ・マラード | 大統領は病気らしい。
L'accident aurait fait trois morts. | ラクスィダン・オレ・フェ・トロワ・モール | 事故で3人が死亡した模様だ。
:::

**裏が取れていない情報**であることを、条件法で示します。フランスの新聞・ニュースを読むときに必ず出会う用法です。日本語の「〜という」「〜もよう」にあたります。

### （3）後悔と非難 — 条件法過去の独壇場

**devoir / pouvoir / vouloir の条件法過去**は、後悔・非難の決まった言い方を作ります。日常会話での使用頻度が非常に高い形です。

| 形 | 意味 | 響き |
|---|---|---|
| **j'aurais dû** + 不定詞 | 〜すべきだった | 後悔 |
| **tu aurais dû** + 不定詞 | 〜すべきだったのに | 非難 |
| **j'aurais pu** + 不定詞 | 〜できたのに | 後悔・悔しさ |
| **tu aurais pu** + 不定詞 | 〜してくれてもよかったのに | 軽い非難 |
| **j'aurais aimé / voulu** + 不定詞 | 〜したかった（が叶わなかった） | 残念 |

:::ex 後悔と非難
J'aurais dû t'écouter. | ジョレ・デュ・テクテ | 君の言うことを聞くべきだった。
Tu aurais dû me le dire ! | チュ・オレ・デュ・ム・ル・ディール | 言ってくれればよかったのに！
Tu aurais pu me prévenir. | チュ・オレ・ピュ・ム・プレヴニール | 前もって知らせてくれてもよかったのに。
J'aurais aimé être là. | ジョレ・ゼメ・エートル・ラ | その場にいたかったな。
On aurait dit un rêve. | オ・ノレ・ディ・アン・レーヴ | まるで夢のようだった。
:::

現在形の **devrais**（〜したほうがいい：助言）と過去形の **aurais dû**（〜すべきだった：後悔）を対にして覚えると、devoir の条件法が一気に使えるようになります。

最後の **on aurait dit …**（まるで〜のようだった）は、比喩の決まり文句です（現在なら on dirait … まるで〜みたいだ）。

### （4）過去における未来（第27.6章）

[[Il a dit qu'il viendrait.\|イラ・ディ・キル・ヴィアンドレ\|彼は来ると言った。]]

仮定の意味はなく、時制の一致による形です。
:::

## 5. 「もしぼくが鳥だったら」

章のタイトルは、②のパターン（現在の反実）です。

:::ex もしぼくが鳥だったら
Si j'étais un oiseau, je volerais vers toi. | スィ・ジェテ・ザン・ノワゾー・ジュ・ヴォルレ・ヴェール・トワ | もしぼくが鳥だったら、君のところへ飛んでいくのに。
Si j'étais riche, j'achèterais une maison. | スィ・ジェテ・リッシュ・ジャシェトレ・ユヌ・メゾン | 金持ちだったら、家を買うのに。
Si tu étais là, je serais heureux. | スィ・テュ・エテ・ラ・ジュ・スレ・ズルー | 君がいてくれたら、幸せなのに。
À ta place, je ne dirais rien. | ア・タ・プラス・ジュ・ヌ・ディレ・リアン | 君の立場なら、何も言わないだろうな。
:::

最後の文のように、**si 節を使わずに条件を示す**こともできます（à ta place ＝君の立場なら）。条件法だけで仮定の文脈が伝わります。

## 7. 相談に乗る — 条件法の総合演習

友人の相談に乗る場面は、条件法のオンパレードです。

:::ex 相談の会話
J'ai un problème avec mon travail. Qu'est-ce que tu ferais, toi ? | ケス・ク・チュ・フレ・トワ | 仕事で悩んでてさ。君ならどうする？
À ta place, je parlerais directement au chef. | ア・タ・プラス・ジュ・パルルレ | 僕なら上司に直接話すな。
Tu devrais d'abord réfléchir calmement. | チュ・ドゥヴレ・ダボール・レフレシール | まず落ち着いて考えたほうがいいよ。
Ce serait dommage de démissionner maintenant. | ス・スレ・ドマージュ・ドゥ・デミスィヨネ | 今辞めるのはもったいないと思うな。
Moi, j'aurais peur de le regretter. | モワ・ジョレ・プール・ドゥ・ル・ルグレテ | 私なら後悔しそうで怖いな。
On pourrait en reparler demain ? | オン・プレ・アン・ルパルレ・ドゥマン | 明日また話さない？
:::

型を抜き出すと：

- **Qu'est-ce que tu ferais (à ma place) ?** — 助言を求める
- **À ta place, je + 条件法** — 「私なら〜する」
- **Tu devrais + 不定詞** — 「〜したほうがいい」
- **Ce serait + 形容詞 + de + 不定詞** — 「〜するのは…だろう」
- **On pourrait + 不定詞 ?** — 「〜しない？」という柔らかい提案

この5つの型で、**助言のやり取りは一通り回せます**。直説法でも文は作れますが、条件法にすることで「あくまで仮の話」という距離が生まれ、押しつけにならない——それがフランス語の相談の作法です。

## 8. 丁寧さの階段

依頼の言い方を、直接的なものから丁寧なものへ並べます。**下に行くほど条件法が深く関わります。**

| 段階 | 例 | 場面 |
|---|---|---|
| 命令形 | Aide-moi. | 家族・親しい友人 |
| 直説法の疑問 | Tu peux m'aider ? | 友人・同僚 |
| 条件法の疑問 | Tu **pourrais** m'aider ? | 少し改まる |
| vous + 条件法 | **Pourriez**-vous m'aider ? | 店・職場・初対面 |
| 前置きつき | **Auriez**-vous la gentillesse de m'aider ? | 非常に丁寧・書簡 |

フランス語の丁寧さは、日本語の敬語のような専用の語彙体系ではなく、**法と人称の選び方**で作られます。条件法はその中心的な道具です。


:::ai-gen 条件法現在・過去、si 構文の3パターン、語調緩和

## 10. 条件法過去の作り方と用法の全体

条件法過去は **条件法現在の助動詞 + 過去分詞**——第13章の枠組みどおりです。

| 助動詞 | 例 |
|---|---|
| avoir 系 | j'**aurais** chanté、tu **aurais** fini |
| être 系 | je **serais** allé(e)、elle **serait** partie |
| 代名動詞 | je me **serais** levé(e) |

用法は3つ、いずれも「**現実には起きなかったこと**」を扱います。

| 用法 | 例 |
|---|---|
| **過去の反実仮想の帰結** | Si j'avais su, je **serais** venu.（知っていたら来たのに） |
| **後悔・非難**（§4） | Tu **aurais dû** me le dire.（言ってくれればよかったのに） |
| **未確認の過去情報** | L'accident **aurait fait** trois morts.（事故で3人死亡した模様） |

:::ex 条件法過去
Sans toi, je n'y serais jamais arrivé. | サン・トワ・ジュ・ニ・スレ・ジャメ・アリヴェ | 君がいなかったら、絶対にやり遂げられなかった。
Elle serait partie avant l'aube. | エル・スレ・パルティ・アヴァン・ローブ | 彼女は夜明け前に発ったらしい。
J'aurais préféré que tu me préviennes. | ジョレ・プレフェレ・ク・チュ・ム・プレヴィエンヌ | 前もって知らせてほしかった。
On aurait pu éviter ça. | オ・ノレ・ピュ・エヴィテ・サ | あれは避けられたはずだ。
:::

**J'aurais préféré que + 接続法**（〜してほしかった）は、丁寧な不満の表明として使える大人の言い方です。**On aurait pu …**（〜できたはずなのに）は反省会の定型。

:::adv 条件法過去第2形 — 文学の中の形
古典文学では、条件法過去の代わりに**接続法大過去**が使われることがあります（条件法過去第2形）。

- Si j'avais su, je **fusse venu**.（= je serais venu）

形は接続法大過去ですが意味は条件法過去です。17〜19世紀の文章に現れる形で、現代語では完全に消えています。**読解で出会ったら条件法過去に読み替えれば足ります**。
:::

## 1. 作り方 — ils の現在形から

**第13章「①直説法現在」から出る枝の2本目です。**

1. **ils の現在形**を出す
2. **-ent を取って**、接続法の語尾を付ける

| 人称 | 語尾 |
|---|---|
| que je | **-e** |
| que tu | **-es** |
| qu'il | **-e** |
| que nous | **-ions** |
| que vous | **-iez** |
| qu'ils | **-ent** |

:::conj chanter subjonctif

| 動詞 | ils の現在形 | 語幹 | que je |
|---|---|---|---|
| chanter | ils chant**ent** | chant- | que je chante |
| finir | ils finiss**ent** | finiss- | que je finisse |
| partir | ils part**ent** | part- | que je parte |
| écrire | ils écriv**ent** | écriv- | que j'écrive |
| prendre | ils prenn**ent** | prenn- | que je prenne |

:::warn nous と vous だけは半過去と同じ語幹
接続法には**2つの語幹**があります。

- **je / tu / il / ils** … ils の現在形から
- **nous / vous** … **nous の現在形から**（＝半過去と同じ語幹）

:::conj prendre subjonctif

prendre では、**prenn-**（単数・3複）と **pren-**（nous, vous）に分かれます。

| 人称 | 形 | 語幹 |
|---|---|---|
| que je | prenne | prenn- |
| que nous | prenions | pren- |
| que vous | preniez | pren- |
| qu'ils | prennent | prenn- |

第13章で見た「語幹が2つに割れる動詞」（boire, venir, devoir, recevoir …）は、接続法でも同じ2つの語幹を使い分けます。

**規則動詞では2つの語幹が一致する**ので、この区別は意識しなくて済みます（chanter は両方 chant-）。
:::

:::note nous / vous の形は半過去と同じ綴りになる
que nous chant**ions** / que vous chant**iez** —— これは**半過去の nous / vous とまったく同じ綴り**です。

- 半過去：nous chantions（私たちは歌っていた）
- 接続法：que nous chantions（私たちが歌うこと）

区別は **que があるかどうか**と文脈です。偶然の一致ではなく、どちらも「nous の現在形 − ons」を語幹にしているためです。
:::

### 不規則な接続法

:::deep 覚えるべき不規則形

**（1）完全に不規則な2つ**

:::conj être subjonctif

:::conj avoir subjonctif

être（sois, sois, soit, soyons, soyez, soient）と avoir（aie, aies, ait, ayons, ayez, aient）は、第16章の命令形と同じ形です。命令形がこの2語で接続法を借りていたことが、ここで説明されます。

**（2）語幹が独自の6つ**

| 動詞 | 接続法の語幹 | que je | que nous |
|---|---|---|---|
| **faire** | fass- | que je fasse | que nous fassions |
| **pouvoir** | puiss- | que je puisse | que nous puissions |
| **savoir** | sach- | que je sache | que nous sachions |
| **falloir** | faill- | — | qu'il faille |
| **pleuvoir** | pleuv- | — | qu'il pleuve |
| **valoir** | vaill- | — | qu'il vaille |

この6つは **nous / vous も同じ語幹**を使います（que nous fassions）。

:::conj faire subjonctif

:::conj pouvoir subjonctif

**（3）2つの語幹を持つ不規則動詞**

| 動詞 | 単数・3複 | nous / vous |
|---|---|---|
| **aller** | aill- | all- |
| **vouloir** | veuill- | voul- |
| **venir** | vienn- | ven- |
| **boire** | boiv- | buv- |
| **prendre** | prenn- | pren- |
| **devoir** | doiv- | dev- |
| **recevoir** | reçoiv- | recev- |
| **voir** | voi- | voy- |

:::conj aller subjonctif

:::conj vouloir subjonctif

**規則から外れるのは実質 être, avoir, faire, pouvoir, savoir, aller, vouloir の7語**です。残りは「ils の現在形 − ent」で必ず作れます。
:::

## 2. 接続法過去

**助動詞の接続法現在 ＋ 過去分詞**。第13章の複合時制の5本目、これで全部そろいます。

:::conj chanter subjonctif,subjonctifPasse

意味は「（主節の時点より）**前に完了していること**」です。

:::ex 接続法現在と接続法過去
Je suis content qu'il vienne. | ジュ・スュイ・コンタン・キル・ヴィエンヌ | 彼が来ることが嬉しい。（これから来る）
Je suis content qu'il soit venu. | ジュ・スュイ・コンタン・キル・ソワ・ヴニュ | 彼が来たことが嬉しい。（すでに来た）
:::

## 3. 接続法を要求するもの — 4つのグループ

:::deep どんなときに接続法を使うか

### （1）意志・願望・命令

**主語が「そうあってほしい」と望んでいる**——まだ実現していないので事実ではありません。

| 動詞 | 意味 |
|---|---|
| [[vouloir que\|ヴロワール・ク]] | 〜してほしい |
| [[désirer que\|デズィレ・ク]] | 〜を望む |
| [[souhaiter que\|スエテ・ク]] | 〜を願う |
| [[préférer que\|プレフェレ・ク]] | 〜のほうがよい |
| [[demander que\|ドゥマンデ・ク]] | 〜するよう求める |
| [[ordonner que\|オルドネ・ク]] | 〜するよう命じる |
| [[interdire que\|アンテルディール・ク]] | 〜を禁じる |

:::ex 意志・願望
Je veux que tu viennes. | ジュ・ヴ・ク・テュ・ヴィエンヌ | 君に来てほしい。
Je souhaite que vous soyez heureux. | ジュ・スエット・ク・ヴー・ソワイエ・ズルー | あなたが幸せであることを願っています。
Elle préfère que nous partions tôt. | エル・プレフェール・ク・ヌー・パルティオン・ト | 彼女は私たちが早く出発するほうがよいと思っている。
:::

章のタイトルがこれです。**Je souhaite que vous soyez heureux.** ——soyez は être の接続法です。

:::warn espérer は直説法を取る
**願望を表すのに接続法を取らない**、有名な例外です。

- ○ [[J'espère qu'il viendra.\|ジェスペール・キル・ヴィアンドラ\|彼が来ることを期待している。]]（直説法・単純未来）
- × J'espère qu'il vienne.

espérer は「そうなると見込んでいる」＝話し手が**実現を事実として想定している**ため直説法になる、と説明されます。vouloir（意志）との違いです。

ただし**否定・疑問にすると接続法**になります：[[Je n'espère pas qu'il vienne.\|ジュ・ネスペール・パ・キル・ヴィエンヌ]]
:::

### （2）感情

**主語の主観的な反応**を述べるもの。内容の真偽ではなく、それに対する感情が焦点です。

| 表現 | 意味 |
|---|---|
| [[être content que\|エートル・コンタン・ク]] | 〜が嬉しい |
| [[être heureux que\|エートル・ウルー・ク]] | 〜が幸せだ |
| [[être triste que\|エートル・トリスト・ク]] | 〜が悲しい |
| [[être surpris que\|エートル・スュルプリ・ク]] | 〜に驚く |
| [[avoir peur que\|アヴォワール・プール・ク]] | 〜を恐れる |
| [[regretter que\|ルグレテ・ク]] | 〜を残念に思う |
| [[il est dommage que\|イ・レ・ドマージュ・ク]] | 〜は残念だ |

:::ex 感情
Je suis content que tu sois là. | ジュ・スュイ・コンタン・ク・テュ・ソワ・ラ | 君がいてくれて嬉しい。
J'ai peur qu'il ne soit malade. | ジェ・プール・キル・ヌ・ソワ・マラード | 彼が病気ではないかと心配だ。
C'est dommage qu'elle ne puisse pas venir. | セ・ドマージュ・ケル・ヌ・ピュイス・パ・ヴニール | 彼女が来られないのは残念だ。
:::

**avoir peur que には虚辞の ne**（第5章）が入ります。J'ai peur qu'il **ne** soit malade. の ne に否定の意味はありません。

### （3）疑い・否定・可能性

**事実性が揺らいでいる**もの。

| 表現 | 意味 |
|---|---|
| [[douter que\|ドゥテ・ク]] | 〜を疑う |
| [[ne pas croire que\|ヌ・パ・クロワール・ク]] | 〜だと思わない |
| [[ne pas penser que\|ヌ・パ・パンセ・ク]] | 〜だと思わない |
| [[il est possible que\|イ・レ・ポスィブル・ク]] | 〜かもしれない |
| [[il se peut que\|イル・ス・プ・ク]] | 〜の可能性がある |
| [[il semble que\|イル・サンブル・ク]] | 〜のようだ |

:::ex 疑い・否定
Je doute qu'il vienne. | ジュ・ドゥット・キル・ヴィエンヌ | 彼が来るとは思えない。
Je ne crois pas qu'il ait raison. | ジュ・ヌ・クロワ・パ・キ・レ・レゾン | 彼が正しいとは思わない。
Il est possible qu'il pleuve. | イ・レ・ポスィブル・キル・プルーヴ | 雨が降るかもしれない。
:::

:::warn croire / penser は肯定と否定で法が変わる
第29½章で見た対立です。

- [[Je crois qu'il vient.\|ジュ・クロワ・キル・ヴィアン\|彼は来ると思う。]]（直説法）
- [[Je ne crois pas qu'il vienne.\|ジュ・ヌ・クロワ・パ・キル・ヴィエンヌ\|彼が来るとは思わない。]]（接続法）

肯定では話し手が事実として扱い、否定では事実性が揺らぐためです。疑問文でも接続法になりやすくなります。

**il est certain que**（〜は確実だ）は直説法、**il est possible que**（〜かもしれない）は接続法——**確実性の度合いが法を決めています**。

| 表現 | 法 |
|---|---|
| il est certain / sûr / évident que | **直説法** |
| il est probable que（ありそうだ） | **直説法** |
| il est possible que（かもしれない） | **接続法** |
| il est peu probable que（ありそうにない） | **接続法** |

**probable は直説法、possible は接続法** ——確実性の線引きがここにあります。
:::

### （4）必要・判断

| 表現 | 意味 |
|---|---|
| [[il faut que\|イル・フォ・ク]] | 〜しなければならない |
| [[il est nécessaire que\|イ・レ・ネセセール・ク]] | 〜が必要だ |
| [[il est important que\|イ・レ・タンポルタン・ク]] | 〜が重要だ |
| [[il vaut mieux que\|イル・ヴォ・ミュー・ク]] | 〜したほうがよい |
| [[il est normal que\|イ・レ・ノルマル・ク]] | 〜は当然だ |

:::ex 必要・判断
Il faut que tu partes. | イル・フォ・ク・テュ・パルト | 君は出発しなければならない。
Il vaut mieux que nous restions. | イル・ヴォ・ミュー・ク・ヌー・レスティオン | 私たちは残ったほうがいい。
Il est important que vous compreniez. | イ・レ・タンポルタン・ク・ヴー・コンプルニエ | あなたが理解することが大切です。
:::

**il faut que は日常会話で頻出**です。第15章で扱った il faut + 不定詞（一般論）と違い、**行為者を特定するときは que + 接続法**になります。
:::

## 4. 接続法を要求する接続詞

**特定の接続詞の後では、必ず接続法になります。**

| 接続詞 | 意味 |
|---|---|
| **bien que / quoique** | 〜にもかかわらず |
| **pour que / afin que** | 〜するために |
| **avant que** | 〜する前に |
| **jusqu'à ce que** | 〜するまで |
| **à moins que** | 〜でない限り |
| **sans que** | 〜することなく |
| **pourvu que** | 〜でありさえすれば |
| **de peur que / de crainte que** | 〜しないように |

:::ex 接続詞 + 接続法
Bien qu'il soit malade, il travaille. | ビアン・キル・ソワ・マラード・イル・トラヴァイユ | 病気なのに、彼は働いている。
Je t'explique pour que tu comprennes. | ジュ・テクスプリック・プール・ク・テュ・コンプレンヌ | 分かるように説明します。
Partons avant qu'il ne pleuve. | パルトン・ザヴァン・キル・ヌ・プルーヴ | 雨が降る前に出発しよう。
Attends jusqu'à ce que je revienne. | アタン・ジュスカ・ス・ク・ジュ・ルヴィエンヌ | 私が戻るまで待って。
:::

:::warn après que は直説法（規範上）
**avant que は接続法、après que は直説法** ——対になっているのに法が違います。

- avant qu'il **vienne**（接続法）… まだ来ていない＝不確実
- après qu'il **est venu**（直説法）… すでに来た＝事実

**時間的な前後が、事実性の違いを生んでいます。**

ただし**現実には après que にも接続法を使う話者が多く**、規範と実態がずれている代表例です。試験では直説法で答えてください。

なお **avant que / à moins que / de peur que には虚辞の ne** が入ることがあります（第5章）。否定の意味はありません。
:::

## 5. que 節を避ける — 不定詞にする

:::note 主語が同じなら不定詞を使う
**主節と従属節の主語が同じ場合、接続法ではなく不定詞を使います。**

| | 例 |
|---|---|
| 主語が違う | [[Je veux que tu partes.\|ジュ・ヴ・ク・テュ・パルト\|君に出発してほしい。]] |
| 主語が同じ | [[Je veux partir.\|ジュ・ヴ・パルティール\|私は出発したい。]] |

× Je veux que je parte. とは言いません。

同じ規則が接続詞にも適用されます。

| 接続詞（+ 接続法） | 前置詞（+ 不定詞） |
|---|---|
| pour que | **pour** |
| avant que | **avant de** |
| à moins que | **à moins de** |
| sans que | **sans** |
| afin que | **afin de** |

- [[Je travaille pour que ma famille vive bien.\|プール・ク・マ・ファミーユ・ヴィーヴ・ビアン\|家族が良い暮らしをするために働く。]]（主語が違う）
- [[Je travaille pour vivre.\|ジュ・トラヴァイユ・プール・ヴィーヴル\|生きるために働く。]]（主語が同じ）

**接続法は「主語が違うとき」に必要になる** ——この視点で見ると、使う場面がかなり絞られます。

ただし **bien que には対応する前置詞がない**ので、主語が同じでも接続法を使います（Bien qu'il soit fatigué, il travaille.）。
:::

## 6. 文語の接続法 — 半過去と大過去

:::adv 読解のために知っておく
接続法には、現代語で使われない2つの時制があります。

**接続法半過去**（l'imparfait du subjonctif）… 単純過去の語幹から作る
**接続法大過去**（le plus-que-parfait du subjonctif）… 助動詞の接続法半過去 + 過去分詞

[[Je voulais qu'il **vînt**.\|ジュ・ヴレ・キル・ヴァン\|彼に来てほしかった。]]（接続法半過去）
[[Il eût fallu qu'il **fût** venu.\|イル・ウ・ファリュ・キル・フュ・ヴニュ\|彼が来ていなければならなかっただろう。]]（接続法大過去）

**19世紀までの文学と、ごく formal な文書にしか現れません。** 現代語では、主節が過去でも**接続法現在**を使います。

- 文語：Je voulais qu'il vînt.
- 現代：[[Je voulais qu'il vienne.\|ジュ・ヴレ・キル・ヴィエンヌ\|彼に来てほしかった。]]

**接続法には時制の一致がない**、と理解しておけば十分です。第27.6章の時制の一致は、直説法にだけ適用されます。

第20.5章で述べたとおり、接続法半過去は単純過去の語幹から作られるため、**単純過去の衰退と運命を共にしました**。この2つの時制はセットで消えつつあります。
:::

## 7. 主節に立つ接続法 — Vive と Qu'il vienne

:::deep que なしで主節に現れる接続法
接続法は従属節の法ですが、**願望・命令の決まった形で主節にも立ちます**。

- [[Vive la France !|ヴィーヴ・ラ・フランス|フランス万歳！]]（vivre の接続法）
- [[Ainsi soit-il.|アンスィ・ソワ・ティル|アーメン（そうであれかし）。]]
- [[Soit un triangle ABC.|ソワ・タン・トリヤングル|三角形ABCがあるとする。]]（数学の「〜とせよ」）
- [[Qu'il entre !|キ・ラントル|入らせなさい！]]（3人称への命令、第29½章）
- [[Que je sache.|ク・ジュ・サッシュ|私の知る限りでは。]]（pas que je sache の形で）

**Vive …!** は万歳、**soit** は数学と「よかろう」（Soit. 分かった、それでいい）に生き残っています。古い「独立の接続法」の化石で、現代語では新しく作れませんが、目にする頻度は高い形です。
:::

## 8. 決まり文句の接続法

:::adv 主節なしで現れる接続法
慣用表現として、que 節が単独で使われることがあります。

[[Vive la France !\|ヴィーヴ・ラ・フランス\|フランス万歳！]]
[[Qu'il vienne !\|キル・ヴィエンヌ\|彼を来させろ！／彼が来ればいい！]]
[[Que Dieu vous bénisse.\|ク・ディュ・ヴー・ベニス\|神のご加護がありますように。]]
[[Ainsi soit-il.\|アンスィ・ソワ・ティル\|アーメン（そうでありますように）。]]
[[Sauve qui peut !\|ソーヴ・キ・プ\|逃げられる者は逃げろ！]]

**Vive …!** は「〜万歳」の定型で、Vive les vacances !（休暇万歳）のように応用できます。もともとは Que … vive（〜が生きますように）から que が落ちた形です。

3人称への命令は命令法では表せない（第16章では tu / nous / vous の3形しかなかった）ため、**接続法が命令法の代わり**を務めています。
:::

## 9. 活用ドリル

:::drill chanter,finir,prendre,être,avoir,aller,faire,venir,pouvoir,vouloir,savoir subjonctif

:::note 語幹の作り方を確認する
出題された動詞について、まず **ils の現在形**を思い浮かべてください。そこから -ent を取れば語幹です。

不規則なのは être, avoir, faire, pouvoir, savoir, aller, vouloir の7語だけ。残りは規則どおりに作れます。
:::
