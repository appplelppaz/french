フランス語の否定は、動詞を **ne … pas** で挟むだけです。この点では英語より単純で、助動詞 do を持ち出す必要もありません。

ただし大学レベルでは、ここから先が本番です。**pas 以外の否定語が10種類ほどあり**、それぞれ位置と用法が違います。さらに「否定なのに否定の意味を持たない ne」という現象まであります。この章でまとめて整理します。

## 1. ne … pas — 基本形

**活用した動詞を ne と pas で挟みます。**

:::ex ne … pas
Je ne suis pas japonais. | ジュ・ヌ・スュイ・パ・ジャポネ | 私は日本人ではありません。
Tu ne chantes pas. | テュ・ヌ・シャント・パ | 君は歌わない。
Elle n'est pas là. | エル・ネ・パ・ラ | 彼女はここにいない。
Ce n'est pas grave. | ス・ネ・パ・グラーヴ | 大したことじゃない。
:::

:::warn ne は必ずエリジオンする
母音・無音の h で始まる動詞の前では **n'** になります。これは義務です。

- Je **ne** suis pas … （子音で始まる）
- Je **n'**ai pas … （母音で始まる）
- Il **n'**habite pas … （無音の h）
:::

### 挟むのは「活用した動詞」だけ

ここを外すと、後の章がすべて崩れます。**ne … pas は活用形の動詞を挟み、不定詞や過去分詞は挟みません。**

:::ex 挟む対象を間違えない
Je ne veux pas partir. | ジュ・ヌ・ヴ・パ・パルティール | 私は出発したくない。
Je n'ai pas mangé. | ジュ・ネ・パ・マンジェ | 私は食べなかった。
:::

- 前者では、活用しているのは **veux**（vouloir）。partir は不定詞なので pas の後ろ。
- 後者では、活用しているのは **ai**（avoir、助動詞）。mangé は過去分詞なので pas の後ろ。

複合過去（第20章）で「助動詞を挟む」という規則が出てきますが、それは新しい規則ではなく、この原則の当然の帰結です。

:::deep 不定詞そのものを否定するときは ne pas をまとめて前に置く
不定詞を否定する場合だけ、**ne pas が離れず、不定詞の前に並びます**。

:::ex 不定詞の否定
Je préfère ne pas partir. | ジュ・プレフェール・ヌ・パ・パルティール | 私は出発しないほうがいい。
Il m'a dit de ne pas venir. | イル・マ・ディ・ドゥ・ヌ・パ・ヴニール | 彼は来ないようにと私に言った。
Prière de ne pas fumer. | プリエール・ドゥ・ヌ・パ・フュメ | 禁煙のお願い（掲示）。
:::

理由は単純です。ne … pas が挟むのは「活用した動詞」であり、不定詞は活用していないので挟みようがない。そこでまとめて前に置くのです。
:::

## 2. 話し言葉では ne が消える

:::adv 現代フランス語の実態
**話し言葉では ne がほぼ発音されません。** これは崩れた言い方ではなく、現代フランス語の標準的な口語です。

| 書き言葉 | 話し言葉 |
|---|---|
| Je ne sais pas. | [[Je sais pas.\|ジュ・セ・パ]]（さらに縮んで「シェパ」） |
| Il n'y a pas de problème. | [[Y a pas de problème.\|ヤ・パ・ドゥ・プロブレーム]] |
| Ce n'est pas grave. | [[C'est pas grave.\|セ・パ・グラーヴ]] |

つまり**話し言葉では pas が否定の担い手**です。逆に、ne を落とさずきちんと発音すると、改まった・格式ばった印象になります。

ただし**書くときは必ず ne を入れてください**。試験・レポート・メールで ne を落とすと誤りとみなされます。「聞くときは pas を探し、書くときは ne を忘れない」と使い分けてください。
:::

:::deep なぜ ne のほうが消えたのか — 否定の歴史
ラテン語の否定は **non** だけでした。古フランス語ではこれが **ne** になり、単独で否定を表していました。

やがて否定を強めるために、意味の薄い名詞を添えるようになります。
- ne … **pas**（一歩も）← pas は「歩」
- ne … **point**（一点も）← point は「点」
- ne … **mie**（パンくずも）、ne … **goutte**（一滴も）

英語の not a bit / not a step と同じ発想です。このうち **pas** が生き残って一般化し、やがて ne より pas のほうが否定の中心になりました。そして音が弱い ne が脱落した——これが今の状況です。

**否定語が意味の薄い名詞に由来する**という事実は、次の点も説明します。
- personne（人）、rien（もの）、jamais（かつて）が否定語として使えるのは、これらが同じ経路で否定に取り込まれた名詞・副詞だから
- だから personne や rien は、単独では**肯定の意味**にもなりうる（後述）
:::

## 3. pas 以外の否定語

**ne は共通で、pas の位置に別の語を入れます。**

| 否定語 | 意味 | 英語で言えば |
|---|---|---|
| ne … pas | 〜ない | not |
| ne … jamais | 決して〜ない | never |
| ne … plus | もう〜ない | not any more |
| ne … rien | 何も〜ない | nothing |
| ne … personne | 誰も〜ない | nobody |
| ne … aucun(e) | どんな〜も…ない | no, not any |
| ne … guère | ほとんど〜ない | hardly |
| ne … que | 〜しかない | only |
| ne … ni … ni | 〜も〜もない | neither … nor |
| ne … nulle part | どこにも〜ない | nowhere |

:::ex 否定語のいろいろ
Je ne fume jamais. | ジュ・ヌ・フュム・ジャメ | 私は決してタバコを吸わない。
Il n'est plus là. | イル・ネ・プリュ・ラ | 彼はもうここにいない。
Je ne comprends rien. | ジュ・ヌ・コンプラン・リアン | 私は何も分からない。
Je ne vois personne. | ジュ・ヌ・ヴォワ・ペルソンヌ | 私には誰も見えない。
Il n'a aucune idée. | イル・ナ・オーキュ・ニデ | 彼には何の考えもない。
Je ne parle ni anglais ni allemand. | ジュ・ヌ・パルル・ニ・アングレ・ニ・アルマン | 私は英語もドイツ語も話さない。
:::

:::warn 否定語は2つ重ねない
英語の I don't know nothing. が誤りであるように、フランス語でも **pas と他の否定語は共存できません**。

- × Je ne vois pas personne.
- ○ Je ne vois personne.

ただし例外的に組み合わせられるものはあります：**ne … plus jamais**（もう二度と〜ない）、**ne … plus rien**（もう何も〜ない）。
[[Je ne veux plus jamais te voir.\|ジュ・ヌ・ヴ・プリュ・ジャメ・ト・ヴォワール\|もう二度と君に会いたくない。]]
:::

### personne と rien は主語にもなる

:::ex personne / rien が主語になるとき
Personne ne comprend. | ペルソンヌ・ヌ・コンプラン | 誰も理解しない。
Rien n'est impossible. | リアン・ネ・タンポスィブル | 不可能なことは何もない。
:::

主語の位置に来ても **ne は動詞の前に残ります**。ne は動詞と結びついた要素であって、否定語とセットで動くわけではないからです。

:::deep personne と rien は単独では肯定的
これらの語がもともと名詞（personne＝人、rien＝もの、ラテン語 rem「もの」）だったことが、いまも痕跡として残っています。

**ne を伴わずに単独で使うと、否定の意味を持ちません。**

- [[Qui est là ? — Personne.\|キ・エ・ラ・ペルソンヌ\|誰かいる？ — 誰も。]]（答えとして単独なら否定）
- [[une personne\|ユヌ・ペルソンヌ\|一人の人]]（名詞としては肯定）
- [[sans rien dire\|サン・リアン・ディール\|何も言わずに]]（sans が否定を担うので ne は不要）
- [[Avez-vous jamais vu cela ?\|アヴェ・ヴー・ジャメ・ヴュ・スラ\|あなたはかつてこれを見たことがありますか？]]（jamais が「かつて」の意味）

**否定を作っているのは ne のほうであり、pas / personne / rien はそれを強めているにすぎない** ——歴史的な成り立ちを知っていると、この振る舞いが理解できます。
:::

### ne … que は否定ではない

:::warn ne … que は「制限」であって否定ではない
形は否定文と同じですが、意味は **「〜しかない」（＝ only）** で、実質的には肯定です。

:::ex ne … que
Je n'ai que dix euros. | ジュ・ネ・ク・ディ・ズロ | 私は10ユーロしか持っていない。
Il ne pense qu'à elle. | イル・ヌ・パンス・カ・エル | 彼は彼女のことしか考えていない。
:::

否定ではないので、**否定の de が起きません**。

- Je n'ai pas **de** frère.（否定 → de）
- Je n'ai qu'**un** frère.（制限 → 冠詞はそのまま）

これは試験で狙われる点です。また que は制限する語の直前に置くので、位置が意味を決めます。
- [[Je ne bois que du thé le matin.\|ジュ・ヌ・ボワ・ク・デュ・テ・ル・マタン\|朝は紅茶しか飲まない。]]（飲むものを制限）
- [[Je ne bois du thé que le matin.\|ジュ・ヌ・ボワ・デュ・テ・ク・ル・マタン\|紅茶は朝しか飲まない。]]（時を制限）
:::

## 4. 否定文における冠詞の変化（復習と整理）

第2章で扱った「否定の de」を、否定語全体に広げて整理します。

**不定冠詞（un, une, des）と部分冠詞（du, de la）は、否定文で de になります。**

:::ex 否定の de
J'ai un chien. → Je n'ai pas de chien. | ジュ・ネ・パ・ドゥ・シアン | 私は犬を飼っていない。
Je bois du vin. → Je ne bois jamais de vin. | ジュ・ヌ・ボワ・ジャメ・ドゥ・ヴァン | 私は決してワインを飲まない。
Il y a des places. → Il n'y a plus de places. | イル・ニヤ・プリュ・ドゥ・プラス | もう席がない。
:::

| 変わる | 変わらない |
|---|---|
| un, une, des → de | 定冠詞 le, la, les |
| du, de la, de l' → de | être の後ろの冠詞 |
| | ne … que の後ろの冠詞 |

:::ex 変わらない場合
Je n'aime pas le café. | ジュ・ネーム・パ・ル・カフェ | コーヒーは好きではない。（定冠詞）
Ce n'est pas un problème. | ス・ネ・パ・ザン・プロブレーム | それは問題ではない。（être の後ろ）
Je n'ai qu'un frère. | ジュ・ネ・カン・フレール | 兄弟は一人しかいない。（制限）
:::

3つの例外はいずれも**「その冠詞が量を表していない」**という同じ理由から出ています。否定によって量がゼロになるからこそ de になるのであって、量の話でなければ変化しません。

## 5. 部分否定と全体否定

:::deep pas の位置が意味を変える
否定語がどこにかかるかによって、否定される範囲が変わります。

**（1）tout / toujours との組み合わせ**

| 語順 | 意味 |
|---|---|
| ne … pas toujours | いつも〜とは限らない（**部分否定**） |
| ne … jamais | 決して〜ない（**全体否定**） |
| ne … pas tout | すべてが〜なわけではない（部分否定） |
| ne … rien | 何も〜ない（全体否定） |

[[Il n'est pas toujours gentil.\|イル・ネ・パ・トゥジュール・ジャンティ\|彼はいつも親切とは限らない。]]
[[Il n'est jamais gentil.\|イル・ネ・ジャメ・ジャンティ\|彼は決して親切ではない。]]

**（2）et と ou の否定**

肯定文の **et**（and）は、否定文では **ni … ni** になります。
[[J'aime le thé et le café.\|ジェーム・ル・テ・エ・ル・カフェ\|紅茶とコーヒーが好きだ。]]
→ [[Je n'aime ni le thé ni le café.\|ジュ・ネーム・ニ・ル・テ・ニ・ル・カフェ\|紅茶もコーヒーも好きではない。]]

**（3）非文否定（否定辞だけの応答）**
[[Moi non plus.\|モワ・ノン・プリュ\|私も〜ない。]] ← 肯定なら Moi aussi.（私も）
[[Pas du tout.\|パ・デュ・トゥ\|全然。]]、[[Pas encore.\|パ・アンコール\|まだです。]]、[[Jamais.\|ジャメ\|決して。]]
:::

## 6. 虚辞の ne（le ne explétif）

:::adv 否定の意味を持たない ne
書き言葉・改まった文体では、**否定の意味がまったくないのに ne が現れる**ことがあります。これを**虚辞の ne** と呼びます。

現れる環境は決まっています。

| 環境 | 例 |
|---|---|
| avant que（〜する前に） | [[avant qu'il ne parte\|アヴァン・キル・ヌ・パルト\|彼が出発する前に]] |
| craindre / avoir peur que（恐れる） | [[Je crains qu'il ne vienne.\|ジュ・クラン・キル・ヌ・ヴィエンヌ\|彼が来るのではないかと心配だ。]] |
| à moins que（〜でない限り） | [[à moins qu'il ne pleuve\|ア・モワン・キル・ヌ・プルーヴ\|雨が降らない限り]] |
| 比較級の que の後 | [[Il est plus grand que je ne pensais.\|イ・レ・プリュ・グラン・ク・ジュ・ヌ・パンセ\|彼は私が思っていたより背が高い。]] |

**Je crains qu'il ne vienne.** は「彼が来ることを恐れる」であって、「来ないことを恐れる」ではありません。ne があるのに否定されていない、というのが虚辞の ne の特徴です。

「まだ実現していない事態」「望ましくない事態」に対する話し手の心理的な抵抗が、否定の形式として痕跡的に残ったもの、と説明されます。

**話し言葉ではまず使われません**。読解のために知っておく項目で、自分で書くときに必要になることはほとんどありません。ただし「なぜここに ne があるのに否定でないのか」を説明できる必要はあります。
:::

## 7. 不定詞の否定と、否定の組み合わせ

:::deep ne pas + 不定詞 — まとめて前に置く
不定詞を否定するときは、**ne pas をまとめて不定詞の前**に置きます。活用した動詞を挟むのとは配置が違います。

:::ex 不定詞の否定
Je te demande de ne pas crier. | ジュ・トゥ・ドゥマンド・ドゥ・ヌ・パ・クリエ | 叫ばないでと頼んでいるんだ。
Il vaut mieux ne rien dire. | イル・ヴォ・ミュー・ヌ・リヤン・ディール | 何も言わないほうがいい。
Elle est partie sans rien dire. | エ・レ・パルティ・サン・リヤン・ディール | 彼女は何も言わずに去った。
Merci de ne pas fumer. | メルスィ・ドゥ・ヌ・パ・フュメ | 禁煙にご協力ください。（掲示）
:::

**Merci de ne pas + 不定詞**は掲示の定型です（Merci de ne pas toucher. お手を触れないでください）。

**否定語の組み合わせ**も整理しておきます。pas とは併用できませんが、pas 以外どうしは重ねられます。

| 組み合わせ | 意味 | 例 |
|---|---|---|
| ne … **plus rien** | もう何も〜ない | Je ne vois plus rien. |
| ne … **plus jamais** | もう二度と〜ない | Je n'y retournerai plus jamais. |
| ne … **jamais rien** | 決して何も〜ない | Il ne dit jamais rien. |
| ne … **plus personne** | もう誰も〜ない | Il n'y a plus personne. |
| ne … **jamais personne** | 決して誰も〜ない | Elle n'invite jamais personne. |

順序は **plus → jamais → rien / personne** の並びで固定です。「もう二度と何も言わない」なら Je ne dirai **plus jamais rien**. と3つ重なることもあります。
:::

## 8. 否定の返事と応酬 — 会話の道具

:::deep 否定をめぐる会話の定型
**（1）Pas + 語 — 動詞なしの否定**

- [[Pas encore.|パ・ザンコール|まだだよ。]]
- [[Pas du tout.|パ・デュ・トゥ|全然。]]
- [[Pas de problème.|パ・ドゥ・プロブレム|問題ないよ。]]
- [[Pas mal !|パ・マル|悪くないね！]]
- [[Pourquoi pas ?|プルコワ・パ|いいんじゃない？]]

pas は動詞なしでも否定を作れます。返事はこの形で十分です。

**（2）ne … ni … ni（〜も〜もない）**

[[Je ne bois ni café ni thé.|ジュ・ヌ・ボワ・ニ・カフェ・ニ・テ|コーヒーも紅茶も飲みません。]]

ni の後は無冠詞になる点に注意（第31.5章で詳述）。

**（3）non plus と moi non plus**

否定文の「〜も」は aussi ではなく **non plus**：[[Je ne sais pas. — Moi non plus.|モワ・ノン・プリュ|知らない。— 私も。]]

**（4）二重否定は肯定になる**

[[Ce n'est pas impossible.|ス・ネ・パ・アンポスィブル|不可能ではない（＝できるかもしれない）。]]
[[Il n'est pas sans savoir que …|イル・ネ・パ・サン・サヴォワール|彼は〜を知らないわけではない。]]

pas + 否定的な語で、控えめな肯定（緩叙法）になります。フランス語らしい持って回った言い方で、書き言葉・改まった話し言葉で好まれます。

**（5）否定疑問への返事は si**（第9章の復習）

Tu ne viens pas ? — **Si**, je viens !（来ないの？ — いや、行くよ！）
:::


:::ai-gen 否定表現、ne...pas 以外の否定語、否定の de、ne...que

## 9. 否定の作用域 — どこまでを否定しているか

同じ ne … pas でも、**文のどこにかかるか**で意味が変わります。読解で誤読しやすい箇所です。

:::ex 作用域の違い
Je ne pense pas qu'il vienne. | ジュ・ヌ・パンス・パ・キル・ヴィエンヌ | 彼が来るとは思わない。（否定が que 節にかかる）
Il ne travaille pas beaucoup. | イル・ヌ・トラヴァイユ・パ・ボクー | 彼はあまり働かない。（beaucoup を否定）
Il ne travaille pas pour l'argent. | イル・ヌ・トラヴァイユ・パ・プー・ラルジャン | 彼が働くのは金のためではない。（pour l'argent を否定）
Tous les étudiants ne sont pas venus. | トゥ・レ・ゼテュディヤン・ヌ・ソン・パ・ヴニュ | 学生全員が来たわけではない。（部分否定）
Aucun étudiant n'est venu. | オキュン・ネテュディヤン・ネ・ヴニュ | どの学生も来なかった。（全否定）
:::

**（1）主節否定の繰り上げ**

Je ne pense pas qu'il vienne. は、論理的には「彼が来ない、と思う」ではなく「彼が来る、とは思わない」です。**否定が主節に付いていても、意味は従属節にかかる**——英語の I don't think he'll come. と同じ現象で、これを「否定の繰り上げ」と呼びます。penser / croire / trouver で起きます。

**（2）tous … ne … pas は部分否定**

**Tous les étudiants ne sont pas venus.** は「全員が来たわけではない」（一部は来た）。全否定にしたいなら **aucun** か **personne** を使います。日本語の「全員来なかった」と読むと逆になるので要注意です。

**（3）否定の位置が変わると焦点が動く**

- Il **n'**a **pas** acheté ce livre **pour lui**.（彼のために買ったのではない——他の誰かのため）
- Il **n'**a **pas** acheté **ce livre** pour lui.（この本を買ったのではない——別の本）

強勢の置き方で決まる英語と違い、フランス語は**否定の直後に来る要素**が焦点になりやすい傾向があります。第22章の強調構文（Ce n'est pas ce livre qu'il a acheté.）を使えば、焦点を明示できます。

  body: `
フランス語の形容詞には、英語にない2つの性質があります。

1. **修飾する名詞の性・数に一致して形を変える**
2. **原則として名詞の後ろに置かれる**

そして厄介なことに、2番目には例外が多く、しかも**置く位置によって意味が変わる形容詞**まであります。この章では一致の規則を網羅したうえで、位置の問題を体系的に扱います。

## 1. 性数一致 — 基本

**女性形は -e を足す。複数形は -s を足す。** これが出発点です。

| | 単数 | 複数 |
|---|---|---|
| 男性 | grand | grands |
| 女性 | grande | grandes |

:::ex 4つの形
un livre vert | アン・リーヴル・ヴェール | 緑の本（男性単数）
des livres verts | デ・リーヴル・ヴェール | 緑の本（男性複数）
une table verte | ユヌ・ターブル・ヴェルト | 緑の机（女性単数）
des tables vertes | デ・ターブル・ヴェルト | 緑の机（女性複数）
:::

:::warn 一致は「音」に現れることも、現れないこともある
第0章の規則がここで効きます。**語末の e は無音だが、その手前の子音を発音させる**。

- vert（ヴェール）→ verte（ヴェル**ト**）… t が発音されるので**耳で分かる**
- joli（ジョリ）→ jolie（ジョリ）… 母音の後なので**音が変わらない**

そして**複数の -s は常に無音**なので、複数形は耳では分かりません。

つまり形容詞の一致は、**書くときには必ず必要だが、聞き分けられるのは女性形の一部だけ**です。だからこそ、書くときの意識的な処理が要求されます。
:::

## 2. 女性形の作り方 — 完全な規則

:::deep 語尾ごとの女性形

**（1）原則：-e を足す**
grand → grande、petit → petite、français → française

**（2）すでに -e で終わっている → 変化なし**
[[rouge\|ルージュ\|赤い]]、[[jeune\|ジュヌ\|若い]]、[[facile\|ファスィル\|易しい]]、[[riche\|リッシュ\|裕福な]]

**（3）-er → -ère**
[[cher\|シェール\|高価な]] → [[chère\|シェール]]、[[premier\|プルミエ\|最初の]] → [[première\|プルミエール]]

**（4）子音を重ねてから -e**

| 語尾 | 女性形 | 例 |
|---|---|---|
| -el | -elle | [[naturel\|ナテュレル]] → [[naturelle\|ナテュレル]] |
| -eil | -eille | [[pareil\|パレイユ]] → [[pareille\|パレイユ]] |
| -en | -enne | [[italien\|イタリアン]] → [[italienne\|イタリエンヌ]] |
| -on | -onne | [[bon\|ボン]] → [[bonne\|ボンヌ]] |
| -et | -ette | [[muet\|ミュエ]] → [[muette\|ミュエット]] |
| -s（一部） | -sse | [[gros\|グロ]] → [[grosse\|グロス]]、[[bas\|バ]] → [[basse\|バス]] |

**-en / -on では、n が重なることで鼻母音が消えます**（bon「ボン」→ bonne「ボンヌ」）。第0章の鼻母音の条件がそのまま効いています。

**（5）-et → -ète（子音を重ねない型）**
[[complet\|コンプレ]] → [[complète\|コンプレット]]、[[secret\|スクレ]] → [[secrète\|スクレット]]、[[inquiet\|アンキエ]] → [[inquiète\|アンキエット]]

muet → muette と complet → complète で分かれるので、個別に覚える必要があります。

**（6）-f → -ve**
[[actif\|アクティフ]] → [[active\|アクティヴ]]、[[neuf\|ヌフ\|新しい]] → [[neuve\|ヌーヴ]]、[[sportif\|スポルティフ]] → [[sportive\|スポルティヴ]]

**（7）-eux → -euse**
[[heureux\|ウルー\|幸せな]] → [[heureuse\|ウルーズ]]、[[sérieux\|セリユー\|真面目な]] → [[sérieuse\|セリユーズ]]

**（8）-eur → -euse / -rice / -eure**
- 動詞から作られたもの → -euse：[[menteur\|マントゥール\|嘘つきの]] → menteuse
- -teur 型 → -trice：[[créateur\|クレアトゥール\|創造的な]] → créatrice
- 比較級由来 → -eure：[[meilleur\|メイユール\|より良い]] → meilleure、supérieur → supérieure

**（9）完全に不規則なもの**

| 男性 | 女性 | 意味 |
|---|---|---|
| [[beau\|ボー]] | [[belle\|ベル]] | 美しい |
| [[nouveau\|ヌーヴォー]] | [[nouvelle\|ヌーヴェル]] | 新しい |
| [[vieux\|ヴィユー]] | [[vieille\|ヴィエイユ]] | 古い、年老いた |
| [[fou\|フー]] | [[folle\|フォル]] | 狂った |
| [[mou\|ムー]] | [[molle\|モル]] | 柔らかい |
| [[blanc\|ブラン]] | [[blanche\|ブランシュ]] | 白い |
| [[frais\|フレ]] | [[fraîche\|フレッシュ]] | 新鮮な |
| [[sec\|セック]] | [[sèche\|セッシュ]] | 乾いた |
| [[long\|ロン]] | [[longue\|ロング]] | 長い |
| [[doux\|ドゥー]] | [[douce\|ドゥース]] | 甘い、優しい |
| [[faux\|フォー]] | [[fausse\|フォース]] | 偽の |
| [[favori\|ファヴォリ]] | [[favorite\|ファヴォリット]] | お気に入りの |
:::

## 3. beau / nouveau / vieux の第3の形

:::warn 男性単数なのに女性形に似た形がある
この3語（と fou, mou）には、**母音・無音の h で始まる男性名詞の前でだけ使う特別な形**があります。

| 男性単数 | 母音の前 | 女性単数 |
|---|---|---|
| beau | **bel** | belle |
| nouveau | **nouvel** | nouvelle |
| vieux | **vieil** | vieille |

:::ex 母音の前の男性第2形
un beau garçon | アン・ボー・ギャルソン | 美しい少年
un bel homme | アン・ベ・ロム | 美しい男性（h の前）
un nouvel ami | アン・ヌーヴェ・ラミ | 新しい友人
un vieil arbre | アン・ヴィエイ・ヤルブル | 古い木
:::

理由は**発音**です。beau homme だと母音が2つ続いて言いにくい。子音 l を挟むことで滑らかにつながります（アンシェヌマンが働く）。エリジオンやリエゾンと同じ、**母音の衝突を避ける**という原理から出ています。

なお複数形では通常の形に戻ります：[[de beaux hommes\|ドゥ・ボー・ゾム\|美しい男性たち]]（リエゾンで解決するため）。
:::

## 4. 複数形の作り方

| 語尾 | 複数形 | 例 |
|---|---|---|
| 原則 | -s を足す | grand → grands |
| -s, -x で終わる | 変化なし | [[gris\|グリ\|灰色の]] → gris、heureux → heureux |
| -eau | -x を足す | beau → beaux、nouveau → nouveaux |
| -al | -aux | [[national\|ナスィオナル]] → nationaux、[[amical\|アミカル\|友好的な]] → amicaux |

:::note -al → -aux の例外
名詞と同じく、いくつかの形容詞は -als になります：**banal, fatal, final, natal, naval, glacial**。
[[des combats navals\|デ・コンバ・ナヴァル\|海戦]]

なお女性複数は規則どおりです：nationale → nationales（-aux になるのは男性複数だけ）。
:::

## 5. 形容詞の位置 — 原則は後置

**フランス語の形容詞は、原則として名詞の後ろに置かれます。** 英語と逆なので、最初は違和感がありますが、これが多数派です。

:::ex 後置が原則
un livre intéressant | アン・リーヴル・アンテレサン | 面白い本
une voiture rouge | ユヌ・ヴォワテュール・ルージュ | 赤い車
un étudiant japonais | アン・ネテュディアン・ジャポネ | 日本人の学生
une robe élégante | ユヌ・ローブ・エレガント | 上品なドレス
:::

**必ず後置される形容詞**は、次の性質を持つものです。

| 種類 | 例 |
|---|---|
| 色 | rouge, bleu, vert, noir, blanc |
| 形 | rond（丸い）, carré（四角い） |
| 国籍・宗教 | japonais, français, chrétien |
| 分類・関係 | politique, économique, national |
| 動詞から来た形容詞（分詞由来） | intéressant, fatigué, cassé |
| 長い形容詞 | intéressant, extraordinaire |

いずれも**客観的で、その名詞を他から区別する情報**です。「どんな車か」を絞り込む働きをしています。

## 6. 前置される形容詞

一方、**短くて日常的な、主観的な評価を表す形容詞**は名詞の前に置かれます。数は限られているので、まとめて覚えられます。

:::note 前置される主な形容詞
**beau, bon, grand, gros, jeune, joli, long, mauvais, nouveau, petit, vieux, vrai, haut**

英語圏では **BAGS**（Beauty, Age, Goodness, Size）という語呂で覚えます。美・年齢・良し悪し・大きさ——**主観的な価値判断**の形容詞が前に来る、と整理できます。
:::

:::ex 前置される形容詞
un petit chien | アン・プティ・シアン | 小さな犬
une belle maison | ユヌ・ベル・メゾン | 美しい家
un bon vin | アン・ボン・ヴァン | 良いワイン
une jeune fille | ユヌ・ジュヌ・フィーユ | 若い娘
:::

:::warn 前置すると des が de になる
第2章で扱った規則です。複数の不定冠詞 des は、形容詞が前に来ると de に変わります（書き言葉）。

- des livres intéressants（後置 → des のまま）
- **de** beaux livres（前置 → de に変わる）
:::

## 7. 位置で意味が変わる形容詞

:::deep 同じ形容詞が、位置によって別の意味になる
これは大学レベルで必ず問われる項目です。

| 形容詞 | 前置（主観的・比喩的） | 後置（客観的・本来の意味） |
|---|---|---|
| **ancien** | 元〜、かつての：un ancien professeur（元教師） | 古い、古代の：un meuble ancien（古い家具） |
| **cher** | 親愛なる：mon cher ami（親愛なる友） | 高価な：une voiture chère（高い車） |
| **grand** | 偉大な：un grand homme（偉人） | 背が高い：un homme grand（長身の男） |
| **pauvre** | 気の毒な：un pauvre homme（哀れな男） | 貧しい：un homme pauvre（貧乏な男） |
| **propre** | 自分自身の：mon propre livre（私自身の本） | 清潔な：une chemise propre（きれいなシャツ） |
| **seul** | 唯一の：le seul homme（唯一の男） | 孤独な：un homme seul（一人でいる男） |
| **certain** | ある種の：un certain charme（ある種の魅力） | 確実な：une victoire certaine（確実な勝利） |
| **dernier** | 最後の：la dernière semaine（最後の週） | 先週の：la semaine dernière（先週） |
| **prochain** | 次の：le prochain train（次の列車） | 来〜：la semaine prochaine（来週） |
| **différent** | さまざまな：différentes idées（いろいろな考え） | 異なる：des idées différentes（違う考え） |
| **brave** | 立派な：un brave homme（善良な男） | 勇敢な：un homme brave（勇敢な男） |

**一貫した原理があります。**

- **後置** … 名詞が本来持つ客観的な性質を述べる。名詞を他から**区別する**
- **前置** … 話し手の主観的な評価や、比喩的・抽象的な意味を加える。名詞と**一体化して1つの概念**を作る

un grand homme が「偉人」になるのは、grand が身長という物理的性質ではなく、価値判断として名詞と融合しているからです。この原理を掴めば、表を丸暗記する必要はありません。
:::

## 8. 形容詞が複数あるとき

:::adv 2つ以上の形容詞をどう並べるか
それぞれの形容詞が本来の位置に従います。

- 両方とも後置 → et でつなぐ：[[une robe longue et élégante\|ユヌ・ローブ・ロング・エ・エレガント\|長くて上品なドレス]]
- 前置と後置 → それぞれの位置へ：[[un joli livre rouge\|アン・ジョリ・リーヴル・ルージュ\|きれいな赤い本]]
- 両方とも前置 → et でつなぐか並べる：[[un beau petit village\|アン・ボー・プティ・ヴィラージュ\|美しい小さな村]]

なお、後置の形容詞が2つ以上あるときは、**名詞との結びつきが強いものから先に**置きます。
[[la politique économique française\|ラ・ポリティック・エコノミック・フランセーズ\|フランスの経済政策]]
（économique が politique と強く結びつき、その全体を française が修飾する）
:::

## 9. 色と国籍 — 実務で最初に必要な形容詞群

:::deep 色の形容詞の特殊規則
色は形容詞の代表ですが、2つの例外規則があります。

**（1）名詞由来の色は不変化**

orange（オレンジ）、marron（栗＝茶色）など、**物の名前をそのまま色に使ったものは一致しません**。

- des chaussures **marron**（茶色い靴——marron のまま）
- des robes **orange**（オレンジのドレス）

一致する普通の色（bleu / vert / noir / blanc / rouge / jaune / gris）と区別してください。

**（2）複合色も不変化**

- des yeux **bleu clair**（明るい青の目——bleu**s** としない）
- une jupe **vert foncé**（深緑のスカート）

clair（明るい）/ foncé（濃い）が付くと全体が不変化になります。

**国籍の形容詞**は小文字で書きます（名詞として「〜人」を言うときは大文字）。

- Elle est **japonaise**.（形容詞・小文字）
- C'est une **Japonaise**.（名詞・大文字）

日本語話者は大文字小文字の区別を落としがちですが、フランス語では**形容詞は常に小文字**です（英語の Japanese と違う点）。
:::

## 10. 副詞への転換

:::deep 形容詞から副詞を作る
**女性形に -ment を付ける**のが基本規則です。

| 形容詞（男性） | 女性形 | 副詞 |
|---|---|---|
| lent（遅い） | lente | [[lentement\|ラントマン\|ゆっくりと]] |
| heureux（幸せな） | heureuse | [[heureusement\|ウルーズマン\|幸いにも]] |
| doux（優しい） | douce | [[doucement\|ドゥースマン\|そっと]] |

**例外**

- 母音で終わる形容詞 → 男性形に直接：vrai → [[vraiment\|ヴレマン\|本当に]]、poli → poliment
- -ant / -ent → -amment / -emment：constant → [[constamment\|コンスタマン\|絶えず]]、évident → [[évidemment\|エヴィダマン\|明らかに]]
  （どちらも「アマン」と発音される点に注意）
- 不規則：bon → [[bien\|ビアン\|よく]]、mauvais → [[mal\|マル\|悪く]]、meilleur → [[mieux\|ミュー\|より良く]]

**副詞は一致しません。** 形容詞と副詞を取り違えると、一致するかどうかで誤りが出ます。
- [[Elle est bonne.\|エ・レ・ボンヌ\|彼女は良い。]]（形容詞 → 一致する）
- [[Elle chante bien.\|エル・シャント・ビアン\|彼女は上手に歌う。]]（副詞 → 一致しない）
:::


:::ai-gen 形容詞の性数一致、形容詞の位置、位置で意味が変わる形容詞

## 11. 前置形容詞の中身 — BAGS で整理する

名詞の前に置く形容詞（§6）は、英語圏の教室で **BAGS** と呼ばれる4グループで整理されています。

| 頭文字 | グループ | 形容詞 |
|---|---|---|
| **B**eauty（美） | 美しさ | beau, joli |
| **A**ge（年齢） | 新旧・老若 | jeune, vieux, nouveau, ancien |
| **G**oodness（善悪） | 良し悪し | bon, mauvais, meilleur |
| **S**ize（大小） | 大きさ | grand, petit, gros, long, haut |

これに **premier / dernier / autre / même**（順序・同一性）を加えれば、前置形容詞はほぼ網羅できます。**短くて頻度が高く、評価的な意味**——という共通点があり、名詞と一体化して1つの概念を作ります（une **petite** maison「小さな家」はほぼ1語の感覚）。

:::warn 前置形容詞の前では des が de になる
複数の前置形容詞の前では、不定冠詞 **des が de に**変わります（第2章）。

- des idées → **de bonnes** idées（よい考え）
- des amis → **de vieux** amis（旧友）
- des fleurs → **de jolies** fleurs（きれいな花）

話し言葉では des bonnes idées も聞かれますが、**書き言葉では de** が規範です。なお「形容詞 + 名詞」が熟語化している場合は des のまま：des **jeunes gens**(若者たち)、des **petits pois**（グリーンピース）。熟語は1つの名詞扱いになるからです。
:::

## 12. 形容詞の副詞的用法と最上級の位置

**（1）不変化で副詞になる形容詞**（第6.5章§4の予告）

- parler **fort / bas**、coûter **cher**、sentir **bon**、travailler **dur**、chanter **juste / faux**

動詞に直接付くとき、これらは**一致しません**：Elles parlent **fort**.（× fortes）。形容詞の形をした副詞なので、動詞にかかっていることを確認してください。

**（2）最上級の位置は形容詞の定位置に従う**（第14章の先取り）

最上級 le plus / le moins + 形容詞は、**その形容詞が本来置かれる位置**に置かれます。

| 形容詞の位置 | 最上級 | 例 |
|---|---|---|
| 後置形容詞 | 名詞の後（定冠詞が2回） | la ville **la plus** belle de France |
| 前置形容詞 | 名詞の前（定冠詞は1回） | **la plus** belle ville de France |

**beau は前置形容詞**なので la plus belle ville が自然ですが、後置しても文法的には正しく、その場合 la ville la plus belle と定冠詞が2つ現れます。**intéressant のような後置形容詞では必ず2つ**になります：le livre **le plus** intéressant。

:::ex 最上級と位置
C'est la plus grande ville du pays. | セ・ラ・プリュ・グランド・ヴィル・デュ・ペイ | 国で一番大きな町だ。（前置）
C'est le film le plus intéressant de l'année. | セ・ル・フィルム・ル・プリュ・ザンテレサン | 今年一番面白い映画だ。（後置・定冠詞2つ）
Il a acheté la voiture la moins chère. | ラ・ヴォワチュール・ラ・モワン・シェール | 彼は一番安い車を買った。
:::

**「〜の中で」は de** で表します（× dans）：le plus grand **de** la classe（クラスで一番大きい）。英語の in と違うので注意してください。

この2つは「修飾する語」という点では兄弟ですが、修飾する相手も、変化するかどうかも、文の中のどこに置くかも違います。形容詞を学び終えたいまが、副詞を体系的に押さえる最良のタイミングです。

そして副詞には、日本語話者がフランス語を書くときに**最も高い頻度で間違える箇所**が集中しています。とくに次の2つです。

## 1. 副詞とは何か — 形容詞との対比

まず、形容詞と副詞の違いを表で確定させます。

| | 形容詞 adjectif | 副詞 adverbe |
|---|---|---|
| 修飾する相手 | **名詞・代名詞**のみ | **動詞・形容詞・副詞・文全体** |
| 性数一致 | **する**（grand / grande / grands / grandes） | **しない**（常に1つの形） |
| 典型的な位置 | 名詞の後（一部は前） | 相手によって変わる（§6） |
| 属詞になれるか | なれる（Il est grand.） | なれない |

:::ex 形容詞と副詞を並べる
C'est une voiture rapide. | セ・チュヌ・ヴォワチュール・ラピッド | それは速い車だ。（形容詞 rapide が名詞 voiture を修飾）
Cette voiture roule rapidement. | セット・ヴォワチュール・ルール・ラピッドマン | この車は速く走る。（副詞 rapidement が動詞 roule を修飾）
Il est très rapide. | イ・レ・トレ・ラピッド | 彼はとても速い。（副詞 très が形容詞 rapide を修飾）
Il court très rapidement. | イル・クール・トレ・ラピッドマン | 彼はとても速く走る。（副詞 très が副詞 rapidement を修飾）
Heureusement, il est arrivé. | ウルーズマン・イ・レ・タリヴェ | 幸いにも、彼は到着した。（副詞 heureusement が文全体を修飾）
:::

:::note 「不変化」であることの実際的な意味
副詞は性数一致しません。これは覚える負担が軽いということですが、**書くときにうっかり s を付けてしまう**という誤りにつながります。

- ○ Elles parlent **bien**.（彼女たちは上手に話す）
- × Elles parlent **biens**.

一致するのは形容詞であって、副詞ではありません。「動詞にかかっているか、名詞にかかっているか」を毎回確認する癖をつけてください。判断に迷ったら、**その語を消して意味が成り立つ相手**を探します。
:::

## 2. 形容詞から副詞を作る — -ment

フランス語の副詞の大部分は、形容詞に **-ment** を付けて作ります。英語の -ly にあたります。規則は3つあり、**形容詞の語末で決まります**。

### 規則1 — 女性形に -ment を付ける（基本）

これが最も基本の規則です。男性形ではなく、**女性形**が土台になります。

| 形容詞（男性） | 女性形 | 副詞 |
|---|---|---|
| lent（遅い） | lente | **lentement** |
| doux（やさしい） | douce | **doucement** |
| heureux（幸せな） | heureuse | **heureusement** |
| sérieux（まじめな） | sérieuse | **sérieusement** |
| naturel（自然な） | naturelle | **naturellement** |
| premier（第一の） | première | **premièrement** |
| franc（率直な） | franche | **franchement** |
| actif（活動的な） | active | **activement** |
| complet（完全な） | complète | **complètement** |
| long（長い） | longue | **longuement** |

:::deep なぜ女性形なのか — -ment の正体
-ment はラテン語の名詞 **mens**（心・精神）の奪格 **mente**（「〜な心で」）が語尾化したものです。もともとは2語で、

**clara mente**（明らかな心で）→ clairement（明らかに）

という形でした。mens は**女性名詞**なので、それにかかる形容詞は女性形（clara）になります。**副詞の -ment が女性形に付くのは、-ment が元は女性名詞だったから**です。

この由来が分かると、次の3つがひとまとまりに理解できます。

- 女性形に付くこと（§規則1）
- 意味が「様態」に偏ること（「〜な心で」なので）
- イタリア語 -mente、スペイン語 -mente と同じ形であること（同じラテン語起源）

丸暗記の項目が1つ減ります。
:::

### 規則2 — 男性形が母音で終わるなら、そのまま -ment

男性形が **-i, -é, -u, -ai** など母音で終わる形容詞は、女性形を経由せず**男性形にそのまま**付けます。

| 形容詞（男性） | 副詞 | 注意 |
|---|---|---|
| vrai（本当の） | **vraiment** | vraiement ではない |
| poli（礼儀正しい） | **poliment** | polie**ment** ではない |
| absolu（絶対の） | **absolument** | |
| passionné（情熱的な） | **passionnément** | é が入る（後述） |
| aisé（容易な） | **aisément** | |
| joli（かわいい） | **joliment** | |

:::warn 女性形の e が消えたのは歴史のなごり
poli の女性形は polie ですが、副詞は poliment であって poliement ではありません。かつては polieme<span>nt</span> のように書かれましたが、母音の連続で e が発音されなくなり、綴りからも落ちました。

**発音が消えたから綴りも消えた**——フランス語の綴りの変化には、この型が多くあります。
:::

### 規則3 — -ant / -ent は -amment / -emment

形容詞が **-ant** で終われば **-amment**、**-ent** で終われば **-emment** になります。

| 形容詞 | 副詞 | 意味 |
|---|---|---|
| constant | **constamment** | 絶えず |
| courant | **couramment** | 流暢に |
| bruyant | **bruyamment** | 騒々しく |
| suffisant | **suffisamment** | 十分に |
| évident | **évidemment** | 明らかに |
| récent | **récemment** | 最近 |
| prudent | **prudemment** | 慎重に |
| patient | **patiemment** | 辛抱強く |
| violent | **violemment** | 激しく |
| fréquent | **fréquemment** | 頻繁に |

:::warn -amment と -emment は同じ音
綴りは違いますが、**どちらも [amɑ̃]「アマン」と発音します**。

- constamment 「コンスタマン」
- évidemment 「エヴィダマン」（× エヴィドゥマン）

つまり **-emment の e は「ア」と読む**という、フランス語では例外的な読み方をします。耳から入れると綴りを間違え、目から入れると発音を間違える——両方向で危険な箇所です。

:::ex -emment の読み方を確認する
Il parle couramment le français. | イル・パルル・クーラマン・ル・フランセ | 彼はフランス語を流暢に話す。
Évidemment, tu as raison. | エヴィダマン・チュ・ア・レゾン | もちろん、君が正しい。
Elle conduit prudemment. | エル・コンデュイ・プリュダマン | 彼女は慎重に運転する。
Je l'ai vu récemment. | ジュ・レ・ヴュ・レサマン | 最近、彼に会った。
Il m'a répondu violemment. | イル・マ・レポンデュ・ヴィオラマン | 彼は激しく私に言い返した。
:::

なお **lent**（遅い）は -ent で終わりますが、これは規則3の例外で **lentement**（規則1）です。lent は「レント」ではなく「ラン」で、-ent が語尾ではなく語幹の一部だからです。
:::

### 規則の例外 — é が入る型と、まったくの不規則

**（1）女性形の e が é になる型**

いくつかの形容詞は、-ment の前の e が **é** になります。これは発音を保つための調整です。

| 形容詞 | 副詞 |
|---|---|
| précis | **précisément**（正確に） |
| profond | **profondément**（深く） |
| énorme | **énormément**（非常に） |
| commun | **communément**（一般に） |
| confus | **confusément**（漠然と） |
| aveugle | **aveuglément**（盲目的に） |
| intense | **intensément**（激しく） |
| uniforme | **uniformément**（一様に） |

**（2）完全な不規則**

| 形容詞 | 副詞 | 注意 |
|---|---|---|
| gentil（親切な） | **gentiment** | gentillement ではない |
| bref（短い） | **brièvement** | 女性形 brève からでもない |
| traître（裏切りの） | **traîtreusement** | |
| grave（重大な） | **gravement** / **grièvement** | grièvement は負傷にのみ使う |

:::tip 覚える順序
-ment 副詞は数が多いので、**規則を覚えて自分で作れるようにする**のが正解です。丸暗記すべきは上の不規則リスト（10語程度）だけ。あとは次の3つの質問を順に当てるだけで作れます。

1. 語末は -ant / -ent か → **-amment / -emment**（ただし lent は例外）
2. 男性形が母音で終わるか → **男性形 + ment**
3. それ以外 → **女性形 + ment**
:::

### -ment 副詞が作れない形容詞

すべての形容詞が -ment 副詞を持つわけではありません。**content**（満足した）、**fâché**（怒った）、**charmant**（魅力的な）などは、-ment 形が存在しないか、あってもほとんど使われません。この場合は迂言的な言い方をします。

| 言い方 | 例 |
|---|---|
| **d'une manière + 形容詞（女性形）** | d'une manière charmante（魅力的に） |
| **d'une façon + 形容詞（女性形）** | d'une façon étrange（奇妙なやり方で） |
| **avec + 抽象名詞** | avec patience（辛抱強く）＝ patiemment |
| **sans + 抽象名詞** | sans difficulté（難なく） |

:::ex 迂言的な副詞表現
Il a répondu d'une manière très polie. | イ・ラ・レポンデュ・デュヌ・マニエール・トレ・ポリ | 彼はとても丁寧なやり方で答えた。
Elle travaille avec patience. | エル・トラヴァイユ・アヴェック・パスィヤンス | 彼女は辛抱強く働く。
Il l'a fait sans difficulté. | イル・ラ・フェ・サン・ディフィキュルテ | 彼はそれを難なくやった。
Ils vivent d'une façon très simple. | イル・ヴィーヴ・デュヌ・ファソン・トレ・サンプル | 彼らはとても質素に暮らしている。
:::

**avec + 無冠詞の抽象名詞**は、-ment 副詞があっても書き言葉でよく選ばれます。avec patience と patiemment は交換可能ですが、前者のほうがやや改まった響きです。

## 3. -ment を持たない副詞 — 本来の副詞

-ment 副詞は形容詞から作った「二次的な」副詞です。これとは別に、**最初から副詞である語**があり、こちらのほうが使用頻度は圧倒的に高くなります。

| 種類 | 語 |
|---|---|
| 様態 | **bien**（よく）、**mal**（悪く）、**vite**（速く）、ainsi（このように）、ensemble（一緒に）、debout（立って）、exprès（わざと） |
| 量・程度 | **très**、**beaucoup**、**peu**、**assez**、**trop**、si、tant、tellement、plus、moins、autant、presque、environ、tout |
| 時 | hier、**aujourd'hui**、demain、**maintenant**、**déjà**、**encore**、**toujours**、**souvent**、**jamais**、parfois、quelquefois、rarement、tôt、tard、bientôt、enfin、d'abord、ensuite、puis、alors、longtemps |
| 場所 | **ici**、**là**、là-bas、ailleurs、partout、dehors、dedans、dessus、dessous、devant、derrière、loin、près |
| 肯定・否定 | **oui**、**si**、**non**、peut-être、sans doute、certainement、bien sûr、volontiers |

太字は最頻出のものです。**この表の語を先に固めるほうが、-ment 副詞を大量に覚えるより実用的**です。

:::warn oui と si — 「はい」が2つある理由
フランス語には肯定の返事が2つあります。

- **oui** — ふつうの疑問文に対する「はい」
- **si** — **否定疑問文を否定して**「いいえ、そうです」

:::ex oui と si の使い分け
Tu viens ? — Oui, je viens. | チュ・ヴィアン・ウィ・ジュ・ヴィアン | 来る？ — うん、行く。
Tu ne viens pas ? — Si, je viens ! | チュ・ヌ・ヴィアン・パ・スィ・ジュ・ヴィアン | 来ないの？ — いや、行くよ！
Tu ne viens pas ? — Non, je ne viens pas. | チュ・ヌ・ヴィアン・パ・ノン・ジュ・ヌ・ヴィアン・パ | 来ないの？ — うん、行かない。
:::

日本語の「はい／いいえ」は**相手の発言に同意するかどうか**を答えますが、フランス語（および英語）は**事実が肯定か否定か**を答えます。「来ないの？」に対して「行く」なら **si**、「行かない」なら **non** です。日本語の感覚では逆転して見えるので、注意が要ります。

なお、この si は接続詞の si（もし）や、程度の si（そんなに）とは別語です。
:::

## 4. 形容詞が副詞として働く場合

いくつかの形容詞は、特定の動詞と組んで**そのままの形で副詞のように**使われます。このとき**一致しません**。

| 表現 | 意味 |
|---|---|
| parler **bas** / **haut** / **fort** | 小声で／大声で／強く話す |
| coûter **cher** | 値段が高い |
| sentir **bon** / **mauvais** | いい匂い／悪い匂いがする |
| travailler **dur** | 懸命に働く |
| chanter **juste** / **faux** | 正しい音程で／音を外して歌う |
| voir **clair** | はっきり見える |
| marcher **droit** | まっすぐ歩く |
| aller **vite** | 速く行く |
| s'arrêter **net** | ぴたりと止まる |

:::ex 形容詞の副詞的用法 — 一致しない
Ces fleurs sentent bon. | セ・フルール・サント・ボン | この花はいい匂いがする。（bonnes ではない）
Elles parlent trop fort. | エル・パルル・トロ・フォール | 彼女たちは大声で話しすぎる。（fortes ではない）
Ces chaussures coûtent cher. | セ・ショスュール・クート・シェール | この靴は高い。（chères ではない）
Elles travaillent dur. | エル・トラヴァイユ・デュール | 彼女たちは懸命に働く。（dures ではない）
:::

:::warn bon / bien と mauvais / mal の区別
日本語話者が特に混同しやすい組です。**形容詞か副詞か**で決まります。

| | 形容詞（名詞にかかる・属詞） | 副詞（動詞にかかる） |
|---|---|---|
| 良い | **bon** / bonne | **bien** |
| 悪い | **mauvais** / mauvaise | **mal** |

- C'est un **bon** livre.（良い本だ）／ Il écrit **bien**.（彼は上手に書く）
- C'est **mauvais**.（まずい）／ Il chante **mal**.（彼は下手に歌う）

ただし上の表のとおり、sentir bon / sentir mauvais は動詞に付いても bon / mauvais を使う**慣用**です。「匂いがする」は「良い匂いという性質を発している」という感覚で、属詞に近い扱いになっているためです。
:::

## 5. 意味による分類

副詞を6つに分けて整理します。**分類ごとに文中の位置が違う**ので、この分類は暗記のためではなく§6の準備として必要です。

### （1）様態の副詞 — どのように

bien, mal, vite, ainsi, ensemble, および -ment 副詞の大部分。**動詞を修飾**します。

### （2）量・程度の副詞 — どれくらい

très, beaucoup, peu, assez, trop, si, tant, tellement, plus, moins, presque, environ。**動詞・形容詞・副詞のいずれも修飾**でき、使い分けが難しいので §8 で独立して扱います。

### （3）時の副詞 — いつ

hier, aujourd'hui, demain, maintenant, déjà, encore, toujours, souvent, jamais, tôt, tard, bientôt, longtemps。

### （4）場所の副詞 — どこで

ici, là, là-bas, ailleurs, partout, dehors, dedans, loin, près。代名詞の **y**（第26章）も場所を受ける点で近い働きをします。

### （5）肯定・否定・疑問の副詞

oui, si, non, ne … pas, ne … jamais, peut-être, sans doute, certainement。

### （6）文修飾の副詞 — 話し手の態度

**文全体にかかり、話し手の判断や態度を表します**。動詞1語ではなく命題全体を評価するので、位置も文頭・文末に偏ります。

| 副詞 | 意味 |
|---|---|
| heureusement | 幸いにも |
| malheureusement | 残念ながら |
| évidemment | 明らかに、もちろん |
| apparemment | どうやら |
| franchement | 率直に言って |
| honnêtement | 正直なところ |
| naturellement | 当然 |
| effectivement | 実際 |

:::ex 文修飾の副詞
Heureusement, personne n'a été blessé. | ウルーズマン・ペルソンヌ・ナ・エテ・ブレセ | 幸いにも、誰も怪我をしなかった。
Franchement, je ne comprends pas. | フランシュマン・ジュ・ヌ・コンプラン・パ | 率直に言って、私には分からない。
Apparemment, il ne viendra pas. | アパラマン・イル・ヌ・ヴィアンドラ・パ | どうやら彼は来ないようだ。
Malheureusement, c'est trop tard. | マルルーズマン・セ・トロ・タール | 残念ながら、もう遅すぎる。
:::

:::deep 同じ副詞が2つの働きを持つ
同じ -ment 副詞が、位置によって様態にも文修飾にもなります。

- Il a répondu **franchement**.（彼は率直に答えた）→ **様態**。答え方が率直
- **Franchement**, il a répondu.（率直に言って、彼は答えた）→ **文修飾**。話し手が率直

英語の *Frankly, he answered* と *He answered frankly* の対立と同じです。**文頭でコンマを伴えば文修飾、動詞の後ろなら様態**——この対応はほぼ例外なく成り立ちます。
:::

## 6. 副詞の位置 — この章の核心

副詞をどこに置くかは、**修飾する相手が何か**で決まります。順に確定させます。

### （1）形容詞・副詞を修飾するとき → 必ず直前

例外はありません。

:::ex 修飾する語の直前
Elle est très intelligente. | エ・レ・トレ・ザンテリジャント | 彼女はとても頭がいい。
Il conduit trop vite. | イル・コンデュイ・トロ・ヴィット | 彼は運転が速すぎる。
C'est assez difficile. | セ・タセ・ディフィスィル | それはかなり難しい。
Tu parles bien trop fort. | チュ・パルル・ビヤン・トロ・フォール | 君は本当に声が大きすぎる。
:::

### （2）単純時制の動詞を修飾するとき → 動詞の**直後**

**主語と動詞の間には絶対に入れません。** ここが英語との最大の違いです。

:::warn 英語からの類推が効かない箇所
- 英 He **often** goes to Paris.
- 仏 Il va **souvent** à Paris.（× Il souvent va）

英語は主語と動詞の間に頻度の副詞を置きますが、**フランス語ではその位置が空いていません**。副詞は動詞の後ろに回ります。

:::ex 単純時制 — 動詞の直後
Il parle bien français. | イル・パルル・ビヤン・フランセ | 彼はフランス語を上手に話す。
Nous allons souvent au cinéma. | ヌー・ザロン・スーヴァン・トー・スィネマ | 私たちはよく映画に行く。
Elle travaille beaucoup. | エル・トラヴァイユ・ボクー | 彼女はよく働く。
Je comprends mal cette phrase. | ジュ・コンプラン・マル・セット・フラーズ | この文がよく分からない。
Tu manges trop. | チュ・マンジュ・トロ | 君は食べすぎだ。
:::
:::

目的語がある場合、副詞は**動詞と目的語の間**に入ります。これも英語と違います。

- 仏 Il parle **bien** le français.（動詞 — 副詞 — 目的語）
- 英 He speaks French **well**.（動詞 — 目的語 — 副詞）

### （3）複合時制の動詞を修飾するとき → 副詞によって2通り

複合過去などの複合時制では、副詞が**助動詞と過去分詞の間**に入るか、**過去分詞の後ろ**に来るかが分かれます。

| 助動詞と過去分詞の**間** | 過去分詞の**後ろ** |
|---|---|
| 短くて頻度の高い副詞 | 長い -ment 副詞 |
| bien, mal, vite, déjà, encore, toujours, souvent, jamais, beaucoup, peu, trop, assez, presque, enfin, sans doute, peut-être | lentement, poliment, rapidement, sérieusement, tranquillement など |

:::ex 助動詞と過去分詞の間に入る型
Il a bien mangé. | イ・ラ・ビヤン・マンジェ | 彼はよく食べた。
J'ai beaucoup aimé ce film. | ジェ・ボクー・ペメ・ス・フィルム | この映画がとても気に入った。
Elle a déjà fini. | エ・ラ・デジャ・フィニ | 彼女はもう終えた。
Nous avons trop bu. | ヌー・ザヴォン・トロ・ビュ | 私たちは飲みすぎた。
Il n'a jamais compris. | イル・ナ・ジャメ・コンプリ | 彼は一度も理解しなかった。
Tu as presque réussi. | チュ・ア・プレスク・レユスィ | 君はもう少しで成功していた。
:::

:::ex 過去分詞の後ろに置く型
Il a répondu poliment. | イ・ラ・レポンデュ・ポリマン | 彼は丁寧に答えた。
Elle a marché lentement. | エ・ラ・マルシェ・ラントマン | 彼女はゆっくり歩いた。
Ils ont travaillé sérieusement. | イル・ゾン・トラヴァイエ・セリューズマン | 彼らはまじめに働いた。
:::

:::tip 見分け方の目安
**音節が2つ以下の副詞は間に入り、3つ以上の -ment 副詞は後ろに回る**——これでほぼ当たります。

例外的に、長い副詞でも**強調したいとき**は間に置けます。Il a **complètement** oublié.（彼はすっかり忘れていた）は完全に自然な文です。逆は成り立たず、bien や déjà を過去分詞の後ろに置くことはできません（× Il a mangé bien）。

つまり「間」は広く許され、「後ろ」は長い副詞に限られる、という非対称があります。**迷ったら間に置く**ほうが安全です。
:::

### （4）時・場所の副詞 → 文頭または文末

時と場所の副詞は動詞1語ではなく**文全体の枠組み**を示すので、間には入らず、文の外側に置かれます。

:::ex 時・場所の副詞
Hier, je suis allé au marché. | イエール・ジュ・スュイ・ザレ・オ・マルシェ | 昨日、市場へ行った。
Je suis allé au marché hier. | ジュ・スュイ・ザレ・オ・マルシェ・イエール | 市場へ行った、昨日。
Ici, on parle français. | イスィ・オン・パルル・フランセ | ここではフランス語を話します。
Il l'a trouvé là-bas. | イル・ラ・トルヴェ・ラ・バ | 彼はそれをあそこで見つけた。
:::

× Je suis **hier** allé は誤りです。ただし **déjà, encore, toujours, souvent, jamais** など「時」に分類される副詞でも短いものは間に入ります（Il est **déjà** parti.）。「時の副詞は外」という規則は、**hier / aujourd'hui / demain / maintenant のような時点を指す語**に当てはまるものと理解してください。

### （5）文修飾の副詞 → 文頭（コンマ付き）が基本

§5（6）で見たとおりです。文末に置くこともできます（Il ne viendra pas, apparemment.）。

### （6）不定詞を修飾するとき

不定詞の**前**に置くのが基本ですが、長い -ment 副詞は後ろに来ます。

:::ex 不定詞との組み合わせ
Il faut bien manger. | イル・フォ・ビヤン・マンジェ | ちゃんと食べなければならない。
Je vais souvent le voir. | ジュ・ヴェ・スーヴァン・ル・ヴォワール | 私はよく彼に会いに行く。
Il aime parler lentement. | イ・レーム・パルレ・ラントマン | 彼はゆっくり話すのが好きだ。
Elle espère bientôt partir. | エ・レスペール・ビヤント・パルティール | 彼女はもうすぐ出発したいと思っている。
:::

:::deep tout の副詞用法 — 例外的に一致する副詞
**tout** は副詞として「まったく、すっかり」を表しますが、**副詞なのに一致することがある**という唯一の例外を持ちます。

- 男性形容詞の前 → 不変化：Il est **tout** content.（彼はすっかり満足している）
- 男性複数の前 → 不変化：Ils sont **tout** contents.
- **子音または有音の h で始まる女性形容詞の前 → 一致**：Elle est **toute** contente. / Elles sont **toutes** contentes.
- 母音または無音の h で始まる女性形容詞の前 → 不変化：Elle est **tout** étonnée.

なぜこんな規則になるのか。tout の t は本来 toute でも発音されないので、**綴りだけの問題**に見えます。しかし contente の前では **toute** と書いて「トゥット」と発音し、étonnée の前では tout がリエゾンして「トゥ・テトネ」となります。**発音上すでに t が出ているので、綴りに e を足す必要がない**——という発想です。

大学の文法では必ず問われる箇所ですが、話し言葉では違いが聞こえないため、実用上の優先順位は高くありません。
:::

## 7. 副詞と否定

否定文の中で副詞をどこに置くかは、**ne … pas という枠**との関係で決まります。

### （1）枠の中に入る

短い副詞は **pas の後ろ**、つまり否定の枠のすぐ外に置かれます。複合時制でも同様です。

:::ex 否定文の中の副詞
Il ne parle pas bien français. | イル・ヌ・パルル・パ・ビヤン・フランセ | 彼はフランス語がうまく話せない。
Je n'ai pas beaucoup dormi. | ジュ・ネ・パ・ボクー・ドルミ | あまり眠れなかった。
Elle n'a pas encore fini. | エル・ナ・パ・アンコール・フィニ | 彼女はまだ終えていない。
Nous ne sortons pas souvent. | ヌー・ヌ・ソルトン・パ・スーヴァン | 私たちはあまり外出しない。
:::

### （2）pas の代わりになる否定の副詞

**jamais, plus, guère, point** は pas と入れ替わって否定の枠を作ります。**pas と併用しません**。

| 表現 | 意味 |
|---|---|
| ne … **jamais** | 決して〜ない |
| ne … **plus** | もう〜ない |
| ne … **guère** | ほとんど〜ない（書き言葉） |
| ne … **point** | 少しも〜ない（古風・文語） |
| ne … **pas encore** | まだ〜ない |
| ne … **plus jamais** | 二度と〜ない |

:::ex 否定の副詞
Je ne fume jamais. | ジュ・ヌ・フュム・ジャメ | 私は決してタバコを吸わない。
Il n'habite plus ici. | イル・ナビット・プリュ・ズィスィ | 彼はもうここに住んでいない。
Elle ne sort guère. | エル・ヌ・ソール・ゲール | 彼女はほとんど外出しない。
Je ne le ferai plus jamais. | ジュ・ヌ・ル・フレ・プリュ・ジャメ | 二度とそれはしない。
:::

:::warn ne … pas beaucoup と ne … beaucoup pas
語順で意味が変わる組があります。

- Je n'ai **pas beaucoup** mangé.（あまり食べなかった）→ 「たくさん」を否定
- Je n'ai **beaucoup pas** mangé. → **非文**

beaucoup, trop, très などの程度の副詞は、**必ず pas の後ろ**に来ます。逆順は作れません。

一方、**否定の作用域**が変わる例はあります。

- Il ne travaille pas **toujours**.（彼はいつも働いているわけではない）→ 部分否定
- Il ne travaille **jamais**.（彼は決して働かない）→ 全否定

toujours を pas の後ろに置くと「常にそうとは限らない」という部分否定になります。**「いつも〜ない」と言いたいなら jamais を使います。**
:::

### （3）aussi と non plus

「〜も」を表す **aussi** は、否定文では **non plus** に変わります。英語の *too* / *(n)either* と同じ対立です。

:::ex aussi と non plus
Moi aussi, j'aime le café. | モワ・オスィ・ジェーム・ル・カフェ | 私もコーヒーが好きです。
Moi non plus, je n'aime pas le café. | モワ・ノン・プリュ・ジュ・ネーム・パ・ル・カフェ | 私もコーヒーは好きではありません。
Il ne vient pas, et elle non plus. | イル・ヌ・ヴィアン・パ・エ・エル・ノン・プリュ | 彼は来ないし、彼女も来ない。
:::

× Moi aussi, je n'aime pas … は誤りです。**否定文に aussi は使えません。**

## 8. 量・程度の副詞 — 最も間違えやすい領域

日本語の「とても」「たくさん」「あまり」は、フランス語では**修飾する相手によって別の語**になります。ここが日本語話者の誤りの最大の温床です。

### très と beaucoup

| | 修飾する相手 | 例 |
|---|---|---|
| **très** | **形容詞・副詞** | très grand、très vite |
| **beaucoup** | **動詞・名詞（de つき）** | travailler beaucoup、beaucoup de livres |

:::warn J'aime très は言えない
- × J'aime **très** ce film.
- ○ J'aime **beaucoup** ce film.（この映画がとても好きだ）

aimer は**動詞**なので、修飾するのは beaucoup です。très は形容詞・副詞専用です。

同様に、

- × Il est **beaucoup** grand. → ○ Il est **très** grand.
- × **très** beaucoup → ○ **beaucoup**（très と beaucoup は重ねられない）

「とても」という日本語1語が、相手によって très と beaucoup に分かれる——これを最初に固定してください。
:::

:::deep avoir très faim — 例外に見えるが例外ではない
規則どおりなら très は名詞を修飾できないはずですが、次の言い方は正しいフランス語です。

[[J'ai très faim.|ジェ・トレ・ファン|とてもお腹が空いた。]]
[[Il a très peur.|イ・ラ・トレ・プール|彼はとても怖がっている。]]
[[Elle a très envie de partir.|エ・ラ・トレ・ザンヴィ・ドゥ・パルティール|彼女はとても出発したがっている。]]

これは **avoir faim / avoir peur / avoir envie / avoir soif / avoir sommeil / avoir mal** など、**avoir + 無冠詞名詞**の慣用句に限られます。無冠詞名詞がほぼ形容詞のように振る舞っている（「空腹だ」という状態を表す）ため、très が付けるようになりました。

一方、名詞らしさが残る場合は beaucoup を使います。

- J'ai **beaucoup de** courage.（勇気がたくさんある）
- J'ai **très** peur.（とても怖い）

**avoir + 無冠詞名詞のセットだけは très** と覚えれば足ります。
:::

### assez, trop, peu, un peu

| 副詞 | 意味 | 注意 |
|---|---|---|
| **assez** | かなり／十分に | 文脈で「まあまあ」にも「十分」にもなる |
| **trop** | 〜すぎる | 常に否定的評価 |
| **peu** | ほとんど〜ない | **否定的** |
| **un peu** | 少し | **肯定的** |

:::warn peu と un peu は正反対
冠詞 un が付くかどうかで、評価が反転します。

- Il travaille **peu**.（彼はほとんど働かない）→ 不足を指摘
- Il travaille **un peu**.（彼は少し働く）→ 存在を認める

英語の *little* と *a little* とまったく同じ対立です。**un が付けば「ある」、付かなければ「ない」**。

:::ex peu と un peu
Il parle peu. | イル・パルル・プー | 彼はほとんどしゃべらない。
Il parle un peu français. | イル・パルル・アン・プー・フランセ | 彼は少しフランス語を話す。
J'ai peu d'amis. | ジェ・プー・ダミ | 友達がほとんどいない。
J'ai un peu d'argent. | ジェ・アン・プー・ダルジャン | 少しお金がある。
:::
:::

### si, tant, tellement

**「そんなに」「それほど」**を表す3語です。修飾する相手で分かれます。

| 副詞 | 相手 | 例 |
|---|---|---|
| **si** | 形容詞・副詞 | Il est **si** gentil.（彼はとても親切だ） |
| **tant** | 動詞・名詞（de つき） | Il travaille **tant**.（彼はあんなに働く） |
| **tellement** | **どちらでも可** | Il est **tellement** gentil. / Il travaille **tellement**. |

つまり **tellement は si と tant の両方を兼ねます**。迷ったら tellement を使えば誤りになりません。

:::ex si / tant / tellement と結果節
Il est si fatigué qu'il ne peut plus marcher. | イ・レ・スィ・ファティゲ・キル・ヌ・プー・プリュ・マルシェ | 彼はあまりに疲れていて、もう歩けない。
Elle a tant travaillé qu'elle est tombée malade. | エ・ラ・タン・トラヴァイエ・ケ・レ・トンベ・マラッド | 彼女は働きすぎて病気になった。
J'ai tellement faim que je ne peux pas attendre. | ジェ・テルマン・ファン・ク・ジュ・ヌ・プー・パ・ザタンドル | あまりに空腹で待てない。
:::

**si / tant / tellement … que** で「あまりに〜なので…」という結果構文になります。この構文は第31.5章（接続詞と従属節）で改めて扱います。

## 9. 副詞の比較級・最上級

第14章で形容詞の比較級を学びました。**副詞も同じ形で比較できます**が、最上級で**冠詞が常に le** になる点が違います。

| | 比較級 | 最上級 |
|---|---|---|
| 形容詞 | plus grand**e** que | **la** plus grande（性数一致する） |
| 副詞 | plus vite que | **le** plus vite（常に le） |

副詞は不変化なので、最上級の冠詞も**性数によらず le で固定**です。

:::ex 副詞の比較
Il court plus vite que moi. | イル・クール・プリュ・ヴィット・ク・モワ | 彼は私より速く走る。
Elle parle moins fort que lui. | エル・パルル・モワン・フォール・ク・リュイ | 彼女は彼より小さい声で話す。
Marie chante le mieux de la classe. | マリ・シャント・ル・ミュー・ドゥ・ラ・クラス | マリはクラスで一番歌が上手だ。
C'est lui qui travaille le plus. | セ・リュイ・キ・トラヴァイユ・ル・プリュ | 一番働いているのは彼だ。
:::

### 不規則な比較級

| 副詞 | 比較級 | 最上級 |
|---|---|---|
| **bien**（よく） | **mieux** | le mieux |
| **mal**（悪く） | **plus mal** / pis | le plus mal / le pis |
| **beaucoup**（多く） | **plus** | le plus |
| **peu**（少なく） | **moins** | le moins |

:::warn meilleur と mieux
形容詞 **bon** の比較級は **meilleur**、副詞 **bien** の比較級は **mieux** です。日本語ではどちらも「よりよい／よりよく」なので混同します。

- Ce vin est **meilleur**.（このワインのほうがおいしい）→ 形容詞。名詞 vin の性質
- Il chante **mieux**.（彼のほうが歌が上手だ）→ 副詞。動詞 chante の様態

判定は§4の bon / bien の区別とまったく同じで、**名詞にかかるか動詞にかかるか**です。

pis は現代語ではほぼ使われず、慣用句 **tant pis**（しかたない）と **de mal en pis**（悪化して）に残るだけです。ふつうは plus mal を使います。
:::

## 10. よくある誤りのまとめ

:::warn 日本語話者がやりがちな8つの誤り
| × | ○ | 理由 |
|---|---|---|
| Il souvent va à Paris. | Il va **souvent** à Paris. | 主語と動詞の間に副詞は入らない（§6-2） |
| J'aime très ce film. | J'aime **beaucoup** ce film. | très は形容詞・副詞専用（§8） |
| Il est beaucoup grand. | Il est **très** grand. | beaucoup は動詞・名詞用（§8） |
| Elles parlent biens. | Elles parlent **bien**. | 副詞は不変化（§1） |
| Il a mangé bien. | Il a **bien** mangé. | 短い副詞は助動詞と過去分詞の間（§6-3） |
| Ce vin est mieux. | Ce vin est **meilleur**. | 名詞にかかるので形容詞（§9） |
| Moi aussi, je n'aime pas. | Moi **non plus**, je n'aime pas. | 否定文では non plus（§7-3） |
| Ces fleurs sentent bonnes. | Ces fleurs sentent **bon**. | 副詞的用法は一致しない（§4） |
:::

**à** と **de** という2つの前置詞は、定冠詞 **le / les** と出会うと、**必ず1語に融合します**。これを縮約（la contraction）と呼びます。

規則そのものは4つ覚えるだけですが、この縮約を知らないと、**du や des が部分冠詞なのか前置詞なのか判別できません**。第2章の宿題がここで回収されます。

## 1. 縮約の4つの形

| 前置詞 + 定冠詞 | 縮約形 | 例 |
|---|---|---|
| à + **le** | **au** | [[au cinéma\|オ・スィネマ\|映画館へ]] |
| à + **les** | **aux** | [[aux étudiants\|オ・ゼテュディアン\|学生たちに]] |
| de + **le** | **du** | [[du professeur\|デュ・プロフェスール\|先生の]] |
| de + **les** | **des** | [[des enfants\|デ・ザンファン\|子どもたちの]] |

:::warn la と l' は縮約しない
縮約が起きるのは **le と les だけ**です。

| | 縮約する？ |
|---|---|
| à + le → **au** | ○ |
| à + les → **aux** | ○ |
| à + la → **à la** | ×（そのまま） |
| à + l' → **à l'** | ×（そのまま） |

:::ex 縮約する／しない
au restaurant | オ・レストラン | レストランへ（à + le）
à la gare | ア・ラ・ガール | 駅へ（à + la、そのまま）
à l'hôtel | ア・ロテル | ホテルへ（à + l'、そのまま）
du café | デュ・カフェ | コーヒーの（de + le）
de la maison | ドゥ・ラ・メゾン | 家の（de + la、そのまま）
:::
:::

:::note なぜ le と les だけが縮約するのか
le は母音が弱い [lə]、les は [le] で、どちらも**直前の母音と融合しやすい**音です。一方 la は [la] という明瞭な母音を持ち、l' はすでにエリジオンで縮んでいるため、これ以上縮む余地がありません。

つまり縮約も、第0章で見たエリジオン・リエゾンと同じく、**母音の連続を避けようとする力**の産物です。

歴史的には au は **al**（à le）から、l が母音化して au になったものです（cheval → chevaux と同じ変化）。
:::

## 2. café au lait の au

タイトルの答えです。

- [[le café au lait\|ル・カフェ・オ・レ\|カフェオレ]] ← café **à le** lait
- [[la tarte aux pommes\|ラ・タルト・オ・ポム\|りんごのタルト]] ← tarte **à les** pommes

**à + 定冠詞**が「〜入りの、〜風の」という意味で料理名を作ります。フランス料理のメニューに au / aux が頻出するのはこのためです。

:::ex 料理名の au / aux
un sandwich au fromage | アン・サンドウィッチ・オ・フロマージュ | チーズサンドイッチ
une soupe à l'oignon | ユヌ・スープ・ア・ロニョン | オニオンスープ
une glace à la vanille | ユヌ・グラス・ア・ラ・ヴァニーユ | バニラアイス
un poulet aux herbes | アン・プーレ・オ・ゼルブ | ハーブ風味のチキン
:::

「オニオンスープ」が à l'oignon、「バニラアイス」が à la vanille なのは、oignon が母音始まり、vanille が女性名詞で、どちらも**縮約しない**からです。

## 3. du / des の正体を見分ける

:::deep 同じ形で3つの機能がある
**du** と **des** は、まったく別の3つのものが同じ綴りになったものです。ここを区別できるかが、この章の実質的な目標です。

| 形 | 正体 | 例 |
|---|---|---|
| **du**① | 部分冠詞（ある量の） | [[Je bois du café.\|ジュ・ボワ・デュ・カフェ\|コーヒーを飲む。]] |
| **du**② | de + le の縮約（所有・起点） | [[Je viens du Japon.\|ジュ・ヴィアン・デュ・ジャポン\|日本から来た。]] |
| **des**① | 不定冠詞の複数（いくつかの） | [[J'ai des amis.\|ジェ・デ・ザミ\|友人が何人かいる。]] |
| **des**② | de + les の縮約 | [[le livre des étudiants\|ル・リーヴル・デ・ゼテュディアン\|学生たちの本]] |
| **des**③ | 数量表現の de + les | [[la plupart des gens\|ラ・プリュパール・デ・ジャン\|大部分の人々]] |

**見分け方**は「de に意味があるか」です。

- **部分冠詞** … de に意味はない。冠詞そのもの。「ある量の〜」と訳せる
- **縮約** … de が前置詞として働いている。「〜の」「〜から」と訳せる

判定の実務的な方法：**冠詞を別のものに置き換えられるか**を試します。
- Je bois du café. → Je bois **un** café.（置き換えられる → 冠詞の位置＝部分冠詞）
- Je viens du Japon. → × Je viens un Japon.（置き換えられない → 前置詞 de + 定冠詞）
:::

## 4. 前置詞 à の主な用法

:::deep à が表すもの

**（1）場所（〜へ、〜で）**
[[Je vais à Paris.\|ジュ・ヴェ・ザ・パリ\|パリへ行く。]]／[[Il habite à Tokyo.\|イラビット・ア・トキョ\|東京に住んでいる。]]

à は「到達点」と「所在」の両方を表します。英語の to と at の区別がありません。

**（2）時刻（〜に）**
[[à trois heures\|ア・トロ・ザール\|3時に]]、[[à midi\|ア・ミディ\|正午に]]

**（3）間接目的（〜に）**
[[Je parle à Marie.\|ジュ・パルル・ア・マリ\|マリに話す。]]／[[donner à\|ドネ・ア\|〜に与える]]
第18章の間接目的補語人称代名詞は、この à が代名詞化したものです。

**（4）所有・帰属（〜のもの）**
[[Ce livre est à moi.\|ス・リーヴル・エ・タ・モワ\|この本は私のものだ。]]
所有を表すのに de ではなく à を使う、être を伴う特殊な構文です。

**（5）手段・特徴（〜で、〜つきの）**
[[à pied\|ア・ピエ\|徒歩で]]、[[à vélo\|ア・ヴェロ\|自転車で]]、[[une fille aux yeux bleus\|ユヌ・フィーユ・オ・ズィユ・ブル\|青い目の少女]]

**（6）用途（〜のための）**
[[une machine à laver\|ユヌ・マシー・ナ・ラヴェ\|洗濯機]]、[[une tasse à café\|ユヌ・タス・ア・カフェ\|コーヒーカップ]]

**une tasse à café**（コーヒー用のカップ）と **une tasse de café**（一杯のコーヒー）は別物です。à は用途、de は中身を表します。
:::

## 5. 前置詞 de の主な用法

:::deep de が表すもの

**（1）所有・所属（〜の）**
[[le livre de Marie\|ル・リーヴル・ドゥ・マリ\|マリの本]]、[[la porte de la maison\|ラ・ポルト・ドゥ・ラ・メゾン\|家のドア]]

英語の 's にあたる形がフランス語にはないので、**すべて de で表します**。語順は英語と逆になります（the book **of** Marie の語順）。

**（2）起点（〜から）**
[[Je viens de Paris.\|ジュ・ヴィアン・ドゥ・パリ\|パリから来た。]]、[[de Tokyo à Osaka\|ドゥ・トキョ・ア・オサカ\|東京から大阪まで]]

**（3）材質・内容（〜製の、〜の）**
[[une table de bois\|ユヌ・ターブル・ドゥ・ボワ\|木製の机]]、[[un verre de vin\|アン・ヴェール・ドゥ・ヴァン\|グラス一杯のワイン]]

**（4）数量表現の後（第2章）**
[[beaucoup de livres\|ボクー・ドゥ・リーヴル\|たくさんの本]]

**（5）動詞・形容詞に required される de**
[[parler de\|パルレ・ドゥ\|〜について話す]]、[[avoir besoin de\|アヴォワール・ブゾワン・ドゥ\|〜が必要である]]、[[content de\|コンタン・ドゥ\|〜に満足している]]

**（6）不定詞を導く**
[[Il est content de partir.\|イ・レ・コンタン・ドゥ・パルティール\|彼は出発できて満足だ。]]
:::

## 6. 国名・地名につく前置詞

:::warn 国名の前置詞は名詞の性で決まる
「フランスへ」「日本へ」を言うとき、前置詞が名詞の性と数で変わります。**旅行や自己紹介で必ず使うので、規則として押さえてください。**

| 国名の種類 | 「〜へ・〜で」 | 「〜から」 | 例 |
|---|---|---|---|
| 女性国名（-e で終わる） | **en** | **de** | en France / de France |
| 男性国名（子音で終わる） | **au** | **du** | au Japon / du Japon |
| 母音で始まる国名 | **en** | **d'** | en Iran / d'Iran |
| 複数国名 | **aux** | **des** | aux États-Unis / des États-Unis |
| 都市名 | **à** | **de** | à Paris / de Paris |

:::ex 国と都市の前置詞
Je vais en France. | ジュ・ヴェ・ザン・フランス | 私はフランスへ行く。
Je vais au Japon. | ジュ・ヴェ・ゾ・ジャポン | 私は日本へ行く。
Je vais aux États-Unis. | ジュ・ヴェ・ゾ・ゼタジュニ | 私はアメリカへ行く。
Je vais à Paris. | ジュ・ヴェ・ザ・パリ | 私はパリへ行く。
Je viens du Japon. | ジュ・ヴィアン・デュ・ジャポン | 私は日本から来ました。
Je viens de Tokyo. | ジュ・ヴィアン・ドゥ・トキョ | 私は東京から来ました。
:::

**en を使うとき冠詞は消えます**（en France であって × en la France ではない）。第2章で見た「en の後は無冠詞」がここに効いています。

なお **女性国名は原則 -e で終わる**（la France, la Chine, l'Italie, l'Espagne）。男性は子音終わり（le Japon, le Canada, le Portugal, le Brésil）。例外は le Mexique, le Cambodge（-e だが男性）です。
:::

## 7. その他の主要な前置詞

| 前置詞 | 意味 | 例 |
|---|---|---|
| **dans** | 〜の中に | [[dans la boîte\|ダン・ラ・ボワット\|箱の中に]] |
| **sur** | 〜の上に | [[sur la table\|スュル・ラ・ターブル\|机の上に]] |
| **sous** | 〜の下に | [[sous le lit\|スー・ル・リ\|ベッドの下に]] |
| **avec** | 〜と一緒に | [[avec toi\|アヴェック・トワ\|君と]] |
| **sans** | 〜なしに | [[sans sucre\|サン・スュクル\|砂糖なしで]] |
| **pour** | 〜のために | [[pour toi\|プール・トワ\|君のために]] |
| **par** | 〜によって | [[par avion\|パ・ラヴィオン\|飛行機で]] |
| **chez** | 〜の家に | [[chez moi\|シェ・モワ\|私の家で]] |
| **entre** | 〜の間に | [[entre nous\|アントル・ヌー\|私たちの間で]] |
| **devant** | 〜の前に | [[devant la gare\|ドゥヴァン・ラ・ガール\|駅の前で]] |
| **derrière** | 〜の後ろに | [[derrière la porte\|デリエール・ラ・ポルト\|ドアの後ろに]] |
| **pendant** | 〜の間 | [[pendant deux heures\|パンダン・ドゥ・ザール\|2時間の間]] |

:::note chez はフランス語特有の前置詞
英語には対応する1語がありません。**「〜の家・店・国・世界で」**という、人に紐づいた場所を表します。

[[chez le médecin\|シェ・ル・メドサン\|医者のところで]]、[[chez Renault\|シェ・ルノー\|ルノー社で]]、[[chez les Français\|シェ・レ・フランセ\|フランス人の間では]]、[[chez Proust\|シェ・プルースト\|プルーストの作品では]]

**chez の後ろには人（または人の集団・会社名）しか来ません。** 場所そのものには使えません（× chez la gare）。
:::

:::adv sans の後ろでは冠詞が落ちる
[[un café sans sucre\|アン・カフェ・サン・スュクル\|砂糖なしのコーヒー]]（× sans du sucre）

sans は「ゼロである」ことを表すので、量を示す冠詞と両立しません。第5章の「否定の de」と同じ原理です。同様に、sans の後では否定語も ne を必要としません：[[sans rien dire\|サン・リアン・ディール\|何も言わずに]]。
:::

## 8. 縮約しない場合 — 落とし穴

:::warn 代名詞の le / les は縮約しない
縮約するのは**定冠詞の le / les だけ**です。同じ綴りでも**目的語代名詞の le / les**（第17章）は縮約しません。

- ○ Je viens **de le** voir.（彼に会ったばかりだ）— le は代名詞 → 縮約しない
- × Je viens **du** voir.
- ○ J'essaie **de les** comprendre.（彼らを理解しようとしている）
- ○ Je pense **à le** faire.（それをしようと考えている）→ à + 代名詞 le も縮約しない

**冠詞か代名詞かは、後ろに名詞が続くかどうか**で分かります。後ろが名詞なら冠詞（縮約する）、動詞なら代名詞（縮約しない）。

:::ex 冠詞と代名詞の対比
Je parle du problème. | ジュ・パルル・デュ・プロブレム | その問題について話す。（du = de + 冠詞 le） 
J'ai décidé de le faire. | ジェ・デスィデ・ドゥ・ル・フェール | それをすることに決めた。（de + 代名詞 le）
Il revient du marché. | イル・ルヴィヤン・デュ・マルシェ | 彼は市場から戻る。
Il a peur de les perdre. | イ・ラ・プール・ドゥ・レ・ペルドル | 彼はそれらを失うのを恐れている。
:::
:::

:::note 固有名詞の中の Le / Les も縮約する
Le を含む地名・題名にも縮約は及びます。

- Le Havre（ル・アーヴル）→ Je vais **au** Havre. ／ Je viens **du** Havre.
- Les Pays-Bas（オランダ）→ **aux** Pays-Bas ／ **des** Pays-Bas
- Le Monde（ル・モンド紙）→ un article **du** Monde（ル・モンドの記事）

**縮約は音の規則なので、固有名詞であっても容赦なく働きます。** 一方、La Rochelle のような la は縮約しないので à La Rochelle のままです。
:::

## 9. 音から見た縮約 — 聞き取りの実務

:::deep au / du / aux / des を耳で処理する
縮約形は短い1音節なので、聞き取りでは**前後の名詞とくっついて**流れてきます。

| 音 | candidates | 決め手 |
|---|---|---|
| 「オ」[o] | au / aux / eau / haut … | 後ろが名詞なら au(x) の可能性大 |
| 「デュ」[dy] | du（縮約）/ du（部分冠詞） | 動詞が de を取るか（第7.5章） |
| 「デ」[de] | des（縮約）/ des（不定複数）/ dès | 同上 + 文脈 |
| 「オ・ザ」[oz] | aux + 母音（リエゾン） | aux amis「オ・ザミ」 |

**aux は母音の前でリエゾンして [z] が出ます**：aux enfants「オ・ザンファン」、aux États-Unis「オ・ゼタ・ズュニ」。この [z] は des amis「デ・ザミ」と同じく、**複数の合図**として聞き取りの重要な手がかりになります。

会話の頻出チャンク（かたまり）も音で覚えてしまいましょう。

- [[au bout de|オ・ブ・ドゥ|〜の果てに、〜の後に]]（au bout de la rue 通りの突き当たり）
- [[au milieu de|オ・ミリュ・ドゥ|〜の真ん中に]]
- [[au lieu de|オ・リュ・ドゥ|〜の代わりに]]
- [[à côté du / de la|ア・コテ・デュ|〜の隣に]]
- [[près du / de la|プレ・デュ|〜の近くに]]
- [[en face du / de la|アン・ファス・デュ|〜の向かいに]]

位置関係の表現（第7.5章）は de を含むので、**後ろの名詞が男性なら du、女性なら de la** に変わります：à côté **du** cinéma ／ à côté **de la** gare。この切り替えが自動化すると、道案内が聞けるようになります。
:::

Je parle aux étudiants. | ジュ・パルル・オ・ゼテュディアン | 学生たちに話す。（à + les étudiants）
C'est le livre du professeur. | セ・ル・リーヴル・デュ・プロフェスール | それは先生の本です。（de + le professeur）
la couleur des yeux | ラ・クルール・デ・ズィユ | 目の色（de + les yeux）

Il sort de l'hôpital. | イル・ソール・ドゥ・ロピタル | 彼は病院を出る。（縮約しない）

## 11. à と de の総合対照表 — この章のまとめ

縮約を学んだ今、à と de の全体を1枚で対照しておきます（詳細は第7.5章）。

| 観点 | à | de |
|---|---|---|
| 中核の意味 | **到達・方向**（〜へ、〜に） | **起点・分離**（〜から、〜の） |
| 縮約 | au（à+le）、aux（à+les） | du（de+le）、des（de+les） |
| 場所 | à Paris（〜で・〜へ） | de Paris（〜から） |
| 時 | à midi（時刻） | de 9h à 17h（起点） |
| 所有・所属 | C'est **à** moi.（属詞） | le livre **de** Marie（名詞句） |
| 用途・内容 | une tasse **à** café（用途） | une tasse **de** café（内容） |
| 動詞との結合 | penser à、jouer à（競技） | parler de、jouer de（楽器） |
| 不定詞の前 | commencer à（開始・方向） | finir de（完了・分離） |
| 対応する代名詞 | **y**（第26章） | **en**（第25章） |

最後の行がこの後の学習の伏線です。**à の世界は y が、de の世界は en が受け持つ**——前置詞の二大区分が、そのまま代名詞の二大区分になります。au / du と聞いた瞬間に「à 系か de 系か」を感じ取れるようになれば、この章の目的は達成です。

## 12. 縮約が起きない前置詞 — à と de だけの現象

縮約するのは **à と de の2つだけ**です。他の前置詞は定冠詞と並んでもそのままです。

- **dans le** jardin（× danle）
- **sur la** table、**pour les** enfants、**avec le** professeur
- **par le** train、**sous la** pluie、**vers le** soir

なぜ à と de だけなのか。この2語が**フランス語で圧倒的に高頻度**だからです。頻繁に使われる語ほど音が磨耗し、隣の語と融合します（英語の going to → gonna と同じ現象）。**縮約は使用頻度の化石**なのです。

:::note 前置詞の後の冠詞は消えることもある
一方で、**冠詞そのものが消える**前置詞があります（第2章）。

| 前置詞 | 冠詞 | 例 |
|---|---|---|
| **en** | 原則なし | en France、en voiture、en été |
| **par**（手段・配分） | なし | par avion、par semaine |
| **sans** | なし（不定・部分冠詞） | sans sucre、sans problème |
| **avec**（抽象名詞） | なし | avec plaisir、avec patience |
| **de**（数量の後） | なし | beaucoup **de** livres |

したがって、前置詞と冠詞の関係は3通りに分かれます。

1. **縮約する**（à, de + le/les）
2. **冠詞が消える**（en, par, sans, avec + 抽象名詞）
3. **そのまま並ぶ**（dans, sur, pour, avec + 具体名詞 …）

**en France と dans la France du XIXe siècle**（第7.5章）の対比は、1と3ではなく2と3の対比でした。en は冠詞を要求しない前置詞、dans は要求する前置詞——そう整理すると、両者が別の語であることがはっきりします。
:::

フランス語の前置詞は、英語や日本語よりもはるかに重い役割を担っています。英語なら *look for*, *look after*, *look up* のように**動詞＋副詞の組み合わせ**で意味を分けますが、フランス語にはそれがありません。代わりに、

## 1. 前置詞とは何か

前置詞（la préposition）は、**名詞・代名詞・不定詞の前に置いて、それと他の語との関係を示す**不変化の語です。

| 前置詞の後ろに来るもの | 例 |
|---|---|
| 名詞 | à **Paris**、de **Marie**、avec **mon frère** |
| 強勢形の代名詞 | avec **moi**、pour **toi**、chez **eux** |
| 不定詞 | commencer à **travailler**、décider de **partir** |

:::warn 前置詞の後ろの人称代名詞は必ず強勢形
主語の形（je, tu, il …）や目的語の形（me, te, le …）は前置詞の後ろに置けません。**強勢形**（moi, toi, lui, elle, nous, vous, eux, elles）に変わります。第19章で詳しく扱います。

- ○ avec **moi**（× avec je、× avec me）
- ○ pour **eux**（× pour ils）
- ○ chez **elle**
:::

## 2. à — 到達点を指す

à の中核的な意味は**「点への到達・接触」**です。ここから派生して、驚くほど多くの用法が生まれます。

| 用法 | 例 | 意味 |
|---|---|---|
| 場所（位置・方向） | Je vais **à** Paris. | パリへ |
| 時刻 | **à** midi、**à** trois heures | 正午に、3時に |
| 間接目的語 | parler **à** Marie | マリに話す |
| 所属 | Ce livre est **à** moi. | これは私のものだ |
| 手段（乗り物にまたがる） | **à** pied、**à** vélo、**à** cheval | 徒歩で、自転車で、馬で |
| 特徴 | la fille **aux** yeux bleus | 青い目の女の子 |
| 用途 | une tasse **à** café | コーヒー**カップ** |
| 価格 | un livre **à** dix euros | 10ユーロの本 |
| 割合・単位 | cent kilomètres **à** l'heure | 時速100km |
| 方法 | écrit **à** la main | 手書きの |

:::ex à の主な用法
Je vais à la gare à huit heures. | ジュ・ヴェ・ア・ラ・ガール・ア・ユイ・トゥール | 8時に駅へ行きます。
Ce vélo est à mon frère. | ス・ヴェロ・エ・タ・モン・フレール | この自転車は兄のものだ。
Elle vient à pied. | エル・ヴィヤン・タ・ピエ | 彼女は歩いて来る。
C'est la fille aux cheveux longs. | セ・ラ・フィーユ・オ・シュヴー・ロン | 髪の長い女の子です。
Une chambre à deux lits, s'il vous plaît. | ユヌ・シャンブル・ア・ドゥ・リ・スィル・ヴ・プレ | ツインの部屋をお願いします。
:::

:::deep 所属の à と所有の de — なぜ2つあるのか
「マリの本」には2つの言い方があり、**構文が違います**。

- **le livre de Marie**（名詞 + de + 名詞）→ 名詞句を作る
- **Ce livre est à Marie.**（être + à + 人）→ 文を作る

de は**名詞と名詞をつなぐ**役割、à は**属詞として所有者を示す**役割です。したがって、

- × le livre à Marie（標準語では誤り。話し言葉では聞かれるが避ける）
- × Ce livre est de Marie.（「マリ作の本」＝著者の意味になる）

**名詞句なら de、être の後なら à** と覚えてください。所有者を代名詞で言うときも à を使います（C'est à moi. これは私のだ）。
:::

## 3. de — 起点を指す

de の中核は**「起点・分離」**です。à が「そこへ」なら de は「そこから」です。

| 用法 | 例 | 意味 |
|---|---|---|
| 起点 | venir **de** Paris | パリから来る |
| 所有・所属 | le livre **de** Marie | マリの本 |
| 材料 | une table **de** bois | 木のテーブル |
| 内容 | une tasse **de** café | コーヒー**一杯** |
| 原因 | mourir **de** faim | 空腹で死ぬ |
| 様態 | **d'**une voix douce | やさしい声で |
| 部分・数量 | beaucoup **de** livres | たくさんの本 |
| 同格 | la ville **de** Paris | パリという町 |
| 受動の動作主 | aimé **de** tous | みんなに愛されて |
| 主題 | parler **de** politique | 政治について話す |

:::ex de の主な用法
Il vient de Lyon. | イル・ヴィヤン・ドゥ・リヨン | 彼はリヨンから来ている。
C'est la voiture de mon père. | セ・ラ・ヴォワチュール・ドゥ・モン・ペール | それは父の車です。
Je meurs de soif. | ジュ・ムール・ドゥ・ソワフ | のどが渇いて死にそうだ。
Elle a répondu d'une voix calme. | エ・ラ・レポンデュ・デュヌ・ヴォワ・カルム | 彼女は落ち着いた声で答えた。
Nous avons beaucoup de travail. | ヌー・ザヴォン・ボクー・ドゥ・トラヴァイユ | 私たちは仕事がたくさんある。
:::

:::warn une tasse à café と une tasse de café
1文字違いで意味がまったく変わる、有名な対立です。

| 表現 | 意味 | 前置詞の役割 |
|---|---|---|
| une tasse **à** café | コーヒー**カップ**（空でもよい） | **用途**（何のための器か） |
| une tasse **de** café | コーヒー**一杯**（中身がある） | **内容**（何が入っているか） |

同じ対立が他にもあります。

| à（用途） | de（内容） |
|---|---|
| un verre **à** vin（ワイングラス） | un verre **de** vin（ワイン一杯） |
| une boîte **à** lettres（郵便受け） | une boîte **de** chocolats（チョコの箱） |
| une machine **à** laver（洗濯機） | — |
| une salle **à** manger（食堂） | — |

**à は「〜するための」、de は「〜が入った／〜でできた」**。器の話に限らず、machine à laver（洗濯するための機械）、fer à repasser（アイロン）のように、用途を表す名詞句は広く à を使います。
:::

:::deep 材料の de と en
「木のテーブル」は une table **de** bois とも une table **en** bois とも言えます。違いは強調点です。

- **de** — 分類・種類（どういう種類のテーブルか）。やや書き言葉的
- **en** — 材質そのもの（何でできているか）。話し言葉で優勢

現代語では **en** のほうがよく使われます。une bague **en** or（金の指輪）、une chemise **en** coton（綿のシャツ）。ただし慣用的に de で固定したものもあります：un mur **de** pierre（石の壁）、une robe **de** soie（絹のドレス）。

なお、材料が比喩的なときは de のみ：un cœur **de** pierre（石の心＝冷たい人）。
:::

## 4. 縮約の全体像

第7章で à + le → au、de + le → du を学びました。ここで縮約の全パターンを確定させます。

| | le | la | l' | les |
|---|---|---|---|---|
| **à** | **au** | à la | à l' | **aux** |
| **de** | **du** | de la | de l' | **des** |

**縮約するのは le と les だけ**。la と l' はそのままです。

さらに、関係代名詞・疑問代名詞の **lequel** とも縮約します（第21章）。

| | lequel | laquelle | lesquels | lesquelles |
|---|---|---|---|---|
| **à** | **auquel** | à laquelle | **auxquels** | **auxquelles** |
| **de** | **duquel** | de laquelle | **desquels** | **desquelles** |

:::ex 縮約の実際
Je vais au cinéma. | ジュ・ヴェ・オ・スィネマ | 映画館へ行く。（à + le）
Il parle aux enfants. | イル・パル・ロー・ザンファン | 彼は子どもたちに話す。（à + les）
C'est la voiture du voisin. | セ・ラ・ヴォワチュール・デュ・ヴォワザン | 隣人の車だ。（de + le）
Le livre auquel je pense. | ル・リーヴル・オケル・ジュ・パンス | 私が考えている本。（à + lequel）
:::

:::warn des は縮約か、不定冠詞か
des には**2つの正体**があります。

- **不定冠詞の複数** — J'ai **des** livres.（本を何冊か持っている）
- **de + les の縮約** — Je parle **des** livres.（その本について話す）

見分けは**その位置に de が要るかどうか**です。parler de … の de があるなら縮約、なければ不定冠詞。同じ形なので、動詞がどの前置詞を取るか（§8）を知らないと区別できません。ここでも前置詞の語法が効いてきます。
:::

## 5. 場所の前置詞

### 基本の3つ — à / en / dans

| 前置詞 | 感覚 | 例 |
|---|---|---|
| **à** | 点として捉える | à Paris、à la maison、à l'école |
| **en** | 中に、無冠詞で | en France、en ville、en classe |
| **dans** | 明確な内部空間、冠詞つき | dans la boîte、dans la rue、dans le train |

:::deep à / en / dans の使い分けの原理
この3つは重なる部分があり、日本語の「〜で／〜に」では区別できません。手がかりは**冠詞の有無**です。

- **en は原則として無冠詞** — en France、en voiture、en été、en classe
- **dans は必ず冠詞つき** — dans la France du XIXe siècle、dans la voiture

そして意味の違いは、**en が抽象的・類型的**、**dans が具体的・個別的**であることです。

- Je vais **en** ville.（街へ行く）→ 「街」という場のタイプ
- Je marche **dans** la ville.（その町の中を歩く）→ 特定の町の内部

同じ語でも入れ替えると意味が変わります。

- Il est **en** prison.（服役中だ）→ 状態
- Il est **dans** la prison.（その刑務所の建物の中にいる）→ 位置

**en は状態・種類、dans は物理的な内部**。この対立は乗り物にも及びます：**en** voiture（車で＝手段）／ **dans** la voiture（車の中に＝位置）。
:::

### 国名・地名との組み合わせ

国名に付ける前置詞は、**国名の性と語頭の音**で決まります。ここは規則が明快なので、覚えれば確実に使えます。

| 国名の種類 | 「〜へ／で」 | 「〜から」 | 例 |
|---|---|---|---|
| 女性国名（-e で終わる） | **en** | **de** | en France、de France |
| 母音で始まる男性国名 | **en** | **d'** | en Iran、d'Iran |
| 子音で始まる男性国名 | **au** | **du** | au Japon、du Japon |
| 複数の国名 | **aux** | **des** | aux États-Unis、des États-Unis |
| 都市名 | **à** | **de** | à Paris、de Paris |

:::ex 国名と前置詞
Je vais en France cet été. | ジュ・ヴェ・アン・フランス・セ・テテ | この夏フランスへ行きます。
Il habite au Japon depuis dix ans. | イ・ラビット・オ・ジャポン・ドゥピュイ・ディ・ザン | 彼は10年前から日本に住んでいる。
Elle revient des États-Unis. | エル・ルヴィヤン・デ・ゼタ・ズュニ | 彼女はアメリカから帰って来る。
Nous partons pour l'Italie. | ヌー・パルトン・プール・リタリー | 私たちはイタリアへ発ちます。
Ils viennent du Portugal. | イル・ヴィエンヌ・デュ・ポルテュガル | 彼らはポルトガルから来ている。
:::

**-e で終わる国名は女性**というのが原則ですが、**le Mexique、le Cambodge、le Zimbabwe** は例外的に男性です（au Mexique）。

### 位置関係を表す前置詞

| 前置詞（句） | 意味 | 反対語 |
|---|---|---|
| **sur** | 〜の上に（接触） | **sous**（〜の下に） |
| **au-dessus de** | 〜の上方に（離れて） | **au-dessous de**（〜の下方に） |
| **devant** | 〜の前に | **derrière**（〜の後ろに） |
| **près de** | 〜の近くに | **loin de**（〜から遠くに） |
| **à côté de** | 〜の隣に | — |
| **en face de** | 〜の向かいに | — |
| **entre** | （2つ）の間に | **parmi**（多数の中に） |
| **autour de** | 〜のまわりに | — |
| **le long de** | 〜に沿って | — |
| **chez** | 〜の家に、〜のもとで | — |

:::warn sur と au-dessus de
どちらも「上」ですが、**接触するかどうか**が違います。

- Le livre est **sur** la table.（本が机の上に載っている）→ 接触
- La lampe est **au-dessus de** la table.（ランプが机の上方にある）→ 離れている

同じ対立が sous / au-dessous de にもあります。日本語の「上／下」は両方をまとめてしまうので、意識して分ける必要があります。
:::

:::deep chez — フランス語らしい前置詞
**chez** は英語に対応語がなく、「〜の家に」「〜のところで」を1語で表します。語源はラテン語 casa（家）です。

| 用法 | 例 |
|---|---|
| 人の家 | Je vais **chez** Marie.（マリの家へ行く） |
| 店・職業 | **chez** le médecin（医者へ）、**chez** le boulanger（パン屋で） |
| 集団・時代 | **chez** les Grecs（ギリシャ人のもとでは） |
| 作品・思想 | **chez** Proust（プルーストにおいては） |

**後ろに来るのは必ず人**（または人を表す語）です。場所の名前は取れません。

- ○ chez le dentiste（歯医者へ）
- × chez la banque → ○ **à** la banque

代名詞と組む場合も強勢形：chez **moi**（うちで）、chez **eux**（彼らの家で）。
:::

## 6. 時の前置詞 — 5つの対立

時を表す前置詞には、**日本語話者が最も間違える5語**があります。まとめて対立させます。

| 前置詞 | 意味 | 時制 | 例 |
|---|---|---|---|
| **depuis** | 〜から（今も続く） | **現在形** | Il travaille ici **depuis** 2020. |
| **pendant** | 〜の間（終わった期間） | 過去・未来 | J'ai travaillé **pendant** trois ans. |
| **pour** | 〜の予定で | 未来 | Je pars **pour** une semaine. |
| **en** | 〜かけて（所要時間） | 任意 | J'ai fini **en** deux heures. |
| **dans** | 今から〜後に | 未来 | Je pars **dans** deux heures. |

:::warn depuis は現在形と組む — 英語・日本語とずれる箇所
「私は3年前からフランス語を勉強しています」をフランス語にすると、

- ○ J'étudie le français **depuis** trois ans.（**現在形**）
- × J'ai étudié le français depuis trois ans.

英語は *I have been studying*（現在完了進行形）を使いますが、**フランス語は現在形**です。理由は明快で、**いまも続いているから**です。フランス語の複合過去は「終わったこと」を表すので、継続中の事柄には使えません。

否定なら複合過去も使えます：Je ne l'ai pas vu **depuis** trois ans.（3年前から会っていない）——「会う」という出来事が起きていない、という意味なので完了形が合います。
:::

:::ex 時の前置詞の対立
J'habite ici depuis cinq ans. | ジャビット・イスィ・ドゥピュイ・サン・カン | 5年前からここに住んでいる。（今も住んでいる）
J'ai habité ici pendant cinq ans. | ジェ・アビテ・イスィ・パンダン・サン・カン | 5年間ここに住んでいた。（もう住んでいない）
Je pars pour trois jours. | ジュ・パール・プール・トロワ・ジュール | 3日間の予定で出かけます。
J'ai fait ce travail en trois jours. | ジェ・フェ・ス・トラヴァイユ・アン・トロワ・ジュール | この仕事を3日で仕上げた。
Je pars dans trois jours. | ジュ・パール・ダン・トロワ・ジュール | 3日後に出発します。
Il est parti il y a trois jours. | イ・レ・パルティ・イ・リ・ヤ・トロワ・ジュール | 彼は3日前に出発した。
:::

:::warn en と dans — 「3日で」と「3日後に」
最も混同されるのがこの2つです。

- **en** trois jours = **所要時間**「3日かけて」
- **dans** trois jours = **起点からの隔たり**「今から3日後に」

J'ai fini **en** deux heures.（2時間で終えた）／ Je finirai **dans** deux heures.（2時間後に終える）。

英語の *in* が両方の意味を持つため、英語からの類推が効きません。**「かかった時間」なら en、「先の時点」なら dans**。
:::

### その他の時の前置詞

| 前置詞 | 意味 | 例 |
|---|---|---|
| **à** | 時刻 | à huit heures |
| **en** | 月・年・季節（春を除く） | en mai、en 2026、en été |
| **au** | 春だけ | **au** printemps |
| **avant** / **après** | 〜の前／後 | avant midi、après le dîner |
| **jusqu'à** | 〜まで | jusqu'à demain |
| **dès** | 〜からすぐ | dès demain |
| **à partir de** | 〜から（開始点） | à partir de lundi |
| **vers** | 〜ごろ | vers midi |
| **il y a** | 〜前（過去） | il y a deux ans |

**季節だけ au printemps が例外**です。printemps が子音で始まるため en printemps では音がつながらず、en été / en automne / en hiver（すべて母音始まり）と揃わなかった、という音声的な理由によります。

## 7. その他の主要な前置詞

### par

| 用法 | 例 | 意味 |
|---|---|---|
| 経由 | passer **par** Lyon | リヨンを通って |
| 受動の動作主 | écrit **par** Hugo | ユゴーによって書かれた |
| 手段 | **par** avion、**par** téléphone | 航空便で、電話で |
| 配分 | deux fois **par** semaine | 週に2回 |
| 原因 | **par** hasard、**par** erreur | 偶然に、間違って |

### pour

| 用法 | 例 | 意味 |
|---|---|---|
| 目的・用途 | C'est **pour** toi. | 君のためだ |
| 目的地 | partir **pour** Paris | パリへ発つ |
| 予定の期間 | **pour** trois jours | 3日間の予定で |
| 原因 | puni **pour** ses fautes | 過ちのために罰される |
| 対比・立場 | **Pour** moi, c'est faux. | 私にとっては違う |
| 交換 | dix euros **pour** ce livre | この本に10ユーロ |

:::warn pour + 不定詞 = 目的
**pour + 不定詞**で「〜するために」を表します。この形は非常によく使うので、独立して覚えてください。

:::ex pour + 不定詞
Je travaille pour vivre. | ジュ・トラヴァイユ・プール・ヴィーヴル | 生きるために働く。
Il est venu pour te voir. | イ・レ・ヴニュ・プール・トゥ・ヴォワール | 彼は君に会うために来た。
Elle étudie pour réussir. | エ・レテュディ・プール・レユスィール | 彼女は成功するために勉強している。
:::

否定は **pour ne pas + 不定詞** の順です：Il est parti tôt **pour ne pas** être en retard.（遅れないように早く出た）。ne pas がまとまって不定詞の前に来ます（第5章）。
:::

### その他

| 前置詞 | 意味 | 例 |
|---|---|---|
| **avec** | 〜と一緒に、〜を使って | avec mes amis、avec un couteau |
| **sans** | 〜なしで | sans sucre、sans dire un mot |
| **selon** / **d'après** | 〜によれば | selon lui、d'après le journal |
| **malgré** | 〜にもかかわらず | malgré la pluie |
| **sauf** | 〜を除いて | tous sauf lui |
| **contre** | 〜に対して、〜に反して | contre le mur、voter contre |
| **envers** | 〜に対して（態度） | gentil envers tous |
| **vers** | 〜のほうへ、〜ごろ | vers la sortie |
| **grâce à** | 〜のおかげで | grâce à toi |
| **à cause de** | 〜のせいで | à cause de la pluie |

:::warn grâce à と à cause de
どちらも原因を表しますが、**評価が逆**です。

- **grâce à** — 良い結果の原因（〜のおかげで）
- **à cause de** — 悪い結果の原因（〜のせいで）

Nous avons réussi **grâce à** ton aide.（君の助けのおかげで成功した）／ Nous sommes en retard **à cause de** la pluie.（雨のせいで遅れた）。

中立に言いたいときは **en raison de**（〜の理由で）を使います。
:::

## 8. 動詞が要求する前置詞 — 語法の中核

ここがこの章で最も重要な節です。**動詞ごとに取る前置詞は決まっており、日本語や英語からは予測できません。**

### （1）前置詞を取らない動詞 — 直接目的語

日本語では「〜を」ですが助詞に引きずられやすい、あるいは英語では前置詞が要る動詞です。

| フランス語 | 意味 | 英語との違い |
|---|---|---|
| **attendre** qn/qch | 〜を待つ | wait **for** |
| **chercher** qn/qch | 〜を探す | look **for** |
| **regarder** qn/qch | 〜を見る | look **at** |
| **écouter** qn/qch | 〜を聞く | listen **to** |
| **demander** qch | 〜を求める | ask **for** |
| **payer** qch | 〜の代金を払う | pay **for** |
| **habiter** un lieu | 〜に住む | live **in**（habiter à も可） |

:::ex 前置詞を取らない動詞
J'attends le bus. | ジャタン・ル・ビュス | バスを待っている。（× attendre pour）
Je cherche mes clés. | ジュ・シェルシュ・メ・クレ | 鍵を探している。
Elle regarde la mer. | エル・ルガルド・ラ・メール | 彼女は海を見ている。
Nous écoutons la radio. | ヌー・ゼクトン・ラ・ラディオ | ラジオを聞いている。
:::

### （2）à を取る動詞

| 動詞 | 意味 |
|---|---|
| **penser à** | 〜のことを考える |
| **obéir à** | 〜に従う |
| **répondre à** | 〜に答える |
| **téléphoner à** | 〜に電話する |
| **plaire à** | 〜の気に入る |
| **ressembler à** | 〜に似ている |
| **s'intéresser à** | 〜に興味がある |
| **participer à** | 〜に参加する |
| **assister à** | 〜に出席する |
| **jouer à** | （競技・ゲーム）をする |
| **renoncer à** | 〜を諦める |
| **appartenir à** | 〜に属する |
| **convenir à** | 〜に適する |

### （3）de を取る動詞

| 動詞 | 意味 |
|---|---|
| **parler de** | 〜について話す |
| **se souvenir de** | 〜を覚えている |
| **avoir besoin de** | 〜が必要だ |
| **s'occuper de** | 〜の世話をする |
| **dépendre de** | 〜次第だ |
| **jouer de** | （楽器）を演奏する |
| **profiter de** | 〜を活用する |
| **changer de** | 〜を替える |
| **manquer de** | 〜が足りない |
| **rêver de** | 〜を夢見る |
| **s'approcher de** | 〜に近づく |
| **se moquer de** | 〜をからかう |

:::warn 前置詞で意味が変わる動詞
同じ動詞でも à と de で別の意味になります。**最頻出の3組**を押さえてください。

| 表現 | 意味 |
|---|---|
| **penser à** qch | 〜のことを（頭に浮かべて）考える |
| **penser de** qch | 〜についてどう思うか（評価） |
| **jouer à** | （スポーツ・ゲーム）をする — jouer au tennis |
| **jouer de** | （楽器）を演奏する — jouer du piano |
| **manquer à** qn | （人）に不足している＝恋しい — Tu me manques. |
| **manquer de** qch | 〜が足りない — Je manque de temps. |

:::ex penser à と penser de
Je pense à toi. | ジュ・パンス・ア・トワ | 君のことを考えている。
Que penses-tu de ce film ? | ク・パンス・チュ・ドゥ・ス・フィルム | この映画をどう思う？
Elle joue au tennis. | エル・ジュー・オ・テニス | 彼女はテニスをする。
Il joue du violon. | イル・ジュー・デュ・ヴィオロン | 彼はバイオリンを弾く。
Tu me manques. | チュ・ム・マンク | 君がいなくて寂しい。
:::

**Tu me manques** は語順が日本語と逆転する有名な例です。直訳は「君が私に欠けている」。「私が君を恋しく思う」ではなく、**恋しがられる側が主語**になります。
:::

### （4）二重補語を取る動詞

「**〜を〜に**」という2つの補語を取る動詞は、**直接目的語 + à + 人**の形をとります。

| 動詞 | 形 | 例 |
|---|---|---|
| **donner** | qch **à** qn | donner un livre à Marie |
| **dire** | qch **à** qn | dire la vérité à son père |
| **demander** | qch **à** qn | demander l'heure à un passant |
| **montrer** | qch **à** qn | montrer une photo à ses amis |
| **envoyer** | qch **à** qn | envoyer une lettre à sa mère |
| **offrir** | qch **à** qn | offrir des fleurs à sa femme |
| **prêter** | qch **à** qn | prêter sa voiture à son frère |

:::warn demander à qn de faire — 英語と主語が違う
英語の *ask someone to do* は「人」が直接目的語ですが、フランス語では **à** が付きます。

- 英 I asked **him** to come.
- 仏 J'ai demandé **à** lui → 正しくは Je **lui** ai demandé de venir.

同じ型の動詞：**dire à qn de faire**（〜するように言う）、**permettre à qn de faire**（許す）、**conseiller à qn de faire**（勧める）、**défendre à qn de faire**（禁じる）。

これらはすべて「**人には à、行為には de**」という形をとります。第18章の間接目的語代名詞（lui, leur）を使う動詞は、まさにこのグループです。
:::

## 9. 不定詞の前の前置詞

動詞が別の動詞（不定詞）を従えるとき、**前置詞なし／à／de** の3通りに分かれます。**これは動詞ごとに決まっており、意味からは予測できません。**

### （1）前置詞なしで不定詞を取る

| 動詞 | 例 |
|---|---|
| vouloir, pouvoir, devoir, savoir | Je veux **partir**. |
| aller, venir（近接未来・過去） | Je vais **manger**. |
| aimer, préférer, détester, espérer | J'aime **lire**. |
| falloir, valoir mieux | Il faut **partir**. |
| voir, entendre, sentir（知覚動詞） | Je le vois **venir**. |
| faire, laisser（使役） | Je le fais **entrer**. |

### （2）à + 不定詞

| 動詞 | 意味 |
|---|---|
| **commencer à** | 〜し始める |
| **apprendre à** | 〜することを学ぶ |
| **réussir à** | 〜することに成功する |
| **arriver à** | 〜できるようになる |
| **hésiter à** | 〜するのをためらう |
| **continuer à** | 〜し続ける |
| **penser à** | 〜することを忘れずにいる |
| **se mettre à** | 〜し始める |
| **aider qn à** | 〜するのを手伝う |
| **inviter qn à** | 〜するように誘う |

### （3）de + 不定詞

| 動詞 | 意味 |
|---|---|
| **décider de** | 〜することに決める |
| **essayer de** | 〜しようとする |
| **oublier de** | 〜するのを忘れる |
| **refuser de** | 〜するのを断る |
| **finir de** | 〜し終える |
| **arrêter de** | 〜するのをやめる |
| **venir de** | 〜したばかりだ |
| **avoir envie de** | 〜したい |
| **avoir besoin de** | 〜する必要がある |
| **choisir de** | 〜することを選ぶ |
| **accepter de** | 〜することを承諾する |
| **promettre de** | 〜すると約束する |

:::ex 不定詞と前置詞
Je veux partir demain. | ジュ・ヴー・パルティール・ドゥマン | 明日出発したい。（前置詞なし）
Il commence à pleuvoir. | イル・コマンス・ア・プルヴォワール | 雨が降り始めた。（à）
Elle a décidé de rester. | エ・ラ・デスィデ・ドゥ・レステ | 彼女は残ることに決めた。（de）
J'ai oublié de te téléphoner. | ジェ・ウブリエ・ドゥ・トゥ・テレフォネ | 君に電話するのを忘れた。（de）
Nous avons réussi à finir. | ヌー・ザヴォン・レユスィ・ア・フィニール | 私たちは終えることに成功した。（à）
:::

:::tip 覚え方の手がかり
完全に恣意的というわけではなく、ゆるい傾向があります。

- **à** — これから向かう動き、開始・継続・到達（commencer à、apprendre à、réussir à、continuer à）
- **de** — 切り離し、完了・停止・決断（finir de、arrêter de、décider de、refuser de）

à が「そこへ」、de が「そこから」という中核の意味（§2、§3）が、不定詞の前でも生きています。**開始は à、終了は de** と覚えると、かなりの動詞をカバーできます。

例外もあります（venir de は「〜したばかり」で完了寄りなので de、これは規則どおり。一方 hésiter à は動きが始まらないのに à）。最終的には辞書で確認する習慣が必要です。
:::

## 10. 形容詞が要求する前置詞

形容詞も前置詞を取ります。**de を取るものが多数派**で、à を取るものは限られます。

| de を取る | à を取る |
|---|---|
| content **de**（〜に満足している） | prêt **à**（〜の用意ができた） |
| heureux **de**（〜がうれしい） | prêt **à** partir |
| fier **de**（〜を誇りに思う） | facile **à** faire（〜しやすい） |
| sûr **de**（〜を確信している） | difficile **à** faire（〜しにくい） |
| capable **de**（〜できる） | fidèle **à**（〜に忠実な） |
| responsable **de**（〜に責任がある） | utile **à**（〜に役立つ） |
| différent **de**（〜と違う） | semblable **à**（〜に似ている） |
| plein **de**（〜でいっぱいの） | supérieur **à**（〜より優れた） |

:::warn facile à faire と il est facile de faire
同じ形容詞が2つの構文を持ち、前置詞が変わります。

- **Ce livre est facile à lire.**（この本は読みやすい）→ 主語が具体物。**à**
- **Il est facile de lire ce livre.**（この本を読むのは易しい）→ 主語が非人称 il。**de**

見分けは主語です。**非人称の il が主語なら de、具体的な名詞が主語なら à**。difficile、important、possible、impossible なども同じ二重構文を持ちます。
:::

## 11. 前置詞の反復

等位接続で複数の名詞を並べるとき、**à と de は原則としてくり返します**。他の前置詞は1回で足ります。

:::ex 前置詞の反復
Je pense à Marie et à Paul. | ジュ・パンス・ア・マリ・エ・ア・ポール | マリとポールのことを考えている。
C'est le livre de Marie et de Paul. | セ・ル・リーヴル・ドゥ・マリ・エ・ドゥ・ポール | マリとポールの本だ。
Je pars avec Marie et Paul. | ジュ・パール・アヴェック・マリ・エ・ポール | マリとポールと出発する。
Il travaille pour sa femme et ses enfants. | イル・トラヴァイユ・プール・サ・ファム・エ・セ・ザンファン | 彼は妻と子どものために働く。
:::

à と de がくり返される理由は、この2語が**軽くて意味が広い**ため、1回だけだと後続の名詞にかかっているかどうかが曖昧になるからです。avec や pour は意味が具体的なので、反復しなくても係り先が分かります。

## 12. よくある誤りのまとめ

:::warn 日本語話者がやりがちな10の誤り
| × | ○ | 理由 |
|---|---|---|
| J'attends pour le bus. | J'attends **le bus**. | attendre は直接目的語（§8-1） |
| Je cherche pour mes clés. | Je cherche **mes clés**. | chercher も直接目的語 |
| Il habite en Japon. | Il habite **au** Japon. | 子音始まりの男性国名は au（§5） |
| Je pars en trois jours.（3日後） | Je pars **dans** trois jours. | 所要時間 en / 先の時点 dans（§6） |
| J'ai étudié depuis trois ans. | J'**étudie** depuis trois ans. | depuis は現在形（§6） |
| une tasse de café（カップの意で） | une tasse **à** café | 用途は à、内容は de（§3） |
| Il joue au piano. | Il joue **du** piano. | 楽器は de（§8-3） |
| Je pense de toi. | Je pense **à** toi. | 「思う」は à、「評価」は de（§8-3） |
| J'ai demandé lui de venir. | Je **lui** ai demandé de venir. | demander **à** qn de faire（§8-4） |
| Je pense à Marie et Paul. | Je pense à Marie **et à** Paul. | à と de は反復する（§11） |
:::

ここからが動詞です。フランス語の動詞は**約12,000語**あるとされますが、そのうち**およそ90%**が -er で終わる第1群（le premier groupe）に属します。しかもこの群は完全に規則的で、新しく作られる動詞（googliser, télécharger など）もすべてここに入ります。

つまり**この章の活用表1つで、フランス語の動詞の9割が読める**ことになります。投資対効果が最も高い課です。

## 1. 3つのグループ

まず全体の見取り図を持っておきます。

| 群 | 不定詞の語尾 | 数 | 規則性 | 代表 |
|---|---|---|---|---|
| **第1群** | -er | 約90%（4,000語以上） | 完全に規則的 | chanter, parler, aimer |
| **第2群** | -ir（-iss- が入る） | 約300語 | 規則的 | finir, choisir |
| **第3群** | それ以外（-ir, -re, -oir） | 約350語 | 不規則 | être, avoir, aller, faire |

第3群は数こそ少ないものの、**最も使用頻度が高い動詞がここに集まっています**（être, avoir, aller, faire, pouvoir, vouloir…）。第2群は第13章、第3群は各章で順次扱います。

:::warn aller は -er で終わるが第1群ではない
[[aller\|アレ\|行く]] は -er で終わりますが、活用はまったく不規則です（je vais, tu vas, il va…）。**唯一の例外**なので、いま覚えてしまってください。第11章で扱います。

## 2. -er 動詞の活用

**語幹（不定詞から -er を取ったもの）に、6つの語尾を付けます。**

| 人称 | 語尾 |
|---|---|
| je | **-e** |
| tu | **-es** |
| il / elle / on | **-e** |
| nous | **-ons** |
| vous | **-ez** |
| ils / elles | **-ent** |

:::conj chanter présent

:::warn 4つの形が同じ音になる
上の表で「同じ音」を押してください。**je / tu / il / ils の4つに印が付きます。**

chante、chantes、chante、chantent —— 綴りは違いますが、**発音はすべて「シャント」で同一**です。

なぜか。第0章の規則を当てはめてみます。
- **chante** … 語末の e は無音、その手前の t は発音される → シャント
- **chantes** … 語末の s も無音 → シャント
- **chantent** … 3人称複数の -ent は丸ごと無音 → シャント

つまり6つの形のうち、**音として区別されるのは3つだけ**（シャント／シャントン／シャンテ）です。

これはフランス語学習で最も重要な事実の1つです。
- **聞くとき** … 動詞だけでは主語が分からない。だから主語代名詞が必須になる（第3章で説明したとおり）
- **書くとき** … 音が同じでも綴りを正しく選ばなければならない

この2つは、フランス語の書き取り（la dictée）が難しいことの本質的な理由でもあります。
:::

:::ex -er 動詞を使ってみる
Je chante une chanson. | ジュ・シャント・ユヌ・シャンソン | 私は歌を歌う。
Tu danses très bien. | テュ・ダンス・トレ・ビアン | 君はとても上手に踊る。
Elle habite à Paris. | エ・ラビット・ア・パリ | 彼女はパリに住んでいる。
Nous parlons français. | ヌー・パルロン・フランセ | 私たちはフランス語を話す。
Vous travaillez beaucoup. | ヴー・トラヴァイエ・ボクー | あなたはよく働きますね。
Ils aiment le cinéma. | イル・ゼーム・ル・スィネマ | 彼らは映画が好きだ。
:::

:::note 母音で始まる動詞ではリエゾンとエリジオンが起きる
[[aimer\|エメ\|愛する]]、[[habiter\|アビテ\|住む]]、[[écouter\|エクテ\|聞く]] のように母音・無音の h で始まる動詞では、主語との結合が変わります。

| | 子音で始まる（chanter） | 母音で始まる（aimer） |
|---|---|---|
| je | je chante | **j'**aime（エリジオン） |
| nous | nous chantons | nous **z**aimons（リエゾン） |
| vous | vous chantez | vous **z**aimez（リエゾン） |
| ils | ils chantent | ils **z**aiment（リエゾン） |

第3章で述べたとおり、**ils aiment のリエゾンだけが il aime との単複を区別しています**。
:::

## 3. 現在形が表す3つの意味

フランス語の現在形は、英語の現在形と現在進行形の**両方**をカバーします。

:::ex 現在形の3つの用法
Je chante. | ジュ・シャント | 私は歌う。／私は歌っている。
Je travaille tous les jours. | ジュ・トラヴァイユ・トゥ・レ・ジュール | 私は毎日働く。（習慣）
Le train arrive à midi. | ル・トラン・アリーヴ・ア・ミディ | 列車は正午に着く。（確定した未来）
:::

| 用法 | 説明 |
|---|---|
| **現在の動作** | いま行っていること（英語の進行形にあたる） |
| **習慣・反復** | いつもすること |
| **近い未来** | 予定として確定していること |

:::adv 進行形を強調したいとき
フランス語には進行形の活用がありませんが、強調したいときは **être en train de + 不定詞** を使います。

[[Je suis en train de chanter.\|ジュ・スュイ・ザン・トラン・ドゥ・シャンテ\|私はいま歌っているところだ。]]

ただしこれは「まさにその最中」を強調する表現で、日常的には単純な現在形で十分です。英語話者が過剰に使いがちな構文です。
:::

## 4. 綴りが変わる -er 動詞

**活用そのものは規則的ですが、綴りだけが変わる型があります。** これは例外ではなく、**発音を保つための必然的な調整**です。第0章で予告した内容がここで回収されます。

### （1）-cer → nous で ç になる

:::conj commencer présent

c は a, o, u の前では [k] になってしまいます。nous の語尾 -ons を付けると c の後ろが o になるため、[s] の音を保つには **ç** にする必要があります。

### （2）-ger → nous で e を挟む

:::conj manger présent

同じ理屈です。g は a, o の前で [g] になってしまうので、**e を挟んで** [ʒ] の音を保ちます。

:::note この2つは半過去でも効く
第27章で学ぶ半過去は「nous の現在形 − ons」を語幹にするので、この綴りの変化がそのまま持ち込まれます。

- nous mange**ons** → je mange**ais**、しかし nous mang**ions**（i の前では e が不要）
- nous commenç**ons** → je commenç**ais**、しかし nous commenc**ions**

**a と o の前でだけ調整する**という原則を押さえておけば、どの時制でも自分で判断できます。
:::

### （3）-eler / -eter → 子音を重ねる

:::conj appeler présent

語尾が無音になる形（je, tu, il, ils）では、直前の e が [ə] のままだと発音しにくいため、**子音を重ねて** [ɛ] に変えます。appelle は「アペル」、appelons は「アプロン」——音がはっきり違います。

:::warn acheter 型は è を使う
同じ -eter でも、子音を重ねずに **アクサン・グラーヴ**を付ける動詞があります。

:::conj acheter présent

**acheter, geler, peler, modeler, harceler** などがこの型です。appeler / jeter（重ねる）と acheter / geler（è にする）は、どちらも「[ə] を [ɛ] に変える」という同じ目的を、違う綴りで達成しています。個別に覚えるしかありません。

なお2016年の綴り字改革では、appeler 系も è で書くことが許容されましたが、伝統的な綴りが依然として主流です。
:::

### （4）e + 子音 + er → è

:::conj lever présent

[[lever\|ルヴェ\|上げる]]、[[mener\|ムネ\|導く]]、[[peser\|プゼ\|重さを量る]] など。acheter と同じ原理です。

### （5）é + 子音 + er → è

:::conj préférer présent

[[préférer\|プレフェレ]]、[[espérer\|エスペレ\|期待する]]、[[répéter\|レペテ\|繰り返す]] など。

:::warn préférer は未来形では変わらない
伝統的な綴りでは、**é 型の動詞は未来・条件法で é のまま**です。

- je préf**è**re（現在）
- je préf**é**rerai（単純未来）

一方、acheter 型と appeler 型は未来形でも変化します（j'ach**è**terai、j'appe**ll**erai）。この差は「未来語尾 -rai の前の e が発音されるかどうか」に由来しますが、実用上は**é 型だけ未来で戻る**と覚えるのが早道です。
:::

### （6）-ayer / -oyer / -uyer → y が i になる

:::conj payer présent

[[payer\|ペイエ\|払う]]、[[essayer\|エセイエ\|試す]]、[[nettoyer\|ネトワイエ\|掃除する]] など。

-ayer だけは **y のままでもよい**（je paye / je paie の両方が正しい）とされますが、-oyer / -uyer は必ず i になります。

:::adv envoyer は未来語幹だけが不規則
[[envoyer\|アンヴォワイエ\|送る]] は現在形は規則どおり（j'envoie）ですが、**未来語幹だけが enverr-** という不規則な形になります。

:::conj envoyer futur

第1群でこのような不規則を持つのは envoyer / renvoyer だけです。aller とあわせて、-er 動詞の例外は3語だけと覚えられます。
:::

## 5. 音で覚える -er 活用 — 6つのうち4つは同じ音

:::warn -er 動詞の現在形は「4つが同音」
chante / chantes / chante / chantent は、綴りこそ違え**すべて「シャント」と同音**です。音が変わるのは nous（シャントン）と vous（シャンテ）だけ。

| 綴り | 音 |
|---|---|
| je chant**e** / tu chant**es** / il chant**e** / ils chant**ent** | 「シャント」（同音） |
| nous chant**ons** | 「シャントン」 |
| vous chant**ez** | 「シャンテ」 |

この事実は2つの実務につながります。

**（1）話すときの負担が軽い**——主語さえ言えば動詞の形はほぼ1つ。だからフランス語は主語代名詞を省略できない（第3章）とも言えます。動詞の音が人称を区別しないので、主語が人称を担っているのです。

**（2）書くときの事故が増える**——「シャント」と聞こえても綴りは4通り。とくに **tu の -es** と **ils の -ent** の書き落としは、フランス語圏の子どもにも大人にも最も多い綴りの誤りです。ディクテ（書き取り）で鍛える箇所です。

さらに、**不定詞 chanter・過去分詞 chanté・vous 形 chantez はすべて「シャンテ」で同音**です。「シャンテ」と聞いたら3つの可能性を文法で絞る——これが -er 動詞の聞き取りの実際です（第20章で過去分詞を学ぶと重要になります）。
:::

## 6. 否定・疑問との組み合わせ

第5章の否定を、-er 動詞に当てはめます。

:::ex 否定形
Je ne chante pas. | ジュ・ヌ・シャント・パ | 私は歌わない。
Tu n'aimes pas le café ? | テュ・ネーム・パ・ル・カフェ | 君はコーヒーが好きじゃないの？
Nous ne travaillons jamais le dimanche. | ヌー・ヌ・トラヴァイヨン・ジャメ・ル・ディマンシュ | 私たちは日曜には決して働かない。
:::

疑問形は第9章で扱いますが、**イントネーションを上げるだけ**でも疑問になります。

:::ex 最も簡単な疑問形
Tu chantes ? | テュ・シャント | 君、歌うの？
Vous parlez français ? | ヴー・パルレ・フランセ | フランス語を話しますか？
:::

## 7. 動詞 + 不定詞 — à と de の使い分け

:::deep 2つ目の動詞をつなぐとき、何を挟むか
「〜したい」「〜し始める」のように動詞を2つ重ねるとき、**間に何も入れない／à を入れる／de を入れる** の3通りがあり、**最初の動詞ごとに決まっています**。辞書に載っている情報で、規則からは導けません。

**（a）直接つなぐ（前置詞なし）**

主に「願望・可能・移動・知覚」の動詞です。
[[aimer\|エメ]]、[[vouloir\|ヴロワール]]、[[pouvoir\|プヴォワール]]、[[devoir\|ドゥヴォワール]]、[[savoir\|サヴォワール]]、[[aller\|アレ]]、[[venir\|ヴニール]]、[[espérer\|エスペレ]]、[[préférer\|プレフェレ]]、[[penser\|パンセ]]

[[J'aime chanter.\|ジェーム・シャンテ\|私は歌うのが好きだ。]]
[[Je veux partir.\|ジュ・ヴ・パルティール\|私は出発したい。]]

**（b）à + 不定詞**

「開始・継続・傾向・学習」——**これから向かう方向**を表す動詞が多くなります。
[[commencer à\|コマンセ・ア\|〜し始める]]、[[apprendre à\|アプランドル・ア\|〜することを学ぶ]]、[[réussir à\|レユスィール・ア\|〜に成功する]]、[[arriver à\|アリヴェ・ア\|〜できる]]、[[hésiter à\|エズィテ・ア\|〜をためらう]]、[[continuer à\|コンティニュエ・ア\|〜し続ける]]、[[aider à\|エデ・ア\|〜を手伝う]]

[[Je commence à comprendre.\|ジュ・コマンス・ア・コンプランドル\|分かり始めた。]]

**（c）de + 不定詞**

「終了・停止・依頼・感情」——**すでに起きたこと、あるいは切り離すこと**を表す動詞が多くなります。
[[finir de\|フィニール・ドゥ\|〜し終える]]、[[arrêter de\|アレテ・ドゥ\|〜をやめる]]、[[essayer de\|エセイエ・ドゥ\|〜を試みる]]、[[décider de\|デスィデ・ドゥ\|〜を決める]]、[[oublier de\|ウブリエ・ドゥ\|〜を忘れる]]、[[demander de\|ドゥマンデ・ドゥ\|〜を頼む]]、[[refuser de\|ルフュゼ・ドゥ\|〜を断る]]

[[J'ai oublié de téléphoner.\|ジェ・ウブリエ・ドゥ・テレフォネ\|電話するのを忘れた。]]

**à は「向かう」、de は「離れる」** という前置詞本来の空間的な意味が、抽象化されて残っている——という説明ができます。ただし例外も多いので、最終的には**動詞ごとに辞書で確認**してください。

**（d）意味が変わるもの**

同じ動詞でも前置詞で意味が変わる場合があります。
- [[commencer à parler\|コマンセ・ア・パルレ\|話し始める]]（開始）
- [[commencer par parler\|コマンセ・パール・パルレ\|まず話すことから始める]]（順序）
:::

## 8. -er 動詞の語彙力 — 最初に覚える30語

:::note 第1群は「動詞の在庫」の9割
フランス語の動詞の約9割が第1群です。**活用パターンは1つ**なので、覚えた瞬間から30語すべてを全人称で使えます。使用頻度順に整理します。

| 生活 | 交流 | 心 |
|---|---|---|
| habiter（住む） | parler（話す） | aimer（愛する・好む） |
| travailler（働く） | écouter（聞く） | adorer（大好きだ） |
| manger（食べる） | regarder（見る） | détester（大嫌いだ） |
| acheter（買う） | demander（尋ねる） | préférer（〜のほうが好き） |
| payer（払う） | donner（与える） | espérer（望む） |
| porter（着る・運ぶ） | montrer（見せる） | penser（考える） |
| laver（洗う） | appeler（呼ぶ） | trouver（見つける・思う） |
| préparer（準備する） | inviter（招く） | oublier（忘れる） |
| fermer（閉める） | aider（助ける） | rêver（夢見る） |
| commencer（始める） | rencontrer（出会う） | chercher（探す） |

**aimer / adorer / détester / préférer** の4語は好みの表現の基本セットで、後ろに**定冠詞つきの名詞**（J'aime **le** café. 第2章）か**不定詞**（J'aime danser.）を取ります。

- [[J'adore ça !|ジャドール・サ|これ大好き！]]
- [[Je déteste attendre.|ジュ・デテスト・アタンドル|待つのは大嫌いだ。]]
- [[Je préfère le thé au café.|ジュ・プレフェール・ル・テ・オ・カフェ|コーヒーより紅茶が好きだ。]]

préférer A **à** B（B より A が好き）の à も、第7.5章で見た「方向の à」です。
:::

## 10. -er 動詞から派生語彙を広げる

第1群動詞は**名詞・形容詞と語根を共有**しているものが多く、1語覚えると語彙が芋づる式に増えます。

| 動詞 | 派生名詞 | 派生形容詞 |
|---|---|---|
| travailler（働く） | le travail（仕事）、un travailleur（労働者） | travaillé（凝った） |
| chanter（歌う） | une chanson（歌）、un chanteur（歌手） | chantant（歌うような） |
| danser（踊る） | une danse、un danseur | dansant |
| aimer（愛する） | l'amour（愛）、un amateur（愛好家） | aimable（親切な） |
| habiter（住む） | un habitant（住民）、une habitation（住居） | habitable |
| commencer（始める） | un commencement（始まり） | commençant |
| penser（考える） | une pensée（考え） | pensif（物思わしげな） |
| chercher（探す） | une recherche（研究・探索）、un chercheur（研究者） | recherché（凝った） |

**-eur / -euse（〜する人）、-ment（〜すること）、-tion（〜すること）、-able（〜できる）**という4つの接尾辞を知っているだけで、動詞から名詞・形容詞を推測できます。

:::ex 派生語の関係
Il travaille dur ; c'est un bon travailleur. | イル・トラヴァイユ・デュール | 彼はよく働く。いい働き手だ。
Elle chante bien. Sa chanson préférée est ancienne. | エル・シャント・ビヤン | 彼女は歌がうまい。好きな歌は古い曲だ。
Ce quartier compte mille habitants. | ス・カルティエ・コント・ミル・ザビタン | この地区の住民は千人だ。
:::

逆方向も成り立ちます。名詞 **un téléphone** → 動詞 **téléphoner**、**un dessin**（絵）→ **dessiner**（描く）、**un voyage** → **voyager**。**新しい動詞はほぼすべて -er 型で作られる**ので（第8章冒頭）、名詞を知っていれば動詞を作れる場面が多くあります。
