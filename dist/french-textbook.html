<script>
/* assets/js/conj-table.js */
/* conj-table.js — 活用表の描画
 *
 * 紙の活用表にできないことを3つやる:
 *   1. どのセルもクリックすれば発音が鳴る
 *   2. 語幹と語尾を色分けして、活用の仕組みを目で見えるようにする
 *   3. 「綴りは違うが音は同じ」セルに印を付ける
 *      （chante / chantes / chante / chantent は4つとも同じ音。
 *        これに気づかないまま暗記すると、聞き取りで必ずつまずく）
 */
(function (global) {
  'use strict';

  var FR = global.FR = global.FR || {};
  var doc = global.document;

  function el(tag, cls, text) {
    var n = doc.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- 1つの時制ぶんの列 ---------- */

  function renderTense(verb, tenseKey, opts) {
    opts = opts || {};
    var r = FR.conj.get(verb, tenseKey, opts);
    if (!r) return null;

    var box = el('div', 'conj-tense');

    var head = el('div', 'conj-tense-name');
    head.appendChild(el('span', null, r.tense.ja));
    head.appendChild(el('span', 'fr-name', r.tense.fr));
    box.appendChild(head);

    var homo = FR.conj.homophoneGroups(r.forms);
    var homoIndex = {};
    homo.forEach(function (group, gi) {
      group.forEach(function (i) { homoIndex[i] = gi; });
    });

    var ul = el('ul', 'conj-rows');

    r.forms.forEach(function (form, i) {
      if (!form) return;
      var pronoun = r.pronouns[i];
      var spoken = r.tense.key === 'imperatif'
        ? form
        : (/'$/.test(pronoun) ? pronoun + form : pronoun + ' ' + form);
      // 接続法の "que" は表示だけで、発音にも含めてよい

      var li = el('li');
      li.dataset.fr = spoken;
      li.setAttribute('role', 'button');
      li.setAttribute('tabindex', '0');
      li.setAttribute('aria-label', spoken + ' を発音');
      if (homoIndex[i] !== undefined) li.classList.add('homo');

      li.appendChild(el('span', 'conj-pron', r.tense.key === 'imperatif' ? pronoun : pronoun));

      var formCell = el('span', 'conj-form');
      var parts = FR.conj.split(verb, tenseKey, i);
      if (parts.ending) {
        formCell.appendChild(el('span', 'st', parts.stem));
        formCell.appendChild(el('span', 'en', parts.ending));
      } else {
        formCell.appendChild(doc.createTextNode(form));
      }
      li.appendChild(formCell);

      var play = el('span', 'conj-kana', '🔊');
      li.appendChild(play);

      ul.appendChild(li);
    });

    box.appendChild(ul);
    return { node: box, homophones: homo, result: r };
  }

  /* ---------- 表全体 ---------- */

  /**
   * 活用表を描画する。
   * @param {string} verb 不定詞
   * @param {string[]} [tenses] 時制のリスト（省略時は直説法現在）
   */
  function render(verb, tenses) {
    var info = FR.conj.info(verb);
    if (!info) {
      var miss = el('div', 'callout warn');
      miss.appendChild(el('div', 'callout-title', '⚠️ 未登録の動詞'));
      miss.appendChild(el('p', null, verb + ' は活用データに登録されていません。'));
      return miss;
    }

    var keys = (tenses && tenses.length ? tenses : ['present'])
      .map(function (t) { return FR.conj.normalizeTense(t); })
      .filter(Boolean);
    if (!keys.length) keys = ['present'];

    var wrap = el('div', 'conj');
    var settings = FR.store ? FR.store.settings.all() : { showParts: true, showHomophones: true };
    if (settings.showParts) wrap.classList.add('show-parts');
    if (settings.showHomophones) wrap.classList.add('show-homo');

    /* ヘッダ */
    var head = el('div', 'conj-head');

    var title = el('span', 'conj-verb');
    title.textContent = info.inf;
    title.dataset.fr = info.inf;
    title.setAttribute('role', 'button');
    title.setAttribute('tabindex', '0');
    head.appendChild(title);

    var meta = [];
    if (info.ja) meta.push(info.ja);
    meta.push(info.group === 1 ? '第1群' : info.group === 2 ? '第2群' : '第3群');
    if (info.irregular) meta.push('不規則');
    meta.push('助動詞 ' + info.aux);
    head.appendChild(el('span', 'conj-meta', meta.join(' ・ ')));

    var tools = el('div', 'conj-tools');

    var bParts = el('button', 'btn-mini', '語幹と語尾');
    bParts.type = 'button';
    bParts.setAttribute('aria-pressed', String(!!settings.showParts));
    bParts.addEventListener('click', function () {
      var on = wrap.classList.toggle('show-parts');
      bParts.setAttribute('aria-pressed', String(on));
      if (FR.store) FR.store.settings.set('showParts', on);
    });
    tools.appendChild(bParts);

    var bHomo = el('button', 'btn-mini', '同じ音 ♪');
    bHomo.type = 'button';
    bHomo.setAttribute('aria-pressed', String(!!settings.showHomophones));
    bHomo.addEventListener('click', function () {
      var on = wrap.classList.toggle('show-homo');
      bHomo.setAttribute('aria-pressed', String(on));
      if (FR.store) FR.store.settings.set('showHomophones', on);
    });
    tools.appendChild(bHomo);

    var bPlay = el('button', 'btn-mini', '▶ 通して聞く');
    bPlay.type = 'button';
    bPlay.dataset.playAll = '1';
    tools.appendChild(bPlay);

    head.appendChild(tools);
    wrap.appendChild(head);

    /* 本体 */
    var grid = el('div', 'conj-grid');
    var allHomo = [];
    keys.forEach(function (k) {
      var out = renderTense(verb, k);
      if (out) {
        grid.appendChild(out.node);
        if (out.homophones.length) allHomo.push({ tense: out.result.tense, groups: out.homophones, forms: out.result.forms });
      }
    });
    wrap.appendChild(grid);

    /* 脚注 */
    var notes = [];
    if (info.note) notes.push(info.note);

    allHomo.forEach(function (h) {
      h.groups.forEach(function (g) {
        var words = g.map(function (i) { return h.forms[i]; });
        notes.push('♪ ' + h.tense.ja + ' の ' + words.join(' / ') + ' は、綴りが違っても音は同じ。');
      });
    });

    if (info.aux === 'être') {
      notes.push('複合時制では助動詞に être を取るので、過去分詞が主語と性数一致する（elle est ' + info.pp + 'e）。');
    }

    if (notes.length) {
      var foot = el('div', 'conj-foot');
      notes.forEach(function (n, i) {
        var p = el('div', null, n);
        if (i) p.style.marginTop = '3px';
        foot.appendChild(p);
      });
      wrap.appendChild(foot);
    }

    return wrap;
  }

  /* ---------- 第13章：活用の全体図 ---------- */

  /**
   * 「どの形からどの形が導かれるか」を1枚で示す図。
   * 各ノードをクリックすると、その動詞のその時制の表が下に開く。
   */
  function renderMap(verb) {
    verb = verb || 'chanter';
    var info = FR.conj.info(verb);
    if (!info) info = FR.conj.info('chanter'), verb = 'chanter';

    var wrap = el('div', 'vmap');

    var intro = el('p', null,
      'フランス語の活用は、覚えるべき「もと」が4つしかない。そこから残りは機械的に導ける。' +
      '下の青いカードが「もと」、その右が「そこから作られる時制」。カードを押すと活用表が開く。');
    intro.style.fontSize = '13.5px';
    intro.style.color = 'var(--text-soft)';
    intro.style.margin = '0 0 14px';
    wrap.appendChild(intro);

    var out = el('div');

    function node(kind, label, value, tenseKey) {
      var b = el('button', 'vmap-node' + (kind === 'src' ? ' src' : ''));
      b.type = 'button';
      b.appendChild(el('span', 'k', kind === 'src' ? 'もと' : '導かれる時制'));
      b.appendChild(el('span', 'n', label));
      if (value) b.appendChild(el('span', 'f', value));
      b.addEventListener('click', function () {
        out.textContent = '';
        if (tenseKey) {
          out.appendChild(render(verb, [tenseKey]));
        } else {
          out.appendChild(render(verb, ['present']));
        }
        out.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
      return b;
    }

    function row(srcNode, derived) {
      var r = el('div', 'vmap-row');
      r.appendChild(srcNode);
      r.appendChild(el('div', 'vmap-arrow', '→'));
      var col = el('div');
      col.style.flex = '2 1 260px';
      col.style.display = 'flex';
      col.style.gap = '8px';
      col.style.flexWrap = 'wrap';
      derived.forEach(function (d) { col.appendChild(d); });
      r.appendChild(col);
      wrap.appendChild(r);
    }

    var pres = FR.conj.get(verb, 'present');

    row(
      node('src', '① 直説法現在', pres ? pres.forms.filter(Boolean).join(' / ') : '', 'present'),
      [
        node('d', '半過去', 'nous ' + (pres && pres.forms[3] ? pres.forms[3] : '') + ' − ons → ' + (info.impfStem || '') + '-', 'imparfait'),
        node('d', '接続法現在', info.subjStem ? ('ils ' + (pres && pres.forms[5] ? pres.forms[5] : '') + ' − ent → ' + info.subjStem + '-') : '（不規則）', 'subjonctif'),
        node('d', '命令法', 'tu / nous / vous の形から', 'imperatif')
      ]
    );

    row(
      node('src', '② 未来語幹', info.futStem + '-'),
      [
        node('d', '単純未来', info.futStem + ' + ai, as, a, ons, ez, ont', 'futur'),
        node('d', '条件法現在', info.futStem + ' + ais, ais, ait, ions, iez, aient', 'conditionnel')
      ]
    );

    row(
      node('src', '③ 過去分詞', info.pp + '（助動詞 ' + info.aux + '）'),
      [
        node('d', '複合過去', info.aux + ' の現在 + ' + info.pp, 'passeCompose'),
        node('d', '大過去', info.aux + ' の半過去 + ' + info.pp, 'plusQueParfait'),
        node('d', '前未来', info.aux + ' の単純未来 + ' + info.pp, 'futurAnterieur'),
        node('d', '条件法過去', info.aux + ' の条件法 + ' + info.pp, 'conditionnelPasse'),
        node('d', '接続法過去', info.aux + ' の接続法 + ' + info.pp, 'subjonctifPasse')
      ]
    );

    row(
      node('src', '④ 単純過去の語幹', '書き言葉専用'),
      [ node('d', '単純過去', '物語・歴史記述で使う', 'passeSimple') ]
    );

    var tip = el('div', 'callout tip');
    tip.appendChild(el('div', 'callout-title', '💡 ここが要点'));
    var tp = el('p', null,
      '条件法現在は「未来語幹 ＋ 半過去の語尾」でできている。つまり新しく覚えることは何もない。' +
      '同じように、複合時制は5つあるが、変わるのは助動詞の時制だけで、過去分詞は常に同じ。' +
      'この2点を押さえると、覚える量が体感で半分以下になる。');
    tip.appendChild(tp);
    wrap.appendChild(tip);

    wrap.appendChild(out);
    return wrap;
  }

  FR.conjTable = {
    render: render,
    renderMap: renderMap,
    renderTense: renderTense
  };

}(typeof window !== 'undefined' ? window : globalThis));

</script>
<script>
/* assets/js/drill.js */
/* drill.js — 活用ドリル
 *
 * 活用表を眺めるだけでは覚えられない。出力させて、間違えたところを記録して、
 * そこを優先的に出し直す——紙の教科書にできないのはここ。
 *
 *   ・入力式と4択式を切り替えられる
 *   ・アクセント記号を打ちにくい環境のために、入力補助と「惜しい」判定を持つ
 *   ・誤答は localStorage に残し、次回以降その項目を優先して出題する
 *   ・なぜその形になるのかを、AI に個別解説させられる
 */
(function (global) {
  'use strict';

  var FR = global.FR = global.FR || {};
  var doc = global.document;

  var ACCENTS = ['é', 'è', 'ê', 'ë', 'à', 'â', 'ù', 'û', 'î', 'ï', 'ô', 'ç'];

  var DEFAULT_VERBS = ['être', 'avoir', 'aller', 'faire', 'parler', 'finir', 'prendre', 'venir', 'pouvoir', 'vouloir'];
  var DEFAULT_TENSES = ['present'];

  function el(tag, cls, text) {
    var n = doc.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function keyOf(verb, tense, person) { return verb + '|' + tense + '|' + person; }

  /* ---------- 出題 ---------- */

  /**
   * 次の問題を選ぶ。
   * 3回に1回くらいの割合で、過去に間違えた項目から優先的に出す。
   */
  function nextQuestion(pool) {
    var weak = FR.store ? FR.store.drill.weakest(12) : [];
    if (weak.length && Math.random() < 0.35) {
      var cand = weak.filter(function (w) {
        var p = w.key.split('|');
        return pool.verbs.indexOf(p[0]) !== -1 && pool.tenses.indexOf(p[1]) !== -1;
      });
      if (cand.length) {
        var parts = pick(cand.slice(0, 6)).key.split('|');
        var q = build(parts[0], parts[1], Number(parts[2]));
        if (q) { q.review = true; return q; }
      }
    }

    // 通常出題。答えが存在する組み合わせに当たるまで数回試す
    for (var i = 0; i < 40; i++) {
      var verb = pick(pool.verbs);
      var tense = pick(pool.tenses);
      var r = FR.conj.get(verb, tense);
      if (!r) continue;
      var avail = [];
      r.forms.forEach(function (f, idx) { if (f) avail.push(idx); });
      if (!avail.length) continue;
      var q2 = build(verb, tense, pick(avail));
      if (q2) return q2;
    }
    return null;
  }

  function build(verb, tense, person) {
    var r = FR.conj.get(verb, tense);
    if (!r || !r.forms[person]) return null;
    return {
      verb: verb,
      tense: tense,
      person: person,
      answer: r.forms[person],
      pronoun: r.pronouns[person],
      tenseInfo: r.tense,
      info: FR.conj.info(verb)
    };
  }

  /** 4択の選択肢を作る。「ありそうな間違い」を混ぜるのが肝心。 */
  function choicesFor(q) {
    var set = {};
    set[q.answer] = true;
    var out = [q.answer];

    function add(f) {
      if (!f || set[f]) return;
      set[f] = true;
      out.push(f);
    }

    // 同じ時制の別人称（人称の取り違えを試す）
    var same = FR.conj.get(q.verb, q.tense);
    if (same) shuffle(same.forms.filter(Boolean)).forEach(add);

    // 同じ人称の別時制（時制の取り違えを試す）
    ['present', 'imparfait', 'futur', 'conditionnel', 'subjonctif'].forEach(function (t) {
      if (t === q.tense) return;
      var r = FR.conj.get(q.verb, t);
      if (r && r.forms[q.person]) add(r.forms[q.person]);
    });

    // 不規則動詞なら「規則どおりに活用してしまった形」も混ぜる
    if (q.info && q.info.irregular) {
      var stem = q.verb.replace(/(er|ir|re)$/, '');
      var reg = FR.conj.get(stem + 'er', q.tense);
      if (reg && reg.forms[q.person]) add(reg.forms[q.person]);
    }

    return shuffle(out.slice(0, 4));
  }

  /* ---------- 採点 ---------- */

  function grade(input, answer) {
    var a = String(input || '').trim().toLowerCase().replace(/\s+/g, ' ');
    var b = String(answer).toLowerCase();
    if (a === b) return 'right';
    if (FR.conj.deaccent(a) === FR.conj.deaccent(b)) return 'accent';
    return 'wrong';
  }

  /* ---------- 本体 ---------- */

  /**
   * ドリルを作る。
   * @param {{verbs?:string[], tenses?:string[], mode?:'input'|'choice', title?:string, compact?:boolean}} opts
   */
  function create(opts) {
    opts = opts || {};

    var pool = {
      verbs: (opts.verbs && opts.verbs.length ? opts.verbs : DEFAULT_VERBS)
        .filter(function (v) { return FR.conj.exists(v); }),
      tenses: (opts.tenses && opts.tenses.length ? opts.tenses : DEFAULT_TENSES)
        .map(function (t) { return FR.conj.normalizeTense(t); })
        .filter(Boolean)
    };
    if (!pool.verbs.length) pool.verbs = DEFAULT_VERBS;
    if (!pool.tenses.length) pool.tenses = DEFAULT_TENSES;

    var mode = opts.mode || 'input';
    var session = { asked: 0, right: 0, streak: 0, best: 0 };
    var current = null;
    var answered = false;

    var root = el('div', 'drill');

    /* --- ヘッダ --- */
    var head = el('div', 'drill-head');
    head.appendChild(el('span', 'ttl', opts.title || '🎯 活用ドリル'));

    var modeBtn = el('button', 'btn-mini', mode === 'input' ? '4択にする' : '入力式にする');
    modeBtn.type = 'button';
    modeBtn.addEventListener('click', function () {
      mode = mode === 'input' ? 'choice' : 'input';
      modeBtn.textContent = mode === 'input' ? '4択にする' : '入力式にする';
      show();
    });
    head.appendChild(modeBtn);

    var stats = el('div', 'drill-stats');
    var sAsked = el('span'), sRate = el('span'), sStreak = el('span');
    stats.appendChild(sAsked); stats.appendChild(sRate); stats.appendChild(sStreak);
    head.appendChild(stats);
    root.appendChild(head);

    function updateStats() {
      sAsked.textContent = '';
      sAsked.appendChild(doc.createTextNode('出題 '));
      sAsked.appendChild(el('b', null, String(session.asked)));

      var rate = session.asked ? Math.round(session.right / session.asked * 100) : 0;
      sRate.textContent = '';
      sRate.appendChild(doc.createTextNode('正答率 '));
      sRate.appendChild(el('b', null, rate + '%'));

      sStreak.textContent = '';
      sStreak.appendChild(doc.createTextNode('連続 '));
      sStreak.appendChild(el('b', null, String(session.streak)));
    }

    /* --- 出題エリア --- */
    var body = el('div', 'drill-body');
    root.appendChild(body);

    var foot = el('div', 'drill-foot');
    root.appendChild(foot);

    function show() {
      answered = false;
      current = nextQuestion(pool);
      body.textContent = '';
      foot.textContent = '';

      if (!current) {
        body.appendChild(el('p', null, '出題できる組み合わせがありません。'));
        return;
      }

      if (current.review) {
        var badge = el('div', 'drill-prompt', '🔁 前に間違えた問題');
        badge.style.color = 'var(--amber)';
        body.appendChild(badge);
      }

      body.appendChild(el('div', 'drill-prompt', 'この動詞を活用させてください'));

      var verbLine = el('div', 'drill-verb');
      verbLine.textContent = current.verb;
      verbLine.dataset.fr = current.verb;
      verbLine.setAttribute('role', 'button');
      verbLine.setAttribute('tabindex', '0');
      body.appendChild(verbLine);

      if (current.info && current.info.ja) {
        body.appendChild(el('div', 'drill-tense', current.info.ja));
      }
      body.appendChild(el('div', 'drill-tense', current.tenseInfo.ja + '（' + current.tenseInfo.fr + '）'));

      var subj = el('div', 'drill-subject');
      subj.textContent = current.tenseInfo.key === 'imperatif'
        ? current.pronoun + ' に対する命令'
        : current.pronoun + ' …… ?';
      body.appendChild(subj);

      if (mode === 'input') showInput();
      else showChoices();
    }

    function showInput() {
      var row = el('div', 'drill-inputrow');
      var input = el('input', 'drill-input');
      input.type = 'text';
      input.autocapitalize = 'off';
      input.autocomplete = 'off';
      input.spellcheck = false;
      input.setAttribute('aria-label', '活用形を入力');
      row.appendChild(input);

      var send = el('button', 'btn btn-primary', '答える');
      send.type = 'button';
      row.appendChild(send);
      body.appendChild(row);

      var acc = el('div', 'drill-accents');
      ACCENTS.forEach(function (c) {
        var b = el('button', null, c);
        b.type = 'button';
        b.tabIndex = -1;
        b.addEventListener('click', function () {
          var s = input.selectionStart || input.value.length;
          input.value = input.value.slice(0, s) + c + input.value.slice(input.selectionEnd || s);
          input.focus();
          input.setSelectionRange(s + 1, s + 1);
        });
        acc.appendChild(b);
      });
      body.appendChild(acc);

      function submit() {
        if (answered) return;
        if (!input.value.trim()) { input.focus(); return; }
        var res = grade(input.value, current.answer);
        input.disabled = true;
        send.disabled = true;
        reveal(res);
      }
      send.addEventListener('click', submit);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
      });
      setTimeout(function () { input.focus(); }, 30);
    }

    function showChoices() {
      var opts4 = choicesFor(current);
      var grid = el('div', 'drill-choices');
      opts4.forEach(function (c) {
        var b = el('button', 'drill-choice', c);
        b.type = 'button';
        b.addEventListener('click', function () {
          if (answered) return;
          var right = c === current.answer;
          grid.querySelectorAll('.drill-choice').forEach(function (n) {
            n.disabled = true;
            if (n.textContent === current.answer) n.classList.add('right');
            else if (n === b) n.classList.add('wrong');
          });
          reveal(right ? 'right' : 'wrong');
        });
        grid.appendChild(b);
      });
      body.appendChild(grid);
    }

    /* --- 採点結果 --- */

    function reveal(res) {
      answered = true;
      var correct = res === 'right' || res === 'accent';

      session.asked++;
      if (correct) {
        session.right++;
        session.streak++;
        if (session.streak > session.best) session.best = session.streak;
      } else {
        session.streak = 0;
      }
      if (FR.store) {
        FR.store.drill.record(keyOf(current.verb, current.tense, current.person), res === 'right');
      }
      updateStats();

      var fb = el('div', 'drill-feedback ' + (correct ? 'ok' : 'ng'));
      if (res === 'right') fb.appendChild(el('div', null, '⭕️ 正解'));
      else if (res === 'accent') fb.appendChild(el('div', null, '△ 惜しい — アクセント記号が抜けています'));
      else fb.appendChild(el('div', null, '✗ 正解は'));

      var line = FR.conj.line(current.verb, current.tense, current.person) || current.answer;
      var ans = el('div', 'answer');
      ans.textContent = line;
      ans.dataset.fr = line;
      ans.setAttribute('role', 'button');
      ans.setAttribute('tabindex', '0');
      fb.appendChild(ans);
      body.appendChild(fb);

      // 正解を読み上げる
      if (FR.speech) FR.speech.speak(line);

      // なぜその形になるのか（エンジンが持っている構造をそのまま説明に使う）
      var why = explain(current);
      if (why) {
        var w = el('div', 'drill-why');
        w.textContent = why;
        body.appendChild(w);
      }

      /* 次へ / AI解説 */
      var next = el('button', 'btn btn-primary', '次の問題 →');
      next.type = 'button';
      next.addEventListener('click', show);
      foot.appendChild(next);

      var table = el('button', 'btn', '活用表を見る');
      table.type = 'button';
      table.addEventListener('click', function () {
        table.disabled = true;
        foot.parentNode.insertBefore(
          FR.conjTable.render(current.verb, [current.tense]),
          foot
        );
      });
      foot.appendChild(table);

      if (!correct && FR.aiPanel) {
        var ai = el('button', 'aitool', '✨ なぜこの形になるの？');
        ai.type = 'button';
        ai.addEventListener('click', function () {
          FR.aiPanel.explainDrill(current);
        });
        foot.appendChild(ai);
      }

      setTimeout(function () { next.focus(); }, 40);
    }

    /** 活用エンジンが持つ「語幹 × 語尾」の構造を、そのまま日本語の説明にする */
    function explain(q) {
      var info = q.info;
      if (!info) return '';
      var t = q.tense;
      var parts = FR.conj.split(q.verb, q.tense, q.person);

      if (t === 'futur' || t === 'conditionnel') {
        var endings = FR.conj.endings(t);
        return '未来語幹「' + info.futStem + '-」＋ ' +
          (t === 'futur' ? '単純未来の語尾' : '半過去と同じ語尾') +
          '「-' + endings[q.person] + '」。' +
          (t === 'conditionnel' ? '条件法現在は「未来語幹 ＋ 半過去の語尾」でできている。' : '');
      }
      if (t === 'imparfait') {
        return '半過去は「nous の現在形 − ons」が語幹。' +
          (info.impfStem ? '「' + info.impfStem + '-」＋「-' + FR.conj.endings('imparfait')[q.person] + '」。' : '');
      }
      if (t === 'subjonctif' && info.subjStem) {
        return '接続法現在は「ils の現在形 − ent」が語幹。「' + info.subjStem + '-」＋「-' +
          FR.conj.endings('subjonctif')[q.person] + '」。ただし nous・vous は半過去と同じ語幹を使う。';
      }
      var tenseInfo = FR.conj.tense(t);
      if (tenseInfo && tenseInfo.compound) {
        return '複合時制は「助動詞 ' + info.aux + ' の' + FR.conj.tense(tenseInfo.compound).ja +
          ' ＋ 過去分詞 ' + info.pp + '」。' +
          (info.aux === 'être' ? 'être を取るので過去分詞が主語と性数一致する。' : '過去分詞は変化しない。');
      }
      if (t === 'present' && !info.irregular && parts.ending) {
        return '語幹「' + parts.stem + '」＋ 語尾「-' + parts.ending + '」。';
      }
      if (info.irregular && info.note) return info.note;
      return '';
    }

    updateStats();
    show();
    return root;
  }

  /* ---------- 章に埋め込む形 ---------- */

  function embed(opts) {
    return create(Object.assign({ compact: true }, opts));
  }

  /* ---------- 独立ページ ---------- */

  function page() {
    var wrap = el('div', 'page');
    wrap.appendChild(el('h1', null, '活用ドリル'));
    wrap.appendChild(el('p', null,
      '動詞と時制を選んで練習します。間違えた項目は記録され、次回以降くり返し出題されます。'));

    var setup = el('div', 'card');

    var verbField = el('label', 'field');
    verbField.appendChild(el('span', null, '動詞'));
    var verbSel = doc.createElement('select');
    verbSel.multiple = true;
    verbSel.size = 8;
    FR.conj.list().forEach(function (v) {
      var o = doc.createElement('option');
      var info = FR.conj.info(v);
      o.value = v;
      o.textContent = v + (info && info.ja ? '（' + info.ja + '）' : '');
      if (DEFAULT_VERBS.indexOf(v) !== -1) o.selected = true;
      verbSel.appendChild(o);
    });
    verbField.appendChild(verbSel);
    setup.appendChild(verbField);

    var tenseField = el('label', 'field');
    tenseField.appendChild(el('span', null, '時制'));
    var tenseSel = doc.createElement('select');
    tenseSel.multiple = true;
    tenseSel.size = 8;
    FR.conj.TENSES.forEach(function (t) {
      var o = doc.createElement('option');
      o.value = t.key;
      o.textContent = t.ja + '（' + t.fr + '）';
      if (t.key === 'present') o.selected = true;
      tenseSel.appendChild(o);
    });
    tenseField.appendChild(tenseSel);
    setup.appendChild(tenseField);

    var start = el('button', 'btn btn-primary', 'この設定で始める');
    start.type = 'button';
    setup.appendChild(start);

    var reset = el('button', 'btn', '成績をリセット');
    reset.type = 'button';
    reset.style.marginLeft = '8px';
    reset.addEventListener('click', function () {
      if (FR.store) FR.store.drill.reset();
      reset.textContent = 'リセットしました';
      setTimeout(function () { reset.textContent = '成績をリセット'; }, 1500);
      renderWeak();
    });
    setup.appendChild(reset);

    wrap.appendChild(setup);

    var host = el('div');
    wrap.appendChild(host);

    function selected(sel) {
      return Array.prototype.slice.call(sel.selectedOptions).map(function (o) { return o.value; });
    }

    start.addEventListener('click', function () {
      host.textContent = '';
      host.appendChild(create({ verbs: selected(verbSel), tenses: selected(tenseSel) }));
      host.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });

    /* 弱点リスト */
    var weakCard = el('div', 'card');
    wrap.appendChild(weakCard);

    function renderWeak() {
      weakCard.textContent = '';
      weakCard.appendChild(el('h2', null, '苦手な項目'));
      var weak = FR.store ? FR.store.drill.weakest(20) : [];
      if (!weak.length) {
        weakCard.appendChild(el('p', 'empty', 'まだ記録がありません。ドリルを解くとここに苦手な項目が並びます。'));
        return;
      }
      var ul = el('ul');
      weak.forEach(function (w) {
        var p = w.key.split('|');
        var t = FR.conj.tense(p[1]);
        var line = FR.conj.line(p[0], p[1], Number(p[2]));
        var li = el('li');
        li.appendChild(doc.createTextNode(p[0] + ' / ' + (t ? t.ja : p[1]) + ' → '));
        if (line) {
          var s = el('span', 'fr', line);
          s.dataset.fr = line;
          s.setAttribute('role', 'button');
          s.setAttribute('tabindex', '0');
          li.appendChild(s);
        }
        li.appendChild(el('span', 'vocab-pos', '誤 ' + w.e.wrong + ' / 正 ' + w.e.right));
        ul.appendChild(li);
      });
      weakCard.appendChild(ul);

      var again = el('button', 'btn', '苦手な項目だけ練習する');
      again.type = 'button';
      again.addEventListener('click', function () {
        var verbs = [], tenses = [];
        weak.forEach(function (w) {
          var p = w.key.split('|');
          if (verbs.indexOf(p[0]) === -1) verbs.push(p[0]);
          if (tenses.indexOf(p[1]) === -1) tenses.push(p[1]);
        });
        host.textContent = '';
        host.appendChild(create({ verbs: verbs, tenses: tenses, title: '🔁 苦手な項目の復習' }));
        host.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
      weakCard.appendChild(again);
    }
    renderWeak();

    return wrap;
  }

  FR.drill = {
    create: create,
    embed: embed,
    page: page,
    grade: grade
  };

}(typeof window !== 'undefined' ? window : globalThis));

</script>
<script>
/* assets/js/gemini.js */
/* gemini.js — Gemini API クライアント（BYOK）
 *
 * このサイトは静的ファイルだけで動くので、鍵をサーバーに隠す場所がない。
 * そこで「利用者が自分の鍵を入れて、自分のブラウザから直接 Google を呼ぶ」方式にする。
 *   ・鍵は localStorage にだけ置き、リポジトリにも他所にも送らない
 *   ・generativelanguage.googleapis.com は CORS を許可しているので中継サーバーは要らない
 *     （x-goog-api-key ヘッダも許可済み。クエリ文字列に鍵を載せずに済む）
 */
(function (global) {
  'use strict';

  var FR = global.FR = global.FR || {};

  var ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/';
  var KEY_STORE = 'geminiKey';

  var MODELS = [
    { id: 'gemini-3.6-flash', label: 'Gemini 3.6 Flash（既定・速い）' },
    { id: 'gemini-3.5-flash', label: 'Gemini 3.5 Flash（より丁寧）' },
    { id: 'gemini-2.5-flash', label: 'Gemini 2.5 Flash（軽量）' }
  ];

  function getKey() {
    return (FR.store ? FR.store.get(KEY_STORE, '') : '') || '';
  }

  function model() {
    var m = FR.store ? FR.store.settings.get('model') : null;
    return m || MODELS[0].id;
  }

  /* ---------- エラーの日本語化 ---------- */

  function describeError(status, payload) {
    var detail = '';
    try {
      detail = payload && payload.error && payload.error.message ? payload.error.message : '';
    } catch (e) {}

    if (status === 400 && /API key not valid|API_KEY_INVALID/i.test(detail)) {
      return 'API キーが正しくないようです。設定画面で入力し直してください。';
    }
    if (status === 400) {
      return 'リクエストが受け付けられませんでした。' + (detail ? '（' + detail + '）' : '');
    }
    if (status === 401 || status === 403) {
      return 'API キーが無効か、権限がありません。Google AI Studio でキーを作り直して、設定画面に貼り直してください。';
    }
    if (status === 404) {
      return '指定されたモデルが見つかりませんでした。設定画面で別のモデルを選んでみてください。';
    }
    if (status === 429) {
      return 'アクセスが集中しています（無料枠の上限に達した可能性があります）。1分ほど待ってからもう一度お試しください。';
    }
    if (status >= 500) {
      return 'Google 側で一時的な問題が起きています。しばらくしてからお試しください。';
    }
    return '通信に失敗しました。' + (detail ? '（' + detail + '）' : '');
  }

  /* ---------- SSE の読み取り ---------- */

  function extractText(chunk) {
    var out = '';
    var cands = chunk && chunk.candidates;
    if (!cands || !cands.length) return out;
    var parts = cands[0].content && cands[0].content.parts;
    if (!parts) return out;
    parts.forEach(function (p) {
      // Gemini 3 系は思考パートを返すことがあるので、本文だけ拾う
      if (p && typeof p.text === 'string' && !p.thought) out += p.text;
    });
    return out;
  }

  function readStream(response, onToken) {
    var reader = response.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';
    var full = '';

    function step() {
      return reader.read().then(function (res) {
        if (res.done) {
          return full;
        }
        buffer += decoder.decode(res.value, { stream: true });

        var events = buffer.split('\n\n');
        buffer = events.pop();

        events.forEach(function (evt) {
          evt.split('\n').forEach(function (line) {
            if (line.indexOf('data:') !== 0) return;
            var json = line.slice(5).trim();
            if (!json || json === '[DONE]') return;
            var parsed;
            try { parsed = JSON.parse(json); } catch (e) { return; }
            var text = extractText(parsed);
            if (text) {
              full += text;
              if (onToken) onToken(text, full);
            }
          });
        });
        return step();
      });
    }
    return step();
  }

  /* ---------- 本体 ---------- */

  var gemini = {
    MODELS: MODELS,

    hasKey: function () { return !!getKey(); },

    setKey: function (k) {
      var v = String(k || '').trim();
      if (FR.store) {
        if (v) FR.store.set(KEY_STORE, v);
        else FR.store.remove(KEY_STORE);
      }
      return v;
    },

    clearKey: function () { if (FR.store) FR.store.remove(KEY_STORE); },

    /** 画面表示用に伏せた鍵を返す */
    maskedKey: function () {
      var k = getKey();
      if (!k) return '';
      if (k.length <= 10) return '••••••';
      return k.slice(0, 6) + '••••••••' + k.slice(-4);
    },

    model: model,
    setModel: function (m) { if (FR.store) FR.store.settings.set('model', m); return m; },

    /**
     * Gemini に問い合わせる。ストリームで少しずつ返す。
     * @param {{system?:string, messages:Array<{role:'user'|'model', text:string}>,
     *          temperature?:number, maxTokens?:number,
     *          onToken?:(delta:string, full:string)=>void, signal?:AbortSignal}} opts
     * @returns {Promise<string>}
     */
    ask: function (opts) {
      var key = getKey();
      if (!key) {
        return Promise.reject(new Error('APIキーが設定されていません。設定画面で Gemini の API キーを入力してください。'));
      }
      if (typeof fetch !== 'function') {
        return Promise.reject(new Error('このブラウザは通信機能に対応していません。'));
      }

      var body = {
        contents: (opts.messages || []).map(function (m) {
          return { role: m.role === 'model' ? 'model' : 'user', parts: [{ text: m.text }] };
        }),
        generationConfig: {
          temperature: opts.temperature != null ? opts.temperature : 0.7,
          maxOutputTokens: opts.maxTokens || 2048
        }
      };
      if (opts.system) {
        body.systemInstruction = { parts: [{ text: opts.system }] };
      }

      var url = ENDPOINT + encodeURIComponent(model()) + ':streamGenerateContent?alt=sse';

      return fetch(url, {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-goog-api-key': key
        },
        body: JSON.stringify(body),
        signal: opts.signal
      }).then(function (res) {
        if (!res.ok) {
          return res.text().then(function (t) {
            var payload = null;
            try { payload = JSON.parse(t); } catch (e) {}
            throw new Error(describeError(res.status, payload));
          });
        }
        if (!res.body || typeof res.body.getReader !== 'function') {
          // ストリームが使えない環境向けの保険
          return res.text().then(function (t) {
            var full = '';
            t.split('\n').forEach(function (line) {
              if (line.indexOf('data:') !== 0) return;
              try { full += extractText(JSON.parse(line.slice(5).trim())); } catch (e) {}
            });
            if (opts.onToken && full) opts.onToken(full, full);
            return full;
          });
        }
        return readStream(res, opts.onToken);
      }).catch(function (err) {
        if (err && err.name === 'AbortError') throw err;
        if (err instanceof TypeError) {
          throw new Error('ネットワークに接続できませんでした。オフラインでないか確認してください。');
        }
        throw err;
      });
    }
  };

  FR.gemini = gemini;

}(typeof window !== 'undefined' ? window : globalThis));

</script>
<script>
/* assets/js/ai-panel.js */
/* ai-panel.js — Gemini を使った4つの学習機能の UI
 *
 *   1. 文法質問チャット   … 今読んでいる章の本文を文脈として渡す
 *   2. 例文の自動生成     … その章の文法項目を使った例文を、テーマと難易度を指定して作る
 *   3. 作文添削           … 自分で書いた仏文を、その章の文法に照らして直してもらう
 *   4. 活用ドリルの解説   … なぜその活用形になるのかを個別に説明させる
 *
 * AI の出力は必ず FR.markup を通して描画する。文字列を innerHTML に流し込む箇所は無い。
 * また出力に [[仏文|カナ|訳]] 記法を使わせることで、AI が作った例文もクリックで発音できる。
 */
(function (global) {
  'use strict';

  var FR = global.FR = global.FR || {};
  var doc = global.document;

  function el(tag, cls, text) {
    var n = doc.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  var context = { id: '', no: '', title: '', body: '', index: 0 };
  var history = [];
  var busy = false;
  var controller = null;

  /* ---------- 共通のシステムプロンプト ---------- */

  var BASE_ROLE =
    'あなたは日本語話者にフランス語を教える、大学のフランス語教員です。\n' +
    '回答のきまり:\n' +
    '- 日本語で答える。文法用語は日本語とフランス語を併記する（例: 直説法半過去 / l\'imparfait）。\n' +
    '- フランス語を書くときは必ず [[仏文|カナ読み|和訳]] の記法を使う。この3つを必ず埋める。\n' +
    '  例: [[Je chante.|ジュ・シャント|私は歌う。]]\n' +
    '  カナ読みは日本語話者向けの近似でよい。リエゾンがあれば反映する。\n' +
    '- 見出しは ## か ###、強調は **…**、表は Markdown の表を使う。\n' +
    '- 規則を述べるときは、条件と適用範囲、例外があればそれも書く。「とりあえずこう覚える」で終わらせない。\n' +
    '- 学習者が実際に迷う対立（半過去 vs 複合過去、qui vs que など）は、対比の形で説明する。\n' +
    '- 冗長な前置きや自己紹介はしない。答えから書き始める。';

  function chapterContext() {
    if (!context.title) return '';
    var body = context.body || '';
    // 章が長いので、送るのは冒頭のまとまった量に限る（トークン節約）
    if (body.length > 9000) body = body.slice(0, 9000) + '\n…（以下略）';
    return '\n\n---\n学習者が今読んでいる教材の本文です。質問はこの内容についてのものです。\n' +
      '# 第' + context.no + '章 ' + context.title + '\n' + body + '\n---\n';
  }

  function systemPrompt(extra) {
    return BASE_ROLE + (extra ? '\n' + extra : '') + chapterContext();
  }

  /* ---------- 出力の描画 ---------- */

  /** ストリーム中の再描画を間引くための、遅延つきレンダラ */
  function makeRenderer(target) {
    var pending = null;
    var timer = null;

    function flush() {
      timer = null;
      if (pending == null) return;
      var out = FR.markup.parse(pending);
      target.textContent = '';
      target.appendChild(out.fragment);
      pending = null;
    }

    return {
      update: function (text) {
        pending = text;
        if (!timer) timer = setTimeout(flush, 90);
      },
      finish: function (text) {
        pending = text;
        if (timer) { clearTimeout(timer); timer = null; }
        flush();
        target.classList.remove('typing');
      },
      start: function () { target.classList.add('typing'); }
    };
  }

  /** 生成された例文に「マイ例文に保存」ボタンを足す */
  function addSaveButtons(root) {
    root.querySelectorAll('.exlist li[data-fr]').forEach(function (li) {
      if (li.querySelector('.save-phrase')) return;
      var b = el('button', 'btn-mini save-phrase', '⭐︎ 保存');
      b.type = 'button';
      b.style.alignSelf = 'center';
      b.addEventListener('click', function () {
        var kana = li.querySelector('.ex-kana');
        var ja = li.querySelector('.ex-ja');
        FR.store.phrases.add({
          fr: li.dataset.fr,
          kana: kana ? kana.textContent : '',
          ja: ja ? ja.textContent : '',
          chapter: context.title
        });
        b.textContent = '⭐ 保存済み';
        b.disabled = true;
      });
      li.appendChild(b);
    });
  }

  /* ---------- チャットパネル ---------- */

  var panel, panelBody, panelForm, input, sendBtn, ctxLabel;

  function ensureRefs() {
    if (panel) return;
    panel = doc.getElementById('aipanel');
    panelBody = doc.getElementById('aipanel-body');
    panelForm = doc.getElementById('aipanel-form');
    input = doc.getElementById('ai-input');
    sendBtn = doc.getElementById('ai-send');
    ctxLabel = doc.getElementById('aipanel-ctx');
    if (!panel) return;

    panelForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text || busy) return;
      input.value = '';
      input.style.height = '';
      send(text);
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        panelForm.requestSubmit();
      }
    });
    input.addEventListener('input', function () {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });

    doc.getElementById('btn-ai-close').addEventListener('click', close);
  }

  function open() {
    ensureRefs();
    if (!panel) return;
    panel.hidden = false;
    var scrim = doc.getElementById('scrim');
    if (global.innerWidth < 860 && scrim) scrim.hidden = false;
    doc.getElementById('btn-ai').setAttribute('aria-expanded', 'true');
    setTimeout(function () { if (input) input.focus(); }, 50);
  }

  function close() {
    ensureRefs();
    if (!panel) return;
    panel.hidden = true;
    var scrim = doc.getElementById('scrim');
    if (scrim) scrim.hidden = true;
    doc.getElementById('btn-ai').setAttribute('aria-expanded', 'false');
    if (controller) { controller.abort(); controller = null; busy = false; }
  }

  function isOpen() { ensureRefs(); return panel && !panel.hidden; }

  /* ---------- 画面の初期状態 ---------- */

  function renderEmpty() {
    ensureRefs();
    if (!panelBody) return;
    panelBody.textContent = '';

    if (!FR.gemini.hasKey()) {
      var box = el('div', 'ai-empty');
      box.appendChild(el('p', null, 'AI 機能を使うには、Gemini の API キーが必要です。'));
      var a = el('a', null, '設定画面でキーを登録する →');
      a.href = '#/settings';
      a.addEventListener('click', close);
      box.appendChild(a);
      var note = el('p', null, 'キーは Google AI Studio で無料で取得できます。このブラウザの中だけに保存され、どこにも送信されません。');
      note.style.fontSize = '12px';
      note.style.marginTop = '14px';
      box.appendChild(note);
      panelBody.appendChild(box);
      return;
    }

    var empty = el('div', 'ai-empty');
    empty.appendChild(el('p', null,
      context.title ? '「第' + context.no + '章 ' + context.title + '」について質問できます。'
                    : 'フランス語の文法について質問できます。'));

    var sug = el('div', 'ai-suggest');
    suggestions().forEach(function (s) {
      var b = el('button', null, s);
      b.type = 'button';
      b.addEventListener('click', function () { send(s); });
      sug.appendChild(b);
    });
    empty.appendChild(sug);
    panelBody.appendChild(empty);
  }

  function suggestions() {
    if (context.title) {
      return [
        'この章で一番つまずきやすいところはどこ？',
        'この章の内容を使った例文を5つ作って',
        'この章の規則で、例外があるものを整理して',
        'この章の内容を確認する小テストを作って'
      ];
    }
    return [
      '半過去と複合過去の使い分けを教えて',
      'qui と que の違いを例文で説明して',
      '接続法はどんなときに使うの？'
    ];
  }

  /* ---------- 送信 ---------- */

  function appendMessage(role, text) {
    var msg = el('div', 'msg ' + role);
    msg.appendChild(el('div', 'msg-role', role === 'user' ? 'あなた' : role === 'err' ? 'エラー' : 'AI'));
    var body = el('div', 'msg-body');
    if (role === 'ai') {
      // 後からストリームで埋める
    } else {
      body.textContent = text;
    }
    msg.appendChild(body);
    panelBody.appendChild(msg);
    panelBody.scrollTop = panelBody.scrollHeight;
    return body;
  }

  function setBusy(v) {
    busy = v;
    if (sendBtn) {
      sendBtn.disabled = v;
      sendBtn.textContent = v ? '…' : '送信';
    }
  }

  function send(text, opts) {
    ensureRefs();
    opts = opts || {};
    if (busy) return;

    if (!FR.gemini.hasKey()) { renderEmpty(); return; }

    // 初回はプレースホルダを消す
    var placeholder = panelBody.querySelector('.ai-empty');
    if (placeholder) placeholder.remove();

    appendMessage('user', text);
    history.push({ role: 'user', text: text });

    var target = appendMessage('ai', '');
    var renderer = makeRenderer(target);
    renderer.start();

    setBusy(true);
    controller = new AbortController();

    FR.gemini.ask({
      system: systemPrompt(opts.extraSystem),
      // 直近の数往復だけ送る（章の本文が大きいのでトークンを節約する）
      messages: history.slice(-6),
      temperature: opts.temperature,
      onToken: function (delta, full) {
        renderer.update(full);
        panelBody.scrollTop = panelBody.scrollHeight;
      },
      signal: controller.signal
    }).then(function (full) {
      renderer.finish(full);
      addSaveButtons(target);
      history.push({ role: 'model', text: full });
      panelBody.scrollTop = panelBody.scrollHeight;
    }).catch(function (err) {
      if (err && err.name === 'AbortError') { target.parentNode.remove(); return; }
      target.parentNode.remove();
      appendMessage('err', err && err.message ? err.message : String(err));
    }).then(function () {
      setBusy(false);
      controller = null;
    });
  }

  /* ---------- 章の切り替え ---------- */

  function setContext(ch) {
    var changed = context.id !== (ch && ch.id);
    context = {
      id: ch ? ch.id : '',
      no: ch ? ch.no : '',
      title: ch ? ch.title : '',
      body: ch ? ch.body : '',
      index: ch ? ch.index || 0 : 0
    };
    ensureRefs();
    if (ctxLabel) ctxLabel.textContent = context.title ? '第' + context.no + '章 ' + context.title : '';
    if (changed) {
      history = [];
      renderEmpty();
    }
  }

  /* ---------- 章の中に置くボタン ---------- */

  /** :::ai-gen / :::ai-ask から呼ばれる */
  function embedButton(kind, arg) {
    var wrap = el('div', 'aitools');
    var out = el('div', 'ai-out');

    if (kind === 'ai-ask') {
      var ask = el('button', 'aitool', '✨ ' + (arg || 'この章について質問する'));
      ask.type = 'button';
      ask.addEventListener('click', function () {
        open();
        if (arg) send(arg);
      });
      wrap.appendChild(ask);
      return wrap;
    }

    // ai-gen: 例文生成
    var topic = arg || (context.title || 'この章の文法');

    var gen = el('button', 'aitool', '✨ この文法の例文を作ってもらう');
    gen.type = 'button';
    wrap.appendChild(gen);

    var check = el('button', 'aitool', '📝 自分の作文を添削してもらう');
    check.type = 'button';
    wrap.appendChild(check);

    var frag = doc.createDocumentFragment();
    frag.appendChild(wrap);
    frag.appendChild(out);

    gen.addEventListener('click', function () { showGenerator(out, topic, gen); });
    check.addEventListener('click', function () { showCorrector(out, topic, check); });

    return frag;
  }

  /* ---------- 例文の自動生成 ---------- */

  function showGenerator(out, topic, trigger) {
    if (!FR.gemini.hasKey()) { out.textContent = ''; out.appendChild(keyNotice()); return; }

    out.textContent = '';
    var card = el('div', 'card');
    card.appendChild(el('h2', null, '例文を作る'));

    var themeField = el('label', 'field');
    themeField.appendChild(el('span', null, 'テーマ'));
    var theme = doc.createElement('select');
    ['日常会話', 'カフェ・レストラン', '旅行', '買い物', '大学・仕事', '恋愛', '天気・季節', '自己紹介']
      .forEach(function (t) {
        var o = doc.createElement('option');
        o.value = t; o.textContent = t;
        theme.appendChild(o);
      });
    themeField.appendChild(theme);
    card.appendChild(themeField);

    var levelField = el('label', 'field');
    levelField.appendChild(el('span', null, '難易度'));
    var level = doc.createElement('select');
    [['やさしい', '短く、基本語彙だけ'], ['ふつう', '実際の会話で使える長さ'], ['難しい', '複文や書き言葉も含む']]
      .forEach(function (t) {
        var o = doc.createElement('option');
        o.value = t[0]; o.textContent = t[0] + '（' + t[1] + '）';
        level.appendChild(o);
      });
    level.selectedIndex = 1;
    levelField.appendChild(level);
    card.appendChild(levelField);

    var countField = el('label', 'field');
    countField.appendChild(el('span', null, '本数'));
    var count = doc.createElement('select');
    [3, 5, 8, 10].forEach(function (n) {
      var o = doc.createElement('option');
      o.value = String(n); o.textContent = n + '本';
      count.appendChild(o);
    });
    count.selectedIndex = 1;
    countField.appendChild(count);
    card.appendChild(countField);

    var go = el('button', 'btn btn-primary', '作ってもらう');
    go.type = 'button';
    card.appendChild(go);

    var result = el('div');
    result.style.marginTop = '14px';
    card.appendChild(result);

    out.appendChild(card);

    go.addEventListener('click', function () {
      if (busy) return;
      go.disabled = true;
      go.textContent = '作成中…';
      result.textContent = '';
      var renderer = makeRenderer(result);
      renderer.start();

      var prompt =
        '次の条件で、フランス語の例文を作ってください。\n' +
        '- 使う文法項目: ' + topic + '\n' +
        '- テーマ: ' + theme.value + '\n' +
        '- 難易度: ' + level.value + '\n' +
        '- 本数: ' + count.value + '本\n\n' +
        '出力の形式は、必ず次の例文ブロックにしてください（前置きは不要）。\n' +
        ':::ex ' + topic + 'の例文\n' +
        '仏文 | カナ読み | 和訳\n' +
        '仏文 | カナ読み | 和訳\n' +
        ':::\n\n' +
        'そのあとに、文法項目がどこに現れているかの短い解説を箇条書きで付けてください。';

      setBusy(true);
      controller = new AbortController();
      FR.gemini.ask({
        system: systemPrompt('例文はすべて文法的に正しく、実際にフランス語話者が使う自然な表現にしてください。'),
        messages: [{ role: 'user', text: prompt }],
        temperature: 0.9,
        onToken: function (d, full) { renderer.update(full); },
        signal: controller.signal
      }).then(function (full) {
        renderer.finish(full);
        addSaveButtons(result);
      }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        result.textContent = '';
        result.appendChild(errorBox(err));
      }).then(function () {
        setBusy(false);
        controller = null;
        go.disabled = false;
        go.textContent = 'もう一度作る';
      });
    });
  }

  /* ---------- 作文添削 ---------- */

  function showCorrector(out, topic, trigger) {
    if (!FR.gemini.hasKey()) { out.textContent = ''; out.appendChild(keyNotice()); return; }

    out.textContent = '';
    var card = el('div', 'card');
    card.appendChild(el('h2', null, '作文を添削してもらう'));
    card.appendChild(el('p', 'hint',
      'この章の文法（' + topic + '）を使って書いた文を入れてください。誤りの指摘・修正・理由を返します。'));

    var ta = doc.createElement('textarea');
    ta.rows = 4;
    ta.placeholder = '例: Hier, je suis allé au cinéma avec mes amis.';
    ta.style.width = '100%';
    ta.style.padding = '9px 11px';
    ta.style.font = 'inherit';
    ta.style.background = 'var(--bg-soft)';
    ta.style.color = 'var(--text)';
    ta.style.border = '1px solid var(--border)';
    ta.style.borderRadius = 'var(--radius-sm)';
    ta.style.marginBottom = '10px';
    card.appendChild(ta);

    var go = el('button', 'btn btn-primary', '添削してもらう');
    go.type = 'button';
    card.appendChild(go);

    var result = el('div');
    result.style.marginTop = '14px';
    card.appendChild(result);
    out.appendChild(card);

    go.addEventListener('click', function () {
      var text = ta.value.trim();
      if (!text || busy) return;
      go.disabled = true;
      go.textContent = '添削中…';
      result.textContent = '';
      var renderer = makeRenderer(result);
      renderer.start();

      var prompt =
        '次のフランス語の文を添削してください。\n\n' +
        '【学習者が書いた文】\n' + text + '\n\n' +
        '出力の形式:\n' +
        '## 判定\n' +
        '正しい／直したほうがよい点がある、のどちらかを一言で。\n' +
        '## 修正後\n' +
        ':::ex 修正後\n' +
        '修正した仏文 | カナ読み | 和訳\n' +
        ':::\n' +
        '## 指摘\n' +
        '誤りごとに「どこが → どう直す → なぜそうなるのか」の3点を箇条書きで。' +
        '「なぜ」では文法規則の名前を挙げ、この章（' + topic + '）との関係にも触れてください。\n' +
        '## もっと自然にするなら\n' +
        '文法的には正しいがフランス語として不自然な箇所があれば、代案を挙げてください。無ければ「特になし」。\n\n' +
        '誤りが1つも無い場合も、その旨をはっきり伝えてから、より自然な言い回しの案を示してください。';

      setBusy(true);
      controller = new AbortController();
      FR.gemini.ask({
        system: systemPrompt('添削では推測で書き換えず、学習者の意図を尊重してください。誤りでないものを誤りとしないこと。'),
        messages: [{ role: 'user', text: prompt }],
        temperature: 0.25,
        onToken: function (d, full) { renderer.update(full); },
        signal: controller.signal
      }).then(function (full) {
        renderer.finish(full);
        addSaveButtons(result);
      }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        result.textContent = '';
        result.appendChild(errorBox(err));
      }).then(function () {
        setBusy(false);
        controller = null;
        go.disabled = false;
        go.textContent = 'もう一度添削する';
      });
    });
  }

  /* ---------- ドリルの誤答解説 ---------- */

  function explainDrill(q) {
    open();
    if (!FR.gemini.hasKey()) { renderEmpty(); return; }

    var line = FR.conj.line(q.verb, q.tense, q.person) || q.answer;
    var weak = FR.store ? FR.store.drill.weakest(8) : [];
    var pattern = weak.length
      ? '\n\n参考: この学習者が繰り返し間違えている項目は次のとおりです。共通する誤りの傾向があれば指摘してください。\n' +
        weak.map(function (w) {
          var p = w.key.split('|');
          var t = FR.conj.tense(p[1]);
          return '- ' + p[0] + ' / ' + (t ? t.ja : p[1]) + '（誤答' + w.e.wrong + '回）';
        }).join('\n')
      : '';

    var prompt =
      '活用ドリルで間違えました。なぜこの形になるのかを説明してください。\n\n' +
      '- 動詞: ' + q.verb + '（' + (q.info && q.info.ja ? q.info.ja : '') + '）\n' +
      '- 時制: ' + q.tenseInfo.ja + ' / ' + q.tenseInfo.fr + '\n' +
      '- 人称: ' + q.pronoun + '\n' +
      '- 正解: ' + line + '\n\n' +
      '説明してほしいこと:\n' +
      '1. この形がどの語幹とどの語尾でできているか\n' +
      '2. その語幹はどこから来るのか（不定詞か、現在形の nous か ils か、など）\n' +
      '3. 間違えやすいポイントと、覚えるためのコツ\n' +
      '4. この形を使った短い例文を2つ' + pattern;

    var placeholder = panelBody.querySelector('.ai-empty');
    if (placeholder) placeholder.remove();
    history.push({ role: 'user', text: 'なぜ ' + line + ' になるの？' });
    appendMessage('user', 'なぜ ' + line + ' になるの？');

    var target = appendMessage('ai', '');
    var renderer = makeRenderer(target);
    renderer.start();
    setBusy(true);
    controller = new AbortController();

    FR.gemini.ask({
      system: systemPrompt('活用の説明では「語幹 × 語尾」の分解を必ず示してください。'),
      messages: [{ role: 'user', text: prompt }],
      temperature: 0.4,
      onToken: function (d, full) {
        renderer.update(full);
        panelBody.scrollTop = panelBody.scrollHeight;
      },
      signal: controller.signal
    }).then(function (full) {
      renderer.finish(full);
      history.push({ role: 'model', text: full });
    }).catch(function (err) {
      if (err && err.name === 'AbortError') { target.parentNode.remove(); return; }
      target.parentNode.remove();
      appendMessage('err', err && err.message ? err.message : String(err));
    }).then(function () {
      setBusy(false);
      controller = null;
    });
  }

  /* ---------- 補助 ---------- */

  function keyNotice() {
    var box = el('div', 'callout note');
    box.appendChild(el('div', 'callout-title', '🔑 API キーが必要です'));
    var p = el('p');
    p.appendChild(doc.createTextNode('AI 機能を使うには Gemini の API キーを登録してください。'));
    var a = el('a', null, '設定画面へ');
    a.href = '#/settings';
    p.appendChild(doc.createTextNode(' '));
    p.appendChild(a);
    box.appendChild(p);
    return box;
  }

  function errorBox(err) {
    var box = el('div', 'callout warn');
    box.appendChild(el('div', 'callout-title', '⚠️ うまくいきませんでした'));
    box.appendChild(el('p', null, err && err.message ? err.message : String(err)));
    return box;
  }

  FR.aiPanel = {
    open: open,
    close: close,
    isOpen: isOpen,
    setContext: setContext,
    send: send,
    embedButton: embedButton,
    explainDrill: explainDrill,
    renderEmpty: renderEmpty
  };

}(typeof window !== 'undefined' ? window : globalThis));

</script>

<script>
/* assets/js/pages.js */
/* pages.js — 章以外の画面（ホーム／動詞活用表／マイ例文／設定） */
(function (global) {
  'use strict';

  var FR = global.FR = global.FR || {};
  var doc = global.document;

  function el(tag, cls, text) {
    var n = doc.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ==================== ホーム ==================== */

  function home() {
    var wrap = el('div', 'page');

    var hero = el('div', 'home-hero');
    var h1 = el('h1');
    h1.appendChild(el('span', 'fr-title', 'Grammaire française'));
    h1.appendChild(doc.createElement('br'));
    h1.appendChild(doc.createTextNode('フランス語文法テキスト'));
    hero.appendChild(h1);
    hero.appendChild(el('p', null,
      '入門から接続法まで、全32章。文法は大学レベルの詳しさで書いてあります。' +
      'フランス語はどこをクリックしても発音が鳴り、動詞の活用は表を見るだけでなくドリルで練習できます。' +
      '分からないところは AI にその場で質問できます。'));
    wrap.appendChild(hero);

    var grid = el('div', 'home-grid');

    function card(href, icon, title, desc) {
      var a = el('a', 'home-card');
      a.href = href;
      a.appendChild(el('div', 'ic', icon));
      a.appendChild(el('div', 't', title));
      a.appendChild(el('div', 'd', desc));
      return a;
    }

    var first = FR.toc && FR.toc.length ? FR.toc[0] : null;
    var done = FR.store ? FR.store.progress.count() : 0;
    var total = FR.toc ? FR.toc.length : 0;
    var next = null;
    if (FR.toc) {
      for (var i = 0; i < FR.toc.length; i++) {
        if (!FR.store.progress.isDone(FR.toc[i].id)) { next = FR.toc[i]; break; }
      }
    }

    grid.appendChild(card(
      next ? '#/' + next.id : (first ? '#/' + first.id : '#/'),
      '📗',
      done ? '続きから読む' : '第0章から始める',
      next ? ('第' + next.no + '章 ' + next.title) : 'すべての章を読み終えています'
    ));
    grid.appendChild(card('#/drill', '🎯', '活用ドリル',
      '動詞と時制を選んで反復練習。間違えた項目は記録され、優先的に出題されます。'));
    grid.appendChild(card('#/verbs', '📖', '動詞活用表',
      '全時制の活用表。どのセルもクリックで発音が鳴ります。'));
    grid.appendChild(card('#/settings', '⚙️', '設定',
      '読み上げの声と速さ、AI 機能の API キーを設定します。'));
    wrap.appendChild(grid);

    /* 進捗 */
    if (total) {
      var prog = el('div', 'card');
      prog.appendChild(el('h2', null, '学習の進捗'));
      prog.appendChild(el('p', null, total + '章のうち ' + done + '章を読了。'));
      var bar = el('div');
      bar.style.height = '8px';
      bar.style.background = 'var(--surface-2)';
      bar.style.borderRadius = '999px';
      bar.style.overflow = 'hidden';
      var fill = el('div');
      fill.style.height = '100%';
      fill.style.width = Math.round(done / total * 100) + '%';
      fill.style.background = 'var(--accent)';
      bar.appendChild(fill);
      prog.appendChild(bar);
      wrap.appendChild(prog);
    }

    /* 使い方 */
    var how = el('div', 'card');
    how.appendChild(el('h2', null, 'この教材の使い方'));
    var ul = el('ul');
    [
      '本文中の赤いフランス語は、クリックすると発音が鳴ります。例文ブロックは「通して聞く」でまとめて再生できます。',
      '活用表では「語幹と語尾」を押すと色分けされ、「同じ音 ♪」を押すと、綴りが違うのに発音が同じセルに印が付きます。',
      '章の終わりにある練習問題は、答えが隠れています。自分で考えてから開いてください。',
      '右上の ✨ を押すと AI パネルが開きます。今読んでいる章の内容を踏まえて答えてくれます。'
    ].forEach(function (t) { ul.appendChild(el('li', null, t)); });
    how.appendChild(ul);
    wrap.appendChild(how);

    return wrap;
  }

  /* ==================== 動詞活用表 ==================== */

  function verbs() {
    var wrap = el('div', 'page');
    wrap.appendChild(el('h1', null, '動詞活用表'));
    wrap.appendChild(el('p', null, '動詞を選ぶと、全時制の活用表を表示します。どのセルもクリックで発音が鳴ります。'));

    var card = el('div', 'card');

    var field = el('label', 'field');
    field.appendChild(el('span', null, '動詞'));
    var sel = doc.createElement('select');
    var groups = [
      { label: '不規則動詞', list: FR.conj.list('irregular') },
      { label: '規則動詞', list: FR.conj.list('regular') },
      { label: '代名動詞', list: FR.conj.list('pronominal') }
    ];
    groups.forEach(function (g) {
      var og = doc.createElement('optgroup');
      og.label = g.label;
      g.list.forEach(function (v) {
        var info = FR.conj.info(v);
        var o = doc.createElement('option');
