  title: '強調構文',
  sub: 'ぼくが好きなのは、マリ',
  body: `
{lead}日本語では「**ぼくが**好きなのはマリだ」「ぼくが好きなのは**マリ**だ」のように、声の調子や「〜のは〜だ」の形で強調する部分を変えられます。

フランス語は**強勢の位置を自由に動かせません**（第0章で見たとおり、強勢はリズムグループの最後に固定されています）。英語なら *I* love Marie. と I を強く読むだけで済むところを、フランス語では**構文で**強調したい要素を取り出す必要があります。それが **c'est … qui / que** の強調構文（la mise en relief）です。

この章では、その基本形に加えて、実際の会話で強調構文以上によく使われる**遊離構文**、書き言葉で重要な **ce qui … c'est** 型、そして「〜しか…ない」の **ne … que** まで、**焦点を操作する手段の全体**を扱います。ネイティブの話し言葉は、この章の道具を絶えず使って組み立てられています。聞き取りにも作文にも直結する章です。

なお、この構文は第4章（c'est）と第21章（関係代名詞）の組み合わせでできています。両方を理解していれば、新しく覚えることはほとんどありません。

## 1. 基本の形

**c'est + 強調したい要素 + qui / que + 残りの文**

qui と que の選び方は、**第21章とまったく同じ**です。

| | 強調する要素 |
|---|---|
| **c'est … qui** | **主語** |
| **c'est … que** | **主語以外**（直接目的語・状況補語など） |

:::ex 同じ文で強調位置を変える
Marie aime Paul. | マリ・エム・ポール | マリはポールを愛している。（普通の文）
C'est Marie qui aime Paul. | セ・マリ・キ・エム・ポール | ポールを愛しているのはマリだ。（主語を強調）
C'est Paul que Marie aime. | セ・ポール・ク・マリ・エム | マリが愛しているのはポールだ。（目的語を強調）
:::

:::note 判定は第21章と同じ
**取り出した要素が、元の文で主語だったか**を見ます。

- 主語だった → **qui**
- 目的語・補語だった → **que**

第21章の「後ろに主語が来るかどうか」も同じように使えます。
- C'est Marie **qui aime** …（qui + 動詞）
- C'est Paul **que Marie aime**（que + 主語 + 動詞）
:::

:::deep 強調構文は何をしているのか — 前提と焦点
C'est Marie qui aime Paul. がただの Marie aime Paul. と違うのは、**文の情報を2つの部分に分けている**点です。

- **前提**（既知の情報）… 誰かがポールを愛している
- **焦点**（新しい情報）… それは**マリ**だ

だからこの文は、「誰がポールを愛しているの？」という問いへの答えとしては自然ですが、何の脈絡もなく言うと不自然です。**聞き手がすでに知っていること（前提）を土台に、1点だけを訂正・特定する**——これが強調構文の仕事です。

このため、強調構文は**訂正の文脈**で最もよく使われます。

[[Ce n'est pas moi qui ai cassé le vase, c'est le chat !|ス・ネ・パ・モワ・キ・エ・カセ・ル・ヴァーズ・セ・ル・シャ|花瓶を割ったのは私じゃない、猫だ！]]

英語の *It is … that …*（分裂文）と同じ働きですが、**フランス語のほうがはるかに高頻度**です。英語は強勢移動で済ませる場面でも、フランス語は構文に頼るしかないからです。
:::

## 2. さまざまな要素を強調する

**主語・目的語だけでなく、時・場所・手段なども取り出せます。**

:::ex いろいろな要素を強調する
C'est demain que je pars. | セ・ドゥマン・ク・ジュ・パール | 私が出発するのは明日だ。（時）
C'est à Paris que je l'ai rencontrée. | セ・タ・パリ・ク・ジュ・レ・ランコントレ | 私が彼女に出会ったのはパリだ。（場所）
C'est avec toi que je veux partir. | セ・タヴェック・トワ・ク・ジュ・ヴ・パルティール | 私が一緒に出発したいのは君だ。（相手）
C'est pour toi que j'ai fait ça. | セ・プール・トワ・ク・ジェ・フェ・サ | 私がこれをしたのは君のためだ。（目的）
C'est en travaillant qu'on réussit. | セ・タン・トラヴァイヤン・コン・レユスィ | 成功するのは働くことによってだ。（手段）
:::

:::warn 前置詞は要素と一緒に前へ出す — 英語との決定的な違い
前置詞つきの要素を取り出すときは、**前置詞ごと動かします**。

- ○ C'est **à Paris** que je vais.
- × C'est Paris que je vais **à**.

英語は *It's Paris that I'm going to.* のように前置詞を後ろに残せます（前置詞残留）が、**フランス語では絶対にできません**。前置詞は取り出す要素の頭に付いたまま移動します。

- C'est **de** ce livre **que** je parle.（私が話しているのはこの本についてだ）
- C'est **chez** Marie **que** nous dînons.（私たちが夕食をとるのはマリの家だ）

そして前置詞つきの要素は主語ではありえないので、関係詞は常に **que** です。
:::

:::ex 過去分詞の一致は強調構文の中でも生きる
C'est la lettre que j'ai écrite hier. | セ・ラ・レトル・ク・ジェ・エクリット・イエール | 私が昨日書いたのはこの手紙だ。
Ce sont les photos que nous avons prises. | ス・ソン・レ・フォト・ク・ヌー・ザヴォン・プリーズ | 私たちが撮ったのはこの写真だ。
:::

que で取り出した要素は**前に出た直接目的語**なので、第20章の規則どおり**過去分詞が一致します**（écrit**e**、pris**es**）。強調構文だからといって一致が免除されるわけではありません。

## 3. 代名詞を強調する — 強勢形を使う

:::warn c'est の後ろは強勢形
第19章で見たとおり、c'est の後ろは強い位置なので、**主語形ではなく強勢形**を使います。

- × C'est je qui …
- ○ **C'est moi qui** …

:::ex 代名詞の強調
C'est moi qui ai raison. | セ・モワ・キ・エ・レゾン | 正しいのは私だ。
C'est toi que j'aime. | セ・トワ・ク・ジェーム | 私が愛しているのは君だ。
C'est lui qui a commencé. | セ・リュイ・キ・ア・コマンセ | 始めたのは彼だ。
Ce sont eux qui ont gagné. | ス・ソン・トゥー・キ・オン・ガニェ | 勝ったのは彼らだ。
:::

**3人称複数だけ ce sont** になる点も第19章のとおりです。
:::

:::warn qui の後の動詞は、先行詞の人称に一致する
**ここが最も間違えられる箇所です。**

C'est **moi** qui **ai** raison. — 動詞は **ai**（avoir の1人称単数）であって、a ではありません。

qui が受けているのは moi（＝1人称）なので、動詞も1人称で活用します。第21章で扱った「qui の後の動詞は先行詞に一致する」という規則が、ここで効いています。

| 強調する語 | 動詞の形 |
|---|---|
| C'est **moi** qui | **ai** / **suis** / **vais**… |
| C'est **toi** qui | **as** / **es** / **vas**… |
| C'est **lui** qui | **a** / **est** / **va**… |
| C'est **nous** qui | **avons** / **sommes**… |
| C'est **vous** qui | **avez** / **êtes**… |
| Ce sont **eux** qui | **ont** / **sont**… |

× C'est moi qui **a** raison. は誤りです。日本語話者・英語話者ともによく落とす点なので、意識して練習してください。実は**フランス語の子どもとネイティブの一部も同じ間違いをします**——それだけ「qui の後は3人称」という引力が強いということです。書き言葉では確実に守ってください。
:::

:::deep c'est と ce sont、c'était と c'est — 実際の使われ方
**（1）ce sont は書き言葉の規範**

規範文法では3人称複数の前で ce sont ですが、**話し言葉では c'est eux、c'est les enfants が普通**です。会話で c'est eux と聞こえても間違いではなく、それが現実の口語です。書くときは ce sont を使ってください。

**（2）時制は c'est のままでもよい**

過去の話でも、強調構文の c'est は**現在形のままが普通**です。

- C'**est** hier que je l'ai vu.（私が彼に会ったのは昨日だ）
- C'**était** hier que je l'ai vu.（同じ意味。やや強く過去に置く）

c'était / ce sera に変えることもできますが、義務ではありません。**c'est … que はほぼ固定表現化している**と考えてください。

**（3）未来・複合過去でも枠は同じ**

- Ce **sera** toi **qui** décideras.（決めるのは君になるだろう）
- Ç'**a été** lui **qui** a payé.（払ったのは彼だった——話し言葉）
:::

## 4. 否定・疑問との組み合わせ

:::ex 否定と疑問
Ce n'est pas moi qui ai fait ça. | ス・ネ・パ・モワ・キ・エ・フェ・サ | それをやったのは私じゃない。
Est-ce toi qui as téléphoné ? | エ・ス・トワ・キ・ア・テレフォネ | 電話したのは君？
C'est toi qui as téléphoné ? | セ・トワ・キ・ア・テレフォネ | 電話したのって君？（話し言葉。イントネーションのみ）
Ce n'est pas demain que je pars. | ス・ネ・パ・ドゥマン・ク・ジュ・パール | 私が出発するのは明日じゃない。
N'est-ce pas toi qui me l'avais promis ? | ネ・ス・パ・トワ・キ・ム・ラヴェ・プロミ | それを私に約束したのは君じゃなかったか？
:::

否定するのは **c'est の部分**です。「〜なのは違う」という形で、取り出した要素だけを否定できます。これが強調構文の実用的な価値の1つです。

話し言葉の否定では ne が落ちて **C'est pas moi qui …** となります（第5章）。非常に高頻度の形なので、聞き取れるようにしておいてください。

## 5. ce qui … c'est — 逆向きの強調構文

**c'est … qui / que** が「答えを先に言う」形だとすれば、**「〜なもの、それは…」と前置きしてから答えを言う**形もあります。疑似分裂文（la pseudo-clivée）と呼ばれ、書き言葉・話し言葉の両方で非常によく使われます。

**Ce qui / Ce que + 文, c'est + 焦点**

:::ex ce qui … c'est の型
Ce qui compte, c'est la santé. | ス・キ・コント・セ・ラ・サンテ | 大事なのは健康だ。
Ce que j'aime, c'est le fromage. | ス・ク・ジェーム・セ・ル・フロマージュ | 私が好きなのはチーズだ。
Ce que je veux dire, c'est que tu as raison. | ス・ク・ジュ・ヴ・ディール・セ・ク・チュ・ア・レゾン | 私が言いたいのは、君が正しいということだ。
Ce dont j'ai besoin, c'est de vacances. | ス・ドン・ジェ・ブゾワン・セ・ドゥ・ヴァカンス | 私に必要なのは休暇だ。
Ce qui me plaît ici, c'est le calme. | ス・キ・ム・プレ・イスィ・セ・ル・カルム | ここで気に入っているのは静けさだ。
:::

| 形 | 元の文での役割 |
|---|---|
| **Ce qui** …, c'est | 主語（Ce qui compte「大事である**もの**」） |
| **Ce que** …, c'est | 直接目的語（Ce que j'aime「私が好きな**もの**」） |
| **Ce dont** …, c'est | de を取る補語（avoir besoin **de** → ce **dont**） |

:::note c'est … que との使い分け
- **c'est … que** — 相手の発言を**訂正・特定**する。「（それじゃなくて）〜だ」
- **ce que …, c'est** — **自分の話を導入**する。「私が〜なのはね、…」

Ce que j'aime, c'est … は日本語の「私が好きなのはね…」とほぼ同じ呼吸で使えます。会話の切り出しとして極めて自然な形で、ネイティブは1日に何度も使います。**Ce que je veux dire, c'est que …**（つまり言いたいのは…）は議論の定番表現です。
:::

## 6. c'est que — 理由を述べる

:::adv 「なぜなら」の c'est que
強調構文とは別に、**c'est que** には「（というのは）〜だからだ」という用法があります。

[[Il ne vient pas. C'est qu'il est malade.|イル・ヌ・ヴィアン・パ・セ・キ・レ・マラード|彼は来ない。病気だからだ。]]
[[Si je pars, c'est que je n'ai pas le choix.|スィ・ジュ・パール・セ・ク・ジュ・ネ・パ・ル・ショワ|私が去るのは、選択肢がないからだ。]]

**c'est parce que** と言い換えられます。形は強調構文と似ていますが、後ろに続くのが「取り出した要素」ではなく「完結した文」である点で区別できます。

**Si …, c'est que / c'est parce que …** は「〜なのは、…だからだ」という因果の定型で、理由を強調する最も自然な言い方です。

- Si je te le dis, **c'est que** c'est important.（君に言うのは、重要だからだ）
:::

## 7. 遊離構文 — 話し言葉の主役

:::deep 実際の会話で最も多いのはこれ
c'est … qui / que は明快ですが、**日常会話で最も頻繁に使われる強調はこちら**です。要素を文の外（頭または尻）に出し、**代名詞で受け直す**——遊離構文（la dislocation）です。

**（1）左方遊離 — 主題を先に出す**

:::ex 左方遊離（文頭に出す）
Moi, j'aime Paris. | モワ・ジェーム・パリ | 私はね、パリが好きだ。
Paris, j'adore. | パリ・ジャドール | パリはね、大好き。
Ce livre, je l'ai déjà lu. | ス・リーヴル・ジュ・レ・デジャ・リュ | この本はね、もう読んだよ。
Mes parents, ils habitent à Lyon. | メ・パラン・イル・ザビット・ア・リヨン | うちの両親はリヨンに住んでるんだ。
Le café, j'en bois trop. | ル・カフェ・ジャン・ボワ・トロ | コーヒーはね、飲みすぎなんだ。
:::

**（2）右方遊離 — 言い足して明確化する**

:::ex 右方遊離（文末に出す）
Il est gentil, ton frère. | イ・レ・ジャンティ・トン・フレール | 優しいね、君のお兄さん。
Je l'ai déjà lu, ce livre. | ジュ・レ・デジャ・リュ・ス・リーヴル | もう読んだよ、この本は。
Elle est où, la gare ? | エ・レ・ウ・ラ・ガール | どこなの、駅は？
:::

**代名詞で受け直す**のが文法上の目印です（Ce livre, je **l'**ai lu ／ Le café, j'**en** bois）。受ける代名詞は第17〜26章の規則どおりに選びます——直接目的語なら le / la / les、部分冠詞つきなら en、場所なら y。

**左方遊離と c'est … que の違い**は情報の流れです。

- **Moi, j'aime Paris.** — 「私について言えば」と**主題を立てる**。対比の含み（他の人はどうであれ）
- **C'est moi qui aime Paris.** — 「パリが好きなのは**私だ**」と**特定する**。訂正の含み

日本語の「私は**ね**」と「私**が**」の違いにかなり正確に対応します。

**ネイティブの会話は遊離構文だらけ**です。Moi, je … は口癖のように現れ、フランス語学習者もまず Moi, je … から自然に使い始めます。聞き取りでは「文頭の名詞＋コンマ的な間」が来たら、あとで代名詞が受け直すと予測して聞いてください。
:::

### 主題を導く前置き表現

遊離構文と同じ働きを、句で行うこともできます。

| 表現 | 意味 | 文体 |
|---|---|---|
| **quant à** … | 〜については | 書き言葉寄り |
| **en ce qui concerne** … | 〜に関しては | 改まった場面 |
| **pour** … | 〜としては | 中立 |
| **côté** … | 〜の面では | 話し言葉 |

[[Quant à moi, je reste.|カン・タ・モワ・ジュ・レスト|私はといえば、残ります。]]
[[En ce qui concerne le prix, c'est raisonnable.|アン・ス・キ・コンセルヌ・ル・プリ・セ・レゾナブル|価格に関しては、手頃です。]]

## 8. ne … que — 「〜しか…ない」という焦点

**ne … que** は否定ではなく**制限**（〜しか…ない）を表し、que の直後の要素に焦点を当てます。強調の仲間としてここで整理します。

:::ex ne … que
Je n'ai que dix euros. | ジュ・ネ・ク・ディ・ズーロ | 10ユーロしか持っていない。
Il ne pense qu'à son travail. | イル・ヌ・パンス・カ・ソン・トラヴァイユ | 彼は仕事のことしか考えない。
Elle ne boit que de l'eau. | エル・ヌ・ボワ・ク・ドゥ・ロー | 彼女は水しか飲まない。
On ne vit qu'une fois. | オン・ヌ・ヴィ・キュヌ・フォワ | 人生は一度きりだ。
Il n'y a que toi qui me comprennes. | イル・ニ・ヤ・ク・トワ・キ・ム・コンプレンヌ | 私を分かってくれるのは君だけだ。
:::

:::warn ne … que は pas と違う
- **ne … pas** — 全否定「〜ない」
- **ne … que** — 制限「〜しか…ない」＝ **seulement**（〜だけ）と同じ意味

Je ne bois **que** du café. は「コーヒーしか飲まない」であって、「コーヒーを飲まない」ではありません。que の位置は自由で、**焦点を当てたい要素の直前**に置きます。

- Je ne bois du café **que** le matin.（コーヒーは朝**しか**飲まない）——焦点は「朝」

否定の de への変化（第5章）は**起きません**：Je ne bois que **du** café.（× que de café）。ne … que は意味的に肯定（＝seulement）だからです。

主語を「〜だけ」と言いたいときは ne … que では取り出せないので、**Il n'y a que … qui** か **Seul** を使います。

- **Il n'y a que** Marie **qui** sache la vérité.（真実を知っているのはマリだけだ）
- **Seule** Marie sait la vérité.（同上。書き言葉。seul は性数一致）
:::

## 9. その他の強調手段

:::deep 道具箱を完成させる
**（1）副詞による強調**

[[C'est vraiment beau.|セ・ヴレマン・ボー|本当に美しい。]]、[[Il est tellement gentil.|イ・レ・テルマン・ジャンティ|彼は本当に優しい。]]

**（2）繰り返し・強意の定型**

[[Ça, c'est une bonne idée !|サ・セ・チュヌ・ボンヌ・イデ|それはいい考えだ！]]——ça を立ててから c'est で受ける、会話の頻出パターンです。

**（3）語順の倒置（文語）**

[[Grande fut ma surprise.|グランド・フュ・マ・スュルプリーズ|私の驚きは大きかった。]]（属詞を文頭に）

これは文学的な表現で、日常では使いません。fut は単純過去（第20.5章）です。

**どれを使うか**の目安：

| 場面 | 手段 |
|---|---|
| 相手の言葉を訂正する | **c'est … qui / que** |
| 自分の話を切り出す | **ce que …, c'est** ／ 左方遊離 |
| くだけた会話 | **遊離構文**（Moi, je … ／ …, ton frère） |
| 「〜だけ」と限定する | **ne … que** ／ seul |
| 改まった書き言葉 | c'est … qui / que ／ quant à |
:::

## 10. 疑問詞との組み合わせ

:::note qu'est-ce que も強調構文だった
第12章で扱った疑問代名詞の長形を、いま構造的に説明できます。

**qu'est-ce que** = que（何） + est-ce que（強調構文の疑問形）

つまり「何であるか、それは〜なのは」という強調構文が化石化したものです。だから前半が「人か物か」、後半が「主語か目的語か」という2部品構成になっていたのです。

- **qui est-ce qui**（人・主語）… 主語を強調 → qui
- **qu'est-ce que**(物・目的語）… 目的語を強調 → que

第9章で「est-ce que は c'est que の倒置が化石化したもの」と述べましたが、この章の強調構文がその正体です。**第9章・第12章・第22章は同じ構造の3つの側面**を見ていたことになります。

さらに、疑問詞そのものを強調構文で聞くこともできます。

[[C'est qui qui a fait ça ?|セ・キ・キ・ア・フェ・サ|やったの誰？]]（話し言葉）
[[C'est quoi que tu veux ?|セ・コワ・ク・チュ・ヴ|欲しいのは何？]]（かなりくだけた話し言葉）

規範的ではありませんが、実際の会話では頻繁に聞かれる形です。
:::

## 11. 「ぼくが好きなのは、マリ」

章のタイトルを、この章の道具ぜんぶで言い分けてみます。

:::ex 強調の位置と手段を変える
C'est Marie que j'aime. | セ・マリ・ク・ジェーム | ぼくが好きなのは、マリだ。（訂正・特定）
C'est moi qui aime Marie. | セ・モワ・キ・エム・マリ | マリを好きなのは、ぼくだ。
Ce que j'aime chez Marie, c'est son sourire. | ス・ク・ジェーム・シェ・マリ・セ・ソン・スリール | マリの好きなところは、あの笑顔だ。
Marie, je l'aime. | マリ・ジュ・レーム | マリはね、好きなんだ。（主題化）
Moi, j'aime Marie. | モワ・ジェーム・マリ | ぼくはね、マリが好きなんだ。
Je n'aime que Marie. | ジュ・ネーム・ク・マリ | ぼくはマリしか愛していない。（制限）
Ce n'est pas Marie que j'aime. | ス・ネ・パ・マリ・ク・ジェーム | ぼくが好きなのは、マリじゃない。（否定）
:::

同じ内容が、**何を焦点に置くかで7通りに書き分けられる** ——これが焦点操作の効用です。

[[se coucher\|ス・クシェ\|寝る]] を直訳すると「自分を寝かせる」です。**目的語代名詞が主語と同じものを指す**——これが代名動詞（le verbe pronominal）の出発点です。

日本語や英語には対応する仕組みがないため、最初は不自然に見えます。しかしフランス語では極めて多くの日常動詞がこの形を取り、しかも**同じ形が4つの異なる意味**を担います。

さらに、代名動詞は**すべて助動詞に être を取り**、**過去分詞の一致に独自の条件がある**——第20章の続きとして、ここで一致規則が完成します。

## 1. 形 — 再帰代名詞を付ける

**主語に応じて変化する代名詞（se, me, te, nous, vous）**を動詞の前に置きます。

| 主語 | 再帰代名詞 | 例（se coucher） |
|---|---|---|
| je | **me**（m'） | je me couche |
| tu | **te**（t'） | tu te couches |
| il / elle / on | **se**（s'） | il se couche |
| nous | **nous** | nous nous couchons |
| vous | **vous** | vous vous couchez |
| ils / elles | **se**（s'） | ils se couchent |

:::conj se coucher présent

:::note nous nous / vous vous は誤植ではない
**nous nous couchons** は、1つ目が主語、2つ目が再帰代名詞です。同じ語が2つ並びますが正しい形です。vous vous も同様。

不定詞として辞書に載るときは **se coucher** の形です。この se が、主語に応じて me / te / nous / vous に変わります。
:::

:::ex 日常でよく使う代名動詞
Je me lève à sept heures. | ジュ・ム・レーヴ・ア・セ・タール | 私は7時に起きる。
Tu te laves les mains ? | テュ・ト・ラーヴ・レ・マン | 手を洗った？
Il s'appelle Pierre. | イル・サペル・ピエール | 彼はピエールといいます。
Nous nous promenons. | ヌー・ヌー・プロムノン | 私たちは散歩する。
Vous vous souvenez de moi ? | ヴー・ヴー・スヴネ・ドゥ・モワ | 私を覚えていますか？
Ils se dépêchent. | イル・ス・デペシュ | 彼らは急ぐ。
:::

:::note 自己紹介の s'appeler も代名動詞
[[Je m'appelle Marie.\|ジュ・マペル・マリ\|私はマリといいます。]] を直訳すると「私は自分をマリと呼ぶ」です。第0章で最初に習った表現が、実は代名動詞だったことになります。

なお appeler は綴りが変わる -er 動詞（第8章）なので、je m'appe**ll**e と l が重なります。
:::

## 2. 4つの意味

**同じ形が、文脈によって4通りの意味を持ちます。**

:::deep 代名動詞の4分類

### （1）再帰的用法 — 「自分を／自分に」

主語が自分自身に働きかけます。**最も基本的な用法**です。

:::ex 再帰的用法
Je me lave. | ジュ・ム・ラーヴ | 私は自分を洗う（体を洗う）。
Elle se regarde dans le miroir. | エル・ス・ルガルド・ダン・ル・ミロワール | 彼女は鏡で自分を見る。
Il se coupe. | イル・ス・クップ | 彼は自分を切る（けがをする）。
:::

同じ動詞を、代名動詞にするかどうかで意味が変わります。
- [[Je lave la voiture.\|ジュ・ラーヴ・ラ・ヴォワテュール\|私は車を洗う。]]（他動詞）
- [[Je me lave.\|ジュ・ム・ラーヴ\|私は体を洗う。]]（代名動詞）

### （2）相互的用法 — 「お互いに」

**主語が複数のとき**に限られます。

:::ex 相互的用法
Ils se regardent. | イル・ス・ルガルド | 彼らは互いに見つめ合う。
Nous nous téléphonons souvent. | ヌー・ヌー・テレフォノン・スヴァン | 私たちはよく電話し合う。
Elles s'aiment. | エル・セーム | 彼女らは愛し合っている。
Ils se sont mariés. | イル・ス・ソン・マリエ | 彼らは結婚した。
:::

**（1）との区別は文脈で判断します。** Ils se regardent. は「彼らは自分自身を見る」とも「互いに見つめ合う」とも読めますが、通常は後者です。明示したいときは副詞を添えます。
- 再帰：[[Ils se regardent eux-mêmes.\|イル・ス・ルガルド・トゥー・メーム\|彼らは自分自身を見る。]]
- 相互：[[Ils se regardent l'un l'autre.\|イル・ス・ルガルド・ラン・ロートル\|彼らは互いに見つめ合う。]]

### （3）受動的用法 — 「〜される」

**主語がモノ**のとき、受動の意味になります。

:::ex 受動的用法
Ce livre se vend bien. | ス・リーヴル・ス・ヴァン・ビアン | この本はよく売れる。
Le français se parle au Canada. | ル・フランセ・ス・パルル・オ・カナダ | フランス語はカナダで話されている。
Ça ne se fait pas. | サ・ヌ・ス・フェ・パ | そういうことはしないものだ。
Comment ça s'écrit ? | コマン・サ・セクリ | それはどう綴るのですか？
:::

第28章で扱う受動態（être + 過去分詞）よりも、**この形のほうが日常的によく使われます**。行為者を言う必要がないときの標準的な言い方です。

### （4）本質的用法 — 代名動詞としてしか存在しない

**代名動詞の形でしか使えない**動詞群です。se を取り除くと意味をなしません。

| 動詞 | 意味 |
|---|---|
| [[se souvenir de\|ス・スヴニール\|覚えている]] | ※ souvenir 単独では名詞（思い出） |
| [[s'en aller\|サン・ナレ\|立ち去る]] | |
| [[se moquer de\|ス・モケ\|からかう]] | |
| [[s'évanouir\|セヴァヌイール\|気を失う]] | |
| [[se méfier de\|ス・メフィエ\|警戒する]] | |
| [[s'enfuir\|サンフュイール\|逃げる]] | |
| [[se taire\|ス・テール\|黙る]] | |
| [[s'écrier\|セクリエ\|叫ぶ]] | |

これらは「自分を〜する」と分解できません。**まとめて1語として覚えます。**
:::

:::warn 代名動詞にすると意味が変わる動詞
同じ動詞でも、代名動詞にすると別の意味になるものがあります。

| 通常 | 意味 | 代名動詞 | 意味 |
|---|---|---|---|
| [[passer\|パセ]] | 通る | [[se passer\|ス・パセ]] | 起こる |
| [[rendre\|ランドル]] | 返す | [[se rendre\|ス・ランドル]] | 赴く、降伏する |
| [[douter\|ドゥテ]] | 疑う | [[se douter de\|ス・ドゥテ]] | 察する |
| [[attendre\|アタンドル]] | 待つ | [[s'attendre à\|サタンドル]] | 予期する |
| [[servir\|セルヴィール]] | 仕える | [[se servir de\|ス・セルヴィール]] | 利用する |
| [[mettre\|メットル]] | 置く | [[se mettre à\|ス・メットル]] | 〜し始める |
| [[trouver\|トルヴェ]] | 見つける | [[se trouver\|ス・トルヴェ]] | ある、位置する |

## 3. 否定・疑問・命令形

:::ex 否定形 — 再帰代名詞ごと挟む
Je ne me lève pas. | ジュ・ヌ・ム・レーヴ・パ | 私は起きない。
Il ne se souvient pas. | イル・ヌ・ス・スヴィアン・パ | 彼は覚えていない。
:::

**ne は再帰代名詞の前**に来ます。ne … pas が挟むのは「再帰代名詞 + 動詞」のかたまりです。

:::ex 疑問形
Te souviens-tu de moi ? | ト・スヴィアン・テュ・ドゥ・モワ | 私を覚えている？
Comment vous appelez-vous ? | コマン・ヴー・ザプレ・ヴー | お名前は何ですか？
:::

倒置しても**再帰代名詞は動詞の前に残ります**。動くのは主語だけです。

:::warn 命令形では位置と形が変わる
第16章の規則がここでも効きます。

| | 形 |
|---|---|
| 肯定命令 | 動詞の**後ろ**、te は **toi** に |
| 否定命令 | 動詞の**前**、te のまま |

:::ex 代名動詞の命令形
Lève-toi ! | レーヴ・トワ | 起きろ！
Ne te lève pas ! | ヌ・ト・レーヴ・パ | 起きるな！
Dépêchez-vous ! | デペシェ・ヴー | 急いでください！
Asseyez-vous. | アセイエ・ヴー | お座りください。
Tais-toi ! | テ・トワ | 黙れ！
Va-t'en ! | ヴァ・タン | 出て行け！
:::

最後の Va-t'en ! は s'en aller の命令形です。va + te + en で、te が t' にエリジオンしています。
:::

## 4. 複合過去 — 必ず être、そして一致に条件がある

:::conj se coucher passeCompose

:::warn 代名動詞の助動詞は例外なく être
第20章で「être を取るのは移動・状態変化の自動詞と代名動詞」と述べました。その2つ目がこれです。

**avoir を取る代名動詞は1つもありません。**

- [[Je me suis levé.\|ジュ・ム・スュイ・ルヴェ\|私は起きた。]]（× Je m'ai levé）
- [[Elle s'est couchée.\|エル・セ・クシェ\|彼女は寝た。]]
:::

:::deep 過去分詞の一致 — ここで規則が完成する
代名動詞の過去分詞は、être を取るのに**主語に一致するとは限りません**。条件があります。

**規則：再帰代名詞が「直接目的語」のときだけ一致する。**

第20章の規則③（直接目的語が前にあれば一致）が、そのまま適用されているだけです。再帰代名詞は必ず動詞の前にあるので、あとは**それが直接目的語かどうか**だけが問題になります。

**（a）再帰代名詞が直接目的語 → 一致する**

[[Elle s'est levée.\|エル・セ・ルヴェ\|彼女は起きた。]]
（se lever ＝「自分を起こす」。se は直接目的語 → levée と一致）

[[Ils se sont regardés.\|イル・ス・ソン・ルガルデ\|彼らは見つめ合った。]]
（se は regarder の直接目的語 → regardés）

**（b）再帰代名詞が間接目的語 → 一致しない**

[[Elle s'est lavé les mains.\|エル・セ・ラヴェ・レ・マン\|彼女は手を洗った。]]
（直接目的語は **les mains**。se は「自分に」＝間接目的語 → lavé のまま、× lavée）

[[Ils se sont téléphoné.\|イル・ス・ソン・テレフォネ\|彼らは電話し合った。]]
（téléphoner **à** なので se は間接目的語 → téléphoné のまま）

[[Elles se sont parlé.\|エル・ス・ソン・パルレ\|彼女らは話し合った。]]
（parler **à** → 間接 → 一致しない）

**（c）本質的用法 → 主語に一致する**

se souvenir, s'en aller のように分解できない動詞は、**主語に一致**させます。
[[Elle s'est souvenue de moi.\|エル・セ・スヴニュ・ドゥ・モワ\|彼女は私を覚えていた。]]

**（d）受動的用法 → 主語に一致する**

[[Ces livres se sont bien vendus.\|セ・リーヴル・ス・ソン・ビアン・ヴァンデュ\|これらの本はよく売れた。]]

### 判定の手順

1. その動詞は **本質的用法**か（se souvenir 型）→ **主語に一致**
2. **受動的用法**か → **主語に一致**
3. それ以外 → 再帰代名詞は**直接目的語か間接目的語か**
   - 直接（動詞が前置詞を取らない）→ **一致**
   - 間接（動詞が à を取る／別に直接目的語がある）→ **一致しない**

**Elle s'est lavée.**（一致する）と **Elle s'est lavé les mains.**（一致しない）の対比が、この規則の核心です。後者では les mains という直接目的語が別にあるので、se は「自分に」＝間接目的語に格下げされています。

**第17章・第18章の直接／間接の区別が、ここでも決め手になっています。**
:::

## 5. 身体部位と代名動詞

:::note 「手を洗う」に所有形容詞を使わない理由
第10章で「身体部位には定冠詞を使う」と述べました。その所有者を示すのが、代名動詞の再帰代名詞です。

- ○ [[Je me lave les mains.\|ジュ・ム・ラーヴ・レ・マン\|私は手を洗う。]]
- × Je lave mes mains.

**me が「自分の」を担っている**ので、所有形容詞は要りません。定冠詞 les で足ります。

同じ構造の表現：
[[Je me brosse les dents.\|ジュ・ム・ブロス・レ・ダン\|歯を磨く。]]
[[Il se casse la jambe.\|イル・ス・カス・ラ・ジャンブ\|彼は足を骨折する。]]
[[Elle se coupe les cheveux.\|エル・ス・クップ・レ・シュヴー\|彼女は髪を切る。]]

これらはすべて**過去分詞が一致しません**（直接目的語が別にあるため）。
:::

## 6. 代名動詞でしか言えないこと — 頻出動詞の使い分け

:::deep 代名動詞と普通の形で意味が変わる動詞
多くの動詞は、代名動詞になると**意味がずれます**。「再帰」からは予測できないものを列挙します。

| 普通の形 | 代名動詞 |
|---|---|
| attendre（待つ） | **s'attendre à**（予期する）：Je m'attendais à ça. そうなると思ってた |
| douter（疑う） | **se douter de**（うすうす気づく）：Je m'en doutais. やっぱりね |
| mettre（置く） | **se mettre à**（〜し始める）：Il s'est mis à pleurer. 泣き出した |
| passer（通る） | **se passer**（起こる）：Qu'est-ce qui se passe ? どうしたの？ |
| | **se passer de**（〜なしで済ます）：Je peux m'en passer. |
| trouver（見つける） | **se trouver**（位置する）：Où se trouve la gare ? 駅はどこですか |
| entendre（聞こえる） | **s'entendre**（仲がいい）：On s'entend bien. 気が合う |
| servir（仕える・出す） | **se servir de**（使う）：Je me sers de ce dico. この辞書を使っている |
| rendre（返す） | **se rendre compte de**（気づく）：Je me suis rendu compte de mon erreur. |
| tromper（だます） | **se tromper**（間違える）：Je me suis trompé. 間違えました |
| plaindre（哀れむ） | **se plaindre de**（不平を言う）：Il se plaint tout le temps. |

**Qu'est-ce qui se passe ?**（どうしたの？）、**Je me suis trompé.**（間違えました）、**On s'entend bien.**（気が合う）は日常の最頻出文です。**代名動詞は「再帰」の文法である以上に、これら頻出表現の置き場**だと考えて、1つずつ成句として覚えてください。

なお **se rendre compte** の過去分詞は一致させません（Elle s'est rendu compte …）——compte が直接目的語なので、se は間接目的語になるためです（§4の規則どおり）。
:::

代名動詞は日常の行動を表すものが多いので、まとめて練習できます。

:::ex 一日の流れ

Je me lève tout de suite. | ジュ・ム・レーヴ・トゥ・ドゥ・スュイット | すぐに起きる。
Je me lave et je m'habille. | ジュ・ム・ラーヴ・エ・ジュ・マビーユ | 体を洗って服を着る。
Je me dépêche pour le train. | ジュ・ム・デペシュ・プール・ル・トラン | 電車に間に合うよう急ぐ。
Le soir, je me repose. | ル・ソワール・ジュ・ム・ルポーズ | 夜は休む。
Je me couche vers minuit. | ジュ・ム・クシュ・ヴェール・ミニュイ | 真夜中ごろに寝る。
:::

## 9. 不定詞の中の再帰代名詞 — 主語に合わせて変わる

代名動詞を不定詞のまま使うとき（aller / vouloir / devoir の後など）、**再帰代名詞は不定詞の前に置き、主語に合わせて変化させます**。

:::ex 不定詞でも se は主語に一致
Je vais me coucher. | ジュ・ヴェ・ム・クシェ | もう寝るね。（× Je vais se coucher）
Tu dois te reposer. | チュ・ドワ・トゥ・ルポゼ | 君は休まないと。
Nous allons nous promener. | ヌー・ザロン・ヌー・プロムネ | 散歩に行ってきます。
Vous devez vous dépêcher. | ヴ・ドゥヴェ・ヴ・デペシェ | 急がないといけませんよ。
Ils veulent se marier. | イル・ヴール・ス・マリエ | 彼らは結婚したがっている。
:::

辞書の見出しは se coucher ですが、**se のまま使えるのは3人称だけ**です。je なら me、tu なら te——「se は主語の分身」なので、不定詞の中でも主語を追いかけます。

× Je vais **se** coucher. は日本語話者の頻出誤りです。「寝に行く」と1つの動詞のように感じられるため se を固定してしまうのですが、**Je vais me coucher. / On va se coucher.** と、必ず主語とセットで口に出して覚えてください。

**命令の Va te coucher !**（寝なさい！）も同じ仕組みです（va + te coucher——不定詞ではなく命令＋不定詞句ですが、te が主語 tu に一致している点は同じ）。親が子に毎晩言う定型文です。

## 10. 代名動詞と受動・非人称の境界

代名動詞の4つの意味（§2）のうち、**受動的用法**は他の構文と競合します。境界を整理しておきます。

| 言い方 | 例 | ニュアンス |
|---|---|---|
| **代名動詞** | Ce livre **se vend** bien. | 性質・一般的傾向（よく売れる本だ） |
| **受動態** | Ce livre **est vendu** en France. | 個別の事実（フランスで売られている） |
| **on** | **On vend** ce livre partout. | 動作主をぼかす（どこでも売っている） |

**代名動詞の受動的用法は「そういう性質のものだ」**という一般論を述べます。だから主語は必ず**モノ**で、3人称です。

:::ex 受動的用法の代名動詞
Ça ne se dit pas. | サ・ヌ・ス・ディ・パ | そういう言い方はしない。
Ce vin se boit frais. | ス・ヴァン・ス・ボワ・フレ | このワインは冷やして飲むものだ。
Comment ça s'écrit ? | コマン・サ・セクリ | それはどう綴るのですか？
Le fromage se mange après le plat. | ル・フロマージュ・ス・マンジュ | チーズはメインのあとに食べます。
Ça se voit ! | サ・ス・ヴォワ | 見れば分かるよ！
:::

**Ça ne se dit pas.**（そうは言わない）は語法を説明するときの定型で、辞書や語学教室で頻繁に使われます。**Comment ça s'écrit ?**（どう綴るの？）は綴りを尋ねる標準の言い方です。

:::note 非人称の代名動詞
主語が il の代名動詞もあります。

- **il s'agit de**（〜が問題である、〜のことだ）——第15章
- **il se peut que** + 接続法（〜かもしれない）
- **il se trouve que**（たまたま〜である）

[[Il se peut qu'il pleuve.|イル・ス・プ・キル・プルーヴ|雨が降るかもしれない。]]

いずれも主語の il は何も指さず、代名動詞の形だけを借りた非人称構文です。**代名動詞＝再帰**という理解だけでは説明がつかない用法で、se が「主語と目的語の一致」から離れて**構文の標識**になっている例と言えます。
:::

語尾は**すべての動詞で共通**です。例外は1つもありません。

### 規則動詞の未来語幹＝不定詞

| 群 | 未来語幹 | 例 |
|---|---|---|
| 第1群 -er | **不定詞そのもの** | chanter → je chanter**ai** |
| 第2群 -ir | **不定詞そのもの** | finir → je finir**ai** |
| 第3群 -re | **不定詞から e を取る** | attendre → j'attendr**ai** |

:::conj finir futur

:::conj attendre futur

**-re 動詞で e を落とすのは、-rai の r と重ならないようにするため**です。attendre + ai なら attendreai となって発音しにくいので、e が脱落しました。

:::ex 規則動詞の単純未来

Vous comprendrez plus tard. | ヴー・コンプランドレ・プリュ・タール | あとで分かりますよ。

## 2. 不規則な未来語幹

**語尾は例外なしですが、語幹には不規則があります。** ただし数は限られ、しかも**最頻出の動詞に集中している**ので、まとめて覚えられます。

:::deep 覚えるべき未来語幹

| 不定詞 | 未来語幹 | je の形 |
|---|---|---|
| **être** | ser- | je serai |
| **avoir** | aur- | j'aurai |
| **aller** | ir- | j'irai |
| **faire** | fer- | je ferai |
| **venir** | viendr- | je viendrai |
| **tenir** | tiendr- | je tiendrai |
| **voir** | verr- | je verrai |
| **pouvoir** | pourr- | je pourrai |
| **vouloir** | voudr- | je voudrai |
| **devoir** | devr- | je devrai |
| **savoir** | saur- | je saurai |
| **recevoir** | recevr- | je recevrai |
| **courir** | courr- | je courrai |
| **mourir** | mourr- | je mourrai |
| **envoyer** | enverr- | j'enverrai |
| **falloir** | faudr- | il faudra |
| **pleuvoir** | pleuvr- | il pleuvra |

**共通点**：ほとんどが **-r- で終わり、多くは短くなっています**（aller → ir- が極端な例）。

:::warn r が2つ重なる4語
**courir, mourir, voir, pouvoir** は未来語幹に r が2つ入ります。

- je cou**rr**ai、je mou**rr**ai、je ve**rr**ai、je pou**rr**ai

このうち **courir と mourir** は、現在形（je cours / je meurs）と比べると r が増えている点が見落としやすい箇所です。

**発音でも区別されます。** je cou**r**ais（半過去、r ひとつ）と je cou**rr**ais（条件法、r ふたつ）は、丁寧に発音すれば r の長さで区別できます。ただし日常会話ではほとんど区別されません。

## 3. 単純未来の用法

:::deep 4つの用法

**（1）未来の出来事**

[[Je partirai demain.\|ジュ・パルティレ・ドゥマン\|私は明日出発する。]]

**（2）予測**

[[Il fera beau demain.\|イル・フラ・ボー・ドゥマン\|明日は晴れるだろう。]]
[[Tu comprendras un jour.\|テュ・コンプランドラ・アン・ジュール\|いつか分かるよ。]]

**（3）命令の代わり（丁寧・穏やかな指示）**

[[Tu me téléphoneras.\|テュ・ム・テレフォヌラ\|電話してね。]]
[[Vous fermerez la porte.\|ヴー・フェルムレ・ラ・ポルト\|ドアを閉めておいてください。]]

命令形より**やわらかく、押しつけがましくない**指示になります。章のタイトル「でんわしてね」がこれです。命令形の [[Téléphone-moi !\|テレフォヌ・モワ\|電話して！]] より、[[Tu me téléphoneras ?\|テュ・ム・テレフォヌラ\|電話してくれる？]] のほうが穏やかに響きます。

**（4）婉曲・推量（現在の事柄について）**

[[Ce sera lui, sans doute.\|ス・スラ・リュイ・サン・ドゥット\|きっと彼だろう。]]（今のことを推測している）

これは現在の推量であって、未来の話ではありません。
:::

:::warn 近接未来と単純未来の使い分け（第11章の復習）
| | 近接未来 je vais partir | 単純未来 je partirai |
|---|---|---|
| 現在とのつながり | **強い**（もう決まっている） | 弱い（現在から切り離されている） |
| 文体 | 話し言葉で圧倒的 | 書き言葉・改まった場面 |
| 用法 | 予定・確定した近い未来 | 予測・約束・宣言 |

**日常会話では近接未来が未来表現の大半を占めます。** 単純未来は、天気予報、契約、宣言、文学作品などで多く使われます。

なお時間の遠近は決め手ではありません。[[Je vais avoir 30 ans l'année prochaine.\|ジュ・ヴェ・ザヴォワール・トラン・タン\|来年30歳になる。]] のように、1年先でも確実なら近接未来を使います。
:::

## 4. si（もし）の後では未来を使わない

:::warn 条件の si の後は現在形
これは英語と同じ規則ですが、忘れられやすい点です。

- ○ [[Si tu viens, je serai content.\|スィ・テュ・ヴィアン・ジュ・スレ・コンタン\|君が来れば、私は嬉しい。]]
- × Si tu viendras, …

**si 節の中は現在形、主節が未来形**です。英語の If you come, I will be happy. と完全に対応します。

ただし**間接疑問の si（〜かどうか）は別**で、未来形が使えます。
[[Je ne sais pas s'il viendra.\|ジュ・ヌ・セ・パ・スィル・ヴィアンドラ\|彼が来るかどうか分からない。]]

同じ si でも、**条件を表すのか、「〜かどうか」を表すのか**で扱いが変わります。第30章で si 構文の全体像を扱います。
:::

:::note quand の後では未来を使う
si とは逆に、**quand（〜するとき）の後では未来形を使います**。ここは英語と違うので注意が必要です。

- ○ [[Quand tu viendras, je serai là.\|カン・テュ・ヴィアンドラ・ジュ・スレ・ラ\|君が来るとき、私はそこにいる。]]
- 英語：When you **come**（現在形）, I will be there.

**英語は when 節で現在形を使いますが、フランス語は未来形**です。同じ扱いをするのは quand, lorsque, dès que（〜するとすぐ）, aussitôt que, tant que（〜する限り）など。

これは頻出の誤りなので、**「si は現在、quand は未来」**とセットで覚えてください。
:::

## 5. 前未来 — 未来のある時点で完了している

**前未来（le futur antérieur）**は、**avoir / être の単純未来 ＋ 過去分詞**で作ります。第13章の「③過去分詞」から出る枝の1本です。

:::conj chanter futur,futurAnterieur

**意味は「未来のある時点から見て、すでに完了している」**です。英語の will have done にあたります。

:::ex 前未来
J'aurai fini avant midi. | ジョレ・フィニ・アヴァン・ミディ | 正午前には終わっているだろう。
Quand tu arriveras, je serai déjà parti. | カン・テュ・アリヴラ・ジュ・スレ・デジャ・パルティ | 君が着くころには、私はもう出発しているだろう。
Dès que j'aurai terminé, je t'appellerai. | デ・ク・ジョレ・テルミネ・ジュ・タペルレ | 終わり次第、君に電話する。
:::

:::deep 前未来の2つの用法

**（1）未来における完了**（上の例文）

**（2）過去の推量**

[[Il aura oublié.\|イ・ロラ・ウブリエ\|彼は忘れたのだろう。]]
[[Elle se sera trompée.\|エル・ス・スラ・トロンペ\|彼女は間違えたのだろう。]]

形は未来ですが、**過去の出来事についての推量**を表します。単純未来の（4）婉曲・推量が現在について働くのに対し、前未来は過去について働きます。

| 形 | 推量の対象 |
|---|---|
| 単純未来 | **現在**（Ce sera lui.＝きっと彼だろう） |
| 前未来 | **過去**（Il aura oublié.＝忘れたのだろう） |

**助動詞と一致の規則は複合過去とまったく同じ**です（第20章）。être を取る動詞は主語に一致し、avoir でも直接目的語が前に出れば一致します。
:::

:::note dès que + 前未来 は決まった組み合わせ
「〜し終えたらすぐに」を表すとき、**dès que / aussitôt que + 前未来**が定型です。

[[Dès que tu auras fini, préviens-moi.\|デ・ク・テュ・オラ・フィニ・プレヴィアン・モワ\|終わったらすぐ知らせて。]]

英語では As soon as you **have finished**（現在完了）と言うところですが、フランス語は**前未来**を使います。前節の「quand の後は未来形」の規則が、複合時制でも同じように働いているだけです。
:::

## 6. 条件法現在への橋渡し

:::warn ここまで来れば条件法現在は完成している
第13章で述べたとおり、**条件法現在＝未来語幹 ＋ 半過去の語尾**です。

:::conj chanter futur,conditionnel

- 単純未来：chanter + **ai, as, a, ons, ez, ont**
- 条件法現在：chanter + **ais, ais, ait, ions, iez, aient**

**語幹はまったく同じ**で、語尾を半過去のものに差し替えるだけ。不規則動詞の未来語幹（ser-, aur-, ir-, fer-, verr-…）も、そのまま条件法に使えます。

つまり**この章で覚えた17個の未来語幹が、第30章でそのまま使い回せます**。第30章で新しく学ぶのは用法（仮定・語調緩和）だけです。
:::

:::warn je serai と je serais の聞き分け
書けば1文字違いですが、発音も微妙にしか違いません。

- [[je serai\|ジュ・スレ\|私は〜だろう]]（単純未来、語尾は [e] に近い）
- [[je serais\|ジュ・スレ\|私は〜だろうに]]（条件法、語尾は [ɛ] に近い）

伝統的には [e] と [ɛ] で区別されますが、**現代の話し言葉ではほぼ区別されません**。文脈（si 節があるか、丁寧表現か）で判断することになります。

これはフランス語の書き取りで最も難しい対立の1つです。
:::

## 7. 未来の言い方を選ぶ — 3つの手段の実際

:::deep 近接未来・単純未来・現在形 — 使い分けの実態
フランス語には未来を言う手段が3つあります。

| 手段 | 例 | 使いどころ |
|---|---|---|
| **現在形** | Je pars **demain**. | 予定が確定していて、時の副詞がある |
| **近接未来**（第11章） | Je **vais partir** demain. | 会話の既定。現在との地続き |
| **単純未来** | Je **partirai** demain. | 予測・約束・宣言。書き言葉 |

**時の副詞があれば現在形で足りる**——これが会話の実態です。Je pars demain.（明日発つよ）は完全に自然で、日本語の「明日出発する」と同じ発想です。

単純未来が選ばれるのは：

- **天気予報・予測**：[[Demain, il fera beau.|ドゥマン・イル・フラ・ボー|明日は晴れるでしょう。]]
- **約束・誓い**：[[Je t'aimerai toujours.|ジュ・テムレ・トゥジュール|ずっと君を愛するよ。]]
- **指示・規則**（未来形の命令的用法）：[[Tu feras tes devoirs avant de sortir.|チュ・フラ・テ・ドゥヴォワール|出かける前に宿題をやりなさい。]]
- **丁寧な言い回し**：[[Je vous demanderai un peu de patience.|ジュ・ヴ・ドゥマンドレ|少々ご辛抱をお願いします。]]

聖書の十戒（Tu ne tueras point. 汝殺すなかれ）が未来形なのは、この命令的用法です。

**quand + 未来形**（第31.5章で詳述）も忘れずに：英語と違い、[[Quand il arrivera, on mangera.|カン・ティ・ラリヴラ・オン・マンジュラ|彼が着いたら食べよう。]] と**両方を未来形**にします。
:::

## 8. 未来を指す時の表現 — カレンダーの語彙

未来形と組む時の表現をまとめます。**dans / en の対立**（第7.5章）もここで復習できます。

| 表現 | 意味 |
|---|---|
| **demain** / après-demain | 明日／あさって |
| demain **matin / soir** | 明日の朝／晩 |
| **la semaine prochaine** | 来週 |
| **le mois prochain** / l'année prochaine | 来月／来年 |
| **dans** trois jours | 3日後に |
| **d'ici** samedi / d'ici là | 土曜までに／それまでに |
| **jusqu'à** dimanche | 日曜まで（継続の終点） |
| **à partir de** lundi | 月曜から |
| **dès** demain | 明日からすぐ |
| **bientôt** / tout à l'heure | まもなく／のちほど（今日中） |

:::ex 未来の時の表現
On se voit la semaine prochaine ? | オン・ス・ヴォワ・ラ・スメーヌ・プロシェーヌ | 来週会う？
Je te rappelle tout à l'heure. | ジュ・トゥ・ラペル・トゥ・タ・ルール | あとでかけ直すね。
D'ici là, repose-toi bien. | ディスィ・ラ・ルポーズ・トワ・ビヤン | それまでゆっくり休んで。
Le projet sera fini d'ici la fin du mois. | ル・プロジェ・スラ・フィニ・ディスィ・ラ・ファン・デュ・モワ | 企画は月末までに終わるでしょう。
À partir de demain, je me lève tôt ! | ア・パルティール・ドゥ・ドゥマン・ジュ・ム・レーヴ・ト | 明日から早起きするぞ！
:::

**tout à l'heure** は「さっき」（過去）と「のちほど」（未来）の両方に使える語で、**同じ日の中の近い時点**を指します。別れ際の **À tout à l'heure !**（またあとでね）も頻出です。**d'ici + 時点**（〜までに）は締め切りの言い方で、ビジネスでも日常でも活躍します。

## 10. 未来形が要る従属節 — quand と si の対立

第31.5章で体系的に扱う内容ですが、**未来形の運用で最も重要な規則**なのでここで確定させます。

| 接続詞 | 中の時制 | 例 |
|---|---|---|
| **quand / lorsque**（〜のとき） | **未来形** | Quand il **arrivera**, on partira. |
| **dès que / aussitôt que**（〜したらすぐ） | **未来形** | Dès que je **saurai**, je te dirai. |
| **tant que**（〜する限り） | **未来形** | Tant qu'il **fera** beau, on restera. |
| **une fois que**（いったん〜すれば） | **未来形** | Une fois qu'il **sera** parti, on dînera. |
| **si**（もし〜なら） | **現在形**（未来形は不可） | **Si** il **fait** beau, on sortira. |

**時を表す接続詞は未来形、条件の si だけが現在形**——この一点だけ覚えれば足ります。

:::ex 未来形が2つ並ぶ
Quand tu seras grand, tu comprendras. | カン・チュ・スラ・グラン・チュ・コンプランドラ | 大きくなったら分かるよ。
Dès que j'aurai fini, je t'appellerai. | デ・ク・ジョレ・フィニ・ジュ・タプレレ | 終わり次第、電話するね。
Tant que tu seras là, tout ira bien. | タン・ク・チュ・スラ・ラ | 君がいてくれる限り、大丈夫だ。
:::

2つ目の **Dès que j'aurai fini**（前未来）に注目してください。**従属節の出来事が主節より先に完了している**なら、単純未来ではなく**前未来**を使います。「終わってしまったらすぐ」という完了の含みが要るからです。

- Quand il **arrivera**, on partira.（着いたら出発する——同時）
- Quand il **sera arrivé**, on partira.（着いてしまったら出発する——完了が先）

英語には「時・条件の副詞節で未来形を使わない」という規則がありますが、**フランス語にはありません**。素直に時間関係を時制で表す——それだけです。

{lead}**en** はたった2文字の語ですが、フランス語で最も使用頻度が高く、しかも日本語話者が最後まで使いこなせない代名詞です。

理由は単純で、**日本語に対応する語がない**からです。日本語では言わずに済ませてしまう部分を、フランス語では en で明示しなければなりません。

しかし規則そのものは明快です。**en は「de + 何か」を受ける** ——これだけです。第21章の関係代名詞 dont が「de + 名詞」を受けたのと、まったく同じ構造です。

## 1. en が受けるもの

| 受けるもの | 例 |
|---|---|
| **de + 名詞**（場所・事柄） | Je viens **de Paris**. → J'**en** viens. |
| **不定冠詞・部分冠詞 + 名詞** | Je bois **du café**. → J'**en** bois. |
| **数量表現 + 名詞** | J'ai **trois livres**. → J'**en** ai trois. |
| **de + 不定詞** | J'ai besoin **de partir**. → J'**en** ai besoin. |

:::note 判定の手順は dont と同じ
第18章・第21章と同じ手順です。

1. 名詞のままの文を作る：Je bois **du** café.
2. **de** が含まれるか確認する（du = de + le）→ **含まれる**
3. だから **en**：J'**en** bois.

**「de があれば en」** ——これが唯一の判定基準です。
:::

## 2. 用法（1）de + 場所・事柄を受ける

:::ex de + 名詞を受ける
Je viens de Paris. → J'en viens. | ジャン・ヴィアン | 私はそこから来た。
Il parle de son travail. → Il en parle. | イ・ラン・パルル | 彼はそれについて話す。
J'ai besoin de ce livre. → J'en ai besoin. | ジャ・ネ・ブゾワン | 私はそれが必要だ。
Elle est contente de son travail. → Elle en est contente. | エ・ラン・ネ・コンタント | 彼女はそれに満足している。
:::

**de を取る動詞・形容詞**（第7章・第21章で見たもの）がそのまま対象になります：parler de, avoir besoin de, se souvenir de, avoir peur de, être content de, être fier de …

**de + 不定詞や que 節**も en で受けられます。「そのこと」とまとめて指す使い方です。

:::ex de + 不定詞・文の内容を受ける
Tu as envie de partir ? — Oui, j'en ai envie. | ウィ・ジャ・ネ・アンヴィ | 出発したい？ — うん、したい。
Il est parti ? — J'en suis sûr. | ジャン・スュイ・スュール | 彼は発った？ — 間違いないよ。（être sûr de）
Elle a réussi, et j'en suis fier. | エ・ジャン・スュイ・フィエール | 彼女は合格した。私はそれを誇りに思う。
Merci, je m'en souviendrai. | メルスィ・ジュ・マン・スヴィヤンドレ | ありがとう、このことは忘れません。
:::

## 3. 用法（2）不定冠詞・部分冠詞つきの名詞を受ける

**ここが日本語話者にとって最も難しい用法です。**

:::ex 部分冠詞・不定冠詞を受ける
Tu bois du café ? — Oui, j'en bois. | ウィ・ジャン・ボワ | コーヒー飲む？ — うん、飲むよ。
Tu as des amis ici ? — Oui, j'en ai. | ウィ・ジャ・ネ | ここに友達いる？ — うん、いるよ。
Vous voulez du pain ? — Non, merci, je n'en veux pas. | ジュ・ナン・ヴ・パ | パンはいかがですか？ — いえ、結構です。
:::

:::warn 日本語では言わない部分を、フランス語は必ず言う
「コーヒー飲む？」「うん、飲むよ」——日本語では「飲むよ」だけで通じます。

しかしフランス語で **Oui, je bois.** と言うと、「私は（酒を）飲む人間だ」という別の意味になってしまいます。**何を飲むのかを en で受けないと文が成立しない**のです。

同じく：
- × Oui, j'ai.（意味をなさない）
- ○ **Oui, j'en ai.**（うん、持ってるよ）

**目的語を省略できない** ——これがフランス語の基本的な性質で、en はそのための道具です。第17章で「代名詞は動詞の前」と学んだのと同じ理由です。
:::

## 4. 用法（3）数量表現とともに使う

**数や量を表す語が残る**のが特徴です。

:::ex 数量が残る
Combien de livres as-tu ? — J'en ai trois. | ジャ・ネ・トロワ | 本は何冊持ってる？ — 3冊持ってる。
Tu as des frères ? — Oui, j'en ai deux. | ウィ・ジャ・ネ・ドゥ | 兄弟いる？ — うん、2人いる。
Il y a beaucoup de monde ? — Il y en a beaucoup. | イ・リヤ・ナ・ボクー | 人は多い？ — 多いよ。
J'en veux un peu. | ジャン・ヴ・アン・プ | 少し欲しい。
:::

:::warn 数量表現は en と併用する（省略しない）
- × J'ai trois.
- ○ J'**en** ai trois.

数詞や beaucoup / un peu / assez などが文中にあっても、**en は必要**です。en が「何の3つか」を示し、数詞が「いくつか」を示す——役割が違うので両方要ります。

英語では I have three. で足りますが、フランス語では en が省けません。
:::

:::note un / une は数詞として残る
不定冠詞 un / une つきの名詞を受けるときは、**un / une を数詞として残します**。

- [[Tu as une voiture ? — Oui, j'en ai une.\|ウィ・ジャ・ネ・ユヌ\|車持ってる？ — うん、1台持ってる。]]
- 否定なら残しません：[[Non, je n'en ai pas.\|ノン・ジュ・ナ・ネ・パ\|いや、持ってない。]]（第2章の否定の de により un が消えるため）
:::

### 形容詞や疑問と組み合わせる

数量の後に**形容詞が残る**こともできます。また「いくつ？」と聞き返すときも en が要ります。

:::ex 数量 + 形容詞、疑問
Tu as des chemises ? — J'en ai deux blanches. | ジャ・ネ・ドゥ・ブランシュ | シャツ持ってる？ — 白いのを2枚持ってる。
Il y a des questions ? — Oui, il y en a une. | ウィ・イ・リ・ヤ・ナ・ユヌ | 質問はありますか？ — はい、1つあります。
Tu en veux combien ? | チュ・アン・ヴ・コンビアン | いくつ欲しいの？
Il y en a combien ? | イ・リ・ヤ・ナ・コンビアン | いくつあるの？
J'en voudrais un kilo. | ジャン・ヴドレ・アン・キロ | 1キロください。（市場での買い物）
:::

**J'en voudrais un kilo.**（1キロください）は市場・チーズ屋・肉屋での定型です。指させば名詞を言う必要がなく、en だけで通じます。**en は「買い物のフランス語」の中心にいる代名詞**です。

### 量を表す語のカタログ

en と組める数量表現をまとめます。**すべて「en + 動詞 + 数量」の形**になります。

| 数量表現 | 例 | 意味 |
|---|---|---|
| 数詞 | J'en ai **trois**. | 3つ持っている |
| **beaucoup** | Il y en a **beaucoup**. | たくさんある |
| **un peu** | J'en veux **un peu**. | 少し欲しい |
| **assez** | J'en ai **assez**.（成句では「うんざり」） | 十分ある |
| **trop** | Tu en fais **trop**. | やりすぎだ |
| **plusieurs** | J'en connais **plusieurs**. | 何人も知っている |
| **quelques-uns / unes** | J'en ai lu **quelques-uns**. | 何冊か読んだ |
| **aucun / aucune** | Je n'en ai **aucun**. | 1つもない |
| **la moitié** | J'en ai mangé **la moitié**. | 半分食べた |
| **d'autres** | Il y en a **d'autres**. | 他にもある |

**J'en ai assez !** は文字どおりは「十分ある」ですが、成句としては「**もううんざりだ**」です。J'en ai marre. の少し上品な言い方として、そのまま使えます。

## 5. 位置と語順

**他の目的語代名詞と同じく動詞の前**です。ただし**en は代名詞の中で最後**に置かれます。

:::ex en の位置
J'en veux. | ジャン・ヴ | 私はそれが欲しい。
Je n'en veux pas. | ジュ・ナン・ヴ・パ | 私はそれが要らない。
Je vais en acheter. | ジュ・ヴェ・ザン・アシュテ | 私はそれを買うつもりだ。
J'en ai acheté. | ジャ・ネ・アシュテ | 私はそれを買った。
Donne-m'en ! | ドンヌ・マン | それをちょうだい！
Il m'en a parlé. | イル・マン・ナ・パルレ | 彼はそれについて私に話した。
:::

:::warn 肯定命令では m'en / t'en になる
第16章・第19章で見たとおり、肯定命令では代名詞が動詞の後ろに来て me が moi に変わります。しかし **en が続く場合は m'en** と弱形に戻ります。

- [[Donne-moi ça.\|ドンヌ・モワ・サ\|それをちょうだい。]]（en なし → moi）
- [[Donne-m'en.\|ドンヌ・マン\|それをちょうだい。]]（en あり → m'en）
- [[Va-t'en !\|ヴァ・タン\|出て行け！]]（te + en → t'en）

また第16章で見たとおり、**第1群の tu の命令形では -s が復活します**：[[Parles-en !\|パルル・ザン\|それについて話して！]]、[[Manges-en !\|マンジュ・ザン\|それを食べて！]]
:::

:::deep 過去分詞は en に一致しない
第20章の規則③では「直接目的語が前に出れば過去分詞が一致する」と述べました。**しかし en は例外で、一致させません。**

- [[Des pommes ? J'en ai acheté.\|デ・ポム・ジャ・ネ・アシュテ\|りんご？ 買ったよ。]]（× achetées）

en は「不特定の量」を表すため、性数が確定しない——というのが説明です。**en は一致の対象外**、と規則として覚えてください。
:::

## 6. en を使った慣用表現

:::adv 成句の en
en が何を指すのか説明できない、化石化した表現があります。まとめて覚えます。

| 表現 | 意味 |
|---|---|
| [[Je m'en vais.\|ジュ・マン・ヴェ]] | 私は行く（s'en aller） |
| [[Je n'en peux plus.\|ジュ・ナン・プ・プリュ]] | もう限界だ |
| [[Ne t'en fais pas.\|ヌ・タン・フェ・パ]] | 心配しないで |
| [[Je m'en fiche.\|ジュ・マン・フィッシュ]] | どうでもいい（くだけた） |
| [[Il s'en est sorti.\|イル・サン・ネ・ソルティ]] | 彼は切り抜けた |
| [[J'en ai marre.\|ジャ・ネ・マール]] | うんざりだ（くだけた） |
| [[Où en êtes-vous ?\|ウー・アン・ネット・ヴー]] | どこまで進みましたか |
| [[Il n'en reste plus.\|イル・ナン・レスト・プリュ]] | もう残っていない |
| [[J'en ai pour cinq minutes.\|ジャ・ネ・プール・サン・ミニュット]] | 5分で済みます |
| [[Je n'en reviens pas.\|ジュ・ナン・ルヴィヤン・パ]] | 信じられない（驚き） |
| [[Il s'en est fallu de peu.\|イル・サン・ネ・ファリュ・ドゥ・プ]] | もう少しのところだった |
| [[C'en est trop.\|サン・ネ・トロ]] | もうたくさんだ（文語調） |

**J'en ai marre.** と **Je n'en peux plus.** は日常会話で非常によく使われます。**J'en ai pour cinq minutes.**（5分で済む）は待たせるときの決まり文句で、en が「かかる時間・費用」を漠然と受けています。

もう1つ、**en vouloir à quelqu'un** は要注意の慣用です。

- [[Tu m'en veux ?\|チュ・マン・ヴ\|私のこと怒ってる？]]
- [[Ne m'en veux pas.\|ヌ・マン・ヴ・パ\|怒らないで。]]

vouloir（欲しい）と en が組むと「**恨む・根に持つ**」という別の意味になります。Tu m'en veux ? を「私が欲しいの？」と誤解しないよう、成句として覚えてください。
:::

:::deep 人を受ける en — 規範と実際
規範文法では、**en は物・事柄を受け、人には de + 強勢形を使う**とされます。

- 物：Je parle de ce livre. → J'**en** parle.
- 人：Je parle de Marie. → Je parle **d'elle**.（規範）

しかし実際の話し言葉では、人でも en がよく使われます（Marie ? On en parlait justement. マリ？ ちょうど彼女の話をしてたんだ）。**書くときは de + 強勢形、聞くときは en も人を指しうる**と知っておけば十分です。

同じ非対称は y（第26章）にもあります。à + 人は lui / leur か à + 強勢形で受けるのが規範ですが、口語では緩みます。**規範は「人は代名詞らしい代名詞で、物は en / y で」という役割分担**を保とうとしている——と理解しておくと、両方の姿が腑に落ちます。
:::

## 7. 前置詞 en と混同しない

:::warn 3つの en がある
綴りが同じで、まったく別のものが3つあります。

| | 例 | 見分け方 |
|---|---|---|
| **代名詞の en** | [[J'en veux.\|ジャン・ヴ\|それが欲しい]] | **動詞の前** |
| **前置詞の en** | [[en France\|アン・フランス\|フランスで]]、[[en voiture\|アン・ヴォワテュール\|車で]] | **名詞の前**（無冠詞） |
| **ジェロンディフの en** | [[en chantant\|アン・シャンタン\|歌いながら]] | **現在分詞の前**（第29章） |

**位置で区別できます。** 動詞の直前にあれば代名詞、名詞の前なら前置詞、-ant で終わる語の前ならジェロンディフです。
:::

## 8. y との違い（次章への橋渡し）

第26章で扱う **y** と対になっているので、ここで対比しておきます。

| | 受けるもの |
|---|---|
| **en** | **de** + 名詞 |
| **y** | **à** + 名詞、場所を表す前置詞 + 名詞 |

:::ex en と y の対比
Je viens de Paris. → J'en viens. | ジャン・ヴィアン | そこから来る。
Je vais à Paris. → J'y vais. | ジ・ヴェ | そこへ行く。
Je parle de ce livre. → J'en parle. | ジャン・パルル | それについて話す。
Je pense à ce livre. → J'y pense. | ジ・パンス | それについて考える。
:::

**de なら en、à なら y** ——この対応さえ掴めば、2つの章は同じ構造として理解できます。

:::deep 遊離構文と en — 会話のリズム
第22章で見た遊離構文（主題を文頭に出す言い方）は、en と組むと会話の最も自然なリズムを作ります。

:::ex 主題 + en の受け直し
Des amis, j'en ai beaucoup. | デ・ザミ・ジャ・ネ・ボクー | 友達なら、たくさんいるよ。
Du courage, il en faut ! | デュ・クラージュ・イ・ラン・フォ | 勇気ってものが要るんだ！
Des erreurs, tout le monde en fait. | デ・ゼルール・トゥ・ル・モンド・アン・フェ | 間違いなんて、誰でもするさ。
Des questions, il y en a toujours. | デ・ケスチョン・イ・リ・ヤ・ナ・トゥジュール | 質問というのは、いつでもあるものだ。
:::

文頭に**不定冠詞・部分冠詞つきの名詞**を主題として投げ出し、後から en で受け直す——「〜なら／〜ってものは」という日本語の呼吸にとても近い形です。ネイティブの会話ではこの型が絶えず現れます。聞き取りでは「文頭の des / du + 名詞」が来たら、後で en が受けると予測してください。
:::

## 9. よくある誤り

:::warn 日本語話者がやりがちな7つの誤り
| × | ○ | 理由 |
|---|---|---|
| Oui, je bois.（コーヒー飲む？への返事） | Oui, j'**en** bois. | 目的語は省略できない（§3） |
| J'ai trois. | J'**en** ai trois. | 数量表現があっても en は必要（§4） |
| Oui, j'en ai un.（否定で） | Non, je n'en ai **pas**. | 否定では un / une を残さない（§4） |
| J'en ai achet**ées**. | J'en ai acheté. | en は過去分詞に一致しない（§5） |
| Donne-moi-en. | Donne-**m'en**. | en の前では moi が m' に戻る（§5） |
| Je le parle.（ce livre について） | J'**en** parle. | parler **de** なので en（§2） |
| J'en vais.（立ち去る） | Je **m'en** vais. | s'en aller は代名動詞。se が要る（§6） |
:::

## 10. en と組む動詞を練習する

en と最もよく組むのは boire / vouloir / avoir / prendre / acheter です。

:::conj boire present,passeCompose

:::drill boire,vouloir,avoir,prendre,acheter present,passeCompose


:::ai-gen 代名詞 en、de を受ける代名詞、数量表現との併用

## 11. en が使えないとき — de + 強勢形と de cela

en は de を受ける万能の代名詞ですが、**受けられないもの**が2つあります。

**（1）de + 人 → de + 強勢形**（§6の deep で触れた規範）

- Je parle **de Marie**. → Je parle **d'elle**.（× J'en parle ——規範では）

**（2）de + 指示 → de ça / de cela**

事柄を強調して指すときは、en ではなく **de ça** を使うことがあります。

- [[Je ne veux pas parler de ça.|ジュ・ヌ・ヴ・パ・パルレ・ドゥ・サ|その話はしたくない。]]
- [[Qu'est-ce que tu penses de ça ?|ケス・ク・チュ・パンス・ドゥ・サ|それについてどう思う？]]

en は無強勢で軽いため、**強調したい・対比したいときは重い de ça に置き換える**——第19章で見た「弱形 me / 強勢形 moi」と同じ原理です。

:::note en と所有形容詞の使い分け
「その〜」を言うとき、en を使うか所有形容詞を使うかで揺れます。

- **物が主語**：J'aime cette ville ; **j'en** apprécie le calme.（この街が好きだ。その静けさがいい）——書き言葉
- **人が主語**：J'ai un ami ; **sa** sœur est médecin.（友人がいる。その姉は医者だ）——所有形容詞

規範では「**先行するものが物なら en + 定冠詞、人なら所有形容詞**」とされますが、現代語では物にも son / sa が広く使われます（… ; **son** calme est agréable.）。**書くときは en + 定冠詞のほうが引き締まる**、という文体上の目安として持っておいてください。
:::

FR.chapter({

  title: 'y, le',
  sub: '特殊な代名詞・II 「イ」「ル」',
  body: `
{lead}前章の en が **de** を受けたのに対し、この章の **y** は **à** と場所を受けます。2つで対になっており、規則も対称的です。

あわせて、第17章で少し触れた**中性代名詞 le** をここで正面から扱います。これは名詞ではなく**形容詞や文全体**を受ける代名詞で、日本語話者が落としやすい要素です。英語の Yes, I am. にあたる部分に、フランス語では必ず le が要ります。

この章を終えると、フランス語の代名詞が出そろいます。**主語・直接目的語・間接目的語・強勢形・en・y・中性の le**——7種類です。次の第26.5章では、これらを2つ以上並べるときの語順を扱います。つまりこの章は、代名詞体系の最後のピースです。

## 1. y が受けるもの

| 受けるもの | 例 |
|---|---|
| **場所を表す前置詞 + 名詞** | Je vais **à Paris**. → J'**y** vais. |
| **à + 事柄**（モノ・抽象） | Je pense **à mon travail**. → J'**y** pense. |
| **à + 不定詞** | Je réussis **à comprendre**. → J'**y** réussis. |

:::ex y の基本用法
Je vais à Paris. → J'y vais. | ジ・ヴェ | 私はそこへ行く。
Tu habites à Tokyo ? — Oui, j'y habite. | ウィ・ジ・アビット | 東京に住んでるの？ — うん、住んでる。
Il pense à son avenir. → Il y pense. | イ・リ・パンス | 彼はそれについて考える。
Je réponds à la question. → J'y réponds. | ジ・レポン | 私はそれに答える。
Le livre est sur la table ? — Oui, il y est. | ウィ・イ・リ・エ | 本は机の上？ — うん、あるよ。
:::

:::note y は「そこ」と「それに」の両方
- **場所** … à, dans, sur, sous, chez, en, devant, derrière, vers, sous など、**場所を表す前置詞すべて**を受けます。「そこへ」「そこで」。
- **事柄** … **à + モノ・抽象**を受けます。「それに」「それについて」。

de を受ける前置詞は en 一択だったのに対し、y は場所であれば前置詞を問いません。

:::ex 場所ならどの前置詞でも y
Il est dans la cuisine ? — Oui, il y est. | ウィ・イ・リ・エ | 台所にいる？ — うん、いるよ。
Tu vas chez le médecin ? — J'y vais demain. | ジ・ヴェ・ドゥマン | 医者に行く？ — 明日行く。
Les clés sont sous le journal. → Elles y sont. | エ・リ・ソン | 鍵は新聞の下だ。→ そこにある。
Il travaille en France. → Il y travaille. | イ・リ・トラヴァイユ | 彼はフランスで働いている。
:::

**ただし de + 場所は y ではなく en** で受けます（第25章）。「〜から」は起点なので en の担当です。

- Il vient **de** Paris. → Il **en** vient.（そこから来る）
- Il va **à** Paris. → Il **y** va.（そこへ行く）
:::

:::deep y と en の語源 — もともと対をなす副詞だった
**y** はラテン語の **ibi**（そこに）、**en** はラテン語の **inde**（そこから）に由来します。どちらも**場所を指す副詞**で、ラテン語の段階からすでに「そこに」と「そこから」で対になっていました。

この起源が、現代フランス語の役割分担をそのまま説明します。

| | 語源 | 意味 | 受ける前置詞 |
|---|---|---|---|
| **y** | ibi（そこに） | 到達点 | **à** と場所 |
| **en** | inde（そこから） | 起点 | **de** |

第7.5章で見たとおり、à の中核は「到達」、de の中核は「起点」でした。**y と en は、その2つの前置詞をそれぞれ1語で受ける代名詞**です。

イタリア語の **ci / ne**、カタルーニャ語の **hi / en** も同じ起源を持ち、同じ働きをします。スペイン語だけがこの対を失いました。
:::

:::warn y は「人」には使えない
これが最重要の制限です。第18章で見たとおり、**à + 人**は間接目的語代名詞（lui / leur）または強勢形で受けます。

| 受けるもの | 使う代名詞 |
|---|---|
| à + **人**（普通の動詞） | **lui / leur**（第18章） |
| à + **人**（penser à 型） | **à + 強勢形**（第19章） |
| à + **モノ・事柄** | **y** |

:::ex 人とモノで代名詞が変わる
Je réponds à Marie. → Je lui réponds. | ジュ・リュイ・レポン | 私は彼女に答える。
Je réponds à la question. → J'y réponds. | ジ・レポン | 私はそれに答える。
Je pense à Marie. → Je pense à elle. | ジュ・パンス・ア・エル | 私は彼女のことを考える。
Je pense à mon travail. → J'y pense. | ジ・パンス | 私はそれについて考える。
:::

**同じ動詞でも、相手が人かモノかで代名詞が変わる** ——ここがフランス語の代名詞体系で最も細かい部分です。
:::

### penser à 型の動詞 — à + 強勢形を取るグループ

第18章で「à + 人は lui / leur」と学びましたが、**それが当てはまらない動詞群**があります。これらは人が相手でも **à + 強勢形**を使います。

| 動詞 | 意味 | 人が相手のとき |
|---|---|---|
| **penser à** | 〜のことを考える | Je pense **à elle**. |
| **songer à** | 〜に思いをはせる | Je songe **à lui**. |
| **tenir à** | 〜を大切に思う | Je tiens **à toi**. |
| **faire attention à** | 〜に注意する | Fais attention **à lui**. |
| **s'intéresser à** | 〜に興味がある | Je m'intéresse **à eux**. |
| **s'habituer à** | 〜に慣れる | Je m'habitue **à elle**. |
| **se fier à** | 〜を信頼する | Je me fie **à toi**. |
| **renoncer à** | 〜を諦める | J'ai renoncé **à lui**. |

:::deep なぜこの動詞群だけ違うのか
共通点が2つあります。

**（1）代名動詞が多い**（s'intéresser, s'habituer, se fier）。代名動詞はすでに me / te / se という代名詞を持っているので、そこに lui / leur を重ねると代名詞が2つ並んで解釈しにくくなります。

**（2）残りは「心の向き」を表す動詞**（penser, songer, tenir, faire attention）。これらの à は「与える相手」ではなく「向かう方向」を示しています。lui / leur は本来「〜に与える」という**受け手**を表す代名詞なので、方向を表す à には合いません。

つまり、**lui / leur が使えるのは「受け手」の à に限られる**——donner à、dire à、parler à、téléphoner à のような動詞です。penser à の à は受け手ではないので、強勢形が使われます。

覚え方としては、**「penser à 型の動詞は、モノなら y、人なら à + 強勢形」**と1つの規則にまとめられます。lui / leur は登場しません。
:::

## 2. y の位置

**動詞の前**です。en と同じく、代名詞の中では後ろのほうに置かれます。

:::ex y の位置
J'y vais. | ジ・ヴェ | 私はそこへ行く。
Je n'y vais pas. | ジュ・ニ・ヴェ・パ | 私はそこへ行かない。
Je veux y aller. | ジュ・ヴ・イ・アレ | 私はそこへ行きたい。
J'y suis allé. | ジ・スュイ・ザレ | 私はそこへ行った。
Allons-y ! | アロン・ズィ | さあ行こう！
Vas-y ! | ヴァ・ズィ | 行け！／頑張れ！
N'y va pas ! | ニ・ヴァ・パ | そこへ行くな！
:::

位置の規則を整理すると、次の4つになります。

| 構文 | y の位置 | 例 |
|---|---|---|
| 単純時制 | 動詞の**前** | J'**y** vais. |
| 複合時制 | **助動詞**の前 | J'**y** suis allé. |
| 不定詞がある | **不定詞**の前 | Je veux **y** aller. |
| 肯定命令 | 動詞の**後ろ**（ハイフン） | Vas-**y** ! |
| 否定命令 | 動詞の**前** | N'**y** va pas ! |

**肯定命令だけが後ろ**——これは代名詞すべてに共通する規則です（第16章）。

:::note Vas-y ! と Allons-y ! は日常で頻出
第16章で見たとおり、第1群の tu の命令形は -s が落ちますが、**y が続くとリエゾンのために復活します**（va → **vas**-y）。

- [[Vas-y !|ヴァ・ズィ|行け！／さあ！／頑張れ！]] — 応援・催促に広く使う
- [[Allons-y !|アロン・ズィ|行こう！]] — 出発を促す
- [[On y va ?|オ・ニ・ヴァ|行く？]] — 最もくだけた言い方

同じ現象は en でも起きます：Parle → **Parles**-en !（それについて話して）。**y と en の前でだけ -s が戻る**という、狭いが確実な規則です。
:::

:::warn aller の未来形・条件法では y を付けない
**J'irai.**（そこへ行きます）と言うとき、**y を付けません**。

- ○ J'**irai** demain.
- × J'**y irai** demain.（避けられる）

理由は音です。aller の未来語幹は **ir-** で、y を付けると「ジ・イレ」となって同じ音が続き、言いにくくなります。フランス語は**同じ音の連続を嫌う**ので、この場合は y を落とします。

同じことが条件法（j'irais）でも起きます。単純未来と条件法だけの現象で、他の時制では y を使います（J'**y** vais / J'**y** suis allé / J'**y** allais）。

規則というより**慣用**ですが、フランス語話者は一貫してこう言います。
:::

## 3. il y a の y

:::deep 第4章の il y a を分解する
[[il y a|イリヤ|〜がある]] の y は、この章の y です。

- il … 非人称の主語（第15章）
- y … 「そこに」
- a … avoir の3人称単数

直訳すると「**それはそこに持っている**」。「ある場所に何かが存在する」という意味が、この3語から出ています。

だから否定は **il n'y a pas**（ne が y の前に来る）、疑問の倒置は **y a-t-il ?**（y は動詞の前に残り、主語 il だけが後ろへ回る）となります。第9章・第15章で形として覚えた表現が、いま構造として説明できます。

時制も自由に変えられます。**y a の a を avoir の別の時制にするだけ**です。

| 時制 | 形 | 意味 |
|---|---|---|
| 現在 | il **y a** | 〜がある |
| 複合過去 | il **y a eu** | 〜があった |
| 半過去 | il **y avait** | 〜があった（状態） |
| 単純未来 | il **y aura** | 〜があるだろう |
| 条件法 | il **y aurait** | 〜があるだろうに／〜らしい |
| 接続法 | qu'il **y ait** | 〜があること |

:::ex il y a の時制変化
Il y avait beaucoup de monde. | イ・リ・アヴェ・ボクー・ドゥ・モンド | たくさん人がいた。
Il y a eu un accident. | イ・リ・ア・ウ・アン・ナクスィダン | 事故があった。
Il y aura une réunion demain. | イ・リ・オラ・ユヌ・レユニオン・ドゥマン | 明日会議がある。
Je ne crois pas qu'il y ait un problème. | ジュ・ヌ・クロワ・パ・キ・リ・エ・アン・プロブレム | 問題があるとは思わない。
:::
:::

### y を含む慣用表現

y は多くの決まり文句に入り込んでいます。**y が何を指すか分からなくなっている**ものが多く、まとまりとして覚えます。

| 表現 | 意味 |
|---|---|
| **Ça y est.** | できた、その通りになった |
| **Il y a** | 〜がある／〜前に |
| **y compris** | 〜を含めて |
| **s'y prendre** | やり方をする（Il s'y prend mal. やり方が下手だ） |
| **s'y connaître** | 詳しい（Je m'y connais en vin. ワインに詳しい） |
| **s'y faire** | 慣れる（On finit par s'y faire. そのうち慣れる） |
| **n'y être pour rien** | 何の関係もない（Je n'y suis pour rien.） |
| **Ça n'y change rien.** | それでも変わらない |

:::ex y の慣用表現
Ça y est, j'ai fini ! | サ・イ・エ・ジェ・フィニ | できた、終わった！
Tout le monde est venu, y compris Paul. | トゥ・ル・モンド・エ・ヴニュ・イ・コンプリ・ポール | ポールを含め全員来た。
Je m'y connais un peu en musique. | ジュ・ミ・コネ・アン・プー・アン・ミュズィック | 音楽には少し詳しい。
Je n'y suis pour rien. | ジュ・ニ・スュイ・プール・リヤン | 私には何の関係もない。
:::

## 4. 中性代名詞 le

**le には、第17章で扱った直接目的語の le とは別の用法があります。** 名詞ではなく、**形容詞・文・不定詞**を受ける用法です。

:::warn 中性の le は性数一致しない
これが「中性」と呼ばれる理由です。

- [[Elle est fatiguée ? — Oui, elle l'est.|ウィ・エル・レ|彼女は疲れてる？ — うん、疲れてる。]]

女性が主語でも **le のまま**（l' はエリジオン）。× la est とはなりません。

フランス語には本来、男性・女性の2つの性しかありません。それでも「中性」と呼ぶのは、**この le が性を持たないものを受ける**からです。形容詞の内容や文全体には性がないので、既定値の男性形が使われている——というのが実態です。
:::

:::deep 中性の le が受ける3つのもの

**（1）形容詞・属詞**

:::ex 形容詞を受ける
Tu es fatigué ? — Oui, je le suis. | ウィ・ジュ・ル・スュイ | 疲れてる？ — うん、疲れてる。
Elle est médecin ? — Oui, elle l'est. | ウィ・エル・レ | 彼女は医者？ — うん、そうだよ。
Ils sont contents ? — Ils le sont. | イル・ル・ソン | 彼らは満足してる？ — 満足してるよ。
Elles sont malades ? — Elles le sont toutes. | エル・ル・ソン・トゥット | 彼女たちは病気？ — 全員そうだよ。
:::

英語では Yes, I am. と省略しますが、**フランス語は le が必要**です。× Oui, je suis. では文が完結しません。

**（2）文全体・すでに述べられた内容**

:::ex 文を受ける
Il viendra, je le sais. | イル・ヴィアンドラ・ジュ・ル・セ | 彼は来る、私はそれを知っている。
Elle est partie, je ne le savais pas. | ジュ・ヌ・ル・サヴェ・パ | 彼女は行った、私はそれを知らなかった。
Tu as raison, je le reconnais. | ジュ・ル・ルコネ | 君は正しい、それは認める。
Il est malade — du moins, il le dit. | イ・ル・ディ | 彼は病気だ——少なくとも本人はそう言っている。
:::

**（3）不定詞**

[[Je voulais partir, mais je ne l'ai pas pu.|ジュ・ヌ・レ・パ・ピュ|出発したかったが、できなかった。]]

**savoir, croire, penser, dire, pouvoir, vouloir, espérer** のような動詞は、この le をよく取ります。
:::

### 中性の le を取りやすい動詞

| 動詞 | 例 |
|---|---|
| **savoir** | Je **le** sais.（それは知っている） |
| **croire** | Je **le** crois.（そう思う） |
| **penser** | Je **le** pense.（そう思う） |
| **dire** | Je te **l'**avais dit.（だから言ったのに） |
| **espérer** | Je **l'**espère.（そうであってほしい） |
| **vouloir** | Je **le** veux bien.（それでいいですよ） |
| **pouvoir** | Je ne **le** peux pas.（それはできない） |
| **devoir** | Tu **le** dois.（そうすべきだ） |
| **demander** | Je vous **le** demande.（お願いします） |

:::warn 直接目的語の le と中性の le を見分ける
| | 受けるもの | 一致 |
|---|---|---|
| 直接目的語の le（第17章） | **名詞**（男性単数） | la / les と使い分ける |
| 中性の le | **形容詞・文・不定詞** | 常に le |

- [[Je le vois.|ジュ・ル・ヴォワ|私は彼／それを見る。]]（名詞を受ける → 女性なら la）
- [[Je le sais.|ジュ・ル・セ|私はそれを知っている。]]（文を受ける → 常に le）

**受けているものが名詞かどうか**で判定します。

複合過去での一致にも差が出ます。

- Ces lettres, je **les** ai **lues**.（名詞を受ける → 一致する）
- Elle est partie, je ne **l'**ai pas **su**.（文を受ける → 一致しない）

**中性の le は性を持たないので、過去分詞も一致しません。** これは実用上の重要な違いです。
:::

:::adv 比較の後の le — 書き言葉の用法
比較級の従属節で、**中性の le と虚辞の ne が一緒に現れる**ことがあります。

[[Il est plus intelligent qu'on ne le croit.|イ・レ・プリュ・ザンテリジャン・コン・ヌ・ル・クロワ|彼は思われているより頭がいい。]]

分解すると、

- **ne** … 虚辞の ne（第31.5章）。否定ではない
- **le** … 中性の le。「彼が頭がいい（という程度）」を受ける

どちらも省略できますが、**書き言葉では入れるのが標準**です。会話では Il est plus intelligent qu'on croit. と両方落とすことが普通です。

読解でこの形に出会ったとき、ne を否定と読んで意味を取り違えないことが大切です。
:::

## 5. 3つの特殊代名詞をまとめる

:::note en / y / le の対応
| 代名詞 | 受けるもの | 例 |
|---|---|---|
| **en** | de + 名詞、不定冠詞・部分冠詞つき名詞、数量 | J'**en** bois. |
| **y** | 場所、à + モノ・事柄 | J'**y** vais. |
| **le**（中性） | 形容詞、文、不定詞 | Je **le** sais. |

**判定の順序**
1. de がある → **en**
2. à + モノ、または場所 → **y**
3. à + 人 → **lui / leur** または **à + 強勢形**（penser à 型）
4. 名詞でなく形容詞・文を受ける → **中性の le**
5. 前置詞なしの名詞 → **le / la / les**（第17章）
:::

### 代名詞の全体表

この章で代名詞が出そろいました。7種類を一覧にします。

| 種類 | 形 | 受けるもの | 章 |
|---|---|---|---|
| 主語 | je, tu, il, elle, nous, vous, ils, elles | 主語の名詞 | 3 |
| 直接目的語 | me, te, le, la, nous, vous, les | 前置詞なしの名詞 | 17 |
| 間接目的語 | me, te, lui, nous, vous, leur | à + 人（受け手） | 18 |
| 強勢形 | moi, toi, lui, elle, nous, vous, eux, elles | 前置詞の後、強調 | 19 |
| **en** | en | de + 名詞、数量 | 25 |
| **y** | y | 場所、à + モノ | 26 |
| **中性の le** | le | 形容詞、文、不定詞 | 26 |

**次章（第26.5章）では、これらを2つ以上並べるときの語順を扱います。**

## 6. y を使う動詞の活用

y は aller と組むことが最も多いので、活用を確認しておきましょう。

:::conj aller present,passeCompose,futur

**未来形 j'irai には y を付けない**（§2の warn）ことを、活用表を見ながら確認してください。語幹が ir- なので、y を足すと「ジ・イレ」となって発音しにくくなります。

## 7. 練習してみる

:::ex 代名詞を使い分ける
Tu vas au cinéma ? — Oui, j'y vais. | ウィ・ジ・ヴェ | 映画館行く？ — うん、行く。
Tu veux du café ? — Oui, j'en veux. | ウィ・ジャン・ヴ | コーヒーいる？ — うん、欲しい。
Tu penses à Marie ? — Oui, je pense à elle. | ウィ・ジュ・パンス・ア・エル | マリのこと考えてる？ — うん。
Tu penses à ton travail ? — Oui, j'y pense. | ウィ・ジ・パンス | 仕事のこと考えてる？ — うん。
Tu es prêt ? — Oui, je le suis. | ウィ・ジュ・ル・スュイ | 準備できた？ — うん、できてる。
Tu connais ce film ? — Oui, je le connais. | ウィ・ジュ・ル・コネ | この映画知ってる？ — うん、知ってる。
Tu reviens de Paris ? — Oui, j'en reviens. | ウィ・ジャン・ルヴィヤン | パリから帰るの？ — うん。
Tu vas à Paris ? — Oui, j'y vais. | ウィ・ジ・ヴェ | パリへ行くの？ — うん。
:::

最後の4つを比べてください。**上2つは le の使い分け**（形容詞を受ける中性の le と、名詞を受ける直接目的語の le）、**下2つは de と à の対立**（en と y）です。

## 8. よくある誤り

:::warn 日本語話者がやりがちな8つの誤り
| × | ○ | 理由 |
|---|---|---|
| Je y pense. | J'**y** pense. | je + y はエリジオンする（j'y） |
| Je pense y à Marie. | Je pense **à elle**. | y は人に使えない（§1） |
| Je lui pense. | Je pense **à lui**. | penser à 型は強勢形（§1） |
| J'y irai demain. | J'**irai** demain. | 未来形では y を落とす（§2） |
| Oui, je suis. | Oui, je **le** suis. | 属詞を受ける中性の le が必要（§4） |
| Oui, elle **la** est. | Oui, elle **l'**est. | 中性の le は性数一致しない（§4） |
| Je l'ai **sue**.（文を受けて） | Je l'ai **su**. | 中性の le は過去分詞を一致させない（§4） |
| Va-y ! | **Vas**-y ! | y の前で -s が復活する（§2） |
:::

  sub: '2つ以上並べるときの全パターン',
  body: `
{lead}第17章から第26章まで、代名詞を個別に見てきました。**直接目的語・間接目的語・強勢形・en・y・中性の le** です。

実際の文では、これらが**2つ同時に現れる**ことがあります。[[Il me le donne.|イル・ム・ル・ドンヌ|彼はそれを私にくれる。]] のように。このとき語順は自由ではなく、**厳密に決まっています**。

しかも次の3つの厄介さがあります。

- **肯定命令のときだけ順序が入れ替わる**
- **共存できない組み合わせがある**（× me lui）
- **不定詞・使役構文では置く場所が変わる**

この章で全パターンを一度に整理します。ここが片づくと、フランス語の文を「読める」から「書ける」に変える最後の障害がなくなります。

## 1. 基本の語順表

**肯定命令以外**では、常にこの順序です。

| 1 | 2 | 3 | 4 | 5 |
|---|---|---|---|---|
| **me**<br>**te**<br>**se**<br>**nous**<br>**vous** | **le**<br>**la**<br>**les** | **lui**<br>**leur** | **y** | **en** |

**動詞の前に、この順で並べます。**

:::ex 基本の語順
Il me le donne. | イル・ム・ル・ドンヌ | 彼はそれを私にくれる。（1 → 2）
Je le lui donne. | ジュ・ル・リュイ・ドンヌ | 私はそれを彼にあげる。（2 → 3）
Il m'en parle. | イル・マン・パルル | 彼はそれについて私に話す。（1 → 5）
Il y en a. | イ・リ・ヤン・ナ | そこにそれがある。（4 → 5）
Je l'y ai vu. | ジュ・リ・エ・ヴュ | 私はそこで彼を見た。（2 → 4）
Je lui en ai parlé. | ジュ・リュイ・アン・ネ・パルレ | 私は彼にそれについて話した。（3 → 5）
Elle nous les montre. | エル・ヌー・レ・モントル | 彼女はそれらを私たちに見せる。（1 → 2）
:::

:::note 覚え方
「**me te se nous vous** → **le la les** → **lui leur** → **y** → **en**」

フランスの学校では、この順序を歌のように暗唱させます。順番を思い出せれば、あとは当てはめるだけです。

**構造的な理解**もできます。
- **1列目**は1・2人称（および再帰代名詞）
- **2列目**は3人称の**直接**目的語
- **3列目**は3人称の**間接**目的語
- **y と en は常に最後**（この2つが並ぶときは必ず y → en）
:::

:::deep なぜこの順序なのか
一見でたらめに見える順序にも、いくつかの説明が与えられています。

**（1）人称の階層** — 言語には広く「1人称 > 2人称 > 3人称」という優先順位があり、**話し手に近いものほど前に出ます**。1列目（me, te, nous, vous）が3人称（le, lui）より前なのは、この階層に従っています。

**（2）直接 > 間接** — 3人称どうしでは、直接目的語（le, la, les）が間接目的語（lui, leur）より前に来ます。動詞に直接かかるものほど動詞に近い、という原則とは逆に見えますが、フランス語では**動詞から遠い側から並べる**形になっています。

**（3）y と en は副詞起源** — 第26章で見たとおり、y と en はもともと場所の副詞（ibi / inde）でした。**代名詞の列に後から加わったので、いちばん外側に置かれる**——これがいちばん説得力のある説明です。

したがって、**y と en が最後に来ることだけは理屈で覚えられます**。残りの順序は暗唱に頼るのが現実的です。
:::

## 2. 1列目と3列目は共存できない

:::warn me lui / te leur という並びは存在しない
表の1列目（me, te, se, nous, vous）と3列目（lui, leur）は、**同時に使えません**。

- × Il me lui présente.
- ○ [[Il me présente à lui.|イル・ム・プレザン・タ・リュイ|彼は私を彼に紹介する。]]

**間接目的語のほうを à + 強勢形にして、動詞の後ろに回します**（第19章）。

理由：1列目の me / te は直接目的語にも間接目的語にもなるため、lui と並ぶと**どちらが直接でどちらが間接か分からなくなる**からです。曖昧さを避けるための制約です。

同じ理由で、次も言えません。
- × Tu me leur présentes. → ○ [[Tu me présentes à eux.|テュ・ム・プレザン・タ・ウー|君は私を彼らに紹介する。]]
- × Il se me présente. → ○ [[Il se présente à moi.|イル・ス・プレザン・タ・モワ|彼は私に自己紹介する。]]

**どちらを à + 強勢形にするかは決まっています。動詞の後ろに回るのは必ず間接目的語のほう**です。直接目的語を à + 強勢形にすることはできません。
:::

:::note 共存できる組み合わせ・できない組み合わせ
| 組み合わせ | 可否 | 例 |
|---|---|---|
| 1列目 + 2列目 | ○ | Il **me le** donne. |
| 2列目 + 3列目 | ○ | Je **le lui** donne. |
| **1列目 + 3列目** | **×** | × Il me lui présente. |
| 1列目 + en / y | ○ | Il **m'en** parle. |
| 2列目 + en / y | ○ | Je **l'y** conduis. |
| 3列目 + en / y | ○ | Je **lui en** parle. |
| y + en | ○ | Il **y en** a. |

**×は1つだけ**です。この1つを覚えておけば、あとはすべて組めます。
:::

## 3. 3つ並ぶ場合

理論上は3つ並べられますが、**実際にはほぼ il y en a だけ**です。

[[Il y en a trois.|イ・リ・ヤン・ナ・トロワ|それが3つある。]]

3つ以上並ぶと聞き取りが困難になるため、話し言葉では**一方を名詞に戻すか、文を分けます**。

- 「私はそこで彼にそれについて話した」→ × Je le lui y en ai parlé.
- ○ **Je lui en ai parlé là-bas.**（y を là-bas という副詞に戻す）

**代名詞は便利ですが、詰め込みすぎると通じません。** 2つまでが実用的な上限だと考えてください。

## 4. 肯定命令のときだけ順序が変わる

:::warn 肯定命令では 直接目的語 → 間接目的語
第16章で見たとおり、肯定命令では代名詞が**動詞の後ろ**に来ます。そしてこのとき、**語順も入れ替わります**。

| | 語順 |
|---|---|
| **通常** | 間接（me, te…）→ 直接（le, la, les） |
| **肯定命令** | **直接**（le, la, les）→ **間接**（moi, toi, lui…） |

:::ex 語順の反転
Il me le donne. | イル・ム・ル・ドンヌ | 彼はそれを私にくれる。（通常：me → le）
Donne-le-moi ! | ドンヌ・ル・モワ | それを私にくれ！（肯定命令：le → moi）
Ne me le donne pas ! | ヌ・ム・ル・ドンヌ・パ | それを私にくれるな！（否定命令：通常の順に戻る）
:::

**否定命令では通常の語順に戻る**点に注意してください。位置（動詞の前）が通常と同じなので、順序も通常どおりになります。

**つまり「動詞の後ろに来るとき」だけが特殊**です。位置と順序が連動していると考えると覚えやすくなります。
:::

:::deep 肯定命令の完全な語順

| 1 | 2 | 3 |
|---|---|---|
| **le**<br>**la**<br>**les** | **moi**（m'）<br>**toi**（t'）<br>**lui**<br>**nous**<br>**vous**<br>**leur** | **y**<br>**en** |

すべてハイフンでつなぎます。

:::ex 肯定命令の例
Donne-le-moi. | ドンヌ・ル・モワ | それを私にちょうだい。
Montre-la-lui. | モントル・ラ・リュイ | それを彼に見せて。
Rends-les-leur. | ラン・レ・ルール | それらを彼らに返して。
Donne-m'en. | ドンヌ・マン | それをちょうだい。
Allez-vous-en ! | アレ・ヴー・ザン | 立ち去れ！
Va-t'en ! | ヴァ・タン | 出て行け！
Mets-les-y. | メ・レ・ズィ | それらをそこに置いて。
:::

**en / y が続くと、moi / toi は m' / t' に戻ります**（第25章）。強い位置にあっても、母音の前ではエリジオンが優先されるためです。
:::

:::adv 話し言葉では Donne-moi-le も聞かれる
規範文法では **Donne-le-moi.** ですが、実際の会話では **Donne-moi-le.**（通常の語順のまま後ろに置く）を耳にします。とくに南仏やベルギー、そして子どもの言葉によく現れます。

これは**規則を単純化しようとする力**の現れです。「肯定命令のときだけ順序が変わる」という例外を、話し手が無意識に均そうとしています。

同じ力は他の場面でも働いています。第27.5章で見た「après que + 接続法」（規範では直説法）も、avant que に合わせようとする類推でした。**言語は不規則を減らす方向に動く**——その動きを、いま進行中の姿で観察できる例です。

**書くときは Donne-le-moi.** を使ってください。試験でも当然そちらが求められます。
:::

## 5. 複合時制での位置

**代名詞は助動詞の前**にまとめて置きます（第20章）。

:::ex 複合時制
Il me l'a donné. | イル・ム・ラ・ドネ | 彼はそれを私にくれた。
Je le lui ai donné. | ジュ・ル・リュイ・エ・ドネ | 私はそれを彼にあげた。
Je ne le lui ai pas donné. | ジュ・ヌ・ル・リュイ・エ・パ・ドネ | 私はそれを彼にあげなかった。
Il m'en a parlé. | イル・マン・ナ・パルレ | 彼はそれについて私に話した。
Nous les y avons conduits. | ヌー・レ・ズィ・アヴォン・コンデュイ | 私たちは彼らをそこへ連れて行った。
:::

**ne … pas は「代名詞 + 助動詞」のかたまりを挟みます。**

| 要素 | 位置 |
|---|---|
| ne | 代名詞の**前** |
| 代名詞 | 助動詞の前 |
| 助動詞 | — |
| pas | 助動詞の**後ろ** |
| 過去分詞 | 最後 |

Je **ne** le lui **ai pas** donné. — この順序が固定です。

:::warn 過去分詞の一致もここで効く
第20章の規則③により、**直接目的語が前にあれば過去分詞が一致**します。

- [[Je la lui ai donnée.|ジュ・ラ・リュイ・エ・ドネ|私はそれを彼にあげた。]]（la が女性 → donnée）
- [[Je lui en ai parlé.|ジュ・リュイ・アン・ネ・パルレ|私は彼にそれについて話した。]]（en は一致の対象外、lui は間接 → parlé のまま）

**一致するのは2列目（le, la, les）が前にあるときだけ**、と整理できます。1列目の me/te/nous/vous も直接目的語なら一致します（[[Elle nous a vus.|エル・ヌー・ザ・ヴュ|彼女は私たちを見た。]]）。

まとめると次のとおりです。

| 代名詞 | 一致するか |
|---|---|
| le / la / les | **する**（直接目的語） |
| me / te / nous / vous | **直接目的語なら する** |
| lui / leur | しない（間接目的語） |
| y | しない |
| en | しない |
| 中性の le | しない（第26章） |
:::

## 6. 疑問の倒置との組み合わせ

倒置疑問（第9章）では、**主語だけが動詞の後ろに回り、代名詞は動詞の前に残ります**。

:::ex 倒置疑問と代名詞
Me le donnez-vous ? | ム・ル・ドネ・ヴー | それを私にくれますか。
Le lui as-tu donné ? | ル・リュイ・ア・チュ・ドネ | それを彼にあげましたか。
Y en a-t-il ? | イ・ヤン・ナ・ティル | それはありますか。
Ne me l'avez-vous pas dit ? | ヌ・ム・ラヴェ・ヴー・パ・ディ | それを私に言わなかったのですか。
:::

代名詞のかたまりは動かず、**倒置されるのは主語代名詞（vous, tu, il …）だけ**です。この点で、主語代名詞と目的語代名詞ははっきり区別されます。

**Y en a-t-il ?** は il y en a を倒置した形です。y と en は残り、il だけが後ろへ回って、母音衝突を避ける **-t-** が挿入されています。

## 7. 代名動詞との併用

代名動詞（第23章）は、すでに **se** という代名詞を持っています。そこに別の代名詞が加わるときの語順も、§1の表どおりです。

:::ex 代名動詞と代名詞の併用
Je me le rappelle. | ジュ・ム・ル・ラペル | 私はそれを覚えている。（se → le）
Il s'en va. | イル・サン・ヴァ | 彼は立ち去る。（se → en）
Elle s'y intéresse. | エル・スィ・ンテレス | 彼女はそれに興味がある。（se → y）
Nous nous en souvenons. | ヌー・ヌー・ザン・スヴノン | 私たちはそれを覚えている。
Je me les rappelle. | ジュ・ム・レ・ラペル | 私はそれらを覚えている。
:::

**se は1列目**なので、必ず先頭に来ます。したがって代名動詞では、

- **se + le / la / les**（○）
- **se + y / en**（○）
- **se + lui / leur**（**×** — §2の制約）

の3通りが判定できます。3つ目が言えないのは、1列目と3列目が共存できないという同じ規則によります。

:::note s'en aller の命令法
**s'en aller**（立ち去る）は、se と en の両方を含む代名動詞です。命令法にすると3つの要素が並びます。

| 人称 | 形 |
|---|---|
| tu | **Va-t'en !** |
| nous | **Allons-nous-en !** |
| vous | **Allez-vous-en !** |

肯定命令なので動詞の後ろに来て、te は t'（en の前でエリジオン）になります。日常で非常によく使う表現なので、形のまま覚えてしまうのが早道です。
:::

## 8. 不定詞を伴う構文

**代名詞は、自分が目的語になっている動詞の前**に置きます（第17章）。

:::ex 不定詞の前
Je vais le lui donner. | ジュ・ヴェ・ル・リュイ・ドネ | 私はそれを彼にあげるつもりだ。
Je veux t'en parler. | ジュ・ヴ・タン・パルレ | 私はそれについて君に話したい。
Il ne peut pas nous y conduire. | イル・ヌ・プ・パ・ヌー・ズィ・コンデュイール | 彼は私たちをそこへ連れて行けない。
J'ai oublié de le lui dire. | ジェ・ウブリエ・ドゥ・ル・リュイ・ディール | 彼にそれを言うのを忘れた。
:::

× Je le lui vais donner. とはなりません。donner の目的語なので、donner の直前に置きます。

:::note 使役・知覚動詞は例外（第17章）
faire + 不定詞、voir / entendre / laisser + 不定詞では、**代名詞が主動詞の前**に来ます。

[[Je le lui fais lire.|ジュ・ル・リュイ・フェ・リール|私は彼にそれを読ませる。]]（× Je fais le lui lire）

faire + 不定詞が1つの動詞のかたまりとして扱われるためです。

:::ex 使役・知覚動詞と代名詞
Je la fais chanter. | ジュ・ラ・フェ・シャンテ | 私は彼女に歌わせる。
Je le lui fais lire. | ジュ・ル・リュイ・フェ・リール | 私は彼にそれを読ませる。
Je les ai vus partir. | ジュ・レ・ザイ・ヴュ・パルティール | 私は彼らが出発するのを見た。
Laisse-le entrer. | レス・ル・アントレ | 彼を入れてあげて。
:::

**使役の faire では、不定詞に目的語があると使役される人が lui / leur（間接目的語）になります。**

- Je **la** fais chanter.（彼女に歌わせる）→ chanter に目的語なし → 直接目的語 la
- Je **lui** fais chanter une chanson.（彼女に歌を歌わせる）→ une chanson が直接目的語 → 人は lui

「直接目的語の席は1つしかない」という制約から出る規則です。
:::

## 9. 全パターン早見表

:::note まとめ
**通常（肯定命令以外）— 動詞の前**

me / te / se / nous / vous → le / la / les → lui / leur → y → en

**肯定命令 — 動詞の後ろ、ハイフンでつなぐ**

le / la / les → moi / toi / lui / nous / vous / leur → y / en

**制約**
- 1列目と lui / leur は共存できない → 間接目的語を à + 強勢形にする
- y と en が並ぶときは必ず **y → en**（il y en a）
- en / y の前では moi / toi が m' / t' に戻る
- 複合時制では代名詞は助動詞の前、ne は代名詞の前、pas は助動詞の後ろ
- 倒置疑問では主語代名詞だけが後ろへ回り、目的語代名詞は動詞の前に残る
- 不定詞構文では、目的語になっている動詞の直前
- 使役・知覚動詞では主動詞の前
- 3つ以上並べるのは il y en a を除いて避ける
:::

## 10. 練習してみる

:::ex 名詞を代名詞に置き換える
Il donne le livre à Marie. → Il le lui donne. | イル・ル・リュイ・ドンヌ | 彼はそれを彼女にあげる。
Je te montre les photos. → Je te les montre. | ジュ・ト・レ・モントル | 私はそれらを君に見せる。
Tu me parles de ton voyage. → Tu m'en parles. | テュ・マン・パルル | 君はそれについて私に話す。
Elle nous attend à la gare. → Elle nous y attend. | エル・ヌー・ズィ・アタン | 彼女は私たちをそこで待つ。
Donne le livre à Marie ! → Donne-le-lui ! | ドンヌ・ル・リュイ | それを彼女にあげて！
Ne donne pas le livre à Marie ! → Ne le lui donne pas ! | ヌ・ル・リュイ・ドンヌ・パ | それを彼女にあげないで！
Il a prêté sa voiture à ses amis. → Il la leur a prêtée. | イル・ラ・ルー・ラ・プレテ | 彼はそれを彼らに貸した。
Envoie cette lettre à ton père ! → Envoie-la-lui ! | アンヴォワ・ラ・リュイ | それを父さんに送って！
:::

最後から3つ目と4つ目で、**肯定命令と否定命令で語順が変わっていない**点に注目してください。どちらも le → lui です。**入れ替わるのは「1列目と2列目」の関係だけ**で、le と lui の順序はもともと le が先だからです。

反転が実際に起きるのは、次のような場合です。
- 通常：Il **me le** donne.（me → le）
- 肯定命令：Donne-**le-moi** !（le → moi）

**Il la leur a prêtée.** では、直接目的語 la が前にあるので過去分詞が prêtée と一致していることも確認してください。

## 11. よくある誤り

:::warn 日本語話者がやりがちな8つの誤り
| × | ○ | 理由 |
|---|---|---|
| Il me lui présente. | Il me présente **à lui**. | 1列目と3列目は共存できない（§2） |
| Il lui le donne. | Il **le lui** donne. | 2列目が3列目より先（§1） |
| Il en y a. | Il **y en** a. | y → en の順（§1） |
| Donne-moi-le ! | **Donne-le-moi** ! | 肯定命令は直接 → 間接（§4） |
| Ne le moi donne pas ! | Ne **me le** donne pas ! | 否定命令は通常の語順・通常の形（§4） |
| Donne-moi-en. | **Donne-m'en**. | en の前で moi は m' に（§4） |
| Je le lui vais donner. | Je vais **le lui** donner. | 目的語になっている動詞の前（§8） |
| Je fais le lui lire. | **Je le lui fais** lire. | 使役は主動詞の前（§8） |
:::

  body: `
半過去（l'imparfait）は、**作り方が最も簡単で、使い方が最も難しい**時制です。

作り方には**フランス語全体で例外が1つしかありません**（être のみ）。第13章の全体図でいえば「①直説法現在」から出る枝の1本目で、nous の現在形さえ言えれば作れます。

難しいのは用法です。**複合過去との使い分け**——どちらも日本語では「〜した」になるため、日本語話者には区別の手がかりがありません。この章の大半をその対立に充てます。

## 1. 作り方 — nous の現在形から

**手順は2つだけです。**

1. **nous の現在形**を出す
2. **-ons を取って**、半過去の語尾を付ける

| 人称 | 語尾 |
|---|---|
| je | **-ais** |
| tu | **-ais** |
| il | **-ait** |
| nous | **-ions** |
| vous | **-iez** |
| ils | **-aient** |

:::conj chanter imparfait

| 動詞 | nous の現在形 | 語幹 | je の半過去 |
|---|---|---|---|
| chanter | nous chant**ons** | chant- | je chantais |
| finir | nous finiss**ons** | finiss- | je finissais |
| prendre | nous pren**ons** | pren- | je prenais |
| boire | nous buv**ons** | buv- | je buvais |
| faire | nous fais**ons** | fais- | je faisais |
| aller | nous all**ons** | all- | j'allais |
| voir | nous voy**ons** | voy- | je voyais |
| devoir | nous dev**ons** | dev- | je devais |

:::warn 例外は être ただ1つ
nous **sommes** からは -ons が取れません。être だけ、特別に **ét-** を語幹とします。

:::conj être imparfait

**フランス語の全動詞で、半過去の例外はこれだけ**です。不規則動詞であっても、現在形さえ言えれば半過去は必ず作れます。
:::

:::warn nous / vous で綴りが変わる動詞
第8章の綴りの変化が、ここでも効きます。

| 動詞 | je | nous |
|---|---|---|
| manger | je mange**ais** | nous mang**ions**（e が消える） |
| commencer | je commenç**ais** | nous commenc**ions**（ç が c に戻る） |

理由は同じです。**e を挟むのも ç にするのも、a や o の前で音を保つため**でした。nous / vous の語尾 -ions / -iez は i で始まるので、調整が不要になります。

:::conj manger imparfait

:::conj commencer imparfait
:::

:::adv 語幹が i や y で終わる動詞は i が重なる
étudier（nous étudions）や voir（nous voyons）のような動詞では、nous / vous で **ii** や **yi** が並びます。

- nous étud**ii**ons、vous étud**ii**ez
- nous vo**yi**ons、vous vo**yi**ez
- nous r**ii**ons（rire）、nous trava**illi**ons（travailler）

書き落としやすい箇所です。**現在形の語幹に、そのまま -ions / -iez を足す**と考えれば間違えません。
:::

## 2. 半過去の3つの用法

:::deep 半過去が表すもの

### （1）継続していた状態・進行中だった動作

過去のある時点で「〜していた」「〜だった」。**始まりと終わりを問題にしません。**

:::ex 継続・進行
Il pleuvait. | イル・プルヴェ | 雨が降っていた。
J'étais fatigué. | ジェテ・ファティゲ | 私は疲れていた。
Elle lisait quand je suis entré. | エル・リゼ・カン・ジュ・スュイ・ザントレ | 私が入ったとき、彼女は本を読んでいた。
:::

### （2）習慣・反復

「よく〜したものだ」「いつも〜していた」。

:::ex 習慣・反復
Quand j'étais petit, j'allais souvent à la mer. | カン・ジェテ・プティ・ジャレ・スヴァン・ア・ラ・メール | 子どものころ、よく海に行った。
Il fumait beaucoup. | イル・フュメ・ボクー | 彼はたくさんタバコを吸っていた。
Tous les jours, elle prenait le train de sept heures. | トゥ・レ・ジュール・エル・プルネ・ル・トラン | 毎日、彼女は7時の電車に乗っていた。
:::

### （3）背景・描写

物語で、出来事の**舞台を設定する**役割。第20.5章で見た構造です。

:::ex 背景描写
Il faisait nuit. La rue était déserte. | イル・フゼ・ニュイ・ラ・リュ・エテ・デゼルト | 夜だった。通りは人けがなかった。
Elle portait une robe rouge. | エル・ポルテ・チュヌ・ローブ・ルージュ | 彼女は赤いドレスを着ていた。
:::
:::

## 3. 複合過去との使い分け — この章の核心

:::warn 日本語では区別されない
- [[Hier, j'ai lu ce livre.\|イエール・ジェ・リュ・ス・リーヴル\|昨日、この本を読んだ。]]（複合過去）
- [[Hier, je lisais ce livre.\|イエール・ジュ・リゼ・ス・リーヴル\|昨日、この本を読んでいた。]]（半過去）

日本語ではどちらも「読んだ／読んでいた」で、しかも入れ替えても不自然ではありません。**しかしフランス語では意味が明確に違います。**
:::

:::deep 対立の本質 — 出来事か、状況か

| | 複合過去 | 半過去 |
|---|---|---|
| 何を表すか | **出来事**。起きて、終わった | **状況**。続いていた |
| 時間の捉え方 | **点**（区切りがある） | **線**（区切りがない） |
| 物語での役割 | 前景（話を進める） | 背景（舞台を作る） |
| 問い | 「何が起きたか」 | 「どんな様子だったか」 |

**同じ出来事でも、どう捉えるかで時制が変わります。**

:::ex 同じ内容を2つの時制で
J'ai habité à Paris pendant trois ans. | ジェ・アビテ・ア・パリ・パンダン・トロワ・ザン | 私は3年間パリに住んだ。（期間が区切られた出来事）
J'habitais à Paris à cette époque. | ジャビテ・ア・パリ・ア・セット・エポック | 当時、私はパリに住んでいた。（背景としての状態）
:::

1つ目は「3年間」という区切りがあるので出来事として捉えられ、複合過去になります。2つ目は区切りを問題にしていないので半過去です。

**「何年住んだか」を言えば複合過去、「そのころどうだったか」を言えば半過去** ——同じ事実でも、話し手の捉え方で時制が決まります。
:::

:::ex 1文の中で両方が使われる典型
Je dormais quand le téléphone a sonné. | ジュ・ドルメ・カン・ル・テレフォン・ア・ソネ | 電話が鳴ったとき、私は眠っていた。
Il pleuvait, alors nous sommes restés à la maison. | イル・プルヴェ・アロール・ヌー・ソム・レステ・ア・ラ・メゾン | 雨が降っていたので、私たちは家にいた。
Elle lisait tranquillement quand soudain, quelqu'un a frappé à la porte. | エル・リゼ・トランキルマン・カン・スダン・ケルカン・ア・フラペ・ア・ラ・ポルト | 彼女が静かに本を読んでいると、突然誰かがドアをノックした。
:::

**進行中の状況（半過去）を、出来事（複合過去）が中断する** ——これが最も典型的な組み合わせです。

:::note 判定の手がかりになる副詞
文中の副詞が、どちらの時制を要求するかの目安になります。

**複合過去を呼びやすい語**（区切りを示す）
soudain（突然）、tout à coup（急に）、un jour（ある日）、hier（昨日）、pendant 〜（〜の間）、trois fois（3回）、d'abord / ensuite / enfin（まず／次に／最後に）

**半過去を呼びやすい語**（繰り返し・継続を示す）
souvent（しばしば）、toujours（いつも）、tous les jours（毎日）、d'habitude（普段は）、autrefois（昔は）、pendant que 〜（〜している間）、à cette époque（当時）

ただし**絶対ではありません**。最終的には「出来事か、状況か」の判断です。
:::

:::warn 状態動詞でも複合過去は使える
être, avoir, savoir, pouvoir, vouloir, connaître のような状態を表す動詞は半過去になりやすいのですが、**複合過去にすると意味が変わります**。

| 動詞 | 半過去 | 複合過去 |
|---|---|---|
| savoir | [[je savais\|ジュ・サヴェ]] 知っていた | [[j'ai su\|ジェ・スュ]] 知った（知るに至った） |
| pouvoir | [[je pouvais\|ジュ・プヴェ]] できる状態だった | [[j'ai pu\|ジェ・ピュ]] できた（実際にやった） |
| vouloir | [[je voulais\|ジュ・ヴレ]] 〜したかった | [[j'ai voulu\|ジェ・ヴリュ]] 〜しようとした |
| connaître | [[je connaissais\|ジュ・コネセ]] 知っていた | [[j'ai connu\|ジェ・コニュ]] 知り合った |
| avoir | [[j'avais peur\|ジャヴェ・プール]] 怖かった | [[j'ai eu peur\|ジェ・ウ・プール]] 怖くなった |

**複合過去にすると「その状態に入った瞬間」を指す**ようになります。状態が始まった一点を出来事として捉えるからです。

この対立は入門書がほとんど触れませんが、実際の読解では頻繁に問題になります。
:::

## 4. その他の半過去の用法

:::adv 過去以外を表す半過去

**（1）si + 半過去 — 仮定・提案**

[[Si on allait au cinéma ?\|スィ・オ・ナレ・オ・スィネマ\|映画に行かない？]]

「〜したらどう？」という提案です。過去の意味はありません。第30章の条件法と組み合わさると仮定文になります。
[[Si j'avais de l'argent, je voyagerais.\|スィ・ジャヴェ・ドゥ・ラルジャン・ジュ・ヴォワヤジュレ\|お金があれば旅行するのに。]]

**（2）語調緩和**

[[Je voulais vous demander quelque chose.\|ジュ・ヴレ・ヴー・ドゥマンデ・ケルク・ショーズ\|ちょっとお伺いしたいことがあるのですが。]]

現在の願望を半過去で言うと、**遠慮がちで丁寧**になります。条件法（第30章）と同じ働きです。時間的な距離が、心理的な距離＝丁寧さに転用されています。

**（3）間接話法の中の現在**（第27.6章）

[[Il a dit qu'il était malade.\|イラ・ディ・キ・レテ・マラード\|彼は病気だと言った。]]

「彼が言った時点では現在」だったことを、半過去で表します。時制の一致（第27.6章）の規則です。

**（4）近接過去・近接未来の過去版**（第11章）

[[Il venait de partir.\|イル・ヴネ・ドゥ・パルティール\|彼は出発したばかりだった。]]
[[Il allait partir.\|イ・ラレ・パルティール\|彼は出発しようとしていた。]]
:::

## 5. 使い分けの実践 — 短い物語で確認する

理屈を1つの物語に落とし込みます。**どの動詞がなぜその時制なのか**を、1文ずつ確認してください。

:::ex ある朝の話
Quand j'étais étudiant, j'habitais un petit studio. | カン・ジェテ・ゼテュディヤン・ジャビテ・アン・プティ・ステュディオ | 学生のころ、小さなワンルームに住んでいた。（背景×2）
Tous les matins, je prenais le métro à sept heures. | トゥ・レ・マタン・ジュ・プルネ・ル・メトロ | 毎朝7時に地下鉄に乗っていた。（習慣）
Un matin, le métro s'est arrêté entre deux stations. | アン・マタン・ル・メトロ・セ・タレテ | ある朝、地下鉄が駅の間で止まった。（出来事＝物語が動く）
Il faisait noir, les gens s'inquiétaient. | イル・フゼ・ノワール・レ・ジャン・サンキエテ | 暗くて、乗客は不安がっていた。（その場の描写）
Alors, quelqu'un a commencé à chanter. | アロール・ケルカン・ア・コマンセ・ア・シャンテ | すると、誰かが歌い出した。（出来事）
Tout le monde a ri, et moi aussi. | トゥ・ル・モンド・ア・リ・エ・モワ・オスィ | みんな笑った。私も笑った。（出来事）
:::

型が見えます。**Quand j'étais petit / étudiant（〜だったころ）+ 半過去の背景・習慣 → Un jour / Un matin（ある日）+ 複合過去の出来事**。第20.5章の童話の型（Il était une fois → Un jour）と同じ骨組みが、日常の思い出話にもそのまま現れています。

**Quand j'étais petit(e), …**（小さいころは…）は思い出話の定型の入り口です。この後ろは習慣・状態なので、ほぼ自動的に半過去が続きます。

:::note 迷ったときの判定手順
1. **「そのとき何が起きた？」への答えになるか** → なる：複合過去
2. **「そのときどんな様子だった？」への答えになるか** → なる：半過去
3. **習慣（毎日・いつも・当時は）か** → 半過去
4. **区切り（〜の間、3回、ある日）が明示されているか** → 複合過去

多くの動詞はどちらにもなれます。**時制の選択は事実の性質ではなく、話し手の捉え方**——これがこの章の結論です。
:::

## 6. 全時制の中での位置

:::conj chanter present,imparfait,passeCompose

**現在 → 半過去 → 複合過去**を並べると、半過去が「現在形の語幹をそのまま使っている」ことが見えます。第13章で述べた「①直説法現在から3つ」の枝の1本です。

## 7. よくある誤り

:::warn 日本語話者がやりがちな誤り
| × | ○ | 理由 |
|---|---|---|
| Hier, je **regardais** un film.（1本見た） | Hier, j'**ai regardé** un film. | 完結した出来事は複合過去 |
| Quand j'**ai été** petit … | Quand j'**étais** petit … | 状態・時期の枠は半過去 |
| Il **a plu** quand je suis sorti.（降っていた） | Il **pleuvait** quand je suis sorti. | 背景の描写は半過去 |
| Je **savais** la nouvelle hier soir.（知った） | J'**ai su** la nouvelle hier soir. | 「知るに至った」は複合過去 |
| Avant, j'**ai fumé**.（昔は吸っていた） | Avant, je **fumais**. | 過去の習慣は半過去 |

**J'étais en train de + 不定詞**（〜している最中だった）も便利な形です：J'étais en train de dormir quand tu as appelé.（電話をくれたとき、ちょうど寝ていたんだ）。半過去の「進行」の意味を明示的に強調したいときに使います。
:::

## 8. 過去の継続 — depuis + 半過去

「〜し続けていた」という**過去の時点までの継続**は、半過去 + depuis で表します。

:::ex depuis + 半過去
Il pleuvait depuis deux jours. | イル・プルヴェ・ドゥピュイ・ドゥ・ジュール | 2日前から雨が降り続いていた。
J'attendais depuis une heure quand il est arrivé. | ジャタンデ・ドゥピュイ・ユヌ・ール | 彼が来たとき、私は1時間前から待っていた。
On se connaissait depuis dix ans. | オン・ス・コネセ・ドゥピュイ・ディ・ザン | 私たちは10年来の知り合いだった。
:::

第7.5章で「depuis は現在形と組む」と学びました（J'habite ici depuis 5 ans.）。その過去版がこれです。**現在まで続く継続＝現在形 + depuis、過去のある時点まで続いていた継続＝半過去 + depuis**——時制が1段ずれるだけで、構造は同じです。

英語では過去完了進行形（had been waiting）を使うところですが、フランス語は**ただの半過去**で済ませます。「継続」は半過去自身が含んでいるので、特別な形が要らないのです。

同じ理屈で、**il y avait … que / ça faisait … que + 半過去**も「〜前から〜していた」を表します：Ça faisait une heure que j'attendais.（もう1時間も待っていたんだ）。こちらは「長さ」への苛立ち・強調が乗る、話し言葉の言い方です。

## 9. 半過去が現れる4つの構文 — 過去以外の顔をまとめる

半過去は「過去の状態」だけの時制ではありません。**現実からの距離**を表す形として、いくつもの構文に組み込まれています。

| 構文 | 例 | 表すもの |
|---|---|---|
| **si + 半過去（単独）** | Si on allait au cinéma ?（映画行かない？） | 提案 |
| **si + 半過去（+ 条件法）** | Si j'avais le temps, je viendrais. | 現在の反実仮想 |
| **語調緩和** | Je voulais vous demander …（お伺いしたいのですが） | 遠慮 |
| **comme si + 半過去** | Il parle comme s'il savait tout. | 事実に反する比喩 |
| **時制の一致** | Il a dit qu'il était malade. | 過去から見た現在 |
| **近接過去・未来の過去版** | Il venait de partir. / Il allait partir. | 過去の直前・直後 |

**共通しているのは「いま・ここの現実から一歩引く」働き**です。時間的な距離（過去）が、心理的な距離（遠慮・仮定・比喩）に転用されている——第30章の条件法とまったく同じ仕組みで、多くの言語に共通する現象です。

:::ex 半過去の非過去用法
Si on prenait un café ? | スィ・オン・プルネ・アン・カフェ | コーヒーでも飲まない？
Je venais vous voir pour une question. | ジュ・ヴネ・ヴ・ヴォワール | 少し伺いたいことがあって参りました。
Si seulement il était là ! | スィ・スルマン・イ・レテ・ラ | 彼がここにいてくれさえすれば！
On aurait dit qu'il pleuvait. | オ・ノレ・ディ・キル・プルヴェ | 雨が降っているようだった。
:::

**Si on + 半過去 ?**（〜しない？）は誘いの最も自然な形の1つで、Si on y allait ?（行かない？）、Si on mangeait ?（食べようか？）と、日常で頻繁に使われます。**Si seulement + 半過去 !**（〜さえすれば）は願望の嘆きです。

**Je venais / Je voulais + 不定詞**（〜しに参りました・〜したかったのですが）は、窓口や訪問先で用件を切り出すときの丁寧な決まり文句です。現在形の Je veux … より格段に柔らかく響きます。

{lead}第13章で「複合時制は5つあるが、変わるのは助動詞の時制だけ」と述べました。半過去を学び終えたいま、その2本目の枝を回収できます。
