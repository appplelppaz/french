  body: `
第3章で「Il pleut. の il は誰も指していない」と述べました。この il を**非人称の il（il impersonnel）**と呼びます。

主語が実質的な意味を持たず、**文法上の座席を埋めるためだけに置かれる**——この構文は天候表現だけでなく、時刻・必要性・可能性など広い範囲で使われます。しかも **il faut** や **il y a** のような最頻出表現がここに含まれるため、避けて通れません。

この章では非人称構文を体系的に扱い、あわせて**数詞と時刻・日付**を導入します。

## 1. 非人称構文とは何か

**主語 il が何も指さない構文**です。動詞は常に3人称単数で活用します。

| 種類 | 例 |
|---|---|
| 天候 | Il pleut. / Il fait beau. |
| 時刻 | Il est trois heures. |
| 必要性 | Il faut partir. |
| 存在 | Il y a un chat. |
| 評価 | Il est difficile de comprendre. |

:::warn 非人称の il は他の主語に置き換えられない
これが「非人称」の定義です。

- [[Il pleut.\|イル・プル\|雨が降っている。]] … × Le ciel pleut. とは言えない
- [[Il est trois heures.\|イ・レ・トロ・ザール\|3時です。]] … × L'horloge est trois heures. とは言えない

一方、[[Il est grand.\|イ・レ・グラン\|彼は背が高い。]] の il は具体的な人を指すので、Pierre est grand. に置き換えられます。**置き換えられるかどうか**が、人称・非人称の判定基準です。
:::

## 2. 天候表現

**faire を使う型が基本**です。「天気が〜を作る」という発想になります。

:::ex faire を使う天候表現
Il fait beau. | イル・フェ・ボー | 天気がいい。
Il fait mauvais. | イル・フェ・モヴェ | 天気が悪い。
Il fait chaud. | イル・フェ・ショー | 暑い。
Il fait froid. | イル・フェ・フロワ | 寒い。
Il fait frais. | イル・フェ・フレ | 涼しい。
Il fait doux. | イル・フェ・ドゥー | 穏やかだ。
Il fait sombre. | イル・フェ・ソンブル | 暗い。
Il fait du vent. | イル・フェ・デュ・ヴァン | 風がある。
Il fait du soleil. | イル・フェ・デュ・ソレイユ | 日が照っている。
Il fait du brouillard. | イル・フェ・デュ・ブルイヤール | 霧が出ている。
:::

:::note faire + 形容詞と faire + 部分冠詞
上の表をよく見ると、2つの型が混ざっています。

- **il fait + 形容詞**：beau, mauvais, chaud, froid（状態を述べる）
- **il fait du + 名詞**：du vent, du soleil, du brouillard（あるモノの量を述べる）

後者は第2章の**部分冠詞**です。「風というものが、ある量ある」という捉え方をしています。**天候の要素が数えられない物質のように扱われている**のが、フランス語らしい発想です。
:::

### 専用の動詞を持つ天候

:::ex 天候専用の非人称動詞
Il pleut. | イル・プル | 雨が降っている。
Il neige. | イル・ネージュ | 雪が降っている。
Il gèle. | イル・ジェル | 凍っている。
Il grêle. | イル・グレル | 雹が降っている。
Il tonne. | イル・トンヌ | 雷が鳴っている。
:::

:::conj pleuvoir présent,imparfait,futur,passeCompose

**pleuvoir は il の形しか持ちません。** 活用表を見ると、他の人称が空欄になっているのが分かります。falloir も同じです。これが「非人称動詞」の名の由来です。

:::adv 比喩では複数形も使う
文学的な用法では、pleuvoir が人称的に使われることがあります。
[[Les coups pleuvaient.\|レ・クー・プルヴェ\|殴打が雨のように降り注いだ。]]

ただしこれは比喩で、天候の意味では常に非人称です。
:::

### その他の天候表現

:::ex être / y avoir を使う天候表現
Il y a du vent. | イリヤ・デュ・ヴァン | 風がある。
Il y a des nuages. | イリヤ・デ・ニュアージュ | 雲が出ている。
Le ciel est bleu. | ル・スィエ・レ・ブル | 空が青い。
Quel temps fait-il ? | ケル・タン・フェ・ティル | どんな天気ですか？
:::

**Quel temps fait-il ?** は第10章の疑問形容詞 quel と、第9章の倒置を組み合わせた形です。天気を尋ねる定型表現なので、そのまま覚えてください。

## 3. il faut — 必要性を表す

:::warn il faut は最頻出の非人称動詞
**falloir** は「〜が必要である」を表す動詞で、**il の形しか持ちません**。しかしフランス語で極めて頻繁に使われます。

:::conj falloir présent,imparfait,futur,conditionnel

il faut の後ろには3つのものが来ます。

**（1）il faut + 不定詞**（一般的な必要性）
[[Il faut partir.\|イル・フォ・パルティール\|出発しなければならない。]]
[[Il faut travailler.\|イル・フォ・トラヴァイエ\|働かなければならない。]]

**（2）il faut + 名詞**（〜が必要だ）
[[Il faut du temps.\|イル・フォ・デュ・タン\|時間が必要だ。]]
[[Il me faut un stylo.\|イル・ム・フォ・アン・スティロ\|私にはペンが要る。]]

**（3）il faut que + 接続法**（特定の人がすべきこと）
[[Il faut que tu partes.\|イル・フォ・ク・テュ・パルト\|君は出発しなければならない。]]

**（1）と（3）の違い**は、行為者を特定するかどうかです。不定詞は誰にでも当てはまる一般論、que 節は特定の主語に対する要求になります。que 節では**接続法**（第31章）が必要です。
:::

:::note devoir との使い分け
「〜しなければならない」には **devoir** もあります（第13章で登場）。

- [[Il faut partir.\|イル・フォ・パルティール\|（誰であれ）出発しなければならない。]] … 外的な必要性、一般論
- [[Je dois partir.\|ジュ・ドワ・パルティール\|私は出発しなければならない。]] … 主語の義務

il faut のほうが**非人格的で強い**響きになります。「そういうものだ」というニュアンスです。会話では il faut のほうが多用されます。
:::

## 4. 非人称の il + être + 形容詞

第4章で扱った c'est / il est の区別が、ここでも現れます。

:::ex 非人称の il est
Il est difficile de comprendre. | イ・レ・ディフィスィル・ドゥ・コンプランドル | 理解するのは難しい。
Il est important de travailler. | イ・レ・タンポルタン・ドゥ・トラヴァイエ | 働くことは重要だ。
Il est possible qu'il vienne. | イ・レ・ポスィブル・キル・ヴィエンヌ | 彼が来る可能性がある。
:::

:::warn il est … de + 不定詞 と c'est … à + 不定詞
第4章で予告した区別です。

| 形 | 使う場面 |
|---|---|
| **il est** + 形容詞 + **de** + 不定詞 | これから述べる内容を予告する（書き言葉的） |
| **c'est** + 形容詞 + **à** + 不定詞 | すでに話題になっている事柄を受ける |

- [[Il est difficile de comprendre ce texte.\|イ・レ・ディフィスィル・ドゥ・コンプランドル\|このテキストを理解するのは難しい。]]（内容を予告）
- [[Ce texte ? C'est difficile à comprendre.\|ス・テクスト・セ・ディフィスィル・ア・コンプランドル\|このテキスト？ 理解しにくいよ。]]（既出の話題を受ける）

**前置詞まで変わる**（de と à）ので、セットで覚えてください。なお話し言葉では、予告の場合でも c'est … de が広く使われます（C'est difficile de comprendre.）。
:::

## 5. 数詞 — 基数

非人称表現で時刻を扱うので、ここで数詞をまとめます。第0章で0〜20を学びました。続きです。

:::ex 20 から 100
vingt | ヴァン | 20
vingt et un | ヴァン・テ・アン | 21
vingt-deux | ヴァン・ドゥ | 22
trente | トラント | 30
quarante | カラント | 40
cinquante | サンカント | 50
soixante | ソワサント | 60
soixante-dix | ソワサント・ディス | 70
quatre-vingts | カトル・ヴァン | 80
quatre-vingt-dix | カトル・ヴァン・ディス | 90
cent | サン | 100
:::

:::warn 70・80・90 は20進法の名残
フランス語の数詞で最も有名な難所です。

- **70 = soixante-dix**（60 + 10）
- **80 = quatre-vingts**（4 × 20）
- **90 = quatre-vingt-dix**（4 × 20 + 10）

71 は soixante et onze（60 + 11）、99 は quatre-vingt-dix-neuf（4×20 + 19）となります。

これは**ケルト系の20進法**がフランス語に残ったものと説明されます。かつては六十（soixante）以上に septante（70）、huitante（80）、nonante（90）という10進法の形もありましたが、パリの用法が標準となる過程で20進法が定着しました。

**ベルギー・スイスでは今も10進法を使います**：septante（70）、nonante（90）、スイスでは huitante（80）も。フランス語圏の中でも地域差が大きい部分です。
:::

:::deep 数詞の綴りの細則
大学レベルでは、次の綴りの規則も問われます。

**（1）et が入るのは 21, 31, 41, 51, 61, 71 のみ**
vingt **et** un、trente **et** un … soixante **et** onze
ただし 81 と 91 は et を使いません：quatre-vingt-un、quatre-vingt-onze

**（2）quatre-vingts の s**
- 80 ちょうど → quatre-vingt**s**（s が付く）
- 81 以降 → quatre-vingt-un（s が落ちる）

同じ規則が cent にも適用されます。
- 200 → deux cent**s**
- 201 → deux cent un（s が落ちる）

**後ろに数が続くと s が落ちる**、と覚えます。

**（3）mille は不変**
[[deux mille\|ドゥ・ミル\|2000]]（× deux milles）。mille は常に単数形です。

**（4）million / milliard は名詞**
数詞ではなく名詞なので、**de を伴います**。
[[deux millions d'habitants\|ドゥ・ミリオン・ダビタン\|200万人の住民]]
:::

## 6. 時刻

**Il est + 数 + heure(s)** で表します。非人称構文です。

:::ex 時刻
Quelle heure est-il ? | ケ・ルー・レ・ティル | 何時ですか？
Il est une heure. | イ・レ・チュ・ヌール | 1時です。
Il est deux heures. | イ・レ・ドゥ・ザール | 2時です。
Il est trois heures et quart. | イ・レ・トロ・ザー・レ・カール | 3時15分です。
Il est quatre heures et demie. | イ・レ・カト・ラー・レ・ドゥミ | 4時半です。
Il est cinq heures moins le quart. | イ・レ・サン・カール・モワン・ル・カール | 5時15分前（4時45分）です。
Il est midi. | イ・レ・ミディ | 正午です。
Il est minuit. | イル・エ・ミニュイ | 真夜中です。
:::

:::warn heure は女性名詞
だから **une** heure（× un heure）、そして **et demie**（× et demi）となります。

ただし midi / minuit は男性名詞なので、[[midi et demi\|ミディ・エ・ドゥミ\|12時半]] と e が付きません。細かい点ですが、書き取りで問われます。
:::

:::note 24時間制と12時間制
公的な場面（時刻表・放送・予約）では**24時間制**を使い、分をそのまま言います。

[[Il est quinze heures trente.\|イ・レ・カン・ザール・トラント\|15時30分です。]]
[[Le train part à dix-huit heures quarante-cinq.\|ル・トラン・パー・タ・ディジュイ・タール・カラント・サンク\|列車は18時45分に出発します。]]

日常会話では12時間制で、必要なら **du matin**（午前）／**de l'après-midi**（午後）／**du soir**（夜）を添えます。
[[trois heures de l'après-midi\|トロ・ザール・ドゥ・ラプレ・ミディ\|午後3時]]
:::

lundi | ランディ | 月曜日
mardi | マルディ | 火曜日

:::warn 曜日・月は小文字で書く
英語では Monday, January と大文字ですが、**フランス語は小文字**です。国籍の形容詞（français）と同じ扱いです。
:::

:::deep 日付の言い方
**le + 数 + 月**の順です。日本語や英語と語順が違います。

[[le 14 juillet\|ル・カトルズ・ジュイエ\|7月14日]]（フランス革命記念日）
[[le 1er janvier\|ル・プルミエ・ジャンヴィエ\|1月1日]]

**1日だけ序数（premier）を使い、2日以降は基数**です。
- 1日 → le **premier**（le 1er）
- 2日 → le **deux**（× le deuxième）

第2章で見た「曜日に定冠詞を付けると習慣になる」という規則も、ここで再確認しておきます。
- [[lundi\|ランディ\|（今度の）月曜に]] … 特定の1日
- [[le lundi\|ル・ランディ\|毎週月曜に]] … 習慣

**Quel jour sommes-nous ?**（今日は何曜日ですか）や **Quelle est la date ?**（今日は何日ですか）で尋ねます。

## 8. il faut の全時制 — 「必要」の言い分け

:::deep il faut を時制で使いこなす
il faut は falloir の3人称単数しかない動詞ですが、**時制はすべて揃っています**。日常会話での頻度が非常に高いので、まとめて手に入れてください。

| 形 | 意味 |
|---|---|
| Il **faut** partir. | 出発しなければ |
| Il **fallait** le dire ! | 言ってくれればよかったのに！（半過去） |
| Il **a fallu** tout refaire. | 全部やり直すはめになった（複合過去） |
| Il **faudra** réserver. | 予約が必要になるだろう（未来） |
| Il **faudrait** réserver. | 予約したほうがいいのでは（条件法＝提案） |
| Il **aurait fallu** partir plus tôt. | もっと早く出るべきだった（条件法過去＝後悔） |

**Il fallait le dire !**（言ってよ！）と **Il faudrait + 不定詞**（〜したほうがいいのでは）は会話の定番です。il faut que + 接続法（第31章）と il faut + 不定詞の使い分け——**主語を特定するなら que + 接続法、一般論なら不定詞**——もここで意識しておくと、第31章が楽になります。

- Il faut **partir**.（（一般に／私たちは）出発しないと）
- Il faut **que je parte**.（**私は**出発しないと）
:::

## 9. 挨拶と天気 — 実際の会話へ

天気の話題はフランスでも定番の世間話です。

:::ex 天気を話題にする
Il fait beau aujourd'hui ! | イル・フェ・ボー・オジュルデュイ | 今日はいい天気ですね！
Quel temps fait-il chez vous ? | ケル・タン・フェ・ティル・シェ・ヴー | そちらの天気はどうですか？
Il va pleuvoir, je crois. | イル・ヴァ・プルヴォワール・ジュ・クロワ | 雨が降りそうですね。
Il a fait très chaud hier. | イラ・フェ・トレ・ショー・イエール | 昨日はとても暑かった。
:::

**Il va pleuvoir.** は第11章の近接未来です。非人称動詞でも近接未来が作れます。


:::ai-gen 非人称構文、天候表現、il faut、時刻と日付

## 10. 非人称構文の全体像 — il が指さない7つの型

非人称の il は、天気と il faut だけではありません。**主語の位置を埋めるためだけに置かれる il** の全用法を整理します。

| 型 | 例 | 意味 |
|---|---|---|
| **天候** | Il pleut. / Il fait beau. | 雨が降る／いい天気だ |
| **時刻** | Il est trois heures. | 3時です |
| **必要** | Il faut partir. | 出発しなければ |
| **存在** | Il y a du monde. | 人がいる |
| **評価 + de + 不定詞** | Il est important de dormir. | 眠ることは大切だ |
| **評価 + que + 接続法** | Il est possible qu'il vienne. | 彼が来るかもしれない |
| **出来事の提示** | Il est arrivé un accident. | 事故が起きた |
| **残り・不足** | Il reste dix euros. / Il manque une chaise. | 10ユーロ残っている／椅子が1脚足りない |

:::ex 非人称構文のいろいろ
Il est difficile de tout comprendre. | イ・レ・ディフィスィル・ドゥ・トゥ・コンプランドル | すべてを理解するのは難しい。
Il vaut mieux attendre. | イル・ヴォ・ミュー・ザタンドル | 待ったほうがいい。
Il s'agit d'un malentendu. | イル・サジ・ダン・マランタンデュ | これは誤解の問題です。
Il paraît qu'il va démissionner. | イル・パレ・キル・ヴァ・デミスィヨネ | 彼は辞任するらしい。
Il reste encore du temps. | イル・レスト・アンコール・デュ・タン | まだ時間が残っている。
:::

**il s'agit de**（〜が問題である・〜のことだ）と **il paraît que**（〜らしい）は、書き言葉・話し言葉の両方で頻出します。とくに **il s'agit de** は主語を持てない動詞で、「これは何の話か」を導入する定型です。

:::warn 意味上の主語は後ろに置かれる
**Il reste dix euros.** の「10ユーロ」は意味の上では主語ですが、**動詞の後ろ**に置かれ、動詞は il に合わせて**常に単数**です。

- ○ Il **reste** dix euros.（× Il restent）
- ○ Il **est arrivé** trois personnes.（3人が到着した——文語的）

この「後ろに置かれた意味上の主語」を**論理主語**と呼びます。il が文法上の主語、後ろの名詞が論理主語という二重構造で、フランス語が**主語の位置を空にできない**言語であることの現れです（第3章）。
:::

  title: '命令形',
  sub: '少し愛して 長く愛して……',
  body: `
命令形（l'impératif）は、フランス語で**唯一、主語を置かない形**です。第3章で「主語代名詞は省略できない」と述べましたが、その例外がここです。

作り方は簡単で、**直説法現在から主語を取るだけ**。ただし3つの細かい規則（-s の脱落、代名詞の位置、否定との組み合わせ）があり、これらは後の章（代名詞・代名動詞）で繰り返し使うので、ここで固めておきます。

## 1. 作り方 — 現在形から主語を取る

命令形は **tu / nous / vous の3つ**しかありません。

| 人称 | 意味 |
|---|---|
| **tu** の形 | 〜しろ、〜して（親しい相手に） |
| **nous** の形 | 〜しよう（勧誘） |
| **vous** の形 | 〜してください（丁寧・複数） |

:::conj chanter imperatif

:::warn 第1群では tu の -s が落ちる
これが唯一の形の変化です。

- 現在形：tu chante**s**
- 命令形：**Chante !**（s が落ちる）

**-er 動詞と、ouvrir 型（現在形の語尾が -e になる第3群）**でこの脱落が起きます。他の動詞では落ちません。

| 動詞 | 現在形（tu） | 命令形 |
|---|---|---|
| chanter | tu chantes | **Chante !** |
| ouvrir | tu ouvres | **Ouvre !** |
| aller | tu vas | **Va !** |
| finir | tu finis | **Finis !**（落ちない） |
| prendre | tu prends | **Prends !**（落ちない） |
| partir | tu pars | **Pars !**（落ちない） |
:::

:::ex 命令形を使ってみる
Chante ! | シャント | 歌え！
Chantons ! | シャントン | 歌おう！
Chantez ! | シャンテ | 歌ってください！
Écoute ! | エクット | 聞いて！
Regardez ! | ルガルデ | ご覧ください！
Finis ton travail ! | フィニ・トン・トラヴァイユ | 仕事を終わらせなさい！
Prenez le métro. | プルネ・ル・メトロ | 地下鉄に乗ってください。
Viens ! | ヴィアン | おいで！
:::

:::deep -s が落ちるのに復活する場合がある
第1群の tu の命令形は -s が落ちますが、**後ろに y や en が続くとリエゾンのために復活します**。

- [[Va !\|ヴァ\|行け！]] → [[Vas-y !\|ヴァ・ズィ\|さあ行け！／頑張れ！]]
- [[Parle !\|パルル\|話せ！]] → [[Parles-en !\|パルル・ザン\|それについて話せ！]]
- [[Donne !\|ドンヌ\|渡せ！]] → [[Donnes-en !\|ドンヌ・ザン\|それを（いくらか）渡せ！]]

母音で始まる y / en の前で、リエゾンする子音がないと発音しにくいためです。**bel / cet / -t- の挿入と同じ、母音の衝突を避ける現象**です。

[[Vas-y !\|ヴァ・ズィ\|行け！／頑張れ！]] はスポーツの応援などで頻繁に耳にする表現です。
:::

## 2. 不規則な命令形 — 4つだけ

**être, avoir, savoir, vouloir** の4語だけ、現在形から作れません。**接続法現在の形を使います**（第31章で扱う形が先取りで出てきます）。

| 動詞 | tu | nous | vous |
|---|---|---|---|
| **être** | sois | soyons | soyez |
| **avoir** | aie | ayons | ayez |
| **savoir** | sache | sachons | sachez |
| **vouloir** | veuille | veuillons | **veuillez** |

:::conj être imperatif

:::ex 不規則な命令形
Sois sage ! | ソワ・サージュ | いい子にしていなさい！
Soyez les bienvenus. | ソワイエ・レ・ビアンヴニュ | ようこそ。
N'aie pas peur. | ネ・パ・プール | 怖がらないで。
Ayez confiance. | エイエ・コンフィヤンス | 信頼してください。
Sachez que c'est faux. | サシェ・ク・セ・フォー | それが誤りだと知っておいてください。
Veuillez patienter. | ヴイエ・パスィヤンテ | しばらくお待ちください。
:::

:::note veuillez は最も丁寧な依頼表現
**veuillez + 不定詞** は、ビジネスメールや公的な掲示で標準的に使われる、非常に丁寧な依頼の形です。

[[Veuillez agréer mes salutations distinguées.\|ヴイエ・アグレエ・メ・サリュタスィオン・ディスタンゲ\|敬具（手紙の結び）]]
[[Veuillez trouver ci-joint …\|ヴイエ・トルヴェ・スィ・ジョワン\|添付をご確認ください]]

フランス語のビジネスメールでは必ず出てくる形なので、覚えておくと役に立ちます。
:::

:::adv pouvoir には命令形がない
[[pouvoir\|プヴォワール\|〜できる]] は命令形を持ちません。「〜できるようになれ」と命じることに意味がないためです。同様に、**falloir, pleuvoir などの非人称動詞**も命令形を持ちません（誰にも命令できない）。

活用表で確認できます。
:::conj pouvoir imperatif
:::

## 3. 否定の命令形

第5章の原則どおり、**活用した動詞を ne … pas で挟みます**。

:::ex 否定の命令形
Ne chante pas ! | ヌ・シャント・パ | 歌うな！
Ne partez pas ! | ヌ・パルテ・パ | 行かないでください！
N'oublie pas ! | ヌブリ・パ | 忘れないで！
Ne t'inquiète pas. | ヌ・タンキエット・パ | 心配しないで。
:::

## 4. 代名詞との組み合わせ — 位置が変わる

:::warn 肯定命令では代名詞が動詞の後ろに来る
これは**フランス語で唯一、目的語代名詞が動詞の後ろに置かれる場合**です。第17章以降で扱う代名詞のすべてに関わるので、ここで原則を押さえます。

| | 代名詞の位置 |
|---|---|
| **肯定命令** | 動詞の**後ろ**（ハイフンでつなぐ） |
| **否定命令** | 動詞の**前**（通常どおり） |
| それ以外すべて | 動詞の**前** |

:::ex 肯定と否定で位置が反転する
Regarde-moi ! | ルガルド・モワ | 私を見て！
Ne me regarde pas ! | ヌ・ム・ルガルド・パ | 私を見ないで！
Donnez-le-moi. | ドネ・ル・モワ | それを私にください。
Ne me le donnez pas. | ヌ・ム・ル・ドネ・パ | それを私にくれないでください。
:::
:::

:::warn 肯定命令では me → moi、te → toi に変わる
代名詞が動詞の後ろに置かれると、**強い位置**になるため、弱形の me / te が強形の moi / toi に変わります（第19章の強勢形と同じ現象）。

- Ne **me** regarde pas.（動詞の前 → 弱形 me）
- Regarde-**moi** !（動詞の後 → 強形 moi）

ただし **y / en が続く場合は m'y / t'en** と弱形に戻ります。
[[Va-t'en !\|ヴァ・タン\|出て行け！]]（te + en → t'en）
:::

:::deep 肯定命令で代名詞が2つ並ぶとき
第26.5章で詳しく扱いますが、原則だけ示します。

**肯定命令では「直接目的語 → 間接目的語」の順**になります。通常の語順とは逆です。

- 通常：[[Il me le donne.\|イル・ム・ル・ドンヌ\|彼はそれを私にくれる。]]（間接 me → 直接 le）
- 肯定命令：[[Donne-le-moi !\|ドンヌ・ル・モワ\|それを私にくれ！]]（直接 le → 間接 moi）
- 否定命令：[[Ne me le donne pas !\|ヌ・ム・ル・ドンヌ・パ\|それを私にくれるな！]]（通常の順に戻る）

**肯定命令のときだけ語順が入れ替わる**、と覚えてください。
:::

## 5. 代名動詞の命令形 — 日常最頻出の形

:::deep Assieds-toi ! — 代名動詞を命令にする
代名動詞（第23章で本格的に扱います）の命令形は、**再帰代名詞を動詞の後ろに付け、te は toi に**変えます。生活の指示はほとんどこの形なので、先に音で覚えてしまいましょう。

| 肯定命令 | 否定命令 | 意味 |
|---|---|---|
| **Assieds-toi !** | Ne t'assieds pas ! | 座って！ |
| **Asseyez-vous.** | Ne vous asseyez pas. | お座りください |
| **Lève-toi !** | Ne te lève pas ! | 起きて！ |
| **Dépêche-toi !** | Ne te dépêche pas. | 急いで！ |
| **Calme-toi.** | Ne t'inquiète pas. | 落ち着いて／心配しないで |
| **Amuse-toi bien !** | — | 楽しんできてね！ |
| **Va-t'en !** | Ne t'en va pas ! | 出て行け！／行かないで！ |

否定命令では再帰代名詞が**動詞の前・弱形のまま**に戻ります（Ne **te** lève pas.）。位置と形の両方が変わる点は、目的語代名詞（§4）とまったく同じ規則です。

**Ne t'inquiète pas.**（心配しないで）、**Dépêche-toi !**（急いで）、**Amuse-toi bien !**（楽しんで）は家庭内の最頻出フレーズです。vous 版（Ne vous inquiétez pas. / Dépêchez-vous ! / Amusez-vous bien !）とセットで覚えてください。
:::

## 6. 命令以外の使い方

:::adv 命令形は「命令」だけではない
形は命令形でも、実際の意図はさまざまです。

| 用法 | 例 |
|---|---|
| **依頼** | [[Aidez-moi, s'il vous plaît.\|エデ・モワ・スィル・ヴ・プレ\|手伝ってください。]] |
| **勧誘** | [[Allons au cinéma !\|アロン・ゾ・スィネマ\|映画に行こう！]] |
| **助言** | [[Prends un taxi.\|プラン・ザン・タクスィ\|タクシーに乗るといいよ。]] |
| **許可** | [[Entrez.\|アントレ\|お入りください。]] |
| **願望** | [[Sois heureux.\|ソワ・ズルー\|幸せでいてね。]] |
| **条件** | [[Travaille, et tu réussiras.\|トラヴァイユ・エ・テュ・レユスィラ\|働きなさい、そうすれば成功する。]] |

最後の用法は、**命令形 + et + 単純未来**で「もし〜すれば…」という条件文の代わりになります（第30章の si 構文と対応）。
:::

:::note 命令を和らげる方法
命令形は直接的なので、日常では和らげた表現がよく使われます。

- **s'il vous plaît / s'il te plaît** を添える：[[Fermez la porte, s'il vous plaît.\|フェルメ・ラ・ポルト・スィル・ヴ・プレ\|ドアを閉めてください。]]
- **疑問文にする**：[[Tu peux fermer la porte ?\|テュ・プ・フェルメ・ラ・ポルト\|ドア閉めてくれる？]]
- **条件法を使う**（第30章）：[[Pourriez-vous fermer la porte ?\|プリエ・ヴー・フェルメ・ラ・ポルト\|ドアを閉めていただけますか？]]

下に行くほど丁寧になります。**店や職場では条件法が標準**です。
:::

## 7. 標識・掲示でよく見る形

:::adv 掲示では不定詞が使われる
公共の掲示では、命令形ではなく**不定詞**が使われることがよくあります。特定の相手ではなく不特定多数に向けるためです。

[[Ne pas fumer.\|ヌ・パ・フュメ\|禁煙。]]
[[Ne pas se pencher au dehors.\|ヌ・パ・ス・パンシェ・オ・ドゥオール\|窓から身を乗り出さないこと。]]
[[Pousser / Tirer\|プセ・ティレ\|押す／引く]]

第5章で見たとおり、**不定詞の否定では ne pas がまとめて前に置かれます**。

より丁寧な掲示では **Prière de + 不定詞** や **Veuillez + 不定詞** が使われます。
[[Prière de ne pas fumer.\|プリエール・ドゥ・ヌ・パ・フュメ\|禁煙のお願い。]]
:::

## 8. 命令をやわらげる — 実際の頼み方

:::deep 生の命令形は強い — ネイティブの緩和手段
命令形は文法としては簡単ですが、**そのまま使うと日本語の「〜しろ」に近い強さ**が出ることがあります。ネイティブは次の道具で調整します。

**（1）s'il te plaît / s'il vous plaît を添える**

[[Passe-moi le sel, s'il te plaît.|パス・モワ・ル・セル・スィル・トゥ・プレ|塩を取って、お願い。]]

これだけで命令形は依頼になります。**添えるのがほぼ既定**と考えてください。

**（2）Tu peux … ? / Tu veux bien … ? で聞く**

[[Tu peux fermer la fenêtre ?|チュ・プ・フェルメ・ラ・フネートル|窓を閉めてくれる？]]
[[Tu veux bien m'aider ?|チュ・ヴ・ビヤン・メデ|手伝ってくれるかな？]]

命令形を使わずに疑問文で頼む形。家庭・職場で最も普通の頼み方です。

**（3）条件法でさらに丁寧に（第30章）**

[[Pourriez-vous répéter ?|プリエ・ヴ・レペテ|もう一度おっしゃっていただけますか。]]

**（4）veuillez + 不定詞 — 書き言葉の丁寧な指示**

[[Veuillez patienter.|ヴイエ・パスィヤンテ|少々お待ちください。]]
[[Veuillez trouver ci-joint …|ヴイエ・トルヴェ・スィ・ジョワン|添付にて〜をお送りします。]]

veuillez は vouloir の特殊な命令形（vous）で、**案内放送・メール・掲示の定型**です。会話では使いませんが、フランスで生活すると毎日目にします。

**（5）allez / voyons — 促し・なだめの間投詞**

[[Allez, viens !|アレ・ヴィヤン|ほら、おいでよ！]]
[[Voyons, calme-toi.|ヴォワイヨン・カルム・トワ|まあまあ、落ち着いて。]]

aller / voir の命令形が間投詞化したもので、命令形の前に付いて口調を作ります。
:::

## 9. 活用ドリル

:::drill chanter,finir,prendre,être,avoir,aller,faire,venir,ouvrir imperatif

## 10. レシピを読む — vous の命令形の実地

フランス語のレシピは **vous の命令形**（または不定詞）で書かれます。クレープの生地で読んでみましょう。

:::ex クレープ生地のレシピ
Mélangez la farine et les œufs. | メランジェ・ラ・ファリンヌ・エ・レ・ズー | 小麦粉と卵を混ぜます。
Ajoutez le lait petit à petit. | アジュテ・ル・レ・プティ・タ・プティ | 牛乳を少しずつ加えます。
Laissez reposer la pâte une heure. | レセ・ルポゼ・ラ・パット・ユヌ・ール | 生地を1時間休ませます。
Faites chauffer une poêle. | フェット・ショフェ・ユヌ・ポワル | フライパンを熱します。
Versez une louche de pâte. | ヴェルセ・ユヌ・ルーシュ・ドゥ・パット | お玉1杯の生地を流し入れます。
Retournez la crêpe et laissez cuire une minute. | ルトゥルネ・ラ・クレップ | クレープを裏返して1分焼きます。
:::

**Faites chauffer / Laissez reposer / Laissez cuire** のように、**faire / laisser + 不定詞**（〜させる・〜するにまかせる）が料理語の骨格です。市販のレシピ本・料理サイトはこの語彙の反復なので、この6文が読めればフランス語のレシピはほぼ読めます。

## 11. 章のタイトルについて

「少し愛して 長く愛して」——これを命令形で言うと、次のようになります。

:::ex 命令形の例文
Aime-moi un peu, aime-moi longtemps. | エム・モワ・アン・プ・エム・モワ・ロンタン | 少し愛して、長く愛して。
Ne m'oublie pas. | ヌ・ムブリ・パ | 私を忘れないで。
Écris-moi. | エクリ・モワ | 手紙をちょうだい。
Reste avec moi. | レスト・アヴェック・モワ | そばにいて。
:::

**Aime-moi** で -s が落ち、me が moi になっている——この章の2つの規則がどちらも効いています。


:::ai-gen 命令形の作り方、代名詞の位置、丁寧な依頼表現

## 11. 命令形から生まれた間投詞 — Tiens ! と Dis donc !

いくつかの命令形は、本来の意味を離れて**会話の間投詞**になっています。命令ではないので、目上の人にも使えます（vous 形もあります）。

| 表現 | 元の動詞 | 会話での働き |
|---|---|---|
| **Tiens ! / Tenez !** | tenir（持つ） | あれっ？（驚き）／はい、どうぞ（手渡し） |
| **Dis donc ! / Dites donc !** | dire | ちょっと！ねえ！（注意を引く・感嘆） |
| **Écoute / Écoutez** | écouter | あのね、いいかい（話の切り出し） |
| **Attends / Attendez** | attendre | 待って、ええと（考え中） |
| **Voyons** | voir | まあまあ／ええと |
| **Allons donc !** | aller | まさか！ |

:::ex 間投詞化した命令形
Tiens, c'est pour toi. | ティヤン・セ・プール・トワ | はい、これ君に。
Tiens ? Tu es déjà là ? | ティヤン・チュ・エ・デジャ・ラ | あれ？ もう来てたの？
Dis donc, il fait froid ce matin ! | ディ・ドン・イル・フェ・フロワ | いやあ、今朝は冷えるね！
Écoutez, je vais être franc. | エクテ・ジュ・ヴェ・ゼートル・フラン | いいですか、率直に言います。
Attends, je réfléchis. | アタン・ジュ・レフレシ | 待って、考えてる。
:::

**Tiens** は「はい、どうぞ」と「あれっ」の2役、**Dis donc** は驚き・感嘆の万能句です。ネイティブの会話はこれらの小さな命令形で句読点を打ちながら進みます。聞き取りで「命令された」と身構えないことが大切です。

## 12. nous の命令形 — 提案と勧誘

命令形の nous は「私たち」に対する命令、つまり**勧誘**（〜しよう）です。日常の提案表現として頻繁に使われます。

:::ex nous の命令形
Allons-y ! | アロン・ズィ | さあ行こう！
Partons tout de suite. | パルトン・トゥ・ドゥ・スュイット | すぐ出発しよう。
Ne perdons pas de temps. | ヌ・ペルドン・パ・ドゥ・タン | 時間を無駄にしないようにしよう。
Voyons ce qu'il en pense. | ヴォワイヨン・ス・キ・ラン・パンス | 彼がどう思うか見てみよう。
Soyons clairs. | ソワイヨン・クレール | はっきりさせておこう。
:::

**Soyons clairs.**（はっきりさせよう）、**Restons calmes.**（落ち着こう）のように、être の命令形 soyons は議論の場でよく使われます。

:::note 勧誘の3つの言い方
「〜しよう」には競合する言い方が3つあり、**くだけた順**に並びます。

| 形 | 例 | 文体 |
|---|---|---|
| **On + 現在形 ?** | On y va ?（行く？） | 最も口語的 |
| **Si on + 半過去 ?** | Si on y allait ?（行かない？） | 柔らかい提案（第27章） |
| **命令形 nous** | Allons-y !（行こう！） | やや改まる・力強い |

会話では **On y va ?** が圧倒的に多く、命令形の nous は「さあ行くぞ」という**号令**に近い響きを持ちます。Allons-y ! は出発の合図、Allons ! は「まあまあ」となだめる間投詞——同じ形でも文脈で働きが変わります。
:::

[[Je t'aime.\|ジュ・テーム\|愛してる。]] ——フランス語で最も知られた一文です。この **t'** が、この章で扱う**直接目的補語人称代名詞（le pronom personnel complément d'objet direct、略して COD）**です。

英語の I love **you**. と比べると、決定的な違いが1つあります。**フランス語では代名詞が動詞の前に来ます**。この語順は英語話者・日本語話者のどちらにとっても直感に反するため、意識的な訓練が必要です。

第17章から第19章まで、人称代名詞を3種類（直接目的語・間接目的語・強勢形）に分けて扱います。この章はその1つ目です。

## 1. 直接目的語とは何か

**前置詞なしで動詞に直接つながる目的語**です。

- [[Je regarde **la télé**.\|ジュ・ルガルド・ラ・テレ\|私はテレビを見る。]] … la télé は直接目的語
- [[Je parle **à Marie**.\|ジュ・パルル・ア・マリ\|私はマリに話す。]] … à Marie は前置詞つき＝間接目的語（第18章）

:::warn 日本語の「〜を」と一致しない動詞がある
日本語で「〜を」と訳せても、フランス語では前置詞が必要な場合があります。逆もあります。

| フランス語 | 直訳 | 目的語の種類 |
|---|---|---|
| [[téléphoner à\|テレフォネ・ア\|〜に電話する]] | 〜に電話する | **間接**（à が必要） |
| [[répondre à\|レポンドル・ア\|〜に答える]] | 〜に答える | **間接** |
| [[obéir à\|オベイール・ア\|〜に従う]] | 〜に従う | **間接** |
| [[attendre\|アタンドル\|〜を待つ]] | 〜を待つ | **直接**（前置詞なし） |
| [[chercher\|シェルシェ\|〜を探す]] | 〜を探す | **直接** |
| [[regarder\|ルガルデ\|〜を見る]] | 〜を見る | **直接** |
| [[écouter\|エクテ\|〜を聞く]] | 〜を聞く | **直接** |
| [[payer\|ペイエ\|〜を払う]] | 〜を払う | **直接** |

英語では wait **for**、look **for**、listen **to** と前置詞が要りますが、**フランス語では不要**です。逆に「電話する」は英語 call（直接）に対し、フランス語 téléphoner **à**（間接）です。

**動詞ごとに辞書で確認する**しかありません。ただしこの区別を誤ると、次章以降で使う代名詞を選び間違えます。
:::

## 2. 直接目的語代名詞の形

| 人称 | 形 | 意味 |
|---|---|---|
| 1人称単数 | **me**（m'） | 私を |
| 2人称単数 | **te**（t'） | 君を |
| 3人称単数・男性 | **le**（l'） | 彼を、それを |
| 3人称単数・女性 | **la**（l'） | 彼女を、それを |
| 1人称複数 | **nous** | 私たちを |
| 2人称複数 | **vous** | あなた（たち）を |
| 3人称複数 | **les** | 彼らを、それらを |

:::note 定冠詞とまったく同じ形
3人称の **le / la / les** は、定冠詞と同じ綴りです。区別は**位置**でつけます。

- [[Je regarde **le** film.\|ジュ・ルガルド・ル・フィルム\|私はその映画を見る。]] … 名詞の前 → 定冠詞
- [[Je **le** regarde.\|ジュ・ル・ルガルド\|私はそれを見る。]] … 動詞の前 → 代名詞

**動詞の直前にある le / la / les は代名詞**、と覚えてください。
:::

## 3. 語順 — 代名詞は動詞の前

**これがこの章の核心です。**

:::ex 名詞を代名詞に置き換える
Je regarde la télé. → Je la regarde. | ジュ・ラ・ルガルド | 私はそれを見る。
Tu aimes Marie ? → Tu l'aimes ? | テュ・レーム | 君は彼女を愛している？
Il achète les livres. → Il les achète. | イル・レ・ザシェット | 彼はそれらを買う。
Je t'aime. | ジュ・テーム | 私は君を愛している。
Elle nous invite. | エル・ヌー・ザンヴィット | 彼女は私たちを招待する。
:::

:::warn 英語・日本語との語順の違い
| 言語 | 語順 |
|---|---|
| 日本語 | 私は **君を** 愛している（目的語 → 動詞） |
| 英語 | I love **you**（動詞 → 目的語） |
| フランス語 | Je **t'**aime（**目的語 → 動詞**） |

偶然にも**日本語と同じ順序**になります。英語からフランス語に移る学習者にとっては難所ですが、日本語話者には掴みやすい点です。

ただし**名詞のままなら動詞の後ろ**です（Je regarde la télé.）。代名詞になったときだけ前に出ます。
:::

:::warn me / te / le / la はエリジオンする
母音・無音の h で始まる動詞の前では、**m' / t' / l'** になります。

- Je **te** regarde. → Je **t'**aime.
- Je **le** vois. → Je **l'**aime.
- Je **la** vois. → Je **l'**aime.

**le と la はどちらも l' になる**ので、エリジオンすると性が分からなくなります。[[Je l'aime.\|ジュ・レーム\|私は彼／彼女を愛している。]] は、男性にも女性にも使えます。
:::

## 4. 3つの構文での位置

代名詞は「動詞の前」ですが、動詞が複数ある文ではどの動詞の前かが問題になります。**原則は「その代名詞を目的語に取る動詞の直前」**です。

### （1）単純時制

:::ex 単純時制
Je le vois. | ジュ・ル・ヴォワ | 私はそれが見える。
Je ne le vois pas. | ジュ・ヌ・ル・ヴォワ・パ | 私はそれが見えない。
:::

否定文でも **ne の後、動詞の前**です。ne … pas が挟むのは「代名詞 + 動詞」のかたまりになります。

### （2）不定詞を伴う構文

:::ex 不定詞の前に置く
Je veux le voir. | ジュ・ヴ・ル・ヴォワール | 私はそれを見たい。
Je vais l'acheter. | ジュ・ヴェ・ラシュテ | 私はそれを買うつもりだ。
Je ne veux pas le voir. | ジュ・ヌ・ヴ・パ・ル・ヴォワール | 私はそれを見たくない。
:::

:::warn どの動詞の前に置くかは意味で決まる
Je veux le voir. で、le は **voir** の目的語です（「見たい」対象）。だから voir の直前に置きます。× Je le veux voir. とは言いません。

**代名詞は、自分が目的語になっている動詞の直前に置く** ——この原則を守れば迷いません。近接未来（Je vais l'acheter.）でも同じです。
:::

### （3）命令形

第16章で扱ったとおり、**肯定命令のときだけ動詞の後ろ**に来ます。

:::ex 命令形での位置
Regarde-le ! | ルガルド・ル | それを見て！
Ne le regarde pas ! | ヌ・ル・ルガルド・パ | それを見ないで！
Aime-moi ! | エム・モワ | 私を愛して！
Ne m'aime pas ! | ヌ・メーム・パ | 私を愛さないで！
:::

肯定命令では **me → moi** に変わることも復習しておいてください。

### （4）複合時制（先取り）

第20章で扱いますが、原則だけ示します。**代名詞は助動詞の前**に置きます。

[[Je l'ai vu.\|ジュ・レ・ヴュ\|私はそれを見た。]]（× J'ai le vu）

そして重要な帰結があります。**直接目的語が動詞より前に出ると、過去分詞がそれに性数一致します**。

[[Je l'ai vue.\|ジュ・レ・ヴュ\|私は彼女を見た。]]（l' が女性なので vue）

これが第20章で最も難しい規則になりますが、**その条件を作っているのがこの章の代名詞**です。

## 5. 中性代名詞 le — 文や形容詞を受ける

:::deep le は名詞以外も受けられる
3人称男性単数の le には、**性数を持たない「中性」の用法**があります。名詞ではなく、**形容詞・文全体・不定詞**を受けます。

:::ex 中性の le
Tu es fatigué ? — Oui, je le suis. | ウィ・ジュ・ル・スュイ | 疲れてる？ — うん、そうだよ。
Elle est malade, mais je ne le savais pas. | ジュ・ヌ・ル・サヴェ・パ | 彼女は病気だが、私はそれを知らなかった。
Il viendra, je le sais. | イル・ヴィアンドラ・ジュ・ル・セ | 彼は来る、私はそれを知っている。
:::

- 1つ目の le は形容詞 fatigué を受けています。**性数一致しません**（女性が答えても je le suis）。
- 2つ目・3つ目の le は文全体を受けています。

英語では省略される（Yes, I am. / I know.）ところに、**フランス語では le が必要**です。落とすと不自然になります。

この中性の le は第26章で y, le としてまとめて扱います。
:::

## 6. 使役・知覚動詞との組み合わせ

:::adv faire + 不定詞（使役）と voir + 不定詞（知覚）
「〜させる」「〜するのを見る」という構文では、代名詞の位置が特殊になります。

**使役 faire + 不定詞**
[[Je fais chanter Marie.\|ジュ・フェ・シャンテ・マリ\|私はマリに歌わせる。]]
→ [[Je la fais chanter.\|ジュ・ラ・フェ・シャンテ\|私は彼女に歌わせる。]]

代名詞は **faire の前**に置きます（× Je fais la chanter）。faire + 不定詞が**1つの動詞のかたまり**として扱われるためです。

**知覚 voir / entendre / écouter + 不定詞**
[[J'entends chanter Marie.\|ジャンタン・シャンテ・マリ\|私はマリが歌うのが聞こえる。]]
→ [[Je l'entends chanter.\|ジュ・ランタン・シャンテ\|私は彼女が歌うのが聞こえる。]]

こちらも知覚動詞の前です。

**laisser + 不定詞（放任）**も同じ扱いです。
[[Laisse-moi partir.\|レス・モワ・パルティール\|行かせてくれ。]]

これらの構文では、**不定詞の意味上の主語が、主動詞の目的語になっている**という点が特徴的です。fais chanter Marie では、Marie は「歌う」主語であり同時に faire の目的語です。だから代名詞化すると主動詞の前に出ます。
:::

## 7. 話し言葉での聞こえ方

:::deep 代名詞は音が縮む — 聞き取りの実務
直接目的語代名詞は無強勢で、**前後の語と一体化して発音されます**。教科書の綴りと、耳に入る音の間には距離があります。

| 書き言葉 | 実際の音 | 意味 |
|---|---|---|
| Je le vois. | 「ジュ**ル**ヴォワ」（1語のように） | 彼が見える |
| Je t'aime. | 「ジュ**テ**ーム」 | 愛してる |
| Il m'a vu. | 「イル**マ**ヴュ」 | 彼は私を見た |
| Je ne le sais pas. | 「ジュ**ル**セパ」（ne が落ちる） | それは知らない |

話し言葉では **ne が落ちる**（第5章）ので、Je le sais pas. / J'le sais pas. のように聞こえます。**J'le**「ジュル→ジル」のような縮約は口語で普通です。自分で話すときは丁寧に発音してよいのですが、**聞くときはこの縮んだ形を知らないと代名詞を聞き落とします**。

もう1つ、**Le voici / La voilà**（ほら、ここにいるよ）という組み合わせも日常頻出です。

- [[Tu cherches tes clés ? Les voilà.|チュ・シェルシュ・テ・クレ・レ・ヴォワラ|鍵探してるの？ ほら、ここだよ。]]
- [[Me voici !|ム・ヴォワスィ|さあ着いたよ！／私はここ！]]

voici / voilà（第4章）は動詞のように代名詞を前に取ります。Me voici. は到着の挨拶として定型です。
:::

## 8. le / la と ça — 「それが好き」の使い分け

:::warn J'aime ça. と Je l'aime. は別物
「それ好き？」への答えで、代名詞の選択が意味を分けます。

| 文 | 受けるもの | 例 |
|---|---|---|
| **J'aime ça.** | **種類・こと全般** | Tu aimes le fromage ? — J'aime ça. チーズ（というもの）は好き |
| **Je l'aime.** | **特定の個体・人** | Tu aimes ce fromage ? — Je l'aime bien. この（目の前の）チーズは好き |

さらに重要な違い：**人に対して Je l'aime. と言うと「愛している」**の意味になります。

- [[Je l'aime bien.|ジュ・レーム・ビヤン|彼（彼女）のこと、いい人だと思う。]]（bien が付くと友情）
- [[Je l'aime.|ジュ・レーム|彼（彼女）を愛している。]]（恋愛）
- [[J'aime bien ce resto.|ジェーム・ビヤン・ス・レスト|この店、気に入ってる。]]

**aimer bien は aimer より弱い**——bien が付くほうが軽い、という直感に反する序列です。恋愛の告白は Je t'aime.、友達への好意は Je t'aime bien. で、**bien の有無が友情と恋愛を分けます**。間違えると重大な誤解になる、フランス語で最も有名な語法の1つです。

総称を受けるのは ça（口語の既定）で、**総称の le/la/les で受け直さない**のがポイントです。

- Tu aimes le café ? — ○ Oui, j'aime **ça**. ／ △ Oui, je **l'**aime.（不自然）
:::

## 9. le / la か lui か — 動詞で決まる

:::warn 「〜を」「〜に」の日本語訳に頼らない
le / la（直接）と lui（間接、第18章）の選択は、**フランス語の動詞が前置詞を取るかどうか**だけで決まります。日本語の「を／に」と**一致しない動詞**が事故の元です。

**直接目的語（le / la / les）なのに日本語は「〜に」に見える動詞**

| 動詞 | 例 |
|---|---|
| **aider** qn（〜を助ける） | Je **l'**aide.（彼に手を貸す） |
| **attendre** qn（〜を待つ） | Je **l'**attends.（彼を待つ） |
| **remercier** qn（〜に感謝する） | Je **le** remercie.（彼に感謝する） |
| **appeler** qn（〜に電話する・呼ぶ） | Je **l'**appelle.（彼に電話する） |
| **croire** qn（〜を信じる） | Je **la** crois.（彼女の言うことを信じる） |
| **suivre** qn（〜について行く） | Je **le** suis.（彼について行く） |

**間接目的語（lui / leur）なのに日本語は「〜を」に見える動詞**

| 動詞 | 例 |
|---|---|
| **téléphoner à** qn | Je **lui** téléphone.（彼に電話する） |
| **répondre à** qn | Je **lui** réponds. |
| **plaire à** qn（〜の気に入る） | Elle **lui** plaît.（彼は彼女が気に入っている） |
| **manquer à** qn | Tu **me** manques.（君が恋しい） |

**appeler（直接）と téléphoner à（間接）が同じ「電話する」**で違う型を取ることに注目してください。訳語ではなく、**動詞ごとの型**（第7.5章）を覚えるしかない——それがフランス語の代名詞選択の実態です。迷ったら辞書で「qn」（直接）か「à qn」（間接）かを確認する癖をつけてください。
:::

## 10. よくある誤り

:::warn 日本語話者がやりがちな6つの誤り
| × | ○ | 理由 |
|---|---|---|
| Je vois le. | Je **le** vois. | 代名詞は動詞の前（§3） |
| Je le veux voir. | Je veux **le** voir. | 不定詞の目的語は不定詞の前（§4） |
| Regarde-le pas ! | Ne **le** regarde pas ! | 否定命令は動詞の前に戻る（§4） |
| J'aime le.（この本が好き） | Je **l'**aime. | 母音の前でエリジオン（§2） |
| Je la connais.（Paul を受けて） | Je **le** connais. | 受ける名詞の性に一致（§2） |
| Je le sais pas.（書き言葉で） | Je **ne** le sais **pas**. | ne の脱落は話し言葉のみ（§7） |
:::

## 11. 過去分詞の一致 — 先取りの3例

複合過去（第20章）を学ぶと、直接目的語代名詞に**もう1つの仕事**が生まれます。**過去分詞より前に出た直接目的語は、過去分詞を性数一致させる**のです。

:::ex 前に出た直接目的語と一致
Tu as vu Marie ? — Oui, je l'ai vue. | ウィ・ジュ・レ・ヴュ | マリを見た？ — うん、見たよ。（la → vue）
Ces photos, je les ai prises hier. | ジュ・レ・ゼ・プリーズ・イエール | この写真は昨日撮った。（les → prises）
Ta lettre ? Je l'ai bien reçue. | ジュ・レ・ビヤン・ルスュ | 君の手紙？ ちゃんと受け取ったよ。（la → reçue）
:::

vue / prises / reçue の語尾に注目してください。**le / la / les が動詞の前にあるからこそ**、過去分詞が受ける名詞の性数を映します。lui / leur（間接目的語、第18章）では起きません。

音の上でも意味があります：pris「プリ」→ prise**s**「プリーズ」のように、**-s / -t で終わる過去分詞は女性形で子音が読まれる**ので、一致が耳に聞こえます（fait → faite「フェット」、écrit → écrite「エクリット」、mis → mise「ミーズ」）。詳しくは第20章で扱いますが、「代名詞が前に出る→分詞が一致する」という連動だけ、ここで頭に置いておいてください。

## 12. 目的語を2つ取れない — 直接目的語の席は1つ

フランス語の動詞は、**直接目的語を1つしか取れません**。この制約が、いくつもの構文の形を決めています。

**（1）使役 faire の人称**（第26.5章の予告）

- Je **la** fais chanter.（彼女に歌わせる）——chanter に目的語なし → 人が**直接**目的語
- Je **lui** fais chanter une chanson.（彼女に歌を歌わせる）——une chanson が直接目的語 → 人は**間接**に押し出される

「直接目的語の席は1つ」という制約から、機械的に決まります。

**（2）二重補語の動詞**

donner / dire / montrer などは「物を人に」の2つを取りますが、**直接目的語は物のほう**で、人は必ず **à + 人**（間接）です。

- donner **un livre**（直接）**à Marie**（間接）
- → Je **le lui** donne.（第26.5章）

**（3）不定詞を目的語に取る動詞**

Je veux **partir**. の partir は vouloir の目的語です。だから第17章の規則どおり、partir の目的語代名詞は partir の前に置かれます（Je veux **le** voir.）。**動詞ごとに「自分の目的語」を持つ**——この考え方が、代名詞の位置決定の基礎です。

:::ex 目的語の席の争い
Je le regarde. | ジュ・ル・ルガルド | 私は彼を見る。（直接1つ）
Je lui montre la photo. | ジュ・リュイ・モントル・ラ・フォト | 彼に写真を見せる。（直接＝写真、間接＝彼）
Je la lui montre. | ジュ・ラ・リュイ・モントル | それを彼に見せる。（両方代名詞に）
Je le fais entrer. | ジュ・ル・フェ・ザントレ | 彼を入らせる。（entrer に目的語なし）
Je lui fais ouvrir la porte. | ジュ・リュイ・フェ・ズヴリール・ラ・ポルト | 彼にドアを開けさせる。（la porte が直接目的語）
:::

最後の2文の対比が、この節の要点です。**不定詞が目的語を持つかどうかで、人が le になるか lui になるかが決まる**——第26.5章で語順を学ぶときの土台になります。

## 1. 形 — 3人称だけが違う

| 人称 | 直接目的語（第17章） | **間接目的語** |
|---|---|---|
| 私に | me（m'） | **me**（m'） |
| 君に | te（t'） | **te**（t'） |
| 彼に・彼女に | le / la（l'） | **lui** |
| 私たちに | nous | **nous** |
| あなた（たち）に | vous | **vous** |
| 彼らに・彼女らに | les | **leur** |

:::warn 覚えるのは lui と leur の2語だけ
1・2人称（me, te, nous, vous）は直接・間接で**まったく同じ形**です。違うのは3人称だけ。

- 直接：le / la / les
- 間接：**lui** / **leur**

そして重要な点：**lui と leur には性の区別がありません**。

| | 男性 | 女性 |
|---|---|---|
| 直接目的語 | le | la |

:::

:::warn leur は所有形容詞の leur と同じ綴り

| | 例 | 見分け方 |
|---|---|---|
| 所有形容詞 | [[leur voiture\|ルール・ヴォワテュール\|彼らの車]] | **名詞の前** |
| 間接目的語代名詞 | [[Je leur parle.\|ジュ・ルール・パルル\|彼らに話す]] | **動詞の前** |

さらに決定的な違いがあります。**代名詞の leur は絶対に s が付きません。**

- 所有形容詞：leur voiture / **leurs** voitures（名詞に合わせて複数形になる）
- 代名詞：Je **leur** parle.（常に leur。× leurs）

## 2. どの動詞が à を取るか

**形より難しいのはこちらです。** 日本語の「〜に」と一致しないことが多いため、動詞ごとに覚える必要があります。

:::deep à を取る主な動詞（＝ lui / leur を使う）
**伝達・授受の動詞**が中心です。「誰かに向けて何かを渡す・伝える」という意味を持つ動詞は à を取ります。

| 動詞 | 意味 |
|---|---|
| [[parler à\|パルレ・ア]] | 〜に話す |
| [[dire à\|ディール・ア]] | 〜に言う |
| [[demander à\|ドゥマンデ・ア]] | 〜に尋ねる |
| [[répondre à\|レポンドル・ア]] | 〜に答える |
| [[téléphoner à\|テレフォネ・ア]] | 〜に電話する |
| [[écrire à\|エクリール・ア]] | 〜に手紙を書く |
| [[donner à\|ドネ・ア]] | 〜に与える |
| [[offrir à\|オフリール・ア]] | 〜に贈る |
| [[montrer à\|モントレ・ア]] | 〜に見せる |
| [[envoyer à\|アンヴォワイエ・ア]] | 〜に送る |
| [[prêter à\|プレテ・ア]] | 〜に貸す |
| [[rendre à\|ランドル・ア]] | 〜に返す |
| [[expliquer à\|エクスプリケ・ア]] | 〜に説明する |
| [[obéir à\|オベイール・ア]] | 〜に従う |
| [[ressembler à\|ルサンブレ・ア]] | 〜に似ている |
| [[plaire à\|プレール・ア]] | 〜の気に入る |
| [[sourire à\|スリール・ア]] | 〜に微笑む |

**多くは「直接目的語（モノ）＋ 間接目的語（人）」の2つを取ります。**
[[Je donne un livre à Marie.\|ジュ・ドンヌ・アン・リーヴル・ア・マリ\|私はマリに本をあげる。]]
→ モノ（un livre）＝直接目的語、人（à Marie）＝間接目的語
:::

:::warn 英語・日本語とずれる動詞
ここが実務的な落とし穴です。

| フランス語 | 目的語 | 英語 | 日本語 |
|---|---|---|---|
| **téléphoner à** | 間接 | call（直接） | 〜に電話する |
| **répondre à** | 間接 | answer（直接） | 〜に答える |
| **obéir à** | 間接 | obey（直接） | 〜に従う |
| **ressembler à** | 間接 | resemble（直接） | 〜に似ている |
| **plaire à** | 間接 | please（直接） | 〜の気に入る |
| **attendre** | 直接 | wait **for** | 〜を待つ |
| **chercher** | 直接 | look **for** | 〜を探す |
| **écouter** | 直接 | listen **to** | 〜を聞く |
| **regarder** | 直接 | look **at** | 〜を見る |
| **payer** | 直接 | pay **for** | 〜を払う |
| **demander** | 直接（モノ）+ 間接（人） | ask | 〜に〜を尋ねる |

**フランス語と英語で前置詞の有無が逆転している**ものが多くあります。英語からの類推は危険です。
:::

:::note plaire を使った「好き」の言い方
[[plaire à\|プレール・ア\|〜の気に入る]] は、主語と目的語が日本語と逆転する動詞です。

- [[Ce livre me plaît.\|ス・リーヴル・ム・プレ\|この本は私の気に入っている（＝私はこの本が好きだ）。]]
- 直訳：「この本が、私に、気に入っている」

つまり**好きな対象が主語**になります。スペイン語の gustar、イタリア語の piacere と同じ構造です。

挨拶の [[S'il vous plaît.\|スィル・ヴ・プレ\|お願いします]] も、直訳すると「もしそれがあなたの気に入るなら」です。この plaît が plaire の活用形だと分かると、成句の意味が見えてきます。
:::

## 3. 位置 — 直接目的語と同じ

規則は第17章とまったく同じです。**動詞の前**に置きます。

:::ex 位置の規則
Je lui parle. | ジュ・リュイ・パルル | 私は彼に話す。
Je ne lui parle pas. | ジュ・ヌ・リュイ・パルル・パ | 私は彼に話さない。
Je veux lui parler. | ジュ・ヴ・リュイ・パルレ | 私は彼に話したい。
Je vais lui téléphoner. | ジュ・ヴェ・リュイ・テレフォネ | 私は彼に電話するつもりだ。
Parle-lui ! | パルル・リュイ | 彼に話しかけて！
Ne lui parle pas ! | ヌ・リュイ・パルル・パ | 彼に話しかけるな！
:::

肯定命令のときだけ後ろに来る点も同じです。ただし**lui / leur は形が変わりません**（me → moi のような変化がない）。

## 4. 直接目的語との使い分けを試す

:::ex 同じ動詞で直接と間接を比べる
Je le vois. | ジュ・ル・ヴォワ | 私は彼を見る。（voir は直接）
Je lui parle. | ジュ・リュイ・パルル | 私は彼に話す。（parler à は間接）
Je l'attends. | ジュ・ラタン | 私は彼を待つ。（attendre は直接）
Je lui réponds. | ジュ・リュイ・レポン | 私は彼に答える。（répondre à は間接）
Je l'écoute. | ジュ・レクット | 私は彼の話を聞く。（écouter は直接）
Je lui téléphone. | ジュ・リュイ・テレフォヌ | 私は彼に電話する。（téléphoner à は間接）
:::

:::note 判定の手順
迷ったら、**代名詞にする前の文を作ってみる**のが確実です。

1. 名詞で言ってみる：Je parle **à Marie**.
2. à があるか確認する：**ある** → 間接目的語
3. だから代名詞は **lui**：Je **lui** parle.

一方：
1. Je vois **Marie**.（前置詞なし）
2. à が **ない** → 直接目的語
3. だから代名詞は **la**：Je **la** vois.

**代名詞を選ぶ前に、名詞のままの文を思い浮かべる** ——これが最も確実な手順です。
:::

## 5. モノを受ける à — lui ではなく y

:::warn lui / leur は「人」にしか使えない
これは重要な制限です。

- à + **人** → **lui / leur**
- à + **モノ・場所** → **y**（第26章）

:::ex 人とモノで代名詞が変わる
Je pense à Marie. → Je pense à elle. | ジュ・パンス・ア・エル | 私は彼女のことを考える。
Je pense à mon travail. → J'y pense. | ジ・パンス | 私はそれについて考える。
Je réponds à Marie. → Je lui réponds. | ジュ・リュイ・レポン | 私は彼女に答える。
Je réponds à la question. → J'y réponds. | ジ・レポン | 私はそれに答える。
:::

1行目に注意してください。**penser à + 人** では、lui ではなく**強勢形（第19章）の à elle** を使います。penser, songer, tenir, s'intéresser など一部の動詞は、人でも à + 強勢形を取るという例外があります。第19章でまとめます。
:::

## 6. 直接目的語と間接目的語を両方使う

**「誰かに何かを」**という文では、代名詞が2つ並びます。語順は第26.5章で完全に扱いますが、原則だけ示します。

:::ex 代名詞が2つ並ぶとき
Il me donne le livre. → Il me le donne. | イル・ム・ル・ドンヌ | 彼はそれを私にくれる。
Je te montre la photo. → Je te la montre. | ジュ・ト・ラ・モントル | 私はそれを君に見せる。
Je donne le livre à Marie. → Je le lui donne. | ジュ・ル・リュイ・ドンヌ | 私はそれを彼女にあげる。
:::

:::note 語順は「人称の低い順」ではない
規則はこうです。

| 1 | 2 | 3 |
|---|---|---|
| me, te, nous, vous | le, la, les | lui, leur |

つまり **1・2人称は直接／間接を問わず先頭**、そのあと**直接の le/la/les**、最後に**間接の lui/leur** という順です。

- Il **me le** donne.（me が先）
- Je **le lui** donne.（le が先、lui が後）

**me と lui が同時に現れることはありません**（× me lui）。その場合は間接目的語を à + 強勢形にして後ろに回します：[[Il me présente à lui.\|イル・ム・プレザン・タ・リュイ\|彼は私を彼に紹介する。]]

第26.5章で y, en も含めた完全な語順表を扱います。
:::

## 7. 利害の間接目的語 — フランス語らしい me / te

:::deep 「私に関わる」を表す me / te / lui — 与格の広がり
間接目的語代名詞は「与える相手」だけでなく、**その出来事が誰に関わるか・誰の利害か**を示すのにも使われます。日本語の「〜てくれる／〜ちゃった」に近い働きです。

:::ex 利害の与格
Tu me fais un café ? | チュ・ム・フェ・アン・カフェ | コーヒー淹れてくれる？
Il m'a ouvert la porte. | イル・マ・ウヴェール・ラ・ポルト | 彼はドアを開けてくれた。
On m'a volé mon portefeuille. | オン・マ・ヴォレ・モン・ポルトフイユ | 財布を盗まれた。
Elle lui a préparé le dîner. | エル・リュイ・ア・プレパレ・ル・ディネ | 彼女は彼に夕食を作ってあげた。
Ne me tombe pas malade ! | ヌ・ム・トンブ・パ・マラード | 病気にならないでよね！（親の口調）
:::

- **faire / ouvrir / préparer + à qn** … 「〜してあげる・くれる」——恩恵
- **voler / prendre + à qn** … 「〜から奪う」——**被害者が間接目的語**になる（On m'a volé …「私から盗んだ」＝盗まれた）

とくに **voler qch à qn**（人から物を盗む）は、日本語の「〜から」に引きずられて de を使いがちですが、**à** です。被害の受け身（第28章の se faire voler）と並ぶ、フランス語の「盗まれた」の言い方です。

最後の例のような **me** は「私のために・私に免じて」という気持ちだけを表す与格（心性的与格）で、話し言葉の親しい口調に現れます。訳しにくいですが、「〜しないでよね」の「よね」にあたる気分です。

**身体の部位と組む与格**も重要です（第10章で予告した形）。

- [[Je lui ai coupé les cheveux.|ジュ・リュイ・エ・クペ・レ・シュヴー|彼（彼女）の髪を切ってあげた。]]
- [[Tu me marches sur le pied !|チュ・ム・マルシュ・スュール・ル・ピエ|足踏んでるよ！]]

「彼の髪」を son cheveux とせず、**lui + 定冠詞 les cheveux** で表す——所有形容詞の代わりに与格が所有者を示します。
:::

## 8. lui / leur を含む頻出チャンク

会話の頻出表現には、lui / me / te が組み込み済みのものが多くあります。**かたまりで**覚えます。

:::ex 与格入りの定型表現
Ça te dit ? | サ・トゥ・ディ | どう、気が向く？（誘い）
Ça ne me dit rien. | サ・ヌ・ム・ディ・リヤン | あまり気が乗らない。
Ça te va ? | サ・トゥ・ヴァ | それでいい？
Ça lui ressemble bien. | サ・リュイ・ルサンブル・ビヤン | いかにも彼らしいね。
Tu me manques. | チュ・ム・マンク | 君がいなくて寂しい。
Il me reste dix euros. | イル・ム・レスト・ディ・ズーロ | あと10ユーロ残っている。
Ça m'est égal. | サ・メ・テガル | どちらでもいいよ。
Il m'arrive de me tromper. | イル・マリーヴ・ドゥ・ム・トロンペ | 間違えることもあるよ。
:::

- **Ça te dit ?**（気が向く？）は誘いの定番。dire à qn（人の気を引く）という語法から
- **Il me reste …**（私には〜が残っている）は非人称 il + 与格の型（第15章）。残金・残り時間はこれで言う
- **Ça m'est égal.**（どうでもいい・どちらでも）は être égal à qn
- **Il m'arrive de …**（〜することがある）は頻度の控えめな言い方

このグループは、**動詞の主語がモノ・非人称で、人が与格に回る**という共通構造を持っています。plaire（Ça me plaît. 気に入った）、manquer（Tu me manques.）と同じく、**日本語の「私は」がフランス語では me になる**転倒のパターンです。主語から考えると詰まるので、チャンクごと口に入れてしまうのが早道です。

## 9. 「彼女に伝えたい」を言ってみる

章のタイトルどおり、間接目的語を使った表現を並べます。

:::ex 気持ちを伝える
Je veux lui dire la vérité. | ジュ・ヴ・リュイ・ディール・ラ・ヴェリテ | 彼女に本当のことを伝えたい。
Je lui écris une lettre. | ジュ・リュイ・エクリ・ユヌ・レットル | 彼女に手紙を書く。
Je vais lui offrir des fleurs. | ジュ・ヴェ・リュイ・オフリール・デ・フルール | 彼女に花を贈るつもりだ。
Dis-lui que je l'aime. | ディ・リュイ・ク・ジュ・レーム | 私が愛していると彼女に伝えて。
Elle ne me répond jamais. | エル・ヌ・ム・レポン・ジャメ | 彼女は決して私に返事をくれない。
:::

最後から2番目の文には、**間接目的語 lui と直接目的語 l' の両方**が入っています。Dis-**lui**（彼女に言え）＋ je **l'**aime（私は彼女を愛している）。同じ人物が、動詞によって間接になったり直接になったりする——ここまで来れば、その理由が説明できるはずです。


:::ai-gen 間接目的補語人称代名詞、lui と leur、à を取る動詞

## 10. 与格動詞の語彙 — 会話の10動詞

lui / leur と組む頻度の高い動詞を、意味のまとまりで補強します。**すべて「à + 人」の型**です。

| 分野 | 動詞 |
|---|---|
| 伝える | dire, parler, raconter（物語る）, expliquer, écrire, répondre |
| 渡す・示す | donner, offrir（贈る）, montrer, rendre（返す）, prêter（貸す）, envoyer |
| 心を動かす | plaire（気に入られる）, manquer（恋しがられる）, faire plaisir（喜ばせる）, faire peur（怖がらせる） |
| 頼む・許す | demander, permettre（許す）, promettre（約束する）, conseiller（勧める）, défendre / interdire（禁じる） |

:::ex 与格動詞の実戦
Ça lui fera plaisir. | サ・リュイ・フラ・プレズィール | 彼（彼女）は喜ぶよ。
Je leur ai raconté une histoire. | ジュ・ルール・エ・ラコンテ・ユヌ・ヌ・イストワール | 彼らにお話をしてあげた。
Le médecin lui a interdit de fumer. | ル・メドサン・リュイ・ア・アンテルディ | 医者は彼にタバコを禁じた。
On lui a promis une réponse. | オン・リュイ・ア・プロミ・ユヌ・レポンス | 彼には返事すると約束してある。
:::

**faire plaisir à qn**（人を喜ばせる）は贈り物の場面の定番です：Ça te ferait plaisir ?（これ、うれしい？）。permettre / promettre / conseiller / interdire は「**à 人 de 不定詞**」の型（第7.5章）も取るので、Le médecin lui a interdit **de fumer**. のように「人には à（→lui）、行為には de」がそのまま生きています。

## 11. 間接目的語と所有 — 「誰の」を動詞側で示す

第10章と§7で触れた「身体部位の与格」を、もう少し広げて整理します。フランス語は**所有関係を所有形容詞ではなく動詞のまわりで示す**ことがあり、これが日本語話者に見えにくい構造です。

| 型 | 例 | 直訳 |
|---|---|---|
| 与格 + 定冠詞（身体） | Il **m'**a pris **la** main. | 彼は私に手を取った＝私の手を取った |
| 与格 + 定冠詞（所持品） | On **lui** a volé **son** sac. | 彼からバッグを盗んだ |
| 代名動詞 + 定冠詞 | Je **me** lave **les** mains. | 自分に手を洗う＝自分の手を洗う |
| 与格 + 感覚 | Ça **me** fait mal. | それは私に痛みを与える＝痛い |

:::ex 所有を与格で示す
Le coiffeur lui a coupé les cheveux. | ル・コワフール・リュイ・ア・クペ・レ・シュヴー | 美容師が彼（彼女）の髪を切った。
Tu m'as marché sur le pied. | チュ・マ・マルシェ・スュール・ル・ピエ | 私の足を踏んだよ。
Il s'est cassé la jambe. | イル・セ・カセ・ラ・ジャンブ | 彼は脚を折った。
Ça me fait mal au dos. | サ・ム・フェ・マ・ロ・ド | 背中が痛い。
:::

**Il s'est cassé la jambe.**（脚を折った）は代名動詞 + 定冠詞の典型です。× Il a cassé sa jambe. とは言いません——「自分の脚」は se が示しており、所有形容詞は不要だからです。

この構造のおかげで、**過去分詞の一致も変わります**。Il s'est cassé **la jambe**. は la jambe が直接目的語なので se は間接目的語となり、**cassé は一致しません**（第23章）。「所有を与格で示す」ことが、そのまま一致の判定にも効いてくる——文法の各部分がつながっている好例です。

[[avec toi\|アヴェック・トワ\|君と一緒に]] ——この **toi** が強勢形（le pronom tonique / la forme accentuée）です。

第17章・第18章で扱った目的語代名詞は、いずれも**動詞にくっついて働く弱い形**でした。単独では立てず、強調もできず、前置詞の後ろにも置けません。強勢形は**その足りない部分をすべて引き受ける形**です。

「弱形と強形が対になっている」という構造は、第12章の que / quoi でも見ました。フランス語の代名詞体系を貫く原理です。

## 1. 強勢形の一覧

| 主語 | 強勢形 |
|---|---|
| je | **moi** |
| tu | **toi** |
| il | **lui** |
| elle | **elle** |
| nous | **nous** |
| vous | **vous** |
| ils | **eux** |
| elles | **elles** |

:::ex 強勢形
moi | モワ | 私
toi | トワ | 君
lui | リュイ | 彼
elle | エル | 彼女
nous | ヌー | 私たち
vous | ヴー | あなた（たち）
eux | ウー | 彼ら
elles | エル | 彼女ら
:::

:::warn 新しく覚えるのは4語だけ
nous, vous, elle, elles は主語形と同じです。実際に覚えるのは **moi, toi, lui, eux** の4語。

ただし **lui** には注意が必要です。第18章の間接目的語代名詞 lui と綴りが同じですが、**別のもの**です。

| | 例 | 位置 |
|---|---|---|
| 間接目的語の lui（男女共通） | [[Je lui parle.\|ジュ・リュイ・パルル\|彼／彼女に話す]] | 動詞の前 |
| 強勢形の lui（男性のみ） | [[avec lui\|アヴェック・リュイ\|彼と一緒に]] | 前置詞の後など |

**強勢形の lui は男性専用**で、女性は elle です。間接目的語の lui が男女共通だったのとは逆なので、混同しやすい箇所です。

そして **eux**（彼ら）は強勢形にしかない形です。
:::

## 2. 強勢形を使う7つの場面

**「動詞にくっついていないとき」**が共通条件です。

### （1）前置詞の後

最も多い用法です。

:::ex 前置詞の後
avec moi | アヴェック・モワ | 私と一緒に
pour toi | プール・トワ | 君のために
chez lui | シェ・リュイ | 彼の家で
sans elle | サン・ゼル | 彼女なしで
entre nous | アントル・ヌー | 私たちの間で
devant eux | ドゥヴァン・トゥー | 彼らの前で
:::

:::warn 前置詞の後に主語形や目的語形は置けない
- × avec je → ○ avec **moi**
- × pour te → ○ pour **toi**

第12章の「前置詞の後ろは que ではなく quoi」とまったく同じ原理です。**前置詞の後は強い位置なので、強い形が要る。**
:::

### （2）強調

主語や目的語を強調するとき、強勢形を文頭・文末に置きます。

:::ex 強調
Moi, je suis japonais. | モワ・ジュ・スュイ・ジャポネ | 私はね、日本人なんだ。
Lui, il ne comprend rien. | リュイ・イル・ヌ・コンプラン・リアン | あいつは何も分かってない。
Je le connais, moi. | ジュ・ル・コネ・モワ | 私は彼を知っているよ。
:::

:::note 主語代名詞は残す
Moi, je suis … のように、**強勢形を置いても主語代名詞 je は省略しません**。強勢形は主語の代わりではなく、**主語に添える強調**だからです。

× Moi suis japonais.
○ Moi, **je** suis japonais.

例外は「主語が強勢形だけで成立する場合」——次の（3）（4）です。
:::

### （3）単独で使うとき

動詞がない返答では、弱形は使えません。

:::ex 単独で
Qui est là ? — Moi. | キ・エ・ラ・モワ | 誰？ — 私。
Qui veut du café ? — Moi ! | キ・ヴ・デュ・カフェ・モワ | コーヒー欲しい人？ — はい！
Elle est plus grande que toi. | エ・レ・プリュ・グランド・ク・トワ | 彼女は君より背が高い。
:::

### （4）比較の que の後（第14章）

:::ex 比較の後
Il est plus grand que moi. | イ・レ・プリュ・グラン・ク・モワ | 彼は私より背が高い。
Elle travaille autant que lui. | エル・トラヴァイユ・オタン・ク・リュイ | 彼女は彼と同じくらい働く。
:::

### （5）et / ou でつなぐとき

:::ex 並列
Toi et moi | トワ・エ・モワ | 君と私
Lui ou elle ? | リュイ・ウー・エル | 彼それとも彼女？
Marie et moi, nous sommes amis. | マリ・エ・モワ・ヌー・ソム・ザミ | マリと私は友人です。
:::

:::note 並列すると主語代名詞でまとめ直す
Marie et moi の後ろに **nous** が来ている点に注目してください。並列された主語は、**それをまとめる主語代名詞**で受け直すのが標準的です。

- Marie et moi → **nous**（1人称が含まれるので nous）
- Marie et toi → **vous**（2人称が含まれるので vous）
- Marie et lui → **ils**

[[Toi et moi, nous partons demain.\|トワ・エ・モワ・ヌー・パルトン・ドゥマン\|君と私は明日出発する。]]

話し言葉では受け直しを省くこともありますが、書き言葉では入れます。
:::

### （6）c'est の後

:::ex c'est + 強勢形
C'est moi. | セ・モワ | 私です。
C'est toi qui as raison. | セ・トワ・キ・ア・レゾン | 正しいのは君だ。
Ce sont eux. | ス・ソン・トゥー | 彼らです。
:::

:::warn 3人称複数だけ ce sont
C'est moi / toi / lui / elle / nous / vous …と続きますが、**eux / elles だけは ce sont** を使います（書き言葉）。

- C'est **moi**.
- **Ce sont** eux.

これは第4章で見た「複数には ce sont」の規則がそのまま効いているためです。話し言葉では C'est eux. も使われます。
:::

### （7）même を付けて「自分自身」

:::ex 〜自身
moi-même | モワ・メーム | 私自身
toi-même | トワ・メーム | 君自身
lui-même | リュイ・メーム | 彼自身
elle-même | エル・メーム | 彼女自身
nous-mêmes | ヌー・メーム | 私たち自身
vous-même(s) | ヴー・メーム | あなた（たち）自身
eux-mêmes | ウー・メーム | 彼ら自身
:::

**ハイフンでつなぎ、複数では même に s が付きます**（nous-mêmes, eux-mêmes）。vous-même は相手が1人なら s なし、複数なら s ありです。

[[Je l'ai fait moi-même.\|ジュ・レ・フェ・モワ・メーム\|私はそれを自分でやった。]]

## 3. penser à + 強勢形 — lui を使わない動詞

:::deep à を取るのに間接目的語代名詞が使えない動詞
第18章で予告した例外です。**一部の動詞は、à + 人 であっても lui / leur を使えず、à + 強勢形にします。**

| 動詞 | 意味 |
|---|---|
| [[penser à\|パンセ・ア]] | 〜のことを考える |
| [[songer à\|ソンジェ・ア]] | 〜に思いをはせる |
| [[tenir à\|トゥニール・ア]] | 〜を大切に思う |
| [[s'intéresser à\|サンテレセ・ア]] | 〜に興味を持つ |
| [[faire attention à\|フェール・アタンスィオン・ア]] | 〜に注意する |
| [[s'habituer à\|サビテュエ・ア]] | 〜に慣れる |
| [[s'adresser à\|サドレセ・ア]] | 〜に話しかける |
| [[renoncer à\|ルノンセ・ア]] | 〜を諦める |

:::ex 例外の動詞
Je pense à Marie. → Je pense à elle. | ジュ・パンス・ア・エル | 私は彼女のことを考える。
Je tiens à toi. | ジュ・ティアン・ザ・トワ | 私は君を大切に思っている。
Elle s'intéresse à lui. | エル・サンテレス・ア・リュイ | 彼女は彼に興味がある。
:::

× Je lui pense. とは言えません。

**なぜこの例外があるのか。** これらの動詞の à は、**「相手に向けて何かを渡す」タイプの à ではない**からです。第18章で見た donner à / parler à は「相手に届ける」動詞ですが、penser à / tenir à は「〜に向かう心の動き」であって、相手は受け手ではありません。この意味の違いが、代名詞の形の違いとして表れています。

**代名動詞（se + 動詞、第23章）はすべてこの型**になる、と覚えておくと整理しやすくなります（s'intéresser, s'habituer, s'adresser…）。
:::

## 4. 強勢形と目的語代名詞の対応表

:::note 3系列を並べて確認する
| | 主語 | 直接目的語 | 間接目的語 | 強勢形 |
|---|---|---|---|---|
| 1単 | je | me | me | **moi** |
| 2単 | tu | te | te | **toi** |
| 3単男 | il | le | lui | **lui** |
| 3単女 | elle | la | lui | **elle** |
| 1複 | nous | nous | nous | nous |
| 2複 | vous | vous | vous | vous |
| 3複男 | ils | les | leur | **eux** |
| 3複女 | elles | les | leur | **elles** |

**縦に読むと、3人称だけが4つとも違う形**になっているのが分かります。フランス語の代名詞で難しいのは、結局この3人称の区別に集約されます。

- il / le / lui / lui
- elle / la / lui / elle
- ils / les / leur / eux
- elles / les / leur / elles

**lui が2箇所に現れる**（3単男の間接、3単男の強勢）ことと、**女性の間接目的語も lui である**ことが、混乱の主な原因です。
:::

## 5. 肯定命令での me → moi（復習）

第16章で扱った現象を、いまなら説明できます。

:::ex 肯定命令の moi
Regarde-moi ! | ルガルド・モワ | 私を見て！
Ne me regarde pas ! | ヌ・ム・ルガルド・パ | 私を見ないで！
Donne-moi ça. | ドンヌ・モワ・サ | それをちょうだい。
:::

**肯定命令では代名詞が動詞の後ろに来る＝強い位置になる**ので、弱形 me が強形 moi に変わります。否定命令では動詞の前（弱い位置）なので me のままです。

これは強勢形の原理そのものです。**位置が形を決めている。**

## 6. -même と soi — 強勢形の広がり

:::deep 強勢形 + -même（〜自身）
強勢形に **-même** を付けると「〜自身」を表します（第10.5章の même の一用法）。

:::ex -même
Je l'ai fait moi-même. | ジュ・レ・フェ・モワ・メーム | 自分でやりました。
Il l'a dit lui-même. | イル・ラ・ディ・リュイ・メーム | 彼自身がそう言った。
Faites-le vous-mêmes. | フェット・ル・ヴー・メーム | 自分たちでやりなさい。
:::

vous が敬称単数なら vous-même（s なし）、複数なら vous-mêmes。**le fait maison / fait main**（自家製・手作り）と並んで、moi-même は「自分で」を強調する日常表現です。

**soi — 不定の主語を受ける強勢形**

主語が on / chacun / tout le monde など**不特定**のとき、強勢形は lui / elle ではなく **soi** になります。

:::ex soi
Chacun pour soi. | シャカン・プール・ソワ | 各自は自分のために（自己責任）。
On rentre chez soi. | オン・ラントル・シェ・ソワ | 人はわが家へ帰る。
Il faut avoir confiance en soi. | イル・フォ・アヴォワール・コンフィヤンス・アン・ソワ | 自分に自信を持たなければ。
:::

**chez soi**（自分の家）、**en soi**（それ自体）、**la confiance en soi**（自信）は soi の定型です。特定の人が主語なら chez lui / chez elle に戻ります。

:::ex 会話の相づちとしての強勢形
Moi aussi. | モワ・オスィ | 私も。
Moi non plus. | モワ・ノン・プリュ | 私も（〜ない）。
Pas moi. | パ・モワ | 私は違う。
Moi si. | モワ・スィ | 私はそうだよ。（相手の否定に反対）
Et toi ? | エ・トワ | で、君は？
:::

この5つは**動詞なしで文になる**強勢形の代表です。J'aime le café. — **Moi aussi.** ／ Je n'aime pas ça. — **Moi non plus.**（同意）／ **Moi si.**（私は好き）。相づちの既定セットとして丸ごと覚えてください。
:::

## 7. 前置詞 + 強勢形の頻出セット

会話で毎日使う「前置詞 + 強勢形」の組み合わせを、場面ごとにまとめます。

:::ex 頻出の前置詞 + 強勢形
Tu viens avec moi ? | チュ・ヴィヤン・アヴェック・モワ | 一緒に来る？
C'est pour toi. | セ・プール・トワ | これ、君に（あげる）。
On va chez moi ? | オン・ヴァ・シェ・モワ | うちに行く？
Assieds-toi à côté de moi. | アスィエ・トワ・ア・コテ・ドゥ・モワ | 隣に座って。
Je compte sur toi. | ジュ・コント・スュール・トワ | 頼りにしてるよ。
Il est fâché contre moi. | イ・レ・ファシェ・コントル・モワ | 彼は私に怒っている。
Sans toi, je n'y arriverais pas. | サン・トワ・ジュ・ニ・アリヴレ・パ | 君なしではやれないよ。
D'après elle, c'est vrai. | ダプレ・エル・セ・ヴレ | 彼女によれば本当らしい。
:::

**Je compte sur toi.**（頼りにしてる）、**C'est pour toi.**（君にだよ）、**chez moi / chez toi**（うち／君の家）は丸ごと覚える価値のある定型です。動詞が要求する前置詞（compter **sur**、être fâché **contre**）は第7.5章の語法がそのまま生きています。

## 8. C'est moi. — 電話と玄関の強勢形

:::deep 「私です」の言い方
強勢形が単独で活躍する代表場面が、**電話と玄関**です。

:::ex 電話で
Allô, c'est Marie. | アロ・セ・マリ | もしもし、マリです。
C'est de la part de qui ? | セ・ドゥ・ラ・パール・ドゥ・キ | どちら様ですか？（取り次ぎ）
C'est moi ! | セ・モワ | 私だよ！
C'est toi, Paul ? | セ・トワ・ポール | ポール、君なの？
Je te le passe. | ジュ・トゥ・ル・パス | （電話を）代わるね。
:::

英語の It's me. と同じく、**「私です」は C'est moi.**（× C'est je）。玄関のインターホンでも Qui est-ce ? — C'est moi ! が定番のやり取りです。

**所有の C'est à moi.**（私のです）も強勢形の仕事です（第7.5章の à）。

- [[C'est à qui ?|セ・タ・キ|これ誰の？]] — [[C'est à moi.|セ・タ・モワ|私のです。]]
- [[À qui le tour ?|ア・キ・ル・トゥール|次はどなたの番？]] — [[À moi !|ア・モワ|私です！]]

**C'est moi**（私＝人物の特定）と **C'est à moi**（私の＝所有）を混同しないでください。à の有無で意味が変わります。順番待ちの **À moi ! / À toi !**（私の番！／君の番！）はゲーム・遊びの必須表現です。
:::

## 9. 「あなたと一緒に」を言ってみる

:::ex 強勢形を使った表現
Je veux rester avec toi. | ジュ・ヴ・レステ・アヴェック・トワ | 君と一緒にいたい。
C'est pour toi. | セ・プール・トワ | これは君のためだ。
Je pense souvent à toi. | ジュ・パンス・スヴァン・タ・トワ | 君のことをよく考える。
Viens chez moi. | ヴィアン・シェ・モワ | 私の家においで。
Toi et moi, pour toujours. | トワ・エ・モワ・プール・トゥジュール | 君と私、永遠に。
Il n'y a que toi. | イル・ニヤ・ク・トワ | 君しかいない。
:::

最後の文は第5章の **ne … que**（〜しかない）です。否定ではなく制限なので、「君だけがいる」という意味になります。

## 10. 比較・同格・単独 — 強勢形の残りの持ち場

**（1）比較の que の後**（第14章）

- [[Il est plus grand que moi.|イ・レ・プリュ・グラン・ク・モワ|彼は私より背が高い。]]
- [[Elle court plus vite que lui.|エル・クール・プリュ・ヴィット・ク・リュイ|彼女は彼より速く走る。]]

**（2）同格 — 主語を明示し直す**

- [[Nous, les Japonais, on mange du riz tous les jours.|ヌー・レ・ジャポネ|私たち日本人は毎日米を食べます。]]
- [[Vous deux, venez ici.|ヴー・ドゥ・ヴネ・ジスィ|君たち2人、こっちへ来て。]]

**moi / toi / nous + 名詞・数詞**で「〜である私たち・君たち」と絞り込めます。nous deux（私たち2人）、eux trois（彼ら3人）という**強勢形 + 数詞**も便利な形です。

**（3）動詞のない文**

- [[Qui veut du café ? — Moi !|モワ|コーヒー欲しい人？ — はい！]]
- [[Toi, tais-toi.|トワ・テ・トワ|君は黙ってて。]]
- [[Heureusement pour eux.|ウルーズマン・プール・ウー|彼らにとっては幸いなことに。]]

挙手の「はい！」は **Moi !** の一語です。命令の前に置く **Toi, …** は強い注意の口調になります。

まとめると、強勢形の持ち場は「**動詞の活用が支配しない場所すべて**」——前置詞の後、c'est の後、比較の後、同格、単独。弱形（je / me …）が動詞に寄生する形なのに対し、強勢形は**自立できる唯一の人称代名詞**です。

## 11. 弱形と強勢形 — なぜ2系列あるのか

主語の je と強勢形の moi が別語であるのは、フランス語史の帰結です。仕組みを知ると、位置の規則が腑に落ちます。

:::deep 接語（clitique）という考え方
je / me / te / le / lui などは**接語（le clitique）**と呼ばれ、**単独では発音できない**語です。必ず動詞にくっついて1つの音のかたまりを作ります。

- **je le vois**「ジュルヴォワ」——3語だが音は1かたまり
- 途中に何も割り込めない：× je souvent le vois

一方 **moi / toi / lui / eux** は**自立語**で、単独で立てます。

- Qui veut du café ? — **Moi.**（1語で文になる）
- **Moi**, je pense que …（動詞から離れて置ける）

この違いから、**位置の規則がすべて導かれます**。

| 場面 | 使う形 | 理由 |
|---|---|---|
| 動詞に直接付く | **弱形**（je, me, le, lui） | 接語なので動詞が必要 |
| 前置詞の後 | **強勢形** | 前置詞の後ろは自立した位置 |
| c'est の後 | **強勢形** | 属詞は強い位置 |
| 比較の que の後 | **強勢形** | 動詞から離れている |
| 単独・同格 | **強勢形** | 自立が必要 |
| 肯定命令の後 | **強勢形**（moi, toi） | 動詞の後ろは強い位置 |

**「動詞に寄りかかれるかどうか」——この一点で全部決まります。** 肯定命令で me が moi になるのも、動詞の後ろが強い位置だからでした（第16章）。ラテン語には接語と自立語の区別がなく、フランス語が独自に発達させた仕組みです。

英語には接語がないため（I / me は両方自立語）、この感覚は英語からは持ち込めません。**フランス語特有の構造**として理解してください。
:::

## 3. 助動詞は avoir か être か

**大多数の動詞は avoir を取ります。** être を取るのは限られた動詞だけです。

:::warn être を助動詞に取る動詞
2つのグループがあります。

**（1）移動・状態の変化を表す自動詞（14語）**

| 動詞 | 意味 | 対の動詞 | 意味 |
|---|---|---|---|
| aller | 行く | venir | 来る |
| arriver | 着く | partir | 出発する |
| entrer | 入る | sortir | 出る |
| monter | 上がる | descendre | 降りる |
| naître | 生まれる | mourir | 死ぬ |
| rester | とどまる | tomber | 落ちる |
| retourner | 戻る | passer | 通る |

**多くが対になっている**のが特徴です。フランスの学校では、これらの動詞で作った家の絵（la maison d'être）を使って覚えさせる伝統があります。

これらに接頭辞が付いた派生語も être を取ります：revenir, devenir, rentrer, repartir, remonter…

**（2）代名動詞（第23章）**

se + 動詞の形はすべて être を取ります。[[Je me suis levé.\|ジュ・ム・スュイ・ルヴェ\|私は起きた。]]
:::

:::conj aller passeCompose

:::warn être を取ると過去分詞が主語に一致する
これが être 動詞の決定的な特徴です。

| 主語 | 形 |
|---|---|
| Il est | all**é** |
| Elle est | all**ée** |
| Ils sont | all**és** |
| Elles sont | all**ées** |

:::ex 主語との性数一致
Il est allé au cinéma. | イ・レ・タレ・オ・スィネマ | 彼は映画館に行った。
Elle est allée au cinéma. | エ・レ・タレ・オ・スィネマ | 彼女は映画館に行った。
Ils sont partis. | イル・ソン・パルティ | 彼らは出発した。
Elles sont parties. | エル・ソン・パルティ | 彼女らは出発した。
:::

**allé と allée は発音が同じ**です。音では区別できず、**書くときだけ問題になる**規則です。

ただし mort（mourir）のように子音で終わる過去分詞では、女性形で音が変わります：[[Elle est morte.\|エ・レ・モルト\|彼女は死んだ。]]（t を発音する）。
:::

:::adv 6つの動詞は両方の助動詞を取る
**monter, descendre, sortir, entrer, rentrer, passer, retourner** は、**目的語を取るかどうか**で助動詞が変わります。

| | 助動詞 | 意味 |
|---|---|---|
| 自動詞（目的語なし） | **être** | [[Je suis sorti.\|ジュ・スュイ・ソルティ\|私は外出した。]] |
| 他動詞（目的語あり） | **avoir** | [[J'ai sorti la voiture.\|ジェ・ソルティ・ラ・ヴォワテュール\|私は車を出した。]] |

- [[Elle est montée.\|エ・レ・モンテ\|彼女は上がった。]]（自動詞 → être、一致する）
- [[Elle a monté les valises.\|エラ・モンテ・レ・ヴァリーズ\|彼女はスーツケースを上げた。]]（他動詞 → avoir、一致しない）

**目的語があるかどうかを見る** ——これが判定基準です。
:::

## 4. 過去分詞の性数一致 — 全規則

:::deep フランス語文法で最も入り組んだ規則
過去分詞が一致するかどうかは、**助動詞が何か**と**直接目的語がどこにあるか**で決まります。3つの場合に分かれます。

### 規則①：être + 過去分詞 → 主語に一致する

[[Elle est allée.\|エ・レ・タレ\|彼女は行った。]]、[[Ils sont venus.\|イル・ソン・ヴニュ\|彼らは来た。]]

これは前節で見たとおりです。

### 規則②：avoir + 過去分詞 → 原則として一致しない

[[Elle a chanté.\|エラ・シャンテ\|彼女は歌った。]]（× chantée）
[[Ils ont mangé.\|イル・ゾン・マンジェ\|彼らは食べた。]]（× mangés）

**主語が女性でも複数でも、過去分詞は変わりません。**

### 規則③：avoir + 直接目的語が動詞より前 → その直接目的語に一致する

**ここが最大の難所です。**

avoir を助動詞に取る場合でも、**直接目的語が過去分詞より前に置かれているとき**は、その直接目的語に一致します。

:::ex 直接目的語が前に出ると一致する
J'ai vu Marie. | ジェ・ヴュ・マリ | 私はマリを見た。（目的語が後ろ → 一致しない）
Je l'ai vue. | ジュ・レ・ヴュ | 私は彼女を見た。（l' が前 → vue と一致）
Les livres que j'ai achetés. | レ・リーヴル・ク・ジェ・アシュテ | 私が買った本。（que が前 → achetés）
Quelle robe as-tu choisie ? | ケル・ローブ・ア・テュ・ショワズィ | どのドレスを選んだの？（quelle robe が前 → choisie）
:::

**直接目的語が前に出るのは、次の3つの場合だけです。**

| 場合 | 例 |
|---|---|
| **① 目的語代名詞**（第17章） | Je **l'**ai vu**e**. |
| **② 関係代名詞 que**（第21章） | les livres **que** j'ai achet**és** |
| **③ 疑問形容詞 quel + 名詞**（第10章） | **Quelle robe** as-tu chois**ie** ? |

**この3つ以外では一致しません。**

### 一致しない場合を確認する

**間接目的語が前にあっても一致しません。**

- [[Je lui ai parlé.\|ジュ・リュイ・エ・パルレ\|私は彼女に話した。]]（× parlée）
- lui は**間接**目的語なので、前にあっても一致の対象にならない

**だから第17章・第18章の直接／間接の区別が、ここで効いてきます。** 「téléphoner à は間接だから一致しない」「attendre は直接だから一致する」——代名詞の形を選ぶためだけでなく、過去分詞の形を決めるためにも必要な区別なのです。

:::ex 直接と間接で一致が変わる
Je l'ai attendue. | ジュ・レ・アタンデュ | 私は彼女を待った。（直接 → 一致する）
Je lui ai téléphoné. | ジュ・リュイ・エ・テレフォネ | 私は彼女に電話した。（間接 → 一致しない）
:::

### なぜこんな規則があるのか

歴史的な理由があります。もともと **J'ai vu Marie.** は「私はマリを見られた状態で持っている」という構造でした（avoir は「持つ」）。この段階では、過去分詞は目的語 Marie を修飾する**形容詞**だったので、当然一致していました。

やがて avoir + 過去分詞が「完了」を表す1つのかたまりになると、一致の意識が薄れます。しかし**目的語が前に出ている場合だけ**、古い一致が化石として残った——これが規則③の正体です。

**話し言葉ではほとんど聞こえません**（vu と vue は同音）。実質的に**書くときだけの規則**です。ただしフランス語圏では書き取り（la dictée）で必ず問われる、教養の指標とされる規則でもあります。
:::

:::note 一致するかどうかの判定手順
1. 助動詞は **être** か？ → **主語に一致**して終わり
2. 助動詞は **avoir** → 直接目的語が過去分詞より**前**にあるか？
   - ある → その直接目的語に**一致**
   - ない → **一致しない**
3. 前にあるのが**間接**目的語なら → **一致しない**

この3段階で必ず判定できます。
:::

## 5. 否定・疑問・代名詞との組み合わせ

### 否定 — 助動詞を挟む

第5章の原則どおり、**ne … pas が挟むのは活用した動詞**です。複合過去で活用しているのは助動詞なので、助動詞を挟みます。

:::ex 否定の複合過去
Je n'ai pas chanté. | ジュ・ネ・パ・シャンテ | 私は歌わなかった。
Il n'est pas venu. | イル・ネ・パ・ヴニュ | 彼は来なかった。
Nous n'avons rien vu. | ヌー・ナヴォン・リアン・ヴュ | 私たちは何も見なかった。
Je n'ai jamais compris. | ジュ・ネ・ジャメ・コンプリ | 私は決して理解しなかった。
:::

:::warn personne だけは後ろに来る
否定語の多くは助動詞と過去分詞の間に入りますが、**personne は過去分詞の後ろ**に置かれます。

- [[Je n'ai rien vu.\|ジュ・ネ・リアン・ヴュ\|何も見なかった。]]（rien は間）
- [[Je n'ai vu personne.\|ジュ・ネ・ヴュ・ペルソンヌ\|誰も見なかった。]]（personne は後ろ）

personne はもともと名詞（人）なので、目的語の位置に留まる——第5章で見た語源が、ここでも効いています。
:::

### 疑問 — 助動詞を倒置する

:::ex 疑問の複合過去
As-tu chanté ? | ア・テュ・シャンテ | 君は歌った？
Est-elle venue ? | エ・テル・ヴニュ | 彼女は来た？
Avez-vous compris ? | ザヴェ・ヴー・コンプリ | 分かりましたか？
Qu'est-ce que tu as fait ? | ケ・ス・ク・テュ・ア・フェ | 何をしたの？
:::

倒置するのは**助動詞と主語**です。過去分詞は動きません。

### 代名詞 — 助動詞の前

:::ex 代名詞つきの複合過去
Je l'ai vu. | ジュ・レ・ヴュ | 私はそれを見た。
Je lui ai parlé. | ジュ・リュイ・エ・パルレ | 私は彼に話した。
Je ne l'ai pas vu. | ジュ・ヌ・レ・パ・ヴュ | 私はそれを見なかった。
Il me l'a donné. | イル・ム・ラ・ドネ | 彼はそれを私にくれた。
:::

**代名詞 → 助動詞 → 過去分詞**の順です。× J'ai le vu. とはなりません。

## 6. 会話は複合過去で回る — 週末の話し方

:::note 「週末どうだった？」への答え方
会話で最も複合過去を使うのは、**した事の報告**です。型で覚えます。

:::ex 週末の報告
Tu as passé un bon week-end ? | チュ・ア・パセ・アン・ボン・ウィケンド | いい週末だった？
Oui, super. Samedi, on est allés au marché. | ウィ・スュペール・サムディ・オ・ネ・タレ・オ・マルシェ | うん、最高。土曜は市場に行って。
J'ai vu des amis, on a bien mangé. | ジェ・ヴュ・デ・ザミ・オ・ナ・ビヤン・マンジェ | 友達に会って、おいしいもの食べた。
Et dimanche, je n'ai rien fait. | エ・ディマンシュ・ジュ・ネ・リヤン・フェ | 日曜は何もしなかった。
Ça m'a fait du bien. | サ・マ・フェ・デュ・ビヤン | いい息抜きになったよ。
:::

**Tu as passé un bon week-end ?** は月曜の挨拶の定番、**Je n'ai rien fait.**（何もしなかった）と **Ça m'a fait du bien.**（気分がよくなった）はその返答の常連です。

出来事を並べるときの接続語も一緒に：**d'abord**（まず）→ **ensuite / puis**（それから）→ **après**（その後）→ **enfin**（最後に）。複合過去の文をこの4語でつなぐと、報告らしい流れになります。
:::

## 7. 複合過去の3つの意味

:::deep 複合過去は「過去」だけを表すのではない
名前のとおり、この時制は本来**完了（le parfait）**を表します。3つの用法があります。

**（1）完了した出来事**（最も多い）
[[J'ai mangé.\|ジェ・マンジェ\|私は食べた。]]

**（2）現在との関わりを持つ完了**（英語の現在完了に近い）
[[J'ai fini !\|ジェ・フィニ\|終わった！（だから今は自由だ）]]
[[Il est parti.\|イ・レ・パルティ\|彼は行ってしまった。（だから今ここにいない）]]

**（3）近い未来の完了**（口語）
[[J'ai fini dans cinq minutes.\|ジェ・フィニ・ダン・サン・ミニュット\|5分で終わります。]]

英語では past simple（I ate）と present perfect（I have eaten）が区別されますが、**フランス語の複合過去はその両方をカバーします**。だから英語話者は「なぜ yesterday と一緒に have eaten の形が使えるのか」と戸惑いますが、フランス語ではこれが標準です。

[[J'ai mangé hier.\|ジェ・マンジェ・イエール\|私は昨日食べた。]]（英語なら × I have eaten yesterday.）
:::

:::adv 複合過去は書き言葉では単純過去に置き換わる
文学作品や歴史記述では、完了した出来事を**単純過去**（第20.5章）で表します。

- 話し言葉・手紙・新聞：[[Il est arrivé.\|イ・レ・タリヴェ\|彼は到着した。]]（複合過去）
- 小説・歴史書：[[Il arriva.\|イ・ラリヴァ\|彼は到着した。]]（単純過去）

つまりフランス語の過去には、**話し言葉の体系と書き言葉の体系が並存している**ことになります。次章でその書き言葉のほうを扱います。
:::

## 10. 過去分詞の音 — é / i / u の3つの母音

過去分詞は綴りより先に**音**で整理すると楽になります。語末は実質3つの母音しかありません。

| 音 | 綴り | 動詞 |
|---|---|---|
| **[e]「エ」** | -é | 第1群すべて（chanté, allé, mangé） |
| **[i]「イ」** | -i / -is / -it | 第2群（fini）+ prendre 系（pris）、dire（dit）、écrire（écrit） |
| **[y]「ユ」** | -u | 第3群の多く（vu, lu, bu, eu, su, pu, venu, connu, reçu） |

例外的な子音持ちは少数です：**fait**（faire）、**mort**（mourir）、**né**（naître）、**ouvert**（ouvrir）、**offert**（offrir）、**peint**（peindre）。

**-is / -it / -ert の分詞は女性形で子音が現れます**：pris → prise「プリーズ」、écrit → écrite「エクリット」、ouvert → ouverte「ウヴェルト」。つまり**一致が耳で聞こえる**動詞です。逆に -é / -u の分詞は一致しても音が変わりません（allée も「アレ」のまま）。

聞き取りでは「**アヴェ・フィニ**（avait fini）」「**ア・ヴュ**（a vu）」のように、**助動詞 + 短い母音**のかたまりが複合時制の音形です。会話の過去はこの音形で飛んでくるので、「エ／イ／ユ」で終わる短い語が助動詞の後に来たら過去分詞、と反応できるようにしておきましょう。

## 11. 複合過去と現在完了 — 英語との対応のずれ

複合過去は形の上では英語の現在完了（have + 過去分詞）と同じですが、**担う仕事の範囲が違います**。

| 意味 | 英語 | フランス語 |
|---|---|---|
| 完了・経験（現在との関わり） | I **have finished**. | J'**ai fini**. |
| 単なる過去の出来事 | I **finished** yesterday. | J'**ai fini** hier. |
| 過去の習慣・状態 | I **used to** live … | J'**habitais** …（半過去） |

**フランス語の複合過去は、英語の現在完了と単純過去の両方を引き受けます**。だから hier（昨日）のような過去の時点を示す語と平気で共起します。

- ○ J'ai fini **hier**.（昨日終えた）
- 英 × I have finished yesterday. → I finished yesterday.

英語学習の経験がある人ほど「完了形に過去の時点は付けられない」と考えがちですが、**フランス語にはその制約がありません**。

:::warn 「〜したことがある」の言い方
経験を表すときは、複合過去に副詞を添えます。

- [[J'ai déjà vu ce film.|ジェ・デジャ・ヴュ・ス・フィルム|この映画はもう見た。]]
- [[Je n'ai jamais mangé d'escargots.|ジュ・ネ・ジャメ・マンジェ・デスカルゴ|カタツムリは食べたことがない。]]
- [[Tu es déjà allé en France ?|チュ・エ・デジャ・アレ・アン・フランス|フランスに行ったことある？]]

**déjà**（すでに・〜したことがある）と **ne … jamais**（一度も〜ない）が経験の目印です。英語の ever / never にあたります。

また「〜して以来」は **depuis que**、「〜回」は **fois** で数えます：Je l'ai vu **trois fois**.（3回会った）。回数が言えると、複合過去の「完了した出来事」という性格がはっきりします。
:::

**結論**：フランス語の過去は「複合過去（出来事）」と「半過去（状態・習慣）」の2本立てで、英語の3本立て（現在完了・単純過去・used to）とは切り分け方が違います。**英語の時制を経由せず、フランス語の2分法で直接考える**のが習得の近道です。

## 1. 何のためにあるのか

複合過去との違いは、**時間の位置ではなく、語り手の立ち位置**です。

| | 複合過去 | 単純過去 |
|---|---|---|
| 使う場面 | 会話・手紙・メール・新聞の論説 | 小説・歴史・伝記・童話・報道記事 |
| 語り手 | 現在にいて、そこから過去を振り返る | 物語の中にいて、出来事を順に語る |
| 現在との関わり | ある（「〜してしまった、だから今…」） | ない（完全に閉じた過去） |

:::ex 同じ内容を2つの時制で
Il est arrivé à Paris. | イ・レ・タリヴェ・ア・パリ | 彼はパリに着いた。（複合過去・会話）
Il arriva à Paris. | イ・ラリヴァ・ア・パリ | 彼はパリに着いた。（単純過去・物語）
:::

日本語ではどちらも「着いた」ですが、フランス語では**文体そのものが違います**。単純過去を会話で使うと、芝居がかった、あるいは古風な印象になります。

:::note 童話の書き出し
[[Il était une fois une petite fille qui s'appelait …\|イ・レ・チュヌ・フォワ\|むかしむかし、〜という名の少女がいました…]]

童話の定型句です。était は半過去（第27章）ですが、この後に続く出来事は次々と単純過去で語られます。**半過去で舞台を設定し、単純過去で出来事を進める** ——これがフランス語の物語文の基本構造です。第27章でこの対立を詳しく扱います。
:::

## 2. 語尾は3つの型しかない

単純過去の語尾は、**-a 型 / -i 型 / -u 型**の3つだけです。

| | -a 型 | -i 型 | -u 型 |
|---|---|---|---|
| je | -ai | -is | -us |
| tu | -as | -is | -us |
| il | -a | -it | -ut |
| nous | -âmes | -îmes | -ûmes |
| vous | -âtes | -îtes | -ûtes |
| ils | -èrent | -irent | -urent |

:::note 見分け方の目安
- **-a 型** … 第1群（-er 動詞）**すべて**
- **-i 型** … 第2群（-ir）と、多くの第3群
- **-u 型** … 一部の第3群（過去分詞が -u になる動詞と重なることが多い）

**過去分詞と単純過去の型には相関があります。**

| 動詞 | 過去分詞 | 単純過去 |
|---|---|---|
| boire | b**u** | je b**us**（-u 型） |
| lire | l**u** | je l**us**（-u 型） |
| prendre | pr**is** | je pr**is**（-i 型） |
| mettre | m**is** | je m**is**（-i 型） |
| écrire | écr**it** | j'écriv**is**（-i 型） |

完全に一致するわけではありませんが、**過去分詞を知っていれば型を推測できる**ことが多くあります。
:::

## 5. 読むときの実務

:::note 3人称だけ読めれば足りる
物語は**3人称で語られる**のが普通です。したがって実務的には、**il / ils の形**だけ認識できれば読み進められます。

| 型 | il | ils |
|---|---|---|
| -a 型 | chant**a** | chant**èrent** |
| -i 型 | fin**it** | fin**irent** |
| -u 型 | b**ut** | b**urent** |
| -in 型 | v**int** | v**inrent** |

**-a / -it / -ut / -int で終わる短い形**が来たら単純過去、と反応できれば十分です。
:::

:::adv 半過去との併用が物語の骨格
物語文では、単純過去と半過去（第27章）が役割分担します。

- **半過去** … 背景・状況・continuing な状態を描く
- **単純過去** … 出来事を1つずつ進める

:::ex 物語の典型的な構造
Il faisait nuit. La pluie tombait. | イル・フゼ・ニュイ・ラ・プリュイ・トンベ | 夜だった。雨が降っていた。（半過去＝背景）
Soudain, la porte s'ouvrit. | スダン・ラ・ポルト・スーヴリ | 突然、扉が開いた。（単純過去＝出来事）
Un homme entra et regarda autour de lui. | アン・ノム・アントラ・エ・ルガルダ・オトゥール・ドゥ・リュイ | 男が入ってきて、あたりを見回した。（単純過去＝出来事の連続）
Il portait un manteau noir. | イル・ポルテ・アン・マント・ノワール | 彼は黒いコートを着ていた。（半過去＝描写）
:::

**半過去は絵の背景、単純過去は前景で動く人物** ——この対比が掴めれば、フランス語の物語文の読解は大きく楽になります。第27章でこの対立を正面から扱います。
:::

### 紛らわしい形 — 読み違えやすいペア

単純過去には、**別の動詞・別の時制と同じ綴りになる形**があります。読解で最も事故が起きる箇所です。

| 形 | 解釈1 | 解釈2 | 見分け方 |
|---|---|---|---|
| **il vit** | voir の単純過去（見た） | vivre の現在（生きている） | 物語の地の文なら単純過去が優勢 |
| **il fit** | faire の単純過去（した） | — | fit は単純過去のみ。fait と混同しない |
| **je finis** | finir の単純過去 | finir の現在 | 複数形か文脈で判断 |
| **il fut** | être の単純過去 | — | fût（^付き）なら接続法半過去 |
| **il eut** | avoir の単純過去 | — | eût（^付き）なら接続法半過去 |

:::warn fut と fût — アクサン1つで法が変わる
**fut**（単純過去）と **fût**(接続法半過去）は、アクサン・シルコンフレクスの有無だけで区別されます。

- Il **fut** surpris.（彼は驚いた——単純過去）
- … qu'il **fût** surpris（彼が驚いたということ——接続法半過去。第31章）

同じ対立が eut / eût にもあります。**^ が付いていたら接続法**——古典文学を読むときに必ず出会う区別なので、目印として覚えておいてください。なお単純過去でも nous / vous の形（fûmes / fûtes）には ^ が付くので、「^ = 接続法」が成り立つのは**3人称単数だけ**です。
:::

### 童話の開き方 — Il était une fois

フランス語の童話は、決まってこう始まります。

[[Il était une fois une princesse.|イ・レテ・ユヌ・フォワ・ユヌ・プランセス|昔々、あるところにお姫様がいました。]]

**Il était une fois**（昔々あるところに）は**半過去**です。背景の提示だからです。そして物語が動き出すと単純過去に切り替わります。

:::ex 童話の型
Il était une fois un roi qui vivait dans un grand château. | イ・レテ・ユヌ・フォワ・アン・ロワ | 昔々、大きな城に住む王様がいました。（半過去＝背景）
Un jour, il décida de partir en voyage. | アン・ジュール・イル・デスィダ | ある日、王様は旅に出ることに決めました。（単純過去＝物語が動く）
Il appela ses trois fils et leur dit : | イ・ラプラ・セ・トロワ・フィス・エ・ルール・ディ | 王様は3人の息子を呼んで言いました。（単純過去の連続）
:::

**Il était une fois（半過去）→ Un jour（単純過去へ切り替え）**——この型は童話・昔話に共通で、Un jour が「背景から出来事へ」の合図になっています。日本語の「昔々〜でした。ある日…」とまったく同じ構造です。

### 読解練習 — 短い物語を解剖する

理屈を実文で確認します。ペロー風の一節を、時制に注目して読んでください。

:::ex 物語の一節を読む
Il était une fois une jeune fille qui vivait avec sa belle-mère. | イ・レテ・ユヌ・フォワ | 昔々、継母と暮らす娘がいました。（半過去＝背景）
Elle travaillait du matin au soir. | エル・トラヴァイエ | 娘は朝から晩まで働いていました。（半過去＝習慣）
Un soir, une fée apparut devant elle. | ユヌ・フェ・アパリュ | ある晩、妖精が彼女の前に現れました。（単純過去＝出来事）
La fée lui donna une robe magnifique. | ラ・フェ・リュイ・ドナ | 妖精は彼女に見事なドレスを与えました。（単純過去）
La jeune fille partit au bal et y dansa toute la nuit. | パルティ・エ・ダンサ | 娘は舞踏会へ行き、一晩中踊りました。（単純過去の連続）
Quand minuit sonna, elle s'enfuit. | カン・ミニュイ・ソナ・エル・サンフュイ | 真夜中の鐘が鳴ると、彼女は逃げ出しました。（単純過去）
:::

**解剖**：apparut（apparaître, -u 型）、donna（donner, -a 型）、partit（partir, -i 型）、dansa（-a 型）、sonna（-a 型）、s'enfuit（s'enfuir, -i 型）。地の文の出来事はすべて単純過去、背景（vivait, travaillait）は半過去——役割分担が一目で見えます。

**会話文の中では複合過去**が使われることも思い出してください。物語の登場人物がしゃべるとき、その台詞は話し言葉なので « J'**ai perdu** ma chaussure ! »（靴をなくしたわ！）となります。**地の文＝単純過去、台詞＝複合過去**という层の分かれ方が、フランス語の小説の標準です。

## 6. 現代における位置づけ

:::adv 単純過去は消えつつあるのか
20世紀以降、単純過去の使用範囲は狭まり続けています。

- **話し言葉** … 完全に消滅（19世紀にはすでに）
- **新聞** … 論説・インタビューは複合過去、事件の記事では単純過去が残る
- **小説** … 依然として標準。ただし現代文学では複合過去で書く作家も増えている
- **学術・歴史記述** … 標準的に使われる

有名な例として、カミュの『異邦人』（*L'Étranger*, 1942）が**全編を複合過去で書いた**ことが挙げられます。これは文体上の実験であり、当時としては衝撃的でした。冒頭の [[Aujourd'hui, maman est morte.\|オジュルデュイ・ママン・エ・モルト\|今日、ママンが死んだ。]] が単純過去（mourut）でないことが、あの小説の平坦で距離のある語り口を作っています。

**単純過去を使うかどうかが文体の選択そのものになる** ——これが現代における単純過去の位置です。

なお、**接続法半過去**（第31章で触れます）は単純過去の語幹から作られるため、単純過去が衰退すると接続法半過去も一緒に使われなくなりました。2つの時制は運命を共にしています。
:::

## 7. 全人称の一覧表 — 参照用

読解では3人称が中心ですが、参照用に全人称を一覧にしておきます。

| 人称 | -a 型（chanter） | -i 型（finir） | -u 型（boire） | -in 型（venir） |
|---|---|---|---|---|
| je | chant**ai** | fin**is** | b**us** | v**ins** |
| tu | chant**as** | fin**is** | b**us** | v**ins** |
| il | chant**a** | fin**it** | b**ut** | v**int** |
| nous | chant**âmes** | fin**îmes** | b**ûmes** | v**înmes** |
| vous | chant**âtes** | fin**îtes** | b**ûtes** | v**întes** |
| ils | chant**èrent** | fin**irent** | b**urent** | v**inrent** |

**nous / vous に必ず ^ が付く**こと、**ils が -rent で終わる**ことが、4型に共通する目印です。1人称（je chantai「私は歌った」）は回想録・一人称小説で出会います。

:::note 新聞の中の単純過去
文学だけでなく、**新聞の歴史記事・訃報・スポーツの試合経過**でも単純過去は現役です。

- Napoléon **naquit** en 1769 et **mourut** en 1821.（ナポレオンは1769年に生まれ、1821年に没した）
- L'équipe **remporta** la victoire à la dernière minute.（チームは土壇場で勝利をものにした）

**naquit（naître）と mourut（mourir）は伝記の2大定番**です。生没を語る文はほぼこの2語で書かれるので、形のまま覚えておくと年表・略歴がすらすら読めます。
:::

## 9. 同じ場面を2つの文体で — 書き換えで掴む

単純過去の位置づけは、**同じ出来事を2つの文体で書き比べる**と一番よく分かります。

**書き言葉（物語の文体）**

- Elle **ouvrit** la porte, **entra** et **alluma** la lumière.

**話し言葉（会話・メールの文体）**

- Elle **a ouvert** la porte, elle **est entrée** et elle **a allumé** la lumière.

意味はまったく同じ「彼女はドアを開け、入り、明かりをつけた」。違いは**語りの距離**だけです。単純過去は出来事を遠くから淡々と並べ、複合過去は話し手の「今」につながった報告として語ります。

書き換えの対応は機械的です：**il ouvrit ↔ il a ouvert、elle entra ↔ elle est entrée**——複合過去の知識（助動詞の選択・一致）がそのまま使えます。原書を読んでいて単純過去に出会ったら、頭の中で複合過去に置き換えて意味を取ればよい、ということでもあります。

逆方向（複合過去で書かれた現代小説を「古典調」に直す）は、翻訳や文体練習の課題としてフランスの学校でも行われます。**時制の選択が文体の選択**——第20.5章の結論を、手を動かして確かめられる練習です。

## 10. 単純過去と半過去の切り替え点を見抜く

物語文で最も重要な読解技術は、**時制が切り替わる瞬間**を捉えることです。切り替えには合図があります。

| 合図 | 直後の時制 | 例 |
|---|---|---|
| soudain, tout à coup（突然） | **単純過去** | Soudain, la porte s'ouvrit. |
| un jour, ce matin-là（ある日） | **単純過去** | Un jour, il partit. |
| alors, puis, ensuite（それから） | **単純過去** | Alors il comprit. |
| depuis, autrefois, chaque（以前・毎） | **半過去** | Chaque soir, il lisait. |
| il faisait, il y avait（描写の導入） | **半過去** | Il faisait froid. |
| quand + 単純過去 | 主節は**半過去**が多い | Il dormait quand elle entra. |

**単純過去は「線を切る」、半過去は「線を引く」**と考えてください。物語は半過去で場面を描き、単純過去で出来事を打ち込みます。

:::ex 切り替えを読む
La nuit tombait. Le vent soufflait dans les arbres. | ラ・ニュイ・トンベ | 夜が迫っていた。風が木々の間で鳴っていた。（半過去＝描写）
Soudain, un cri déchira le silence. | スダン・アン・クリ・デシラ・ル・スィランス | 突然、叫び声が静寂を切り裂いた。（単純過去＝出来事）
Il se leva, ouvrit la fenêtre et regarda dehors. | イル・ス・ルヴァ・ウヴリ・ラ・フネートル | 彼は立ち上がり、窓を開け、外を見た。（単純過去の連続＝行動の連鎖）
Il n'y avait personne. | イル・ニ・ヤヴェ・ペルソンヌ | 誰もいなかった。（半過去＝状態に戻る）
:::

**単純過去が3つ並ぶ（se leva, ouvrit, regarda）**のは、行動が次々に起きたことを示します。半過去では並べても「同時にそうしていた」となり、話が前に進みません。**単純過去＝時計の針が進む、半過去＝針が止まる**——この感覚が掴めれば、フランス語の物語文は読めるようになります。

  title: '関係代名詞',
  sub: '英語で言えば who, which, where, when にあたります',
  body: `
関係代名詞は、**2つの文を1つにまとめる道具**です。英語の who / which / that / where / when にあたりますが、フランス語の選び方の基準は英語と根本的に違います。

英語は「先行詞が人か物か」で who / which を選びます。**フランス語はそれを一切問いません。** 見るのは「**関係節の中でその語がどんな働きをするか**」だけです。

この違いを最初に押さえてしまえば、あとは4つの語（qui, que, où, dont）を役割で振り分けるだけになります。

## 1. 選び方の基準 — 関係節の中での役割

| 関係代名詞 | 関係節の中での役割 | 英語で言えば |
|---|---|---|
| **qui** | **主語** | who, which, that |
| **que** | **直接目的語** | whom, which, that |
| **où** | **場所・時**の状況補語 | where, when |
| **dont** | **de + 名詞**を受ける | whose, of which |

:::warn 「人か物か」は関係ない
これがフランス語の関係代名詞で最も重要な点です。

- [[l'homme qui parle\|ロム・キ・パルル\|話している男性]] … 人
- [[le livre qui est sur la table\|ル・リーヴル・キ・エ・スュル・ラ・ターブル\|机の上にある本]] … 物

**どちらも qui** です。qui が「主語」の役割を担っているからで、先行詞が人か物かは関係ありません。

英語で who / which を使い分ける習慣があると、ここで必ず間違えます。**役割だけを見る** ——これを徹底してください。
:::

## 2. qui — 主語を受ける

**関係節の中で主語になる**とき、qui を使います。

:::ex qui
Je connais un homme. Il parle japonais. | | 私はある男性を知っている。彼は日本語を話す。
→ Je connais un homme qui parle japonais. | ジュ・コネ・アン・ノム・キ・パルル・ジャポネ | 私は日本語を話す男性を知っている。
C'est le train qui va à Lyon. | セ・ル・トラン・キ・ヴァ・ア・リヨン | それはリヨンへ行く列車です。
Les étudiants qui travaillent réussissent. | レ・ゼテュディアン・キ・トラヴァイユ・レユスィス | 勉強する学生は成功する。
:::

:::warn qui はエリジオンしない
母音で始まる語の前でも **qui のまま**です。× qu'il ではなく **qui il**… ではなく、そもそも qui は縮まりません。

- ○ [[l'homme qui arrive\|ロム・キ・アリーヴ\|到着する男性]]
- × l'homme qu'arrive

一方 **que はエリジオンします**（qu'il, qu'elle）。**この一点で qui と que を見分けられる**場合があります。文中に qu' があれば、それは que です。
:::

:::note qui の後の動詞は先行詞に一致する
qui が主語なので、動詞は**先行詞の人称・数**に合わせて活用します。

- [[C'est moi qui ai raison.\|セ・モワ・キ・エ・レゾン\|正しいのは私だ。]]（先行詞が moi なので ai）
- [[C'est toi qui as raison.\|セ・トワ・キ・ア・レゾン\|正しいのは君だ。]]（先行詞が toi なので as）
- [[Les livres qui sont là\|レ・リーヴル・キ・ソン・ラ\|そこにある本]]（先行詞が複数なので sont）

× C'est moi qui a raison. は誤りです。第22章の強調構文でこの点が重要になります。
:::

## 3. que — 直接目的語を受ける

**関係節の中で直接目的語になる**とき、que を使います。

:::ex que
J'ai acheté un livre. Je le lis maintenant. | | 私は本を買った。それを今読んでいる。
→ Le livre que je lis est intéressant. | ル・リーヴル・ク・ジュ・リ・エ・タンテレサン | 私が読んでいる本は面白い。
La femme que tu as vue est ma sœur. | ラ・ファム・ク・テュ・ア・ヴュ・エ・マ・スール | 君が見た女性は私の姉だ。
C'est le film qu'elle préfère. | セ・ル・フィルム・ケル・プレフェール | それは彼女が一番好きな映画だ。
:::

:::warn que の後には必ず主語が来る
qui と que の見分けは、**後ろに主語があるかどうか**で判断できます。

| | 後ろに来るもの |
|---|---|
| **qui** | いきなり**動詞**（qui 自体が主語だから） |
| **que** | **主語 + 動詞**（別の主語があるから） |

- le livre **qui est** sur la table（qui + 動詞）
- le livre **que je lis**（que + 主語 + 動詞）

**これが最も実務的な判定法です。**
:::

:::warn que の後では過去分詞が一致する
第20章の規則③がここで効きます。**関係代名詞 que は直接目的語であり、しかも動詞より前にある**ので、過去分詞が先行詞に一致します。

- [[La femme que j'ai vue.\|ラ・ファム・ク・ジェ・ヴュ\|私が見た女性。]]（vue と一致）
- [[Les livres que j'ai achetés.\|レ・リーヴル・ク・ジェ・アシュテ\|私が買った本。]]（achetés と一致）

一方 **qui は主語なので一致は起きません**（そもそも avoir の複合時制で主語に一致することはない）。

**que を見たら過去分詞の一致を疑う** ——書き取りの鉄則です。
:::

## 4. où — 場所と時を受ける

:::ex où
la ville où j'habite | ラ・ヴィル・ウー・ジャビット | 私が住んでいる町
le pays où je suis né | ル・ペイ・ウー・ジュ・スュイ・ネ | 私が生まれた国
le jour où je t'ai rencontré | ル・ジュール・ウー・ジュ・テ・ランコントレ | 私が君に出会った日
l'année où il est parti | ラネ・ウー・イ・レ・パルティ | 彼が去った年
:::

:::note 英語の when にあたるのも où
**時を表す先行詞にも où を使います**。英語では where と when を使い分けますが、フランス語は où ひとつです。

- ○ le jour **où** je t'ai vu（私が君を見た日）
- × le jour **quand** je t'ai vu

quand は関係代名詞ではなく疑問副詞・接続詞なので、この位置には使えません。**「時」も一種の場所として捉える**のがフランス語の発想です。
:::

:::adv d'où と par où
où に前置詞を付けることもできます。

- [[le pays d'où je viens\|ル・ペイ・ドゥー・ジュ・ヴィアン\|私が来た国]]（起点）
- [[la porte par où il est entré\|ラ・ポルト・パー・ルー・イ・レ・タントレ\|彼が入ってきたドア]]（経路）
:::

## 5. dont — de を受ける

**dont は de + 名詞を丸ごと受けます。** 英語の whose / of which にあたりますが、用途はもっと広く、**de を取る動詞・形容詞・名詞のすべて**に対応します。

:::deep dont の3つの用法

**（1）所有（英語の whose）**

[[C'est l'homme dont je connais le fils.\|セ・ロム・ドン・ジュ・コネ・ル・フィス\|それは、私がその息子を知っている男性だ。]]
（← Je connais le fils **de cet homme**.）

:::warn 語順が英語と違う
英語 the man **whose son** I know では whose + 名詞が続きますが、フランス語は **dont + 主語 + 動詞 + 定冠詞 + 名詞**の順です。

- ○ l'homme **dont je connais le fils**
- × l'homme dont le fils je connais

そして**所有形容詞は使いません**。son fils ではなく **le fils** です（第2章・第10章で見た「所有者が明らかなら定冠詞」の規則）。
:::

**（2）de を取る動詞の補語**

parler **de**（〜について話す）、avoir besoin **de**（〜が必要）、se souvenir **de**（〜を覚えている）、rêver **de**（〜を夢見る）など。

[[le livre dont je parle\|ル・リーヴル・ドン・ジュ・パルル\|私が話している本]]（← Je parle **du livre**.）
[[la chose dont j'ai besoin\|ラ・ショーズ・ドン・ジェ・ブゾワン\|私が必要としているもの]]
[[le voyage dont je rêve\|ル・ヴォワヤージュ・ドン・ジュ・レーヴ\|私が夢見ている旅行]]

**（3）de を取る形容詞の補語**

content **de**（〜に満足している）、fier **de**（〜を誇りに思う）、sûr **de**（〜を確信している）など。

[[le résultat dont je suis content\|ル・レジュルタ・ドン・ジュ・スュイ・コンタン\|私が満足している結果]]

**（4）数量の de**

[[J'ai dix livres, dont trois en français.\|ジェ・ディ・リーヴル・ドン・トロワ・ザン・フランセ\|私は本を10冊持っていて、そのうち3冊はフランス語だ。]]

この用法では「そのうち」と訳します。統計や列挙で頻繁に使われます。
:::

:::note dont を使うかどうかの判定
元の文を作ってみて、**de が現れるかどうか**を確認します。

1. Je parle **du** livre.（de + le = du）
2. de がある → **dont**
3. le livre **dont** je parle

第18章で間接目的語を判定したときと同じ手順です。**代名詞・関係詞を選ぶ前に、名詞のままの文を復元する。**
:::

## 6. ce qui / ce que / ce dont — 先行詞がないとき

:::deep 「〜すること」をまとめて受ける
先行詞が具体的な名詞ではなく、**文の内容そのもの**であるとき、**ce** を先行詞として立てます。

| 形 | 役割 | 英語で言えば |
|---|---|---|
| **ce qui** | 主語 | what（主語） |
| **ce que** | 直接目的語 | what（目的語） |
| **ce dont** | de を受ける | what … of |

:::ex ce qui / ce que / ce dont
Je ne sais pas ce qui se passe. | ジュ・ヌ・セ・パ・ス・キ・ス・パス | 何が起きているのか分からない。
Je ne comprends pas ce que tu dis. | ジュ・ヌ・コンプラン・パ・ス・ク・テュ・ディ | 君の言うことが分からない。
C'est ce dont j'ai besoin. | セ・ス・ドン・ジェ・ブゾワン | それが私に必要なものだ。
Dis-moi ce que tu veux. | ディ・モワ・ス・ク・テュ・ヴ | 何が欲しいか言って。
:::

**選び方の基準は qui / que / dont と同じ**です。ce が付くだけで、判定は変わりません。

**文全体を受けることもできます。**
[[Il est arrivé en retard, ce qui m'a énervé.\|イ・レ・タリヴェ・アン・ルタール・ス・キ・マ・エネルヴェ\|彼は遅れて来た、そのことが私を苛立たせた。]]

この ce qui は「彼が遅れて来たこと」全体を受けています。英語の which（非制限用法）と同じ働きです。

**第12章の疑問代名詞との関係**：qu'est-ce qui / qu'est-ce que と ce qui / ce que は形が似ていますが、前者は疑問文（直接疑問）、後者は関係節や間接疑問で使います。
- 直接疑問：[[Qu'est-ce que tu veux ?\|ケ・ス・ク・テュ・ヴ\|何が欲しい？]]
- 間接疑問：[[Dis-moi ce que tu veux.\|ディ・モワ・ス・ク・テュ・ヴ\|何が欲しいか言って。]]
:::

## 7. lequel — 前置詞の後

:::adv 前置詞 + 関係代名詞
de 以外の前置詞（avec, pour, sur, dans, sans…）の後ろでは、**lequel** を使います。**性数に一致して変化する**のが特徴です。

| | 単数 | 複数 |
|---|---|---|
| 男性 | lequel | lesquels |
| 女性 | laquelle | lesquelles |

**à と de とは縮約します**（第7章の規則）。

| | 男性単数 | 女性単数 | 男性複数 | 女性複数 |
|---|---|---|---|---|
| à + | **auquel** | à laquelle | **auxquels** | **auxquelles** |
| de + | **duquel** | de laquelle | **desquels** | **desquelles** |

:::ex lequel
la table sur laquelle j'ai posé le livre | ラ・ターブル・スュル・ラケル | 私が本を置いたテーブル
le stylo avec lequel j'écris | ル・スティロ・アヴェック・ルケル | 私が書いているペン
le problème auquel je pense | ル・プロブレーム・オケル・ジュ・パンス | 私が考えている問題
:::

:::note 先行詞が人なら qui も使える
**人が先行詞の場合、前置詞の後ろに qui を使えます**（lequel より一般的）。

- [[la personne avec qui je travaille\|ラ・ペルソンヌ・アヴェック・キ\|私が一緒に働いている人]]
- [[l'ami à qui j'ai écrit\|ラミ・ア・キ・ジェ・エクリ\|私が手紙を書いた友人]]

つまり **qui は主語のとき（先行詞不問）と、前置詞の後で人を受けるとき**の2つの用法を持ちます。物が先行詞なら lequel を使わなければなりません。
:::
:::

## 8. まとめ — 判定のフローチャート

:::note 関係代名詞の選び方
関係節の中で、その語がどう働くかを見ます。

1. **主語** → **qui**
2. **直接目的語** → **que**（過去分詞の一致に注意）
3. **場所・時** → **où**
4. **de + 名詞** → **dont**
5. **その他の前置詞 + 物** → **前置詞 + lequel**
6. **その他の前置詞 + 人** → **前置詞 + qui**
7. 先行詞が文の内容 → **ce** を足して ce qui / ce que / ce dont

**実務的な近道**：qui の後は動詞がいきなり来る、que の後は主語が来る。これで大半が判定できます。
:::

## 9. 関係節と法・話し言葉の実際

:::deep 3つの発展点
**（1）先行詞が不確定なら接続法**（第29½章・第31章）

- Je cherche un appartement **qui a** trois pièces.（3部屋の物件を探している——存在を確信）
- Je cherche un appartement **qui ait** trois pièces.（あれば欲しい——実在は不明）

**最上級・seul / premier / dernier の後の関係節**も接続法に傾きます：C'est le meilleur film **que j'aie** jamais **vu**.（今まで見た中で最高の映画だ）。

**（2）話し言葉の「万能 que」**

くだけた話し言葉では、dont や lequel の代わりに que で済ませる形が聞かれます（le livre **que** je t'ai parlé——規範では **dont**）。**規範的には誤り**ですが、実際の会話には現れます。聞いて理解できればよく、自分では dont を使ってください。

**（3）qui est-ce qui と「前置詞 + qui」**

前置詞の後で**人**を受けるのは qui です（物は lequel）。

- la personne **avec qui** je travaille（一緒に働いている人）
- l'ami **chez qui** j'habite（居候させてもらっている友人）

**c'est … qui / que の強調構文**（第22章）、**ce qui / ce que の疑似分裂**——関係代名詞は「文をつなぐ」だけでなく、フランス語の情報構造の背骨です。この章の判定力が、そのまま第22章の運用力になります。
:::

## 10. 練習してみる

:::ex 2文を1文にまとめる
Voici le livre. Je l'ai acheté hier. → Voici le livre que j'ai acheté hier. | ヴォワスィ・ル・リーヴル・ク・ジェ・アシュテ・イエール | これが昨日買った本です。
C'est un ami. Il habite à Paris. → C'est un ami qui habite à Paris. | セ・タン・ナミ・キ・アビット・ア・パリ | パリに住んでいる友人です。
Voilà la maison. J'y suis né. → Voilà la maison où je suis né. | ヴォワラ・ラ・メゾン・ウー・ジュ・スュイ・ネ | あれが私の生まれた家です。
C'est le film. Je t'en ai parlé. → C'est le film dont je t'ai parlé. | セ・ル・フィルム・ドン・ジュ・テ・パルレ | それが君に話した映画です。
:::


:::ai-gen 関係代名詞 qui, que, où, dont、ce qui / ce que

## 11. dont の語順と「〜のうちの」

**（1）dont 節の語順は固定**

dont の後ろは**主語 → 動詞 → 残り**の順で、何も前に出しません。英語の whose と混ざると事故が起きます。

- ○ un ami **dont le père** est médecin（父親が医者である友人）
- × un ami dont **son** père est médecin（dont がすでに「彼の」を含むので son は重複）

英語 whose father なら所有格が名詞に付きますが、フランス語は **dont + 定冠詞 + 名詞**です。「dont の後に所有形容詞を置かない」——これが最重要の注意点です。

**（2）数量の dont — 「そのうちの〜」**

dont には、節を作らず**数量だけを添える**便利な用法があります。

:::ex 数量の dont
J'ai trois frères, dont deux habitent à Paris. | ドン・ドゥ | 私には兄弟が3人いて、うち2人はパリに住んでいる。
Il a écrit dix romans, dont ce chef-d'œuvre. | ドン・ス・シェフ・ドゥーヴル | 彼は小説を10冊書いた。この傑作もその1つだ。
Cinq personnes, dont trois enfants, ont été blessées. | ドン・トロワ・ザンファン | 3人の子どもを含む5人が負傷した。
:::

**数詞 + …, dont + 数詞**（〜のうち…）は報道文の頻出パターンです。動詞なしで「dont trois enfants」とだけ添える形も普通で、日本語の「うち3人は子ども」にそのまま対応します。

## 12. 関係節と先行詞の距離 — 曖昧さを避ける

関係節は先行詞のすぐ後ろに置くのが原則ですが、**離れると誰にかかるか分からなくなります**。

- △ J'ai vu la sœur de mon ami **qui habite à Lyon**.（リヨンに住んでいるのは姉か友人か？）

フランス語には英語の that / which のような制限・非制限の区別が形にないため、**語順と文脈で解決する**しかありません。書くときは次の手を使います。

| 手段 | 例 |
|---|---|
| **語順を変える** | J'ai vu **la sœur qui habite à Lyon**, celle de mon ami. |
| **celui / celle で受け直す** | … mon ami, **celui qui** habite à Lyon |
| **文を分ける** | J'ai vu la sœur de mon ami. **Elle** habite à Lyon. |
| **コンマで非制限を示す** | mon ami**,** qui habite à Lyon**,** est venu. |

**コンマの有無で意味が変わる**のは英語と同じです。

- Les étudiants **qui** ont réussi sont partis.（合格した学生は帰った——**一部**）
- Les étudiants**,** qui ont réussi**,** sont partis.（学生たちは、合格したので、帰った——**全員**）

コンマがなければ**先行詞を絞り込む**（制限的）、コンマがあれば**補足説明**（非制限的）。試験でも読解でも問われる区別です。

:::note 関係節が長いときは分ける
フランス語の書き言葉は関係節を重ねる傾向がありますが、**qui / que が3つ以上連鎖すると読みにくくなります**。

- △ C'est le livre que m'a prêté l'ami qui habite dans la maison qui est au coin.
- ○ C'est le livre que m'a prêté un ami. **Il** habite dans la maison du coin.

**節を1つ減らして名詞句にする**（la maison qui est au coin → la maison du coin）のも有効です。関係代名詞を使いこなすとは、**使わない選択肢も持つこと**でもあります。
:::

FR.chapter({
