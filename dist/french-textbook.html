  sub: '「愛してる?」を3通りの言い方で',
  body: `
フランス語には**「はい／いいえ」で答える疑問文（疑問詞のない疑問文）の作り方が3通り**あります。意味はどれも同じですが、**改まり度が違います**。同じ内容を、友人に言うか、店員に言うか、レポートに書くかで使い分けます。

英語のように do を持ち出す必要はありません。語順を変えるか、決まった句を頭に付けるか、何もしないか——この3択です。

## 1. 3つの作り方

平叙文 [[Tu aimes le café.\|テュ・エーム・ル・カフェ\|君はコーヒーが好きだ。]] を疑問文にしてみます。

| 方法 | 形 | 改まり度 |
|---|---|---|
| **① イントネーション** | Tu aimes le café **?** | くだけた（話し言葉） |
| **② est-ce que** | **Est-ce que** tu aimes le café ? | 中立（話し言葉・書き言葉） |
| **③ 倒置** | **Aimes-tu** le café ? | 改まった（書き言葉） |

:::ex 3通りを聞き比べる
Tu aimes le café ? | テュ・エーム・ル・カフェ | コーヒー好き？
Est-ce que tu aimes le café ? | エス・ク・テュ・エーム・ル・カフェ | コーヒーはお好きですか？
Aimes-tu le café ? | エム・テュ・ル・カフェ | コーヒーはお好きですか？
:::

### ① イントネーション — 語順はそのまま

**文末を上げるだけ**です。語順も語形も一切変えません。書くときは末尾に ? を付けます。

:::note 話し言葉ではこれが圧倒的に多い
日常会話で最も使われるのはこの形です。倒置は改まりすぎ、est-ce que はやや長いためです。

ただし**書き言葉ではくだけすぎ**とみなされるので、レポートやビジネスメールでは使いません。
:::

### ② est-ce que — 文頭に付けるだけ

**平叙文の前に est-ce que を置く**だけです。語順は変わりません。最も汎用的で、迷ったらこれを使えば失敗しません。

:::warn 母音の前では est-ce qu' になる
[[Est-ce qu'il aime le café ?\|エス・キ・レーム・ル・カフェ\|彼はコーヒーが好きですか？]]（que → qu'）
:::

:::deep est-ce que の正体
est-ce que は、もともと **c'est que**（それは〜ということだ）を倒置した **est-ce que**（〜ということですか）です。つまり③の倒置が化石化して、決まり文句になったものです。

だから直訳すると「〜であるのは事実ですか？」となります。現代では意味が薄れ、**単なる疑問の目印**として機能しています。第12章の疑問詞（qu'est-ce que, qui est-ce qui …）も、この est-ce que を組み込んだ形です。
:::

### ③ 倒置 — 主語と動詞を入れ替える

**動詞と主語代名詞をハイフンでつなぎます。**

:::ex 倒置
Aimes-tu le café ? | エム・テュ・ル・カフェ | コーヒーはお好きですか？
Parlez-vous français ? | パルレ・ヴー・フランセ | フランス語を話しますか？
Êtes-vous japonais ? | エット・ヴー・ジャポネ | あなたは日本人ですか？
Sommes-nous en retard ? | ソム・ヌー・ザン・ルタール | 私たちは遅れていますか？
:::

:::warn 倒置には3つの注意点

**（a）ハイフンは必須**
Aimes tu ? ではなく **Aimes-tu ?** と書きます。

**（b）母音がぶつかると t を挟む**

3人称単数（il / elle / on）で、動詞が母音で終わるとき、**発音しやすくするために -t- を入れます**。

- [[Aime-t-il le café ?\|エム・ティ・ル・カフェ\|彼はコーヒーが好きですか？]]（× Aime-il）
- [[Parle-t-elle français ?\|パルル・テル・フランセ\|彼女はフランス語を話しますか？]]
- [[Y a-t-il un problème ?\|ヤ・ティ・ラン・プロブレーム\|問題がありますか？]]

この t は**何の意味も持ちません**。母音の衝突を避けるためだけの挿入で、エリジオン・リエゾン・bel/vieil と同じ原理です。

すでに t や d で終わっている動詞には入れません：[[Est-il là ?\|エ・ティル・ラ\|彼はいますか？]]（est の t がリエゾンする）、[[Prend-il le train ?\|プラン・ティル・ル・トラン\|彼は電車に乗りますか？]]（d が [t] で読まれる）。

**（c）je の倒置は原則避ける**

× Aime-je ? とは言いません。je の倒置は音が悪いため、**est-ce que を使います**：[[Est-ce que j'aime … ?\|エス・ク・ジェーム]]

例外的に、いくつかの動詞では古い形が慣用として残っています。
[[Puis-je entrer ?\|ピュイ・ジュ・アントレ\|入ってもよろしいですか？]]（pouvoir の特別な形 puis）、[[Suis-je … ?\|スュイ・ジュ]]、[[Ai-je … ?\|エ・ジュ]]、[[Dois-je … ?\|ドワ・ジュ]]
:::

:::deep 主語が名詞のときの倒置（複合倒置）
主語が代名詞ではなく**名詞**の場合、名詞をそのまま動詞の後ろに回すことはできません。**名詞を前に置いたまま、それを受ける代名詞を動詞の後ろに付けます。**

× Aime Marie le café ?
○ [[Marie aime-t-elle le café ?\|マリ・エム・テル・ル・カフェ\|マリはコーヒーが好きですか？]]

これを**複合倒置（l'inversion complexe）**と呼びます。書き言葉で用いられる形式です。

ただし疑問詞のある疑問文では、**単純倒置**（名詞をそのまま後ろに置く）も可能です。
[[Où habite Marie ?\|ウー・アビット・マリ\|マリはどこに住んでいますか？]]

この使い分けは第12章で扱います。
:::

### 複合時制・否定文の倒置

複合過去（第20章）を倒置するときは、**助動詞と主語だけをひっくり返し、過去分詞は後ろに残します**。

:::ex 複合時制の倒置
As-tu mangé ? | ア・チュ・マンジェ | 食べた？
Êtes-vous déjà allé en France ? | エット・ヴー・デジャ・アレ・アン・フランス | フランスに行ったことがありますか？
A-t-elle téléphoné ? | ア・テル・テレフォネ | 彼女は電話してきましたか？
Avez-vous bien dormi ? | アヴェ・ヴー・ビヤン・ドルミ | よく眠れましたか？
:::

否定と倒置を重ねると、**ne が倒置のかたまり全体を挟みます**。かなり改まった形です。

[[N'est-il pas venu ?|ネ・ティル・パ・ヴニュ|彼は来なかったのですか？]]
[[Ne trouvez-vous pas ?|ヌ・トルヴェ・ヴー・パ|そう思いませんか？]]

**Ne trouvez-vous pas ?**（そう思いませんか？）は、同意を促す上品な言い回しとして現代でも使われます。

## 2. 答え方 — oui / si / non

:::warn 否定疑問文には si で答える
フランス語には「はい」が**2つ**あります。

| | 使う場面 |
|---|---|
| **oui** | 肯定疑問文に「はい」 |
| **si** | **否定疑問文**を否定して「いいえ、そうです」 |
| **non** | 「いいえ」 |

:::ex oui / si / non
Tu aimes le café ? — Oui. | テュ・エーム・ル・カフェ・ウィ | コーヒー好き？ — うん。
Tu n'aimes pas le café ? — Si, j'aime ça ! | テュ・ネーム・パ・ル・カフェ・スィ・ジェーム・サ | コーヒー嫌いなの？ — いや、好きだよ！
Tu n'aimes pas le café ? — Non, je déteste. | テュ・ネーム・パ・ル・カフェ・ノン・ジュ・デテスト | コーヒー嫌いなの？ — うん、嫌い。
:::

**日本語と逆になる点に注意してください。** 「コーヒー嫌いなの？」に対し、日本語では「うん（＝嫌い）」ですが、フランス語では否定を肯定するので **non** です。逆に「いや、好きだよ」は **si** になります。

英語には si に対応する語がありません（Yes, I do. で兼用）。ドイツ語の doch が同じ働きをします。
:::

## 3. 否定疑問文

否定文をそのまま疑問文にできます。3つの方法すべてが使えます。

:::ex 否定疑問文
Tu ne viens pas ? | テュ・ヌ・ヴィアン・パ | 来ないの？
Est-ce que tu ne viens pas ? | エス・ク・テュ・ヌ・ヴィアン・パ | 来ないのですか？
Ne viens-tu pas ? | ヌ・ヴィアン・テュ・パ | 来ないのですか？
:::

倒置の場合、**ne は動詞の前、pas は主語代名詞の後ろ**に来ます。ne … pas が挟むのは「活用した動詞 + 倒置された主語」のかたまりになるためです。

[[N'aimez-vous pas le café ?\|ネメ・ヴー・パ・ル・カフェ\|コーヒーはお好きではないのですか？]]

:::adv 否定疑問文は反語や勧誘にもなる
形式的には質問ですが、実際には別の意図で使われることがあります。

- **確認・同意を求める**：[[N'est-ce pas ?\|ネ・ス・パ\|そうですよね？]]（英語の isn't it? / right? にあたる万能の付加疑問）
- **勧誘・提案**：[[Tu ne veux pas venir ?\|テュ・ヌ・ヴ・パ・ヴニール\|来ない？（来ませんか）]]
- **驚き・非難**：[[Tu n'as pas honte ?\|テュ・ナ・パ・オント\|恥ずかしくないの？]]

n'est-ce pas は、主語や時制に関係なく**常にこの形**です。英語の付加疑問（isn't it / doesn't he / haven't you…）のように変化しないので、はるかに簡単です。
:::

## 4. 3つの形をどう使い分けるか

:::note 実務的な指針
- **友人・家族との会話** → イントネーション（Tu viens ?）
- **初対面・店・職場での会話** → est-ce que（Est-ce que vous avez … ?）
- **レポート・論文・文学作品・改まった文書** → 倒置（Peut-on dire que … ?）

**迷ったら est-ce que。** どの場面でも失礼にならず、語順を変えないので間違えにくい形です。

なお倒置は、書き言葉では**むしろ標準**です。フランスの新聞・小説・学術論文では倒置が普通に使われます。「倒置＝古い」ではなく「倒置＝書き言葉」と理解してください。
:::

:::adv 話し言葉の第4の形
実際の会話では、疑問詞を文末に置く形も多用されます（第12章）。

[[Tu vas où ?\|テュ・ヴァ・ウー\|どこ行くの？]]（← Où vas-tu ?）
[[C'est combien ?\|セ・コンビアン\|いくら？]]

語順を変えずに疑問詞だけ置き換えるので、話し言葉として最も楽な形です。書き言葉では使いません。
:::

:::deep 付加疑問と聞き返し — 会話の実務
**（1）「〜だよね？」と確認する**

文末に付けて同意を求める形が3段階あります。

| 形 | 響き | 例 |
|---|---|---|
| **…, n'est-ce pas ?** | 標準・やや改まる | C'est bon, n'est-ce pas ? |
| **…, non ?** | 話し言葉で最も普通 | C'est bon, non ? |
| **…, hein ?** | かなりくだけた | C'est bon, hein ? |

英語の付加疑問（isn't it? / don't you?）が動詞ごとに形を変えるのに対し、**フランス語は n'est-ce pas / non / hein の1語で全部に対応**します。実際の会話では **non ?** が圧倒的に多く、n'est-ce pas はやや教科書的に響くことも知っておいてください。

**（2）聞き返す**

聞き取れなかったとき、何と言って聞き返すかにも丁寧さの段階があります。

| 形 | 丁寧さ |
|---|---|
| [[Pardon ?|パルドン|え、何とおっしゃいましたか？]] | 丁寧。まずこれ |
| [[Comment ?|コマン|何ですって？]] | 中立 |
| [[Quoi ?|コワ|何？]] | ぞんざい。親しい間柄のみ |

日本語の「え？」の感覚で **Quoi ?** を使うと失礼に響きます。**Pardon ?** を既定にしてください。
:::

## 5. 丁寧に尋ねる — 質問を包む定型

:::deep Pourriez-vous me dire … ? — 質問の丁寧化
知らない人にいきなり Où est la gare ? と聞くのは、日本語で「駅どこ」と聞くのに近い直接さです。実際の場面では、**質問を別の文の中に埋め込んで**丁寧にします。

| 段階 | 形 | 例 |
|---|---|---|
| 直接 | 疑問文のみ | Où est la gare ? |
| 標準 | **Excusez-moi,** + 疑問文 | Excusez-moi, où est la gare ? |
| 丁寧 | **Pourriez-vous me dire** + 間接疑問 | Pourriez-vous me dire **où est la gare** ? |
| 丁寧 | **Savez-vous** + 間接疑問 | Savez-vous **s'il y a** une pharmacie près d'ici ? |
| 非常に丁寧 | **J'aimerais savoir** + 間接疑問 | J'aimerais savoir **quand** le train part. |

:::ex 街で尋ねる
Excusez-moi, je cherche la gare. | エクスキュゼ・モワ・ジュ・シェルシュ・ラ・ガール | すみません、駅を探しているのですが。
Pourriez-vous me dire où se trouve la poste ? | プリエ・ヴ・ム・ディール・ウ・ス・トルーヴ・ラ・ポスト | 郵便局がどこにあるか教えていただけますか。
Savez-vous à quelle heure ça ferme ? | サヴェ・ヴ・ア・ケ・ルール・サ・フェルム | 何時に閉まるかご存じですか。
Est-ce que vous sauriez s'il y a un bus pour le centre ? | エス・ク・ヴ・ソリエ・スィ・リ・ヤ・アン・ビュス | 中心街行きのバスがあるかご存じでしょうか。
:::

埋め込まれた疑問（間接疑問）では、**est-ce que も倒置も使いません**。語順は平叙文に戻ります（× Pourriez-vous me dire où est-ce que la gare est ?）。「〜かどうか」は **si** でつなぎます。この仕組みの全体は第27.6章（話法）で扱いますが、**旅行会話としては上の4文を型で覚えれば今日から使えます**。

もう1つの実務：**Je cherche …**（〜を探しています）と**平叙文で言って相手の助けを待つ**のも、フランスでは自然な尋ね方です。質問の形を取らないぶん、押しつけがましさがありません。
:::

## 6. 場面で使う — 店・カフェ・駅の質問

疑問形は旅行会話の背骨です。**そのまま使える形**で場面別にまとめます。

:::ex 店で
Vous avez ça en bleu ? | ヴー・ザヴェ・サ・アン・ブルー | これの青はありますか？
Je peux essayer ? | ジュ・プ・エセイエ | 試着してもいいですか？
Ça coûte combien ? | サ・クート・コンビアン | いくらですか？
Vous prenez la carte ? | ヴー・プルネ・ラ・カルト | カードは使えますか？
:::

:::ex カフェ・レストランで
Vous avez une table pour deux ? | ヴー・ザヴェ・ユヌ・ターブル・プール・ドゥ | 2人ですが席はありますか？
Qu'est-ce que vous me conseillez ? | ケス・ク・ヴー・ム・コンセイエ | おすすめは何ですか？
Est-ce que je peux avoir l'addition ? | エス・ク・ジュ・プ・アヴォワール・ラディスィヨン | お会計をお願いできますか？
C'est possible de changer de place ? | セ・ポスィブル・ドゥ・シャンジェ・ドゥ・プラス | 席を替われますか？
:::

:::ex 駅・移動で
Le train part à quelle heure ? | ル・トラン・パール・ア・ケ・ルール | 電車は何時に出ますか？
C'est bien le quai pour Lyon ? | セ・ビヤン・ル・ケ・プール・リヨン | リヨン行きはこのホームで合ってますか？
Il faut changer ? | イル・フォ・シャンジェ | 乗り換えは必要ですか？
On met combien de temps ? | オン・メ・コンビアン・ドゥ・タン | どのくらい時間がかかりますか？
:::

観察してほしいのは、**ほぼすべてイントネーション疑問か est-ce que** で、倒置がないことです。実際の会話の疑問文は、この2つの形で回っています。**C'est bien … ?**（〜で合ってますか？）は確認の定型で、bien が「ちゃんと・確かに」の意味を添えています。

## 7. 練習してみる

:::ex 同じ内容を3通りで
Vous parlez anglais ? | ヴー・パルレ・アングレ | 英語を話しますか？（くだけた）
Est-ce que vous parlez anglais ? | エス・ク・ヴー・パルレ・アングレ | 英語を話しますか？（中立）
Parlez-vous anglais ? | パルレ・ヴー・アングレ | 英語を話しますか？（改まった）
:::

:::ex 日常でよく使う疑問文
Est-ce que je peux vous aider ? | エス・ク・ジュ・プ・ヴー・ゼデ | お手伝いしましょうか？
Vous avez l'heure ? | ヴー・ザヴェ・ルール | 時間わかりますか？
Est-ce qu'il y a un métro près d'ici ? | エス・キリヤ・アン・メトロ・プレ・ディスィ | この近くに地下鉄はありますか？
Puis-je entrer ? | ピュイ・ジュ・アントレ | 入ってもよろしいですか？
C'est bon, n'est-ce pas ? | セ・ボン・ネ・ス・パ | おいしいですよね？
:::


:::ai-gen 疑問形の3つの作り方、倒置、oui/si/non の使い分け

## 7. 許可を求める・申し出る — pouvoir の疑問文

疑問文の頻出目的が2つあります。**許可**（〜してもいいですか）と**申し出**（〜しましょうか）です。どちらも pouvoir の疑問文で作ります。

| 場面 | 形 | 例 |
|---|---|---|
| 許可（くだけた） | Je peux + 不定詞 ? | Je peux entrer ?（入っていい？） |
| 許可（標準） | Est-ce que je peux … ? | Est-ce que je peux essayer ? |
| 許可（丁寧） | **Puis-je** … ? | Puis-je vous poser une question ? |
| 申し出 | Je peux vous aider ? | お手伝いしましょうか？ |
| 依頼 | Tu peux / Vous pouvez … ? | Vous pouvez répéter ?（もう一度いいですか） |

:::ex 許可と申し出
Je peux m'asseoir ici ? | ジュ・プ・マソワール・イスィ | ここに座ってもいいですか？
On peut payer par carte ? | オン・プ・ペイエ・パール・カルト | カードで払えますか？
Je vous sers quelque chose ? | ジュ・ヴ・セール・ケルク・ショーズ | 何かお出ししましょうか？
Vous permettez ? | ヴ・ペルメテ | よろしいですか？（席・通り道などで） |
:::

**Vous permettez ?**（よろしいですか）は、席に着く・窓を開ける・写真を撮るなど、**行動の直前に一言添える**万能の許可表現です。日本語の「失礼します」に近い働きをします。**On peut … ?** は「（一般に）〜できますか・〜可能ですか」という設備・ルールの質問に便利です。

## 8. 疑問文のイントネーション — 音で問う

イントネーション疑問は語順を変えないので、**声の上がり方だけが疑問の目印**です。この上げ方には型があります。

| 型 | 例 | 声の動き |
|---|---|---|
| **全体疑問**（はい／いいえ） | Tu viens ↗ | 文末を**上げる** |
| **疑問詞つき** | Tu vas où ↗ | 疑問詞で上げ、そのまま保つ |
| **確認・驚き** | Tu pars déjà ↗↗ | 大きく上げる |
| **平叙文** | Tu viens ↘ | 文末を**下げる** |

第0章で見たとおり、フランス語は**リズムグループの最後に強勢**が来ます。疑問文ではその最後の音節を上げるだけ——それが「語順を変えない疑問文」が成立する理由です。

:::warn 書くときは ? を、話すときは音を
イントネーション疑問は**話し言葉の形**です。書く場合は、

- メール・SNS など私的な文：Tu viens ? と書いてよい
- レポート・ビジネス文書：**est-ce que か倒置**にする

という切り分けになります。「くだけた形＝間違い」ではなく、**場面に合っているかどうか**の問題です。第9章の3つの形は、優劣ではなく**register（言葉遣いの段階）の選択肢**だと理解してください。
:::

もう1つ、**フランス語には疑問文専用の助動詞がない**ことも押さえておきましょう。英語は do / does を立てて Do you come? と作りますが、フランス語は語順・est-ce que・イントネーションで済ませます。**だから3つの形が並存している**——英語の do にあたる仕事を、3つの手段で分担しているのです。

  body: `
第2章で「名詞は限定詞なしでは文に置けない」と述べました。冠詞はその限定詞の1種ですが、他にも3つの系列があります。

- **指示形容詞**（この、その、あの）
- **所有形容詞**（私の、君の、彼の）
- **疑問形容詞**（どの、なんという）

いずれも**冠詞の代わりに置かれます**。冠詞と併用することはできません（× le mon livre）。そして**修飾する名詞の性・数に一致して形を変えます**。

## 1. 指示形容詞 — ce / cet / cette / ces

| | 形 |
|---|---|
| 男性単数 | **ce** |
| 男性単数（母音・無音の h の前） | **cet** |
| 女性単数 | **cette** |
| 複数（男女共通） | **ces** |

:::ex 指示形容詞
ce livre | ス・リーヴル | この本
cet homme | セ・トム | この男性（母音の前）
cet hôtel | セ・トテル | このホテル（無音の h）
cette table | セット・ターブル | この机
ces livres | セ・リーヴル | これらの本
ces tables | セ・ターブル | これらの机
:::

:::warn cet と cette は同音
**cet**（男性・母音の前）と **cette**（女性）は、どちらも「セット」で**発音が完全に同じ**です。

- cet homme（男性名詞 homme）
- cette femme（女性名詞 femme）

聞き分けはできません。**書くときに名詞の性で選ぶ**必要があります。cet が存在するのも、beau → bel、vieux → vieil と同じく、**母音の衝突を避けるため**です（ce homme では言いにくい）。
:::

:::note 「この」と「あの」を区別しない
フランス語の ce は、**近い・遠いを区別しません**。英語の this と that、日本語の「この・その・あの」にあたる区別がないのです。

区別が必要なときは、名詞の後ろに **-ci**（近い）／**-là**（遠い）を付けます。

:::ex -ci と -là
ce livre-ci | ス・リーヴル・スィ | この本（こちらの）
ce livre-là | ス・リーヴル・ラ | あの本（あちらの）
:::

第0章で見た voi**ci** / voi**là** と同じ ci / là です。実際の会話では、指差しやジェスチャーで足りるため -ci / -là はあまり使われず、**2つを対比するとき**に主に用いられます。
:::

## 2. 所有形容詞 — 「誰の」ではなく「何を」に一致する

**ここがフランス語で最も混乱を招く箇所の1つです。**

| 所有者 | 男性単数 | 女性単数 | 複数 |
|---|---|---|---|
| **je**（私の） | mon | ma | mes |
| **tu**（君の） | ton | ta | tes |
| **il / elle**（彼の・彼女の） | son | sa | ses |
| **nous**（私たちの） | notre | notre | nos |
| **vous**（あなたの） | votre | votre | vos |
| **ils / elles**（彼らの） | leur | leur | leurs |

:::ex 所有形容詞
mon livre | モン・リーヴル | 私の本
ma table | マ・ターブル | 私の机
mes amis | メ・ザミ | 私の友人たち
notre maison | ノートル・メゾン | 私たちの家
vos enfants | ヴォ・ザンファン | あなたの子どもたち
leur voiture | ルール・ヴォワテュール | 彼らの車
:::

:::warn son / sa は「彼の」か「彼女の」か決まらない
**son livre は「彼の本」とも「彼女の本」とも訳せます。**

なぜなら、son / sa / ses が一致するのは**所有される名詞の性・数**であって、**所有者の性別ではない**からです。

| フランス語 | 意味 |
|---|---|
| **son** livre | 彼の本／彼女の本（livre が男性名詞） |
| **sa** voiture | 彼の車／彼女の車（voiture が女性名詞） |

英語では his book / her book と所有者で区別しますが、**フランス語にはこの区別がありません**。所有者を明示したいときは、強勢形（第19章）を使って [[le livre à lui\|ル・リーヴル・ア・リュイ\|彼の本]] や [[son livre à elle\|ソン・リーヴル・ア・エル\|彼女の本]] のように言い添えます。

英語話者・日本語話者ともに最も間違える箇所です。**「誰のものか」ではなく「何を持っているか」を見る** ——これを繰り返し確認してください。
:::

:::warn 女性名詞でも母音の前では mon / ton / son
女性名詞であっても、**母音・無音の h で始まる場合は男性形を使います**。

- × ma amie → ○ **mon** amie（私の女友だち）
- × sa école → ○ **son** école（彼の／彼女の学校）
- × ta histoire → ○ **ton** histoire（君の話）

ma amie では母音がぶつかって言いにくいためです。cet と同じ理由、同じ解決策です。

**この場合、名詞は依然として女性名詞のまま**なので、形容詞は女性形で一致します。
[[mon amie japonaise\|モ・ナミ・ジャポネーズ\|私の日本人の女友だち]]（japonaise は女性形）
:::

:::deep notre / votre と leur だけ、単複の形が違う理由
表をよく見ると、1・2・3人称単数（mon, ton, son）は男性形と女性形が分かれているのに、複数所有者（notre, votre, leur）は分かれていません。

これはラテン語からの継承の結果です。
- meus / mea / meum（私の）… ラテン語では性で変化した → mon / ma
- noster / nostra（私たちの）… こちらも変化したが、フランス語では -e が無音化して同形になった → notre

つまり**書き分ける必要がなくなった**のであって、規則が違うわけではありません。

なお複数形では nos / vos / leurs と s が付くので、**単数と複数は区別されます**。notre livre（私たちの本1冊）と nos livres（私たちの本、複数）です。
:::

:::adv 身体部位には所有形容詞を使わない
第2章で触れた点です。所有者が文脈から明らかなとき、フランス語は**定冠詞**を使います。

- ○ [[Il a mal à la tête.\|イラ・マ・ラ・ラ・テット\|彼は頭が痛い。]]
- × Il a mal à sa tête.

- ○ [[Elle lève la main.\|エル・レーヴ・ラ・マン\|彼女は手を挙げる。]]
- × Elle lève sa main.

所有者を明示する必要があるときは、間接目的語（第18章）や代名動詞（第23章）で表します。
[[Je me lave les mains.\|ジュ・ム・ラーヴ・レ・マン\|私は手を洗う。]]（me が「自分の」を担う）

ただし、身体部位に形容詞が付いて個別化されると所有形容詞が復活します。
[[Ses longs cheveux noirs\|セ・ロン・シュヴー・ノワール\|彼女の長い黒髪]]
:::

:::deep 所有形容詞の語法あれこれ
**（1）vous が敬称単数のときは votre / vos**

相手が一人でも、vous で話しているなら所有形容詞は votre / vos です（× ton / ta）。呼び方と所有形容詞の人称は必ず揃えます。tu と vous を混ぜるのは失礼にあたります。

**（2）on の所有形容詞は son / sa / ses**

on（人は・私たちは）を受けるのは規範では son 系です：**On a ses habitudes.**（人にはそれぞれ習慣がある）。「私たち」の意味の on では notre / nos も使われます：On a pris notre voiture.（うちらの車で行った——話し言葉）。

**（3）配分の chacun … son**

[[Chacun a ses défauts.\|シャカン・ア・セ・デフォ\|誰にでも欠点はある。]]——chacun（それぞれ）は単数扱いなので son / sa / ses で受けます（第10.5章）。

**（4）親愛の mon**

軍隊・改まった呼びかけの **mon** colonel（大佐殿）、また **mon chéri / ma chérie**（愛しい人）、**mon vieux**（おまえ・相棒——くだけた呼びかけ）のように、所有形容詞は呼びかけにも使われます。意味は「私の」から離れて、親しさ・敬意の印になっています。
:::

## 3. 疑問形容詞 — quel / quelle / quels / quelles

「どの〜」「なんという〜」を表します。**4つの形はすべて同音**（「ケル」）です。

| | 単数 | 複数 |
|---|---|---|
| 男性 | quel | quels |
| 女性 | quelle | quelles |

:::ex 疑問形容詞
Quel livre ? | ケル・リーヴル | どの本？
Quelle heure est-il ? | ケ・ルー・レ・ティル | 何時ですか？
Quels sont vos projets ? | ケル・ソン・ヴォ・プロジェ | あなたの計画は何ですか？
Quelles langues parlez-vous ? | ケル・ラング・パルレ・ヴー | どの言語を話しますか？
:::

:::note quel は名詞から離れることもある
quel は形容詞なので名詞を修飾しますが、**être を挟んで属詞になる**用法があります。

- [[Quel est votre nom ?\|ケ・レ・ヴォートル・ノン\|お名前は何ですか？]]
- [[Quelle est la capitale du Japon ?\|ケ・レ・ラ・カピタル・デュ・ジャポン\|日本の首都はどこですか？]]

この場合も、**後ろの名詞に性数一致します**（nom は男性→ quel、capitale は女性→ quelle）。

英語の what is your name? に相当しますが、フランス語では**qu'est-ce que votre nom ? とは言えません**。人・モノの属性を尋ねるときは quel を使います。この区別は第12章で扱います。
:::

:::adv 感嘆文の quel
quel は感嘆にも使われます。この場合、**冠詞を付けません**。

:::ex 感嘆の quel
Quel beau temps ! | ケル・ボー・タン | なんていい天気だ！
Quelle surprise ! | ケル・スュルプリーズ | なんという驚き！
Quels beaux yeux ! | ケル・ボー・ズィユ | なんて美しい目だろう！
:::

英語の What a beautiful day! では a が入りますが、**フランス語では冠詞不要**です（× Quel un beau temps !）。

感嘆の quel は日常会話の定型を多く作ります。**そのまま使える形**で覚えてください。

| 表現 | 意味 |
|---|---|
| [[Quel dommage !\|ケル・ドマージュ]] | なんて残念！ |
| [[Quelle chance !\|ケル・シャンス]] | なんて運がいい！ |
| [[Quelle horreur !\|ケ・ロルール]] | ひどい！ |
| [[Quelle bonne idée !\|ケル・ボンヌ・イデ]] | いい考えだね！ |
| [[Quel monde !\|ケル・モンド]] | すごい人出だ！ |
:::

:::note quel のその他の顔
**（1）間接疑問の中の quel**

[[Je ne sais pas quelle heure il est.\|ジュ・ヌ・セ・パ・ケ・ルー・リ・レ\|何時か分かりません。]]

疑問文がそのまま従属節に入る形です（第27.6章）。quel の一致は変わりません。

**（2）n'importe quel — どんな〜でも**

[[Tu peux venir à n'importe quelle heure.\|チュ・プ・ヴニール・ア・ナンポルト・ケ・ルール\|何時に来てもいいよ。]]

n'importe（どれでも構わない）+ quel で「任意の」を表します。第10.5章の n'importe qui / quoi と同じ仲間です。

**（3）quel que + être の接続法 — 〜がどうであれ**

[[Quel que soit le prix, j'achète.\|ケル・ク・ソワ・ル・プリ・ジャシェット\|値段がどうであれ、買います。]]

書き言葉寄りの譲歩表現で、quel は主語（le prix）に性数一致します。第31.5章で扱います。
:::

### 会話の中の ce — 時間表現と決まり文句

指示形容詞は時間表現で独特の働きをします。

| 表現 | 意味 |
|---|---|
| **ce matin / ce soir** | 今朝／今晩 |
| **cet après-midi** | 今日の午後 |
| **cette semaine / cette année** | 今週／今年 |
| **ces jours-ci** | ここのところ、近ごろ |
| **ce jour-là** | その日（物語の中で） |
| **à cette époque-là** | あの当時 |
| **un de ces jours** | そのうちに |

:::ex 時間の ce
Tu fais quoi ce soir ? | チュ・フェ・コワ・ス・ソワール | 今晩なにするの？
Il fait froid ces jours-ci. | イル・フェ・フロワ・セ・ジュール・スィ | 近ごろ寒いね。
Ce jour-là, tout a changé. | ス・ジュール・ラ・トゥ・タ・シャンジェ | その日、すべてが変わった。
On se voit un de ces jours ! | オン・ス・ヴォワ・アン・ドゥ・セ・ジュール | そのうち会おうね！
:::

**-ci は「現在に近い」、-là は「現在から遠い」**という対立が時間にも生きています。ces jours-**ci**（ここ数日＝今に近い）、ce jour-**là**（その日＝過去の一点）。物語で「その日」「その晩」と言うときは必ず -là が付きます。

## 4. 限定詞は重ねられない

:::warn 限定詞は名詞ひとつにつき1個だけ
冠詞・指示形容詞・所有形容詞・疑問形容詞は、**すべて限定詞という同じ枠を争います**。だから重ねられません。

- × le mon livre
- × ce mon livre
- × un ce livre

英語の a friend of mine のような表現は、フランス語では **de + 強勢形** を使います。
[[un ami à moi\|アン・ナミ・ア・モワ\|私の友人の一人]]、[[un de mes amis\|アン・ドゥ・メ・ザミ\|私の友人の一人]]

なお **tout** だけは限定詞の前に置けます（tout は限定詞ではなく数量詞のため）。
[[tous mes amis\|トゥ・メ・ザミ\|私の友人全員]]、[[toute la journée\|トゥット・ラ・ジュルネ\|一日中]]
:::

## 5. 「誰の？」に答える3つの言い方

所有形容詞の周辺には、「誰のものか」を言う表現がそろっています。

| 言い方 | 例 | 場面 |
|---|---|---|
| **C'est à + 強勢形** | C'est à moi. | 会話の既定（第19章） |
| **être à + 名詞** | Ce vélo est à Paul. | 〜のものだ |
| **celui / celle de + 名詞** | C'est celui de Marie. | 「マリの（それ）」 |
| **appartenir à** | Ce château appartient à l'État. | 改まった「所属」 |

:::ex 「誰の？」のやり取り
C'est à qui, ce parapluie ? | セ・タ・キ・ス・パラプリュイ | この傘、誰の？
C'est à moi. / C'est le mien. | セ・タ・モワ・セ・ル・ミヤン | 私の。／私のです。
Ce n'est pas le mien, c'est celui de Paul. | ス・ネ・パ・ル・ミヤン・セ・スリュイ・ドゥ・ポール | 私のじゃなくて、ポールのだよ。
À qui sont ces clés ? | ア・キ・ソン・セ・クレ | この鍵は誰の？
:::

**le mien / la mienne / les miens / les miennes**（私のもの）は所有代名詞と呼ばれ、「所有形容詞 + 名詞」のかたまりを1語で受けます。

| 所有者 | 男性単数 | 女性単数 | 男性複数 | 女性複数 |
|---|---|---|---|---|
| 私の | le mien | la mienne | les miens | les miennes |
| 君の | le tien | la tienne | les tiens | les tiennes |
| 彼・彼女の | le sien | la sienne | les siens | les siennes |
| 私たちの | le nôtre | la nôtre | les nôtres | les nôtres |
| あなたの | le vôtre | la vôtre | les vôtres | les vôtres |
| 彼らの | le leur | la leur | les leurs | les leurs |

notre / votre と le nôtre / le vôtre で **ô の有無（と発音）が変わる**点に注意してください（notre「ノトル」→ le nôtre「ル・ノートル」）。会話では C'est à moi. で足りることが多いのですが、**「私のはこっち、君のはそっち」と対比するとき**は所有代名詞が必要になります：Le mien est bleu, le tien est rouge.（私のは青、君のは赤）。

## 6. 3系列を並べて確認する

同じ名詞に、4種類の限定詞を付け替えてみます。

| 限定詞 | 男性名詞 livre | 女性名詞 table |
|---|---|---|
| 定冠詞 | le livre | la table |
| 不定冠詞 | un livre | une table |
| 指示 | ce livre | cette table |
| 所有（私の） | mon livre | ma table |
| 疑問 | quel livre | quelle table |

:::ex 限定詞を入れ替える
J'aime ce livre. | ジェーム・ス・リーヴル | 私はこの本が好きだ。
J'aime mon livre. | ジェーム・モン・リーヴル | 私は自分の本が好きだ。
Quel livre aimes-tu ? | ケル・リーヴル・エム・テュ | 君はどの本が好き？
:::


:::ai-gen 指示形容詞、所有形容詞、疑問形容詞 quel

## 8. 指示代名詞 celui — 「〜のほう」を言う

指示形容詞 ce に対応する**代名詞**が celui です。「そちらの／〜のもの」を1語で表します。

| | 男性単数 | 女性単数 | 男性複数 | 女性複数 |
|---|---|---|---|---|
| 基本形 | **celui** | **celle** | **ceux** | **celles** |
| -ci（こちら） | celui-ci | celle-ci | ceux-ci | celles-ci |
| -là（あちら） | celui-là | celle-là | ceux-là | celles-là |

**基本形は単独では使えず**、必ず次の3つのどれかが続きます。

| 続くもの | 例 |
|---|---|
| **-ci / -là** | Je préfère **celui-là**.（あっちのほうが好き） |
| **de + 名詞** | C'est **celle de** Marie.（それはマリのだ） |
| **関係代名詞** | **Ceux qui** veulent partir, levez la main.（帰りたい人は挙手を） |

:::ex celui の実戦
Quel manteau ? — Celui-ci ou celui-là ? | セリュイ・スィ・ウ・セリュイ・ラ | どのコート？ — こっち、それともあっち？
Ma voiture est en panne, je prends celle de ma sœur. | ジュ・プラン・セル・ドゥ・マ・スール | 車が故障したので姉のを借りる。
Ceux qui sont d'accord, levez la main. | ス・キ・ソン・ダコール | 賛成の人は手を挙げて。
Ce livre est plus intéressant que celui que j'ai lu hier. | ク・セリュイ・ク・ジェ・リュ・イエール | この本は昨日読んだものより面白い。
:::

**Ceux qui …**（〜する人々）は演説・説明文の頻出表現です。また比較文（第14章）では、**que celui / celle** で「〜より、あの…より」と受け直すのが標準の言い方になります。

なお中性の指示代名詞 **ce / ceci / cela / ça** は名詞を受けず、**事柄**を指します（第4章）。celui は必ず名詞を受ける——ここが決定的な違いです。

FR.chapter({

  body: `
{lead}第10章までで、名詞に付く語をひととおり見ました。冠詞（第2章）、形容詞（第6章）、そして指示・疑問・所有形容詞（第10章）です。名詞のまわりに置ける語のうち、まだ扱っていない最後の大きなグループが**不定辞（les indéfinis）**——**tout, chaque, quelque, plusieurs, certain, autre, même, aucun** などです。

これらは「不定」と呼ばれますが、**数量や同一性が特定されていない**という意味であって、意味が曖昧なわけではありません。むしろ「全部」「それぞれ」「一部」「別の」「同じ」といった、日常のあらゆる文に出てくる語です。

この章が難しいのは、次の3つの事情が重なるからです。

- **同じ語が形容詞にも代名詞にもなる**（tout, certain, autre, aucun …）。形容詞なら名詞に付き、代名詞なら名詞の代わりに立ちます
- **位置で意味が変わる**（un **certain** homme と un homme **certain**、le **même** jour と le jour **même**）
- **性数変化が語ごとにバラバラ**（chaque は不変化、plusieurs は性の区別なし、tout は4形）

したがって、語ごとに「形容詞か代名詞か」「変化するか」「どこに置くか」の3点を確定させながら進めます。

## 1. 不定辞の全体像

まず一覧で見取り図を作ります。表の左が形容詞用法、右が代名詞用法です。

| 意味 | 形容詞 | 代名詞 |
|---|---|---|
| 全部 | **tout / toute / tous / toutes** | **tout**（中性）、**tous / toutes**（人） |
| それぞれ | **chaque**（不変化） | **chacun / chacune** |
| いくつかの | **quelque / quelques** | **quelqu'un**、**quelques-uns / quelques-unes** |
| 複数の | **plusieurs**（性の区別なし） | **plusieurs** |
| 一部の | **certains / certaines** | **certains / certaines** |
| 別の | **autre / autres** | **un autre / l'autre / les autres / d'autres** |
| 同じ | **même / mêmes** | **le même / la même / les mêmes** |
| どれも〜ない | **aucun / aucune**、**nul / nulle** | **aucun / aucune**、**personne**、**rien** |
| そのような | **tel / telle / tels / telles** | **tel** |

**tout だけは副詞用法も持ちます**（第6.5章§6）。1語で形容詞・代名詞・副詞の3役をこなす、フランス語で最も多機能な語です。

## 2. tout — 最重要の不定辞

### （1）形容詞の tout — 全体を指す

**tout + 限定詞（定冠詞・指示形容詞・所有形容詞）+ 名詞** の形で「〜の全部」を表します。

| 形 | 使う場面 | 例 |
|---|---|---|
| **tout** | 男性単数 | **tout** le monde（みんな）、**tout** l'été（夏じゅう） |
| **toute** | 女性単数 | **toute** la journée（一日じゅう）、**toute** ma vie（生涯） |
| **tous** | 男性複数 | **tous** les jours（毎日）、**tous** mes amis（友達全員） |
| **toutes** | 女性複数 | **toutes** les nuits（毎晩）、**toutes** ces filles |

:::ex 形容詞の tout
Tout le monde est arrivé. | トゥ・ル・モンド・エ・タリヴェ | 全員が到着した。
J'ai travaillé toute la journée. | ジェ・トラヴァイエ・トゥット・ラ・ジュルネ | 一日じゅう働いた。
Il vient tous les jours. | イル・ヴィヤン・トゥ・レ・ジュール | 彼は毎日来る。
Toutes mes amies sont venues. | トゥット・メ・ザミ・ソン・ヴニュ | 友達（女性）が全員来た。
:::

:::warn tous の発音は用法で変わる
綴りが同じ tous でも、**形容詞なら [tu]「トゥ」、代名詞なら [tus]「トゥス」**と読みます。

- **形容詞** — Il vient **tous** les jours.「トゥ・レ・ジュール」（s は発音しない）
- **代名詞** — Ils sont **tous** venus.「トゥス・ヴニュ」（s を発音する）

フランス語は語末の子音を読まないのが原則ですが、**代名詞は単独で立つので、聞き分けのために s を発音します**。第0章で学んだ「語末の子音は読まない」の、数少ない体系的な例外です。

toutes は形容詞でも代名詞でも「トゥット」で変わりません（女性形の e があるので t が読まれる）。
:::

### （2）tout + 無冠詞単数名詞 — 「あらゆる」

限定詞を挟まず**直接名詞に付く**と、意味が「全体」から「あらゆる〜、どんな〜も」に変わります。やや改まった言い方で、法律・格言・掲示に多く現れます。

:::ex tout + 無冠詞名詞
Tout homme est mortel. | トゥ・トム・エ・モルテル | 人はみな死すべきものである。
Toute vérité n'est pas bonne à dire. | トゥット・ヴェリテ・ネ・パ・ボンヌ・ア・ディール | 真実がすべて言うべきものとは限らない。
En tout cas, il faut partir. | アン・トゥ・カ・イル・フォ・パルティール | いずれにせよ出発しなければ。
Tout achat est définitif. | トゥ・タシャ・エ・デフィニティフ | 全ての購入は最終です。
:::

**tous les hommes**（すべての人間＝集合の全体）と **tout homme**（どんな人間も＝任意の一人）は、論理学でいう全称の2つの表し方に対応します。前者が集合を一括して指すのに対し、後者は「どれを取っても」という視点です。

### （3）代名詞の tout

| 形 | 指すもの | 例 |
|---|---|---|
| **tout** | 中性「すべてのこと・もの」 | **Tout** va bien.（すべて順調だ） |
| **tous** [tus] | 男性の人「全員」 | **Tous** sont venus. |
| **toutes** | 女性の人「全員」 | **Toutes** sont parties. |

:::ex 代名詞の tout
Tout est prêt. | トゥ・テ・プレ | すべて準備できている。
Je comprends tout. | ジュ・コンプラン・トゥ | 全部わかる。
Ils sont tous d'accord. | イル・ソン・トゥス・ダコール | 彼らは全員賛成だ。
Nous les avons toutes vues. | ヌー・レ・ザヴォン・トゥット・ヴュ | 私たちは彼女たち全員に会った。
:::

:::warn 代名詞 tout / tous の位置
代名詞の tout は、**主語を受けるときも動詞の後ろに置かれる**という独特の語順をとります。

- **Ils sont tous venus.**（彼らは全員来た）→ 助動詞の後ろ
- **Tous sont venus.**（全員が来た）→ 主語の位置に単独で立つ場合

主語 ils と同格で「全員」と言うときは、**助動詞と過去分詞の間**に入ります。副詞 beaucoup や déjà と同じ位置です（第6.5章§6）。

目的語を受ける場合も同じです。

- J'ai **tout** compris.（全部わかった）→ × J'ai compris tout
- Je les ai **tous** vus.（彼ら全員に会った）

**tout / tous は複合時制では助動詞と過去分詞の間**——例外の少ない規則です。
:::

### （4）tout を含む慣用表現

| 表現 | 意味 |
|---|---|
| **tout le monde** | みんな（動詞は**単数**） |
| **tout à fait** | まったく、完全に |
| **tout de suite** | すぐに |
| **tout à coup** | 突然 |
| **tout de même** | それでも |
| **pas du tout** | 全然〜ない |
| **tous les deux** | 二人とも |
| **en tout cas** | いずれにせよ |
| **avant tout** | 何よりもまず |
| **après tout** | 結局 |

:::warn tout le monde は単数扱い
「みんな」という意味ですが、**文法上は男性単数**です。動詞も単数、受ける代名詞も単数になります。

- ○ **Tout le monde est** content.（× sont）
- ○ Tout le monde a **son** avis.（× leur avis — 標準語では son）

英語の *everybody is* と同じ扱いです。日本語の「みんな」に引きずられて複数にしないよう注意してください。
:::

## 3. chaque と chacun — 個別に取り上げる

| 語 | 品詞 | 変化 | 例 |
|---|---|---|---|
| **chaque** | 形容詞のみ | **不変化・常に単数** | chaque jour（毎日） |
| **chacun / chacune** | 代名詞のみ | 性のみ変化 | chacun de nous（私たちのそれぞれ） |

:::ex chaque と chacun
Chaque étudiant a un livre. | シャク・エテュディヤン・ア・アン・リーヴル | それぞれの学生が本を1冊持っている。
Chaque fois que je le vois, il sourit. | シャク・フォワ・ク・ジュ・ル・ヴォワ・イル・スリ | 彼に会うたび、彼は微笑む。
Chacun a ses défauts. | シャカン・ア・セ・デフォ | 誰にでも欠点はある。
Chacune de ces filles est douée. | シャキュヌ・ドゥ・セ・フィーユ・エ・ドゥエ | この娘たちのそれぞれが才能に恵まれている。
:::

:::warn chaque は名詞なしでは使えない
**chaque は形容詞専用**なので、後ろに必ず名詞が要ります。名詞なしで「それぞれ」と言うときは chacun / chacune に変えます。

- ○ **Chaque** étudiant a un livre.
- × **Chaque** a un livre. → ○ **Chacun** a un livre.

また chaque は**冠詞と共存できません**（× le chaque jour）。日常会話では chaque の代わりに tous les を使うことも多く、**chaque jour** と **tous les jours** はほぼ同義です。ただし chaque は「1つ1つを取り上げる」、tous les は「まとめて全部」という含みの差があります。
:::

:::deep chacun と所有形容詞の呼応 — 文法家が争ってきた点
「めいめいが自分の意見を持っている」をどう書くか。

- Chacun a **son** opinion.（chacun を受けて3人称単数）
- Chacun a **leur** opinion.（文脈上の複数を受ける）

**単独で使われた chacun には son / sa / ses** を使うのが規範です。しかし「私たちのそれぞれ」のように複数が前提のときは、実際には notre / leur も現れます。

- Nous avons chacun **notre** avis.（私たちはそれぞれ自分の意見を持っている）
- Ils sont partis chacun de **son** côté. / chacun de **leur** côté.（どちらも通用する）

試験や作文では **chacun … son** を選べば安全です。
:::

## 4. quelque 系 — 「いくつかの」「誰か」「何か」

### （1）形容詞 quelque / quelques

| 形 | 意味 | 例 |
|---|---|---|
| **quelque** + 単数 | なんらかの（書き言葉） | quelque temps（しばらく） |
| **quelques** + 複数 | いくつかの、数個の | quelques livres（数冊の本） |

日常でよく使うのは**複数形の quelques** です。単数の quelque は文語的で、慣用句（quelque part, quelque chose, quelque temps）以外ではあまり使いません。

### （2）代名詞 quelqu'un / quelques-uns

| 代名詞 | 意味 |
|---|---|
| **quelqu'un** | 誰か（男女共通・単数） |
| **quelqu'une** | 誰か（女性・まれ） |
| **quelques-uns / quelques-unes** | そのうちの何人か・いくつか |
| **quelque chose** | 何か |
| **quelque part** | どこかに |

:::ex quelque 系
Quelqu'un a frappé à la porte. | ケルカン・ア・フラペ・ア・ラ・ポルト | 誰かがドアをノックした。
J'ai quelques questions. | ジェ・ケルク・ケスチョン | いくつか質問があります。
J'ai lu quelques-uns de ces livres. | ジェ・リュ・ケルク・ザン・ドゥ・セ・リーヴル | この本のうち何冊かを読んだ。
Il y a quelque chose sur la table. | イ・リ・ヤ・ケルク・ショーズ・スュール・ラ・ターブル | テーブルの上に何かがある。
Je l'ai vu quelque part. | ジュ・レ・ヴュ・ケルク・パール | どこかで彼を見た。
:::

:::warn quelque chose de + 形容詞 — de の挿入
不定代名詞に形容詞を付けるときは、**間に de を入れ、形容詞は男性単数形**にします。この de は省略できません。

| 表現 | 例 |
|---|---|
| quelque chose **de** + 形容詞 | quelque chose **de** beau（何か美しいもの） |
| quelqu'un **de** + 形容詞 | quelqu'un **de** gentil（誰か親切な人） |
| rien **de** + 形容詞 | rien **de** nouveau（新しいことは何もない） |
| personne **de** + 形容詞 | personne **de** sérieux（まじめな人は誰も） |
| autre chose **de** + 形容詞 | autre chose **de** meilleur（何か別のもっと良いもの） |

:::ex de + 男性単数形の形容詞
J'ai vu quelque chose d'étrange. | ジェ・ヴュ・ケルク・ショーズ・デトランジュ | 何か奇妙なものを見た。
C'est quelqu'un de très sérieux. | セ・ケルカン・ドゥ・トレ・セリユー | とてもまじめな人です。
Il n'y a rien de nouveau. | イル・ニ・ヤ・リヤン・ドゥ・ヌーヴォ | 新しいことは何もない。
Je cherche quelque chose de moins cher. | ジュ・シェルシュ・ケルク・ショーズ・ドゥ・モワン・シェール | もっと安いものを探している。
:::

**形容詞は常に男性単数**です。quelque chose は文法上の性を持たない中性的な語なので、一致のしようがなく、既定値の男性単数が使われます。× quelque chose de belle は誤りです。
:::

## 5. plusieurs と certains — 数量の中間

### plusieurs

**「いくつもの、何人もの」**。常に複数で、**性の区別がありません**（plusieurs 1形のみ）。形容詞にも代名詞にもなります。

:::ex plusieurs
J'ai plusieurs amis à Paris. | ジェ・プリュズィヨール・ザミ・ア・パリ | パリに何人も友達がいる。
Plusieurs sont venus. | プリュズィヨール・ソン・ヴニュ | 何人も来た。
Il a plusieurs raisons de partir. | イ・ラ・プリュズィヨール・レゾン・ドゥ・パルティール | 彼には出発する理由がいくつもある。
:::

quelques（2〜3の少数）よりも多く、beaucoup de（多数）よりは少ない——という位置づけです。

### certain

**位置で意味が変わる**代表的な語です。

| 位置 | 意味 | 例 |
|---|---|---|
| **名詞の前**（un certain） | ある〜、なんらかの | **un certain** homme（ある男） |
| **名詞の前**（certains, 複数） | 一部の | **certains** étudiants（一部の学生） |
| **名詞の後** | 確実な | une chose **certaine**（確かなこと） |

:::ex certain の位置による意味差
Un certain Monsieur Dupont vous demande. | アン・セルタン・ムスュ・デュポン・ヴ・ドゥマンド | デュポンさんという方がお呼びです。
Certains pensent que c'est faux. | セルタン・パンス・ク・セ・フォ | 一部の人はそれが間違いだと思っている。
C'est une chose certaine. | セ・チュヌ・ショーズ・セルテヌ | それは確かなことだ。
Il a un certain charme. | イ・ラ・アン・セルタン・シャルム | 彼にはある種の魅力がある。
:::

:::deep 位置で意味が変わる形容詞のグループ
certain は、第6章で扱った「位置で意味が変わる形容詞」の仲間です。まとめて確認しておきましょう。

| 形容詞 | 名詞の前 | 名詞の後 |
|---|---|---|
| **certain** | ある〜 | 確実な |
| **ancien** | 元〜、前の | 古代の、古い |
| **propre** | 自分自身の | 清潔な |
| **cher** | 親愛なる | 高価な |
| **grand** | 偉大な | 背が高い |
| **pauvre** | かわいそうな | 貧しい |
| **dernier** | 最後の | 前の（le mois dernier） |
| **seul** | ただ一つの | 孤独な |

**前に置くと主観的・比喩的、後ろに置くと客観的・本来的**——これが一貫した原理です。フランス語の形容詞は本来「名詞の後」が基本位置なので、**前に出すことが「ふつうでない読み方をせよ」という合図**になります。
:::

## 6. autre — 「別の」

autre は形容詞にも代名詞にもなり、**冠詞との組み合わせで意味が細かく分かれます**。

| 形 | 意味 | 例 |
|---|---|---|
| **un autre / une autre** | もう一つ別の（不特定） | Donnez-moi **un autre** livre. |
| **l'autre** | もう一方の（2つのうち） | **L'autre** est meilleur. |
| **les autres** | 他の人たち・もの（残り全部） | **Les autres** sont partis. |
| **d'autres** | 他のいくつか（不特定複数） | J'ai vu **d'autres** films. |
| **autre chose** | 別のこと | Parlons **d'autre chose**. |
| **autrui** | 他人（文語・格言） | le bien **d'autrui** |

:::ex autre の各形
Je voudrais un autre café. | ジュ・ヴドレ・アン・ノートル・カフェ | コーヒーをもう一杯ください。
L'un est grand, l'autre est petit. | ラン・エ・グラン・ロートル・エ・プティ | 一方は大きく、もう一方は小さい。
Les autres ne sont pas encore arrivés. | レ・ゾートル・ヌ・ソン・パ・ザンコール・アリヴェ | 他の人たちはまだ着いていない。
Il faut penser aux autres. | イル・フォ・パンセ・オー・ゾートル | 他人のことを考えなければ。
:::

:::warn des autres と d'autres
不定冠詞の des は、**形容詞が名詞の前に来ると de に縮まります**（第2章）。したがって、

- ○ J'ai vu **d'autres** films.（他の映画を何本か見た）→ 不定冠詞 des + autres
- ○ J'ai vu les films **des autres**.（他の人たちの映画を見た）→ de + les autres（縮約）

**d'autres は「他のいくつか」、des autres は「他の人たちの」**。前者は形容詞、後者は de + 定冠詞 + 代名詞です。書き分けを間違えると意味が変わります。
:::

:::deep l'un … l'autre — 相互を表す言い方
「互いに」を明示するときに使う構文です。代名動詞（第23章）の相互的用法と組み合わせて現れます。

| 表現 | 意味 |
|---|---|
| **l'un … l'autre** | 一方は…もう一方は |
| **l'un l'autre** | 互いに（直接目的） |
| **l'un à l'autre** | 互いに（間接目的） |
| **les uns … les autres** | ある者たちは…他の者たちは |
| **les uns les autres** | 互いに（複数） |

- Ils s'aiment **l'un l'autre**.（二人は愛し合っている）
- Ils se parlent **l'un à l'autre**.（二人は互いに話す）

動詞が取る前置詞（第7.5章）に合わせて、l'autre の前に à や de が入ります。parler **à** qn なので l'un **à** l'autre、se moquer **de** qn なので l'un **de** l'autre。**動詞の語法がここでも効いてきます。**
:::

## 7. même — 位置で3つの意味

même は**置く場所によって意味がまったく変わる**、この章で最も注意を要する語です。

| 位置 | 品詞 | 意味 | 例 |
|---|---|---|---|
| **限定詞 + même + 名詞** | 形容詞 | 同じ | **le même** jour（同じ日） |
| **名詞 + même** | 形容詞 | 〜そのもの、まさに | le jour **même**（まさにその日） |
| **強勢形 + -même** | 形容詞 | 〜自身 | moi-**même**（私自身） |
| **文中の任意の位置** | 副詞（不変化） | 〜さえ | **Même** lui est venu.（彼さえ来た） |

:::ex même の4用法
Nous avons le même âge. | ヌー・ザヴォン・ル・メーム・アージュ | 私たちは同い年だ。
Il est parti le jour même. | イ・レ・パルティ・ル・ジュール・メーム | 彼はまさにその日に発った。
Je l'ai fait moi-même. | ジュ・レ・フェ・モワ・メーム | 私が自分でやった。
Même les enfants le savent. | メーム・レ・ザンファン・ル・サーヴ | 子どもでさえそれを知っている。
:::

:::warn 副詞の même は一致しない
副詞用法の même は**不変化**です。形容詞用法は複数で mêmes になります。

- 形容詞：Ce sont les **mêmes** livres.（同じ本だ）→ 複数なので s
- 副詞：**Même** les enfants comprennent.（子どもでさえ理解する）→ 不変化

強勢形と組む -même も、強勢形が複数なら -mêmes になります：nous-**mêmes**、eux-**mêmes**、vous-**mêmes**。ただし vous が単数の敬称なら vous-**même**（s なし）です。相手が一人か複数かで綴りが変わる、珍しい箇所です。
:::

## 8. 否定の不定辞 — aucun, nul, personne, rien

これらは**ne とセットで否定の枠を作ります**（第5章）。

| 語 | 品詞 | 意味 | 例 |
|---|---|---|---|
| **aucun / aucune** | 形容詞・代名詞 | どの〜も〜ない | Je n'ai **aucune** idée. |
| **nul / nulle** | 形容詞・代名詞 | 誰も〜ない（文語） | **Nul** n'est parfait. |
| **personne** | 代名詞 | 誰も〜ない | Je n'ai vu **personne**. |
| **rien** | 代名詞 | 何も〜ない | Je n'ai **rien** vu. |
| **nulle part** | 副詞句 | どこにも〜ない | Je ne le vois **nulle part**. |

:::ex 否定の不定辞
Je n'ai aucune idée. | ジュ・ネ・オキュヌ・イデ | まったく見当がつかない。
Aucun étudiant n'est venu. | オキュン・ネテュディヤン・ネ・ヴニュ | どの学生も来なかった。
Personne n'est parfait. | ペルソンヌ・ネ・パルフェ | 完璧な人はいない。
Rien ne va aujourd'hui. | リヤン・ヌ・ヴァ・オジュルデュイ | 今日は何もうまくいかない。
Je ne l'ai trouvé nulle part. | ジュ・ヌ・レ・トルヴェ・ニュル・パール | どこにも見つからなかった。
:::

:::warn rien と personne は複合時制で位置が違う
どちらも否定の代名詞ですが、**複合過去での位置が逆**です。

- Je n'ai **rien** vu.（何も見なかった）→ 助動詞と過去分詞の**間**
- Je n'ai vu **personne**.（誰にも会わなかった）→ 過去分詞の**後**

理由は語の長さと重さです。rien は pas と同じ扱いの軽い語なので枠の中に収まりますが、personne は名詞由来の重い語なので後ろに回ります。**rien は pas と同じ位置、personne は目的語の位置**と覚えてください。

同じ理由で、nulle part も過去分詞の後ろです：Je ne l'ai trouvé **nulle part**.

主語として使う場合はどちらも文頭で、**ne は残ります**（pas は付きません）。

- **Personne n'**est venu.（誰も来なかった）
- **Rien n'**a changé.（何も変わらなかった）
:::

:::deep aucun が複数形を持つ理由
aucun は「どれも〜ない」なので論理的には単数のはずですが、**aucuns / aucunes という複数形が存在します**。使われるのは、**複数形しかない名詞**に付くときだけです。

- sans **aucuns** frais（何の費用もかからずに）— frais は複数形のみの名詞
- **aucunes** vacances（休暇がまったくない）— vacances も複数形のみ

これ以外で aucuns を使うことはありません。試験ではまず問われませんが、読解で出会ったときに誤植と思わないための知識です。

なお、**aucun は肯定文で「なんらかの」の意味**を持つこともあります（文語）：Je doute qu'**aucun** y parvienne.（誰かがそこに到達するとは思えない）。ne を伴わないこの用法は現代語ではほぼ消えています。
:::

## 9. n'importe 系 — 「どれでもいい」

**n'importe + 疑問詞**で「なんでも／誰でも／どこでも」を表します。組み立てが規則的なので、まとめて覚えられます。

| 表現 | 意味 |
|---|---|
| **n'importe qui** | 誰でも |
| **n'importe quoi** | 何でも |
| **n'importe quel / quelle** + 名詞 | どんな〜でも |
| **n'importe lequel** | どれでも |
| **n'importe où** | どこでも |
| **n'importe quand** | いつでも |
| **n'importe comment** | どんなふうにでも |

:::ex n'importe 系
N'importe qui peut le faire. | ナンポルト・キ・プー・ル・フェール | 誰にでもできる。
Il dit n'importe quoi. | イル・ディ・ナンポルト・コワ | 彼はでたらめを言っている。
Prends n'importe quel livre. | プラン・ナンポルト・ケル・リーヴル | どの本でもいいから取って。
Appelle-moi n'importe quand. | アペル・モワ・ナンポルト・カン | いつでも電話して。
:::

**Il dit n'importe quoi.** は「何でも言う」ではなく「でたらめを言う」という定型表現です。n'importe quoi は単独で「でたらめ、めちゃくちゃ」の意味で使われます（C'est n'importe quoi ! めちゃくちゃだ！）。

## 10. on — 不定代名詞としての人称

第3章で主語代名詞として学んだ **on** も、本来は不定代名詞です。語源はラテン語 **homo**（人）で、フランス語の名詞 **homme** と同じ語です。「人が」という意味の名詞が代名詞化しました。

| 用法 | 例 | 意味 |
|---|---|---|
| 不特定の人 | **On** dit que … | 〜と言われている |
| 話し手を含む一般論 | **On** ne sait jamais. | 何が起こるか分からない |
| nous の代わり（話し言葉） | **On** y va ! | 行こう！ |
| 受動の代わり | **On** a construit ce pont en 1900. | この橋は1900年に建てられた |

:::warn on の動詞は常に3人称単数
on が「私たち」の意味でも、**動詞は必ず3人称単数**です。

- ○ **On est** fatigués.（私たちは疲れている）
- × On sont fatigués.

ただし**属詞の形容詞は意味上の主語に一致**することがあります（fatigués と複数）。これは「文法の一致」と「意味の一致」がずれる有名な例で、規範文法では単数（fatigué）、実際の用法では複数（fatigués）がどちらも見られます。

受動態の代わりに on を使うのはフランス語の重要な特徴です。英語なら *This bridge was built in 1900* と受動にするところを、フランス語は **On a construit ce pont en 1900.** と能動で表すほうが自然です（第28章）。
:::

## 11. tel — 「そのような」

| 表現 | 意味 | 例 |
|---|---|---|
| **un tel / une telle** | そのような | **une telle** chose（そんなこと） |
| **de tels / de telles** | そのような（複数） | **de tels** problèmes |
| **tel que** | 〜のような | un homme **tel que** lui |
| **tel quel** | そのままで | Laisse-le **tel quel**. |

:::ex tel
Je n'ai jamais vu une telle chose. | ジュ・ネ・ジャメ・ヴュ・ユヌ・テル・ショーズ | そんなものは見たことがない。
Un homme tel que lui ne ment pas. | アン・ノム・テル・ク・リュイ・ヌ・マン・パ | 彼のような人は嘘をつかない。
Laisse les choses telles quelles. | レス・レ・ショーズ・テル・ケル | 物事をそのままにしておきなさい。
:::

**tel は付く名詞に性数一致します**（tel / telle / tels / telles）。tel quel は「そのままの状態で」という慣用句で、両方が一致します（telle quelle, tels quels, telles quelles）。

## 12. よくある誤りのまとめ

:::warn 日本語話者がやりがちな10の誤り
| × | ○ | 理由 |
|---|---|---|
| Tout le monde sont contents. | Tout le monde **est** content. | tout le monde は男性単数（§2-4） |
| Chaque a un livre. | **Chacun** a un livre. | chaque は形容詞専用（§3） |
| le chaque jour | **chaque** jour | chaque は冠詞と共存しない（§3） |
| quelque chose de belle | quelque chose de **beau** | 形容詞は男性単数（§4-2） |
| quelque chose intéressant | quelque chose **d'**intéressant | de の挿入が必要（§4-2） |
| J'ai compris tout. | J'ai **tout** compris. | tout は助動詞と過去分詞の間（§2-3） |
| Je n'ai personne vu. | Je n'ai vu **personne**. | personne は過去分詞の後（§8） |
| Je n'ai vu rien. | Je n'ai **rien** vu. | rien は助動詞と過去分詞の間（§8） |
| Même**s** les enfants … | **Même** les enfants … | 副詞の même は不変化（§7） |
| J'ai vu des autres films. | J'ai vu **d'**autres films. | des + 前置形容詞は de に（§6） |
:::

## 13. 不定辞と動詞の一致

不定辞が主語になったときの動詞の形を確認しておきましょう。

:::conj être present,passeCompose

| 主語 | 動詞 | 例 |
|---|---|---|
| tout le monde | **単数** | Tout le monde **est** là. |
| tout（中性） | **単数** | Tout **va** bien. |
| tous / toutes | **複数** | Tous **sont** venus. |
| chacun / chacune | **単数** | Chacun **a** son avis. |
| chaque + 名詞 | **単数** | Chaque étudiant **travaille**. |
| plusieurs | **複数** | Plusieurs **sont** absents. |
| quelqu'un | **単数** | Quelqu'un **a** frappé. |
| personne / rien | **単数** | Personne **n'est** venu. |
| aucun + 名詞 | **単数** | Aucun étudiant **n'est** venu. |

:::drill être,avoir,venir,partir present,passeCompose

  title: 'aller / venir',
  sub: '近い未来・近い過去',
  body: `
{lead}[[aller|アレ|行く]] と [[venir|ヴニール|来る]] は、移動を表す基本動詞です。しかしフランス語でこの2語が重要なのは、移動の意味以上に、**時制を作る道具として使われる**からです。

- **aller + 不定詞** → 近接未来（これから〜する）
- **venir de + 不定詞** → 近接過去（〜したばかりだ）

活用を1つ覚えるだけで、まだ習っていない未来と過去を表現できるようになります。実際の会話では、単純未来（第24章）より近接未来のほうが頻繁に使われます。

さらにこの章では、日本語話者がつまずきやすい2つの語法も扱います。**「行く／来る」の視点が日本語と逆になる場面**（呼ばれたときの「今行く！」は J'arrive ! / Je viens !）と、**「連れて行く／持って行く」の動詞群**（amener / emmener / apporter / emporter）です。どちらもネイティブが毎日使う領域で、教科書では後回しにされがちですが、移動の章であるここでまとめて片づけます。

## 1. aller の活用

:::conj aller présent

:::warn aller は -er で終わるが第1群ではない
第8章で予告したとおりです。**フランス語で最も不規則な動詞の1つ**で、活用形が3つの異なる語幹から来ています。

- **v-** 系：vais, vas, va, vont（ラテン語 vadere「進む」から）
- **all-** 系：allons, allez（ラテン語 ambulare「歩く」から）
- **ir-** 系：単純未来 j'irai（ラテン語 ire「行く」から）

つまり aller は、**3つの別々のラテン語動詞が1つに合流した**動詞です。英語の go / went（go と wend の合流）と同じ現象で、補充法（le supplétisme）と呼ばれます。最頻出の動詞ほどこうなりやすい、という言語の一般的な傾向です。

vais / vas / va / vont の4形が同じ v- 系であることに注目してください。**英語の go too: I'm going to ≒ je vais** と、be 動詞なみに崩れた活用を持つのは、それだけ使われてきた証拠です。
:::

:::ex aller の基本用法
Je vais à Paris. | ジュ・ヴェ・ザ・パリ | 私はパリへ行く。
Tu vas au cinéma ? | テュ・ヴァ・オ・スィネマ | 映画館に行くの？
Nous allons à l'école. | ヌー・ザロン・ザ・レコール | 私たちは学校へ行く。
Comment allez-vous ? | コマン・タレ・ヴー | ごきげんいかがですか？
Ça va ? — Ça va bien. | サ・ヴァ・サ・ヴァ・ビアン | 元気？ — 元気だよ。
:::

:::note aller は「体調」も表す
[[Comment ça va ?|コマン・サ・ヴァ|調子はどう？]] や [[Ça va.|サ・ヴァ|大丈夫。]] の va は aller です。「（物事が）進む」→「うまくいっている」という比喩から来ています。

フランス語で最も使われる挨拶なので、活用そのものより先に慣れてしまう表現です。返し方には段階があります。

- [[Ça va très bien, merci.|サ・ヴァ・トレ・ビアン・メルスィ|とても元気です、ありがとう。]]
- [[Ça va.|サ・ヴァ|まあまあ。]]（実はこれが一番多い）
- [[Bof, ça va comme ci comme ça.|ボフ・サ・ヴァ・コム・スィ・コム・サ|うーん、ぼちぼちかな。]]
:::

### aller の複合過去 — être を取る

aller は**移動の自動詞なので助動詞は être** です（第20章）。過去分詞 allé は主語に一致します。

:::ex aller の複合過去
Je suis allé au marché. | ジュ・スュイ・ザレ・オ・マルシェ | 私は市場へ行った。（男性）
Elle est allée en France. | エ・レ・タレ・アン・フランス | 彼女はフランスへ行った。
Nous sommes allés au cinéma. | ヌー・ソム・ザレ・オ・スィネマ | 私たちは映画に行った。
:::

## 2. venir の活用

:::conj venir présent

:::note venir 型は語幹が2つに割れる
venir の現在形をよく見ると、**単数と3人称複数が vien-、nous と vous が ven-** に分かれています。

- vien**s**, vien**s**, vien**t**, ven**ons**, ven**ez**, vienn**ent**

これは第3群の動詞に非常に多いパターンです。**強勢が置かれる音節（単数・3複）で母音が変化する**ためで、prendre（prends / prenons / prennent）、boire（bois / buvons / boivent）、devoir（dois / devons / doivent）も同じ構造です。

第13章の全体図で見るとおり、**半過去は nous の形（ven-）から、接続法は ils の形（vienn-）から**作られるので、この2つの語幹を押さえておくと後が楽になります。

同型の動詞：tenir, devenir, revenir, obtenir, appartenir。**venir を1つ覚えると、この5語がまとめて手に入ります。**
:::

:::ex venir の基本用法
Je viens de Tokyo. | ジュ・ヴィアン・ドゥ・トキョ | 私は東京の出身です。
Tu viens avec moi ? | テュ・ヴィアン・ザヴェック・モワ | 一緒に来る？
Ils viennent demain. | イル・ヴィエンヌ・ドゥマン | 彼らは明日来る。
Elle est venue me voir. | エ・レ・ヴニュ・ム・ヴォワール | 彼女は私に会いに来た。（複合過去も être）
:::

## 3. 近接未来 — aller + 不定詞

**aller の活用形 + 不定詞**で、「これから〜する」を表します。英語の be going to と発想がまったく同じです。

:::ex 近接未来
Je vais partir. | ジュ・ヴェ・パルティール | 私は出発するところだ。
Il va pleuvoir. | イル・ヴァ・プルヴォワール | 雨が降りそうだ。
Nous allons manger. | ヌー・ザロン・マンジェ | 私たちは食べるところだ。
Tu vas comprendre. | テュ・ヴァ・コンプランドル | すぐ分かるよ。
On va voir. | オン・ヴァ・ヴォワール | まあ様子を見よう。
:::

:::warn 否定の位置に注意
第5章の原則どおり、**ne … pas が挟むのは活用した動詞**です。ここで活用しているのは aller なので、不定詞は pas の後ろに来ます。

[[Je ne vais pas partir.|ジュ・ヌ・ヴェ・パ・パルティール|私は出発しない（つもりだ）。]]

× Je vais ne pas partir. とはなりません（ただし「出発しないことにする」と不定詞そのものを否定する場合は別）。

代名詞は**不定詞の前**に置きます（第17章）：[[Je vais le faire.|ジュ・ヴェ・ル・フェール|それをやるつもりだ。]]（× Je le vais faire）
:::

:::deep 近接未来と単純未来の使い分け
第24章で単純未来（je partirai）を学びますが、**両者は交換可能ではありません**。

| | 近接未来（je vais partir） | 単純未来（je partirai） |
|---|---|---|
| 時間的な近さ | 近い | 遠くてもよい |
| 話し手の関与 | 現在とつながっている、確実性が高い | 現在から切り離されている |
| 文体 | 話し言葉で圧倒的に多い | 書き言葉・改まった場面 |

[[Je vais me marier.|ジュ・ヴェ・ム・マリエ|私は結婚します。]]（決まっている、近い）
[[Je me marierai un jour.|ジュ・ム・マリユレ・アン・ジュール|いつか結婚するだろう。]]（漠然としている）

**日常会話では近接未来が未来表現の大半を占めます。** 単純未来は「予測・約束・宣言」といった、やや改まった場面に寄ります。

なお時間の近さは絶対的な条件ではありません。[[Je vais avoir 30 ans l'année prochaine.|ジュ・ヴェ・ザヴォワール・トラン・タン|来年30歳になります。]] のように、1年先でも「確実に来る」ことなら近接未来が使えます。**重要なのは「現在との地続き感」です。**
:::

### 過去における近接未来 — allais + 不定詞

aller を**半過去**にすると、「〜しようとしていた（ところだった）」を表せます。

:::ex 過去の近接未来
J'allais partir quand tu as téléphoné. | ジャレ・パルティール・カン・チュ・ア・テレフォネ | 君が電話してきたとき、出発しようとしていた。
Il allait tomber. | イ・ラレ・トンベ | 彼は転びそうだった。
J'allais justement t'appeler ! | ジャレ・ジュストマン・タプレ | ちょうど電話しようとしてたんだ！
:::

**J'allais justement + 不定詞**（ちょうど〜しようとしていた）は会話の定番です。相手と気持ちが重なったときに使います。

## 4. 近接過去 — venir de + 不定詞

**venir の活用形 + de + 不定詞**で、「〜したばかりだ」を表します。

:::ex 近接過去
Je viens d'arriver. | ジュ・ヴィアン・ダリヴェ | 私は着いたばかりだ。
Il vient de partir. | イル・ヴィアン・ドゥ・パルティール | 彼は出発したところだ。
Nous venons de manger. | ヌー・ヴノン・ドゥ・マンジェ | 私たちは食べたばかりだ。
Elle vient de téléphoner. | エル・ヴィアン・ドゥ・テレフォネ | 彼女は電話してきたばかりだ。
Le train vient de partir. | ル・トラン・ヴィアン・ドゥ・パルティール | 電車は出たばかりだ。
:::

:::warn de を落とさない
近接未来には前置詞が要りませんが、**近接過去には de が必須**です。

- Je **vais** partir.（de なし）
- Je **viens de** partir.（de あり）

de を落とすと「私は出発しに来る」という別の意味の文になってしまいます。実際、venir + 不定詞（de なし）は「〜しに来る」という目的の表現です。

[[Je viens te voir.|ジュ・ヴィアン・ト・ヴォワール|君に会いに来た。]]（目的）
[[Je viens de te voir.|ジュ・ヴィアン・ドゥ・ト・ヴォワール|君に会ったばかりだ。]]（近接過去）

**de があるかないかで意味が反転します。**
:::

:::deep 近接過去は「過去形」ではない
文字どおりには「〜から来る」と言っているだけで、**動詞は現在形**です。「たった今〜し終えたところから来ている」という比喩が、そのまま時制表現になったものです。

このため、近接過去は**現在との関わりを強く含意します**。「たった今」という情報が本質なので、遠い過去には使えません。

- ○ [[Il vient de sortir.|イル・ヴィアン・ドゥ・ソルティール|彼はたった今出て行った。]]
- × Il vient de sortir hier.（昨日、と矛盾する）

遠い過去は複合過去（第20章）で表します：[[Il est sorti hier.|イ・レ・ソルティ・イエール|彼は昨日出かけた。]]

なお venir を半過去にすると、**過去のある時点から見た直前**を表せます（第27章）。
[[Il venait de sortir quand je suis arrivé.|イル・ヴネ・ドゥ・ソルティール・カン・ジュ・スュイ・ザリヴェ|私が着いたとき、彼は出て行ったばかりだった。]]

**allais + 不定詞**（§3）と **venais de + 不定詞** を合わせると、過去のある時点の前後を自在に描けます。物語の読解で頻出する形です。
:::

## 5. 3つの時間軸を1文で

近接過去・現在・近接未来を並べると、**現在を中心とした時間の広がり**が見えます。

:::ex 時間軸を並べる
Je viens de manger. | ジュ・ヴィアン・ドゥ・マンジェ | 食べたところだ。（直前の過去）
Je mange. | ジュ・マンジュ | 食べている。（現在）
Je suis en train de manger. | ジュ・スュイ・アン・トラン・ドゥ・マンジェ | 食べている最中だ。（進行を強調）
Je vais manger. | ジュ・ヴェ・マンジェ | 食べるところだ。（直後の未来）
:::

**動詞の活用を新しく覚えることなく、3つの時制を表現できています。** これが aller / venir が入門段階で重要な理由です。

表の3行目、**être en train de + 不定詞**（〜している最中だ）も一緒に覚えてください。フランス語の現在形は英語の進行形を兼ねますが、「まさに今やっている最中」と強調したいときはこの形を使います。aller / venir / être の3語で、時間の前後と最中がすべて言えます。

## 6. 「行く」と「来る」の視点 — 日本語と逆になる場面

:::warn 「今行く！」は Je viens ! — 最重要の視点差
呼ばれて「今行く！」と答えるとき、日本語は「行く」ですが、**フランス語は venir か arriver を使います**。

- [[J'arrive !|ジャリーヴ|今行きます！]]（最も普通）
- [[Je viens !|ジュ・ヴィアン|今行く！]]
- × Je vais !（こうは言えない）

理由は視点の置き方です。**フランス語（と英語）の venir / come は「聞き手のいる場所への移動」**を表します。呼んだ相手のところへ移動するのだから venir です。日本語の「行く／来る」は**話し手の視点**で決まるので、ここで食い違います。

| 場面 | 日本語 | フランス語 |
|---|---|---|
| 呼ばれて返事 | 今**行く** | J'**arrive** ! / Je **viens** ! |
| 相手の家に行く約束 | 明日そっちに**行く**よ | Je **viens** chez toi demain. |
| 第三の場所に行く | 明日パリに**行く** | Je **vais** à Paris demain. |

**聞き手のところへ向かうなら venir、それ以外の場所なら aller** ——この規則で機械的に判定できます。英語の come / go と同じなので、英語の感覚が使えます。

なお **J'arrive !** は「もう向かっている、すぐ着く」という含みで、レストランの店員も Oui, j'arrive !（今参ります）と言います。返事としてはこれが一番よく聞かれます。
:::

## 7. 「連れて行く・持って行く」の動詞群

:::deep amener / emmener / apporter / emporter — 4語の使い分け
「連れて行く」「持って行く」にあたる動詞は、**人か物か × 視点の向き**で4つに分かれます。すべて mener（導く）と porter（運ぶ）に、a-（〜の方へ）と em-（外へ・一緒に）が付いたものです。

| | **人・動物を** | **物を** |
|---|---|---|
| **相手・目的地の方へ**（a-） | **amener**（連れて来る／連れて行く） | **apporter**(持って来る／持って行く） |
| **その場から一緒に**（em-） | **emmener**（連れ出す・連れて行く） | **emporter**（持ち去る・持って行く） |

:::ex 4語の使い分け
J'amène mon frère à la fête. | ジャメーヌ・モン・フレール・ア・ラ・フェット | 弟をパーティーに連れて行く。（目的地に着けることが焦点）
Je t'emmène au cinéma. | ジュ・タンメーヌ・オ・スィネマ | 君を映画に連れて行ってあげる。（一緒に出かけることが焦点）
Apporte une bouteille de vin ! | アポルト・ユヌ・ブテイユ・ドゥ・ヴァン | ワインを1本持って来て！
Il a emporté tous ses livres. | イ・ラ・アンポルテ・トゥ・セ・リーヴル | 彼は本を全部持って行ってしまった。
Un café à emporter, s'il vous plaît. | アン・カフェ・ア・アンポルテ・スィル・ヴ・プレ | コーヒーをテイクアウトでお願いします。
:::

**à emporter** は「テイクアウトの」という定型表現です（sur place ou à emporter ? 店内ですか、お持ち帰りですか？）。

実際の話し言葉では amener が物にも使われる（Amène le sel ! 塩取って！）など境界は緩みつつありますが、**人には mener 系、物には porter 系**という軸を持っておくと、聞いたときに正確に理解できます。

**aller chercher / venir chercher**（迎えに行く／迎えに来る、取りに行く）もこの仲間です。

- [[Je vais chercher les enfants à l'école.|ジュ・ヴェ・シェルシェ・レ・ザンファン・ア・レコール|学校へ子どもたちを迎えに行く。]]
- [[Tu peux venir me chercher à la gare ?|チュ・プー・ヴニール・ム・シェルシェ・ア・ラ・ガール|駅まで迎えに来てくれる？]]

直訳は「探しに行く」ですが、意味は「迎えに行く・取りに行く」。フランス語の日常で最頻出の言い回しの1つです。
:::

## 8. 「戻る」の3動詞 — revenir / retourner / rentrer

「戻る」にあたる動詞も、視点で3つに分かれます。venir / aller の対立がそのまま re- の付いた形に引き継がれています。

| 動詞 | 視点 | 意味 |
|---|---|---|
| **revenir**（re + venir） | **今いる場所**へ戻って来る | また来る、戻って来る |
| **retourner**（re + tourner） | **今いない場所**へ戻って行く | また行く、引き返す |
| **rentrer**（re + entrer） | **自分の家・拠点**へ帰る | 帰宅する、帰国する |

:::ex 「戻る」の使い分け
Je reviens tout de suite. | ジュ・ルヴィヤン・トゥ・ドゥ・スュイット | すぐ戻ります。（今ここへ）
Attends-moi ici, je reviens. | アタン・モワ・イスィ・ジュ・ルヴィヤン | ここで待ってて、すぐ戻るから。
Je voudrais retourner au Japon. | ジュ・ヴドレ・ルトゥルネ・オ・ジャポン | 日本にまた行きたい。（今は日本にいない）
Il est retourné au bureau. | イ・レ・ルトゥルネ・オ・ビュロ | 彼は職場へ引き返した。
Je rentre à la maison. | ジュ・ラントル・ア・ラ・メゾン | 家に帰ります。
Elle est rentrée tard hier soir. | エ・レ・ラントレ・タール・イエール・ソワール | 彼女は昨夜遅く帰宅した。
:::

:::warn 「日本に帰る」はどれか
日本人がフランスから「日本に帰る」と言う場合——

- フランスで話しているなら **rentrer**：Je **rentre** au Japon.（拠点＝母国へ帰る）
- 「いつかまた日本に行きたい」と旅行者として言うなら **retourner**：Je veux **retourner** au Japon.

**revenir は「今いる場所へ」なので、日本の外から「日本に revenir」とは言えません**。逆に日本で「フランスにまた来たい」と言うフランス人は revenir を使います（Je veux revenir au Japon.——日本で言う場合）。

3語とも移動の自動詞なので**複合過去は être** です（revenu / retourné / rentré は主語に一致）。

**Je reviens tout de suite.**（すぐ戻ります）は、席を外すときの決まり文句として丸ごと覚えてください。店員の J'arrive !（§6）と並んで、毎日聞く表現です。
:::

## 9. aller / venir のその他の用法

:::adv 覚えておきたい慣用表現

**aller**
- [[aller bien à|アレ・ビアン・ア|（服が）似合う]]：[[Cette robe te va bien.|セット・ローブ・ト・ヴァ・ビアン|そのドレス、似合っているよ。]]
- [[Allons-y !|アロン・ズィ|さあ行こう！]]、[[Allez !|アレ|さあ！／がんばれ！]]
- [[Ça va aller.|サ・ヴァ・アレ|なんとかなるよ。]]（励ましの定番）
- [[On y va ?|オ・ニ・ヴァ|行こうか？]]
- [[Ça te va ?|サ・ト・ヴァ|それでいい？]]（提案への同意を求める）

**venir**
- [[venir de|ヴニール・ドゥ|〜の出身である]]：[[Je viens du Japon.|ジュ・ヴィアン・デュ・ジャポン|私は日本出身です。]]
- [[en venir à|アン・ヴニール・ア|〜するに至る]]：[[Où veux-tu en venir ?|ウ・ヴ・チュ・アン・ヴニール|何が言いたいの？]]
- [[Viens !|ヴィアン|おいで！]]（命令形、第16章）

**s'en aller**（立ち去る）
- [[Je m'en vais.|ジュ・マン・ヴェ|もう行くね。]]
- [[Va-t'en !|ヴァ・タン|出て行け！]]

s'en aller は代名動詞（第23章）+ en（第25章）の組み合わせで、partir とほぼ同義ですが話し言葉でよく使います。Je m'en vais. は別れ際の自然な一言です。

**Je viens du Japon.** は「日本から来た（＝出身）」と「日本から来たところだ」の両方に解釈できますが、後者なら普通は Je viens d'arriver du Japon. と言います。

## 1. 疑問副詞

| 疑問副詞 | 意味 |
|---|---|
| **où** | どこ |
| **quand** | いつ |
| **comment** | どのように |
| **pourquoi** | なぜ |
| **combien** | いくら、どれくらい |

:::ex 疑問副詞
Où habitez-vous ? | ウー・アビテ・ヴー | どこにお住まいですか？
Quand partez-vous ? | カン・パルテ・ヴー | いつ出発しますか？
Comment ça va ? | コマン・サ・ヴァ | 調子はどうですか？
Pourquoi pleures-tu ? | プルコワ・プルール・テュ | なぜ泣いているの？
Combien ça coûte ? | コンビアン・サ・クート | いくらですか？
:::

### 3つの語順が使える

疑問副詞のある疑問文も、第9章と同じく3通りの作り方があります。

:::ex Où habitez-vous ? を3通りで
Tu habites où ? | テュ・アビット・ウー | どこに住んでるの？（話し言葉・疑問詞を文末に）
Où est-ce que tu habites ? | ウー・エス・ク・テュ・アビット | どこに住んでいますか？（中立）
Où habites-tu ? | ウー・アビット・テュ | どこにお住まいですか？（改まった）
:::

:::note 話し言葉では疑問詞が文末に来る
第9章で触れた「第4の形」です。**語順をまったく変えずに、疑問詞だけを本来の位置に置く**ので、話し言葉では最も楽な形になります。

[[Tu vas où ?\|テュ・ヴァ・ウー\|どこ行くの？]]、[[Tu pars quand ?\|テュ・パール・カン\|いつ出発するの？]]、[[C'est combien ?\|セ・コンビアン\|いくら？]]

ただし**書き言葉では使いません**。また pourquoi だけは文末に置きにくく、通常は文頭に来ます。
:::

:::deep 疑問副詞のときは単純倒置ができる
第9章で「主語が名詞のときは複合倒置（Marie aime-t-elle …）」と述べましたが、**疑問副詞がある場合は、名詞主語をそのまま動詞の後ろに置けます**（単純倒置）。

- [[Où habite Marie ?\|ウー・アビット・マリ\|マリはどこに住んでいますか？]]（単純倒置）
- [[Où Marie habite-t-elle ?\|ウー・マリ・アビット・テル\|同上]]（複合倒置も可）

条件は「動詞の後ろに目的語がないこと」です。目的語があると単純倒置はできません。

- × Où lit Marie ce livre ?
- ○ [[Où Marie lit-elle ce livre ?\|ウー・マリ・リ・テル・ス・リーヴル\|マリはどこでこの本を読むのですか？]]

**pourquoi だけは単純倒置ができません**。× Pourquoi pleure Marie ? とは言えず、必ず Pourquoi Marie pleure-t-elle ? となります。
:::

:::adv combien の2つの形
combien は、後ろに名詞を取るかどうかで形が変わります。

- [[Combien coûte ce livre ?\|コンビアン・クート・ス・リーヴル\|この本はいくらですか？]]（単独）
- [[Combien de livres avez-vous ?\|コンビアン・ドゥ・リーヴル・ザヴェ・ヴー\|本を何冊持っていますか？]]（combien **de** + 無冠詞名詞）

第2章の数量表現と同じく、**combien de の後ろは無冠詞**になります。
:::

## 2. 疑問代名詞 — 体系を整理する

**ここがこの章の本題です。** 「誰」「何」を尋ねる代名詞は、次の3つの軸で形が決まります。

1. **人か、物か**
2. **主語か、目的語か**
3. **短形か、長形（est-ce que 型）か**

### 全体の表

| | **主語**（誰が／何が） | **目的語**（誰を／何を） | **前置詞の後** |
|---|---|---|---|
| **人** | qui / qui est-ce qui | qui / qui est-ce que | à qui, de qui… |
| **物** | （短形なし）/ qu'est-ce qui | que / qu'est-ce que | à quoi, de quoi… |

:::warn 物が主語のときは長形しかない
表の左下が空白になっている点に注目してください。**「何が〜する」を短形で言う方法はありません。**

- ○ [[Qu'est-ce qui se passe ?\|ケ・ス・キ・ス・パス\|何が起きているのですか？]]
- × Que se passe ?

これは覚えるしかない欠落です。**物が主語のときは必ず qu'est-ce qui** を使ってください。
:::

### 長形の作り方には規則がある

一見バラバラに見える qui est-ce qui / qu'est-ce que は、**2つの部品の組み合わせ**です。

| 部品 | 位置 | 意味 |
|---|---|---|
| **前半** | qui = 人 / que = 物 | 何を尋ねているか |
| **後半** | qui = 主語 / que = 目的語 | 文中でどの役割か |

つまり **「前半で人か物か、後半で主語か目的語か」** を表しています。

| 形 | 前半 | 後半 | 意味 |
|---|---|---|---|
| **qui est-ce qui** | 人 | 主語 | 誰が |
| **qui est-ce que** | 人 | 目的語 | 誰を |
| **qu'est-ce qui** | 物 | 主語 | 何が |
| **qu'est-ce que** | 物 | 目的語 | 何を |

この規則を知っていれば、4つを丸暗記する必要はありません。**前半＝尋ねる対象、後半＝文法上の役割**、と2回に分けて考えればよいのです。

:::ex 4つの長形
Qui est-ce qui vient ? | キ・エス・キ・ヴィアン | 誰が来るの？
Qui est-ce que tu aimes ? | キ・エス・ク・テュ・エーム | 誰を愛しているの？
Qu'est-ce qui se passe ? | ケ・ス・キ・ス・パス | 何が起きているの？
Qu'est-ce que tu fais ? | ケ・ス・ク・テュ・フェ | 何をしているの？
:::

### 短形

短形は簡潔ですが、倒置を伴います。

:::ex 短形
Qui vient ? | キ・ヴィアン | 誰が来るの？（人・主語）
Qui aimes-tu ? | キ・エム・テュ | 誰を愛しているの？（人・目的語＋倒置）
Que fais-tu ? | ク・フェ・テュ | 何をしているの？（物・目的語＋倒置）
:::

:::note 実際の会話では qu'est-ce que が主役
**Qu'est-ce que tu fais ?** は、フランス語で最も頻繁に耳にする疑問文の1つです。短形の Que fais-tu ? は改まった響きになります。

さらにくだけると疑問詞が文末に来ます：[[Tu fais quoi ?\|テュ・フェ・コワ\|何してるの？]]

このとき que ではなく **quoi** を使う点に注意してください。que は動詞の前に置く形で、単独では立てません。
:::

## 3. que と quoi の使い分け

:::deep 同じ「何」なのに形が2つある理由
**que** と **quoi** は、もともと同じ語の**強勢のない形／ある形**です（第19章の人称代名詞 me / moi と同じ関係）。

| | 使う位置 |
|---|---|
| **que** | 動詞の直前（弱い位置） |
| **quoi** | 前置詞の後、文末、単独（強い位置） |

:::ex que と quoi
Que fais-tu ? | ク・フェ・テュ | 何をしているの？（動詞の前 → que）
Tu fais quoi ? | テュ・フェ・コワ | 何してるの？（文末 → quoi）
À quoi penses-tu ? | ア・コワ・パンス・テュ | 何を考えているの？（前置詞の後 → quoi）
Quoi ? | コワ | 何？（単独 → quoi）
De quoi parlez-vous ? | ドゥ・コワ・パルレ・ヴー | 何について話しているのですか？
:::

**前置詞の後ろには必ず quoi** です（× à que）。同じ理由で、人の場合は前置詞の後ろでも qui のままです（qui には弱形・強形の区別がないため）。
[[À qui parles-tu ?\|ア・キ・パルル・テュ\|誰に話しているの？]]、[[Avec qui ?\|アヴェック・キ\|誰と？]]
:::

## 4. quel との違い

第10章で疑問形容詞 quel を学びました。**quel と qu'est-ce que は混同しやすい**ので、区別しておきます。

| | 使う場面 |
|---|---|
| **quel** | 選択肢の中から**どれか**を尋ねる／人・物の**属性**を尋ねる |
| **qu'est-ce que** | 定義・内容を尋ねる |

:::ex quel と qu'est-ce que
Quel est votre nom ? | ケ・レ・ヴォートル・ノン | お名前は何ですか？
Qu'est-ce que c'est ? | ケ・ス・ク・セ | これは何ですか？
Quel livre lis-tu ? | ケル・リーヴル・リ・テュ | どの本を読んでいるの？
Qu'est-ce que tu lis ? | ケ・ス・ク・テュ・リ | 何を読んでいるの？
:::

:::warn 名前・職業・国籍には quel を使う
**Qu'est-ce que votre nom ?** とは言えません。名前・住所・職業・年齢といった「その人の属性」を尋ねるときは quel です。

- ○ Quel est votre nom ?（お名前は？）
- ○ Quelle est votre profession ?（ご職業は？）
- ○ Quelle est votre adresse ?（ご住所は？）

一方、**Qu'est-ce que c'est ?** は目の前の物の正体を尋ねる形で、これは quel では言えません。

判断の目安：**答えが「名詞そのもの」なら quel、答えが「説明・定義」なら qu'est-ce que**。
:::

:::adv Qu'est-ce que c'est que … ? という形
定義を強く求めるとき、**Qu'est-ce que c'est que + 名詞** という形が使われます。

[[Qu'est-ce que c'est que ça ?\|ケ・ス・ク・セ・ク・サ\|それは一体何なんだ？]]
[[Qu'est-ce que c'est que l'amour ?\|ケ・ス・ク・セ・ク・ラムール\|愛とは何か？]]

que が3回出てくる不格好な形ですが、哲学的な問いや驚きの表現として実際に使われます。
:::

## 5. 感嘆の que

:::adv que は感嘆詞にもなる
疑問ではなく感嘆を表す用法があります。

[[Que c'est beau !\|ク・セ・ボー\|なんて美しいんだ！]]
[[Qu'il fait chaud !\|キル・フェ・ショー\|なんて暑いんだ！]]

同じ意味を、より口語的な **comme** でも表せます。
[[Comme c'est beau !\|コム・セ・ボー\|なんて美しいんだ！]]

第10章の **quel + 名詞**（Quel beau temps !）と合わせて、感嘆には3つの形があることになります。
- **quel** + 名詞：Quel beau temps !
- **que** + 文：Que le temps est beau !
- **comme** + 文：Comme le temps est beau !
:::

## 6. 話し言葉の疑問 — 実際にどう聞くか

:::deep 疑問詞の位置は3段階
第9章の3つの疑問形は、疑問詞があっても同じように働きます。**同じ質問が文体で3つの形**を持ちます。

| 文体 | 「どこに住んでるの？」 | 場面 |
|---|---|---|
| くだけた | Tu habites **où** ? | 友人・家族 |
| 中立 | **Où** est-ce que tu habites ? | どこでも |
| 改まった | **Où** habites-tu ? | 書き言葉・丁寧 |

**話し言葉では「疑問詞を文末に残す」形が最も多い**——これが実態です。

- [[Tu t'appelles comment ?|チュ・タペル・コマン|名前は何ていうの？]]
- [[Ça coûte combien ?|サ・クート・コンビアン|いくらするの？]]
- [[Tu pars quand ?|チュ・パール・カン|いつ出発するの？]]
- [[C'est qui ?|セ・キ|誰？]]

さらにくだけると、**疑問詞 + 主語 + 動詞**（Où tu vas ?）や、パリの口語で **c'est quoi … ?**（C'est quoi, ça ? 何それ？）も聞かれます。これらは書き言葉では使いませんが、聞き取りには必須です。

**pourquoi だけは文末に置けません**（× Tu pleures pourquoi ?）。Pourquoi tu pleures ? と文頭に置きます。理由を問う語は文全体にかかるため、と覚えてください。

**返しの定型**も一緒に：

- [[Pourquoi pas ?|プルコワ・パ|いいんじゃない？（なぜだめ？）]]
- [[Comment ça ?|コマン・サ|どういうこと？]]
- [[Et alors ?|エ・アロール|それで？／だから何？]]
- [[Ça dépend de quoi ?|サ・デパン・ドゥ・コワ|何によるの？]]
:::

## 7. 間接疑問 — 疑問詞はどう埋め込まれるか

:::deep 疑問文を文の中に入れる
「彼が**何を**欲しいか分からない」のように、疑問文を別の文に埋め込むときは、**疑問詞ごとに決まった変換**があります。

| 直接疑問 | 間接疑問 | 例 |
|---|---|---|
| est-ce que …（〜か？） | **si** | Je ne sais pas **si** tu viens. |
| **qu'est-ce qui**（何が） | **ce qui** | Dis-moi **ce qui** se passe. |
| **qu'est-ce que / que**（何を） | **ce que** | Je ne sais pas **ce que** tu veux. |
| qui（誰） | **qui**（そのまま） | Je sais **qui** a téléphoné. |
| où / quand / comment / pourquoi / combien | そのまま | Dis-moi **où** tu habites. |
| quel + 名詞 | そのまま | Je ne sais pas **quelle heure** il est. |

**変わるのは「何」だけ**です。qu'est-ce qui → ce qui、qu'est-ce que → ce que。est-ce que の部分が消えて ce に化ける、と覚えると整理できます（第21章の ce qui / ce que と同じ形です）。

:::ex 間接疑問
Je ne sais pas ce que tu veux dire. | ジュ・ヌ・セ・パ・ス・ク・チュ・ヴ・ディール | 君が何を言いたいのか分からない。
Dis-moi ce qui ne va pas. | ディ・モワ・ス・キ・ヌ・ヴァ・パ | どうしたのか言ってごらん。
Je me demande s'il viendra. | ジュ・ム・ドゥマンド・スィル・ヴィアンドラ | 彼は来るだろうかと思う。
Tu sais où il est ? | チュ・セ・ウ・イ・レ | 彼がどこにいるか知ってる？
Je ne comprends pas pourquoi elle est partie. | ジュ・ヌ・コンプラン・パ・プルコワ・エ・レ・パルティ | なぜ彼女が去ったのか分からない。
:::

**間接疑問の中では est-ce que も倒置も使わない**——語順は平叙文です（× Je ne sais pas où est-ce qu'il habite）。**Je me demande si …**（〜だろうか）、**Je ne sais pas ce que …**（何を〜か分からない）は独り言・つなぎ表現としても頻出します。
:::

## 8. combien を使いこなす — 数・量・値段・頻度

combien は生活で最も働く疑問詞です。**何を尋ねるかで形が変わります**。

| 聞きたいこと | 形 | 例 |
|---|---|---|
| 値段 | **C'est combien ?** / Ça coûte combien ? | いくらですか |
| 物の数 | **Combien de + 名詞** | Combien de personnes ?（何人？） |
| 時間の長さ | **Combien de temps** | Combien de temps ça prend ? |
| 頻度 | **Combien de fois** | Combien de fois par semaine ?（週何回？） |
| 距離 | **À combien** | C'est à combien d'ici ?（ここからどのくらい？） |
| 年齢 | ※ combien を使わない | **Quel âge** as-tu ? |

:::ex combien の実戦
Ça fait combien ? | サ・フェ・コンビアン | （会計で）おいくらですか？
On est combien ce soir ? | オ・ネ・コンビアン・ス・ソワール | 今夜は何人？
Combien de temps faut-il pour y aller ? | コンビアン・ドゥ・タン・フォ・ティル | 行くのにどのくらいかかりますか？
Tu mesures combien ? | チュ・ムズュール・コンビアン | 身長どのくらい？
Vous êtes combien dans votre famille ? | ヴー・ゼット・コンビアン | 何人家族ですか？
:::

- **Ça fait combien ?** は会計の定番（fait = 合計する）。答えは Ça fait 12 euros.
- **On est combien ?**（何人いる？）——人数は être + combien で聞ける
- **combien de + 無冠詞名詞**：de の後は冠詞なし（Combien de sucres ? 砂糖はいくつ？）
- 年齢だけは **Quel âge … ?**（第10章の quel）で、combien を使わない

## 9. まとめの表

:::note 疑問代名詞・最終整理
**人を尋ねる**
- 誰が → **qui** / qui est-ce qui
- 誰を → **qui** + 倒置 / qui est-ce que
- 前置詞つき → à **qui**, avec **qui**, de **qui**

**物を尋ねる**
- 何が → **qu'est-ce qui**（短形なし）
- 何を → **que** + 倒置 / **qu'est-ce que** / 文末なら **quoi**
- 前置詞つき → à **quoi**, avec **quoi**, de **quoi**

**選択・属性を尋ねる**
- どの〜 / 〜は何か → **quel**（名詞に性数一致する）
:::


:::ai-gen 疑問副詞、疑問代名詞 qui/que/quoi、quel との使い分け

## 10. lequel — 選択を問う疑問代名詞

「どれ？」と**選択肢の中から選ばせる**疑問代名詞が lequel です。quel（疑問形容詞、第10章）が名詞に付くのに対し、lequel は**単独で立ちます**。

| | 男性単数 | 女性単数 | 男性複数 | 女性複数 |
|---|---|---|---|---|
| 基本 | **lequel** | **laquelle** | **lesquels** | **lesquelles** |
| à + | **auquel** | à laquelle | **auxquels** | **auxquelles** |
| de + | **duquel** | de laquelle | **desquels** | **desquelles** |

:::ex lequel の実戦
J'ai deux robes. Laquelle préfères-tu ? | ラケル・プレフェール・チュ | ドレスが2着あるの。どっちが好き？
Voici trois livres. Lesquels veux-tu ? | レケル・ヴ・チュ | 本が3冊あります。どれが欲しい？
Duquel de ces films parles-tu ? | デュケル・ドゥ・セ・フィルム | この映画のうちどれの話をしてるの？
Il y a plusieurs solutions. À laquelle penses-tu ? | ア・ラケル・パンス・チュ | 解決策はいくつかある。どれのことを考えている？
:::

**quel と lequel の分業**は明快です。

- **Quel livre** veux-tu ?（どの本が欲しい？）——名詞が続く
- **Lequel** veux-tu ?（どれが欲しい？）——名詞なし、すでに話題に出ている

会話では **C'est lequel ?**（どれ？）や **Lequel, celui-ci ?**（どっち、こっち？）のように単独で使われます。前置詞と縮約する（auquel / duquel）点も、定冠詞 le を含んでいるからだと分かれば納得できます（第7章）。

  body: `
{lead}フランス語の動詞活用は、暗記すべき量が膨大に見えます。動詞1語につき時制が12、それぞれ6人称——単純に掛け算すれば72の形です。これを不規則動詞の数だけ覚えるとなると、絶望的に思えます。

**しかし実際に覚えるべきものは、動詞1つにつき4つだけです。** 残りはすべて機械的に導けます。

この章は、その「4つ」と「導き方」を1枚の図にまとめます。**この教材で最も重要な課**です。ここを理解すると、以後の第20章（複合過去）、第24章（単純未来）、第27章（半過去）、第30章（条件法）、第31章（接続法）が、それぞれ独立した暗記項目ではなく、**同じ図の別の枝**として見えるようになります。

## 1. 覚えるべき4つ

どんな動詞でも、次の4つさえ分かれば全時制を作れます。

| # | 覚えるもの | ここから作られるもの |
|---|---|---|
| **①** | 直説法現在の6形 | 半過去・接続法現在・命令法 |
| **②** | 未来語幹 | 単純未来・条件法現在 |
| **③** | 過去分詞（＋助動詞が avoir か être か） | 複合過去・大過去・前未来・条件法過去・接続法過去 |
| **④** | 単純過去の語幹と型 | 単純過去（書き言葉専用） |

**③だけで複合時制5つがまかなえます。** 複合時制は「助動詞の時制 ＋ 過去分詞」なので、過去分詞は常に同じ。変わるのは助動詞の時制だけです。つまり avoir と être の活用さえ知っていれば、新しく覚えることは何もありません。

## 2. 全体図

下の図で、青いカードが「覚えるもと」、その右が「そこから作られる時制」です。**カードを押すと活用表が開きます。**

:::vmap chanter

:::note 図の読み方
- **①から3つの枝** … 半過去は nous の形から、接続法は ils の形から、命令法は tu / nous / vous の形から
- **②から2つの枝** … 単純未来と条件法現在は**同じ語幹**を共有する
- **③から5つの枝** … 複合時制はすべて「助動詞 + 過去分詞」
- **④** … 単純過去だけは独立していて、書き言葉でしか使わない

## 3. 導出の規則を1つずつ確認する

### ① 直説法現在から3つ

**半過去 = nous の現在形 − ons + 半過去の語尾**

| 動詞 | nous の現在形 | 半過去語幹 | 半過去（je） |
|---|---|---|---|
| chanter | nous chant**ons** | chant- | je chantais |
| finir | nous finiss**ons** | finiss- | je finissais |
| prendre | nous pren**ons** | pren- | je prenais |
| boire | nous buv**ons** | buv- | je buvais |
| faire | nous fais**ons** | fais- | je faisais |

**この規則には例外が1つしかありません。** être だけが nous sommes から導けず、特別に **ét-** を使います（j'étais）。**フランス語の全動詞で、半過去の例外は être ただ1つ**です。

**接続法現在 = ils の現在形 − ent + 接続法の語尾**

| 動詞 | ils の現在形 | 接続法語幹 | 接続法（je） |
|---|---|---|---|
| chanter | ils chant**ent** | chant- | que je chante |
| finir | ils finiss**ent** | finiss- | que je finisse |
| prendre | ils prenn**ent** | prenn- | que je prenne |
| boire | ils boiv**ent** | boiv- | que je boive |

ただし**nous と vous だけは半過去語幹を使います**（que nous prenions、que nous buvions）。第31章で扱います。

**命令法 = 現在形の tu / nous / vous から主語を取る**

第1群と ouvrir 型だけ、tu の -s を落とします（chante, chantons, chantez）。第16章で扱います。

### ② 未来語幹から2つ

**単純未来 = 未来語幹 + ai, as, a, ons, ez, ont**
**条件法現在 = 未来語幹 + ais, ais, ait, ions, iez, aient**

:::warn 条件法現在は「未来語幹 ＋ 半過去の語尾」
条件法の語尾は、半過去の語尾と**完全に同一**です。つまり条件法現在について新しく覚えることは何もありません。

- 半過去：chant- + ais → chantais
- 条件法：chanter- + ais → chanterais

**規則動詞では未来語幹が不定詞そのもの**なので、単純未来と条件法現在は「不定詞 + 語尾」で作れます。

これが第30章（条件法）を軽くする理由です。第24章で単純未来を学び終えた時点で、条件法現在は実質的に習得済みになります。
:::

:::deep 未来語幹はどこから来たのか
なぜ「不定詞 + avoir の現在形」のような形になっているのか——実際にそのとおりだからです。

俗ラテン語では、未来を **不定詞 + habere（持つ）** で表していました。
- cantare **habeo**（歌うことを持っている）→ je chanter**ai**
- cantare **habes** → tu chanter**as**
- cantare **habet** → il chanter**a**
- cantare **habemus** → nous chanter**ons**
- cantare **habetis** → vous chanter**ez**
- cantare **habent** → ils chanter**ont**

語尾を見比べてください。**単純未来の語尾は avoir の現在形そのもの**です（ai, as, a, [av]ons, [av]ez, ont）。

同じように、条件法は **不定詞 + habere の未完了過去**（＝半過去）から来ています。だから条件法の語尾が半過去と同じなのです。

つまり単純未来も条件法も、もとは**複合時制**でした。それが1語に融合した結果、いまの形になっています。この由来を知っていると、語尾を覚え直す必要がなくなります。
:::

### ③ 過去分詞から5つ

複合時制は、**助動詞（avoir または être）を該当する時制に活用させ、過去分詞を添える**だけです。

| 時制 | 助動詞の時制 | 例（chanter） |
|---|---|---|
| 複合過去 | 現在 | j'ai chanté |
| 大過去 | 半過去 | j'avais chanté |
| 前未来 | 単純未来 | j'aurai chanté |
| 条件法過去 | 条件法現在 | j'aurais chanté |
| 接続法過去 | 接続法現在 | que j'aie chanté |

**過去分詞 chanté は5つすべてで同じ**です。変わるのは助動詞の時制だけ。

:::conj chanter passeCompose,plusQueParfait,futurAnterieur

:::note 複合時制は「時制の入れ子」
複合時制の意味は、**助動詞の時制が示す時点から見て、すでに完了している**ということです。

- j'**ai** chanté … 現在から見て完了 → 複合過去
- j'**avais** chanté … 過去から見て完了 → 大過去
- j'**aurai** chanté … 未来から見て完了 → 前未来

英語の have / had / will have sung とまったく同じ構造です。だから第20章で複合過去の作り方を理解すれば、第27.5章の大過去も第24章の前未来も、追加で覚えることはありません。
:::

### ④ 単純過去

物語や歴史記述でしか使われない、書き言葉専用の時制です。語尾は3つの型に分かれます。

| 型 | 語尾 | 例 |
|---|---|---|
| **-a 型**（第1群） | -ai, -as, -a, -âmes, -âtes, -èrent | je chantai |
| **-i 型**（第2群・多くの第3群） | -is, -is, -it, -îmes, -îtes, -irent | je finis |
| **-u 型**（一部の第3群） | -us, -us, -ut, -ûmes, -ûtes, -urent | je fus, j'eus |

第20.5章で扱います。**読めれば十分**で、自分で書けるようになる必要はありません。

## 4. finir — 第2群の代表

全体図を確認したところで、第2群（le deuxième groupe）の動詞を導入します。

:::conj finir présent

:::warn 第2群の目印は -iss-
第2群は -ir で終わりますが、**複数形（nous, vous, ils）に -iss- が挿入されます**。これが第2群の唯一かつ決定的な目印です。

- fin**is** / fin**is** / fin**it** … 単数（-iss- なし）
- fin**iss**ons / fin**iss**ez / fin**iss**ent … 複数（-iss- あり）

同じ -ir でも、partir（pars, partons）や venir（viens, venons）には -iss- が入りません。これらは**第3群**です。

**辞書を引かずに見分ける方法はありません。** ただし第2群は約300語と限られており、しかも多くが**形容詞から作られた「〜になる」型の動詞**なので、意味から推測できることがあります。
:::

:::deep 第2群は形容詞から動詞を作る仕組み
第2群の動詞には、形容詞に -ir を付けて作られたものが多数あります。

| 形容詞 | 第2群動詞 | 意味 |
|---|---|---|
| [[grand\|グラン\|大きい]] | [[grandir\|グランディール]] | 大きくなる |
| [[rouge\|ルージュ\|赤い]] | [[rougir\|ルージール]] | 赤くなる、赤面する |
| [[gros\|グロ\|太い]] | [[grossir\|グロスィール]] | 太る |
| [[maigre\|メーグル\|やせた]] | [[maigrir\|メグリール]] | やせる |
| [[vieux\|ヴィユー\|年老いた]] | [[vieillir\|ヴィエイール]] | 年をとる |
| [[jeune\|ジュヌ\|若い]] | [[rajeunir\|ラジュニール]] | 若返る |
| [[blanc\|ブラン\|白い]] | [[blanchir\|ブランシール]] | 白くなる |

**「その形容詞の状態になる」**という規則的な意味を持ちます。したがって、形容詞を知っていれば第2群動詞を推測でき、逆も成り立ちます。

なお第2群は**新しい動詞をほとんど生みません**（新語はすべて第1群 -er に入ります）。閉じた集合として扱ってよい群です。
:::

:::ex finir を使ってみる
Je finis mon travail. | ジュ・フィニ・モン・トラヴァイユ | 私は仕事を終える。
Le film finit à dix heures. | ル・フィルム・フィニ・ア・ディ・ザール | 映画は10時に終わる。
Nous finissons bientôt. | ヌー・フィニソン・ビアント | 私たちはもうすぐ終わる。
Ils choisissent un cadeau. | イル・シュワズィス・アン・カド | 彼らは贈り物を選ぶ。
Elle réussit toujours. | エル・レユスィ・トゥジュール | 彼女はいつも成功する。
:::

:::note finir も4つを押さえれば全時制が作れる
第2群の finir で、①〜④を確認してみます。

| # | finir の場合 |
|---|---|
| ① 現在形 | finis, finis, finit, finissons, finissez, finissent |
| ② 未来語幹 | **finir-**（不定詞そのもの） |
| ③ 過去分詞 | **fini**（助動詞は avoir） |
| ④ 単純過去 | fin- + -i 型 |

ここから導かれるもの：
- 半過去 → nous finiss**ons** − ons = **finiss-** → je finissais
- 接続法 → ils finiss**ent** − ent = **finiss-** → que je finisse
- 単純未来 → finir + ai = **je finirai**
- 条件法 → finir + ais = **je finirais**
- 複合過去 → avoir + fini = **j'ai fini**

**新しい情報は4つだけで、12時制すべてが出てきました。**
:::

## 6. 不規則動詞も同じ構造で捉える

不規則動詞は「バラバラで覚えられない」と思われがちですが、**①〜④の枠に入れてしまえば同じ**です。

:::vmap prendre

:::ex 不規則動詞も4つで整理できる
prendre | プランドル | 取る、乗る
:::

| # | prendre の場合 |
|---|---|
| ① 現在形 | prends, prends, prend, prenons, prenez, **prennent** |
| ② 未来語幹 | **prendr-** |
| ③ 過去分詞 | **pris**（助動詞は avoir） |
| ④ 単純過去 | pr- + -i 型 |

ここから：
- 半過去 → nous pren**ons** → **pren-** → je prenais
- 接続法 → ils prenn**ent** → **prenn-** → que je prenne（半過去語幹とは別！）
- 単純未来 → **je prendrai**
- 複合過去 → **j'ai pris**

**prendre は半過去語幹（pren-）と接続法語幹（prenn-）が違う**という点だけが特徴で、それ以外は chanter とまったく同じ手順です。

:::note 語幹が2つに割れる動詞
prendre のように、**単数・3人称複数で語幹が変わる**動詞は第3群に多くあります。

| 動詞 | 弱い語幹（nous, vous） | 強い語幹（je, tu, il, ils） |
|---|---|---|
| prendre | pren- | prend- / prenn- |
| boire | buv- | boi- / boiv- |
| venir | ven- | vien- / vienn- |
| devoir | dev- | doi- / doiv- |
| recevoir | recev- | reçoi- / reçoiv- |

**強勢が置かれる音節（単数・3複）で母音が変化する**という、規則的な現象です。だから「半過去は弱い語幹から、接続法は強い語幹から」と整理できます。

この動詞群は、覚える語幹が2つになるだけで、導出の手順は変わりません。
:::

## 7. どこから覚えるか — 優先順位

:::deep 学習の順序
すべての動詞を平等に覚える必要はありません。頻度には極端な偏りがあります。

**最優先（この2つがないと何も言えない）**
être、avoir —— 助動詞としても使うため、全時制を最初に固める

**次点（日常会話の骨格）**
aller、faire、venir、pouvoir、vouloir、devoir、savoir、dire、voir、prendre

この10語で、フランス語の会話に現れる動詞のかなりの部分が説明できます。

**その後**
第1群（-er）は規則的なので、活用表を1つ覚えれば4,000語に適用できます。個別に覚える必要はありません。

**時制の優先順位**
1. 直説法現在（すべての出発点）
2. 複合過去（最も使う過去形）
3. 半過去（現在形さえあれば作れる）
4. 単純未来 → 条件法現在（語尾を変えるだけ）
5. 接続法現在（用法のほうが難しい）
6. 単純過去・大過去・前未来・条件法過去・接続法過去（読解用）
:::

## 8. この図式で辞書を読む — 実践の手順

:::tip 新しい動詞に出会ったら
辞書やアプリで新しい動詞を引いたとき、**4つだけ**メモしてください。

1. **不定詞**（＝未来語幹の素）… 例：écrire
2. **直説法現在の nous と ils** … nous écrivons / ils écrivent
3. **過去分詞** … écrit
4. **（読書家なら）単純過去の il** … il écrivit

これで écrire の全時制が導けます。半過去は écriv-（nous から）、接続法は écriv-（ils から）、複合時制はすべて écrit で、未来は écrir- + 語尾。

**市販の動詞活用表が1動詞に50個の形を載せる**のに対し、覚えるのは4つ。残りは規則が生成してくれます。この教材の活用表（メニューの「動詞活用表」）で任意の動詞を引き、**4つの情報から他の形を自分で予測 → 表で答え合わせ**という練習が、活用習得の最短路です。
:::

## 10. 語尾の音は時制を越えて共通 — 音の骨格

活用語尾を「時制ごとに別物」と覚えると量が膨れます。実は**人称ごとの音はほぼ全時制で共通**です。

| 人称 | ほぼ常に | 例（半過去／未来／条件法） |
|---|---|---|
| je / tu | 無音（-s は読まない） | chantais / chanterai / chanterais |
| il | 無音（-t は読まない） | chantait / chantera / chanterait |
| **nous** | **常に「オン」[ɔ̃]**（-ons） | chantions / chanterons / chanterions |
| **vous** | **常に「エ」[e]**（-ez） | chantiez / chanterez / chanteriez |
| ils | 無音（-ent）または鼻母音（-ont） | chantaient / chanteront / chanteraient |

つまり、**音として覚える価値があるのは nous の「オン」と vous の「エ」だけ**で、あとは語幹＋時制の目印（半過去の「エ」、未来の「ラ」）が聞こえるかどうかの問題です。

- 未来と条件法の違いは、je で **[e]（chanterai）と [ɛ]（chanterais）**の母音の差だけ——実際の会話ではほぼ聞き分けられず、文脈で判断されています
- ils の **-ont**（sont, ont, vont, font, chanteront）だけは「オン」と読む——**この4動詞 + 未来形**に限られた音です

「書き分けは細かいが、音はずっと単純」——この非対称を知っておくと、聞き取りの負担が大きく減ります。

## 11. 不規則動詞の「不規則さ」の中身

「不規則動詞」といっても、**4つの情報すべてが不規則な動詞はごくわずか**です。どこが不規則かを型で分類しておくと、覚える箇所が絞れます。

| 不規則の種類 | 例 | どこだけ違うか |
|---|---|---|
| **語幹が2つに割れる** | venir, prendre, boire, devoir, recevoir | 現在形の nous / vous と他 |
| **未来語幹だけ不規則** | aller (ir-), voir (verr-), envoyer (enverr-), courir (courr-) | 未来・条件法のみ |
| **過去分詞だけ不規則** | naître (né), mourir (mort), ouvrir (ouvert) | 複合時制のみ |
| **接続法だけ不規則** | faire (fass-), pouvoir (puiss-), savoir (sach-), aller (aill-), vouloir (veuill-) | 接続法のみ |
| **全面的に不規則** | **être, avoir** | ほぼすべて |

**全面的に不規則なのは être と avoir の2語だけ**です。他はどこか1〜2箇所が違うだけで、残りは規則どおりに導けます。

:::ex 「1箇所だけ不規則」の例
Je vois. → Je verrai.（未来語幹 verr- だけ不規則） | ジュ・ヴォワ・ジュ・ヴェレ | 見る → 見るだろう
Il ouvre. → Il a ouvert.（過去分詞 ouvert だけ不規則） | イ・ルーヴル・イ・ラ・ウヴェール | 開ける → 開けた
Nous faisons. → que nous fassions.（接続法語幹だけ不規則） | ヌ・フゾン・ク・ヌ・ファスィヨン | する → するように
:::

**ouvrir 型**（ouvrir, offrir, souffrir, couvrir, cueillir）は綴りが -ir なのに**現在形は第1群と同じ語尾**（j'ouvre, tu ouvres, il ouvre）を取る、という別種の「不規則」です。ここも「現在形は第1群、過去分詞だけ -ert」と押さえれば済みます。

**結論**：不規則動詞の学習とは、**4つの情報のうちどれが規則から外れるかを1動詞ずつ確認する作業**であって、50個の形を丸暗記する作業ではありません。この章の図式は、その確認作業の枠組みそのものです。

  sub: 'マリはヴィーナスより美しい',
  body: `
英語は比較級を作るのに2つの方法を持っています（-er を付けるか more を使うか）。**フランス語は1つだけ**です。形容詞そのものは一切変化せず、前に副詞を置くだけ。この点ではフランス語のほうがはるかに単純です。

ただし**最上級には定冠詞が必要**で、その定冠詞が何に一致するかという問題があります。また bon / bien の比較級が不規則で、しかも混同されやすい——ここが実質的な難所です。

## 1. 比較級 — 3つの度合い

**plus / aussi / moins + 形容詞 + que** で作ります。

| | 形 | 意味 |
|---|---|---|
| **優等比較** | plus … que | 〜より…だ |
| **同等比較** | aussi … que | 〜と同じくらい…だ |
| **劣等比較** | moins … que | 〜より…でない |

:::ex 比較級の3段階
Marie est plus belle que Vénus. | マリ・エ・プリュ・ベル・ク・ヴェニュス | マリはヴィーナスより美しい。
Marie est aussi belle que Vénus. | マリ・エ・トスィ・ベル・ク・ヴェニュス | マリはヴィーナスと同じくらい美しい。
Marie est moins belle que Vénus. | マリ・エ・モワン・ベル・ク・ヴェニュス | マリはヴィーナスほど美しくない。
:::

:::note 形容詞は変化しない、ただし一致はする
plus / moins を付けても、**形容詞そのものの形は変わりません**（英語の big → bigger のような変化がない）。

ただし**主語との性数一致は通常どおり行われます**。
- [[Il est plus grand.\|イ・レ・プリュ・グラン\|彼のほうが背が高い。]]
- [[Elle est plus grande.\|エ・レ・プリュ・グランド\|彼女のほうが背が高い。]]
- [[Ils sont plus grands.\|イル・ソン・プリュ・グラン\|彼らのほうが背が高い。]]
:::

:::warn plus の s は発音するのか
文脈で変わります。学習者が最も混乱する発音の1つです。

| 場面 | 発音 |
|---|---|
| 比較級（形容詞・副詞の前） | 「プリュ」（s を読まない） |
| 母音の前でリエゾン | 「プリュ**ズ**」 |
| 文末・単独・数量の plus | 「プリュ**ス**」 |
| 否定の ne … plus | 「プリュ」（s を読まない） |

- [[plus grand\|プリュ・グラン\|より大きい]]（子音の前 → 読まない）
- [[plus intelligent\|プリュ・ザンテリジャン\|より賢い]]（母音の前 → リエゾンで [z]）
- [[Moi, j'en veux plus.\|モワ・ジャン・ヴ・プリュス\|私はもっと欲しい。]]（文末 → [s]）
- [[Je n'en veux plus.\|ジュ・ナン・ヴ・プリュ\|私はもう要らない。]]（否定 → 読まない）

**最後の2つは意味が正反対なのに、s の有無だけで区別されます。** 話し言葉では ne が落ちるため（第5章）、「もっと欲しい」と「もう要らない」が s の発音だけで分かれることになります。
:::

## 2. 副詞・名詞・動詞の比較

比較の対象は形容詞だけではありません。

### 副詞の比較 — 形容詞と同じ

:::ex 副詞の比較
Il court plus vite que moi. | イル・クール・プリュ・ヴィット・ク・モワ | 彼は私より速く走る。
Elle parle moins fort que lui. | エル・パルル・モワン・フォール・ク・リュイ | 彼女は彼より小さな声で話す。
:::

### 名詞の比較 — de が入る

**数量を比べるので、第2章の数量表現と同じく de が必要**です。

:::ex 名詞の比較（de が入る）
J'ai plus de livres que toi. | ジェ・プリュス・ドゥ・リーヴル・ク・トワ | 私は君より本をたくさん持っている。
Il a autant d'amis que moi. | イラ・オタン・ダミ・ク・モワ | 彼は私と同じくらい友人がいる。
Elle a moins de temps que nous. | エラ・モワン・ドゥ・タン・ク・ヌー | 彼女は私たちより時間が少ない。
:::

:::warn 同等比較は名詞のときだけ autant
形容詞・副詞では **aussi**、名詞・動詞では **autant** を使います。

| 比べる対象 | 同等比較 |
|---|---|
| 形容詞 | **aussi** grand que |
| 副詞 | **aussi** vite que |
| 名詞 | **autant de** livres que |
| 動詞 | **autant** que |

[[Il travaille autant que moi.\|イル・トラヴァイユ・オタン・ク・モワ\|彼は私と同じくらい働く。]]（動詞の比較）

aussi と autant を取り違えるのは頻出の誤りです。**「数えるものには autant」**と覚えてください。
:::

## 3. 不規則な比較級 — bon と bien

:::warn bon / bien の比較級は絶対に押さえる
**bon（良い）と bien（よく）は、優等比較だけが不規則**です。しかも混同されやすいので、ここは丁寧に区別してください。

| 原級 | 品詞 | 優等比較 | 意味 |
|---|---|---|---|
| **bon** | 形容詞 | **meilleur** | より良い |
| **bien** | 副詞 | **mieux** | より良く |

:::ex meilleur と mieux
Ce vin est meilleur que l'autre. | ス・ヴァン・エ・メイユール・ク・ロートル | このワインのほうがおいしい。（形容詞）
Elle chante mieux que moi. | エル・シャント・ミュー・ク・モワ | 彼女は私より上手に歌う。（副詞）
:::

**見分け方**は品詞の判定と同じです。
- **名詞を修飾する／être の後に来る** → 形容詞 → **meilleur**
- **動詞を修飾する** → 副詞 → **mieux**

meilleur は形容詞なので**性数一致します**（meilleure, meilleurs, meilleures）。mieux は副詞なので変化しません。

なお **plus bon とは言えません**（× plus bon）。一方 **plus mauvais は言えます**（pire という不規則形もありますが、plus mauvais のほうが日常的です）。

同等比較・劣等比較は規則どおりです：aussi bon que、moins bon que、aussi bien que、moins bien que。
:::

:::deep mal と petit の比較級
不規則な比較級は他にもありますが、使用場面が限られます。

| 原級 | 比較級 | 用法 |
|---|---|---|
| **mauvais**（悪い） | plus mauvais / **pire** | pire は抽象的・道徳的な文脈 |
| **mal**（悪く） | plus mal / **pis** | pis はほぼ成句のみ（tant pis） |
| **petit**（小さい） | plus petit / **moindre** | moindre は抽象的な「より少ない」 |

- [[C'est pire que je pensais.\|セ・ピール・ク・ジュ・パンセ\|思っていたより悪い。]]
- [[Tant pis !\|タン・ピ\|仕方ない！]]（成句）
- [[sans le moindre doute\|サン・ル・モワンドル・ドゥット\|いささかの疑いもなく]]

物理的な大きさには plus petit を使い、moindre は「程度が小さい」という抽象的な意味に限られます。
:::

## 4. 最上級 — 定冠詞を付ける

**比較級の前に定冠詞を置く**だけです。

| | 形 |
|---|---|
| 最上（〜のうち最も…） | **le / la / les plus** … （de …） |
| 最下（〜のうち最も…でない） | **le / la / les moins** … （de …） |

:::ex 最上級
Marie est la plus belle de la classe. | マリ・エ・ラ・プリュ・ベル・ドゥ・ラ・クラス | マリはクラスで一番美しい。
C'est le livre le plus intéressant. | セ・ル・リーヴル・ル・プリュ・ザンテレサン | それが一番面白い本だ。
Ce sont les moins chers. | ス・ソン・レ・モワン・シェール | それらが一番安い。
:::

:::warn 「〜の中で」は de を使う
英語の in / of にあたる部分は、**フランス語では常に de** です。

- ○ [[le plus grand du monde\|ル・プリュ・グラン・デュ・モンド\|世界一大きい]]
- ○ [[la plus belle de la classe\|ラ・プリュ・ベル・ドゥ・ラ・クラス\|クラスで一番美しい]]
- × le plus grand dans le monde

「世界**で**」だから dans と考えたくなりますが、**最上級の範囲は必ず de** です。
:::

### 形容詞の位置によって定冠詞の数が変わる

:::deep 最上級で定冠詞が2回出るのはなぜか
第6章で見た形容詞の位置が、ここで効いてきます。

**（1）前置される形容詞** → 定冠詞は1つ
[[la plus belle fille\|ラ・プリュ・ベル・フィーユ\|最も美しい少女]]
（belle は前置形容詞なので、la plus belle がそのまま fille の前に立つ）

**（2）後置される形容詞** → 定冠詞が2つ
[[la fille la plus intelligente\|ラ・フィーユ・ラ・プリュ・ザンテリジャント\|最も賢い少女]]
（intelligente は後置形容詞なので、名詞に定冠詞、最上級にも定冠詞が要る）

後者で la が2回出るのは冗長に見えますが、**名詞の限定詞（la fille）と最上級の標識（la plus）は別のもの**だからです。省略できません。

なお所有形容詞がある場合は、それが限定詞の役割を果たします。
[[mon plus beau souvenir\|モン・プリュ・ボー・スヴニール\|私の最も美しい思い出]]（× mon le plus beau）
:::

:::warn 副詞の最上級は常に le
副詞には性がないので、**定冠詞は常に le** です。

- [[Elle chante le mieux.\|エル・シャント・ル・ミュー\|彼女が一番上手に歌う。]]
- [[Il court le plus vite.\|イル・クール・ル・プリュ・ヴィット\|彼が一番速く走る。]]

主語が女性でも複数でも le のままです。**形容詞の最上級と混同しないでください。**

- [[Elle est la meilleure.\|エ・レ・ラ・メイユール\|彼女が一番だ。]]（形容詞 → la）
- [[Elle chante le mieux.\|エル・シャント・ル・ミュー\|彼女が一番上手に歌う。]]（副詞 → le）
:::

## 5. 比較を使った表現

:::adv よく使う比較の構文

**de plus en plus / de moins en moins**（ますます〜／ますます〜でなく）
[[Il fait de plus en plus chaud.\|イル・フェ・ドゥ・プリュ・ザン・プリュ・ショー\|ますます暑くなる。]]

**plus … plus …**（〜すればするほど…）
[[Plus on apprend, plus on comprend.\|プリュ・ゾン・ナプラン・プリュ・ゾン・コンプラン\|学べば学ぶほど理解できる。]]

**le plus … possible**（できるだけ〜）
[[le plus vite possible\|ル・プリュ・ヴィット・ポスィブル\|できるだけ速く]]

**deux fois plus … que**（〜の2倍…）
[[Il est deux fois plus grand que moi.\|イ・レ・ドゥ・フォワ・プリュ・グラン・ク・モワ\|彼は私の2倍の背丈だ。]]
:::

:::adv 比較の que の後ろでは強勢形を使う
第19章で扱いますが、比較の que の後ろに代名詞が来る場合、主語の形（je, tu, il）ではなく**強勢形**（moi, toi, lui）を使います。

- ○ [[Il est plus grand que moi.\|イ・レ・プリュ・グラン・ク・モワ\|彼は私より背が高い。]]
- × Il est plus grand que je.

英語の口語 taller than me と同じ形になります（英語の規範文法では than I ですが、フランス語では moi が唯一の正解です）。
:::

:::adv 比較の que の後ろの虚辞の ne
第5章で扱った虚辞の ne が、比較級の que の後ろに現れることがあります。

[[Il est plus grand que je ne pensais.\|イ・レ・プリュ・グラン・ク・ジュ・ヌ・パンセ\|彼は私が思っていたより背が高い。]]

この ne に否定の意味はありません。**書き言葉・改まった文体でのみ**現れます。話し言葉では省略されます。
:::

## 6. 比較の細部 — 大学レベルの4点

:::deep 押さえておきたい細部

**（1）que の後の代名詞は強勢形**

[[Il est plus grand que moi.|イ・レ・プリュ・グラン・ク・モワ|彼は私より背が高い。]]（× que je）

比較の que の後ろは強い位置なので強勢形です（第19章）。

**（2）比較の従属節では虚辞の ne**

[[C'est plus difficile que je ne pensais.|セ・プリュ・ディフィスィル・ク・ジュ・ヌ・パンセ|思っていたより難しい。]]

que の後ろに**文**が来ると、書き言葉では否定でない **ne**（虚辞の ne、第31.5章）が入ります。「思っていたほどではない」という含みの名残で、話し言葉では落ちます。

**（3）数量の差を示す — de**

[[Il est plus âgé que moi de trois ans.|イ・レ・プリュ・ザジェ・ク・モワ・ドゥ・トロワ・ザン|彼は私より3歳年上だ。]]
[[C'est 10 euros de plus.|セ・ディ・ズーロ・ドゥ・プリュス|10ユーロ高い。]]

差の大きさは **de** で導きます。**de plus / de moins**（〜多く／少なく）は価格・年齢の会話で頻出です。

**（4）比較級を強める語**

「ずっと〜」「はるかに〜」は **beaucoup / bien / encore + plus** で作ります。

- [[C'est beaucoup plus cher.|セ・ボクー・プリュ・シェール|ずっと高い。]]
- [[Elle chante bien mieux que moi.|エル・シャント・ビヤン・ミュー・ク・モワ|彼女は私よりずっと歌がうまい。]]
- [[C'est encore pire.|セ・タンコール・ピール|なおさら悪い。]]

**pire**（plus mauvais の不規則形）は抽象的な「悪さ」に使い、具体的な品質には plus mauvais も使えます。**C'est pire.**（もっとひどい）、**de pire en pire**（ますます悪く）は口語頻出。

**（5）進行の比較 — de plus en plus**

- [[Il fait de plus en plus chaud.|イル・フェ・ドゥ・プリュ・ザン・プリュ・ショ|ますます暑くなってきた。]]
- [[de moins en moins|ドゥ・モワン・ザン・モワン|ますます〜でなく]]

**plus … plus …**（〜すればするほど）とあわせて、変化を語る道具です：[[Plus je le connais, plus je l'apprécie.|プリュ・ジュ・ル・コネ・プリュ・ジュ・ラプレスィ|知れば知るほど彼が好きになる。]]（文頭の plus に冠詞・que は不要）
:::

## 7. 「同じ」「違う」「〜みたい」 — 比較の親戚

比較級の周辺には、同一性・類似を言う道具がそろっています。

| 表現 | 意味 | 例 |
|---|---|---|
| **le même / la même … que** | 〜と同じ… | J'ai la même veste que toi. |
| **comme** | 〜のように | Il parle comme un Parisien. |
| **pareil / pareille** | 同じような | C'est pareil.（同じことだよ） |
| **différent(e) de** | 〜と違う | C'est différent du Japon. |
| **ressembler à** | 〜に似ている | Elle ressemble à sa mère. |
| **on dirait** | まるで〜みたい | On dirait son frère. |

:::ex 同じ・違う・似ている
J'ai la même veste que toi ! | ジェ・ラ・メーム・ヴェスト・ク・トワ | 君と同じ上着持ってる！
C'est pareil. / Ce n'est pas pareil. | セ・パレイユ | 同じだよ。／それとこれとは話が別。
Elle ressemble beaucoup à sa mère. | エル・ルサンブル・ボクー・ア・サ・メール | 彼女は母親によく似ている。
On dirait un rêve. | オン・ディレ・アン・レーヴ | まるで夢みたいだ。
Il fait doux pour la saison. | イル・フェ・ドゥ・プール・ラ・セゾン | 季節のわりに暖かい。
:::

- **le même … que**：même の比較対象も que で導く（第10.5章の même）
- **Ce n'est pas pareil.**（それは話が別）は反論の定番
- **on dirait + 名詞**（まるで〜みたい）は dire の条件法（第30章）から来た比喩の定型
- **pour + 名詞**（〜のわりに）は基準ずらしの比較：grand pour son âge（年のわりに大きい）

## 8. まとめの表

:::note 比較・最上級・一覧
| 比べる対象 | 優等 | 同等 | 劣等 |
|---|---|---|---|
| 形容詞 | plus … que | **aussi** … que | moins … que |
| 副詞 | plus … que | **aussi** … que | moins … que |
| 名詞 | plus **de** … que | **autant de** … que | moins **de** … que |
| 動詞 | … plus que | … **autant** que | … moins que |

**不規則**
- bon（形容詞）→ **meilleur**（性数一致する）
- bien（副詞）→ **mieux**（変化しない）

**最上級**
- 形容詞 → le / la / les plus（性数一致）
- 副詞 → **le** plus（常に le）
- 範囲は **de**（× dans）
:::


:::ai-gen 比較級と最上級、meilleur と mieux の使い分け

## 9. 数量の比較 — plus de と plus que

比較の対象が**数量**になると、que と de の区別が必要になります。

| 形 | 意味 | 例 |
|---|---|---|
| **plus de + 数詞** | 〜より多い（数量そのもの） | Il a **plus de** trente ans.（30歳を超えている） |
| **plus que + 名詞** | 〜より多く（比較の相手） | Il travaille **plus que** moi.（私より働く） |
| **plus de + 名詞 + que** | 〜より多くの… | J'ai **plus de** livres **que** toi. |

:::ex 数量の比較
Il y a plus de cent personnes. | イ・リ・ヤ・プリュ・ドゥ・サン・ペルソンヌ | 100人以上いる。
Ça coûte moins de dix euros. | サ・クート・モワン・ドゥ・ディ・ズーロ | 10ユーロ未満だ。
J'ai plus de travail que lui. | ジェ・プリュ・ドゥ・トラヴァイユ・ク・リュイ | 私は彼より仕事が多い。
Elle a autant de patience que sa mère. | エラ・オータン・ドゥ・パスィヤンス・ク・サ・メール | 彼女は母親と同じくらい辛抱強い。
:::

**数詞の前は必ず de**（plus de trois、moins de dix）です。× plus que trois とは言いません。「〜以上／未満」という数の話だからです。

**同等比較の3つ**も整理します。

| 修飾する相手 | 形 | 例 |
|---|---|---|
| 形容詞・副詞 | **aussi … que** | aussi grand que toi |
| 名詞 | **autant de … que** | autant de livres que toi |
| 動詞 | **autant que** | Il travaille autant que moi. |

**aussi は形容詞・副詞、autant は名詞・動詞**——第6.5章で見た très / beaucoup の対立とまったく同じ分業です。「とても」の très / beaucoup、「同じくらい」の aussi / autant——フランス語は**修飾する相手で語を変える**言語だ、という原則がここでも働いています。
