  title: '前置詞と定冠詞の縮約',
  sub: 'café au lait の au です',
  body: `
**à** と **de** という2つの前置詞は、定冠詞 **le / les** と出会うと、**必ず1語に融合します**。これを縮約（la contraction）と呼びます。

規則そのものは4つ覚えるだけですが、この縮約を知らないと、**du や des が部分冠詞なのか前置詞なのか判別できません**。第2章の宿題がここで回収されます。

## 1. 縮約の4つの形

| 前置詞 + 定冠詞 | 縮約形 | 例 |
|---|---|---|
| à + **le** | **au** | [[au cinéma\|オ・スィネマ\|映画館へ]] |
| à + **les** | **aux** | [[aux étudiants\|オ・ゼテュディアン\|学生たちに]] |
| de + **le** | **du** | [[du professeur\|デュ・プロフェスール\|先生の]] |
| de + **les** | **des** | [[des enfants\|デ・ザンファン\|子どもたちの]] |

:::warn la と l' は縮約しない
縮約が起きるのは **le と les だけ**です。

| | 縮約する？ |
|---|---|
| à + le → **au** | ○ |
| à + les → **aux** | ○ |
| à + la → **à la** | ×（そのまま） |
| à + l' → **à l'** | ×（そのまま） |

:::ex 縮約する／しない
au restaurant | オ・レストラン | レストランへ（à + le）
à la gare | ア・ラ・ガール | 駅へ（à + la、そのまま）
à l'hôtel | ア・ロテル | ホテルへ（à + l'、そのまま）
du café | デュ・カフェ | コーヒーの（de + le）
de la maison | ドゥ・ラ・メゾン | 家の（de + la、そのまま）
:::
:::

:::note なぜ le と les だけが縮約するのか
le は母音が弱い [lə]、les は [le] で、どちらも**直前の母音と融合しやすい**音です。一方 la は [la] という明瞭な母音を持ち、l' はすでにエリジオンで縮んでいるため、これ以上縮む余地がありません。

つまり縮約も、第0章で見たエリジオン・リエゾンと同じく、**母音の連続を避けようとする力**の産物です。

歴史的には au は **al**（à le）から、l が母音化して au になったものです（cheval → chevaux と同じ変化）。
:::

## 2. café au lait の au

タイトルの答えです。

- [[le café au lait\|ル・カフェ・オ・レ\|カフェオレ]] ← café **à le** lait
- [[la tarte aux pommes\|ラ・タルト・オ・ポム\|りんごのタルト]] ← tarte **à les** pommes

**à + 定冠詞**が「〜入りの、〜風の」という意味で料理名を作ります。フランス料理のメニューに au / aux が頻出するのはこのためです。

:::ex 料理名の au / aux
un sandwich au fromage | アン・サンドウィッチ・オ・フロマージュ | チーズサンドイッチ
une soupe à l'oignon | ユヌ・スープ・ア・ロニョン | オニオンスープ
une glace à la vanille | ユヌ・グラス・ア・ラ・ヴァニーユ | バニラアイス
un poulet aux herbes | アン・プーレ・オ・ゼルブ | ハーブ風味のチキン
:::

「オニオンスープ」が à l'oignon、「バニラアイス」が à la vanille なのは、oignon が母音始まり、vanille が女性名詞で、どちらも**縮約しない**からです。

## 3. du / des の正体を見分ける

:::deep 同じ形で3つの機能がある
**du** と **des** は、まったく別の3つのものが同じ綴りになったものです。ここを区別できるかが、この章の実質的な目標です。

| 形 | 正体 | 例 |
|---|---|---|
| **du**① | 部分冠詞（ある量の） | [[Je bois du café.\|ジュ・ボワ・デュ・カフェ\|コーヒーを飲む。]] |
| **du**② | de + le の縮約（所有・起点） | [[Je viens du Japon.\|ジュ・ヴィアン・デュ・ジャポン\|日本から来た。]] |
| **des**① | 不定冠詞の複数（いくつかの） | [[J'ai des amis.\|ジェ・デ・ザミ\|友人が何人かいる。]] |
| **des**② | de + les の縮約 | [[le livre des étudiants\|ル・リーヴル・デ・ゼテュディアン\|学生たちの本]] |
| **des**③ | 数量表現の de + les | [[la plupart des gens\|ラ・プリュパール・デ・ジャン\|大部分の人々]] |

**見分け方**は「de に意味があるか」です。

- **部分冠詞** … de に意味はない。冠詞そのもの。「ある量の〜」と訳せる
- **縮約** … de が前置詞として働いている。「〜の」「〜から」と訳せる

判定の実務的な方法：**冠詞を別のものに置き換えられるか**を試します。
- Je bois du café. → Je bois **un** café.（置き換えられる → 冠詞の位置＝部分冠詞）
- Je viens du Japon. → × Je viens un Japon.（置き換えられない → 前置詞 de + 定冠詞）
:::

## 4. 前置詞 à の主な用法

:::deep à が表すもの

**（1）場所（〜へ、〜で）**
[[Je vais à Paris.\|ジュ・ヴェ・ザ・パリ\|パリへ行く。]]／[[Il habite à Tokyo.\|イラビット・ア・トキョ\|東京に住んでいる。]]

à は「到達点」と「所在」の両方を表します。英語の to と at の区別がありません。

**（2）時刻（〜に）**
[[à trois heures\|ア・トロ・ザール\|3時に]]、[[à midi\|ア・ミディ\|正午に]]

**（3）間接目的（〜に）**
[[Je parle à Marie.\|ジュ・パルル・ア・マリ\|マリに話す。]]／[[donner à\|ドネ・ア\|〜に与える]]
第18章の間接目的補語人称代名詞は、この à が代名詞化したものです。

**（4）所有・帰属（〜のもの）**
[[Ce livre est à moi.\|ス・リーヴル・エ・タ・モワ\|この本は私のものだ。]]
所有を表すのに de ではなく à を使う、être を伴う特殊な構文です。

**（5）手段・特徴（〜で、〜つきの）**
[[à pied\|ア・ピエ\|徒歩で]]、[[à vélo\|ア・ヴェロ\|自転車で]]、[[une fille aux yeux bleus\|ユヌ・フィーユ・オ・ズィユ・ブル\|青い目の少女]]

**（6）用途（〜のための）**
[[une machine à laver\|ユヌ・マシー・ナ・ラヴェ\|洗濯機]]、[[une tasse à café\|ユヌ・タス・ア・カフェ\|コーヒーカップ]]

**une tasse à café**（コーヒー用のカップ）と **une tasse de café**（一杯のコーヒー）は別物です。à は用途、de は中身を表します。
:::

## 5. 前置詞 de の主な用法

:::deep de が表すもの

**（1）所有・所属（〜の）**
[[le livre de Marie\|ル・リーヴル・ドゥ・マリ\|マリの本]]、[[la porte de la maison\|ラ・ポルト・ドゥ・ラ・メゾン\|家のドア]]

英語の 's にあたる形がフランス語にはないので、**すべて de で表します**。語順は英語と逆になります（the book **of** Marie の語順）。

**（2）起点（〜から）**
[[Je viens de Paris.\|ジュ・ヴィアン・ドゥ・パリ\|パリから来た。]]、[[de Tokyo à Osaka\|ドゥ・トキョ・ア・オサカ\|東京から大阪まで]]

**（3）材質・内容（〜製の、〜の）**
[[une table de bois\|ユヌ・ターブル・ドゥ・ボワ\|木製の机]]、[[un verre de vin\|アン・ヴェール・ドゥ・ヴァン\|グラス一杯のワイン]]

**（4）数量表現の後（第2章）**
[[beaucoup de livres\|ボクー・ドゥ・リーヴル\|たくさんの本]]

**（5）動詞・形容詞に required される de**
[[parler de\|パルレ・ドゥ\|〜について話す]]、[[avoir besoin de\|アヴォワール・ブゾワン・ドゥ\|〜が必要である]]、[[content de\|コンタン・ドゥ\|〜に満足している]]

**（6）不定詞を導く**
[[Il est content de partir.\|イ・レ・コンタン・ドゥ・パルティール\|彼は出発できて満足だ。]]
:::

## 6. 国名・地名につく前置詞

:::warn 国名の前置詞は名詞の性で決まる
「フランスへ」「日本へ」を言うとき、前置詞が名詞の性と数で変わります。**旅行や自己紹介で必ず使うので、規則として押さえてください。**

| 国名の種類 | 「〜へ・〜で」 | 「〜から」 | 例 |
|---|---|---|---|
| 女性国名（-e で終わる） | **en** | **de** | en France / de France |
| 男性国名（子音で終わる） | **au** | **du** | au Japon / du Japon |
| 母音で始まる国名 | **en** | **d'** | en Iran / d'Iran |
| 複数国名 | **aux** | **des** | aux États-Unis / des États-Unis |
| 都市名 | **à** | **de** | à Paris / de Paris |

:::ex 国と都市の前置詞
Je vais en France. | ジュ・ヴェ・ザン・フランス | 私はフランスへ行く。
Je vais au Japon. | ジュ・ヴェ・ゾ・ジャポン | 私は日本へ行く。
Je vais aux États-Unis. | ジュ・ヴェ・ゾ・ゼタジュニ | 私はアメリカへ行く。
Je vais à Paris. | ジュ・ヴェ・ザ・パリ | 私はパリへ行く。
Je viens du Japon. | ジュ・ヴィアン・デュ・ジャポン | 私は日本から来ました。
Je viens de Tokyo. | ジュ・ヴィアン・ドゥ・トキョ | 私は東京から来ました。
:::

**en を使うとき冠詞は消えます**（en France であって × en la France ではない）。第2章で見た「en の後は無冠詞」がここに効いています。

なお **女性国名は原則 -e で終わる**（la France, la Chine, l'Italie, l'Espagne）。男性は子音終わり（le Japon, le Canada, le Portugal, le Brésil）。例外は le Mexique, le Cambodge（-e だが男性）です。
:::

## 7. その他の主要な前置詞

| 前置詞 | 意味 | 例 |
|---|---|---|
| **dans** | 〜の中に | [[dans la boîte\|ダン・ラ・ボワット\|箱の中に]] |
| **sur** | 〜の上に | [[sur la table\|スュル・ラ・ターブル\|机の上に]] |
| **sous** | 〜の下に | [[sous le lit\|スー・ル・リ\|ベッドの下に]] |
| **avec** | 〜と一緒に | [[avec toi\|アヴェック・トワ\|君と]] |
| **sans** | 〜なしに | [[sans sucre\|サン・スュクル\|砂糖なしで]] |
| **pour** | 〜のために | [[pour toi\|プール・トワ\|君のために]] |
| **par** | 〜によって | [[par avion\|パ・ラヴィオン\|飛行機で]] |
| **chez** | 〜の家に | [[chez moi\|シェ・モワ\|私の家で]] |
| **entre** | 〜の間に | [[entre nous\|アントル・ヌー\|私たちの間で]] |
| **devant** | 〜の前に | [[devant la gare\|ドゥヴァン・ラ・ガール\|駅の前で]] |
| **derrière** | 〜の後ろに | [[derrière la porte\|デリエール・ラ・ポルト\|ドアの後ろに]] |
| **pendant** | 〜の間 | [[pendant deux heures\|パンダン・ドゥ・ザール\|2時間の間]] |

:::note chez はフランス語特有の前置詞
英語には対応する1語がありません。**「〜の家・店・国・世界で」**という、人に紐づいた場所を表します。

[[chez le médecin\|シェ・ル・メドサン\|医者のところで]]、[[chez Renault\|シェ・ルノー\|ルノー社で]]、[[chez les Français\|シェ・レ・フランセ\|フランス人の間では]]、[[chez Proust\|シェ・プルースト\|プルーストの作品では]]

**chez の後ろには人（または人の集団・会社名）しか来ません。** 場所そのものには使えません（× chez la gare）。
:::

:::adv sans の後ろでは冠詞が落ちる
[[un café sans sucre\|アン・カフェ・サン・スュクル\|砂糖なしのコーヒー]]（× sans du sucre）

sans は「ゼロである」ことを表すので、量を示す冠詞と両立しません。第5章の「否定の de」と同じ原理です。同様に、sans の後では否定語も ne を必要としません：[[sans rien dire\|サン・リアン・ディール\|何も言わずに]]。
:::

## 8. 縮約の練習

:::ex 縮約を確かめる
Je vais au cinéma. | ジュ・ヴェ・ゾ・スィネマ | 映画館へ行く。（à + le cinéma）
Je parle aux étudiants. | ジュ・パルル・オ・ゼテュディアン | 学生たちに話す。（à + les étudiants）
C'est le livre du professeur. | セ・ル・リーヴル・デュ・プロフェスール | それは先生の本です。（de + le professeur）
la couleur des yeux | ラ・クルール・デ・ズィユ | 目の色（de + les yeux）
Je vais à la piscine. | ジュ・ヴェ・ザ・ラ・ピスィヌ | プールへ行く。（縮約しない）
Il sort de l'hôpital. | イル・ソール・ドゥ・ロピタル | 彼は病院を出る。（縮約しない）
:::

## 練習問題

:::quiz
Q. à + la と à + le は、どちらが縮約しますか。理由も述べてください。
A. à + le だけが縮約して au になる。la は [la] という明瞭な母音を持ち融合しにくく、l' はすでにエリジオンで縮んでいるため、これ以上縮む余地がない。縮約が起きるのは le と les のみ。

Q. Je bois du café. と Je viens du Japon. の du は、それぞれ何ですか。
A. 前者は**部分冠詞**（ある量のコーヒー）。後者は**前置詞 de + 定冠詞 le の縮約**（日本から）。見分け方は「de に意味があるか」。冠詞を un などに置き換えられれば部分冠詞、置き換えられなければ縮約。

Q. une tasse à café と une tasse de café の違いは何ですか。
A. une tasse **à** café は「コーヒー**用の**カップ」（用途）。une tasse **de** café は「カップ一杯**の**コーヒー」（中身・数量）。à は用途、de は中身を表す。

Q. 「私は日本から来ました」「私は東京から来ました」を、それぞれフランス語で言ってください。
A. Je viens **du** Japon.（男性国名 → de + le の縮約）／ Je viens **de** Tokyo.（都市名 → de のみ）。国名は性と数で前置詞が変わるが、都市名は常に à / de。

Q. なぜ en France では冠詞が消えるのですか。
A. 前置詞 en の後ろは原則として無冠詞になるため（第2章）。en は「〜の中に・〜という状態で」という抽象的な位置づけを表し、個別のモノとして数える働きを持たないので、限定詞が要らない。

Q. chez la gare と言えないのはなぜですか。
A. chez は「人に紐づいた場所」を表す前置詞で、後ろには人・人の集団・会社名しか置けないため。場所そのものには à や devant を使う（à la gare / devant la gare）。
:::

  title: '—er 動詞',
  sub: '「歌い」、「踊り」、「愛する」ために',
  body: `
ここからが動詞です。フランス語の動詞は**約12,000語**あるとされますが、そのうち**およそ90%**が -er で終わる第1群（le premier groupe）に属します。しかもこの群は完全に規則的で、新しく作られる動詞（googliser, télécharger など）もすべてここに入ります。

つまり**この章の活用表1つで、フランス語の動詞の9割が読める**ことになります。投資対効果が最も高い課です。

## 1. 3つのグループ

まず全体の見取り図を持っておきます。

| 群 | 不定詞の語尾 | 数 | 規則性 | 代表 |
|---|---|---|---|---|
| **第1群** | -er | 約90%（4,000語以上） | 完全に規則的 | chanter, parler, aimer |
| **第2群** | -ir（-iss- が入る） | 約300語 | 規則的 | finir, choisir |
| **第3群** | それ以外（-ir, -re, -oir） | 約350語 | 不規則 | être, avoir, aller, faire |

第3群は数こそ少ないものの、**最も使用頻度が高い動詞がここに集まっています**（être, avoir, aller, faire, pouvoir, vouloir…）。第2群は第13章、第3群は各章で順次扱います。

:::warn aller は -er で終わるが第1群ではない
[[aller\|アレ\|行く]] は -er で終わりますが、活用はまったく不規則です（je vais, tu vas, il va…）。**唯一の例外**なので、いま覚えてしまってください。第11章で扱います。
:::

## 2. -er 動詞の活用

**語幹（不定詞から -er を取ったもの）に、6つの語尾を付けます。**

| 人称 | 語尾 |
|---|---|
| je | **-e** |
| tu | **-es** |
| il / elle / on | **-e** |
| nous | **-ons** |
| vous | **-ez** |
| ils / elles | **-ent** |

:::conj chanter présent

:::warn 4つの形が同じ音になる
上の表で「同じ音 ♪」を押してください。**je / tu / il / ils の4つに印が付きます。**

chante、chantes、chante、chantent —— 綴りは違いますが、**発音はすべて「シャント」で同一**です。

なぜか。第0章の規則を当てはめてみます。
- **chante** … 語末の e は無音、その手前の t は発音される → シャント
- **chantes** … 語末の s も無音 → シャント
- **chantent** … 3人称複数の -ent は丸ごと無音 → シャント

つまり6つの形のうち、**音として区別されるのは3つだけ**（シャント／シャントン／シャンテ）です。

これはフランス語学習で最も重要な事実の1つです。
- **聞くとき** … 動詞だけでは主語が分からない。だから主語代名詞が必須になる（第3章で説明したとおり）
- **書くとき** … 音が同じでも綴りを正しく選ばなければならない

この2つは、フランス語の書き取り（la dictée）が難しいことの本質的な理由でもあります。
:::

:::ex -er 動詞を使ってみる
Je chante une chanson. | ジュ・シャント・ユヌ・シャンソン | 私は歌を歌う。
Tu danses très bien. | テュ・ダンス・トレ・ビアン | 君はとても上手に踊る。
Elle habite à Paris. | エ・ラビット・ア・パリ | 彼女はパリに住んでいる。
Nous parlons français. | ヌー・パルロン・フランセ | 私たちはフランス語を話す。
Vous travaillez beaucoup. | ヴー・トラヴァイエ・ボクー | あなたはよく働きますね。
Ils aiment le cinéma. | イル・ゼーム・ル・スィネマ | 彼らは映画が好きだ。
:::

:::note 母音で始まる動詞ではリエゾンとエリジオンが起きる
[[aimer\|エメ\|愛する]]、[[habiter\|アビテ\|住む]]、[[écouter\|エクテ\|聞く]] のように母音・無音の h で始まる動詞では、主語との結合が変わります。

| | 子音で始まる（chanter） | 母音で始まる（aimer） |
|---|---|---|
| je | je chante | **j'**aime（エリジオン） |
| nous | nous chantons | nous **z**aimons（リエゾン） |
| vous | vous chantez | vous **z**aimez（リエゾン） |
| ils | ils chantent | ils **z**aiment（リエゾン） |

第3章で述べたとおり、**ils aiment のリエゾンだけが il aime との単複を区別しています**。
:::

## 3. 現在形が表す3つの意味

フランス語の現在形は、英語の現在形と現在進行形の**両方**をカバーします。

:::ex 現在形の3つの用法
Je chante. | ジュ・シャント | 私は歌う。／私は歌っている。
Je travaille tous les jours. | ジュ・トラヴァイユ・トゥ・レ・ジュール | 私は毎日働く。（習慣）
Le train arrive à midi. | ル・トラン・アリーヴ・ア・ミディ | 列車は正午に着く。（確定した未来）
:::

| 用法 | 説明 |
|---|---|
| **現在の動作** | いま行っていること（英語の進行形にあたる） |
| **習慣・反復** | いつもすること |
| **近い未来** | 予定として確定していること |

:::adv 進行形を強調したいとき
フランス語には進行形の活用がありませんが、強調したいときは **être en train de + 不定詞** を使います。

[[Je suis en train de chanter.\|ジュ・スュイ・ザン・トラン・ドゥ・シャンテ\|私はいま歌っているところだ。]]

ただしこれは「まさにその最中」を強調する表現で、日常的には単純な現在形で十分です。英語話者が過剰に使いがちな構文です。
:::

## 4. 綴りが変わる -er 動詞

**活用そのものは規則的ですが、綴りだけが変わる型があります。** これは例外ではなく、**発音を保つための必然的な調整**です。第0章で予告した内容がここで回収されます。

### （1）-cer → nous で ç になる

:::conj commencer présent

c は a, o, u の前では [k] になってしまいます。nous の語尾 -ons を付けると c の後ろが o になるため、[s] の音を保つには **ç** にする必要があります。

### （2）-ger → nous で e を挟む

:::conj manger présent

同じ理屈です。g は a, o の前で [g] になってしまうので、**e を挟んで** [ʒ] の音を保ちます。

:::note この2つは半過去でも効く
第27章で学ぶ半過去は「nous の現在形 − ons」を語幹にするので、この綴りの変化がそのまま持ち込まれます。

- nous mange**ons** → je mange**ais**、しかし nous mang**ions**（i の前では e が不要）
- nous commenç**ons** → je commenç**ais**、しかし nous commenc**ions**

**a と o の前でだけ調整する**という原則を押さえておけば、どの時制でも自分で判断できます。
:::

### （3）-eler / -eter → 子音を重ねる

:::conj appeler présent

語尾が無音になる形（je, tu, il, ils）では、直前の e が [ə] のままだと発音しにくいため、**子音を重ねて** [ɛ] に変えます。appelle は「アペル」、appelons は「アプロン」——音がはっきり違います。

:::warn acheter 型は è を使う
同じ -eter でも、子音を重ねずに **アクサン・グラーヴ**を付ける動詞があります。

:::conj acheter présent

**acheter, geler, peler, modeler, harceler** などがこの型です。appeler / jeter（重ねる）と acheter / geler（è にする）は、どちらも「[ə] を [ɛ] に変える」という同じ目的を、違う綴りで達成しています。個別に覚えるしかありません。

なお2016年の綴り字改革では、appeler 系も è で書くことが許容されましたが、伝統的な綴りが依然として主流です。
:::

### （4）e + 子音 + er → è

:::conj lever présent

[[lever\|ルヴェ\|上げる]]、[[mener\|ムネ\|導く]]、[[peser\|プゼ\|重さを量る]] など。acheter と同じ原理です。

### （5）é + 子音 + er → è

:::conj préférer présent

[[préférer\|プレフェレ]]、[[espérer\|エスペレ\|期待する]]、[[répéter\|レペテ\|繰り返す]] など。

:::warn préférer は未来形では変わらない
伝統的な綴りでは、**é 型の動詞は未来・条件法で é のまま**です。

- je préf**è**re（現在）
- je préf**é**rerai（単純未来）

一方、acheter 型と appeler 型は未来形でも変化します（j'ach**è**terai、j'appe**ll**erai）。この差は「未来語尾 -rai の前の e が発音されるかどうか」に由来しますが、実用上は**é 型だけ未来で戻る**と覚えるのが早道です。
:::

### （6）-ayer / -oyer / -uyer → y が i になる

:::conj payer présent

[[payer\|ペイエ\|払う]]、[[essayer\|エセイエ\|試す]]、[[nettoyer\|ネトワイエ\|掃除する]] など。

-ayer だけは **y のままでもよい**（je paye / je paie の両方が正しい）とされますが、-oyer / -uyer は必ず i になります。

:::adv envoyer は未来語幹だけが不規則
[[envoyer\|アンヴォワイエ\|送る]] は現在形は規則どおり（j'envoie）ですが、**未来語幹だけが enverr-** という不規則な形になります。

:::conj envoyer futur

第1群でこのような不規則を持つのは envoyer / renvoyer だけです。aller とあわせて、-er 動詞の例外は3語だけと覚えられます。
:::

## 5. 否定・疑問との組み合わせ

第5章の否定を、-er 動詞に当てはめます。

:::ex 否定形
Je ne chante pas. | ジュ・ヌ・シャント・パ | 私は歌わない。
Tu n'aimes pas le café ? | テュ・ネーム・パ・ル・カフェ | 君はコーヒーが好きじゃないの？
Nous ne travaillons jamais le dimanche. | ヌー・ヌ・トラヴァイヨン・ジャメ・ル・ディマンシュ | 私たちは日曜には決して働かない。
:::

疑問形は第9章で扱いますが、**イントネーションを上げるだけ**でも疑問になります。

:::ex 最も簡単な疑問形
Tu chantes ? | テュ・シャント | 君、歌うの？
Vous parlez français ? | ヴー・パルレ・フランセ | フランス語を話しますか？
:::

## 6. 動詞 + 不定詞 — à と de の使い分け

:::deep 2つ目の動詞をつなぐとき、何を挟むか
「〜したい」「〜し始める」のように動詞を2つ重ねるとき、**間に何も入れない／à を入れる／de を入れる** の3通りがあり、**最初の動詞ごとに決まっています**。辞書に載っている情報で、規則からは導けません。

**（a）直接つなぐ（前置詞なし）**

主に「願望・可能・移動・知覚」の動詞です。
[[aimer\|エメ]]、[[vouloir\|ヴロワール]]、[[pouvoir\|プヴォワール]]、[[devoir\|ドゥヴォワール]]、[[savoir\|サヴォワール]]、[[aller\|アレ]]、[[venir\|ヴニール]]、[[espérer\|エスペレ]]、[[préférer\|プレフェレ]]、[[penser\|パンセ]]

[[J'aime chanter.\|ジェーム・シャンテ\|私は歌うのが好きだ。]]
[[Je veux partir.\|ジュ・ヴ・パルティール\|私は出発したい。]]

**（b）à + 不定詞**

「開始・継続・傾向・学習」——**これから向かう方向**を表す動詞が多くなります。
[[commencer à\|コマンセ・ア\|〜し始める]]、[[apprendre à\|アプランドル・ア\|〜することを学ぶ]]、[[réussir à\|レユスィール・ア\|〜に成功する]]、[[arriver à\|アリヴェ・ア\|〜できる]]、[[hésiter à\|エズィテ・ア\|〜をためらう]]、[[continuer à\|コンティニュエ・ア\|〜し続ける]]、[[aider à\|エデ・ア\|〜を手伝う]]

[[Je commence à comprendre.\|ジュ・コマンス・ア・コンプランドル\|分かり始めた。]]

**（c）de + 不定詞**

「終了・停止・依頼・感情」——**すでに起きたこと、あるいは切り離すこと**を表す動詞が多くなります。
[[finir de\|フィニール・ドゥ\|〜し終える]]、[[arrêter de\|アレテ・ドゥ\|〜をやめる]]、[[essayer de\|エセイエ・ドゥ\|〜を試みる]]、[[décider de\|デスィデ・ドゥ\|〜を決める]]、[[oublier de\|ウブリエ・ドゥ\|〜を忘れる]]、[[demander de\|ドゥマンデ・ドゥ\|〜を頼む]]、[[refuser de\|ルフュゼ・ドゥ\|〜を断る]]

[[J'ai oublié de téléphoner.\|ジェ・ウブリエ・ドゥ・テレフォネ\|電話するのを忘れた。]]

**à は「向かう」、de は「離れる」** という前置詞本来の空間的な意味が、抽象化されて残っている——という説明ができます。ただし例外も多いので、最終的には**動詞ごとに辞書で確認**してください。

**（d）意味が変わるもの**

同じ動詞でも前置詞で意味が変わる場合があります。
- [[commencer à parler\|コマンセ・ア・パルレ\|話し始める]]（開始）
- [[commencer par parler\|コマンセ・パール・パルレ\|まず話すことから始める]]（順序）
:::

## 練習問題

:::quiz
Q. je chante, tu chantes, il chante, ils chantent は、なぜ4つとも同じ発音になるのですか。
A. 語末の e は無音、語末の s も無音、3人称複数の -ent は丸ごと無音だから。結果として6つの形のうち音で区別されるのは3つ（シャント／シャントン／シャンテ）だけになる。この事実が、フランス語で主語代名詞を省略できない理由でもある。

Q. nous mangeons の e は何のためにありますか。
A. g は a, o の前では [g] と発音されてしまうため。語尾 -ons を付けると g の後ろが o になるので、[ʒ] の音を保つために e を挟む。同じ理由で commencer は nous commençons と ç になる。これは例外ではなく発音規則を守るための調整。

Q. appeler と acheter は、どちらも「[ə] を [ɛ] に変える」目的を持っています。手段はどう違いますか。
A. appeler は子音を重ねる（j'appelle）。acheter はアクサン・グラーヴを付ける（j'achète）。目的は同じだが綴りの手段が違うので、動詞ごとに覚える必要がある。

Q. j'achèterai と je préférerai で、é / è の扱いが違うのはなぜですか。
A. 伝統的な綴りでは、é + 子音 + er 型（préférer）は未来・条件法では é のまま戻る。一方 acheter 型・appeler 型は未来形でも変化を保つ（j'achèterai, j'appellerai）。実用上は「é 型だけ未来で戻る」と覚える。

Q. J'aime chanter. と Je commence à chanter. で、前置詞の有無が違うのはなぜですか。
A. 2つ目の動詞を不定詞でつなぐとき、何を挟むかは**最初の動詞ごとに決まっている**規則からは導けない語法。aimer は直接つなぐ型、commencer は à を取る型。傾向としては à が「開始・傾向」、de が「終了・停止・依頼」だが、最終的には辞書で確認する。

Q. aller は -er で終わるのに第1群ではありません。第1群の例外は他に何がありますか。
A. envoyer と renvoyer。現在形は規則どおりだが、未来語幹だけが enverr- / renverr- という不規則な形になる。aller と合わせて、-er 動詞の例外は実質3語だけ。
:::

フランス語には**「はい／いいえ」で答える疑問文（疑問詞のない疑問文）の作り方が3通り**あります。意味はどれも同じですが、**改まり度が違います**。同じ内容を、友人に言うか、店員に言うか、レポートに書くかで使い分けます。

英語のように do を持ち出す必要はありません。語順を変えるか、決まった句を頭に付けるか、何もしないか——この3択です。

## 1. 3つの作り方

平叙文 [[Tu aimes le café.\|テュ・エーム・ル・カフェ\|君はコーヒーが好きだ。]] を疑問文にしてみます。

| 方法 | 形 | 改まり度 |
|---|---|---|
| **① イントネーション** | Tu aimes le café **?** | くだけた（話し言葉） |
| **② est-ce que** | **Est-ce que** tu aimes le café ? | 中立（話し言葉・書き言葉） |
| **③ 倒置** | **Aimes-tu** le café ? | 改まった（書き言葉） |

:::ex 3通りを聞き比べる
Tu aimes le café ? | テュ・エーム・ル・カフェ | コーヒー好き？
Est-ce que tu aimes le café ? | エス・ク・テュ・エーム・ル・カフェ | コーヒーはお好きですか？
Aimes-tu le café ? | エム・テュ・ル・カフェ | コーヒーはお好きですか？
:::

### ① イントネーション — 語順はそのまま

**文末を上げるだけ**です。語順も語形も一切変えません。書くときは末尾に ? を付けます。

:::note 話し言葉ではこれが圧倒的に多い
日常会話で最も使われるのはこの形です。倒置は改まりすぎ、est-ce que はやや長いためです。

ただし**書き言葉ではくだけすぎ**とみなされるので、レポートやビジネスメールでは使いません。
:::

### ② est-ce que — 文頭に付けるだけ

**平叙文の前に est-ce que を置く**だけです。語順は変わりません。最も汎用的で、迷ったらこれを使えば失敗しません。

:::warn 母音の前では est-ce qu' になる
[[Est-ce qu'il aime le café ?\|エス・キ・レーム・ル・カフェ\|彼はコーヒーが好きですか？]]（que → qu'）
:::

:::deep est-ce que の正体
est-ce que は、もともと **c'est que**（それは〜ということだ）を倒置した **est-ce que**（〜ということですか）です。つまり③の倒置が化石化して、決まり文句になったものです。

だから直訳すると「〜であるのは事実ですか？」となります。現代では意味が薄れ、**単なる疑問の目印**として機能しています。第12章の疑問詞（qu'est-ce que, qui est-ce qui …）も、この est-ce que を組み込んだ形です。
:::

### ③ 倒置 — 主語と動詞を入れ替える

**動詞と主語代名詞をハイフンでつなぎます。**

:::ex 倒置
Aimes-tu le café ? | エム・テュ・ル・カフェ | コーヒーはお好きですか？
Parlez-vous français ? | パルレ・ヴー・フランセ | フランス語を話しますか？
Êtes-vous japonais ? | エット・ヴー・ジャポネ | あなたは日本人ですか？
Sommes-nous en retard ? | ソム・ヌー・ザン・ルタール | 私たちは遅れていますか？
:::

:::warn 倒置には3つの注意点

**（a）ハイフンは必須**
Aimes tu ? ではなく **Aimes-tu ?** と書きます。

**（b）母音がぶつかると t を挟む**

3人称単数（il / elle / on）で、動詞が母音で終わるとき、**発音しやすくするために -t- を入れます**。

- [[Aime-t-il le café ?\|エム・ティ・ル・カフェ\|彼はコーヒーが好きですか？]]（× Aime-il）
- [[Parle-t-elle français ?\|パルル・テル・フランセ\|彼女はフランス語を話しますか？]]
- [[Y a-t-il un problème ?\|ヤ・ティ・ラン・プロブレーム\|問題がありますか？]]

この t は**何の意味も持ちません**。母音の衝突を避けるためだけの挿入で、エリジオン・リエゾン・bel/vieil と同じ原理です。

すでに t や d で終わっている動詞には入れません：[[Est-il là ?\|エ・ティル・ラ\|彼はいますか？]]（est の t がリエゾンする）、[[Prend-il le train ?\|プラン・ティル・ル・トラン\|彼は電車に乗りますか？]]（d が [t] で読まれる）。

**（c）je の倒置は原則避ける**

× Aime-je ? とは言いません。je の倒置は音が悪いため、**est-ce que を使います**：[[Est-ce que j'aime … ?\|エス・ク・ジェーム]]

例外的に、いくつかの動詞では古い形が慣用として残っています。
[[Puis-je entrer ?\|ピュイ・ジュ・アントレ\|入ってもよろしいですか？]]（pouvoir の特別な形 puis）、[[Suis-je … ?\|スュイ・ジュ]]、[[Ai-je … ?\|エ・ジュ]]、[[Dois-je … ?\|ドワ・ジュ]]
:::

:::deep 主語が名詞のときの倒置（複合倒置）
主語が代名詞ではなく**名詞**の場合、名詞をそのまま動詞の後ろに回すことはできません。**名詞を前に置いたまま、それを受ける代名詞を動詞の後ろに付けます。**

× Aime Marie le café ?
○ [[Marie aime-t-elle le café ?\|マリ・エム・テル・ル・カフェ\|マリはコーヒーが好きですか？]]

これを**複合倒置（l'inversion complexe）**と呼びます。書き言葉で用いられる形式です。

ただし疑問詞のある疑問文では、**単純倒置**（名詞をそのまま後ろに置く）も可能です。
[[Où habite Marie ?\|ウー・アビット・マリ\|マリはどこに住んでいますか？]]

この使い分けは第12章で扱います。
:::

## 2. 答え方 — oui / si / non

:::warn 否定疑問文には si で答える
フランス語には「はい」が**2つ**あります。

| | 使う場面 |
|---|---|
| **oui** | 肯定疑問文に「はい」 |
| **si** | **否定疑問文**を否定して「いいえ、そうです」 |
| **non** | 「いいえ」 |

:::ex oui / si / non
Tu aimes le café ? — Oui. | テュ・エーム・ル・カフェ・ウィ | コーヒー好き？ — うん。
Tu n'aimes pas le café ? — Si, j'aime ça ! | テュ・ネーム・パ・ル・カフェ・スィ・ジェーム・サ | コーヒー嫌いなの？ — いや、好きだよ！
Tu n'aimes pas le café ? — Non, je déteste. | テュ・ネーム・パ・ル・カフェ・ノン・ジュ・デテスト | コーヒー嫌いなの？ — うん、嫌い。
:::

**日本語と逆になる点に注意してください。** 「コーヒー嫌いなの？」に対し、日本語では「うん（＝嫌い）」ですが、フランス語では否定を肯定するので **non** です。逆に「いや、好きだよ」は **si** になります。

英語には si に対応する語がありません（Yes, I do. で兼用）。ドイツ語の doch が同じ働きをします。
:::

## 3. 否定疑問文

否定文をそのまま疑問文にできます。3つの方法すべてが使えます。

:::ex 否定疑問文
Tu ne viens pas ? | テュ・ヌ・ヴィアン・パ | 来ないの？
Est-ce que tu ne viens pas ? | エス・ク・テュ・ヌ・ヴィアン・パ | 来ないのですか？
Ne viens-tu pas ? | ヌ・ヴィアン・テュ・パ | 来ないのですか？
:::

倒置の場合、**ne は動詞の前、pas は主語代名詞の後ろ**に来ます。ne … pas が挟むのは「活用した動詞 + 倒置された主語」のかたまりになるためです。

[[N'aimez-vous pas le café ?\|ネメ・ヴー・パ・ル・カフェ\|コーヒーはお好きではないのですか？]]

:::adv 否定疑問文は反語や勧誘にもなる
形式的には質問ですが、実際には別の意図で使われることがあります。

- **確認・同意を求める**：[[N'est-ce pas ?\|ネ・ス・パ\|そうですよね？]]（英語の isn't it? / right? にあたる万能の付加疑問）
- **勧誘・提案**：[[Tu ne veux pas venir ?\|テュ・ヌ・ヴ・パ・ヴニール\|来ない？（来ませんか）]]
- **驚き・非難**：[[Tu n'as pas honte ?\|テュ・ナ・パ・オント\|恥ずかしくないの？]]

n'est-ce pas は、主語や時制に関係なく**常にこの形**です。英語の付加疑問（isn't it / doesn't he / haven't you…）のように変化しないので、はるかに簡単です。
:::

## 4. 3つの形をどう使い分けるか

:::note 実務的な指針
- **友人・家族との会話** → イントネーション（Tu viens ?）
- **初対面・店・職場での会話** → est-ce que（Est-ce que vous avez … ?）
- **レポート・論文・文学作品・改まった文書** → 倒置（Peut-on dire que … ?）

**迷ったら est-ce que。** どの場面でも失礼にならず、語順を変えないので間違えにくい形です。

なお倒置は、書き言葉では**むしろ標準**です。フランスの新聞・小説・学術論文では倒置が普通に使われます。「倒置＝古い」ではなく「倒置＝書き言葉」と理解してください。
:::

:::adv 話し言葉の第4の形
実際の会話では、疑問詞を文末に置く形も多用されます（第12章）。

[[Tu vas où ?\|テュ・ヴァ・ウー\|どこ行くの？]]（← Où vas-tu ?）
[[C'est combien ?\|セ・コンビアン\|いくら？]]

語順を変えずに疑問詞だけ置き換えるので、話し言葉として最も楽な形です。書き言葉では使いません。
:::

:::

## 練習問題

:::quiz
Q. Tu aimes le café. を3通りの疑問文にしてください。
A. ① Tu aimes le café ?（イントネーション、くだけた）② Est-ce que tu aimes le café ?（中立）③ Aimes-tu le café ?（倒置、改まった）。意味はどれも同じで、違うのは改まり度。

Q. Aime-t-il le café ? の -t- は何ですか。
A. 意味を持たない挿入。倒置で3人称単数（il/elle/on）が来るとき、動詞が母音で終わっていると母音が衝突するため、発音しやすくするために入れる。エリジオン・リエゾン・bel/vieil と同じ「母音の衝突を避ける」原理。すでに t や d で終わる動詞には入れない（Est-il ? / Prend-il ?）。

Q. 「コーヒーは好きじゃないの？」と聞かれて「いや、好きだよ」と答えるとき、oui と si のどちらを使いますか。
A. **si**。否定疑問文を否定して肯定する場合は oui ではなく si を使う。日本語とは逆で、「うん（＝嫌い）」にあたるのは non。英語にはこの区別がなく、ドイツ語の doch が対応する。

Q. Marie aime le café. を倒置の疑問文にしてください。
A. **Marie aime-t-elle le café ?** 主語が名詞のときは、名詞を前に置いたまま、それを受ける代名詞を動詞の後ろに付ける（複合倒置）。× Aime Marie le café ? とは言えない。

Q. なぜ Aime-je ? とは言わないのですか。
A. je の倒置は音が悪いため避けられ、代わりに est-ce que を使う。例外的に Puis-je / Suis-je / Ai-je / Dois-je といった慣用形だけが残っている（pouvoir の puis はこの用法専用の特別な形）。

Q. n'est-ce pas は、主語や時制に応じて形が変わりますか。
A. 変わらない。常にこの形のまま使える。英語の付加疑問（isn't it / doesn't he / haven't you…）が主語と助動詞に応じて変化するのに対し、フランス語ははるかに単純。
:::

  body: `
第2章で「名詞は限定詞なしでは文に置けない」と述べました。冠詞はその限定詞の1種ですが、他にも3つの系列があります。

- **指示形容詞**（この、その、あの）
- **所有形容詞**（私の、君の、彼の）
- **疑問形容詞**（どの、なんという）

いずれも**冠詞の代わりに置かれます**。冠詞と併用することはできません（× le mon livre）。そして**修飾する名詞の性・数に一致して形を変えます**。

## 1. 指示形容詞 — ce / cet / cette / ces

| | 形 |
|---|---|
| 男性単数 | **ce** |
| 男性単数（母音・無音の h の前） | **cet** |
| 女性単数 | **cette** |
| 複数（男女共通） | **ces** |

:::ex 指示形容詞
ce livre | ス・リーヴル | この本
cet homme | セ・トム | この男性（母音の前）
cet hôtel | セ・トテル | このホテル（無音の h）
cette table | セット・ターブル | この机
ces livres | セ・リーヴル | これらの本
ces tables | セ・ターブル | これらの机
:::

:::warn cet と cette は同音
**cet**（男性・母音の前）と **cette**（女性）は、どちらも「セット」で**発音が完全に同じ**です。

- cet homme（男性名詞 homme）
- cette femme（女性名詞 femme）

聞き分けはできません。**書くときに名詞の性で選ぶ**必要があります。cet が存在するのも、beau → bel、vieux → vieil と同じく、**母音の衝突を避けるため**です（ce homme では言いにくい）。
:::

:::note 「この」と「あの」を区別しない
フランス語の ce は、**近い・遠いを区別しません**。英語の this と that、日本語の「この・その・あの」にあたる区別がないのです。

区別が必要なときは、名詞の後ろに **-ci**（近い）／**-là**（遠い）を付けます。

:::ex -ci と -là
ce livre-ci | ス・リーヴル・スィ | この本（こちらの）
ce livre-là | ス・リーヴル・ラ | あの本（あちらの）
:::

第0章で見た voi**ci** / voi**là** と同じ ci / là です。実際の会話では、指差しやジェスチャーで足りるため -ci / -là はあまり使われず、**2つを対比するとき**に主に用いられます。
:::

## 2. 所有形容詞 — 「誰の」ではなく「何を」に一致する

**ここがフランス語で最も混乱を招く箇所の1つです。**

| 所有者 | 男性単数 | 女性単数 | 複数 |
|---|---|---|---|
| **je**（私の） | mon | ma | mes |
| **tu**（君の） | ton | ta | tes |
| **il / elle**（彼の・彼女の） | son | sa | ses |
| **nous**（私たちの） | notre | notre | nos |
| **vous**（あなたの） | votre | votre | vos |
| **ils / elles**（彼らの） | leur | leur | leurs |

:::ex 所有形容詞
mon livre | モン・リーヴル | 私の本
ma table | マ・ターブル | 私の机
mes amis | メ・ザミ | 私の友人たち
notre maison | ノートル・メゾン | 私たちの家
vos enfants | ヴォ・ザンファン | あなたの子どもたち
leur voiture | ルール・ヴォワテュール | 彼らの車
:::

:::warn son / sa は「彼の」か「彼女の」か決まらない
**son livre は「彼の本」とも「彼女の本」とも訳せます。**

なぜなら、son / sa / ses が一致するのは**所有される名詞の性・数**であって、**所有者の性別ではない**からです。

| フランス語 | 意味 |
|---|---|
| **son** livre | 彼の本／彼女の本（livre が男性名詞） |
| **sa** voiture | 彼の車／彼女の車（voiture が女性名詞） |

英語では his book / her book と所有者で区別しますが、**フランス語にはこの区別がありません**。所有者を明示したいときは、強勢形（第19章）を使って [[le livre à lui\|ル・リーヴル・ア・リュイ\|彼の本]] や [[son livre à elle\|ソン・リーヴル・ア・エル\|彼女の本]] のように言い添えます。

英語話者・日本語話者ともに最も間違える箇所です。**「誰のものか」ではなく「何を持っているか」を見る** ——これを繰り返し確認してください。
:::

:::warn 女性名詞でも母音の前では mon / ton / son
女性名詞であっても、**母音・無音の h で始まる場合は男性形を使います**。

- × ma amie → ○ **mon** amie（私の女友だち）
- × sa école → ○ **son** école（彼の／彼女の学校）
- × ta histoire → ○ **ton** histoire（君の話）

ma amie では母音がぶつかって言いにくいためです。cet と同じ理由、同じ解決策です。

**この場合、名詞は依然として女性名詞のまま**なので、形容詞は女性形で一致します。
[[mon amie japonaise\|モ・ナミ・ジャポネーズ\|私の日本人の女友だち]]（japonaise は女性形）
:::

:::deep notre / votre と leur だけ、単複の形が違う理由
表をよく見ると、1・2・3人称単数（mon, ton, son）は男性形と女性形が分かれているのに、複数所有者（notre, votre, leur）は分かれていません。

これはラテン語からの継承の結果です。
- meus / mea / meum（私の）… ラテン語では性で変化した → mon / ma
- noster / nostra（私たちの）… こちらも変化したが、フランス語では -e が無音化して同形になった → notre

つまり**書き分ける必要がなくなった**のであって、規則が違うわけではありません。

なお複数形では nos / vos / leurs と s が付くので、**単数と複数は区別されます**。notre livre（私たちの本1冊）と nos livres（私たちの本、複数）です。
:::

:::adv 身体部位には所有形容詞を使わない
第2章で触れた点です。所有者が文脈から明らかなとき、フランス語は**定冠詞**を使います。

- ○ [[Il a mal à la tête.\|イラ・マ・ラ・ラ・テット\|彼は頭が痛い。]]
- × Il a mal à sa tête.

- ○ [[Elle lève la main.\|エル・レーヴ・ラ・マン\|彼女は手を挙げる。]]
- × Elle lève sa main.

所有者を明示する必要があるときは、間接目的語（第18章）や代名動詞（第23章）で表します。
[[Je me lave les mains.\|ジュ・ム・ラーヴ・レ・マン\|私は手を洗う。]]（me が「自分の」を担う）

ただし、身体部位に形容詞が付いて個別化されると所有形容詞が復活します。
[[Ses longs cheveux noirs\|セ・ロン・シュヴー・ノワール\|彼女の長い黒髪]]
:::

## 3. 疑問形容詞 — quel / quelle / quels / quelles

「どの〜」「なんという〜」を表します。**4つの形はすべて同音**（「ケル」）です。

| | 単数 | 複数 |
|---|---|---|
| 男性 | quel | quels |
| 女性 | quelle | quelles |

:::ex 疑問形容詞
Quel livre ? | ケル・リーヴル | どの本？
Quelle heure est-il ? | ケ・ルー・レ・ティル | 何時ですか？
Quels sont vos projets ? | ケル・ソン・ヴォ・プロジェ | あなたの計画は何ですか？
Quelles langues parlez-vous ? | ケル・ラング・パルレ・ヴー | どの言語を話しますか？
:::

:::note quel は名詞から離れることもある
quel は形容詞なので名詞を修飾しますが、**être を挟んで属詞になる**用法があります。

- [[Quel est votre nom ?\|ケ・レ・ヴォートル・ノン\|お名前は何ですか？]]
- [[Quelle est la capitale du Japon ?\|ケ・レ・ラ・カピタル・デュ・ジャポン\|日本の首都はどこですか？]]

この場合も、**後ろの名詞に性数一致します**（nom は男性→ quel、capitale は女性→ quelle）。

英語の what is your name? に相当しますが、フランス語では**qu'est-ce que votre nom ? とは言えません**。人・モノの属性を尋ねるときは quel を使います。この区別は第12章で扱います。
:::

:::adv 感嘆文の quel
quel は感嘆にも使われます。この場合、**冠詞を付けません**。

:::ex 感嘆の quel
Quel beau temps ! | ケル・ボー・タン | なんていい天気だ！
Quelle surprise ! | ケル・スュルプリーズ | なんという驚き！
Quels beaux yeux ! | ケル・ボー・ズィユ | なんて美しい目だろう！
:::

英語の What a beautiful day! では a が入りますが、**フランス語では冠詞不要**です（× Quel un beau temps !）。
:::

## 4. 限定詞は重ねられない

:::warn 限定詞は名詞ひとつにつき1個だけ
冠詞・指示形容詞・所有形容詞・疑問形容詞は、**すべて限定詞という同じ枠を争います**。だから重ねられません。

- × le mon livre
- × ce mon livre
- × un ce livre

英語の a friend of mine のような表現は、フランス語では **de + 強勢形** を使います。
[[un ami à moi\|アン・ナミ・ア・モワ\|私の友人の一人]]、[[un de mes amis\|アン・ドゥ・メ・ザミ\|私の友人の一人]]

なお **tout** だけは限定詞の前に置けます（tout は限定詞ではなく数量詞のため）。
[[tous mes amis\|トゥ・メ・ザミ\|私の友人全員]]、[[toute la journée\|トゥット・ラ・ジュルネ\|一日中]]
:::

## 5. 3系列を並べて確認する

同じ名詞に、4種類の限定詞を付け替えてみます。

| 限定詞 | 男性名詞 livre | 女性名詞 table |
|---|---|---|
| 定冠詞 | le livre | la table |
| 不定冠詞 | un livre | une table |
| 指示 | ce livre | cette table |
| 所有（私の） | mon livre | ma table |
| 疑問 | quel livre | quelle table |

:::ex 限定詞を入れ替える
J'aime ce livre. | ジェーム・ス・リーヴル | 私はこの本が好きだ。
J'aime mon livre. | ジェーム・モン・リーヴル | 私は自分の本が好きだ。
Quel livre aimes-tu ? | ケル・リーヴル・エム・テュ | 君はどの本が好き？
:::

## 練習問題

:::quiz
Q. son livre は「彼の本」ですか、「彼女の本」ですか。
A. どちらとも決まらない。son / sa / ses は**所有される名詞の性・数**に一致するのであって、所有者の性別とは無関係。livre が男性名詞だから son になっているだけ。所有者を明示したいときは son livre à elle のように強勢形を添える。

Q. 「私の女友だち」は ma amie ですか、mon amie ですか。
A. **mon amie**。女性名詞でも母音・無音の h で始まる場合は男性形（mon/ton/son）を使う。母音の衝突を避けるためで、cet homme や bel homme と同じ原理。ただし名詞は女性のままなので、形容詞は女性形で一致する（mon amie japonaise）。

Q. cet と cette は、どうやって聞き分けますか。
A. 聞き分けられない。どちらも「セット」で完全に同音。書くときに名詞の性で選ぶしかない（cet homme / cette femme）。

Q. Il a mal à sa tête. はなぜ不自然ですか。
A. 所有者が主語から明らかな身体部位には、フランス語は所有形容詞ではなく**定冠詞**を使うため。正しくは Il a mal à **la** tête. 所有者を明示する必要があるときは間接目的語や代名動詞で表す（Je me lave les mains.）。

Q. 「なんていい天気だ！」を Quel un beau temps ! と書くのはなぜ誤りですか。
A. 感嘆の quel の後ろには冠詞を付けないため。正しくは Quel beau temps ! 英語の What **a** beautiful day! とは違う点。

Q. 「私の友人の一人」を un mon ami と言えないのはなぜですか。
A. 冠詞と所有形容詞はどちらも限定詞であり、名詞ひとつにつき1個しか置けないため。正しくは un ami à moi または un de mes amis。なお tout は限定詞ではないので前に置ける（tous mes amis）。
:::

:::ai-gen 指示形容詞、所有形容詞、疑問形容詞 quel

  title: 'aller / venir',
  sub: '近い未来・近い過去',
  body: `
[[aller\|アレ\|行く]] と [[venir\|ヴニール\|来る]] は、移動を表す基本動詞です。しかしフランス語でこの2語が重要なのは、移動の意味以上に、**時制を作る道具として使われる**からです。

- **aller + 不定詞** → 近接未来（これから〜する）
- **venir de + 不定詞** → 近接過去（〜したばかりだ）

活用を1つ覚えるだけで、まだ習っていない未来と過去を表現できるようになります。実際の会話では、単純未来（第24章）より近接未来のほうが頻繁に使われます。

## 1. aller の活用

:::conj aller présent

:::warn aller は -er で終わるが第1群ではない
第8章で予告したとおりです。**フランス語で最も不規則な動詞の1つ**で、活用形が3つの異なる語幹から来ています。

- **v-** 系：vais, vas, va, vont（ラテン語 vadere「進む」から）
- **all-** 系：allons, allez（ラテン語 ambulare「歩く」から）
- **ir-** 系：単純未来 j'irai（ラテン語 ire「行く」から）

つまり aller は、**3つの別々のラテン語動詞が1つに合流した**動詞です。英語の go / went（go と wend の合流）と同じ現象で、補充法（le supplétisme）と呼ばれます。最頻出の動詞ほどこうなりやすい、という言語の一般的な傾向です。
:::

:::ex aller の基本用法
Je vais à Paris. | ジュ・ヴェ・ザ・パリ | 私はパリへ行く。
Tu vas au cinéma ? | テュ・ヴァ・オ・スィネマ | 映画館に行くの？
Nous allons à l'école. | ヌー・ザロン・ザ・レコール | 私たちは学校へ行く。
Comment allez-vous ? | コマン・タレ・ヴー | ごきげんいかがですか？
Ça va ? — Ça va bien. | サ・ヴァ・サ・ヴァ・ビアン | 元気？ — 元気だよ。
:::

:::note aller は「体調」も表す
[[Comment ça va ?\|コマン・サ・ヴァ\|調子はどう？]] や [[Ça va.\|サ・ヴァ\|大丈夫。]] の va は aller です。「（物事が）進む」→「うまくいっている」という比喩から来ています。

フランス語で最も使われる挨拶なので、活用そのものより先に慣れてしまう表現です。
:::

## 2. venir の活用

:::conj venir présent

:::note venir 型は語幹が2つに割れる
venir の現在形をよく見ると、**単数と3人称複数が vien-、nous と vous が ven-** に分かれています。

- vien**s**, vien**s**, vien**t**, ven**ons**, ven**ez**, vienn**ent**

これは第3群の動詞に非常に多いパターンです。**強勢が置かれる音節（単数・3複）で母音が変化する**ためで、prendre（prends / prenons / prennent）、boire（bois / buvons / boivent）、devoir（dois / devons / doivent）も同じ構造です。

第13章の全体図で見るとおり、**半過去は nous の形（ven-）から、接続法は ils の形（vienn-）から**作られるので、この2つの語幹を押さえておくと後が楽になります。

同型の動詞：tenir, devenir, revenir, obtenir, appartenir。
:::

:::ex venir の基本用法
Je viens de Tokyo. | ジュ・ヴィアン・ドゥ・トキョ | 私は東京の出身です。
Tu viens avec moi ? | テュ・ヴィアン・ザヴェック・モワ | 一緒に来る？
Ils viennent demain. | イル・ヴィエンヌ・ドゥマン | 彼らは明日来る。
:::

## 3. 近接未来 — aller + 不定詞

**aller の活用形 + 不定詞**で、「これから〜する」を表します。英語の be going to と発想がまったく同じです。

:::ex 近接未来
Je vais partir. | ジュ・ヴェ・パルティール | 私は出発するところだ。
Il va pleuvoir. | イル・ヴァ・プルヴォワール | 雨が降りそうだ。
Nous allons manger. | ヌー・ザロン・マンジェ | 私たちは食べるところだ。
Tu vas comprendre. | テュ・ヴァ・コンプランドル | すぐ分かるよ。
:::

:::warn 否定の位置に注意
第5章の原則どおり、**ne … pas が挟むのは活用した動詞**です。ここで活用しているのは aller なので、不定詞は pas の後ろに来ます。

[[Je ne vais pas partir.\|ジュ・ヌ・ヴェ・パ・パルティール\|私は出発しない（つもりだ）。]]

× Je vais ne pas partir. とはなりません（ただし「出発しないことにする」と不定詞そのものを否定する場合は別）。
:::

:::deep 近接未来と単純未来の使い分け
第24章で単純未来（je partirai）を学びますが、**両者は交換可能ではありません**。

| | 近接未来（je vais partir） | 単純未来（je partirai） |
|---|---|---|
| 時間的な近さ | 近い | 遠くてもよい |
| 話し手の関与 | 現在とつながっている、確実性が高い | 現在から切り離されている |
| 文体 | 話し言葉で圧倒的に多い | 書き言葉・改まった場面 |

[[Je vais me marier.\|ジュ・ヴェ・ム・マリエ\|私は結婚します。]]（決まっている、近い）
[[Je me marierai un jour.\|ジュ・ム・マリユレ・アン・ジュール\|いつか結婚するだろう。]]（漠然としている）

**日常会話では近接未来が未来表現の大半を占めます。** 単純未来は「予測・約束・宣言」といった、やや改まった場面に寄ります。

なお時間の近さは絶対的な条件ではありません。[[Je vais avoir 30 ans l'année prochaine.\|ジュ・ヴェ・ザヴォワール・トラン・タン\|来年30歳になります。]] のように、1年先でも「確実に来る」ことなら近接未来が使えます。**重要なのは「現在との地続き感」です。**
:::

## 4. 近接過去 — venir de + 不定詞

**venir の活用形 + de + 不定詞**で、「〜したばかりだ」を表します。

:::ex 近接過去
Je viens d'arriver. | ジュ・ヴィアン・ダリヴェ | 私は着いたばかりだ。
Il vient de partir. | イル・ヴィアン・ドゥ・パルティール | 彼は出発したところだ。
Nous venons de manger. | ヌー・ヴノン・ドゥ・マンジェ | 私たちは食べたばかりだ。
Elle vient de téléphoner. | エル・ヴィアン・ドゥ・テレフォネ | 彼女は電話してきたばかりだ。
:::

:::warn de を落とさない
近接未来には前置詞が要りませんが、**近接過去には de が必須**です。

- Je **vais** partir.（de なし）
- Je **viens de** partir.（de あり）

de を落とすと「私は出発しに来る」という別の意味の文になってしまいます。実際、venir + 不定詞（de なし）は「〜しに来る」という目的の表現です。

[[Je viens te voir.\|ジュ・ヴィアン・ト・ヴォワール\|君に会いに来た。]]（目的）
[[Je viens de te voir.\|ジュ・ヴィアン・ドゥ・ト・ヴォワール\|君に会ったばかりだ。]]（近接過去）

**de があるかないかで意味が反転します。**
:::

:::deep 近接過去は「過去形」ではない
文字どおりには「〜から来る」と言っているだけで、**動詞は現在形**です。「たった今〜し終えたところから来ている」という比喩が、そのまま時制表現になったものです。

このため、近接過去は**現在との関わりを強く含意します**。「たった今」という情報が本質なので、遠い過去には使えません。

- ○ [[Il vient de sortir.\|イル・ヴィアン・ドゥ・ソルティール\|彼はたった今出て行った。]]
- × Il vient de sortir hier.（昨日、と矛盾する）

遠い過去は複合過去（第20章）で表します：[[Il est sorti hier.\|イ・レ・ソルティ・イエール\|彼は昨日出かけた。]]

なお venir を半過去にすると、**過去のある時点から見た直前**を表せます（第27章）。
[[Il venait de sortir quand je suis arrivé.\|イル・ヴネ・ドゥ・ソルティール・カン・ジュ・スュイ・ザリヴェ\|私が着いたとき、彼は出て行ったばかりだった。]]
:::

## 5. 3つの時間軸を1文で

近接過去・現在・近接未来を並べると、**現在を中心とした時間の広がり**が見えます。

:::ex 時間軸を並べる
Je viens de manger. | ジュ・ヴィアン・ドゥ・マンジェ | 食べたところだ。（直前の過去）
Je mange. | ジュ・マンジュ | 食べている。（現在）
Je vais manger. | ジュ・ヴェ・マンジェ | 食べるところだ。（直後の未来）
:::

**動詞の活用を新しく覚えることなく、3つの時制を表現できています。** これが aller / venir が入門段階で重要な理由です。

## 6. aller / venir のその他の用法

:::adv 覚えておきたい慣用表現

**aller**
- [[aller bien à\|アレ・ビアン・ア\|（服が）似合う]]：[[Cette robe te va bien.\|セット・ローブ・ト・ヴァ・ビアン\|そのドレス、似合っているよ。]]
- [[Allons-y !\|アロン・ズィ\|さあ行こう！]]、[[Allez !\|アレ\|さあ！／がんばれ！]]
- [[Ça va aller.\|サ・ヴァ・アレ\|なんとかなるよ。]]

**venir**
- [[venir de\|ヴニール・ドゥ\|〜の出身である]]：[[Je viens du Japon.\|ジュ・ヴィアン・デュ・ジャポン\|私は日本出身です。]]
- [[en venir à\|アン・ヴニール・ア\|〜するに至る]]
- [[Viens !\|ヴィアン\|おいで！]]（命令形、第16章）

**Je viens du Japon.** は「日本から来た（＝出身）」と「日本から来たところだ」の両方に解釈できますが、後者なら普通は Je viens d'arriver du Japon. と言います。
:::

## 7. 活用ドリル

:::drill aller,venir,être,avoir présent

## 練習問題

:::quiz
Q. Je vais partir. と Je viens de partir. の違いは何ですか。
A. 前者は近接未来「これから出発する」、後者は近接過去「出発したばかりだ」。aller + 不定詞（前置詞なし）と venir **de** + 不定詞。de の有無が時間の向きを決める。

Q. Je viens te voir. と Je viens de te voir. は、どう違いますか。
A. 前者は「君に会いに来た」（venir + 不定詞＝目的）。後者は「君に会ったばかりだ」（venir de + 不定詞＝近接過去）。de があるかないかで意味が反転する。

Q. aller の活用が vais / allons / irai と3つの語幹に分かれているのはなぜですか。
A. 3つの別々のラテン語動詞（vadere, ambulare, ire）が1つの動詞に合流したため。補充法（supplétisme）と呼ばれる現象で、英語の go / went と同じ。最頻出の動詞ほど起きやすい。

Q. Je ne vais pas partir. で、なぜ partir が pas の後ろにあるのですか。
A. ne … pas が挟むのは**活用した動詞**であり、ここで活用しているのは aller だから。partir は不定詞なので挟む対象にならない。第5章の原則がそのまま適用されている。

Q. Il vient de sortir hier. はなぜ不自然ですか。
A. 近接過去は「たった今〜し終えた」という現在との強い結びつきを含意するため、hier（昨日）と両立しない。遠い過去は複合過去で表す（Il est sorti hier.）。

Q. 日常会話で未来を言うとき、近接未来と単純未来のどちらが多く使われますか。
A. 近接未来（aller + 不定詞）が圧倒的に多い。単純未来は「予測・約束・宣言」といったやや改まった場面や書き言葉に寄る。決め手は時間の近さそのものより「現在との地続き感」で、1年先のことでも確実なら近接未来を使う。
:::

第9章では「はい／いいえ」で答える疑問文を扱いました。この章では**具体的な情報を尋ねる疑問文**を扱います。

疑問副詞（いつ・どこで・どのように・なぜ）は素直ですが、**疑問代名詞（誰・何）は体系が複雑**です。「人か物か」「主語か目的語か」「前置詞が付くか」の3つの軸で形が変わり、しかも短形と長形の2系列があります。大学の文法ではこの体系を整理して理解する必要があります。

## 1. 疑問副詞

| 疑問副詞 | 意味 |
|---|---|
| **où** | どこ |
| **quand** | いつ |
| **comment** | どのように |
| **pourquoi** | なぜ |
| **combien** | いくら、どれくらい |

:::ex 疑問副詞
Où habitez-vous ? | ウー・アビテ・ヴー | どこにお住まいですか？
Quand partez-vous ? | カン・パルテ・ヴー | いつ出発しますか？
Comment ça va ? | コマン・サ・ヴァ | 調子はどうですか？
Pourquoi pleures-tu ? | プルコワ・プルール・テュ | なぜ泣いているの？
Combien ça coûte ? | コンビアン・サ・クート | いくらですか？
:::

### 3つの語順が使える

疑問副詞のある疑問文も、第9章と同じく3通りの作り方があります。

:::ex Où habitez-vous ? を3通りで
Tu habites où ? | テュ・アビット・ウー | どこに住んでるの？（話し言葉・疑問詞を文末に）
Où est-ce que tu habites ? | ウー・エス・ク・テュ・アビット | どこに住んでいますか？（中立）
Où habites-tu ? | ウー・アビット・テュ | どこにお住まいですか？（改まった）
:::

:::note 話し言葉では疑問詞が文末に来る
第9章で触れた「第4の形」です。**語順をまったく変えずに、疑問詞だけを本来の位置に置く**ので、話し言葉では最も楽な形になります。

[[Tu vas où ?\|テュ・ヴァ・ウー\|どこ行くの？]]、[[Tu pars quand ?\|テュ・パール・カン\|いつ出発するの？]]、[[C'est combien ?\|セ・コンビアン\|いくら？]]

ただし**書き言葉では使いません**。また pourquoi だけは文末に置きにくく、通常は文頭に来ます。
:::

:::deep 疑問副詞のときは単純倒置ができる
第9章で「主語が名詞のときは複合倒置（Marie aime-t-elle …）」と述べましたが、**疑問副詞がある場合は、名詞主語をそのまま動詞の後ろに置けます**（単純倒置）。

- [[Où habite Marie ?\|ウー・アビット・マリ\|マリはどこに住んでいますか？]]（単純倒置）
- [[Où Marie habite-t-elle ?\|ウー・マリ・アビット・テル\|同上]]（複合倒置も可）

条件は「動詞の後ろに目的語がないこと」です。目的語があると単純倒置はできません。

- × Où lit Marie ce livre ?
- ○ [[Où Marie lit-elle ce livre ?\|ウー・マリ・リ・テル・ス・リーヴル\|マリはどこでこの本を読むのですか？]]

**pourquoi だけは単純倒置ができません**。× Pourquoi pleure Marie ? とは言えず、必ず Pourquoi Marie pleure-t-elle ? となります。
:::

:::adv combien の2つの形
combien は、後ろに名詞を取るかどうかで形が変わります。

- [[Combien coûte ce livre ?\|コンビアン・クート・ス・リーヴル\|この本はいくらですか？]]（単独）
- [[Combien de livres avez-vous ?\|コンビアン・ドゥ・リーヴル・ザヴェ・ヴー\|本を何冊持っていますか？]]（combien **de** + 無冠詞名詞）

第2章の数量表現と同じく、**combien de の後ろは無冠詞**になります。
:::

## 2. 疑問代名詞 — 体系を整理する

**ここがこの章の本題です。** 「誰」「何」を尋ねる代名詞は、次の3つの軸で形が決まります。

1. **人か、物か**
2. **主語か、目的語か**
3. **短形か、長形（est-ce que 型）か**

### 全体の表

| | **主語**（誰が／何が） | **目的語**（誰を／何を） | **前置詞の後** |
|---|---|---|---|
| **人** | qui / qui est-ce qui | qui / qui est-ce que | à qui, de qui… |
| **物** | （短形なし）/ qu'est-ce qui | que / qu'est-ce que | à quoi, de quoi… |

:::warn 物が主語のときは長形しかない
表の左下が空白になっている点に注目してください。**「何が〜する」を短形で言う方法はありません。**

- ○ [[Qu'est-ce qui se passe ?\|ケ・ス・キ・ス・パス\|何が起きているのですか？]]
- × Que se passe ?

これは覚えるしかない欠落です。**物が主語のときは必ず qu'est-ce qui** を使ってください。
:::

### 長形の作り方には規則がある

一見バラバラに見える qui est-ce qui / qu'est-ce que は、**2つの部品の組み合わせ**です。

| 部品 | 位置 | 意味 |
|---|---|---|
| **前半** | qui = 人 / que = 物 | 何を尋ねているか |
| **後半** | qui = 主語 / que = 目的語 | 文中でどの役割か |

つまり **「前半で人か物か、後半で主語か目的語か」** を表しています。

| 形 | 前半 | 後半 | 意味 |
|---|---|---|---|
| **qui est-ce qui** | 人 | 主語 | 誰が |
| **qui est-ce que** | 人 | 目的語 | 誰を |
| **qu'est-ce qui** | 物 | 主語 | 何が |
| **qu'est-ce que** | 物 | 目的語 | 何を |

この規則を知っていれば、4つを丸暗記する必要はありません。**前半＝尋ねる対象、後半＝文法上の役割**、と2回に分けて考えればよいのです。

:::ex 4つの長形
Qui est-ce qui vient ? | キ・エス・キ・ヴィアン | 誰が来るの？
Qui est-ce que tu aimes ? | キ・エス・ク・テュ・エーム | 誰を愛しているの？
Qu'est-ce qui se passe ? | ケ・ス・キ・ス・パス | 何が起きているの？
Qu'est-ce que tu fais ? | ケ・ス・ク・テュ・フェ | 何をしているの？
:::

### 短形

短形は簡潔ですが、倒置を伴います。

:::ex 短形
Qui vient ? | キ・ヴィアン | 誰が来るの？（人・主語）
Qui aimes-tu ? | キ・エム・テュ | 誰を愛しているの？（人・目的語＋倒置）
Que fais-tu ? | ク・フェ・テュ | 何をしているの？（物・目的語＋倒置）
:::

:::note 実際の会話では qu'est-ce que が主役
**Qu'est-ce que tu fais ?** は、フランス語で最も頻繁に耳にする疑問文の1つです。短形の Que fais-tu ? は改まった響きになります。

さらにくだけると疑問詞が文末に来ます：[[Tu fais quoi ?\|テュ・フェ・コワ\|何してるの？]]

このとき que ではなく **quoi** を使う点に注意してください。que は動詞の前に置く形で、単独では立てません。
:::

## 3. que と quoi の使い分け

:::deep 同じ「何」なのに形が2つある理由
**que** と **quoi** は、もともと同じ語の**強勢のない形／ある形**です（第19章の人称代名詞 me / moi と同じ関係）。

| | 使う位置 |
|---|---|
| **que** | 動詞の直前（弱い位置） |
| **quoi** | 前置詞の後、文末、単独（強い位置） |

:::ex que と quoi
Que fais-tu ? | ク・フェ・テュ | 何をしているの？（動詞の前 → que）
Tu fais quoi ? | テュ・フェ・コワ | 何してるの？（文末 → quoi）
À quoi penses-tu ? | ア・コワ・パンス・テュ | 何を考えているの？（前置詞の後 → quoi）
Quoi ? | コワ | 何？（単独 → quoi）
De quoi parlez-vous ? | ドゥ・コワ・パルレ・ヴー | 何について話しているのですか？
:::

**前置詞の後ろには必ず quoi** です（× à que）。同じ理由で、人の場合は前置詞の後ろでも qui のままです（qui には弱形・強形の区別がないため）。
[[À qui parles-tu ?\|ア・キ・パルル・テュ\|誰に話しているの？]]、[[Avec qui ?\|アヴェック・キ\|誰と？]]
:::

## 4. quel との違い

第10章で疑問形容詞 quel を学びました。**quel と qu'est-ce que は混同しやすい**ので、区別しておきます。

| | 使う場面 |
|---|---|
| **quel** | 選択肢の中から**どれか**を尋ねる／人・物の**属性**を尋ねる |
| **qu'est-ce que** | 定義・内容を尋ねる |

:::ex quel と qu'est-ce que
Quel est votre nom ? | ケ・レ・ヴォートル・ノン | お名前は何ですか？
Qu'est-ce que c'est ? | ケ・ス・ク・セ | これは何ですか？
Quel livre lis-tu ? | ケル・リーヴル・リ・テュ | どの本を読んでいるの？
Qu'est-ce que tu lis ? | ケ・ス・ク・テュ・リ | 何を読んでいるの？
:::

:::warn 名前・職業・国籍には quel を使う
**Qu'est-ce que votre nom ?** とは言えません。名前・住所・職業・年齢といった「その人の属性」を尋ねるときは quel です。

- ○ Quel est votre nom ?（お名前は？）
- ○ Quelle est votre profession ?（ご職業は？）
- ○ Quelle est votre adresse ?（ご住所は？）

一方、**Qu'est-ce que c'est ?** は目の前の物の正体を尋ねる形で、これは quel では言えません。

判断の目安：**答えが「名詞そのもの」なら quel、答えが「説明・定義」なら qu'est-ce que**。
:::

:::adv Qu'est-ce que c'est que … ? という形
定義を強く求めるとき、**Qu'est-ce que c'est que + 名詞** という形が使われます。

[[Qu'est-ce que c'est que ça ?\|ケ・ス・ク・セ・ク・サ\|それは一体何なんだ？]]
[[Qu'est-ce que c'est que l'amour ?\|ケ・ス・ク・セ・ク・ラムール\|愛とは何か？]]

que が3回出てくる不格好な形ですが、哲学的な問いや驚きの表現として実際に使われます。
:::

## 5. 感嘆の que

:::adv que は感嘆詞にもなる
疑問ではなく感嘆を表す用法があります。

[[Que c'est beau !\|ク・セ・ボー\|なんて美しいんだ！]]
[[Qu'il fait chaud !\|キル・フェ・ショー\|なんて暑いんだ！]]

同じ意味を、より口語的な **comme** でも表せます。
[[Comme c'est beau !\|コム・セ・ボー\|なんて美しいんだ！]]

第10章の **quel + 名詞**（Quel beau temps !）と合わせて、感嘆には3つの形があることになります。
- **quel** + 名詞：Quel beau temps !
- **que** + 文：Que le temps est beau !
- **comme** + 文：Comme le temps est beau !
:::

## 6. まとめの表

:::note 疑問代名詞・最終整理
**人を尋ねる**
- 誰が → **qui** / qui est-ce qui
- 誰を → **qui** + 倒置 / qui est-ce que
- 前置詞つき → à **qui**, avec **qui**, de **qui**

**物を尋ねる**
- 何が → **qu'est-ce qui**（短形なし）
- 何を → **que** + 倒置 / **qu'est-ce que** / 文末なら **quoi**
- 前置詞つき → à **quoi**, avec **quoi**, de **quoi**

**選択・属性を尋ねる**
- どの〜 / 〜は何か → **quel**（名詞に性数一致する）
:::

## 練習問題

:::quiz
Q. qu'est-ce qui と qu'est-ce que は、どこが違いますか。また、どう覚えればよいですか。
A. 後半の qui / que が文中の役割を表す。qui なら**主語**（何が）、que なら**目的語**（何を）。前半の qu' は「物」を表す。つまり「前半＝人か物か、後半＝主語か目的語か」の2部品構成として理解すれば、4つを丸暗記しなくてよい。

Q. 「何が起きているの？」を短形で言えますか。
A. 言えない。**物が主語のときは短形が存在しない**（× Que se passe ?）。必ず長形 Qu'est-ce qui se passe ? を使う。疑問代名詞の体系にある唯一の欠落。

Q. À que penses-tu ? はなぜ誤りですか。
A. 前置詞の後ろでは que ではなく **quoi** を使うため。正しくは À **quoi** penses-tu ? que は動詞の直前に置く弱形で、単独や前置詞の後には立てない（me / moi の関係と同じ）。

Q. 「お名前は何ですか？」を Qu'est-ce que votre nom ? と言えないのはなぜですか。
A. 名前・職業・住所・年齢といった「人・物の属性」を尋ねるときは疑問形容詞 quel を使うため。正しくは **Quel est votre nom ?** 目安として、答えが名詞そのものなら quel、答えが説明・定義なら qu'est-ce que。

Q. Pourquoi pleure Marie ? はなぜ誤りですか。
A. pourquoi だけは単純倒置（名詞主語をそのまま動詞の後ろに置く）ができないため。正しくは **Pourquoi Marie pleure-t-elle ?**（複合倒置）。他の疑問副詞（où, quand, comment）では単純倒置が可能。

Q. 話し言葉で「何してるの？」を最もくだけた形で言うとどうなりますか。
A. **Tu fais quoi ?** 語順を変えず疑問詞を文末に置く形。このとき que ではなく quoi を使う。中立なら Qu'est-ce que tu fais ?、改まった書き言葉なら Que fais-tu ?
:::

{lead}フランス語の動詞活用は、暗記すべき量が膨大に見えます。動詞1語につき時制が12、それぞれ6人称——単純に掛け算すれば72の形です。これを不規則動詞の数だけ覚えるとなると、絶望的に思えます。

**しかし実際に覚えるべきものは、動詞1つにつき4つだけです。** 残りはすべて機械的に導けます。

この章は、その「4つ」と「導き方」を1枚の図にまとめます。**この教材で最も重要な課**です。ここを理解すると、以後の第20章（複合過去）、第24章（単純未来）、第27章（半過去）、第30章（条件法）、第31章（接続法）が、それぞれ独立した暗記項目ではなく、**同じ図の別の枝**として見えるようになります。

## 1. 覚えるべき4つ

どんな動詞でも、次の4つさえ分かれば全時制を作れます。

| # | 覚えるもの | ここから作られるもの |
|---|---|---|
| **①** | 直説法現在の6形 | 半過去・接続法現在・命令法 |
| **②** | 未来語幹 | 単純未来・条件法現在 |
| **③** | 過去分詞（＋助動詞が avoir か être か） | 複合過去・大過去・前未来・条件法過去・接続法過去 |
| **④** | 単純過去の語幹と型 | 単純過去（書き言葉専用） |

**③だけで複合時制5つがまかなえます。** 複合時制は「助動詞の時制 ＋ 過去分詞」なので、過去分詞は常に同じ。変わるのは助動詞の時制だけです。つまり avoir と être の活用さえ知っていれば、新しく覚えることは何もありません。

## 3. 導出の規則を1つずつ確認する

### ① 直説法現在から3つ

**半過去 = nous の現在形 − ons + 半過去の語尾**

| 動詞 | nous の現在形 | 半過去語幹 | 半過去（je） |
|---|---|---|---|
| chanter | nous chant**ons** | chant- | je chantais |
| finir | nous finiss**ons** | finiss- | je finissais |
| prendre | nous pren**ons** | pren- | je prenais |
| boire | nous buv**ons** | buv- | je buvais |
| faire | nous fais**ons** | fais- | je faisais |

**この規則には例外が1つしかありません。** être だけが nous sommes から導けず、特別に **ét-** を使います（j'étais）。**フランス語の全動詞で、半過去の例外は être ただ1つ**です。

**接続法現在 = ils の現在形 − ent + 接続法の語尾**

| 動詞 | ils の現在形 | 接続法語幹 | 接続法（je） |
|---|---|---|---|
| chanter | ils chant**ent** | chant- | que je chante |
| finir | ils finiss**ent** | finiss- | que je finisse |
| prendre | ils prenn**ent** | prenn- | que je prenne |
| boire | ils boiv**ent** | boiv- | que je boive |

ただし**nous と vous だけは半過去語幹を使います**（que nous prenions、que nous buvions）。第31章で扱います。

**命令法 = 現在形の tu / nous / vous から主語を取る**

第1群と ouvrir 型だけ、tu の -s を落とします（chante, chantons, chantez）。第16章で扱います。

### ② 未来語幹から2つ

**単純未来 = 未来語幹 + ai, as, a, ons, ez, ont**
**条件法現在 = 未来語幹 + ais, ais, ait, ions, iez, aient**

:::warn 条件法現在は「未来語幹 ＋ 半過去の語尾」
条件法の語尾は、半過去の語尾と**完全に同一**です。つまり条件法現在について新しく覚えることは何もありません。

- 半過去：chant- + ais → chantais
- 条件法：chanter- + ais → chanterais

**規則動詞では未来語幹が不定詞そのもの**なので、単純未来と条件法現在は「不定詞 + 語尾」で作れます。

これが第30章（条件法）を軽くする理由です。第24章で単純未来を学び終えた時点で、条件法現在は実質的に習得済みになります。
:::

:::deep 未来語幹はどこから来たのか
なぜ「不定詞 + avoir の現在形」のような形になっているのか——実際にそのとおりだからです。

俗ラテン語では、未来を **不定詞 + habere（持つ）** で表していました。
- cantare **habeo**（歌うことを持っている）→ je chanter**ai**
- cantare **habes** → tu chanter**as**
- cantare **habet** → il chanter**a**
- cantare **habemus** → nous chanter**ons**
- cantare **habetis** → vous chanter**ez**
- cantare **habent** → ils chanter**ont**

語尾を見比べてください。**単純未来の語尾は avoir の現在形そのもの**です（ai, as, a, [av]ons, [av]ez, ont）。

同じように、条件法は **不定詞 + habere の未完了過去**（＝半過去）から来ています。だから条件法の語尾が半過去と同じなのです。

つまり単純未来も条件法も、もとは**複合時制**でした。それが1語に融合した結果、いまの形になっています。この由来を知っていると、語尾を覚え直す必要がなくなります。
:::

### ③ 過去分詞から5つ

複合時制は、**助動詞（avoir または être）を該当する時制に活用させ、過去分詞を添える**だけです。

| 時制 | 助動詞の時制 | 例（chanter） |
|---|---|---|
| 複合過去 | 現在 | j'ai chanté |
| 大過去 | 半過去 | j'avais chanté |
| 前未来 | 単純未来 | j'aurai chanté |
| 条件法過去 | 条件法現在 | j'aurais chanté |
| 接続法過去 | 接続法現在 | que j'aie chanté |

**過去分詞 chanté は5つすべてで同じ**です。変わるのは助動詞の時制だけ。

:::conj chanter passeCompose,plusQueParfait,futurAnterieur

:::note 複合時制は「時制の入れ子」
複合時制の意味は、**助動詞の時制が示す時点から見て、すでに完了している**ということです。

- j'**ai** chanté … 現在から見て完了 → 複合過去
- j'**avais** chanté … 過去から見て完了 → 大過去
- j'**aurai** chanté … 未来から見て完了 → 前未来

英語の have / had / will have sung とまったく同じ構造です。だから第20章で複合過去の作り方を理解すれば、第27.5章の大過去も第24章の前未来も、追加で覚えることはありません。
:::

### ④ 単純過去

物語や歴史記述でしか使われない、書き言葉専用の時制です。語尾は3つの型に分かれます。

| 型 | 語尾 | 例 |
|---|---|---|
| **-a 型**（第1群） | -ai, -as, -a, -âmes, -âtes, -èrent | je chantai |
| **-i 型**（第2群・多くの第3群） | -is, -is, -it, -îmes, -îtes, -irent | je finis |
| **-u 型**（一部の第3群） | -us, -us, -ut, -ûmes, -ûtes, -urent | je fus, j'eus |

第20.5章で扱います。**読めれば十分**で、自分で書けるようになる必要はありません。

## 4. finir — 第2群の代表

全体図を確認したところで、第2群（le deuxième groupe）の動詞を導入します。

:::conj finir présent

:::warn 第2群の目印は -iss-
第2群は -ir で終わりますが、**複数形（nous, vous, ils）に -iss- が挿入されます**。これが第2群の唯一かつ決定的な目印です。

- fin**is** / fin**is** / fin**it** … 単数（-iss- なし）
- fin**iss**ons / fin**iss**ez / fin**iss**ent … 複数（-iss- あり）

同じ -ir でも、partir（pars, partons）や venir（viens, venons）には -iss- が入りません。これらは**第3群**です。

**辞書を引かずに見分ける方法はありません。** ただし第2群は約300語と限られており、しかも多くが**形容詞から作られた「〜になる」型の動詞**なので、意味から推測できることがあります。
:::

:::deep 第2群は形容詞から動詞を作る仕組み
第2群の動詞には、形容詞に -ir を付けて作られたものが多数あります。

| 形容詞 | 第2群動詞 | 意味 |
|---|---|---|
| [[grand\|グラン\|大きい]] | [[grandir\|グランディール]] | 大きくなる |
| [[rouge\|ルージュ\|赤い]] | [[rougir\|ルージール]] | 赤くなる、赤面する |
| [[gros\|グロ\|太い]] | [[grossir\|グロスィール]] | 太る |
| [[maigre\|メーグル\|やせた]] | [[maigrir\|メグリール]] | やせる |
| [[vieux\|ヴィユー\|年老いた]] | [[vieillir\|ヴィエイール]] | 年をとる |
| [[jeune\|ジュヌ\|若い]] | [[rajeunir\|ラジュニール]] | 若返る |
| [[blanc\|ブラン\|白い]] | [[blanchir\|ブランシール]] | 白くなる |

**「その形容詞の状態になる」**という規則的な意味を持ちます。したがって、形容詞を知っていれば第2群動詞を推測でき、逆も成り立ちます。

なお第2群は**新しい動詞をほとんど生みません**（新語はすべて第1群 -er に入ります）。閉じた集合として扱ってよい群です。
:::

:::ex finir を使ってみる
Je finis mon travail. | ジュ・フィニ・モン・トラヴァイユ | 私は仕事を終える。
Le film finit à dix heures. | ル・フィルム・フィニ・ア・ディ・ザール | 映画は10時に終わる。
Nous finissons bientôt. | ヌー・フィニソン・ビアント | 私たちはもうすぐ終わる。
Ils choisissent un cadeau. | イル・シュワズィス・アン・カド | 彼らは贈り物を選ぶ。
Elle réussit toujours. | エル・レユスィ・トゥジュール | 彼女はいつも成功する。
:::

:::note finir も4つを押さえれば全時制が作れる
第2群の finir で、①〜④を確認してみます。

| # | finir の場合 |
|---|---|
| ① 現在形 | finis, finis, finit, finissons, finissez, finissent |
| ② 未来語幹 | **finir-**（不定詞そのもの） |
| ③ 過去分詞 | **fini**（助動詞は avoir） |
| ④ 単純過去 | fin- + -i 型 |

ここから導かれるもの：
- 半過去 → nous finiss**ons** − ons = **finiss-** → je finissais
- 接続法 → ils finiss**ent** − ent = **finiss-** → que je finisse
- 単純未来 → finir + ai = **je finirai**
- 条件法 → finir + ais = **je finirais**
- 複合過去 → avoir + fini = **j'ai fini**

**新しい情報は4つだけで、12時制すべてが出てきました。**
:::

## 6. 不規則動詞も同じ構造で捉える

不規則動詞は「バラバラで覚えられない」と思われがちですが、**①〜④の枠に入れてしまえば同じ**です。

:::vmap prendre

:::ex 不規則動詞も4つで整理できる
prendre | プランドル | 取る、乗る
:::

| # | prendre の場合 |
|---|---|
| ① 現在形 | prends, prends, prend, prenons, prenez, **prennent** |
| ② 未来語幹 | **prendr-** |
| ③ 過去分詞 | **pris**（助動詞は avoir） |
| ④ 単純過去 | pr- + -i 型 |

ここから：
- 半過去 → nous pren**ons** → **pren-** → je prenais
- 接続法 → ils prenn**ent** → **prenn-** → que je prenne（半過去語幹とは別！）
- 単純未来 → **je prendrai**
- 複合過去 → **j'ai pris**

**prendre は半過去語幹（pren-）と接続法語幹（prenn-）が違う**という点だけが特徴で、それ以外は chanter とまったく同じ手順です。

:::note 語幹が2つに割れる動詞
prendre のように、**単数・3人称複数で語幹が変わる**動詞は第3群に多くあります。

| 動詞 | 弱い語幹（nous, vous） | 強い語幹（je, tu, il, ils） |
|---|---|---|
| prendre | pren- | prend- / prenn- |
| boire | buv- | boi- / boiv- |
| venir | ven- | vien- / vienn- |
| devoir | dev- | doi- / doiv- |
| recevoir | recev- | reçoi- / reçoiv- |

**強勢が置かれる音節（単数・3複）で母音が変化する**という、規則的な現象です。だから「半過去は弱い語幹から、接続法は強い語幹から」と整理できます。

この動詞群は、覚える語幹が2つになるだけで、導出の手順は変わりません。
:::

## 7. どこから覚えるか — 優先順位

:::deep 学習の順序
すべての動詞を平等に覚える必要はありません。頻度には極端な偏りがあります。

**最優先（この2つがないと何も言えない）**
être、avoir —— 助動詞としても使うため、全時制を最初に固める

**次点（日常会話の骨格）**
aller、faire、venir、pouvoir、vouloir、devoir、savoir、dire、voir、prendre

この10語で、フランス語の会話に現れる動詞のかなりの部分が説明できます。

**その後**
第1群（-er）は規則的なので、活用表を1つ覚えれば4,000語に適用できます。個別に覚える必要はありません。

**時制の優先順位**
1. 直説法現在（すべての出発点）
2. 複合過去（最も使う過去形）
3. 半過去（現在形さえあれば作れる）
4. 単純未来 → 条件法現在（語尾を変えるだけ）
5. 接続法現在（用法のほうが難しい）
6. 単純過去・大過去・前未来・条件法過去・接続法過去（読解用）
:::

## 練習問題

:::quiz
Q. 動詞1語につき、最低限いくつ覚えれば全時制を作れますか。それは何ですか。
A. 4つ。①直説法現在の6形、②未来語幹、③過去分詞（＋助動詞が avoir か être か）、④単純過去の語幹と型。残りはすべてここから機械的に導ける。

Q. 半過去の語幹はどう作りますか。例外はいくつありますか。
A. **nous の現在形から -ons を取る**。例外はフランス語全体で **être ただ1つ**（nous sommes からは導けず、ét- を使う）。

Q. 条件法現在について、新しく覚えるべきことはありますか。
A. 何もない。**未来語幹 ＋ 半過去の語尾**でできている。単純未来を学んだ時点で、条件法現在は実質的に習得済みになる。

Q. なぜ単純未来の語尾は avoir の現在形にそっくりなのですか。
A. 実際にそこから来ているため。俗ラテン語では未来を「不定詞 + habere（持つ）」で表しており（cantare habeo → je chanterai）、それが1語に融合した。同じ理由で条件法の語尾は半過去（habere の未完了過去）と一致する。

Q. 複合過去・大過去・前未来・条件法過去・接続法過去で、変わるものと変わらないものは何ですか。
A. 変わるのは**助動詞の時制**だけ。過去分詞は5つすべてで同じ。だから複合過去の作り方を理解すれば、残り4つは追加の暗記なしで作れる。

Q. finir と partir は、どちらも -ir で終わります。どう見分けますか。
A. 複数形に **-iss-** が入るかどうか。finir は nous fin**iss**ons（第2群）、partir は nous partons（第3群）。綴りからは見分けられないので辞書で確認するが、第2群は形容詞から作られた「〜になる」型の動詞が多い（grand → grandir）ため意味から推測できることがある。

Q. prendre の半過去語幹と接続法語幹は同じですか。
A. 違う。半過去は nous prenons から **pren-**、接続法は ils prennent から **prenn-**。prendre は単数・3人称複数で語幹が変わる型（boire, venir, devoir, recevoir も同型）なので、2つの語幹を持つ。導出の手順自体は規則動詞と変わらない。
:::

## 1. 比較級 — 3つの度合い

**plus / aussi / moins + 形容詞 + que** で作ります。

| | 形 | 意味 |
|---|---|---|
| **優等比較** | plus … que | 〜より…だ |
| **同等比較** | aussi … que | 〜と同じくらい…だ |
| **劣等比較** | moins … que | 〜より…でない |

:::ex 比較級の3段階
Marie est plus belle que Vénus. | マリ・エ・プリュ・ベル・ク・ヴェニュス | マリはヴィーナスより美しい。
Marie est aussi belle que Vénus. | マリ・エ・トスィ・ベル・ク・ヴェニュス | マリはヴィーナスと同じくらい美しい。
Marie est moins belle que Vénus. | マリ・エ・モワン・ベル・ク・ヴェニュス | マリはヴィーナスほど美しくない。
:::

:::note 形容詞は変化しない、ただし一致はする
plus / moins を付けても、**形容詞そのものの形は変わりません**（英語の big → bigger のような変化がない）。

ただし**主語との性数一致は通常どおり行われます**。
- [[Il est plus grand.\|イ・レ・プリュ・グラン\|彼のほうが背が高い。]]
- [[Elle est plus grande.\|エ・レ・プリュ・グランド\|彼女のほうが背が高い。]]
- [[Ils sont plus grands.\|イル・ソン・プリュ・グラン\|彼らのほうが背が高い。]]
:::

:::warn plus の s は発音するのか
文脈で変わります。学習者が最も混乱する発音の1つです。

| 場面 | 発音 |
|---|---|
| 比較級（形容詞・副詞の前） | 「プリュ」（s を読まない） |
| 母音の前でリエゾン | 「プリュ**ズ**」 |
| 文末・単独・数量の plus | 「プリュ**ス**」 |
| 否定の ne … plus | 「プリュ」（s を読まない） |

- [[plus grand\|プリュ・グラン\|より大きい]]（子音の前 → 読まない）
- [[plus intelligent\|プリュ・ザンテリジャン\|より賢い]]（母音の前 → リエゾンで [z]）
- [[Moi, j'en veux plus.\|モワ・ジャン・ヴ・プリュス\|私はもっと欲しい。]]（文末 → [s]）
- [[Je n'en veux plus.\|ジュ・ナン・ヴ・プリュ\|私はもう要らない。]]（否定 → 読まない）

**最後の2つは意味が正反対なのに、s の有無だけで区別されます。** 話し言葉では ne が落ちるため（第5章）、「もっと欲しい」と「もう要らない」が s の発音だけで分かれることになります。
:::

## 2. 副詞・名詞・動詞の比較

比較の対象は形容詞だけではありません。

### 副詞の比較 — 形容詞と同じ

:::ex 副詞の比較
Il court plus vite que moi. | イル・クール・プリュ・ヴィット・ク・モワ | 彼は私より速く走る。
Elle parle moins fort que lui. | エル・パルル・モワン・フォール・ク・リュイ | 彼女は彼より小さな声で話す。
:::

### 名詞の比較 — de が入る

**数量を比べるので、第2章の数量表現と同じく de が必要**です。

:::ex 名詞の比較（de が入る）
J'ai plus de livres que toi. | ジェ・プリュス・ドゥ・リーヴル・ク・トワ | 私は君より本をたくさん持っている。
Il a autant d'amis que moi. | イラ・オタン・ダミ・ク・モワ | 彼は私と同じくらい友人がいる。
Elle a moins de temps que nous. | エラ・モワン・ドゥ・タン・ク・ヌー | 彼女は私たちより時間が少ない。
:::

:::warn 同等比較は名詞のときだけ autant
形容詞・副詞では **aussi**、名詞・動詞では **autant** を使います。

| 比べる対象 | 同等比較 |
|---|---|
| 形容詞 | **aussi** grand que |
| 副詞 | **aussi** vite que |
| 名詞 | **autant de** livres que |
| 動詞 | **autant** que |

[[Il travaille autant que moi.\|イル・トラヴァイユ・オタン・ク・モワ\|彼は私と同じくらい働く。]]（動詞の比較）

aussi と autant を取り違えるのは頻出の誤りです。**「数えるものには autant」**と覚えてください。
:::

## 3. 不規則な比較級 — bon と bien

:::warn bon / bien の比較級は絶対に押さえる
**bon（良い）と bien（よく）は、優等比較だけが不規則**です。しかも混同されやすいので、ここは丁寧に区別してください。

| 原級 | 品詞 | 優等比較 | 意味 |
|---|---|---|---|
| **bon** | 形容詞 | **meilleur** | より良い |
| **bien** | 副詞 | **mieux** | より良く |

:::ex meilleur と mieux
Ce vin est meilleur que l'autre. | ス・ヴァン・エ・メイユール・ク・ロートル | このワインのほうがおいしい。（形容詞）
Elle chante mieux que moi. | エル・シャント・ミュー・ク・モワ | 彼女は私より上手に歌う。（副詞）
:::

**見分け方**は品詞の判定と同じです。
- **名詞を修飾する／être の後に来る** → 形容詞 → **meilleur**
- **動詞を修飾する** → 副詞 → **mieux**

meilleur は形容詞なので**性数一致します**（meilleure, meilleurs, meilleures）。mieux は副詞なので変化しません。

なお **plus bon とは言えません**（× plus bon）。一方 **plus mauvais は言えます**（pire という不規則形もありますが、plus mauvais のほうが日常的です）。

同等比較・劣等比較は規則どおりです：aussi bon que、moins bon que、aussi bien que、moins bien que。
:::

:::deep mal と petit の比較級
不規則な比較級は他にもありますが、使用場面が限られます。

| 原級 | 比較級 | 用法 |
|---|---|---|
| **mauvais**（悪い） | plus mauvais / **pire** | pire は抽象的・道徳的な文脈 |
| **mal**（悪く） | plus mal / **pis** | pis はほぼ成句のみ（tant pis） |
| **petit**（小さい） | plus petit / **moindre** | moindre は抽象的な「より少ない」 |

- [[C'est pire que je pensais.\|セ・ピール・ク・ジュ・パンセ\|思っていたより悪い。]]
- [[Tant pis !\|タン・ピ\|仕方ない！]]（成句）
- [[sans le moindre doute\|サン・ル・モワンドル・ドゥット\|いささかの疑いもなく]]

物理的な大きさには plus petit を使い、moindre は「程度が小さい」という抽象的な意味に限られます。
:::

## 4. 最上級 — 定冠詞を付ける

**比較級の前に定冠詞を置く**だけです。

| | 形 |
|---|---|
| 最上（〜のうち最も…） | **le / la / les plus** … （de …） |
| 最下（〜のうち最も…でない） | **le / la / les moins** … （de …） |

:::ex 最上級
Marie est la plus belle de la classe. | マリ・エ・ラ・プリュ・ベル・ドゥ・ラ・クラス | マリはクラスで一番美しい。
C'est le livre le plus intéressant. | セ・ル・リーヴル・ル・プリュ・ザンテレサン | それが一番面白い本だ。
Ce sont les moins chers. | ス・ソン・レ・モワン・シェール | それらが一番安い。
:::

:::warn 「〜の中で」は de を使う
英語の in / of にあたる部分は、**フランス語では常に de** です。

- ○ [[le plus grand du monde\|ル・プリュ・グラン・デュ・モンド\|世界一大きい]]
- ○ [[la plus belle de la classe\|ラ・プリュ・ベル・ドゥ・ラ・クラス\|クラスで一番美しい]]
- × le plus grand dans le monde

「世界**で**」だから dans と考えたくなりますが、**最上級の範囲は必ず de** です。
:::

### 形容詞の位置によって定冠詞の数が変わる

:::deep 最上級で定冠詞が2回出るのはなぜか
第6章で見た形容詞の位置が、ここで効いてきます。

**（1）前置される形容詞** → 定冠詞は1つ
[[la plus belle fille\|ラ・プリュ・ベル・フィーユ\|最も美しい少女]]
（belle は前置形容詞なので、la plus belle がそのまま fille の前に立つ）

**（2）後置される形容詞** → 定冠詞が2つ
[[la fille la plus intelligente\|ラ・フィーユ・ラ・プリュ・ザンテリジャント\|最も賢い少女]]
（intelligente は後置形容詞なので、名詞に定冠詞、最上級にも定冠詞が要る）

後者で la が2回出るのは冗長に見えますが、**名詞の限定詞（la fille）と最上級の標識（la plus）は別のもの**だからです。省略できません。

なお所有形容詞がある場合は、それが限定詞の役割を果たします。
[[mon plus beau souvenir\|モン・プリュ・ボー・スヴニール\|私の最も美しい思い出]]（× mon le plus beau）
:::

:::warn 副詞の最上級は常に le
副詞には性がないので、**定冠詞は常に le** です。

- [[Elle chante le mieux.\|エル・シャント・ル・ミュー\|彼女が一番上手に歌う。]]
- [[Il court le plus vite.\|イル・クール・ル・プリュ・ヴィット\|彼が一番速く走る。]]

主語が女性でも複数でも le のままです。**形容詞の最上級と混同しないでください。**

- [[Elle est la meilleure.\|エ・レ・ラ・メイユール\|彼女が一番だ。]]（形容詞 → la）
- [[Elle chante le mieux.\|エル・シャント・ル・ミュー\|彼女が一番上手に歌う。]]（副詞 → le）
:::

## 5. 比較を使った表現

:::adv よく使う比較の構文

**de plus en plus / de moins en moins**（ますます〜／ますます〜でなく）
[[Il fait de plus en plus chaud.\|イル・フェ・ドゥ・プリュ・ザン・プリュ・ショー\|ますます暑くなる。]]

**plus … plus …**（〜すればするほど…）
[[Plus on apprend, plus on comprend.\|プリュ・ゾン・ナプラン・プリュ・ゾン・コンプラン\|学べば学ぶほど理解できる。]]

**le plus … possible**（できるだけ〜）
[[le plus vite possible\|ル・プリュ・ヴィット・ポスィブル\|できるだけ速く]]

**deux fois plus … que**（〜の2倍…）
[[Il est deux fois plus grand que moi.\|イ・レ・ドゥ・フォワ・プリュ・グラン・ク・モワ\|彼は私の2倍の背丈だ。]]
:::

:::adv 比較の que の後ろでは強勢形を使う
第19章で扱いますが、比較の que の後ろに代名詞が来る場合、主語の形（je, tu, il）ではなく**強勢形**（moi, toi, lui）を使います。

- ○ [[Il est plus grand que moi.\|イ・レ・プリュ・グラン・ク・モワ\|彼は私より背が高い。]]
- × Il est plus grand que je.

英語の口語 taller than me と同じ形になります（英語の規範文法では than I ですが、フランス語では moi が唯一の正解です）。
:::

:::adv 比較の que の後ろの虚辞の ne
第5章で扱った虚辞の ne が、比較級の que の後ろに現れることがあります。

[[Il est plus grand que je ne pensais.\|イ・レ・プリュ・グラン・ク・ジュ・ヌ・パンセ\|彼は私が思っていたより背が高い。]]

この ne に否定の意味はありません。**書き言葉・改まった文体でのみ**現れます。話し言葉では省略されます。
:::

## 6. まとめの表

:::note 比較・最上級・一覧
| 比べる対象 | 優等 | 同等 | 劣等 |
|---|---|---|---|
| 形容詞 | plus … que | **aussi** … que | moins … que |
| 副詞 | plus … que | **aussi** … que | moins … que |
| 名詞 | plus **de** … que | **autant de** … que | moins **de** … que |
| 動詞 | … plus que | … **autant** que | … moins que |

**不規則**
- bon（形容詞）→ **meilleur**（性数一致する）
- bien（副詞）→ **mieux**（変化しない）

**最上級**
- 形容詞 → le / la / les plus（性数一致）
- 副詞 → **le** plus（常に le）
- 範囲は **de**（× dans）
:::

## 練習問題

:::quiz
Q. Ce vin est mieux que l'autre. はなぜ誤りですか。
A. être の後ろに来て主語を説明しているので、必要なのは形容詞。bien（副詞）の比較級 mieux ではなく、bon（形容詞）の比較級 **meilleur** を使う。正しくは Ce vin est **meilleur** que l'autre.

Q. 「彼は私と同じくらい本を持っている」を言ってください。
A. Il a **autant de** livres que moi. 名詞を比べるので aussi ではなく autant、さらに数量表現なので de が入り、後ろは無冠詞になる。

Q. Elle chante le mieux. の le は、なぜ la にならないのですか。
A. mieux は副詞であり、副詞には性がないため定冠詞は常に le。主語が女性でも複数でも変わらない。形容詞の最上級（Elle est la meilleure.）と混同しないこと。

Q. la fille la plus intelligente で、なぜ la が2回出るのですか。
A. intelligente は後置形容詞なので、名詞の限定詞としての la と、最上級の標識としての la が別々に必要になるため。前置形容詞なら1つで済む（la plus belle fille）。

Q. le plus grand dans le monde はなぜ誤りですか。
A. 最上級の範囲を表すのは常に前置詞 **de**。「世界で」だから dans と考えたくなるが、正しくは le plus grand **du** monde。

Q. Je n'en veux plus. と Moi, j'en veux plus. は、どう聞き分けますか。
A. plus の s を発音するかどうか。否定の ne … plus では s を読まず「プリュ」、数量の plus（もっと）は文末で s を読み「プリュス」。話し言葉では ne が落ちるため、**s の有無だけが「もう要らない」と「もっと欲しい」を区別する**ことになる。
:::

:::ai-gen 比較級と最上級、meilleur と mieux の使い分け

  body: `
第3章で「Il pleut. の il は誰も指していない」と述べました。この il を**非人称の il（il impersonnel）**と呼びます。

主語が実質的な意味を持たず、**文法上の座席を埋めるためだけに置かれる**——この構文は天候表現だけでなく、時刻・必要性・可能性など広い範囲で使われます。しかも **il faut** や **il y a** のような最頻出表現がここに含まれるため、避けて通れません。

この章では非人称構文を体系的に扱い、あわせて**数詞と時刻・日付**を導入します。

## 1. 非人称構文とは何か

**主語 il が何も指さない構文**です。動詞は常に3人称単数で活用します。

| 種類 | 例 |
|---|---|
| 天候 | Il pleut. / Il fait beau. |
| 時刻 | Il est trois heures. |
| 必要性 | Il faut partir. |
| 存在 | Il y a un chat. |
| 評価 | Il est difficile de comprendre. |

:::warn 非人称の il は他の主語に置き換えられない
これが「非人称」の定義です。

- [[Il pleut.\|イル・プル\|雨が降っている。]] … × Le ciel pleut. とは言えない
- [[Il est trois heures.\|イ・レ・トロ・ザール\|3時です。]] … × L'horloge est trois heures. とは言えない

一方、[[Il est grand.\|イ・レ・グラン\|彼は背が高い。]] の il は具体的な人を指すので、Pierre est grand. に置き換えられます。**置き換えられるかどうか**が、人称・非人称の判定基準です。
:::

## 2. 天候表現

**faire を使う型が基本**です。「天気が〜を作る」という発想になります。

:::ex faire を使う天候表現
Il fait beau. | イル・フェ・ボー | 天気がいい。
Il fait mauvais. | イル・フェ・モヴェ | 天気が悪い。
Il fait chaud. | イル・フェ・ショー | 暑い。
Il fait froid. | イル・フェ・フロワ | 寒い。
Il fait frais. | イル・フェ・フレ | 涼しい。
Il fait doux. | イル・フェ・ドゥー | 穏やかだ。
Il fait sombre. | イル・フェ・ソンブル | 暗い。
Il fait du vent. | イル・フェ・デュ・ヴァン | 風がある。
Il fait du soleil. | イル・フェ・デュ・ソレイユ | 日が照っている。
Il fait du brouillard. | イル・フェ・デュ・ブルイヤール | 霧が出ている。
:::

:::note faire + 形容詞と faire + 部分冠詞
上の表をよく見ると、2つの型が混ざっています。

- **il fait + 形容詞**：beau, mauvais, chaud, froid（状態を述べる）
- **il fait du + 名詞**：du vent, du soleil, du brouillard（あるモノの量を述べる）

後者は第2章の**部分冠詞**です。「風というものが、ある量ある」という捉え方をしています。**天候の要素が数えられない物質のように扱われている**のが、フランス語らしい発想です。
:::

### 専用の動詞を持つ天候

:::ex 天候専用の非人称動詞
Il pleut. | イル・プル | 雨が降っている。
Il neige. | イル・ネージュ | 雪が降っている。
Il gèle. | イル・ジェル | 凍っている。
Il grêle. | イル・グレル | 雹が降っている。
Il tonne. | イル・トンヌ | 雷が鳴っている。
:::

:::conj pleuvoir présent,imparfait,futur,passeCompose

**pleuvoir は il の形しか持ちません。** 活用表を見ると、他の人称が空欄になっているのが分かります。falloir も同じです。これが「非人称動詞」の名の由来です。

:::adv 比喩では複数形も使う
文学的な用法では、pleuvoir が人称的に使われることがあります。
[[Les coups pleuvaient.\|レ・クー・プルヴェ\|殴打が雨のように降り注いだ。]]

ただしこれは比喩で、天候の意味では常に非人称です。
:::

### その他の天候表現

:::ex être / y avoir を使う天候表現
Il y a du vent. | イリヤ・デュ・ヴァン | 風がある。
Il y a des nuages. | イリヤ・デ・ニュアージュ | 雲が出ている。
Le ciel est bleu. | ル・スィエ・レ・ブル | 空が青い。
Quel temps fait-il ? | ケル・タン・フェ・ティル | どんな天気ですか？
:::

**Quel temps fait-il ?** は第10章の疑問形容詞 quel と、第9章の倒置を組み合わせた形です。天気を尋ねる定型表現なので、そのまま覚えてください。

## 3. il faut — 必要性を表す

:::warn il faut は最頻出の非人称動詞
**falloir** は「〜が必要である」を表す動詞で、**il の形しか持ちません**。しかしフランス語で極めて頻繁に使われます。

:::conj falloir présent,imparfait,futur,conditionnel

il faut の後ろには3つのものが来ます。

**（1）il faut + 不定詞**（一般的な必要性）
[[Il faut partir.\|イル・フォ・パルティール\|出発しなければならない。]]
[[Il faut travailler.\|イル・フォ・トラヴァイエ\|働かなければならない。]]

**（2）il faut + 名詞**（〜が必要だ）
[[Il faut du temps.\|イル・フォ・デュ・タン\|時間が必要だ。]]
[[Il me faut un stylo.\|イル・ム・フォ・アン・スティロ\|私にはペンが要る。]]

**（3）il faut que + 接続法**（特定の人がすべきこと）
[[Il faut que tu partes.\|イル・フォ・ク・テュ・パルト\|君は出発しなければならない。]]

**（1）と（3）の違い**は、行為者を特定するかどうかです。不定詞は誰にでも当てはまる一般論、que 節は特定の主語に対する要求になります。que 節では**接続法**（第31章）が必要です。
:::

:::note devoir との使い分け
「〜しなければならない」には **devoir** もあります（第13章で登場）。

- [[Il faut partir.\|イル・フォ・パルティール\|（誰であれ）出発しなければならない。]] … 外的な必要性、一般論
- [[Je dois partir.\|ジュ・ドワ・パルティール\|私は出発しなければならない。]] … 主語の義務

il faut のほうが**非人格的で強い**響きになります。「そういうものだ」というニュアンスです。会話では il faut のほうが多用されます。
:::

## 4. 非人称の il + être + 形容詞

第4章で扱った c'est / il est の区別が、ここでも現れます。

:::ex 非人称の il est
Il est difficile de comprendre. | イ・レ・ディフィスィル・ドゥ・コンプランドル | 理解するのは難しい。
Il est important de travailler. | イ・レ・タンポルタン・ドゥ・トラヴァイエ | 働くことは重要だ。
Il est possible qu'il vienne. | イ・レ・ポスィブル・キル・ヴィエンヌ | 彼が来る可能性がある。
:::

:::warn il est … de + 不定詞 と c'est … à + 不定詞
第4章で予告した区別です。

| 形 | 使う場面 |
|---|---|
| **il est** + 形容詞 + **de** + 不定詞 | これから述べる内容を予告する（書き言葉的） |
| **c'est** + 形容詞 + **à** + 不定詞 | すでに話題になっている事柄を受ける |

- [[Il est difficile de comprendre ce texte.\|イ・レ・ディフィスィル・ドゥ・コンプランドル\|このテキストを理解するのは難しい。]]（内容を予告）
- [[Ce texte ? C'est difficile à comprendre.\|ス・テクスト・セ・ディフィスィル・ア・コンプランドル\|このテキスト？ 理解しにくいよ。]]（既出の話題を受ける）

**前置詞まで変わる**（de と à）ので、セットで覚えてください。なお話し言葉では、予告の場合でも c'est … de が広く使われます（C'est difficile de comprendre.）。
:::

## 5. 数詞 — 基数

非人称表現で時刻を扱うので、ここで数詞をまとめます。第0章で0〜20を学びました。続きです。

:::ex 20 から 100
vingt | ヴァン | 20
vingt et un | ヴァン・テ・アン | 21
vingt-deux | ヴァン・ドゥ | 22
trente | トラント | 30
quarante | カラント | 40
cinquante | サンカント | 50
soixante | ソワサント | 60
soixante-dix | ソワサント・ディス | 70
quatre-vingts | カトル・ヴァン | 80
quatre-vingt-dix | カトル・ヴァン・ディス | 90
cent | サン | 100
:::

:::warn 70・80・90 は20進法の名残
フランス語の数詞で最も有名な難所です。

- **70 = soixante-dix**（60 + 10）
- **80 = quatre-vingts**（4 × 20）
- **90 = quatre-vingt-dix**（4 × 20 + 10）

71 は soixante et onze（60 + 11）、99 は quatre-vingt-dix-neuf（4×20 + 19）となります。

これは**ケルト系の20進法**がフランス語に残ったものと説明されます。かつては六十（soixante）以上に septante（70）、huitante（80）、nonante（90）という10進法の形もありましたが、パリの用法が標準となる過程で20進法が定着しました。

**ベルギー・スイスでは今も10進法を使います**：septante（70）、nonante（90）、スイスでは huitante（80）も。フランス語圏の中でも地域差が大きい部分です。
:::

:::deep 数詞の綴りの細則
大学レベルでは、次の綴りの規則も問われます。

**（1）et が入るのは 21, 31, 41, 51, 61, 71 のみ**
vingt **et** un、trente **et** un … soixante **et** onze
ただし 81 と 91 は et を使いません：quatre-vingt-un、quatre-vingt-onze

**（2）quatre-vingts の s**
- 80 ちょうど → quatre-vingt**s**（s が付く）
- 81 以降 → quatre-vingt-un（s が落ちる）

同じ規則が cent にも適用されます。
- 200 → deux cent**s**
- 201 → deux cent un（s が落ちる）

**後ろに数が続くと s が落ちる**、と覚えます。

**（3）mille は不変**
[[deux mille\|ドゥ・ミル\|2000]]（× deux milles）。mille は常に単数形です。

**（4）million / milliard は名詞**
数詞ではなく名詞なので、**de を伴います**。
[[deux millions d'habitants\|ドゥ・ミリオン・ダビタン\|200万人の住民]]
:::

## 6. 時刻

**Il est + 数 + heure(s)** で表します。非人称構文です。

:::ex 時刻
Quelle heure est-il ? | ケ・ルー・レ・ティル | 何時ですか？
Il est une heure. | イ・レ・チュ・ヌール | 1時です。
Il est deux heures. | イ・レ・ドゥ・ザール | 2時です。
Il est trois heures et quart. | イ・レ・トロ・ザー・レ・カール | 3時15分です。
Il est quatre heures et demie. | イ・レ・カト・ラー・レ・ドゥミ | 4時半です。
Il est cinq heures moins le quart. | イ・レ・サン・カール・モワン・ル・カール | 5時15分前（4時45分）です。
Il est midi. | イ・レ・ミディ | 正午です。
Il est minuit. | イル・エ・ミニュイ | 真夜中です。
:::

:::warn heure は女性名詞
だから **une** heure（× un heure）、そして **et demie**（× et demi）となります。

ただし midi / minuit は男性名詞なので、[[midi et demi\|ミディ・エ・ドゥミ\|12時半]] と e が付きません。細かい点ですが、書き取りで問われます。
:::

:::note 24時間制と12時間制
公的な場面（時刻表・放送・予約）では**24時間制**を使い、分をそのまま言います。

[[Il est quinze heures trente.\|イ・レ・カン・ザール・トラント\|15時30分です。]]
[[Le train part à dix-huit heures quarante-cinq.\|ル・トラン・パー・タ・ディジュイ・タール・カラント・サンク\|列車は18時45分に出発します。]]

日常会話では12時間制で、必要なら **du matin**（午前）／**de l'après-midi**（午後）／**du soir**（夜）を添えます。
[[trois heures de l'après-midi\|トロ・ザール・ドゥ・ラプレ・ミディ\|午後3時]]
:::

## 7. 曜日・月・日付

:::ex 曜日
lundi | ランディ | 月曜日
mardi | マルディ | 火曜日
mercredi | メルクルディ | 水曜日
jeudi | ジュディ | 木曜日
vendredi | ヴァンドルディ | 金曜日
samedi | サムディ | 土曜日
dimanche | ディマンシュ | 日曜日
:::

:::ex 月
janvier | ジャンヴィエ | 1月
février | フェヴリエ | 2月
mars | マルス | 3月
avril | アヴリル | 4月
mai | メ | 5月
juin | ジュアン | 6月
juillet | ジュイエ | 7月
août | ウット | 8月
septembre | セプタンブル | 9月
octobre | オクトーブル | 10月
novembre | ノヴァンブル | 11月
décembre | デサンブル | 12月
:::

:::warn 曜日・月は小文字で書く
英語では Monday, January と大文字ですが、**フランス語は小文字**です。国籍の形容詞（français）と同じ扱いです。
:::

:::deep 日付の言い方
**le + 数 + 月**の順です。日本語や英語と語順が違います。

[[le 14 juillet\|ル・カトルズ・ジュイエ\|7月14日]]（フランス革命記念日）
[[le 1er janvier\|ル・プルミエ・ジャンヴィエ\|1月1日]]

**1日だけ序数（premier）を使い、2日以降は基数**です。
- 1日 → le **premier**（le 1er）
- 2日 → le **deux**（× le deuxième）

第2章で見た「曜日に定冠詞を付けると習慣になる」という規則も、ここで再確認しておきます。
- [[lundi\|ランディ\|（今度の）月曜に]] … 特定の1日
- [[le lundi\|ル・ランディ\|毎週月曜に]] … 習慣

**Quel jour sommes-nous ?**（今日は何曜日ですか）や **Quelle est la date ?**（今日は何日ですか）で尋ねます。
:::

## 8. 挨拶と天気 — 実際の会話へ

天気の話題はフランスでも定番の世間話です。

:::ex 天気を話題にする
Il fait beau aujourd'hui ! | イル・フェ・ボー・オジュルデュイ | 今日はいい天気ですね！
Quel temps fait-il chez vous ? | ケル・タン・フェ・ティル・シェ・ヴー | そちらの天気はどうですか？
Il va pleuvoir, je crois. | イル・ヴァ・プルヴォワール・ジュ・クロワ | 雨が降りそうですね。
Il a fait très chaud hier. | イラ・フェ・トレ・ショー・イエール | 昨日はとても暑かった。
:::

**Il va pleuvoir.** は第11章の近接未来です。非人称動詞でも近接未来が作れます。

## 練習問題

:::quiz
Q. Il pleut. の il が非人称であることを、どう証明しますか。
A. 他の主語に置き換えられないことで証明する。× Le ciel pleut. とは言えない。一方、Il est grand. の il は Pierre est grand. に置き換えられるので人称の il。置き換え可能かどうかが判定基準。

Q. Il fait chaud. と Il fait du vent. で、なぜ後ろの形が違うのですか。
A. 前者は **il fait + 形容詞**（状態を述べる）、後者は **il fait du + 名詞**（部分冠詞。あるモノの量を述べる）。フランス語では風・太陽・霧といった天候の要素を、数えられない物質のように扱う。

Q. Il faut partir. と Il faut que tu partes. の違いは何ですか。
A. 前者は不定詞で、誰にでも当てはまる一般的な必要性。後者は que 節で、特定の主語（tu）に対する要求。que 節では接続法が必要になる（第31章）。

Q. 80 と 81 で、quatre-vingt の綴りはどう変わりますか。
A. 80 ちょうどは quatre-vingt**s**（s が付く）、81 以降は quatre-vingt-un（s が落ちる）。「後ろに数が続くと s が落ちる」という規則で、cent にも同じ規則が適用される（deux cents / deux cent un）。

Q. 「4時半です」を Il est quatre heures et demi. と書くのはなぜ誤りですか。
A. heure が女性名詞なので、demi も女性形 demi**e** で一致させる必要がある。正しくは Il est quatre heures et **demie**. ただし midi / minuit は男性名詞なので midi et demi となる。

Q. 「7月14日」をフランス語で書いてください。また、「1月1日」はどうなりますか。
A. le 14 juillet（le + 基数 + 月）。1日だけは序数を使い le 1er janvier（le premier janvier）。2日以降はすべて基数。月名は小文字で書く。
:::

  title: '命令形',
  sub: '少し愛して 長く愛して……',
  body: `
命令形（l'impératif）は、フランス語で**唯一、主語を置かない形**です。第3章で「主語代名詞は省略できない」と述べましたが、その例外がここです。

作り方は簡単で、**直説法現在から主語を取るだけ**。ただし3つの細かい規則（-s の脱落、代名詞の位置、否定との組み合わせ）があり、これらは後の章（代名詞・代名動詞）で繰り返し使うので、ここで固めておきます。

## 1. 作り方 — 現在形から主語を取る

命令形は **tu / nous / vous の3つ**しかありません。

| 人称 | 意味 |
|---|---|
| **tu** の形 | 〜しろ、〜して（親しい相手に） |
| **nous** の形 | 〜しよう（勧誘） |
| **vous** の形 | 〜してください（丁寧・複数） |

:::conj chanter imperatif

:::warn 第1群では tu の -s が落ちる
これが唯一の形の変化です。

- 現在形：tu chante**s**
- 命令形：**Chante !**（s が落ちる）

**-er 動詞と、ouvrir 型（現在形の語尾が -e になる第3群）**でこの脱落が起きます。他の動詞では落ちません。

| 動詞 | 現在形（tu） | 命令形 |
|---|---|---|
| chanter | tu chantes | **Chante !** |
| ouvrir | tu ouvres | **Ouvre !** |
| aller | tu vas | **Va !** |
| finir | tu finis | **Finis !**（落ちない） |
| prendre | tu prends | **Prends !**（落ちない） |
| partir | tu pars | **Pars !**（落ちない） |
:::

:::ex 命令形を使ってみる
Chante ! | シャント | 歌え！
Chantons ! | シャントン | 歌おう！
Chantez ! | シャンテ | 歌ってください！
Écoute ! | エクット | 聞いて！
Regardez ! | ルガルデ | ご覧ください！
Finis ton travail ! | フィニ・トン・トラヴァイユ | 仕事を終わらせなさい！
Prenez le métro. | プルネ・ル・メトロ | 地下鉄に乗ってください。
Viens ! | ヴィアン | おいで！
:::

:::deep -s が落ちるのに復活する場合がある
第1群の tu の命令形は -s が落ちますが、**後ろに y や en が続くとリエゾンのために復活します**。

- [[Va !\|ヴァ\|行け！]] → [[Vas-y !\|ヴァ・ズィ\|さあ行け！／頑張れ！]]
- [[Parle !\|パルル\|話せ！]] → [[Parles-en !\|パルル・ザン\|それについて話せ！]]
- [[Donne !\|ドンヌ\|渡せ！]] → [[Donnes-en !\|ドンヌ・ザン\|それを（いくらか）渡せ！]]

母音で始まる y / en の前で、リエゾンする子音がないと発音しにくいためです。**bel / cet / -t- の挿入と同じ、母音の衝突を避ける現象**です。

[[Vas-y !\|ヴァ・ズィ\|行け！／頑張れ！]] はスポーツの応援などで頻繁に耳にする表現です。
:::

## 2. 不規則な命令形 — 4つだけ

**être, avoir, savoir, vouloir** の4語だけ、現在形から作れません。**接続法現在の形を使います**（第31章で扱う形が先取りで出てきます）。

| 動詞 | tu | nous | vous |
|---|---|---|---|
| **être** | sois | soyons | soyez |
| **avoir** | aie | ayons | ayez |
| **savoir** | sache | sachons | sachez |
| **vouloir** | veuille | veuillons | **veuillez** |

:::conj être imperatif

:::ex 不規則な命令形
Sois sage ! | ソワ・サージュ | いい子にしていなさい！
Soyez les bienvenus. | ソワイエ・レ・ビアンヴニュ | ようこそ。
N'aie pas peur. | ネ・パ・プール | 怖がらないで。
Ayez confiance. | エイエ・コンフィヤンス | 信頼してください。
Sachez que c'est faux. | サシェ・ク・セ・フォー | それが誤りだと知っておいてください。
Veuillez patienter. | ヴイエ・パスィヤンテ | しばらくお待ちください。
:::

:::note veuillez は最も丁寧な依頼表現
**veuillez + 不定詞** は、ビジネスメールや公的な掲示で標準的に使われる、非常に丁寧な依頼の形です。

[[Veuillez agréer mes salutations distinguées.\|ヴイエ・アグレエ・メ・サリュタスィオン・ディスタンゲ\|敬具（手紙の結び）]]
[[Veuillez trouver ci-joint …\|ヴイエ・トルヴェ・スィ・ジョワン\|添付をご確認ください]]

フランス語のビジネスメールでは必ず出てくる形なので、覚えておくと役に立ちます。
:::

:::adv pouvoir には命令形がない
[[pouvoir\|プヴォワール\|〜できる]] は命令形を持ちません。「〜できるようになれ」と命じることに意味がないためです。同様に、**falloir, pleuvoir などの非人称動詞**も命令形を持ちません（誰にも命令できない）。

活用表で確認できます。
:::conj pouvoir imperatif
:::

## 3. 否定の命令形

第5章の原則どおり、**活用した動詞を ne … pas で挟みます**。

:::ex 否定の命令形
Ne chante pas ! | ヌ・シャント・パ | 歌うな！
Ne partez pas ! | ヌ・パルテ・パ | 行かないでください！
N'oublie pas ! | ヌブリ・パ | 忘れないで！
Ne t'inquiète pas. | ヌ・タンキエット・パ | 心配しないで。
:::

## 4. 代名詞との組み合わせ — 位置が変わる

:::warn 肯定命令では代名詞が動詞の後ろに来る
これは**フランス語で唯一、目的語代名詞が動詞の後ろに置かれる場合**です。第17章以降で扱う代名詞のすべてに関わるので、ここで原則を押さえます。

| | 代名詞の位置 |
|---|---|
| **肯定命令** | 動詞の**後ろ**（ハイフンでつなぐ） |
| **否定命令** | 動詞の**前**（通常どおり） |
| それ以外すべて | 動詞の**前** |

:::ex 肯定と否定で位置が反転する
Regarde-moi ! | ルガルド・モワ | 私を見て！
Ne me regarde pas ! | ヌ・ム・ルガルド・パ | 私を見ないで！
Donnez-le-moi. | ドネ・ル・モワ | それを私にください。
Ne me le donnez pas. | ヌ・ム・ル・ドネ・パ | それを私にくれないでください。
:::
:::

:::warn 肯定命令では me → moi、te → toi に変わる
代名詞が動詞の後ろに置かれると、**強い位置**になるため、弱形の me / te が強形の moi / toi に変わります（第19章の強勢形と同じ現象）。

- Ne **me** regarde pas.（動詞の前 → 弱形 me）
- Regarde-**moi** !（動詞の後 → 強形 moi）

ただし **y / en が続く場合は m'y / t'en** と弱形に戻ります。
[[Va-t'en !\|ヴァ・タン\|出て行け！]]（te + en → t'en）
:::

:::deep 肯定命令で代名詞が2つ並ぶとき
第26.5章で詳しく扱いますが、原則だけ示します。

**肯定命令では「直接目的語 → 間接目的語」の順**になります。通常の語順とは逆です。

- 通常：[[Il me le donne.\|イル・ム・ル・ドンヌ\|彼はそれを私にくれる。]]（間接 me → 直接 le）
- 肯定命令：[[Donne-le-moi !\|ドンヌ・ル・モワ\|それを私にくれ！]]（直接 le → 間接 moi）
- 否定命令：[[Ne me le donne pas !\|ヌ・ム・ル・ドンヌ・パ\|それを私にくれるな！]]（通常の順に戻る）

**肯定命令のときだけ語順が入れ替わる**、と覚えてください。
:::

## 5. 命令以外の使い方

:::adv 命令形は「命令」だけではない
形は命令形でも、実際の意図はさまざまです。

| 用法 | 例 |
|---|---|
| **依頼** | [[Aidez-moi, s'il vous plaît.\|エデ・モワ・スィル・ヴ・プレ\|手伝ってください。]] |
| **勧誘** | [[Allons au cinéma !\|アロン・ゾ・スィネマ\|映画に行こう！]] |
| **助言** | [[Prends un taxi.\|プラン・ザン・タクスィ\|タクシーに乗るといいよ。]] |
| **許可** | [[Entrez.\|アントレ\|お入りください。]] |
| **願望** | [[Sois heureux.\|ソワ・ズルー\|幸せでいてね。]] |
| **条件** | [[Travaille, et tu réussiras.\|トラヴァイユ・エ・テュ・レユスィラ\|働きなさい、そうすれば成功する。]] |

最後の用法は、**命令形 + et + 単純未来**で「もし〜すれば…」という条件文の代わりになります（第30章の si 構文と対応）。
:::

:::note 命令を和らげる方法
命令形は直接的なので、日常では和らげた表現がよく使われます。

- **s'il vous plaît / s'il te plaît** を添える：[[Fermez la porte, s'il vous plaît.\|フェルメ・ラ・ポルト・スィル・ヴ・プレ\|ドアを閉めてください。]]
- **疑問文にする**：[[Tu peux fermer la porte ?\|テュ・プ・フェルメ・ラ・ポルト\|ドア閉めてくれる？]]
- **条件法を使う**（第30章）：[[Pourriez-vous fermer la porte ?\|プリエ・ヴー・フェルメ・ラ・ポルト\|ドアを閉めていただけますか？]]

下に行くほど丁寧になります。**店や職場では条件法が標準**です。
:::

## 6. 標識・掲示でよく見る形

:::adv 掲示では不定詞が使われる
公共の掲示では、命令形ではなく**不定詞**が使われることがよくあります。特定の相手ではなく不特定多数に向けるためです。

[[Ne pas fumer.\|ヌ・パ・フュメ\|禁煙。]]
[[Ne pas se pencher au dehors.\|ヌ・パ・ス・パンシェ・オ・ドゥオール\|窓から身を乗り出さないこと。]]
[[Pousser / Tirer\|プセ・ティレ\|押す／引く]]

第5章で見たとおり、**不定詞の否定では ne pas がまとめて前に置かれます**。

より丁寧な掲示では **Prière de + 不定詞** や **Veuillez + 不定詞** が使われます。
[[Prière de ne pas fumer.\|プリエール・ドゥ・ヌ・パ・フュメ\|禁煙のお願い。]]
:::

## 7. 活用ドリル

## 8. 章のタイトルについて

「少し愛して 長く愛して」——これを命令形で言うと、次のようになります。

:::ex 命令形の例文
Aime-moi un peu, aime-moi longtemps. | エム・モワ・アン・プ・エム・モワ・ロンタン | 少し愛して、長く愛して。
Ne m'oublie pas. | ヌ・ムブリ・パ | 私を忘れないで。
Écris-moi. | エクリ・モワ | 手紙をちょうだい。
Reste avec moi. | レスト・アヴェック・モワ | そばにいて。
:::

**Aime-moi** で -s が落ち、me が moi になっている——この章の2つの規則がどちらも効いています。

## 練習問題

:::quiz
Q. tu chantes の命令形はなぜ Chante !（s なし）になるのですか。また、tu finis はどうなりますか。
A. 第1群（-er 動詞）と ouvrir 型では、tu の命令形で -s が落ちる。finir は第2群なので落ちず、**Finis !** のまま。落ちるのは現在形の語尾が -es になる動詞に限られる。

Q. Va ! が Vas-y ! になると、なぜ s が復活するのですか。
A. y は母音で始まるため、リエゾンする子音がないと発音しにくいから。母音の衝突を避けるための挿入で、bel / cet / 倒置の -t- と同じ原理。en が続く場合も同様（Parles-en !）。

Q. Regarde-moi ! と Ne me regarde pas ! で、代名詞の位置と形が違うのはなぜですか。
A. **肯定命令のときだけ**、目的語代名詞が動詞の後ろに置かれる（フランス語で唯一の例外）。後ろに来ると強い位置になるため、弱形 me が強形 moi に変わる。否定命令では通常どおり動詞の前に戻り、形も me のまま。

Q. 命令形が現在形から作れない動詞は何ですか。
A. **être, avoir, savoir, vouloir** の4語。いずれも接続法現在の形を借りる（sois, aie, sache, veuille）。なお pouvoir と非人称動詞は命令形そのものを持たない。

Q. 「しばらくお待ちください」を最も丁寧に言うとどうなりますか。
A. **Veuillez patienter.** vouloir の命令形 veuillez + 不定詞は、ビジネスメールや公的な掲示で使われる最も丁寧な依頼の形。

Q. 掲示で Ne pas fumer. と書かれているのはなぜですか。命令形ではないのですか。
A. 掲示は不特定多数に向けるため、特定の相手を想定する命令形ではなく**不定詞**を使う。不定詞の否定では ne pas がまとめて前に置かれる（第5章）。より丁寧には Prière de ne pas fumer. とする。
:::

[[Je t'aime.\|ジュ・テーム\|愛してる。]] ——フランス語で最も知られた一文です。この **t'** が、この章で扱う**直接目的補語人称代名詞（le pronom personnel complément d'objet direct、略して COD）**です。

英語の I love **you**. と比べると、決定的な違いが1つあります。**フランス語では代名詞が動詞の前に来ます**。この語順は英語話者・日本語話者のどちらにとっても直感に反するため、意識的な訓練が必要です。

第17章から第19章まで、人称代名詞を3種類（直接目的語・間接目的語・強勢形）に分けて扱います。この章はその1つ目です。

## 1. 直接目的語とは何か

**前置詞なしで動詞に直接つながる目的語**です。

- [[Je regarde **la télé**.\|ジュ・ルガルド・ラ・テレ\|私はテレビを見る。]] … la télé は直接目的語
- [[Je parle **à Marie**.\|ジュ・パルル・ア・マリ\|私はマリに話す。]] … à Marie は前置詞つき＝間接目的語（第18章）

:::warn 日本語の「〜を」と一致しない動詞がある
日本語で「〜を」と訳せても、フランス語では前置詞が必要な場合があります。逆もあります。

| フランス語 | 直訳 | 目的語の種類 |
|---|---|---|
| [[téléphoner à\|テレフォネ・ア\|〜に電話する]] | 〜に電話する | **間接**（à が必要） |
| [[répondre à\|レポンドル・ア\|〜に答える]] | 〜に答える | **間接** |
| [[obéir à\|オベイール・ア\|〜に従う]] | 〜に従う | **間接** |
| [[attendre\|アタンドル\|〜を待つ]] | 〜を待つ | **直接**（前置詞なし） |
| [[chercher\|シェルシェ\|〜を探す]] | 〜を探す | **直接** |
| [[regarder\|ルガルデ\|〜を見る]] | 〜を見る | **直接** |
| [[écouter\|エクテ\|〜を聞く]] | 〜を聞く | **直接** |
| [[payer\|ペイエ\|〜を払う]] | 〜を払う | **直接** |

英語では wait **for**、look **for**、listen **to** と前置詞が要りますが、**フランス語では不要**です。逆に「電話する」は英語 call（直接）に対し、フランス語 téléphoner **à**（間接）です。

**動詞ごとに辞書で確認する**しかありません。ただしこの区別を誤ると、次章以降で使う代名詞を選び間違えます。
:::

## 2. 直接目的語代名詞の形

| 人称 | 形 | 意味 |
|---|---|---|
| 1人称単数 | **me**（m'） | 私を |
| 2人称単数 | **te**（t'） | 君を |
| 3人称単数・男性 | **le**（l'） | 彼を、それを |
| 3人称単数・女性 | **la**（l'） | 彼女を、それを |
| 1人称複数 | **nous** | 私たちを |
| 2人称複数 | **vous** | あなた（たち）を |
| 3人称複数 | **les** | 彼らを、それらを |

:::note 定冠詞とまったく同じ形
3人称の **le / la / les** は、定冠詞と同じ綴りです。区別は**位置**でつけます。

- [[Je regarde **le** film.\|ジュ・ルガルド・ル・フィルム\|私はその映画を見る。]] … 名詞の前 → 定冠詞
- [[Je **le** regarde.\|ジュ・ル・ルガルド\|私はそれを見る。]] … 動詞の前 → 代名詞

**動詞の直前にある le / la / les は代名詞**、と覚えてください。
:::

## 3. 語順 — 代名詞は動詞の前

**これがこの章の核心です。**

:::ex 名詞を代名詞に置き換える
Je regarde la télé. → Je la regarde. | ジュ・ラ・ルガルド | 私はそれを見る。
Tu aimes Marie ? → Tu l'aimes ? | テュ・レーム | 君は彼女を愛している？
Il achète les livres. → Il les achète. | イル・レ・ザシェット | 彼はそれらを買う。
Je t'aime. | ジュ・テーム | 私は君を愛している。
Elle nous invite. | エル・ヌー・ザンヴィット | 彼女は私たちを招待する。
:::

:::warn 英語・日本語との語順の違い
| 言語 | 語順 |
|---|---|
| 日本語 | 私は **君を** 愛している（目的語 → 動詞） |
| 英語 | I love **you**（動詞 → 目的語） |
| フランス語 | Je **t'**aime（**目的語 → 動詞**） |

偶然にも**日本語と同じ順序**になります。英語からフランス語に移る学習者にとっては難所ですが、日本語話者には掴みやすい点です。

ただし**名詞のままなら動詞の後ろ**です（Je regarde la télé.）。代名詞になったときだけ前に出ます。
:::

:::warn me / te / le / la はエリジオンする
母音・無音の h で始まる動詞の前では、**m' / t' / l'** になります。

- Je **te** regarde. → Je **t'**aime.
- Je **le** vois. → Je **l'**aime.
- Je **la** vois. → Je **l'**aime.

**le と la はどちらも l' になる**ので、エリジオンすると性が分からなくなります。[[Je l'aime.\|ジュ・レーム\|私は彼／彼女を愛している。]] は、男性にも女性にも使えます。
:::

## 4. 3つの構文での位置

代名詞は「動詞の前」ですが、動詞が複数ある文ではどの動詞の前かが問題になります。**原則は「その代名詞を目的語に取る動詞の直前」**です。

### （1）単純時制

:::ex 単純時制
Je le vois. | ジュ・ル・ヴォワ | 私はそれが見える。
Je ne le vois pas. | ジュ・ヌ・ル・ヴォワ・パ | 私はそれが見えない。
:::

否定文でも **ne の後、動詞の前**です。ne … pas が挟むのは「代名詞 + 動詞」のかたまりになります。

### （2）不定詞を伴う構文

:::ex 不定詞の前に置く
Je veux le voir. | ジュ・ヴ・ル・ヴォワール | 私はそれを見たい。
Je vais l'acheter. | ジュ・ヴェ・ラシュテ | 私はそれを買うつもりだ。
Je ne veux pas le voir. | ジュ・ヌ・ヴ・パ・ル・ヴォワール | 私はそれを見たくない。
:::

:::warn どの動詞の前に置くかは意味で決まる
Je veux le voir. で、le は **voir** の目的語です（「見たい」対象）。だから voir の直前に置きます。× Je le veux voir. とは言いません。

**代名詞は、自分が目的語になっている動詞の直前に置く** ——この原則を守れば迷いません。近接未来（Je vais l'acheter.）でも同じです。
:::

### （3）命令形

第16章で扱ったとおり、**肯定命令のときだけ動詞の後ろ**に来ます。

:::ex 命令形での位置
Regarde-le ! | ルガルド・ル | それを見て！
Ne le regarde pas ! | ヌ・ル・ルガルド・パ | それを見ないで！
Aime-moi ! | エム・モワ | 私を愛して！
Ne m'aime pas ! | ヌ・メーム・パ | 私を愛さないで！
:::

肯定命令では **me → moi** に変わることも復習しておいてください。

### （4）複合時制（先取り）

第20章で扱いますが、原則だけ示します。**代名詞は助動詞の前**に置きます。

[[Je l'ai vu.\|ジュ・レ・ヴュ\|私はそれを見た。]]（× J'ai le vu）

そして重要な帰結があります。**直接目的語が動詞より前に出ると、過去分詞がそれに性数一致します**。

[[Je l'ai vue.\|ジュ・レ・ヴュ\|私は彼女を見た。]]（l' が女性なので vue）

これが第20章で最も難しい規則になりますが、**その条件を作っているのがこの章の代名詞**です。

## 5. 中性代名詞 le — 文や形容詞を受ける

:::deep le は名詞以外も受けられる
3人称男性単数の le には、**性数を持たない「中性」の用法**があります。名詞ではなく、**形容詞・文全体・不定詞**を受けます。

:::ex 中性の le
Tu es fatigué ? — Oui, je le suis. | ウィ・ジュ・ル・スュイ | 疲れてる？ — うん、そうだよ。
Elle est malade, mais je ne le savais pas. | ジュ・ヌ・ル・サヴェ・パ | 彼女は病気だが、私はそれを知らなかった。
Il viendra, je le sais. | イル・ヴィアンドラ・ジュ・ル・セ | 彼は来る、私はそれを知っている。
:::

- 1つ目の le は形容詞 fatigué を受けています。**性数一致しません**（女性が答えても je le suis）。
- 2つ目・3つ目の le は文全体を受けています。

英語では省略される（Yes, I am. / I know.）ところに、**フランス語では le が必要**です。落とすと不自然になります。

この中性の le は第26章で y, le としてまとめて扱います。
:::

## 6. 使役・知覚動詞との組み合わせ

:::adv faire + 不定詞（使役）と voir + 不定詞（知覚）
「〜させる」「〜するのを見る」という構文では、代名詞の位置が特殊になります。

**使役 faire + 不定詞**
[[Je fais chanter Marie.\|ジュ・フェ・シャンテ・マリ\|私はマリに歌わせる。]]
→ [[Je la fais chanter.\|ジュ・ラ・フェ・シャンテ\|私は彼女に歌わせる。]]

代名詞は **faire の前**に置きます（× Je fais la chanter）。faire + 不定詞が**1つの動詞のかたまり**として扱われるためです。

**知覚 voir / entendre / écouter + 不定詞**
[[J'entends chanter Marie.\|ジャンタン・シャンテ・マリ\|私はマリが歌うのが聞こえる。]]
→ [[Je l'entends chanter.\|ジュ・ランタン・シャンテ\|私は彼女が歌うのが聞こえる。]]

こちらも知覚動詞の前です。

**laisser + 不定詞（放任）**も同じ扱いです。
[[Laisse-moi partir.\|レス・モワ・パルティール\|行かせてくれ。]]

これらの構文では、**不定詞の意味上の主語が、主動詞の目的語になっている**という点が特徴的です。fais chanter Marie では、Marie は「歌う」主語であり同時に faire の目的語です。だから代名詞化すると主動詞の前に出ます。
:::

## 7. 練習してみる

:::ex 代名詞に置き換える練習
Tu connais ce film ? — Oui, je le connais. | ウィ・ジュ・ル・コネ | この映画知ってる？ — うん、知ってる。
Vous prenez le métro ? — Non, je ne le prends pas. | ノン・ジュ・ヌ・ル・プラン・パ | 地下鉄に乗りますか？ — いいえ、乗りません。
Tu m'attends ? — Oui, je t'attends. | ウィ・ジュ・タタン | 待っててくれる？ — うん、待ってるよ。
Elle vous invite ? — Oui, elle nous invite. | ウィ・エル・ヌー・ザンヴィット | 彼女はあなたたちを招待するの？ — うん、招待してくれる。
Je peux le faire ? — Oui, tu peux le faire. | ウィ・テュ・プ・ル・フェール | それをやってもいい？ — うん、いいよ。
:::

## 練習問題

:::quiz
Q. Je regarde la télé. の la télé を代名詞に置き換えてください。
A. **Je la regarde.** 代名詞になると動詞の前に出る。名詞のままなら動詞の後ろ（Je regarde la télé.）。

Q. Je le veux voir. はなぜ誤りですか。
A. le は voir の目的語（見たい対象）なので、voir の直前に置く必要がある。正しくは **Je veux le voir.** 代名詞は「自分が目的語になっている動詞の直前」に置く。

Q. téléphoner と attendre では、目的語の扱いがどう違いますか。
A. téléphoner は **à** を取る間接他動詞（téléphoner à Marie）。attendre は前置詞なしの直接他動詞（attendre Marie）。日本語ではどちらも「〜に／〜を」と訳せるが、フランス語では別扱いになり、使う代名詞も変わる（第18章）。英語の wait **for** と違い、attendre に前置詞は不要。

Q. Je l'aime. の l' は男性ですか、女性ですか。
A. どちらとも決まらない。le も la も母音の前では l' にエリジオンするため、性が見えなくなる。文脈で判断する。

Q. 「疲れてる？」「うん、そうだよ」の「そうだよ」はフランス語でどう言いますか。
A. **Oui, je le suis.** この le は形容詞 fatigué を受ける中性代名詞で、性数一致しない（女性でも je le suis）。英語では Yes, I am. と省略されるが、フランス語では le が必要。

Q. Je fais chanter Marie. を代名詞にすると、なぜ Je la fais chanter. になるのですか。
A. 使役の faire + 不定詞は1つの動詞のかたまりとして扱われるため、代名詞は faire の前に置く（× Je fais la chanter）。知覚動詞（voir, entendre）や laisser + 不定詞も同じ扱い。
:::

| 人称 | 直接目的語（第17章） | **間接目的語** |
|---|---|---|
| 私に | me（m'） | **me**（m'） |

:::
