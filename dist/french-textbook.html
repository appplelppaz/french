会話文では、行頭のダッシュ **—** で話者の交代を示す形式も一般的です。
:::

## 2. 変化するもの（1）人称

**話し手が変わるので、人称代名詞・所有形容詞が変わります。**

:::ex 人称の変化
Il dit : « J'ai perdu mes clés. » | | 彼は「私は鍵をなくした」と言う。
→ Il dit qu'il a perdu ses clés. | イル・ディ・キ・ラ・ペルデュ・セ・クレ | 彼は鍵をなくしたと言う。
Elle m'a dit : « Je t'aime. » | | 彼女は私に「あなたを愛している」と言った。
→ Elle m'a dit qu'elle m'aimait. | エル・マ・ディ・ケ・ル・メメ | 彼女は私を愛していると言った。
:::

**je → il、mes → ses、tu/te → me** のように、語り手の視点に合わせて置き換えます。日本語でも同じ調整をするので、ここは直感的です。

## 3. 変化するもの（2）時制 — 時制の一致

:::warn 主節が過去のときだけ、時制が変わる
これが最重要の条件です。

- **主節が現在・未来** → 従属節の時制は**変わらない**
- **主節が過去**（複合過去・半過去・単純過去）→ 従属節の時制が**ずれる**

:::ex 主節の時制で変わる
Il dit qu'il est fatigué. | イル・ディ・キ・レ・ファティゲ | 彼は疲れたと言う。（主節が現在 → そのまま）
Il a dit qu'il était fatigué. | イラ・ディ・キ・レテ・ファティゲ | 彼は疲れたと言った。（主節が過去 → 半過去へ）
:::
:::

:::deep 時制の一致・完全表

主節が**過去**のとき、従属節は次のようにずれます。

| 直接話法（元の時制） | 間接話法（ずれた後） |
|---|---|
| 直説法現在 | **半過去** |
| 複合過去 | **大過去** |
| 単純未来 | **条件法現在** |
| 前未来 | **条件法過去** |
| 半過去 | **半過去**（変わらない） |
| 大過去 | **大過去**（変わらない） |
| 条件法 | **条件法**（変わらない） |
| 命令法 | **de + 不定詞** |

:::ex 時制がずれる例
Il a dit : « Je suis malade. » → Il a dit qu'il était malade. | イラ・ディ・キ・レテ・マラード | 彼は病気だと言った。（現在 → 半過去）
Il a dit : « J'ai fini. » → Il a dit qu'il avait fini. | イラ・ディ・キ・ラヴェ・フィニ | 彼は終わったと言った。（複合過去 → 大過去）
Il a dit : « Je viendrai. » → Il a dit qu'il viendrait. | イラ・ディ・キル・ヴィアンドレ | 彼は来ると言った。（単純未来 → 条件法現在）
Il a dit : « Pars ! » → Il m'a dit de partir. | イル・マ・ディ・ドゥ・パルティール | 彼は私に出発するように言った。（命令法 → de + 不定詞）
:::

**規則の背後にある論理**

すでに完了した3つの時制（半過去・大過去・条件法）は、**それ以上ずらしようがない**ので変わりません。ずれるのは現在・複合過去・未来の3つだけです。

- 現在 → 過去から見た「その時の現在」＝**半過去**
- 複合過去 → 過去から見た「その時の過去」＝**大過去**
- 単純未来 → 過去から見た「その時の未来」＝**条件法現在**

**条件法現在が「過去における未来」を表す**——これが条件法のもう一つの顔です。第30章で「仮定」として学ぶ形が、ここでは時制として働いています。
:::

:::warn 「過去における未来」は条件法
これは日本語話者がとくに戸惑う点です。

[[Il a dit qu'il viendrait.\|イラ・ディ・キル・ヴィアンドレ\|彼は来ると言った。]]

viendrait は条件法現在の形ですが、ここに**仮定の意味はありません**。「彼が言った時点から見て、これから来る」という**未来**を表しているだけです。

英語でも同じ構造があります：He said he **would** come.（would は本来 will の過去形）。フランス語の条件法も、もともと「未来語幹＋半過去の語尾」＝**過去から見た未来**という成り立ちなので（第13章）、この用法のほうが語源に忠実です。
:::

## 4. 変化するもの（3）時と場所を表す語

**「今日」「ここ」は、語る時点が変わればずれます。**

| 直接話法 | 間接話法（主節が過去） |
|---|---|
| aujourd'hui（今日） | **ce jour-là**（その日） |
| hier（昨日） | **la veille**（前日） |
| demain（明日） | **le lendemain**（翌日） |
| maintenant（今） | **alors** / **à ce moment-là**（その時） |
| ici（ここ） | **là** / **à cet endroit**（そこ） |
| ce matin（今朝） | **ce matin-là**（その朝） |
| la semaine prochaine（来週） | **la semaine suivante**（その翌週） |
| la semaine dernière（先週） | **la semaine précédente**（その前週） |

:::ex 時の表現がずれる
Il a dit : « Je pars demain. » | | 彼は「明日出発する」と言った。
→ Il a dit qu'il partait le lendemain. | イラ・ディ・キル・パルテ・ル・ランドゥマン | 彼は翌日出発すると言った。
Elle a dit : « Je suis arrivée hier. » | | 彼女は「昨日着いた」と言った。
→ Elle a dit qu'elle était arrivée la veille. | エラ・ディ・ケ・レテ・タリヴェ・ラ・ヴェイユ | 彼女は前日に着いたと言った。
:::

## 5. 疑問文の間接話法

**疑問文を間接話法にすると、語順が平叙文になります。**

:::deep 疑問の種類ごとの変換

| 直接疑問 | 間接疑問の接続詞 |
|---|---|
| はい／いいえの疑問 | **si**（〜かどうか） |
| 疑問副詞（où, quand, comment, pourquoi） | **そのまま** |
| **qu'est-ce que**（何を） | **ce que** |
| **qu'est-ce qui**（何が） | **ce qui** |
| **qui**（誰） | **qui**（そのまま） |

:::ex 間接疑問
Il demande : « Tu viens ? » → Il demande si je viens. | イル・ドゥマンド・スィ・ジュ・ヴィアン | 彼は私が来るかどうか尋ねる。
Il demande : « Où vas-tu ? » → Il demande où je vais. | イル・ドゥマンド・ウー・ジュ・ヴェ | 彼は私がどこへ行くのか尋ねる。
Il demande : « Qu'est-ce que tu fais ? » → Il demande ce que je fais. | イル・ドゥマンド・ス・ク・ジュ・フェ | 彼は私が何をしているのか尋ねる。
Il demande : « Qui est là ? » → Il demande qui est là. | イル・ドゥマンド・キ・エ・ラ | 彼は誰がいるのか尋ねる。
:::

**倒置は解除されます**（Où vas-tu ? → où je vais）。間接疑問はもはや疑問文ではなく、従属節だからです。

第21章で見た **ce qui / ce que** が、ここで疑問の受け皿として働いています。第12章の qu'est-ce qui / qu'est-ce que と対応関係にあることを確認してください。

| 直接疑問 | 間接疑問 | 関係節 |
|---|---|---|
| qu'est-ce qui | ce qui | ce qui |
| qu'est-ce que | ce que | ce que |

**3つの章が同じ形を別の役割で使っている**ことになります。
:::

:::warn 間接疑問の si と条件の si
形は同じですが別物です（第24章で触れました）。

| | 時制の扱い |
|---|---|
| **条件の si**（もし〜なら） | 未来形・条件法を使えない |
| **間接疑問の si**（〜かどうか） | 使える |

- 条件：× Si tu viendras … → ○ Si tu **viens**, je serai content.
- 間接疑問：○ Je ne sais pas si tu **viendras**.（君が来るかどうか分からない）

**後ろに未来形が来ていたら、それは間接疑問の si** です。
:::

## 6. 伝達動詞を選ぶ

:::adv dire 以外の伝達動詞
間接話法では、伝える内容に応じて動詞を選び分けます。表現の幅が大きく変わる部分です。

| 動詞 | 意味 | 構文 |
|---|---|---|
| [[dire que\|ディール・ク]] | 〜と言う | que + 直説法 |
| [[répondre que\|レポンドル・ク]] | 〜と答える | que + 直説法 |
| [[expliquer que\|エクスプリケ・ク]] | 〜と説明する | que + 直説法 |
| [[ajouter que\|アジュテ・ク]] | 〜と付け加える | que + 直説法 |
| [[affirmer que\|アフィルメ・ク]] | 〜と断言する | que + 直説法 |
| [[demander si\|ドゥマンデ・スィ]] | 〜かどうか尋ねる | si + 直説法 |
| [[demander de\|ドゥマンデ・ドゥ]] | 〜するよう頼む | de + 不定詞 |
| [[dire de\|ディール・ドゥ]] | 〜するよう言う | de + 不定詞 |
| [[conseiller de\|コンセイエ・ドゥ]] | 〜するよう勧める | de + 不定詞 |
| [[proposer de\|プロポゼ・ドゥ]] | 〜しようと提案する | de + 不定詞 |

**命令・依頼は必ず de + 不定詞**になります（que 節にはなりません）。

[[Il m'a dit de venir.\|イル・マ・ディ・ドゥ・ヴニール\|彼は私に来るように言った。]]
[[Elle m'a demandé de l'aider.\|エル・マ・ドゥマンデ・ドゥ・レデ\|彼女は手伝ってほしいと私に頼んだ。]]

**dire que と dire de の違い**が重要です。
- [[Il dit qu'il vient.\|イル・ディ・キル・ヴィアン\|彼は来ると言っている。]]（情報の伝達）
- [[Il dit de venir.\|イル・ディ・ドゥ・ヴニール\|彼は来るように言っている。]]（命令の伝達）
:::

## 7. 総合練習

:::ex 直接話法から間接話法へ
Il a dit : « Je suis fatigué. » → Il a dit qu'il était fatigué. | イラ・ディ・キ・レテ・ファティゲ | 彼は疲れたと言った。
Elle a dit : « J'ai vu ce film hier. » → Elle a dit qu'elle avait vu ce film la veille. | エラ・ディ・ケ・レヴェ・ヴュ・ス・フィルム・ラ・ヴェイユ | 彼女は前日その映画を見たと言った。
Il a demandé : « Tu viendras demain ? » → Il a demandé si je viendrais le lendemain. | イラ・ドゥマンデ・スィ・ジュ・ヴィアンドレ・ル・ランドゥマン | 彼は私が翌日来るかどうか尋ねた。
Elle a dit : « Ferme la porte ! » → Elle m'a dit de fermer la porte. | エル・マ・ディ・ドゥ・フェルメ・ラ・ポルト | 彼女は私にドアを閉めるように言った。
:::

:::note 変換の手順
1. **伝達動詞**を決める（dire que / demander si / dire de …）
2. **人称**を語り手の視点に合わせる
3. 主節が過去なら**時制をずらす**（現在→半過去、複合過去→大過去、未来→条件法）
4. **時と場所の語**をずらす（demain → le lendemain …）
5. 疑問なら**倒置を解除**する

この5段階を順に適用すれば、機械的に変換できます。
:::

## 練習問題

:::quiz
Q. 時制の一致は、どんなときに起きますか。
A. **主節が過去のとき**だけ。主節が現在・未来なら従属節の時制は変わらない（Il dit qu'il est fatigué. / Il a dit qu'il était fatigué.）。

Q. 直接話法の現在・複合過去・単純未来は、間接話法でそれぞれ何になりますか。
A. 現在 → **半過去**、複合過去 → **大過去**、単純未来 → **条件法現在**。それぞれ「過去から見た現在／過去／未来」を表す。半過去・大過去・条件法はそれ以上ずらせないので変わらない。

Q. Il a dit qu'il viendrait. の viendrait に仮定の意味はありますか。
A. ない。「彼が言った時点から見て、これから来る」という**過去における未来**を表す。条件法はもともと「未来語幹＋半過去の語尾」＝過去から見た未来という成り立ちなので、この用法は語源に忠実。英語の He said he would come. と同じ構造。

Q. Je ne sais pas si tu viendras. で、なぜ si の後に未来形が使えるのですか。
A. これは条件の si ではなく**間接疑問の si**（〜かどうか）だから。条件の si の後では未来形・条件法を使えないが、間接疑問の si では使える。後ろに未来形があれば間接疑問と判断できる。

Q. Il dit qu'il vient. と Il dit de venir. の違いは何ですか。
A. 前者は情報の伝達（彼は来ると言っている）、後者は命令・依頼の伝達（彼は来るように言っている）。命令・依頼を間接話法にすると必ず **de + 不定詞** になり、que 節にはならない。

Q. Il a dit : « Je pars demain. » を間接話法にしてください。
A. **Il a dit qu'il partait le lendemain.** 人称（je → il）、時制（現在 → 半過去）、時を表す語（demain → le lendemain）の3つが同時に変化する。
:::

  sub: '「愛される」という甘美な♥地獄',
  body: `
受動態（la voix passive）は **être + 過去分詞**で作ります。作り方は英語とほぼ同じで、難しいところはありません。

しかし実際のフランス語では、**受動態はあまり使われません**。日本語や英語なら受動で言うところを、フランス語は **on** や**代名動詞**で表すことを好みます。この章では受動態そのものより、**なぜ避けられるのか、代わりに何を使うのか**に重点を置きます。

## 1. 作り方 — être + 過去分詞

:::warn 過去分詞は必ず主語に性数一致する
être を使うので、第20章の規則①がそのまま適用されます。

:::ex 受動態の基本
Le livre est écrit par Marie. | ル・リーヴル・エ・テクリ・パール・マリ | その本はマリによって書かれた。
La lettre est écrite par Paul. | ラ・レットル・エ・テクリット・パール・ポール | その手紙はポールによって書かれた。
Les livres sont écrits par Marie. | レ・リーヴル・ソン・テクリ | それらの本はマリによって書かれた。
Les lettres sont écrites par Paul. | レ・レットル・ソン・テクリット | それらの手紙はポールによって書かれた。
:::

écrit / écrite / écrits / écrites と、主語に合わせて4通りに変化します。
:::

### 能動態から受動態へ

**能動文の直接目的語が、受動文の主語になります。**

:::ex 能動 → 受動
Marie écrit le livre. → Le livre est écrit par Marie. | ル・リーヴル・エ・テクリ・パール・マリ | 本はマリによって書かれる。
Le chat mange la souris. → La souris est mangée par le chat. | ラ・スリ・エ・マンジェ・パール・ル・シャ | ねずみは猫に食べられる。
:::

:::warn 直接目的語を持つ動詞しか受動態にできない
これが最も重要な制約です。**間接目的語しか取らない動詞は、受動態にできません。**

- [[Je téléphone à Marie.\|ジュ・テレフォヌ・ア・マリ\|私はマリに電話する。]] → 受動態にできない
- 英語なら Marie was telephoned. と言えますが、**フランス語では不可能**です

第17章・第18章で扱った直接／間接の区別が、ここでも効いています。同じ理由で、obéir à、répondre à、parler à なども受動態にできません。

**例外**：obéir, désobéir, pardonner は古い用法の名残で受動態が可能です（Il est obéi de tous.）が、非常に文語的です。
:::

## 2. 時制の変化 — être を活用させる

**受動態の時制は、être の時制で決まります。** 過去分詞は変わりません。

| 時制 | 形 |
|---|---|
| 現在 | Le livre **est** écrit. |
| 複合過去 | Le livre **a été** écrit. |
| 半過去 | Le livre **était** écrit. |
| 単純未来 | Le livre **sera** écrit. |
| 大過去 | Le livre **avait été** écrit. |
| 条件法現在 | Le livre **serait** écrit. |

:::conj être présent,passeCompose,imparfait,futur

:::ex 時制を変える
La maison est construite. | ラ・メゾ・ネ・コンストリュイット | 家が建てられる。
La maison a été construite en 1900. | ラ・メゾ・ナ・エテ・コンストリュイット | 家は1900年に建てられた。
La maison sera construite l'année prochaine. | ラ・メゾン・スラ・コンストリュイット | 家は来年建てられるだろう。
:::

:::warn 複合過去の受動態は過去分詞が2つ並ぶ
**a été construite** — avoir の現在 + été（être の過去分詞）+ construite（本動詞の過去分詞）。

3語になるので長く感じますが、構造は単純です。**「être を複合過去にした」だけ**です。

一致するのは**最後の過去分詞だけ**で、été は変化しません（× a étée）。
:::

## 3. 行為者を示す par と de

**行為者は par または de で導きます。** 使い分けがあります。

| 前置詞 | 使う場面 |
|---|---|
| **par** | **具体的な行為**。実際に何かをした |
| **de** | **状態・感情**。継続的な関係 |

:::ex par と de
Le livre est écrit par Marie. | ル・リーヴル・エ・テクリ・パール・マリ | 本はマリによって書かれた。（行為）
Il est aimé de tous. | イ・レ・テメ・ドゥ・トゥス | 彼はみんなに愛されている。（感情・状態）
Elle est respectée de ses élèves. | エ・レ・レスペクテ・ドゥ・セ・ゼレーヴ | 彼女は生徒たちに尊敬されている。（状態）
La ville est entourée de montagnes. | ラ・ヴィ・レ・タントゥレ・ドゥ・モンターニュ | その町は山に囲まれている。（状態）
:::

**de を取る主な動詞**：aimer, respecter, connaître, suivre, précéder, accompagner, entourer, couvrir, remplir, orner —— **感情や、静的な位置関係**を表す動詞です。

章のタイトル「愛される」は **être aimé de** ——感情なので de を使います。

:::note 行為者は省略されることが多い
実際には、**par 以下を言わない受動文が大半**です。

[[La porte a été fermée.\|ラ・ポル・タ・エテ・フェルメ\|ドアが閉められた。]]（誰が閉めたかは言わない）

そもそも受動態を使う理由が「行為者を言いたくない・言う必要がない」ことなので、これは自然な帰結です。
:::

## 4. なぜフランス語は受動態を避けるのか

:::deep 受動態の代わりに使われる2つの構文

フランス語では、行為者を示さない場合、**受動態より次の2つが好まれます**。

### （1）on を主語にする（第3章）

**最も一般的な方法です。**

:::ex on による受動の代用
On a construit ce pont en 1900. | オ・ナ・コンストリュイ・ス・ポン | この橋は1900年に建てられた。
On parle français au Canada. | オン・パルル・フランセ・オ・カナダ | カナダではフランス語が話されている。
On m'a volé mon sac. | オン・マ・ヴォレ・モン・サック | 鞄を盗まれた。
On vous demande au téléphone. | オン・ヴー・ドゥマン・ドー・テレフォン | お電話です（あなたが呼ばれています）。
:::

**日本語では受動で訳すのが自然**ですが、フランス語では能動文です。on が「誰か（特定しない人）」を担っています。

### （2）代名動詞の受動的用法（第23章）

**主語がモノのとき**に使えます。

:::ex 代名動詞による受動
Ce livre se vend bien. | ス・リーヴル・ス・ヴァン・ビアン | この本はよく売れる。
Le français se parle au Canada. | ル・フランセ・ス・パルル・オ・カナダ | フランス語はカナダで話されている。
Ça ne se fait pas. | サ・ヌ・ス・フェ・パ | そういうことはしないものだ。
Comment ça s'écrit ? | コマン・サ・セクリ | それはどう綴るのですか？
Ce plat se mange froid. | ス・プラ・ス・マンジュ・フロワ | この料理は冷たくして食べます。
:::

### 3つを並べて比べる

同じ内容を3通りで言えます。

:::ex 同じ内容を3通りで
Cette maison a été construite en 1900. | セット・メゾ・ナ・エテ・コンストリュイット | この家は1900年に建てられた。（受動態）
On a construit cette maison en 1900. | オ・ナ・コンストリュイ・セット・メゾン | この家を1900年に建てた。（on）
Cette maison s'est construite en 1900. | セット・メゾン・セ・コンストリュイット | この家は1900年に建てられた。（代名動詞）
:::

**使い分けの目安**
- **受動態** … 書き言葉、報道、学術。行為者を par で明示したいとき
- **on** … 話し言葉で最も一般的。行為者が人であることが前提
- **代名動詞** … 一般的な性質を述べるとき（「よく売れる」「こう書く」）

**日常会話では on が圧倒的**です。受動態は改まった文体の印である、と理解してください。
:::

## 5. 受動態にできない場合

:::warn 3つの制約

**（1）直接目的語がない動詞**（前節で述べたとおり）

**（2）avoir, pouvoir, vouloir などの一部の動詞**

[[J'ai une voiture.\|ジェ・ユヌ・ヴォワテュール\|私は車を持っている。]] → 受動態にできない（× Une voiture est eue par moi.）

**（3）代名動詞**

代名動詞はすでに se を目的語として使っているため、受動態にできません。

これらの場合、**on を使うか、能動文のままにします**。
:::

## 6. 状態か動作か — être + 過去分詞の曖昧さ

:::adv 「閉められた」のか「閉まっている」のか
**La porte est fermée.** には2つの解釈があります。

1. **動作の受動**：ドアが（今）閉められる
2. **状態**：ドアが閉まっている

フランス語ではこの2つを形で区別できません。文脈で判断します。

**明示したいとき**の手段：
- 動作を強調 → **par + 行為者**を加える：[[La porte est fermée par le concierge.\|ラ・ポル・テ・フェルメ・パール・ル・コンスィエルジュ\|ドアは管理人によって閉められる。]]
- 状態を強調 → 副詞や文脈で示す、あるいは形容詞的に捉える

ドイツ語は werden（動作）と sein（状態）で区別し、スペイン語も ser と estar で区別しますが、**フランス語は être 一つで両方を担っています**。

なお、複合過去にすると動作の解釈が強まります。
- [[La porte est fermée.\|ラ・ポル・テ・フェルメ\|ドアは閉まっている。]]（状態と読みやすい）
- [[La porte a été fermée.\|ラ・ポル・タ・エテ・フェルメ\|ドアが閉められた。]]（動作と読みやすい）
:::

## 7. 練習してみる

:::ex 能動・受動・on・代名動詞
Le professeur corrige les copies. | ル・プロフェスール・コリージュ・レ・コピ | 先生が答案を採点する。（能動）
Les copies sont corrigées par le professeur. | レ・コピ・ソン・コリジェ | 答案は先生によって採点される。（受動）
On corrige les copies. | オン・コリージュ・レ・コピ | 答案を採点する。（on）
Les copies se corrigent facilement. | レ・コピ・ス・コリージュ・ファスィルマン | 答案は簡単に採点できる。（代名動詞）
:::

## 練習問題

:::quiz
Q. 受動態はどう作りますか。過去分詞は一致しますか。
A. **être + 過去分詞**。être を使うので、過去分詞は必ず**主語に性数一致**する（Le livre est écrit / La lettre est écrite）。時制は être を活用させて変える。

Q. Je téléphone à Marie. を受動態にできますか。
A. できない。**直接目的語を持つ動詞しか受動態にできない**ため。téléphoner à は間接他動詞なので不可。英語では Marie was telephoned. と言えるが、フランス語では言えない。

Q. par と de は、どう使い分けますか。
A. **par は具体的な行為**（Le livre est écrit **par** Marie.）、**de は状態・感情**（Il est aimé **de** tous. / La ville est entourée **de** montagnes.）。aimer, respecter, entourer, couvrir などは de を取る。

Q. 「この橋は1900年に建てられた」を、フランス語で最も自然に言うとどうなりますか。
A. **On a construit ce pont en 1900.** 日本語では受動で訳すのが自然だが、フランス語では on を使った能動文が最も一般的。受動態（Ce pont a été construit…）は書き言葉・報道寄りの文体になる。

Q. Ce livre se vend bien. はどんな構文ですか。
A. **代名動詞の受動的用法**（第23章）。主語がモノのとき、se + 動詞で受動の意味を表す。一般的な性質を述べるときに使われ、受動態より日常的。

Q. La porte est fermée. には何通りの解釈がありますか。
A. 2通り。「ドアが閉められる」（動作の受動）と「ドアが閉まっている」（状態）。フランス語は être 一語で両方を担うため形では区別できず、文脈で判断する。ドイツ語の werden / sein、スペイン語の ser / estar のような区別がない。
:::

:::ai-gen 受動態、par と de、on と代名動詞による代用

**-ant** で終わる形が2つあります。

- **現在分詞**（le participe présent）… chantant（歌っている）

形は同じで、**前に en が付くかどうか**だけが違います。しかし機能はまったく別で、ここを混同すると文の意味を取り違えます。

## 1. 作り方 — nous の現在形から

**半過去と同じ語幹**です（第13章「①直説法現在」の枝）。

1. **nous の現在形**を出す
2. **-ons を取って**、**-ant** を付ける

| 動詞 | nous の現在形 | 現在分詞 |
|---|---|---|
| chanter | nous chant**ons** | chant**ant** |
| finir | nous finiss**ons** | finiss**ant** |
| prendre | nous pren**ons** | pren**ant** |
| boire | nous buv**ons** | buv**ant** |
| faire | nous fais**ons** | fais**ant** |
| voir | nous voy**ons** | voy**ant** |

:::warn 例外は3つだけ
半過去の例外は être だけでしたが、現在分詞は3つあります。

| 動詞 | 現在分詞 |
|---|---|
| **être** | **étant** |
| **avoir** | **ayant** |
| **savoir** | **sachant** |

avoir と savoir は、半過去なら規則どおり（avais, savais）なのに、現在分詞だけ不規則です。**この3つだけ**なので個別に覚えます。
:::

## 2. 現在分詞 — 名詞を修飾する

**関係節（qui + 動詞）の代わり**として、名詞を修飾します。書き言葉でよく使われる、簡潔な表現です。

:::ex 現在分詞
une chanteuse chantant en français | ユヌ・シャントゥーズ・シャンタン・タン・フランセ | フランス語で歌っている女性歌手
= une chanteuse qui chante en français | | （関係節で書き換えたもの）
Les étudiants voulant participer doivent s'inscrire. | レ・ゼテュディアン・ヴラン・パルティスィペ | 参加を希望する学生は登録しなければならない。
J'ai vu un homme portant un chapeau noir. | ジェ・ヴュ・アン・ノム・ポルタン・タン・シャポー・ノワール | 黒い帽子をかぶった男を見た。
:::

:::warn 現在分詞は性数一致しない
**動詞としての性質を保っているので、変化しません。**

- ○ une chanteuse chant**ant**（× chantante）
- ○ des étudiants voul**ant**（× voulants）

これが次節の形容詞的分詞との決定的な違いです。
:::

:::deep 現在分詞の3つの用法

**（1）名詞の修飾（上の例）**

**（2）理由・原因を表す**

[[Étant malade, il est resté chez lui.\|エタン・マラード・イ・レ・レステ・シェ・リュイ\|病気だったので、彼は家にいた。]]
[[N'ayant pas de voiture, je prends le train.\|ネイヤン・パ・ドゥ・ヴォワテュール\|車がないので、電車に乗る。]]

**（3）同時に起きていること**

[[Il est entré, portant un gros sac.\|イ・レ・タントレ・ポルタン・タン・グロ・サック\|彼は大きな鞄を持って入ってきた。]]

**否定は ne + 現在分詞 + pas** で作ります（n'ayant pas）。第5章の原則どおりです。

なお、**複合形の現在分詞**もあります（ayant + 過去分詞）。「〜し終えて」という完了を表します。
[[Ayant fini son travail, il est parti.\|エイヤン・フィニ・ソン・トラヴァイユ・イ・レ・パルティ\|仕事を終えて、彼は出発した。]]
:::

## 3. 形容詞的分詞 — 一致する -ant

:::warn 同じ -ant でも、形容詞なら一致する
性質を表す形容詞として定着した -ant の語があります。**こちらは性数一致します。**

| 形容詞 | 意味 |
|---|---|
| [[intéressant\|アンテレサン]] | 面白い |
| [[amusant\|アミュザン]] | 愉快な |
| [[fatigant\|ファティガン]] | 疲れさせる |
| [[charmant\|シャルマン]] | 魅力的な |
| [[suivant\|スュイヴァン]] | 次の |
| [[souriant\|スリヤン]] | 微笑んでいる |

:::ex 一致する／しない
une histoire intéressante | ユ・ニストワール・アンテレサント | 面白い話（形容詞 → 一致する）
une femme chantant une chanson | ユヌ・ファム・シャンタン・チュヌ・シャンソン | 歌を歌っている女性（現在分詞 → 一致しない）
:::

**見分け方**

| | 現在分詞 | 形容詞的分詞 |
|---|---|---|
| 一致 | しない | **する** |
| 目的語・補語 | **取れる**（chantant **une chanson**） | 取れない |
| 副詞での修飾 | ne … pas で否定できる | très などで修飾できる |
| 意味 | **動作**（〜している） | **性質**（〜な） |

**目的語を取っていれば現在分詞、取っていなければ形容詞**——これが実務的な判定法です。

:::adv 綴りが変わる場合がある
一部の語は、現在分詞と形容詞で綴りが違います。

| 動詞 | 現在分詞 | 形容詞 |
|---|---|---|
| fatiguer | fatigu**ant** | fatig**ant**（u が落ちる） |
| provoquer | provoqu**ant** | provo**cant**（qu → c） |
| différer | différ**ant** | différ**ent**（-ant → -ent） |
| précéder | précéd**ant** | précéd**ent** |
| négliger | néglige**ant** | néglig**ent** |
| convaincre | convainqu**ant** | convain**cant** |

書き取りで問われる細かい点です。
:::
:::

## 4. ジェロンディフ — en + 現在分詞

**en を付けると、機能がまったく変わります。**

| | 修飾するもの |
|---|---|
| **現在分詞** | **名詞**（形容詞のように働く） |
| **ジェロンディフ** | **動詞**（副詞のように働く） |

:::ex 現在分詞とジェロンディフ
J'ai vu une femme chantant. | ジェ・ヴュ・ユヌ・ファム・シャンタン | 歌っている女性を見た。（女性が歌っている）
J'ai vu une femme en chantant. | ジェ・ヴュ・ユヌ・ファム・アン・シャンタン | 歌いながら女性を見た。（私が歌っている）
:::

**この2文は意味がまったく違います。** en があるかないかで、**誰が歌っているのかが変わります**。

:::warn ジェロンディフの主語は必ず主節の主語
これが決定的な規則です。

- **現在分詞** … 直前の名詞を修飾する（主語は文脈による）
- **ジェロンディフ** … **必ず主節の主語と同じ**

章のタイトルを見てみましょう。

[[Je regarde une chanteuse en pleurant.\|ジュ・ルガルド・ユヌ・シャントゥーズ・アン・プルラン\|私は泣きながら女性歌手を見つめる。]]

**泣いているのは「私」**です。歌手ではありません。歌手が泣いているなら、現在分詞を使います。

[[Je regarde une chanteuse pleurant.\|ジュ・ルガルド・ユヌ・シャントゥーズ・プルラン\|私は泣いている女性歌手を見つめる。]]

**en があるかないかで、泣いている人が入れ替わる** ——これがこの章の核心です。
:::

:::deep ジェロンディフの4つの用法

**（1）同時性 — 〜しながら**

[[Il mange en regardant la télé.\|イル・マンジュ・アン・ルガルダン・ラ・テレ\|彼はテレビを見ながら食べる。]]
[[Elle chante en travaillant.\|エル・シャン・タン・トラヴァイヤン\|彼女は働きながら歌う。]]

**（2）手段 — 〜することによって**

[[C'est en forgeant qu'on devient forgeron.\|セ・タン・フォルジャン・コン・ドゥヴィアン・フォルジュロン\|鍛冶をすることで鍛冶屋になる。]]（諺：習うより慣れよ）
[[On apprend en pratiquant.\|オ・ナプラン・タン・プラティカン\|実践することで学ぶ。]]

**（3）条件 — 〜すれば**

[[En travaillant, tu réussiras.\|アン・トラヴァイヤン・テュ・レユスィラ\|働けば成功するだろう。]]

**（4）対立 — 〜にもかかわらず**（tout を添える）

[[Tout en sachant la vérité, il n'a rien dit.\|トゥ・タン・サシャン・ラ・ヴェリテ\|真実を知っていながら、彼は何も言わなかった。]]

**tout en + 現在分詞**で、譲歩の意味がはっきりします。
:::

:::note 諺 C'est en forgeant qu'on devient forgeron
第22章の強調構文（c'est … que）と、この章のジェロンディフを組み合わせた形です。「鍛冶をすることによってこそ、人は鍛冶屋になる」——日本語の「習うより慣れよ」にあたる有名な諺で、**手段のジェロンディフ**の典型例としてよく引かれます。
:::

## 5. 3つを並べて確認する

:::note -ant の3つの顔
| | 形 | 修飾するもの | 一致 |
|---|---|---|---|
| **形容詞的分詞** | chantant | 名詞（性質） | **する** |
| **現在分詞** | chantant | 名詞（動作） | しない |
| **ジェロンディフ** | **en** chantant | 動詞（主語と同一） | しない |

:::ex 3つを並べる
une chanson amusante | ユヌ・シャンソン・アミュザント | 愉快な歌（形容詞 → 一致）
une femme chantant une chanson | ユヌ・ファム・シャンタン・チュヌ・シャンソン | 歌を歌っている女性（現在分詞 → 一致しない）
Elle marche en chantant. | エル・マルシュ・アン・シャンタン | 彼女は歌いながら歩く。（ジェロンディフ → 主語＝彼女）
:::

**判定の手順**
1. **en が付いている** → ジェロンディフ（主語は主節と同じ）
2. en なし、**目的語を取っている** → 現在分詞
3. en なし、目的語なし、**性数一致している** → 形容詞
:::

## 6. en の3つの用法（第25章の復習）

:::warn ジェロンディフの en は代名詞ではない
第25章で3つの en を区別しました。ここで確認します。

| | 例 | 位置 |
|---|---|---|
| **代名詞の en** | [[J'en veux.\|ジャン・ヴ\|それが欲しい]] | 動詞の前 |
| **前置詞の en** | [[en France\|アン・フランス\|フランスで]] | 名詞の前 |
| **ジェロンディフの en** | [[en chantant\|アン・シャンタン\|歌いながら]] | **-ant の前** |

**-ant で終わる語の前にあれば、ジェロンディフの en** です。
:::

## 7. 分詞構文と英語の比較

:::adv 英語の -ing との違い
英語の -ing 形は、現在分詞・動名詞・進行形の3つを兼ねています。フランス語では役割が分かれます。

| 英語 | フランス語 |
|---|---|
| I am **singing**.（進行形） | Je chante.（**単純な現在形**、第8章） |
| a woman **singing**（現在分詞） | une femme **chantant** |
| **while singing**（〜しながら） | **en chantant**（ジェロンディフ） |
| **Singing** is fun.（動名詞） | **Chanter** est amusant.（**不定詞**） |

**とくに注意すべき2点**
1. **進行形はない** … 英語の be + -ing にあたる活用はなく、単純な現在形で表す（強調したいときだけ être en train de）
2. **動名詞は不定詞** … 「歌うこと」は chantant ではなく **chanter**（不定詞）

× Chantant est amusant. は誤りです。○ **Chanter est amusant.**

英語話者が最も間違えるのがこの2点です。
:::

## 練習問題

:::quiz
Q. 現在分詞はどう作りますか。例外は何ですか。
A. **nous の現在形から -ons を取って -ant を付ける**（半過去と同じ語幹）。例外は **être → étant、avoir → ayant、savoir → sachant** の3つだけ。

Q. J'ai vu une femme chantant. と J'ai vu une femme en chantant. は、どう違いますか。
A. 前者は**女性が歌っている**（現在分詞が直前の名詞を修飾）。後者は**私が歌っている**（ジェロンディフの主語は必ず主節の主語）。en の有無で、歌っている人が入れ替わる。

Q. une histoire intéressante と une femme chantant une chanson で、なぜ一方だけ一致するのですか。
A. intéressante は**形容詞的分詞**で性質を表すので一致する。chantant は**現在分詞**で動作を表し、動詞としての性質を保っているので一致しない。目的語（une chanson）を取っていることが現在分詞である証拠。

Q. ジェロンディフの主語は誰ですか。
A. **必ず主節の主語と同じ**。これがジェロンディフの決定的な規則で、現在分詞（直前の名詞を修飾する）との違いを生んでいる。

ここまで学んできた時制は、すべて**直説法**（l'indicatif）に属していました。現在・複合過去・半過去・単純未来・大過去・前未来・単純過去——12個の時制のうち7個です。

**「そうである／そうだった／そうなるだろう」と、事実として提示する法**です。ここまでの章で扱ってきた時制のほとんどがこれに属します。

- 直説法現在（第8章）
- 複合過去（第20章）／ 大過去（第27.5章）
- 半過去（第27章）
- 単純未来（第24章）／ 前未来（第24章）
- 単純過去（第20.5章）／ 前過去（第27.5章）

**フランス語の文の大半は直説法**です。他の3つの法は、特定の条件下でだけ現れます。

### 条件法（le conditionnel）— 仮定と距離の法

**「もし〜なら、こうなるだろうに」と、現実から距離を置いて述べる法**です。

- **過去**の要素 … 現在から切り離されていること

3. **伝聞・推測**：Il serait malade.（彼は病気らしい）

**事実として述べるのではなく、「話し手の頭の中にある事柄」として述べる法**です。

- 感情（être content que, avoir peur que）
- 疑い・否定（douter que, ne pas croire que）
- 必要（il faut que）
- 特定の接続詞（bien que, pour que, avant que, à moins que）

### 命令法（l'impératif）— 働きかけの法

**相手に行為を促す法**です。第16章で扱いました。主語を置かない唯一の法で、tu / nous / vous の3形しかありません。

## 練習問題

:::quiz
Q. 時制と法は、それぞれ何を表しますか。
A. **時制**は「いつ」の話かを表す（現在・過去・未来）。**法**は話し手がその内容をどう扱っているかを表す（事実／仮定／願望）。同じ内容でも、話し手の態度で法が変わる。

Q. フランス語には法がいくつありますか。
A. 4つ。**直説法**（事実として述べる）、**条件法**（仮定・推測・語調緩和）、**接続法**（主観・不確実・願望）、**命令法**（命令・依頼）。文の大半は直説法で、他は特定の条件下でだけ現れる。

Q. 条件法が「未来語幹 + 半過去の語尾」でできていることは、その機能とどう関係しますか。
A. 未来の要素が「これから起きること」、過去の要素が「現在から切り離されていること」を担い、合わせて「現在から切り離された未来」＝仮定になる。第27.6章の「過去における未来」も同じ構造から出ている。

Q. Je pense qu'il vient. と Je ne pense pas qu'il vienne. で、なぜ法が違うのですか。
A. 肯定では話し手が「彼が来る」を事実として扱っているので直説法。否定では事実性が揺らぐので接続法になる。**主節の動詞がその内容を事実として扱っているか**で、従属節の法が決まる。

Q. 接続法が使われる場所には、どんな特徴がありますか。
A. **ほぼ従属節（que 節）の中でしか使われない**。主節の動詞や接続詞が接続法を要求する形になっている（vouloir que, douter que, il faut que, bien que, pour que など）。

Q. 会話で避けて通れない法・時制は何ですか。
A. 直説法の現在・複合過去・半過去・単純未来に加えて、**条件法現在**（Je voudrais…）と**接続法現在**（Il faut que…）。この2つは日常表現に組み込まれているため、避けられない。
:::

| **② 現在の反実** | **半過去** | **条件法現在** | もし〜なら、〜なのに |
| **③ 過去の反実** | **大過去** | **条件法過去** | もし〜だったら、〜だったのに |

:::

Tu ne devrais pas fumer. | テュ・ヌ・ドゥヴレ・パ・フュメ | タバコは吸わないほうがいい。
:::

**直説法との対比**

| 直説法 | 条件法 |
|---|---|
| [[Je veux un café.\|ジュ・ヴ・アン・カフェ]] コーヒーが欲しい（ぶっきらぼう） | [[Je voudrais un café.\|ジュ・ヴドレ・アン・カフェ]] コーヒーをお願いします（丁寧） |
| [[Pouvez-vous …\|プヴェ・ヴー]] できますか | [[Pourriez-vous …\|プリエ・ヴー]] していただけますか（丁寧） |
| [[Vous devez …\|ヴー・ドゥヴェ]] 〜すべきだ（義務） | [[Vous devriez …\|ヴー・ドゥヴリエ]] 〜されたほうがいい（助言） |

**Je voudrais は、カフェ・店・窓口で必ず使う表現**です。Je veux では子どもっぽく、場合によっては失礼に響きます。

なぜ条件法が丁寧になるのか——**「もし可能でしたら」という仮定が隠れている**と考えると分かりやすくなります。断定を避けることで、相手に断る余地を残しているのです。第27章で半過去にも同じ用法があったのと同じ原理です。

### （2）伝聞・未確認情報

**報道で多用されます。** 「〜らしい」「〜とみられる」。

:::ex 伝聞の条件法
Il y aurait dix blessés. | イ・リ・オレ・ディ・ブレセ | 負傷者は10人とみられる。
Le président serait malade. | ル・プレズィダン・スレ・マラード | 大統領は病気らしい。
L'accident aurait fait trois morts. | ラクスィダン・オレ・フェ・トロワ・モール | 事故で3人が死亡した模様だ。
:::

**裏が取れていない情報**であることを、条件法で示します。フランスの新聞・ニュースを読むときに必ず出会う用法です。日本語の「〜という」「〜もよう」にあたります。

### （3）過去における未来（第27.6章）

[[Il a dit qu'il viendrait.\|イラ・ディ・キル・ヴィアンドレ\|彼は来ると言った。]]

仮定の意味はなく、時制の一致による形です。
:::

## 5. 「もしぼくが鳥だったら」

章のタイトルは、②のパターン（現在の反実）です。

:::ex もしぼくが鳥だったら
Si j'étais un oiseau, je volerais vers toi. | スィ・ジェテ・ザン・ノワゾー・ジュ・ヴォルレ・ヴェール・トワ | もしぼくが鳥だったら、君のところへ飛んでいくのに。
Si j'étais riche, j'achèterais une maison. | スィ・ジェテ・リッシュ・ジャシェトレ・ユヌ・メゾン | 金持ちだったら、家を買うのに。
Si tu étais là, je serais heureux. | スィ・テュ・エテ・ラ・ジュ・スレ・ズルー | 君がいてくれたら、幸せなのに。
À ta place, je ne dirais rien. | ア・タ・プラス・ジュ・ヌ・ディレ・リアン | 君の立場なら、何も言わないだろうな。
:::

最後の文のように、**si 節を使わずに条件を示す**こともできます（à ta place ＝君の立場なら）。条件法だけで仮定の文脈が伝わります。

## 6. 活用ドリル

:::drill chanter,finir,être,avoir,aller,faire,venir,voir,pouvoir,vouloir,devoir,savoir conditionnel

:::note 単純未来と混ぜて練習する
条件法だけを練習すると、単純未来との区別が身につきません。両方を混ぜたドリルも試してください。

:::drill être,avoir,aller,faire,pouvoir,vouloir futur,conditionnel
:::

## 練習問題

:::quiz
Q. 条件法現在はどう作りますか。
A. **未来語幹 ＋ 半過去の語尾**。第24章で覚えた未来語幹（ser-, aur-, ir-, fer-, pourr-, voudr- …）がそのまま使えるので、新しく覚える活用はない。

Q. si 構文の3つのパターンを挙げてください。
A. ①si + **直説法現在** / 主節 **単純未来**（実現しうる）、②si + **半過去** / 主節 **条件法現在**（現在の反実）、③si + **大過去** / 主節 **条件法過去**（過去の反実）。

Q. Si j'aurais le temps, je viendrais. はなぜ誤りですか。
A. **si 節には条件法・未来形を置かない**ため。正しくは Si j'**avais** le temps, je viendrais. 条件法が現れるのは主節のほう。フランスでは「si は rais を好まない」という語呂で教えられる。

Q. Je veux un café. と Je voudrais un café. の違いは何ですか。
A. 前者は直説法で「コーヒーが欲しい」とぶっきらぼう。後者は条件法で「コーヒーをお願いします」と丁寧。条件法は「もし可能でしたら」という仮定を含ませることで断定を避け、相手に断る余地を残す。店や窓口では Je voudrais が標準。

Q. Il y aurait dix blessés. はどういう意味ですか。
A. 「負傷者は10人とみられる」。**伝聞・未確認情報**を表す条件法で、報道で多用される。裏が取れていないことを条件法で示す、日本語の「〜もよう」にあたる用法。

Q. je chanterai と je chanterais は、どう見分けますか。
A. 綴りは s 1文字差、発音も現代ではほぼ同音。判断は文脈による——si 節があるか、丁寧な依頼か（→条件法）、単なる予定・予測か（→単純未来）。書き取りで最も間違えやすい対立。
:::

  sub: 'あなたが幸せであることを、願っています',
  body: `
{lead}最後の章です。接続法（le subjonctif）は、フランス語文法で最も敬遠される項目ですが、**作り方は半過去と同じくらい単純**です。

難しいのは「**いつ使うのか**」。第29½章で見たとおり、接続法は**話し手が事実として扱っていない内容**に使われます。そして**ほぼ従属節（que 節）の中でしか現れません**。

つまり覚えるべきは、**どんな主節が接続法を要求するか**のリストです。この章ではそれを体系的に整理します。

## 1. 作り方 — ils の現在形から

**第13章「①直説法現在」から出る枝の2本目です。**

1. **ils の現在形**を出す
2. **-ent を取って**、接続法の語尾を付ける

| 人称 | 語尾 |
|---|---|
| que je | **-e** |
| que tu | **-es** |
| qu'il | **-e** |
| que nous | **-ions** |
| que vous | **-iez** |
| qu'ils | **-ent** |

:::conj chanter subjonctif

| 動詞 | ils の現在形 | 語幹 | que je |
|---|---|---|---|
| chanter | ils chant**ent** | chant- | que je chante |
| finir | ils finiss**ent** | finiss- | que je finisse |
| partir | ils part**ent** | part- | que je parte |
| écrire | ils écriv**ent** | écriv- | que j'écrive |
| prendre | ils prenn**ent** | prenn- | que je prenne |

:::warn nous と vous だけは半過去と同じ語幹
接続法には**2つの語幹**があります。

- **je / tu / il / ils** … ils の現在形から
- **nous / vous** … **nous の現在形から**（＝半過去と同じ語幹）

:::conj prendre subjonctif

prendre では、**prenn-**（単数・3複）と **pren-**（nous, vous）に分かれます。

| 人称 | 形 | 語幹 |
|---|---|---|
| que je | prenne | prenn- |
| que nous | prenions | pren- |
| que vous | preniez | pren- |
| qu'ils | prennent | prenn- |

第13章で見た「語幹が2つに割れる動詞」（boire, venir, devoir, recevoir …）は、接続法でも同じ2つの語幹を使い分けます。

**規則動詞では2つの語幹が一致する**ので、この区別は意識しなくて済みます（chanter は両方 chant-）。
:::

:::note nous / vous の形は半過去と同じ綴りになる
que nous chant**ions** / que vous chant**iez** —— これは**半過去の nous / vous とまったく同じ綴り**です。

- 半過去：nous chantions（私たちは歌っていた）
- 接続法：que nous chantions（私たちが歌うこと）

区別は **que があるかどうか**と文脈です。偶然の一致ではなく、どちらも「nous の現在形 − ons」を語幹にしているためです。
:::

### 不規則な接続法

:::deep 覚えるべき不規則形

**（1）完全に不規則な2つ**

:::conj être subjonctif

:::conj avoir subjonctif

être（sois, sois, soit, soyons, soyez, soient）と avoir（aie, aies, ait, ayons, ayez, aient）は、第16章の命令形と同じ形です。命令形がこの2語で接続法を借りていたことが、ここで説明されます。

**（2）語幹が独自の6つ**

| 動詞 | 接続法の語幹 | que je | que nous |
|---|---|---|---|
| **faire** | fass- | que je fasse | que nous fassions |
| **pouvoir** | puiss- | que je puisse | que nous puissions |
| **savoir** | sach- | que je sache | que nous sachions |
| **falloir** | faill- | — | qu'il faille |
| **pleuvoir** | pleuv- | — | qu'il pleuve |
| **valoir** | vaill- | — | qu'il vaille |

この6つは **nous / vous も同じ語幹**を使います（que nous fassions）。

:::conj faire subjonctif

:::conj pouvoir subjonctif

**（3）2つの語幹を持つ不規則動詞**

| 動詞 | 単数・3複 | nous / vous |
|---|---|---|
| **aller** | aill- | all- |
| **vouloir** | veuill- | voul- |
| **venir** | vienn- | ven- |
| **boire** | boiv- | buv- |
| **prendre** | prenn- | pren- |
| **devoir** | doiv- | dev- |
| **recevoir** | reçoiv- | recev- |
| **voir** | voi- | voy- |

:::conj aller subjonctif

:::conj vouloir subjonctif

**規則から外れるのは実質 être, avoir, faire, pouvoir, savoir, aller, vouloir の7語**です。残りは「ils の現在形 − ent」で必ず作れます。
:::

## 2. 接続法過去

**助動詞の接続法現在 ＋ 過去分詞**。第13章の複合時制の5本目、これで全部そろいます。

:::conj chanter subjonctif,subjonctifPasse

意味は「（主節の時点より）**前に完了していること**」です。

:::ex 接続法現在と接続法過去
Je suis content qu'il vienne. | ジュ・スュイ・コンタン・キル・ヴィエンヌ | 彼が来ることが嬉しい。（これから来る）
Je suis content qu'il soit venu. | ジュ・スュイ・コンタン・キル・ソワ・ヴニュ | 彼が来たことが嬉しい。（すでに来た）
:::

## 3. 接続法を要求するもの — 4つのグループ

:::deep どんなときに接続法を使うか

### （1）意志・願望・命令

**主語が「そうあってほしい」と望んでいる**——まだ実現していないので事実ではありません。

| 動詞 | 意味 |
|---|---|
| [[vouloir que\|ヴロワール・ク]] | 〜してほしい |
| [[désirer que\|デズィレ・ク]] | 〜を望む |
| [[souhaiter que\|スエテ・ク]] | 〜を願う |
| [[préférer que\|プレフェレ・ク]] | 〜のほうがよい |
| [[demander que\|ドゥマンデ・ク]] | 〜するよう求める |
| [[ordonner que\|オルドネ・ク]] | 〜するよう命じる |
| [[interdire que\|アンテルディール・ク]] | 〜を禁じる |

:::ex 意志・願望
Je veux que tu viennes. | ジュ・ヴ・ク・テュ・ヴィエンヌ | 君に来てほしい。
Je souhaite que vous soyez heureux. | ジュ・スエット・ク・ヴー・ソワイエ・ズルー | あなたが幸せであることを願っています。
Elle préfère que nous partions tôt. | エル・プレフェール・ク・ヌー・パルティオン・ト | 彼女は私たちが早く出発するほうがよいと思っている。
:::

章のタイトルがこれです。**Je souhaite que vous soyez heureux.** ——soyez は être の接続法です。

:::warn espérer は直説法を取る
**願望を表すのに接続法を取らない**、有名な例外です。

- ○ [[J'espère qu'il viendra.\|ジェスペール・キル・ヴィアンドラ\|彼が来ることを期待している。]]（直説法・単純未来）
- × J'espère qu'il vienne.

espérer は「そうなると見込んでいる」＝話し手が**実現を事実として想定している**ため直説法になる、と説明されます。vouloir（意志）との違いです。

ただし**否定・疑問にすると接続法**になります：[[Je n'espère pas qu'il vienne.\|ジュ・ネスペール・パ・キル・ヴィエンヌ]]
:::

### （2）感情

**主語の主観的な反応**を述べるもの。内容の真偽ではなく、それに対する感情が焦点です。

| 表現 | 意味 |
|---|---|
| [[être content que\|エートル・コンタン・ク]] | 〜が嬉しい |
| [[être heureux que\|エートル・ウルー・ク]] | 〜が幸せだ |
| [[être triste que\|エートル・トリスト・ク]] | 〜が悲しい |
| [[être surpris que\|エートル・スュルプリ・ク]] | 〜に驚く |
| [[avoir peur que\|アヴォワール・プール・ク]] | 〜を恐れる |
| [[regretter que\|ルグレテ・ク]] | 〜を残念に思う |
| [[il est dommage que\|イ・レ・ドマージュ・ク]] | 〜は残念だ |

:::ex 感情
Je suis content que tu sois là. | ジュ・スュイ・コンタン・ク・テュ・ソワ・ラ | 君がいてくれて嬉しい。
J'ai peur qu'il ne soit malade. | ジェ・プール・キル・ヌ・ソワ・マラード | 彼が病気ではないかと心配だ。
C'est dommage qu'elle ne puisse pas venir. | セ・ドマージュ・ケル・ヌ・ピュイス・パ・ヴニール | 彼女が来られないのは残念だ。
:::

**avoir peur que には虚辞の ne**（第5章）が入ります。J'ai peur qu'il **ne** soit malade. の ne に否定の意味はありません。

### （3）疑い・否定・可能性

**事実性が揺らいでいる**もの。

| 表現 | 意味 |
|---|---|
| [[douter que\|ドゥテ・ク]] | 〜を疑う |
| [[ne pas croire que\|ヌ・パ・クロワール・ク]] | 〜だと思わない |
| [[ne pas penser que\|ヌ・パ・パンセ・ク]] | 〜だと思わない |
| [[il est possible que\|イ・レ・ポスィブル・ク]] | 〜かもしれない |
| [[il se peut que\|イル・ス・プ・ク]] | 〜の可能性がある |
| [[il semble que\|イル・サンブル・ク]] | 〜のようだ |

:::ex 疑い・否定
Je doute qu'il vienne. | ジュ・ドゥット・キル・ヴィエンヌ | 彼が来るとは思えない。
Je ne crois pas qu'il ait raison. | ジュ・ヌ・クロワ・パ・キ・レ・レゾン | 彼が正しいとは思わない。
Il est possible qu'il pleuve. | イ・レ・ポスィブル・キル・プルーヴ | 雨が降るかもしれない。
:::

:::warn croire / penser は肯定と否定で法が変わる
第29½章で見た対立です。

- [[Je crois qu'il vient.\|ジュ・クロワ・キル・ヴィアン\|彼は来ると思う。]]（直説法）
- [[Je ne crois pas qu'il vienne.\|ジュ・ヌ・クロワ・パ・キル・ヴィエンヌ\|彼が来るとは思わない。]]（接続法）

肯定では話し手が事実として扱い、否定では事実性が揺らぐためです。疑問文でも接続法になりやすくなります。

**il est certain que**（〜は確実だ）は直説法、**il est possible que**（〜かもしれない）は接続法——**確実性の度合いが法を決めています**。

| 表現 | 法 |
|---|---|
| il est certain / sûr / évident que | **直説法** |
| il est probable que（ありそうだ） | **直説法** |
| il est possible que（かもしれない） | **接続法** |
| il est peu probable que（ありそうにない） | **接続法** |

**probable は直説法、possible は接続法** ——確実性の線引きがここにあります。
:::

### （4）必要・判断

| 表現 | 意味 |
|---|---|
| [[il faut que\|イル・フォ・ク]] | 〜しなければならない |
| [[il est nécessaire que\|イ・レ・ネセセール・ク]] | 〜が必要だ |
| [[il est important que\|イ・レ・タンポルタン・ク]] | 〜が重要だ |
| [[il vaut mieux que\|イル・ヴォ・ミュー・ク]] | 〜したほうがよい |
| [[il est normal que\|イ・レ・ノルマル・ク]] | 〜は当然だ |

:::ex 必要・判断
Il faut que tu partes. | イル・フォ・ク・テュ・パルト | 君は出発しなければならない。
Il vaut mieux que nous restions. | イル・ヴォ・ミュー・ク・ヌー・レスティオン | 私たちは残ったほうがいい。
Il est important que vous compreniez. | イ・レ・タンポルタン・ク・ヴー・コンプルニエ | あなたが理解することが大切です。
:::

**il faut que は日常会話で頻出**です。第15章で扱った il faut + 不定詞（一般論）と違い、**行為者を特定するときは que + 接続法**になります。
:::

## 4. 接続法を要求する接続詞

**特定の接続詞の後では、必ず接続法になります。**

| 接続詞 | 意味 |
|---|---|
| **bien que / quoique** | 〜にもかかわらず |
| **pour que / afin que** | 〜するために |
| **avant que** | 〜する前に |
| **jusqu'à ce que** | 〜するまで |
| **à moins que** | 〜でない限り |
| **sans que** | 〜することなく |
| **pourvu que** | 〜でありさえすれば |
| **de peur que / de crainte que** | 〜しないように |

:::ex 接続詞 + 接続法
Bien qu'il soit malade, il travaille. | ビアン・キル・ソワ・マラード・イル・トラヴァイユ | 病気なのに、彼は働いている。
Je t'explique pour que tu comprennes. | ジュ・テクスプリック・プール・ク・テュ・コンプレンヌ | 分かるように説明します。
Partons avant qu'il ne pleuve. | パルトン・ザヴァン・キル・ヌ・プルーヴ | 雨が降る前に出発しよう。
Attends jusqu'à ce que je revienne. | アタン・ジュスカ・ス・ク・ジュ・ルヴィエンヌ | 私が戻るまで待って。
:::

:::warn après que は直説法（規範上）
**avant que は接続法、après que は直説法** ——対になっているのに法が違います。

- avant qu'il **vienne**（接続法）… まだ来ていない＝不確実
- après qu'il **est venu**（直説法）… すでに来た＝事実

**時間的な前後が、事実性の違いを生んでいます。**

ただし**現実には après que にも接続法を使う話者が多く**、規範と実態がずれている代表例です。試験では直説法で答えてください。

なお **avant que / à moins que / de peur que には虚辞の ne** が入ることがあります（第5章）。否定の意味はありません。
:::

## 5. que 節を避ける — 不定詞にする

:::note 主語が同じなら不定詞を使う
**主節と従属節の主語が同じ場合、接続法ではなく不定詞を使います。**

| | 例 |
|---|---|
| 主語が違う | [[Je veux que tu partes.\|ジュ・ヴ・ク・テュ・パルト\|君に出発してほしい。]] |
| 主語が同じ | [[Je veux partir.\|ジュ・ヴ・パルティール\|私は出発したい。]] |

× Je veux que je parte. とは言いません。

同じ規則が接続詞にも適用されます。

| 接続詞（+ 接続法） | 前置詞（+ 不定詞） |
|---|---|
| pour que | **pour** |
| avant que | **avant de** |
| à moins que | **à moins de** |
| sans que | **sans** |
| afin que | **afin de** |

- [[Je travaille pour que ma famille vive bien.\|プール・ク・マ・ファミーユ・ヴィーヴ・ビアン\|家族が良い暮らしをするために働く。]]（主語が違う）
- [[Je travaille pour vivre.\|ジュ・トラヴァイユ・プール・ヴィーヴル\|生きるために働く。]]（主語が同じ）

**接続法は「主語が違うとき」に必要になる** ——この視点で見ると、使う場面がかなり絞られます。

ただし **bien que には対応する前置詞がない**ので、主語が同じでも接続法を使います（Bien qu'il soit fatigué, il travaille.）。
:::

## 6. 文語の接続法 — 半過去と大過去

:::adv 読解のために知っておく
接続法には、現代語で使われない2つの時制があります。

**接続法半過去**（l'imparfait du subjonctif）… 単純過去の語幹から作る
**接続法大過去**（le plus-que-parfait du subjonctif）… 助動詞の接続法半過去 + 過去分詞

[[Je voulais qu'il **vînt**.\|ジュ・ヴレ・キル・ヴァン\|彼に来てほしかった。]]（接続法半過去）
[[Il eût fallu qu'il **fût** venu.\|イル・ウ・ファリュ・キル・フュ・ヴニュ\|彼が来ていなければならなかっただろう。]]（接続法大過去）

**19世紀までの文学と、ごく formal な文書にしか現れません。** 現代語では、主節が過去でも**接続法現在**を使います。

- 文語：Je voulais qu'il vînt.
- 現代：[[Je voulais qu'il vienne.\|ジュ・ヴレ・キル・ヴィエンヌ\|彼に来てほしかった。]]

**接続法には時制の一致がない**、と理解しておけば十分です。第27.6章の時制の一致は、直説法にだけ適用されます。

第20.5章で述べたとおり、接続法半過去は単純過去の語幹から作られるため、**単純過去の衰退と運命を共にしました**。この2つの時制はセットで消えつつあります。
:::

## 7. 決まり文句の接続法

:::adv 主節なしで現れる接続法
慣用表現として、que 節が単独で使われることがあります。

[[Vive la France !\|ヴィーヴ・ラ・フランス\|フランス万歳！]]
[[Qu'il vienne !\|キル・ヴィエンヌ\|彼を来させろ！／彼が来ればいい！]]
[[Que Dieu vous bénisse.\|ク・ディュ・ヴー・ベニス\|神のご加護がありますように。]]
[[Ainsi soit-il.\|アンスィ・ソワ・ティル\|アーメン（そうでありますように）。]]
[[Sauve qui peut !\|ソーヴ・キ・プ\|逃げられる者は逃げろ！]]

**Vive …!** は「〜万歳」の定型で、Vive les vacances !（休暇万歳）のように応用できます。もともとは Que … vive（〜が生きますように）から que が落ちた形です。

3人称への命令は命令法では表せない（第16章では tu / nous / vous の3形しかなかった）ため、**接続法が命令法の代わり**を務めています。
:::

## 8. 活用ドリル

:::drill chanter,finir,prendre,être,avoir,aller,faire,venir,pouvoir,vouloir,savoir subjonctif

:::note 語幹の作り方を確認する
出題された動詞について、まず **ils の現在形**を思い浮かべてください。そこから -ent を取れば語幹です。

不規則なのは être, avoir, faire, pouvoir, savoir, aller, vouloir の7語だけ。残りは規則どおりに作れます。
:::

## 練習問題

:::quiz
Q. 接続法現在の語幹はどう作りますか。例外はどこですか。
A. **ils の現在形から -ent を取る**。ただし **nous / vous だけは nous の現在形から**（半過去と同じ語幹）作る。2つの語幹が分かれるのは、単数・3複で語幹が変わる動詞（prendre, boire, venir …）の場合だけで、規則動詞では一致する。

Q. J'espère qu'il vienne. はなぜ誤りですか。
A. espérer は願望を表すのに**直説法**を取るため。正しくは J'espère qu'il **viendra**. 「そうなると見込んでいる」＝実現を事実として想定しているためと説明される。ただし否定・疑問にすると接続法になる。

Q. Je crois qu'il vient. と Je ne crois pas qu'il vienne. で、なぜ法が違うのですか。
A. 肯定では話し手が事実として扱うので直説法、否定では事実性が揺らぐので接続法。同じ原理で、il est probable que は直説法、il est possible que は接続法になる。**確実性の度合いが法を決めている**。

Q. avant que と après que で、法が違うのはなぜですか。
A. avant que は「まだ起きていない」＝不確実なので接続法。après que は「すでに起きた」＝事実なので直説法。時間的な前後が事実性の違いを生んでいる。ただし現実には après que にも接続法を使う話者が多く、規範と実態がずれている。

Q. Je veux que je parte. はなぜ誤りですか。
A. 主節と従属節の主語が同じ場合は、que 節ではなく**不定詞**を使うため。正しくは **Je veux partir.** 同じ規則が接続詞にも適用され、pour que → pour、avant que → avant de のように前置詞に変わる。接続法が必要になるのは主語が違うときだけ。

Q. Je voulais qu'il vienne. は、主節が過去なのになぜ接続法現在なのですか。
A. **接続法には時制の一致がない**ため。第27.6章の時制の一致は直説法にだけ適用される。文語では接続法半過去（qu'il vînt）を使ったが、単純過去の衰退とともに現代語では使われなくなり、主節が過去でも接続法現在を使う。
:::
