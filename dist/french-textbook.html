原理は1つです。

> **話し手がその内容を「事実」として提示するなら直説法、「まだ事実でないもの・頭の中のもの」として提示するなら接続法。**

原因（parce que）は事実だから直説法。目的（pour que）はこれから実現させたいことだから接続法。譲歩（bien que）は「そうであっても」と一度括弧に入れるから接続法。——この見方が通ると、覚える量が大幅に減ります。

この章では、まず接続詞を等位と従位に分け、次に**意味のカテゴリごとに、どの接続詞がどの法を取るか**を網羅した表を作ります。この教材の文法編を締めくくる章です。

## 1. 2種類の接続詞

| 種類 | 働き | 例 |
|---|---|---|
| **等位接続詞**（coordination） | 対等なもの同士をつなぐ | et, mais, ou, donc, car, ni, or |
| **従位接続詞**（subordination） | 従属節を主節につなぐ | que, quand, parce que, bien que … |

等位接続詞は語と語、句と句、節と節を**対等に**並べます。従位接続詞は、節を**主節の一部品**（時の情報、原因の情報など）として組み込みます。

:::note 見分け方 — 節を前に出せるか
従属節は主節の外に出せますが、等位接続された節は動かせません。

- ○ **Parce qu'il pleut**, je reste.（雨が降っているので、私は残る）→ 前に出せる＝従属節
- × **Car il pleut**, je reste.（car の節は前に出せない）→ 等位

**car と parce que は意味が近いのに文法上の身分が違う**——この違いは§2で扱います。
:::

## 2. 等位接続詞 — 7つで全部

フランス語の等位接続詞は**7つ**しかありません。頭文字を並べた記憶術が有名です。

> **Mais où est donc Ornicar ?**（それでオルニカールはどこにいるの？）
> = **mais, ou, et, donc, or, ni, car**

| 接続詞 | 意味 | 例 |
|---|---|---|
| **et** | そして | Marie **et** Paul |
| **ou** | または | café **ou** thé |
| **mais** | しかし | petit **mais** fort |
| **donc** | だから | Je pense, **donc** je suis. |
| **car** | というのは（理由） | Il reste, **car** il pleut. |
| **or** | ところで（論証の転換） | **Or**, tous les hommes sont mortels. |
| **ni** | 〜も〜も（否定） | **ni** l'un **ni** l'autre |

:::ex 等位接続詞
Je voudrais du café et un croissant. | ジュ・ヴドレ・デュ・カフェ・エ・アン・クロワッサン | コーヒーとクロワッサンをください。
Il est fatigué, mais il continue. | イ・レ・ファティゲ・メ・ジル・コンティニュ | 彼は疲れているが、続けている。
Je pense, donc je suis. | ジュ・パンス・ドン・ジュ・スュイ | われ思う、ゆえにわれあり。
Il ne boit ni vin ni bière. | イル・ヌ・ボワ・ニ・ヴァン・ニ・ビエール | 彼はワインもビールも飲まない。
Tous les hommes sont mortels ; or Socrate est un homme. | トゥ・レ・ゾム・ソン・モルテル・オール・ソクラット・エ・タン・ノム | 人はみな死ぬ。ところでソクラテスは人である。
:::

:::warn ni の使い方 — ne との呼応
**ni は必ず ne とセット**で使い、**pas は付けません**。

- ○ Il **ne** boit **ni** vin **ni** bière.
- × Il ne boit pas ni vin ni bière.

また ni の後の名詞は**無冠詞**になります（部分冠詞・不定冠詞が消える）。定冠詞は残ります。

- Je bois du vin et de la bière. → Je ne bois **ni** vin **ni** bière.
- J'aime le vin et la bière. → Je n'aime **ni le** vin **ni la** bière.

これは否定文で du / de la / des が de に変わるのと同じ原理で、**不定の量を表す冠詞は否定の中で消える**からです（第2章・第5章）。

主語で使うときは ni … ni … が主語になり、動詞は複数が原則です：**Ni** Paul **ni** Marie **ne sont** venus.
:::

:::deep car と parce que — 同じ「なぜなら」の違い
両方とも理由を表しますが、身分と使い方が違います。

| | car（等位） | parce que（従位） |
|---|---|---|
| 文頭に置けるか | **置けない** | **置ける**（Parce qu'il pleut, …） |
| 疑問への答えになるか | ならない | **なる**（Pourquoi ? — Parce que …） |
| 文体 | やや書き言葉 | 中立 |
| 表すもの | **話し手の判断の根拠** | **出来事の原因** |

最後の行が本質です。

- Il est malade, **car** il n'est pas venu.（来なかったのだから、彼は病気なのだろう）→ **私がそう判断する根拠**
- Il n'est pas venu **parce qu'**il est malade.（病気だから来なかった）→ **出来事の原因**

car の節は「なぜそう言えるのか」を説明し、parce que の節は「なぜそうなったのか」を説明します。英語の *for* と *because* の違いに対応します。
:::

### 等位接続詞に似た副詞

**cependant, pourtant, néanmoins, ainsi, d'ailleurs, en effet, par conséquent, toutefois** などは意味の上では接続詞のようですが、**文法上は副詞**です。したがって位置が自由で、文中に挿入できます。

:::ex 接続副詞
Il pleut ; cependant, nous sortons. | イル・プルー・スペンダン・ヌー・ソルトン | 雨が降っている。しかし私たちは出かける。
Elle est jeune ; elle est pourtant très sage. | エ・レ・ジュヌ・エ・レ・プールタン・トレ・サージュ | 彼女は若い。それでもとても分別がある。
Il a beaucoup travaillé ; par conséquent, il a réussi. | イ・ラ・ボクー・トラヴァイエ・パール・コンセカン・イ・ラ・レユスィ | 彼はよく勉強した。その結果、合格した。
:::

## 3. 従位接続詞の土台 — que

すべての従位接続詞は **que** を含むか、que に還元できます（parce **que**、bien **que**、pour **que**、dès **que** …）。que 単独の用法をまず固めます。

### que が導く名詞節

**que + 節**は名詞のかたまりとして、主語・目的語・属詞になります。

:::ex que 節の3つの位置
Je sais qu'il viendra. | ジュ・セ・キル・ヴィヤンドラ | 彼が来ることを知っている。（目的語）
Qu'il vienne me surprend. | キル・ヴィエンヌ・ム・スュルプラン | 彼が来るとは驚きだ。（主語）
Le problème est qu'il ne veut pas. | ル・プロブレム・エ・キル・ヌ・ヴー・パ | 問題は彼が望まないことだ。（属詞）
:::

### que 節の法を決めるのは主節の動詞

**que 節が直説法になるか接続法になるかは、主節の動詞で決まります。** 第31章の内容を、原理から整理し直します。

| 主節の動詞のタイプ | 法 | 例 |
|---|---|---|
| **断定・思考・知覚**（事実として述べる） | **直説法** | dire, savoir, penser, croire, voir, espérer |
| **意志・願望・命令**（まだ実現していない） | **接続法** | vouloir, souhaiter, désirer, ordonner, exiger |
| **感情**（事実を評価する） | **接続法** | être content, regretter, avoir peur, s'étonner |
| **疑い・否定**（事実性を保留する） | **接続法** | douter, nier, ne pas croire |
| **必要・可能性の判断** | **接続法** | il faut, il est possible, il est important |

:::deep 感情の動詞がなぜ接続法なのか
「彼が来てうれしい」の「彼が来る」は事実なのに、なぜ接続法なのでしょうか。

Je suis content **qu'il vienne**.（× qu'il vient）

理由は、**感情の動詞にとって従属節の内容は「情報」ではなく「感情の対象」だから**です。話し手はその事実を伝えようとしているのではなく、それに対する自分の反応を述べています。事実そのものは前提として括弧に入れられ、前景に出てきません。

同じことは il est dommage que（残念だ）、c'est bizarre que（変だ）にも当てはまります。**「事実かどうか」ではなく「その節が何のために置かれているか」が法を決める**——これがフランス語の接続法の核心です。

対照的に、espérer（希望する）は**直説法**を取ります。

J'espère **qu'il viendra**.（彼が来ることを希望する）

願望なのに直説法という例外に見えますが、espérer は「そうなると見込んでいる」という**予測**に近く、話し手は実現を事実の側に置いています。souhaiter（接続法）が「そうあってほしい」という純粋な願望であるのと対照的です。
:::

:::warn penser / croire の否定形・疑問形
断定の動詞は直説法を取りますが、**否定形・疑問形になると事実性が揺らぐため接続法も可能**になります。

| 形 | 法 | 例 |
|---|---|---|
| 肯定 | 直説法 | Je pense **qu'il est** malade. |
| 否定 | 接続法（直説法も可） | Je ne pense pas **qu'il soit** malade. |
| 疑問（倒置） | 接続法（直説法も可） | Pensez-vous **qu'il soit** malade ? |

接続法にすると「そうは思わない」という**話し手の距離**が強く出ます。直説法のままだと、事実として認めたうえで自分は思わない、という含みになります。話し言葉では直説法が優勢です。
:::

## 4. 意味カテゴリ別の従属節 — 全体系

ここからが本章の中心です。従属節を意味で7つに分け、**それぞれの接続詞と取る法**を確定させます。

### （1）時 — quand, lorsque, avant que …

| 接続詞 | 意味 | 法 |
|---|---|---|
| **quand** / **lorsque** | 〜のとき | **直説法** |
| **dès que** / **aussitôt que** | 〜するとすぐ | **直説法** |
| **pendant que** | 〜している間 | **直説法** |
| **tandis que** | 〜する一方で | **直説法** |
| **depuis que** | 〜して以来 | **直説法** |
| **après que** | 〜した後で | **直説法**（規範） |
| **une fois que** | いったん〜すると | **直説法** |
| **chaque fois que** | 〜するたびに | **直説法** |
| **avant que** | 〜する前に | **接続法** |
| **jusqu'à ce que** | 〜するまで | **接続法** |
| **en attendant que** | 〜するまでの間 | **接続法** |

**時の接続詞のほとんどは直説法**です。接続法を取るのは **avant que / jusqu'à ce que / en attendant que** の3つだけで、共通点は**「まだ起きていないこと」を指す**点です。

:::ex 時の従属節
Quand il arrivera, nous partirons. | カン・ティ・ラリヴラ・ヌー・パルティロン | 彼が着いたら、私たちは出発します。
Dès que j'ai fini, je t'appelle. | デ・ク・ジェ・フィニ・ジュ・タペル | 終わったらすぐ電話する。
Pendant qu'il dormait, j'ai lu. | パンダン・キル・ドルメ・ジェ・リュ | 彼が眠っている間、私は読書した。
Attendez avant qu'il soit trop tard. | アタンデ・アヴァン・キル・ソワ・トロ・タール | 手遅れになる前に待ってください。
Je resterai jusqu'à ce qu'il revienne. | ジュ・レストレ・ジュスカ・ス・キル・ルヴィエンヌ | 彼が戻るまで残ります。
:::

:::warn quand の後は未来形 — 英語と違う
「彼が着いたら出発します」を英語では *When he arrives*（現在形）と言いますが、**フランス語は未来形**です。

- 仏 **Quand il arrivera**, nous partirons.
- 英 **When he arrives**, we will leave.

フランス語は時間関係を素直に時制で表します。従属節の出来事が未来なら未来形、それが主節より前に完了しているなら**前未来**を使います。

- **Quand il sera arrivé**, nous partirons.（彼が着いてしまったら出発する）

同じことが dès que, aussitôt que, tant que, une fois que にも当てはまります。**英語の「時・条件の副詞節では未来形を使わない」という規則は、フランス語には存在しません。**
:::

:::deep après que は直説法か接続法か — 揺れている接続詞
規範文法では **après que は直説法**です。「〜した後で」は起きた事実だからです。

Après qu'il **est** parti, j'ai fermé la porte.（規範）

しかし実際には接続法が非常によく使われます（Après qu'il **soit** parti …）。avant que が接続法を取ることに引きずられた類推です。

現代の文法書はこの用法を「広く行われているが規範的には誤り」と扱います。**書くときは直説法**を選んでください。読むときはどちらも現れると知っておけば足ります。

言語は規則の対称性を求めて変化します。avant que / après que という対をなす接続詞が、片方だけ違う法を取るのは不安定なので、揃う方向に動いている——というのが変化の内実です。
:::

### （2）原因 — parce que, puisque, comme …

| 接続詞 | 意味 | 法 | ニュアンス |
|---|---|---|---|
| **parce que** | 〜だから | **直説法** | 中立。原因を新情報として提示 |
| **puisque** | 〜なのだから | **直説法** | 相手も知っている前提から論じる |
| **comme** | 〜なので | **直説法** | 必ず文頭に置く |
| **étant donné que** | 〜であるから | **直説法** | 改まった言い方 |
| **vu que** | 〜だから | **直説法** | 話し言葉 |
| **du moment que** | 〜である以上 | **直説法** | 条件寄り |
| **ce n'est pas que** | 〜だからではない | **接続法** | 原因の否定 |
| **non que** | 〜だからではなく | **接続法** | 文語 |

**原因は事実なので直説法**——例外は「その原因を否定する」ときだけで、否定された原因は事実でないので接続法になります。原理どおりです。

:::ex 原因の従属節
Je reste parce qu'il pleut. | ジュ・レスト・パルス・キル・プルー | 雨が降っているので残ります。
Puisque tu le sais, explique-moi. | ピュイスク・チュ・ル・セ・エクスプリック・モワ | 君は知っているのだから、説明して。
Comme il était tard, nous sommes rentrés. | コム・イ・レテ・タール・ヌー・ソム・ラントレ | 遅かったので、私たちは帰った。
Ce n'est pas qu'il soit bête, il est distrait. | ス・ネ・パ・キル・ソワ・ベット・イ・レ・ディストレ | 彼が愚かなのではなく、うっかりしているのだ。
:::

:::note parce que と puisque の使い分け
- **parce que** — 聞き手が知らない原因を**新情報として**伝える。「なぜ？」への答えになる
- **puisque** — 聞き手も知っている事柄を**前提として**持ち出し、そこから結論を導く

Pourquoi tu ne viens pas ? — **Parce que** je suis fatigué.（○）
Pourquoi tu ne viens pas ? — **Puisque** je suis fatigué.（×）

puisque は答えになりません。「疲れているのは君も知っているだろう」という前提の提示だからです。

**comme** は必ず文頭に置き、後ろに主節が来ます。文の途中には置けません（× Nous sommes rentrés comme il était tard）。
:::

### （3）目的 — pour que, afin que …

| 接続詞 | 意味 | 法 |
|---|---|---|
| **pour que** | 〜するために | **接続法** |
| **afin que** | 〜するために（改まった） | **接続法** |
| **de sorte que** | 〜するように（目的） | **接続法** |
| **de peur que** / **de crainte que** | 〜しないように | **接続法**（+ 虚辞の ne） |
| **de manière que** / **de façon que** | 〜するように | **接続法** |

**目的はすべて接続法**です。目的とは「これから実現させたいこと」であり、まだ事実ではないからです。例外はありません。

:::ex 目的の従属節
Je parle lentement pour que tu comprennes. | ジュ・パルル・ラントマン・プール・ク・チュ・コンプレンヌ | 君が分かるようにゆっくり話す。
Il travaille afin que ses enfants réussissent. | イル・トラヴァイユ・アファン・ク・セ・ザンファン・レユスィス | 子どもたちが成功するように彼は働く。
Parle bas de peur qu'on ne t'entende. | パルル・バ・ドゥ・プー・コン・ヌ・タンタンド | 聞かれないように小声で話しなさい。
:::

### （4）結果 — si bien que, tellement que …

| 接続詞 | 意味 | 法 |
|---|---|---|
| **si bien que** | その結果〜 | **直説法** |
| **de sorte que** | その結果〜（結果） | **直説法** |
| **tellement … que** / **si … que** | あまりに〜なので | **直説法** |
| **tant … que** | あまりに〜なので | **直説法** |
| **au point que** | 〜するほどまでに | **直説法** |

**結果は実際に起きたことなので直説法**です。

:::warn de sorte que は法で意味が変わる
同じ接続詞が、**接続法なら目的、直説法なら結果**になります。

- Il a parlé fort **de sorte que tout le monde entende**.（みんなに聞こえる**ように**話した）→ 接続法＝**目的**
- Il a parlé fort **de sorte que tout le monde a entendu**.（大声で話した**ので**みんなに聞こえた）→ 直説法＝**結果**

**法の選択が意味を決める**、最も鮮やかな例です。目的（まだ実現していない）と結果（実現した）の違いが、そのまま接続法と直説法の違いに対応しています。この章の冒頭に述べた原理が、1つの接続詞の中で対立しているのを見ることができます。

de manière que / de façon que も同じ二重性を持ちます。
:::

:::ex 結果の従属節
Il pleuvait si fort que nous sommes restés. | イル・プルヴェ・スィ・フォール・ク・ヌー・ソム・レステ | あまりに激しく雨が降ったので残った。
Elle a tant travaillé qu'elle est tombée malade. | エ・ラ・タン・トラヴァイエ・ケ・レ・トンベ・マラッド | 働きすぎて病気になった。
Il était tellement fatigué qu'il s'est endormi. | イ・レテ・テルマン・ファティゲ・キル・セ・タンドルミ | あまりに疲れて眠り込んでしまった。
:::

### （5）譲歩・対立 — bien que, même si …

| 接続詞 | 意味 | 法 |
|---|---|---|
| **bien que** | 〜だけれども | **接続法** |
| **quoique** | 〜だけれども | **接続法** |
| **encore que** | 〜ではあるが | **接続法** |
| **sans que** | 〜することなしに | **接続法** |
| **même si** | たとえ〜でも | **直説法** |
| **alors que** | 〜であるのに | **直説法** |
| **tandis que** | 〜する一方で | **直説法** |
| **quel que soit** | 〜がどうであれ | **接続法** |
| **qui que**, **quoi que**, **où que** | 誰が／何が／どこで〜しようと | **接続法** |
| **si … que** | どんなに〜でも | **接続法** |

:::ex 譲歩の従属節
Bien qu'il soit malade, il travaille. | ビヤン・キル・ソワ・マラッド・イル・トラヴァイユ | 病気なのに彼は働いている。
Même s'il pleut, je sortirai. | メーム・スィル・プルー・ジュ・ソルティレ | たとえ雨でも出かけます。
Quoi que tu fasses, je te soutiendrai. | コワ・ク・チュ・ファス・ジュ・トゥ・スティヤンドレ | 何をしようと君を支える。
Quelle que soit ta décision, je l'accepte. | ケル・ク・ソワ・タ・デスィズィヨン・ジュ・ラクセプト | 君の決断がどうであれ受け入れる。
Il est sorti sans que je le voie. | イ・レ・ソルティ・サン・ク・ジュ・ル・ヴォワ | 私が見ないうちに彼は出て行った。
:::

:::warn quoique と quoi que — 1文字空けるだけで別語
- **quoique**（1語）= bien que「〜だけれども」
- **quoi que**（2語）= 「何を〜しようとも」

どちらも接続法を取るので、法では区別できません。意味で判断します。

- **Quoiqu'**il soit riche, il est modeste.（金持ちだが謙虚だ）
- **Quoi qu'**il fasse, il réussit.（何をしても成功する）

同じ型に **quelque … que**（どんなに〜でも）、**qui que**（誰であろうと）、**où que**（どこであろうと）があります。**疑問詞 + que + 接続法**で「〜であろうと」を表す一群です。

**quel que** は特殊で、後ろに直接 être の接続法が来て、**quel が主語に性数一致します**：**Quelles que soient** tes raisons …（君の理由がどうであれ）。
:::

:::deep bien que と même si — 事実か仮定か
どちらも「〜でも」と訳せますが、事実性が違います。

- **Bien qu'**il **soit** malade, il travaille.（病気**である**が働く）→ 病気なのは**事実**。接続法
- **Même s'**il **est** malade, il travaillera.（病気**であっても**働くだろう）→ 病気かどうかは**未確定**。直説法

法と事実性が**逆転して見える**のがこの対です。事実である bien que が接続法を取り、仮定である même si が直説法を取ります。

理由は、bien que の節が「その事実を認めたうえで括弧に入れる」働きをするからです。認めるが前景には出さない——この「括弧に入れる」操作が接続法を呼びます。一方 même si は si（条件）の仲間で、si は歴史的に直説法を取り続けてきました（§5）。

**「事実かどうか」ではなく「その節が主節に対してどう働くか」で法が決まる**——§3の deep で述べた原理が、ここでも効いています。
:::

### （6）条件・仮定 — si, à condition que …

| 接続詞 | 意味 | 法 |
|---|---|---|
| **si** | もし〜なら | **直説法**（例外） |
| **à condition que** | 〜という条件で | **接続法** |
| **pourvu que** | 〜でありさえすれば | **接続法** |
| **à moins que** | 〜でない限り | **接続法**（+ 虚辞の ne） |
| **en admettant que** | 〜と仮定して | **接続法** |
| **au cas où** | 〜の場合には | **条件法** |
| **soit que … soit que** | 〜であれ〜であれ | **接続法** |

:::warn si だけが直説法 — 最大の例外
仮定は事実でないので接続法になりそうですが、**si は直説法**を取ります。フランス語で最も有名な例外です。

歴史的な理由があります。ラテン語では si の節に接続法を使いましたが、フランス語では **si 自身が仮定を表す**ため、法で重ねて示す必要がなくなりました。接続詞が意味を担い、動詞は法を担わなくなった——役割分担が進んだ結果です。

さらに重要な制約があります。**si の直後には未来形も条件法も置けません。**

- × Si tu **viendras**, … → ○ Si tu **viens**, …
- × Si j'**aurais** de l'argent, … → ○ Si j'**avais** de l'argent, …

この2つは日本語話者・英語話者ともに最頻出の誤りです。
:::

### si の3つの型（第30章の復習）

| 型 | si 節 | 主節 | 意味 |
|---|---|---|---|
| **1. 実現しうる仮定** | si + **現在** | **未来** | Si tu viens, je serai content. |
| **2. 現在の反実仮想** | si + **半過去** | **条件法現在** | Si j'étais riche, je voyagerais. |
| **3. 過去の反実仮想** | si + **大過去** | **条件法過去** | Si j'avais su, je serais venu. |

:::ex si の3つの型
Si tu viens, je serai content. | スィ・チュ・ヴィヤン・ジュ・スレ・コンタン | 君が来れば、私はうれしい。
Si j'étais riche, je voyagerais. | スィ・ジェテ・リッシュ・ジュ・ヴォワヤジュレ | 金持ちなら旅行するのに。
Si j'avais su, je serais venu. | スィ・ジャヴェ・スュ・ジュ・スレ・ヴニュ | 知っていたら来たのに。
:::

:::deep si の3つの意味 — 条件だけではない
si は3つの別々の働きを持ちます。**間接疑問の si では未来形が使えます**——「si の後に未来形を置かない」という規則は条件の si に限った話だからです。

| 用法 | 例 | 未来形 |
|---|---|---|
| **条件** | **Si** tu viens, je serai content. | **不可** |
| **間接疑問**（〜かどうか） | Je ne sais pas **s'il viendra**. | **可** |
| **譲歩**（〜だけれども） | **S'il** est riche, il n'est pas heureux. | — |

この区別は試験で狙われます。**「〜かどうか」と訳せるなら間接疑問なので、未来形も条件法も置けます。**

なお si + il は **s'il** とエリジオンしますが、si + elle は **si elle**（エリジオンしない）です。si がエリジオンするのは il / ils の前だけという、細かいが確実な規則があります。
:::

### （7）様態・比較

| 接続詞 | 意味 | 法 |
|---|---|---|
| **comme** | 〜のように | **直説法** |
| **ainsi que** / **de même que** | 〜と同じく | **直説法** |
| **comme si** | まるで〜のように | **半過去 / 大過去** |
| **autant que** | 〜と同じだけ | **直説法** |
| **plus … plus** | 〜すればするほど | **直説法** |
| **selon que** / **suivant que** | 〜かどうかによって | **直説法** |

:::warn comme si の後は必ず半過去か大過去
「まるで〜のように」の comme si は、**現在形も未来形も取りません**。

- 同時 → **半過去**：Il parle **comme s'il savait** tout.（彼は何でも知っているかのように話す）
- 先行 → **大過去**：Il parle **comme s'il avait tout vu**.（すべて見たかのように話す）

条件の si と同じ制約（未来形・条件法を置けない）に加えて、**現在形も置けない**のが comme si の特徴です。「事実に反する」ことが前提なので、常に反実仮想の時制になります。
:::

:::ex 様態・比較の従属節
Fais comme tu veux. | フェ・コム・チュ・ヴー | 好きなようにしなさい。
Il parle comme s'il savait tout. | イル・パルル・コム・スィル・サヴェ・トゥ | 彼は何でも知っているかのように話す。
Plus je travaille, plus je comprends. | プリュ・ジュ・トラヴァイユ・プリュ・ジュ・コンプラン | 働けば働くほど分かってくる。
Cela dépend selon qu'il pleut ou non. | スラ・デパン・スロン・キル・プルー・ウ・ノン | 雨が降るかどうかによる。
:::

## 5. 虚辞の ne — 否定ではない ne

いくつかの接続詞・動詞の後で、**否定の意味を持たない ne** が現れます。これを**虚辞の ne（le ne explétif）**と呼びます。

| 現れる場所 | 例 |
|---|---|
| **avant que** | avant qu'il **ne** parte（彼が発つ前に） |
| **à moins que** | à moins qu'il **ne** pleuve（雨が降らない限り） |
| **de peur que / de crainte que** | de peur qu'il **ne** tombe（転ばないように） |
| **craindre que / avoir peur que** | Je crains qu'il **ne** vienne.（彼が来るのが心配だ） |
| **empêcher que / éviter que** | empêcher qu'il **ne** parte |
| **比較級の後** | Il est plus grand que je **ne** pensais. |

:::warn 虚辞の ne は訳さない
**Je crains qu'il ne vienne.** は「彼が来ないのが心配だ」ではなく、**「彼が来るのが心配だ」**です。ne があっても否定になりません。

本当に否定したいときは **ne … pas** を使います。

- Je crains qu'il **ne** vienne.（彼が**来る**のが心配だ）
- Je crains qu'il **ne** vienne **pas**.（彼が**来ない**のが心配だ）

pas があるかどうかが、否定かどうかの唯一の目印です。

虚辞の ne は**現代の話し言葉ではほぼ省略されます**。書き言葉や改まった場面で現れるので、**読むときに気づけること**が第一の目標です。自分で書くときは、付けても付けなくても誤りにはなりません。
:::

:::deep 虚辞の ne はどこから来たのか
craindre（恐れる）、empêcher（妨げる）、avant que（〜の前に）に共通するのは、**「そうならないでほしい」という否定的な志向**です。

- 「彼が来るのが心配だ」＝「彼に来てほしくない」
- 「彼が発つ前に」＝「彼がまだ発っていないうちに」

つまり ne は、文の**意味の底にある否定の気持ち**を写しています。文法上の否定ではなく、話し手の態度の痕跡です。かつては本物の否定だったものが、意味を失って形だけ残った——文法化の典型例です。

比較級の後の ne も同じで、**Il est plus grand que je ne pensais.**（思っていたより背が高い）は「思っていたほどではない」という含みの名残です。
:::

## 6. 従属節を不定詞に縮約する

**主節と従属節の主語が同じとき、接続詞 + 接続法は使えず、前置詞 + 不定詞に変えなければなりません。** これは選択ではなく義務です。

| 接続詞（主語が違う） | 前置詞 + 不定詞（主語が同じ） |
|---|---|
| **pour que** + 接続法 | **pour** + 不定詞 |
| **afin que** + 接続法 | **afin de** + 不定詞 |
| **avant que** + 接続法 | **avant de** + 不定詞 |
| **à moins que** + 接続法 | **à moins de** + 不定詞 |
| **de peur que** + 接続法 | **de peur de** + 不定詞 |
| **sans que** + 接続法 | **sans** + 不定詞 |
| **à condition que** + 接続法 | **à condition de** + 不定詞 |
| **après que** + 直説法 | **après** + 不定詞過去 |

:::ex 主語が同じなら不定詞に
Je travaille pour réussir. | ジュ・トラヴァイユ・プール・レユスィール | 成功するために働く。（主語が同じ）
Je travaille pour que mes enfants réussissent. | ジュ・トラヴァイユ・プール・ク・メ・ザンファン・レユスィス | 子どもが成功するように働く。（主語が違う）
Il est parti avant de manger. | イ・レ・パルティ・アヴァン・ドゥ・マンジェ | 彼は食べる前に出て行った。
Il est parti avant que je mange. | イ・レ・パルティ・アヴァン・ク・ジュ・マンジュ | 私が食べる前に彼は出て行った。
Après avoir mangé, il est sorti. | アプレ・ザヴォワール・マンジェ・イ・レ・ソルティ | 食べた後、彼は出かけた。
:::

× Je travaille **pour que je réussisse**. は誤りです。**同じ主語で接続詞節を使うことはできません。**

:::note なぜ縮約が義務なのか
接続法は「主語が違う」という情報を含んで働きます。主語が同じなら、わざわざ節を立てて主語をくり返す必要がありません。フランス語は**同じことを2度言わない**方向に規則を固めた、と考えると理解しやすくなります。

なお **parce que** や **bien que** には対応する不定詞構文がないので、主語が同じでも接続詞節のままです。

- Bien qu'il soit fatigué, il travaille.（主語が同じでも接続法節）

不定詞への縮約ができるのは、**対応する前置詞を持つ接続詞に限られます**。
:::

## 7. que の反復 — 2つ目の従属節

同じ接続詞で従属節を2つ並べるとき、**2つ目は que だけで受けます**。接続詞をくり返しません。

:::ex que による受け直し
Bien qu'il soit tard et qu'il pleuve, je sors. | ビヤン・キル・ソワ・タール・エ・キル・プルーヴ・ジュ・ソール | 遅いし雨も降っているが、出かける。
Comme il était tard et que j'étais fatigué, je suis rentré. | コム・イ・レテ・タール・エ・ク・ジェテ・ファティゲ・ジュ・スュイ・ラントレ | 遅かったし疲れていたので帰った。
:::

**法は元の接続詞のものを引き継ぎます**（bien que なら que 節も接続法、comme なら直説法）。

:::warn si の反復は que + 接続法
si だけは特殊で、2つ目を que で受けると**接続法**になります。

**Si** tu viens et **que** tu **sois** libre, on dînera ensemble.（君が来て、しかも暇なら、一緒に夕食をとろう）

si 自体は直説法を取るのに、受け直した que 節は接続法——一貫していません。que という接続詞そのものが接続法と結びつきやすいためです。現代語では直説法（que tu es libre）も広く使われます。
:::

## 8. 従属節と時制の一致

主節が過去のとき、従属節の時制がずれます。第27.6章（話法と時制の一致）で扱った規則が、あらゆる従属節に適用されます。

| 主節が現在 | 主節が過去 |
|---|---|
| 現在 → **現在** | 現在 → **半過去** |
| 複合過去 → **複合過去** | 複合過去 → **大過去** |
| 単純未来 → **単純未来** | 単純未来 → **条件法現在** |

:::ex 時制の一致
Il dit qu'il est malade. | イル・ディ・キ・レ・マラッド | 彼は病気だと言っている。
Il a dit qu'il était malade. | イ・ラ・ディ・キ・レテ・マラッド | 彼は病気だと言った。
Il dit qu'il viendra. | イル・ディ・キル・ヴィヤンドラ | 彼は来ると言っている。
Il a dit qu'il viendrait. | イ・ラ・ディ・キル・ヴィヤンドレ | 彼は来ると言った。
:::

:::note 接続法には時制の一致がほぼ働かない
現代フランス語では、**主節が過去でも従属節の接続法は現在形のまま**です。

- Je voulais qu'il **vienne**.（彼に来てほしかった）→ 接続法**現在**

規範的には接続法半過去（qu'il vînt）を使うところですが、この形は文語にしか残っていません（第31章）。**接続法は現在と過去の2つだけ使う**——これが現代語の実態です。
:::

## 9. よくある誤りのまとめ

:::warn 日本語話者がやりがちな10の誤り
| × | ○ | 理由 |
|---|---|---|
| Si tu viendras, … | **Si tu viens**, … | 条件の si の後に未来形は置けない（§4-6） |
| Si j'aurais de l'argent, … | **Si j'avais** de l'argent, … | si の後に条件法は置けない（§4-6） |
| Quand il arrive, nous partirons. | **Quand il arrivera**, … | 時の節でも未来形を使う（§4-1） |
| Je travaille pour que je réussisse. | Je travaille **pour réussir**. | 主語が同じなら不定詞に縮約（§6） |
| Bien qu'il est malade, … | Bien qu'il **soit** malade, … | bien que は接続法（§4-5） |
| Parce qu'il soit malade, … | Parce qu'il **est** malade, … | parce que は直説法（§4-2） |
| Pourquoi ? — Puisque je suis fatigué. | — **Parce que** je suis fatigué. | puisque は答えにならない（§4-2） |
| Il ne boit pas ni vin ni bière. | Il **ne** boit **ni** vin **ni** bière. | ni は pas と併用しない（§2） |
| Je crains qu'il ne vienne.（来ないのが心配） | Je crains qu'il **ne vienne pas**. | 虚辞の ne は否定ではない（§5） |
| Il parle comme s'il sait tout. | comme s'il **savait** tout | comme si は半過去か大過去（§4-7） |
:::
